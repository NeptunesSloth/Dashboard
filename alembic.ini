# Alembic config for the MayBot Control Center persistence layer.
#
# The database URL is NOT hard-coded here. It is resolved at runtime from the
# MAYBOT_DB environment variable by alembic/env.py (file path -> sqlite URL,
# or a postgres:// / postgresql:// URL passed through). See docs/MIGRATIONS.md.
#
# Alembic is an ops/dev tool and is intentionally NOT in requirements.txt:
#   pip install alembic
#   MAYBOT_DB=/path/to/maybot.db alembic upgrade head

[alembic]
# Path to migration scripts (relative to this file).
script_location = alembic

# Template used to generate migration file names.
file_template = %%(rev)s_%%(slug)s

# Leave sqlalchemy.url blank — env.py supplies it from MAYBOT_DB.
sqlalchemy.url =

[post_write_hooks]

# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
