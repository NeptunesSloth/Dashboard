# Verified, named attack chains. Each step cites a technique id above; the chain
# is the ground truth a generated scenario's logic is checked against.
ad_chains:
  - id: chain-kerberoast-to-da
    name: Kerberoast → crack → lateral → DCSync
    steps:
      - {technique: T1046, desc: "Enumerate the domain; find SPNs / service accounts."}
      - {technique: T1558.003, desc: "Kerberoast: request service tickets for SPN accounts."}
      - {technique: T1110, desc: "Crack the extracted TGS hashes offline."}
      - {technique: T1021.002, desc: "Use the cracked service-account creds to move laterally over SMB."}
      - {technique: T1003, desc: "Dump credentials on a privileged host."}
      - {technique: T1207, desc: "DCSync the domain to obtain the krbtgt / target hashes."}
      - {technique: T1558.001, desc: "Forge a golden ticket for durable domain persistence."}
  - id: chain-asrep-to-lateral
    name: AS-REP roast → crack → valid accounts → lateral
    steps:
      - {technique: T1558.004, desc: "AS-REP roast accounts without Kerberos pre-auth."}
      - {technique: T1110, desc: "Crack the AS-REP hashes."}
      - {technique: T1078, desc: "Authenticate with the recovered valid account."}
      - {technique: T1021, desc: "Move laterally with the account's rights."}

