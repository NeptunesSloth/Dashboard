# canonical.yaml — the VERIFIED knowledge base that anchors all generated
# security content. Nothing the learner sees should reference a technique, CVE,
# weakness or control that does not resolve here (or in an operator overlay set
# via MAYBOT_KNOWLEDGE_FILE). This is a curated SEED — extend/refresh it from the
# authoritative sources below. IDs are the real, citable identifiers.
#
# Sources: MITRE ATT&CK (techniques), MITRE CVE (cves), OWASP Top 10 2021
# (owasp), NIST SP 800-53 Rev.5 (nist). See knowledge.py for the loader.

