  # ───────────────────────────────────────────────────────────────── 18
  - id: zh1-18
    title: "Asking questions and getting unstuck"
    goal: "I can say I don't understand, ask for repetition and help, and ask why and how."
    notes: |
      These are the phrases that keep a conversation alive when your Chinese runs out. Learn them until they are automatic.

      | | | |
      |---|---|---|
      | 我听不懂。 | Wǒ tīng bu dǒng. | I don't understand (what I hear). |
      | 请再说一遍。 | Qǐng zài shuō yí biàn. | Please say it again. |
      | 请说慢一点儿。 | Qǐng shuō màn yìdiǎnr. | Please speak more slowly. |
      | …是什么意思？ | … shì shénme yìsi? | What does … mean? |
      | …怎么说？ | … zěnme shuō? | How do you say …? |

      ## 听不懂
      Literally "listen, not understand": you hear the words but cannot follow them. The 不 in the middle is neutral. For writing it is 看不懂. When it finally clicks: 我明白了 or 我懂了 ("now I understand", with the new-situation 了).

      ## Two kinds of knowing
      **知道** is knowing a fact (我不知道). **认识** is knowing a person or recognising a character (我不认识这个字).

      ## How and why
      - **怎么** + verb asks *how*: 怎么说？ 怎么走？ 怎么写？
      - **为什么** asks *why*, and the answer starts with **因为** (because).

      ## Asking for help
      你能帮我吗？ (Can you help me?) **帮** takes the person directly. 没问题 ("no problem") is the cheerful reply.

      一遍 is "one time through": 一 is *yí* before the fourth tone of biàn.
    items:
      - {id: zh1-18-g-dong, type: glyph, l2: "懂", rom: "dǒng", l1: "to understand", note: "The heart part 忄 on the left: understanding happens there."}
      - {id: zh1-18-g-man, type: glyph, l2: "慢", rom: "màn", l1: "slow", note: "The heart part 忄 again."}
      - {id: zh1-18-g-zhi, type: glyph, l2: "知", rom: "zhī", l1: "first half of zhīdào (to know)"}
      - {id: zh1-18-g-dao, type: glyph, l2: "道", rom: "dào", l1: "way, road (second half of zhīdào)", note: "Same sound as 到 (to arrive)."}
      - {id: zh1-18-g-bang, type: glyph, l2: "帮", rom: "bāng", l1: "to help"}
      - {id: zh1-18-zhidao, type: vocab, l2: "知道", rom: "zhīdào", l1: "to know (a fact)", alt: ["zhīdao"], ex: "我知道他是谁。", ex_l1: "Wǒ zhīdào tā shì shéi. — I know who he is."}
      - {id: zh1-18-mingbai, type: vocab, l2: "明白", rom: "míngbai", l1: "to understand, to be clear about", ex: "我明白了。", ex_l1: "Wǒ míngbai le. — Now I understand."}
      - {id: zh1-18-yisi, type: vocab, l2: "意思", rom: "yìsi", l1: "meaning", ex: "我不知道这个字的意思。", ex_l1: "Wǒ bù zhīdào zhège zì de yìsi. — I don't know the meaning of this character."}
      - {id: zh1-18-weishenme, type: vocab, l2: "为什么", rom: "wèi shénme", l1: "why", ex: "你为什么学汉语？", ex_l1: "Nǐ wèi shénme xué Hànyǔ? — Why are you learning Chinese?"}
      - {id: zh1-18-yinwei, type: vocab, l2: "因为", rom: "yīnwèi", l1: "because", ex: "因为我喜欢中国。", ex_l1: "Yīnwèi wǒ xǐhuan Zhōngguó. — Because I like China."}
      - {id: zh1-18-zenme, type: vocab, l2: "怎么", rom: "zěnme", l1: "how (in what way)", ex: "这个字怎么写？", ex_l1: "Zhège zì zěnme xiě? — How do you write this character?"}
      - {id: zh1-18-wenti, type: vocab, l2: "问题", rom: "wèntí", l1: "question; problem", ex: "我有一个问题。", ex_l1: "Wǒ yǒu yí ge wèntí. — I have a question.", note: "没问题 (méi wèntí) = no problem."}
      - {id: zh1-18-tingbudong, type: phrase, l2: "我听不懂。", rom: "Wǒ tīng bu dǒng.", l1: "I don't understand (what you are saying).", alt: ["我没听懂。", "我不懂。", "听不懂。"]}
      - {id: zh1-18-zaishuoyibian, type: phrase, l2: "请再说一遍。", rom: "Qǐng zài shuō yí biàn.", l1: "Please say it again.", alt: ["请您再说一遍。", "请你再说一遍。", "请再说一次。"]}
      - {id: zh1-18-manyidianr, type: phrase, l2: "请说慢一点儿。", rom: "Qǐng shuō màn yìdiǎnr.", l1: "Please speak a little more slowly.", alt: ["请慢一点儿说。", "请说慢一点。", "请慢一点儿。", "请您说慢一点儿。"]}
      - {id: zh1-18-zenmeshuo, type: phrase, l2: "这个用汉语怎么说？", rom: "Zhège yòng Hànyǔ zěnme shuō?", l1: "How do you say this in Chinese?", alt: ["这个汉语怎么说？", "这个用中文怎么说？", "这个中文怎么说？"]}
      - {id: zh1-18-shenmeyisi, type: phrase, l2: "这是什么意思？", rom: "Zhè shì shénme yìsi?", l1: "What does this mean?", alt: ["这个是什么意思？", "这个字是什么意思？", "什么意思？"]}
      - {id: zh1-18-bangwo, type: phrase, l2: "你能帮我吗？", rom: "Nǐ néng bāng wǒ ma?", l1: "Can you help me?", alt: ["您能帮我吗？", "你可以帮我吗？", "你能帮我一下吗？", "你能帮帮我吗？"]}
      - {id: zh1-18-c1, type: cloze, text: "你___不吃肉？", answer: "为什么", alt: ["wèi shénme", "wèishénme"], l1: "Why don't you eat meat?", note: "为什么 goes before the verb, after the subject."}
      - {id: zh1-18-c2, type: cloze, text: "对不起，我不___洗手间在哪儿。", answer: "知道", alt: ["zhīdào", "zhīdao"], l1: "Sorry, I don't know where the toilet is.", note: "Knowing a fact is 知道; 认识 is for people and characters."}
      - id: zh1-18-d1
        type: dialogue
        title: "Lost for words in a shop"
        scene: "A shop assistant speaks to you quickly and you miss it."
        you: B
        lines:
          - {who: A, l2: "您好！您要买点儿什么？", rom: "Nín hǎo! Nín yào mǎi diǎnr shénme?", l1: "Hello! What would you like to buy?"}
          - {who: B, l2: "对不起，我听不懂。", rom: "Duìbuqǐ, wǒ tīng bu dǒng.", l1: "Sorry, I don't understand.", alt: ["对不起，我没听懂。", "不好意思，我听不懂。", "对不起，我不懂。"]}
          - {who: A, l2: "您会说汉语吗？", rom: "Nín huì shuō Hànyǔ ma?", l1: "Do you speak Chinese?"}
          - {who: B, l2: "会一点儿。请说慢一点儿。", rom: "Huì yìdiǎnr. Qǐng shuō màn yìdiǎnr.", l1: "A little. Please speak more slowly.", alt: ["我会一点儿。请说慢一点儿。", "会一点儿。请慢一点儿说。", "会一点儿。请您说慢一点儿。", "会说一点儿。请说慢一点儿。"]}
          - {who: A, l2: "好。您想买什么？", rom: "Hǎo. Nín xiǎng mǎi shénme?", l1: "All right. What would you like to buy?"}
          - {who: B, l2: "我明白了，谢谢！我想买水。", rom: "Wǒ míngbai le, xièxie! Wǒ xiǎng mǎi shuǐ.", l1: "Now I understand, thank you! I'd like to buy water.", alt: ["我懂了，谢谢！我想买水。", "我明白了，谢谢！我要买水。", "我明白了，谢谢你！我想买水。"]}
          - {who: A, l2: "水在那儿，三块钱一瓶。", rom: "Shuǐ zài nàr, sān kuài qián yì píng.", l1: "The water is over there, three yuan a bottle."}
