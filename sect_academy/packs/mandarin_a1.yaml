          - {who: A, l2: "好的。您想喝什么？", rom: "Hǎo de. Nín xiǎng hē shénme?", l1: "Certainly. What would you like to drink?"}
          - {who: B, l2: "一杯茶，谢谢。", rom: "Yì bēi chá, xièxie.", l1: "A cup of tea, thank you.", alt: ["我要一杯茶，谢谢。", "我想喝一杯茶，谢谢。", "请给我一杯茶，谢谢。"]}
          - {who: A, l2: "还要别的吗？", rom: "Hái yào biéde ma?", l1: "Anything else?"}
