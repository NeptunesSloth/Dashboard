  # ───────────────────────────────────────────────────────────────── 5
  - id: zh1-05
    title: "Introducing yourself"
    goal: "I can give my name and nationality and ask someone for theirs."
    notes: |
      Two verbs give a name:

      - **姓** + surname: 我姓王。 (My surname is Wang.)
      - **叫** + full name or given name: 我叫王明。 (I'm called Wang Ming.)

      The polite way to ask a stranger's surname is 您贵姓？ (Nín guì xìng?).

      ## Question words stay in place
      English moves the question word to the front. Chinese leaves it exactly where the answer will be, and adds no 吗.

      | question | answer |
      |---|---|
      | 你叫**什么**名字？ | 我叫**安娜**。 |
      | 你是**哪**国人？ | 我是**美**国人。 |
      | 他是**谁**？ | 他是**我朋友**。 |

      So "You are called what name?", "You are which-country person?".

      ## Countries and nationalities
      Most country names end in 国 (country): 中国, 美国 (USA), 英国 (UK), 法国 (France), 德国 (Germany). Add 人 for the nationality: 美国人. Others are sound loans: 加拿大 (Jiānádà, Canada), 澳大利亚 (Àodàlìyà, Australia).

      ## Pleased to meet you
      认识你很高兴 is literally "knowing you, (I am) very glad". 很高兴认识你 means the same.

      什么 is said *shénme*: the second syllable is neutral.
