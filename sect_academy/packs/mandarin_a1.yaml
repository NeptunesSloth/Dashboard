  # ───────────────────────────────────────────────────────────────── 13
  - id: zh1-13
    title: "Shopping and money"
    goal: "I can ask a price, understand the answer, say it is too expensive and buy something."
    notes: |
      China's money is the 人民币 (rénmínbì). The unit is written **元** (yuán) on price tags, but everyone *says* **块** (kuài). A tenth of it is 毛 (máo).

      | | | |
      |---|---|---|
      | 5 | 五块 | wǔ kuài |
      | 20 | 二十块 | èrshí kuài |
      | 200 | 两百块 | liǎngbǎi kuài |
      | 250 | 两百五十块 | liǎngbǎi wǔshí kuài |

      钱 (money) may follow: 二十块钱. 200 can also be said 二百.

      ## How much?
      **多少** asks about any amount and needs no measure word: 多少钱？ Use 几 only for small numbers.

      ## This one, that one
      这 and 那 take a measure word, like a number: **这个** (this one), **那本**书 (that book), **这件**衣服 (this piece of clothing). 这个 is also said *zhèige*.

      | measure | for |
      |---|---|
      | 本 běn | books, notebooks |
      | 件 jiàn | clothes (tops), matters |

      ## Too …
      **太 … 了** = "too …!": 太贵了！ 太好了！ (great!). The negative drops 了 and softens it: 不太贵 (not very expensive).

      ## A little
      Adjective + **一点儿** = "a bit more …": 便宜一点儿 (a bit cheaper). Add 可以吗？ ("is that OK?") to turn anything into a request.
    items:
      - {id: zh1-13-g-mai, type: glyph, l2: "买", rom: "mǎi", l1: "to buy", note: "Third tone. With the fourth tone, mài (卖), it means 'to sell'."}
      - {id: zh1-13-g-qian, type: glyph, l2: "钱", rom: "qián", l1: "money", note: "The metal part 钅 on the left: coins."}
      - {id: zh1-13-g-kuai, type: glyph, l2: "块", rom: "kuài", l1: "yuan (as people say it); piece"}
      - {id: zh1-13-g-duo, type: glyph, l2: "多", rom: "duō", l1: "many, much"}
      - {id: zh1-13-g-shao, type: glyph, l2: "少", rom: "shǎo", l1: "few, little"}
      - {id: zh1-13-g-ben, type: glyph, l2: "本", rom: "běn", l1: "measure word for books"}
      - {id: zh1-13-duoshao, type: vocab, l2: "多少", rom: "duōshao", l1: "how much / how many", ex: "你们学校有多少学生？", ex_l1: "Nǐmen xuéxiào yǒu duōshao xuésheng? — How many students does your school have?", note: "'Many-few'. No measure word needed."}
      - {id: zh1-13-gui, type: vocab, l2: "贵", rom: "guì", l1: "expensive", ex: "咖啡很贵。", ex_l1: "Kāfēi hěn guì. — Coffee is expensive."}
      - {id: zh1-13-pianyi, type: vocab, l2: "便宜", rom: "piányi", l1: "cheap", ex: "这儿的水果很便宜。", ex_l1: "Zhèr de shuǐguǒ hěn piányi. — The fruit here is cheap."}
      - {id: zh1-13-dongxi, type: vocab, l2: "东西", rom: "dōngxi", l1: "thing, stuff", ex: "我去商店买东西。", ex_l1: "Wǒ qù shāngdiàn mǎi dōngxi. — I am going to the shop to buy things.", note: "'East-west'. 买东西 = to go shopping."}
      - {id: zh1-13-yifu, type: vocab, l2: "衣服", rom: "yīfu", l1: "clothes", ex: "我想买衣服。", ex_l1: "Wǒ xiǎng mǎi yīfu. — I'd like to buy clothes."}
      - {id: zh1-13-yijianyifu, type: vocab, l2: "一件衣服", rom: "yí jiàn yīfu", l1: "one piece of clothing", note: "件 is the measure word for clothes. 一 is yí before the fourth tone of jiàn."}
      - {id: zh1-13-zhege, type: vocab, l2: "这个", rom: "zhège", l1: "this one; this", alt: ["zhèige"], ex: "我要这个。", ex_l1: "Wǒ yào zhège. — I want this one.", note: "'That one' is 那个 (nàge)."}
      - {id: zh1-13-duoshaoqian, type: phrase, l2: "这个多少钱？", rom: "Zhège duōshao qián?", l1: "How much is this?", alt: ["这个多少钱一个？", "这多少钱？"]}
