  # ───────────────────────────────────────────────────────────────── 6
  - id: zh1-06
    title: "Family"
    goal: "I can say who is in my family and ask about someone else's."
    notes: |
      Chinese has no single word for "brother" or "sister": you must say whether they are **older or younger** than you.

      | | older | younger |
      |---|---|---|
      | brother | 哥哥 gēge | 弟弟 dìdi |
      | sister | 姐姐 jiějie | 妹妹 mèimei |

      Family words are doubled syllables, and the second one is neutral. Notice the **女** (woman) part in 姐, 妹 and 妈.

      ## How many?
      **几** asks "how many" when you expect a small number, and it needs a measure word just as a number does: 几个孩子？ → 两个孩子。

      Family members living together are counted with **口** (kǒu, "mouth"): 我家有四口人.

      ## 有 again
      我有一个哥哥。 / 我没有妹妹。 Remember: **两**个姐姐, not 二个.

      ## And
      **和** joins nouns and pronouns only: 爸爸和妈妈, 我和你. It never joins two sentences, so do not use it for every English "and".

      ## My family
      的 is normally left out with close relations: 我妈妈, 你哥哥, 他女儿. 我家 is "my home" or "my family".
    items:
