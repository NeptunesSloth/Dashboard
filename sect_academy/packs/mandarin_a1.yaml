        scene: "You are in a Chinese city and need the railway station. You stop a passer-by."
        you: A
        lines:
          - {who: A, l2: "请问，火车站在哪儿？", rom: "Qǐngwèn, huǒchēzhàn zài nǎr?", l1: "Excuse me, where is the railway station?", alt: ["请问，火车站在哪里？", "请问，火车站怎么走？", "火车站在哪儿？"]}
          - {who: B, l2: "在前面，医院的旁边。", rom: "Zài qiánmiàn, yīyuàn de pángbiān.", l1: "It's up ahead, next to the hospital."}
          - {who: A, l2: "远吗？", rom: "Yuǎn ma?", l1: "Is it far?", alt: ["远不远？", "火车站远吗？", "很远吗？"]}
          - {who: B, l2: "不远。一直往前走，在右边。", rom: "Bù yuǎn. Yìzhí wǎng qián zǒu, zài yòubian.", l1: "Not far. Go straight ahead; it's on the right."}
          - {who: A, l2: "谢谢您！", rom: "Xièxie nín!", l1: "Thank you! (polite)", alt: ["谢谢！", "谢谢你！", "好，谢谢您！"]}
          - {who: B, l2: "不客气。", rom: "Bú kèqi.", l1: "You're welcome."}

  # ───────────────────────────────────────────────────────────────── 11
  - id: zh1-11
    title: "Food and drink"
    goal: "I can name everyday food and drink and say what I eat and don't eat."
    notes: |
      Two verbs do most of the work: **吃** (to eat) and **喝** (to drink). Both have the mouth part **口** on the left. Soup is *drunk* in Chinese: 喝汤 (hē tāng).

      The basic sentence is **Subject + (time) + verb + object**, the same order as English:

      - 我吃米饭。 I eat rice.
      - 我早上喝咖啡。 I drink coffee in the morning.

      ## Saying no: 不
      **不** before the verb covers habits, refusals and the future: 我不吃肉 (I don't eat meat), 我不喝 (I won't have any). It keeps its fourth tone before chī and hē: *bù chī, bù hē*.

      ## Yes and no
      Chinese has no single word for "yes" or "no". Answer by repeating the verb:

      | question | yes | no |
      |---|---|---|
      | 你喝茶吗？ | 喝。 | 不喝。 |
      | 你吃肉吗？ | 吃。 | 不吃。 |

      ## Describing food
      **好** + verb means "good to …": 好吃 (tasty, of food), 好喝 (tasty, of drinks). As with 我很好, a describing word takes 很 and no 是: 这个菜**很**好吃.

      饭 is cooked rice and also "a meal": 吃饭 simply means "to eat, to have a meal". 菜 is a vegetable and also any cooked dish: 中国菜 = Chinese food.
    items:
      - {id: zh1-11-g-chi, type: glyph, l2: "吃", rom: "chī", l1: "to eat", note: "The mouth part 口."}
      - {id: zh1-11-g-he, type: glyph, l2: "喝", rom: "hē", l1: "to drink", note: "The mouth part 口 again. The e sounds like 'uh'."}
      - {id: zh1-11-g-fan, type: glyph, l2: "饭", rom: "fàn", l1: "meal; cooked rice", note: "The food part 饣 on the left."}
      - {id: zh1-11-g-cai, type: glyph, l2: "菜", rom: "cài", l1: "dish; vegetable", note: "c is 'ts'. The grass part 艹 on top marks plants."}
