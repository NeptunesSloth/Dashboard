  # ───────────────────────────────────────────────────────────────── 8
  - id: zh1-08
    title: "Telling the time"
    goal: "I can ask and tell the time and say when something happens."
    notes: |
      The clock uses three words: **点** (o'clock), **分** (minutes) and **半** (half).

      | | | |
      |---|---|---|
      | 3:00 | 三点 | sān diǎn |
      | 3:10 | 三点十分 | sān diǎn shí fēn |
      | 3:30 | 三点半 | sān diǎn bàn |
      | 2:00 | **两**点 | liǎng diǎn |

      Two o'clock is 两点, never 二点. Twelve is still 十二点.

      ## Parts of the day
      早上 (early morning) · 上午 (morning, before noon) · 中午 (noon) · 下午 (afternoon) · 晚上 (evening, night).

      **上** is "up / first part" and **下** is "down / second part", so 上午 and 下午 are the two halves of the day around 午, noon. The same pair gives 上个星期 (last week) and 下个星期 (next week).

      ## Big before small, again
      The part of the day comes **before** the clock time: 下午四点 = 4 p.m., 明天上午十点 = 10 a.m. tomorrow.

      ## Where the time goes
      A time word stands **before the verb**, straight after the subject or at the very start, never at the end:

      - 我们**四点**见。 We'll meet at four.
      - **明天**我没有时间。 Tomorrow I have no time.

      Ask with 几点 (what time) or 什么时候 (when).
    items:
      - {id: zh1-08-g-dian, type: glyph, l2: "点", rom: "diǎn", l1: "o'clock; dot"}
      - {id: zh1-08-g-fen, type: glyph, l2: "分", rom: "fēn", l1: "minute", note: "A knife (刀) dividing something: a division of the hour."}
      - {id: zh1-08-g-ban, type: glyph, l2: "半", rom: "bàn", l1: "half"}
