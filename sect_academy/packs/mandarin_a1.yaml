      - {id: zh1-13-c2, type: cloze, text: "我想___两本书。", answer: "买", alt: ["mǎi"], l1: "I'd like to buy two books.", note: "想 + verb. Books are counted with 本."}
      - id: zh1-13-d1
        type: dialogue
        title: "Bargaining at the market"
        scene: "You are at a clothes stall in a market, where prices are open to discussion."
        you: A
        lines:
          - {who: A, l2: "请问，这件衣服多少钱？", rom: "Qǐngwèn, zhè jiàn yīfu duōshao qián?", l1: "Excuse me, how much is this piece of clothing?", alt: ["这件衣服多少钱？", "请问，这件多少钱？", "你好，这件衣服多少钱？"]}
          - {who: B, l2: "三百块。", rom: "Sānbǎi kuài.", l1: "Three hundred yuan."}
          - {who: A, l2: "太贵了！便宜一点儿，可以吗？", rom: "Tài guì le! Piányi yìdiǎnr, kěyǐ ma?", l1: "Too expensive! A bit cheaper, OK?", alt: ["太贵了！可以便宜一点儿吗？", "太贵了！便宜一点儿吧。", "太贵了！便宜一点儿，好吗？"]}
          - {who: B, l2: "两百五十块，可以吗？", rom: "Liǎngbǎi wǔshí kuài, kěyǐ ma?", l1: "Two hundred and fifty, OK?"}
          - {who: A, l2: "两百块，我买两件。", rom: "Liǎngbǎi kuài, wǒ mǎi liǎng jiàn.", l1: "Two hundred, and I'll buy two.", alt: ["二百块，我买两件。", "两百块，我要两件。"]}
          - {who: B, l2: "好吧，两件四百块。", rom: "Hǎo ba, liǎng jiàn sìbǎi kuài.", l1: "All right, two for four hundred."}

  # ───────────────────────────────────────────────────────────────── 14
  - id: zh1-14
    title: "Likes and abilities: 喜欢, 会, 能, 可以"
    goal: "I can say what I like doing, what I can do, and ask permission."
    notes: |
      **喜欢** (to like) takes a noun or a whole verb phrase: 我喜欢茶。 我喜欢**喝**茶。 Make it stronger with 很: 我很喜欢.

      ## Three kinds of "can"
      English "can" splits into three verbs. All go before the main verb.

      | verb | meaning | example |
      |---|---|---|
      | 会 huì | know how to (a learned skill) | 我会说汉语。 |
      | 能 néng | be able to (circumstances allow) | 我明天不能来。 |
      | 可以 kěyǐ | may, be allowed to | 我可以坐这儿吗？ |

      Languages, writing, swimming and driving are skills: use **会**. Being free, well or near enough: **能**. Asking for a yes: **可以**.

      Negatives use 不: **bú huì** (fourth tone follows), **bù néng**, **bù kěyǐ**.

      ## Answering
      Repeat the verb: 你会说英语吗？ → 会。 / 不会。

      ## A little
      **一点儿** goes before the noun: 我会说**一点儿**汉语. In the south it is said without the r: 一点.

      ## Verbs with built-in objects
      Chinese likes a verb to have an object, so "to read" is 看书 ("look at books") and "to speak" is 说话. 看 covers looking, watching and reading: 看书, 看电影.

      The language has two names: **汉语** (the language of the Han people) and **中文**. Both are fine. 汉字 are Chinese characters.
    items:
      - {id: zh1-14-g-hui, type: glyph, l2: "会", rom: "huì", l1: "can (to know how to)"}
      - {id: zh1-14-g-neng, type: glyph, l2: "能", rom: "néng", l1: "can (to be able to)"}
      - {id: zh1-14-g-shuo, type: glyph, l2: "说", rom: "shuō", l1: "to speak, to say", note: "The speech part 讠."}
      - {id: zh1-14-g-kan, type: glyph, l2: "看", rom: "kàn", l1: "to look, to watch, to read", note: "A hand (手) shading an eye (目)."}
      - {id: zh1-14-g-ting, type: glyph, l2: "听", rom: "tīng", l1: "to listen"}
      - {id: zh1-14-g-xie, type: glyph, l2: "写", rom: "xiě", l1: "to write", note: "Third tone. 谢 (to thank) is xiè, fourth tone."}
      - {id: zh1-14-xihuan, type: vocab, l2: "喜欢", rom: "xǐhuan", l1: "to like", ex: "我喜欢喝茶。", ex_l1: "Wǒ xǐhuan hē chá. — I like drinking tea."}
      - {id: zh1-14-hanyu, type: vocab, l2: "汉语", rom: "Hànyǔ", l1: "Chinese (the language)", alt: ["中文", "Zhōngwén"], ex: "我学汉语。", ex_l1: "Wǒ xué Hànyǔ. — I am learning Chinese."}
      - {id: zh1-14-yingyu, type: vocab, l2: "英语", rom: "Yīngyǔ", l1: "English (the language)", alt: ["英文", "Yīngwén"], ex: "他是英语老师。", ex_l1: "Tā shì Yīngyǔ lǎoshī. — He is an English teacher."}
      - {id: zh1-14-hanzi, type: vocab, l2: "汉字", rom: "Hànzì", l1: "Chinese character(s)", ex: "我会写十个汉字。", ex_l1: "Wǒ huì xiě shí ge Hànzì. — I can write ten Chinese characters."}
      - {id: zh1-14-dianying, type: vocab, l2: "电影", rom: "diànyǐng", l1: "film / movie", ex: "我们明天晚上看电影。", ex_l1: "Wǒmen míngtiān wǎnshang kàn diànyǐng. — We are watching a film tomorrow evening.", note: "'Electric shadows'."}
      - {id: zh1-14-yinyue, type: vocab, l2: "音乐", rom: "yīnyuè", l1: "music", ex: "我喜欢听音乐。", ex_l1: "Wǒ xǐhuan tīng yīnyuè. — I like listening to music."}
      - {id: zh1-14-yidianr, type: vocab, l2: "一点儿", rom: "yìdiǎnr", l1: "a little, a bit", alt: ["一点", "yìdiǎn"], ex: "我想喝一点儿水。", ex_l1: "Wǒ xiǎng hē yìdiǎnr shuǐ. — I'd like to drink a little water."}
      - {id: zh1-14-keyi, type: vocab, l2: "可以", rom: "kěyǐ", l1: "may, to be allowed to", ex: "这儿不可以喝咖啡。", ex_l1: "Zhèr bù kěyǐ hē kāfēi. — You may not drink coffee here."}
      - {id: zh1-14-wohuishuo, type: phrase, l2: "我会说一点儿汉语。", rom: "Wǒ huì shuō yìdiǎnr Hànyǔ.", l1: "I can speak a little Chinese.", alt: ["我会说一点儿中文。", "我会说一点汉语。", "我会说一点中文。"]}
      - {id: zh1-14-nihuishuo, type: phrase, l2: "你会说英语吗？", rom: "Nǐ huì shuō Yīngyǔ ma?", l1: "Can you speak English?", alt: ["您会说英语吗？", "你会说英文吗？", "你会不会说英语？"]}
