  # ───────────────────────────────────────────────────────────────── 17
  - id: zh1-17
    title: "Weather and describing things"
    goal: "I can talk about the weather and describe people and things."
    notes: |
      Describing words (adjectives) in Chinese behave like verbs: they need **no 是**.

      | | | |
      |---|---|---|
      | 今天很冷。 | Jīntiān hěn lěng. | It is cold today. |
      | 她很高。 | Tā hěn gāo. | She is tall. |
      | 这件衣服很漂亮。 | Zhè jiàn yīfu hěn piàoliang. | This piece of clothing is pretty. |

      ## The job of 很
      In a plain positive statement the adjective needs a word in front, and the neutral one is **很**. Unstressed, it hardly means "very": it just completes the sentence. A bare 今天冷 sounds like a contrast ("today is cold, but…").

      ## Turning it up and down
      | | | |
      |---|---|---|
      | 不冷 | bù lěng | not cold |
      | 不太冷 | bú tài lěng | not very cold |
      | 很冷 | hěn lěng | cold |
      | 非常冷 | fēicháng lěng | extremely cold |
      | 太冷了 | tài lěng le | too cold! |

      ## Asking
      - 热吗？ Is it hot?
      - …**怎么样**？ How is …? What is … like? It also makes a suggestion: 我们去喝茶，怎么样？

      ## Weather
      There is no "it": 下雨 is "fall rain". **下雨了** means the rain has started; that 了 is the "new situation" one from the last unit. 天气 is weather: 天 (sky) + 气 (air).

      **觉得** gives an opinion: 我觉得很好看 (I think it looks good).
    items:
