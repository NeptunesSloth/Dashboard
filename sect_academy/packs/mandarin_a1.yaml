  # ───────────────────────────────────────────────────────────────── 12
  - id: zh1-12
    title: "Ordering: 想, 要 and measure words"
    goal: "I can order food and drink politely and ask for what I need."
    notes: |
      ## 想 and 要
      Both go before a verb.

      - **想** + verb is a wish: "would like to". 我想喝茶。
      - **要** + verb is firmer: "want to, going to". **要** + noun is "I'll have": 我要一杯咖啡。 This is how you order; it is not rude.

      Negatives: **不想** (don't feel like) and **不要** (don't want it). 不要了 means "nothing more, thanks".

      ## Measure words for food and drink
      Every noun has its measure word, and containers work just as in English.

      | measure | for | example |
      |---|---|---|
      | 杯 bēi | cups, glasses | 一杯茶 |
      | 碗 wǎn | bowls | 一碗米饭 |
      | 瓶 píng | bottles | 一瓶水 |
      | 个 ge | most other things | 一个菜, 一个鸡蛋 |

      一 changes tone before them: *yì bēi, yì wǎn, yì píng*, but *yí ge*. "Two" is 两: 两杯咖啡.

      ## Giving
      **给** + person + thing: 请给我菜单 (please give me the menu).

      ## More
      **还** means "in addition, still": 还要别的吗？ (anything else?), 我还要一瓶水 (I'd also like a bottle of water).

      Call staff with 服务员！ It is the normal, polite way to get attention. When you are done: 买单！
    items:
      - {id: zh1-12-g-xiang, type: glyph, l2: "想", rom: "xiǎng", l1: "would like to; to think", note: "The heart part 心 underneath: wanting and thinking happen there."}
      - {id: zh1-12-g-yao, type: glyph, l2: "要", rom: "yào", l1: "to want; to be going to"}
      - {id: zh1-12-g-bei, type: glyph, l2: "杯", rom: "bēi", l1: "cup, glass (measure word)", note: "The wood part 木: cups were once wooden."}
      - {id: zh1-12-g-gei, type: glyph, l2: "给", rom: "gěi", l1: "to give; for"}
      - {id: zh1-12-g-hai, type: glyph, l2: "还", rom: "hái", l1: "still; in addition"}
      - {id: zh1-12-fuwuyuan, type: vocab, l2: "服务员", rom: "fúwùyuán", l1: "waiter / waitress", note: "Call it out to get attention: 服务员！"}
      - {id: zh1-12-caidan, type: vocab, l2: "菜单", rom: "càidān", l1: "menu", ex: "这是菜单。", ex_l1: "Zhè shì càidān. — This is the menu.", note: "'Dish list'."}
      - {id: zh1-12-yibeicha, type: vocab, l2: "一杯茶", rom: "yì bēi chá", l1: "a cup of tea", ex: "我想喝一杯茶。", ex_l1: "Wǒ xiǎng hē yì bēi chá. — I'd like to drink a cup of tea."}
      - {id: zh1-12-yiwanmifan, type: vocab, l2: "一碗米饭", rom: "yì wǎn mǐfàn", l1: "a bowl of rice", ex: "我要一碗米饭。", ex_l1: "Wǒ yào yì wǎn mǐfàn. — I'll have a bowl of rice."}
      - {id: zh1-12-yipingshui, type: vocab, l2: "一瓶水", rom: "yì píng shuǐ", l1: "a bottle of water", ex: "请给我一瓶水。", ex_l1: "Qǐng gěi wǒ yì píng shuǐ. — Please give me a bottle of water."}
      - {id: zh1-12-maidan, type: vocab, l2: "买单", rom: "mǎidān", l1: "to pay the bill; the bill, please", alt: ["结账", "jiézhàng"], ex: "服务员，买单！", ex_l1: "Fúwùyuán, mǎidān! — Waiter, the bill, please!"}
      - {id: zh1-12-nixiangchi, type: phrase, l2: "你想吃什么？", rom: "Nǐ xiǎng chī shénme?", l1: "What would you like to eat?", alt: ["您想吃什么？", "你想吃点儿什么？"]}
      - {id: zh1-12-qinggeiwo, type: phrase, l2: "请给我菜单。", rom: "Qǐng gěi wǒ càidān.", l1: "Please give me the menu.", alt: ["请给我看一下菜单。", "请给我菜单，谢谢。"]}
      - {id: zh1-12-haiyao, type: phrase, l2: "还要别的吗？", rom: "Hái yào biéde ma?", l1: "Would you like anything else?", alt: ["还要什么吗？"]}
