      - {id: zh1-17-g-re, type: glyph, l2: "热", rom: "rè", l1: "hot", note: "The fire part 灬 underneath."}
      - {id: zh1-17-g-qi, type: glyph, l2: "气", rom: "qì", l1: "air; gas", note: "Neutral in kèqi; full fourth tone in tiānqì."}
      - {id: zh1-17-g-yu, type: glyph, l2: "雨", rom: "yǔ", l1: "rain", note: "Drops falling from a cloud."}
      - {id: zh1-17-g-gao, type: glyph, l2: "高", rom: "gāo", l1: "tall; high", note: "A picture of a tall tower. You met it in gāoxìng."}
