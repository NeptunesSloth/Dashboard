id: mandarin-a1
title: "Mandarin Chinese — A1 Beginner"
kind: language
language: Mandarin
lang: zh-CN
hall: tongues_west
blurb: "Start Mandarin from zero: pinyin and the four tones, your first 120 characters, measure words, questions, ordering, shopping, time and getting unstuck."

units:
  # ───────────────────────────────────────────────────────────────── 1
  - id: zh1-01
    title: "Pinyin and the four tones"
    goal: "I can read pinyin, hear and say the four tones, and use my first Chinese words."
    notes: |
      Chinese is written in **characters**: each one is a single syllable. **Pinyin** spells that syllable in Latin letters. In this course you can type every answer in pinyin or in characters.

      A syllable has a **tone**, and the tone is part of the word: *mā* is "mum", *mǎ* is "horse".

      | tone | mark | how it sounds | example |
      |---|---|---|---|
      | 1st | ā | high and level, like a held note | 妈 mā |
      | 2nd | á | rising, like asking "what?" | 茶 chá |
      | 3rd | ǎ | low, with a dip | 好 hǎo |
      | 4th | à | a sharp fall, like a firm "no!" | 爸 bà |

      Some syllables are **neutral**: short and light, with no mark. The second syllable of *māma*, *bàba* and *xièxie* is neutral.

      ## Letters that surprise English speakers
      - **x** is a soft "sh" and **q** a soft "ch", said with a smile: *xièxie*.
      - **zh, ch, sh** are said with the tongue curled back: *Zhōngguó*, *chá*, *shū*.
      - **z** is "ds" as in "kids"; **c** is "ts" as in "cats".
      - **-ui** sounds like "way" (*shuǐ*); **-ian** like "yen" (*jiàn*); the **e** of *hěn* like "uh".

      You can type tones as marks or as numbers: *ni3 hao3*. When two third tones meet, the first one is *said* rising (*nǐ hǎo* sounds like "ní hǎo"), but the spelling does not change.
    items:
      - {id: zh1-01-g-ni, type: glyph, l2: "你", rom: "nǐ", l1: "you (one person)", note: "Third tone: low, with a dip."}
      - {id: zh1-01-g-hao, type: glyph, l2: "好", rom: "hǎo", l1: "good", note: "Third tone. A woman (女) beside a child (子)."}
      - {id: zh1-01-g-wo, type: glyph, l2: "我", rom: "wǒ", l1: "I / me", note: "Third tone. Chinese has one word for both I and me."}
      - {id: zh1-01-g-hen, type: glyph, l2: "很", rom: "hěn", l1: "very", note: "Third tone. The e sounds like 'uh'."}
      - {id: zh1-01-g-bu, type: glyph, l2: "不", rom: "bù", l1: "not / no", note: "Fourth tone. Before another fourth tone it is said and written bú, as in bú shì."}
      - {id: zh1-01-g-ren, type: glyph, l2: "人", rom: "rén", l1: "person", note: "Second tone: rising. A picture of someone walking."}
      - {id: zh1-01-g-zhong, type: glyph, l2: "中", rom: "zhōng", l1: "middle", note: "First tone: high and level. A line through the middle of a box."}
      - {id: zh1-01-g-guo, type: glyph, l2: "国", rom: "guó", l1: "country", note: "Second tone. Jade (玉) inside a border."}
      - {id: zh1-01-g-ma, type: glyph, l2: "妈", rom: "mā", l1: "mother (the character in māma)", note: "First tone. Woman (女) for the meaning, horse (马 mǎ) for the sound."}
      - {id: zh1-01-g-ba, type: glyph, l2: "爸", rom: "bà", l1: "father (the character in bàba)", note: "Fourth tone: a sharp fall."}
      - {id: zh1-01-nihao, type: vocab, l2: "你好", rom: "nǐ hǎo", l1: "hello", note: "Literally 'you good'. Two third tones together: say the first one rising."}
      - {id: zh1-01-mama, type: vocab, l2: "妈妈", rom: "māma", l1: "mum / mother", note: "First tone, then a light neutral syllable."}
      - {id: zh1-01-baba, type: vocab, l2: "爸爸", rom: "bàba", l1: "dad / father", note: "Fourth tone, then neutral."}
      - {id: zh1-01-xiexie, type: vocab, l2: "谢谢", rom: "xièxie", l1: "thank you", note: "x is a soft 'sh'. Fourth tone, then neutral."}
      - {id: zh1-01-zaijian, type: vocab, l2: "再见", rom: "zàijiàn", l1: "goodbye", note: "Two fourth tones: both fall. Literally 'again see'."}
      - {id: zh1-01-cha, type: vocab, l2: "茶", rom: "chá", l1: "tea", ex: "中国茶很好。", ex_l1: "Zhōngguó chá hěn hǎo. — Chinese tea is very good.", note: "Second tone: rising."}
      - {id: zh1-01-shui, type: vocab, l2: "水", rom: "shuǐ", l1: "water", note: "Third tone. -ui sounds like 'way': 'shway'."}
      - {id: zh1-01-shu, type: vocab, l2: "书", rom: "shū", l1: "book", note: "First tone: high and level."}
      - {id: zh1-01-zhongguo, type: vocab, l2: "中国", rom: "Zhōngguó", l1: "China", note: "Literally 'the middle country'. First tone, then second."}
      - {id: zh1-01-zhongguoren, type: vocab, l2: "中国人", rom: "Zhōngguó rén", l1: "a Chinese person", note: "Country + 人 gives the nationality."}
      - {id: zh1-01-buhao, type: vocab, l2: "不好", rom: "bù hǎo", l1: "not good / bad", note: "不 goes in front of the word it negates."}
      - {id: zh1-01-wohenhao, type: phrase, l2: "我很好。", rom: "Wǒ hěn hǎo.", l1: "I am fine.", note: "No word for 'am': with a describing word Chinese says 'I very good'."}

  # ───────────────────────────────────────────────────────────────── 2
  - id: zh1-02
    title: "First characters: who is who"
    goal: "I can read my first twenty characters and say who someone is."
    notes: |
      Characters are built from a small set of repeating parts. One part often hints at the meaning:

      - **亻** (a standing person) in 你, 他, 们
      - **女** (woman) in 她, 好, 妈
      - **口** (mouth) in 吗: a word you say, not a thing

      Spotting these parts is how characters become easy to tell apart. Compare 他 (he) and 她 (she): the same sound *tā*, a different left side.

      ## Saying who someone is
      The pattern is **A 是 B**. The verb never changes: no "am / is / are".

      | | | |
      |---|---|---|
      | 我是学生。 | Wǒ shì xuésheng. | I am a student. |
      | 她不是老师。 | Tā bú shì lǎoshī. | She is not a teacher. |
      | 你是学生吗？ | Nǐ shì xuésheng ma? | Are you a student? |

      - **不** makes it negative. Before the fourth tone of *shì* it is said and written **bú**.
      - **吗** at the end turns a statement into a yes/no question. The word order stays the same.
      - **的** works like 's: 老师的书 = the teacher's book; 我的 = my. With family and close friends it is usually dropped: 我妈妈.
      - **们** makes people plural: 我们, 你们, 他们 (all women: 她们).
      - **也** (also) always goes before the verb: 我也是学生.
    items:
      - {id: zh1-02-g-ta, type: glyph, l2: "他", rom: "tā", l1: "he / him", note: "The person part 亻 on the left."}
      - {id: zh1-02-g-ta2, type: glyph, l2: "她", rom: "tā", l1: "she / her", note: "Same sound as 他; the woman part 女 on the left."}
      - {id: zh1-02-g-men, type: glyph, l2: "们", rom: "men", l1: "plural marker for people (as in wǒmen)", note: "Neutral tone. Only for people and pronouns."}
      - {id: zh1-02-g-shi, type: glyph, l2: "是", rom: "shì", l1: "to be (am / is / are)"}
      - {id: zh1-02-g-de, type: glyph, l2: "的", rom: "de", l1: "possessive particle (like 's)", note: "Neutral tone. The most frequent character in Chinese."}
      - {id: zh1-02-g-ma, type: glyph, l2: "吗", rom: "ma", l1: "yes/no question particle", note: "Neutral tone. Mouth (口) for 'a spoken word', horse (马) for the sound."}
      - {id: zh1-02-g-zhe, type: glyph, l2: "这", rom: "zhè", l1: "this"}
      - {id: zh1-02-g-na, type: glyph, l2: "那", rom: "nà", l1: "that"}
      - {id: zh1-02-g-ye, type: glyph, l2: "也", rom: "yě", l1: "also / too", note: "Always before the verb."}
      - {id: zh1-02-g-shei, type: glyph, l2: "谁", rom: "shéi", alt: ["shuí"], l1: "who", note: "Also read shuí; shéi is the everyday reading."}
      - {id: zh1-02-g-xue, type: glyph, l2: "学", rom: "xué", l1: "to study / to learn", note: "A child (子) under a roof."}
      - {id: zh1-02-g-sheng, type: glyph, l2: "生", rom: "shēng", l1: "to be born; life", note: "In xuésheng (student) it is said lightly, as a neutral tone."}
      - {id: zh1-02-women, type: vocab, l2: "我们", rom: "wǒmen", l1: "we / us", ex: "我们是学生。", ex_l1: "Wǒmen shì xuésheng. — We are students."}
      - {id: zh1-02-nimen, type: vocab, l2: "你们", rom: "nǐmen", l1: "you (several people)", ex: "你们好！", ex_l1: "Nǐmen hǎo! — Hello, everyone!"}
      - {id: zh1-02-tamen, type: vocab, l2: "他们", rom: "tāmen", l1: "they / them (men or a mixed group)", ex: "他们是中国人。", ex_l1: "Tāmen shì Zhōngguó rén. — They are Chinese.", note: "A group of women only is written 她们; it sounds the same."}
      - {id: zh1-02-xuesheng, type: vocab, l2: "学生", rom: "xuésheng", l1: "student", ex: "他是学生。", ex_l1: "Tā shì xuésheng. — He is a student.", note: "No word for 'a': Chinese has no articles."}
      - {id: zh1-02-laoshi, type: vocab, l2: "老师", rom: "lǎoshī", l1: "teacher", ex: "她是我们的老师。", ex_l1: "Tā shì wǒmen de lǎoshī. — She is our teacher.", note: "Also a title, placed after the surname: 王老师 = Teacher Wang."}
      - {id: zh1-02-zheshi, type: phrase, l2: "这是我妈妈。", rom: "Zhè shì wǒ māma.", l1: "This is my mum.", alt: ["这是我的妈妈。"], note: "的 is usually dropped before family members."}
      - {id: zh1-02-tashishei, type: phrase, l2: "他是谁？", rom: "Tā shì shéi?", l1: "Who is he?", note: "The question word sits where the answer will go: 他是谁？ 他是老师。"}
      - {id: zh1-02-woyeshi, type: phrase, l2: "我也是学生。", rom: "Wǒ yě shì xuésheng.", l1: "I am a student too."}
      - {id: zh1-02-c1, type: cloze, text: "她___是老师，她是学生。", answer: "不", alt: ["bú", "bù"], l1: "She is not a teacher; she is a student.", note: "不 before the verb. Here it is said bú, because shì is fourth tone."}
      - {id: zh1-02-c2, type: cloze, text: "你是中国人___？", answer: "吗", alt: ["ma"], l1: "Are you Chinese?", note: "Statement + 吗 = yes/no question."}
      - {id: zh1-02-c3, type: cloze, text: "那是老师___书。", answer: "的", alt: ["de"], l1: "That is the teacher's book.", note: "Owner + 的 + thing."}

  # ───────────────────────────────────────────────────────────────── 3
  - id: zh1-03
    title: "Numbers, 有 and the measure word 个"
    goal: "I can count to 100 and say how many of something I have."
    notes: |
      Chinese numbers are perfectly regular. Learn one to ten and you can build the rest.

      | | | | | |
      |---|---|---|---|---|
      | 一 yī 1 | 二 èr 2 | 三 sān 3 | 四 sì 4 | 五 wǔ 5 |
      | 六 liù 6 | 七 qī 7 | 八 bā 8 | 九 jiǔ 9 | 十 shí 10 |

      - 11 is "ten one": 十一. 20 is "two ten": 二十. 35 is 三十五. 100 is 一百 (yìbǎi). Zero is 零 (líng).

      ## Measure words
      You cannot put a number straight onto a noun. A **measure word** goes between them, like "two *cups of* tea" in English, but for everything: 三**个**人 = three people. **个** is the general one; it is said lightly, *ge*.

      - "Two of something" is **两**, not 二: 两个朋友. Keep 二 for counting and inside bigger numbers (十二, 二十).

      ## The tone of 一
      Alone or at the end of a number, 一 is *yī*. Before a fourth tone it becomes **yí** (yí ge); before any other tone it becomes **yì** (yìbǎi). Pinyin for learners writes the change, and so does this course.

      ## Having
      **有** means "to have" and also "there is". Its negative is always **没有**, never 不有: 我没有书.
    items:
      - {id: zh1-03-g-yi, type: glyph, l2: "一", rom: "yī", l1: "one"}
      - {id: zh1-03-g-er, type: glyph, l2: "二", rom: "èr", l1: "two (when counting)"}
      - {id: zh1-03-g-san, type: glyph, l2: "三", rom: "sān", l1: "three"}
      - {id: zh1-03-g-si, type: glyph, l2: "四", rom: "sì", l1: "four"}
      - {id: zh1-03-g-wu, type: glyph, l2: "五", rom: "wǔ", l1: "five"}
      - {id: zh1-03-g-liu, type: glyph, l2: "六", rom: "liù", l1: "six", note: "-iu sounds like 'yo': 'lyoh'."}
      - {id: zh1-03-g-qi, type: glyph, l2: "七", rom: "qī", l1: "seven", note: "q is a soft 'ch': 'chee'."}
      - {id: zh1-03-g-ba, type: glyph, l2: "八", rom: "bā", l1: "eight"}
      - {id: zh1-03-g-jiu, type: glyph, l2: "九", rom: "jiǔ", l1: "nine"}
      - {id: zh1-03-g-shi, type: glyph, l2: "十", rom: "shí", l1: "ten", note: "Second tone. 是 (to be) is shì, fourth tone."}
      - {id: zh1-03-g-ge, type: glyph, l2: "个", rom: "gè", l1: "general measure word", note: "Its own tone is the fourth, but after a number it is said lightly: sān ge."}
      - {id: zh1-03-g-liang, type: glyph, l2: "两", rom: "liǎng", l1: "two (before a measure word)"}
      - {id: zh1-03-g-you, type: glyph, l2: "有", rom: "yǒu", l1: "to have; there is"}
      - {id: zh1-03-g-mei, type: glyph, l2: "没", rom: "méi", l1: "not (the negative used with yǒu)"}
      - {id: zh1-03-shier, type: vocab, l2: "十二", rom: "shí'èr", l1: "twelve", note: "Ten + two. Eleven is 十一, and so on to 十九."}
      - {id: zh1-03-sishiwu, type: vocab, l2: "四十五", rom: "sìshíwǔ", l1: "forty-five", note: "Four tens + five."}
      - {id: zh1-03-liushiqi, type: vocab, l2: "六十七", rom: "liùshíqī", l1: "sixty-seven"}
      - {id: zh1-03-bashijiu, type: vocab, l2: "八十九", rom: "bāshíjiǔ", l1: "eighty-nine"}
      - {id: zh1-03-yibai, type: vocab, l2: "一百", rom: "yìbǎi", l1: "one hundred", note: "一 changes to yì before a third tone."}
      - {id: zh1-03-meiyou, type: vocab, l2: "没有", rom: "méiyǒu", l1: "to not have; there isn't", ex: "我没有书。", ex_l1: "Wǒ méiyǒu shū. — I don't have a book.", note: "Never 不有."}
      - {id: zh1-03-pengyou, type: vocab, l2: "朋友", rom: "péngyou", l1: "friend", ex: "他是我的朋友。", ex_l1: "Tā shì wǒ de péngyou. — He is my friend."}
      - {id: zh1-03-woyou, type: phrase, l2: "我有一个中国朋友。", rom: "Wǒ yǒu yí ge Zhōngguó péngyou.", l1: "I have a Chinese friend.", note: "一个 = 'one' or 'a'. 一 is said yí here because 个 is a fourth tone underneath."}
      - {id: zh1-03-niyou, type: phrase, l2: "你有书吗？", rom: "Nǐ yǒu shū ma?", l1: "Do you have a book?"}
      - {id: zh1-03-c1, type: cloze, text: "我有三___朋友。", answer: "个", alt: ["ge", "gè"], l1: "I have three friends.", note: "Number + measure word + noun."}
      - {id: zh1-03-c2, type: cloze, text: "他___有书。", answer: "没", alt: ["méi"], l1: "He doesn't have a book.", note: "有 is negated with 没, never with 不."}
      - {id: zh1-03-c3, type: cloze, text: "我们有___个老师。", answer: "两", alt: ["liǎng"], l1: "We have two teachers.", note: "Before a measure word 'two' is 两, not 二."}

  # ───────────────────────────────────────────────────────────────── 4
  - id: zh1-04
    title: "Greetings and politeness"
    goal: "I can greet people at any time of day, thank them, apologise and ask how they are."
    notes: |
      **你好** works for anyone. To someone older, a teacher or a customer, raise it to **您好**: 您 is the polite "you". There is no polite form for a group; say 你们好.

      | time | greeting | |
      |---|---|---|
      | morning | 早上好 | zǎoshang hǎo |
      | evening | 晚上好 | wǎnshang hǎo |
      | going to bed | 晚安 | wǎn'ān |

      ## The little exchanges
      - 谢谢 → **不客气** (bú kèqi, "don't be so polite").
      - 对不起 → **没关系** (méi guānxi, "it doesn't matter").

      ## 请
      **请** means "please" and always comes *first*: 请坐 (please sit), 请问 (please, may I ask…). Use 请问 before any question to a stranger.

      ## Asking back with 呢
      **呢** after a noun or pronoun bounces a question back: 我很好，你呢？ = "I'm fine, and you?" It saves you repeating the whole question.

      ## People's names and titles
      The surname comes first and the title after it: 王老师 (Teacher Wang), 李先生 (Mr Li). Greet a teacher with the title, not the bare name: 王老师好！
    items:
      - {id: zh1-04-g-xie, type: glyph, l2: "谢", rom: "xiè", l1: "to thank", note: "The speech part 讠 on the left: thanking is something you say."}
      - {id: zh1-04-g-zai, type: glyph, l2: "再", rom: "zài", l1: "again"}
      - {id: zh1-04-g-jian, type: glyph, l2: "见", rom: "jiàn", l1: "to see / to meet"}
      - {id: zh1-04-g-qing, type: glyph, l2: "请", rom: "qǐng", l1: "please; to invite", note: "The speech part 讠 again."}
      - {id: zh1-04-g-wen, type: glyph, l2: "问", rom: "wèn", l1: "to ask", note: "A mouth (口) in a doorway (门)."}
      - {id: zh1-04-g-nin, type: glyph, l2: "您", rom: "nín", l1: "you (polite, to one person)", note: "你 with a heart (心) underneath."}
      - {id: zh1-04-ninhao, type: vocab, l2: "您好", rom: "nín hǎo", l1: "hello (polite: to an elder, a teacher, a customer)"}
      - {id: zh1-04-zaoshanghao, type: vocab, l2: "早上好", rom: "zǎoshang hǎo", l1: "good morning", alt: ["早", "zǎo", "早安", "zǎo'ān"], note: "早上 = early morning. Friends often just say 早！"}
      - {id: zh1-04-wanan, type: vocab, l2: "晚安", rom: "wǎn'ān", l1: "good night (going to bed)", note: "The apostrophe only shows where the syllables divide: wǎn + ān."}
      - {id: zh1-04-duibuqi, type: vocab, l2: "对不起", rom: "duìbuqǐ", l1: "sorry", note: "不 is neutral in the middle of this word."}
      - {id: zh1-04-meiguanxi, type: vocab, l2: "没关系", rom: "méi guānxi", l1: "it's all right / never mind (reply to an apology)", alt: ["没事", "méi shì", "没事儿", "méi shìr"]}
      - {id: zh1-04-bukeqi, type: vocab, l2: "不客气", rom: "bú kèqi", l1: "you're welcome (reply to thanks)", alt: ["不谢", "bú xiè", "不用谢", "bú yòng xiè"], note: "不 is written bú before the fourth tone of kè."}
      - {id: zh1-04-qingwen, type: vocab, l2: "请问", rom: "qǐngwèn", l1: "excuse me, may I ask…", ex: "请问，您是王老师吗？", ex_l1: "Qǐngwèn, nín shì Wáng lǎoshī ma? — Excuse me, are you Teacher Wang?"}
      - {id: zh1-04-nihaoma, type: phrase, l2: "你好吗？", rom: "Nǐ hǎo ma?", l1: "How are you?", note: "A real question to someone you know, not a passing greeting."}
      - {id: zh1-04-qingzuo, type: phrase, l2: "请坐。", rom: "Qǐng zuò.", l1: "Please sit down."}
      - {id: zh1-04-c1, type: cloze, text: "我很好，你___？", answer: "呢", alt: ["ne"], l1: "I'm fine, and you?", note: "呢 bounces the question back."}
      - {id: zh1-04-c2, type: cloze, text: "王老师，___见！", answer: "再", alt: ["zài"], l1: "Goodbye, Teacher Wang!", note: "再见 = 'see (you) again'."}
      - id: zh1-04-d1
        type: dialogue
        title: "Meeting your teacher in the morning"
        scene: "You are a student. You meet Teacher Wang at the school gate."
        you: B
        lines:
          - {who: A, l2: "早上好！", rom: "Zǎoshang hǎo!", l1: "Good morning!"}
          - {who: B, l2: "王老师，早上好！", rom: "Wáng lǎoshī, zǎoshang hǎo!", l1: "Good morning, Teacher Wang!", alt: ["早上好，王老师！", "王老师早！", "王老师好！"]}
          - {who: A, l2: "你好吗？", rom: "Nǐ hǎo ma?", l1: "How are you?"}
          - {who: B, l2: "我很好，谢谢。您呢？", rom: "Wǒ hěn hǎo, xièxie. Nín ne?", l1: "I'm fine, thank you. And you? (polite)", alt: ["很好，谢谢。您呢？", "我很好，谢谢您。您呢？"]}
          - {who: A, l2: "我也很好。", rom: "Wǒ yě hěn hǎo.", l1: "I'm fine too."}
          - {who: B, l2: "老师，再见！", rom: "Lǎoshī, zàijiàn!", l1: "Goodbye, teacher!", alt: ["再见，老师！", "老师再见！", "王老师，再见！"]}
