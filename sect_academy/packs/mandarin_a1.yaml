      - {id: zh1-08-shangwu, type: vocab, l2: "上午", rom: "shàngwǔ", l1: "morning (the hours before noon, a.m.)", ex: "上午十点", ex_l1: "shàngwǔ shí diǎn — 10 a.m."}
