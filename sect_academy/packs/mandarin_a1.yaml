  # ───────────────────────────────────────────────────────────────── 7
  - id: zh1-07
    title: "Dates, days and age"
    goal: "I can say the date, the day of the week and my age."
    notes: |
      Months and weekdays are just **numbers**.

      - Months: number + **月**. 一月 (yī yuè) January, 二月 February … 十二月 December.
      - Days of the month: number + **号** in speech (**日** in writing): 八号 = the 8th.
      - Weekdays: **星期** + number, Monday = 1: 星期一 … 星期六. Sunday is 星期天 (or 星期日).
      - Years are read digit by digit + **年**: 二零二六年.

      ## Big before small
      Chinese dates always run from the largest unit to the smallest: **年 → 月 → 号 → 星期**. 五月八号 = 8 May.

      | | | |
      |---|---|---|
      | 昨天 zuótiān | 今天 jīntiān | 明天 míngtiān |
      | yesterday | today | tomorrow |

      ## No 是 needed
      With dates, days and ages the verb 是 is normally left out: 今天星期三。 我二十岁。 It comes back in the negative: 今天**不是**星期三.

      ## Asking
      **几** stands in for the number: 几月几号？ 星期几？

      Age: 你多大？ ("how big?") to an adult; 你几岁？ only to a small child. The answer is number + **岁**.

      In dates 一 keeps its first tone: yī yuè yī hào. 生日快乐 (shēngrì kuàilè) is "happy birthday".
    items:
