  # ───────────────────────────────────────────────────────────────── 9
  - id: zh1-09
    title: "Places and 在"
    goal: "I can say where I am, where I live and where I am going."
    notes: |
      **在** says where someone or something *is*. English uses "to be", but Chinese cannot use 是 for location.

      | | | |
      |---|---|---|
      | 我在家。 | Wǒ zài jiā. | I am at home. |
      | 他不在。 | Tā bú zài. | He is not here. |
      | 洗手间在哪儿？ | Xǐshǒujiān zài nǎr? | Where is the toilet? |

      So three verbs share the work of English "to be / to have":

      - **是** links two nouns: 她是老师。
      - **在** gives a location: 她在学校。
      - **有** says what exists or is owned: 学校有很多老师。

      ## Doing something somewhere
      Put **在 + place before the verb**: 我**在北京**工作 (I work in Beijing). With 住 (to live) the place may follow: 我住在北京.

      ## Going and coming
      **去** + place, **来** + place, with no word for "to": 我去学校。 他来我家。

      ## Here, there, where
      这儿 (here), 那儿 (there), 哪儿 (where). The final **r** is a Beijing habit; in the south people say 这里, 那里, 哪里. Both are standard.

      Like every question word, 哪儿 stays where the answer will go: 你去**哪儿**？ 我去**商店**。
    items:
      - {id: zh1-09-g-zai, type: glyph, l2: "在", rom: "zài", l1: "to be at; at / in", note: "Same sound as 再 (again), a different character."}
      - {id: zh1-09-g-qu, type: glyph, l2: "去", rom: "qù", l1: "to go", note: "After q the letter u is really ü: lips rounded."}
      - {id: zh1-09-g-lai, type: glyph, l2: "来", rom: "lái", l1: "to come"}
      - {id: zh1-09-g-zhu, type: glyph, l2: "住", rom: "zhù", l1: "to live (somewhere), to stay"}
      - {id: zh1-09-g-bei, type: glyph, l2: "北", rom: "běi", l1: "north"}
      - {id: zh1-09-g-jing, type: glyph, l2: "京", rom: "jīng", l1: "capital city"}
      - {id: zh1-09-nar, type: vocab, l2: "哪儿", rom: "nǎr", l1: "where", alt: ["哪里", "nǎlǐ", "nǎli"], ex: "你在哪儿？", ex_l1: "Nǐ zài nǎr? — Where are you?"}
      - {id: zh1-09-zher, type: vocab, l2: "这儿", rom: "zhèr", l1: "here", alt: ["这里", "zhèlǐ", "zhèli"], ex: "我的书在这儿。", ex_l1: "Wǒ de shū zài zhèr. — My book is here."}
