  # ───────────────────────────────────────────────────────────────── 10
  - id: zh1-10
    title: "Directions and transport"
    goal: "I can ask the way, follow simple directions and say how I travel."
    notes: |
      Position words are a direction + **面** or **边** ("side"):

      | | | |
      |---|---|---|
      | 前面 | qiánmiàn | in front, ahead |
      | 后面 | hòumiàn | behind |
      | 左边 | zuǒbian | on the left |
      | 右边 | yòubian | on the right |
      | 旁边 | pángbiān | beside |

      ## The landmark comes first
      English says "in front of the school". Chinese says "the school's front": **学校(的)前面**. A full sentence is *thing + 在 + landmark + position*:

      - 医院在学校的旁边。 The hospital is next to the school.

      ## Asking the way
      - …在哪儿？ Where is …?
      - …怎么走？ How do I get to …? (literally "how walk")
      - 远吗？ Is it far? → 不远，很近。 Not far, it's close.

      Directions you will hear: 一直走 (straight on), 往前走 (go ahead), 往左走 / 往右走 (go left / right). 往 (wǎng) means "towards".

      ## How you travel
      **坐** is "to sit", and so "to go by" anything you sit in: 坐出租车, 坐地铁, 坐火车. The transport comes **before** the main verb: 我**坐地铁**去学校 (I go to school by subway). On foot is 走路 (zǒulù).

      车 on its own is any wheeled vehicle, usually a car.
    items:
      - {id: zh1-10-g-qian, type: glyph, l2: "前", rom: "qián", l1: "front; before"}
      - {id: zh1-10-g-hou, type: glyph, l2: "后", rom: "hòu", l1: "back; after"}
      - {id: zh1-10-g-zuo, type: glyph, l2: "左", rom: "zuǒ", l1: "left", note: "左 has 工 underneath; 右 (right) has a mouth 口."}
      - {id: zh1-10-g-you, type: glyph, l2: "右", rom: "yòu", l1: "right (not left)"}
      - {id: zh1-10-g-che, type: glyph, l2: "车", rom: "chē", l1: "vehicle, car"}
      - {id: zh1-10-g-zou, type: glyph, l2: "走", rom: "zǒu", l1: "to walk; to leave"}
      - {id: zh1-10-qianmian, type: vocab, l2: "前面", rom: "qiánmiàn", l1: "in front; ahead", alt: ["qiánmian", "前边", "qiánbian", "qiánbiān"], ex: "商店在前面。", ex_l1: "Shāngdiàn zài qiánmiàn. — The shop is up ahead."}
      - {id: zh1-10-houmian, type: vocab, l2: "后面", rom: "hòumiàn", l1: "behind; at the back", alt: ["hòumian", "后边", "hòubian", "hòubiān"], ex: "洗手间在后面。", ex_l1: "Xǐshǒujiān zài hòumiàn. — The toilet is at the back."}
      - {id: zh1-10-zuobian, type: vocab, l2: "左边", rom: "zuǒbian", l1: "the left side; on the left", alt: ["zuǒbiān", "左面", "zuǒmiàn"], ex: "学校在左边。", ex_l1: "Xuéxiào zài zuǒbian. — The school is on the left."}
