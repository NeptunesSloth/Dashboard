  # ───────────────────────────────────────────────────────────────── 16
  - id: zh1-16
    title: "What happened: 了 and 没"
    goal: "I can say what I did and did not do, and ask whether something has happened yet."
    notes: |
      Chinese has no past tense. Time words (昨天, 去年) place the event, and the particle **了** marks an action as **completed**.

      | | | |
      |---|---|---|
      | 我去商店了。 | Wǒ qù shāngdiàn le. | I went to the shop. |
      | 我买了两本书。 | Wǒ mǎi le liǎng běn shū. | I bought two books. |
      | 你吃饭了吗？ | Nǐ chī fàn le ma? | Have you eaten? |

      - With a plain object, 了 usually closes the sentence: 我吃饭了.
      - When the object has a number, 了 follows the verb: 我吃**了**两碗饭.

      ## The negative: 没, and no 了
      "Did not" is **没** (or 没有) + verb, and 了 disappears:

      - 他没来。 He didn't come. (not 他不来了, which means "he's not coming any more")
      - **还没** = not yet: 我还没吃。

      Compare 不 for habits and intentions: 我不吃肉 (I don't eat meat) but 我没吃肉 (I didn't eat the meat).

      ## 了 is not "past"
      It also marks a **new situation**: 下雨了 (it has started raining), 我饿了 (I've become hungry), 太贵了.

      And states take no 了 at all: "yesterday I was busy" is simply 我昨天很忙.

      已经 (already) pairs naturally with 了: 他已经到了.
    items:
      - {id: zh1-16-g-le, type: glyph, l2: "了", rom: "le", l1: "particle: completed action or new situation", note: "Neutral tone."}
      - {id: zh1-16-g-zuo, type: glyph, l2: "昨", rom: "zuó", l1: "the character in zuótiān (yesterday)", note: "The sun part 日: a day."}
      - {id: zh1-16-g-dao, type: glyph, l2: "到", rom: "dào", l1: "to arrive; to reach"}
      - {id: zh1-16-g-yi, type: glyph, l2: "已", rom: "yǐ", l1: "first half of yǐjīng (already)"}
      - {id: zh1-16-g-jing, type: glyph, l2: "经", rom: "jīng", l1: "second half of yǐjīng (already)", note: "Same sound as 京 in Běijīng."}
      - {id: zh1-16-zuotian, type: vocab, l2: "昨天", rom: "zuótiān", l1: "yesterday", ex: "昨天我很忙。", ex_l1: "Zuótiān wǒ hěn máng. — I was busy yesterday.", note: "A state such as 很忙 takes no 了."}
      - {id: zh1-16-yijing, type: vocab, l2: "已经", rom: "yǐjīng", l1: "already", ex: "他已经回家了。", ex_l1: "Tā yǐjīng huí jiā le. — He has already gone home."}
      - {id: zh1-16-qunian, type: vocab, l2: "去年", rom: "qùnián", l1: "last year", ex: "我去年去了中国。", ex_l1: "Wǒ qùnián qù le Zhōngguó. — I went to China last year."}
      - {id: zh1-16-shanggexingqi, type: vocab, l2: "上个星期", rom: "shàng ge xīngqī", l1: "last week", alt: ["上星期", "shàng xīngqī", "上周", "shàng zhōu"], ex: "上个星期我没上班。", ex_l1: "Shàng ge xīngqī wǒ méi shàngbān. — I didn't go to work last week.", note: "上 = the previous one; next week is 下个星期."}
      - {id: zh1-16-haimei, type: vocab, l2: "还没", rom: "hái méi", l1: "not yet", alt: ["还没有", "hái méiyǒu"], ex: "她还没来。", ex_l1: "Tā hái méi lái. — She hasn't come yet."}
