      - {id: zh1-14-c2, type: cloze, text: "明天我在医院，不___来学校。", answer: "能", alt: ["néng"], l1: "Tomorrow I'll be at the hospital, so I can't come to school.", note: "Circumstances prevent it: 能."}
      - id: zh1-14-d1
        type: dialogue
        title: "What do you like doing?"
        scene: "Someone at a party is surprised to hear you speak Chinese."
        you: B
        lines:
          - {who: A, l2: "你会说汉语吗？", rom: "Nǐ huì shuō Hànyǔ ma?", l1: "Can you speak Chinese?"}
          - {who: B, l2: "会一点儿。", rom: "Huì yìdiǎnr.", l1: "A little.", alt: ["我会说一点儿。", "我会一点儿。", "会说一点儿。", "会一点。", "我会说一点儿汉语。"]}
          - {who: A, l2: "你说得很好！你喜欢中国电影吗？", rom: "Nǐ shuō de hěn hǎo! Nǐ xǐhuan Zhōngguó diànyǐng ma?", l1: "You speak very well! Do you like Chinese films?"}
          - {who: B, l2: "很喜欢。你呢？", rom: "Hěn xǐhuan. Nǐ ne?", l1: "I like them a lot. And you?", alt: ["我很喜欢。你呢？", "喜欢，很喜欢。你呢？"]}
          - {who: A, l2: "我喜欢听音乐，也喜欢看书。", rom: "Wǒ xǐhuan tīng yīnyuè, yě xǐhuan kàn shū.", l1: "I like listening to music, and I like reading too."}
          - {who: B, l2: "我也喜欢看书。", rom: "Wǒ yě xǐhuan kàn shū.", l1: "I like reading too.", alt: ["我也很喜欢看书。", "我也喜欢。"]}

  # ───────────────────────────────────────────────────────────────── 15
  - id: zh1-15
    title: "Daily routine"
    goal: "I can describe my day: when I get up, work, go home and sleep."
    notes: |
      Chinese verbs never change, so a routine is just the verb with a time in front. The fixed order is:

      **Subject + time + (place) + verb**

      | subject | time | place | verb |
      |---|---|---|---|
      | 我 | 每天七点 | | 起床。 |
      | 他 | 上午 | 在学校 | 工作。 |
      | 我们 | 晚上六点 | | 回家。 |

      The time may also open the sentence (每天我七点起床), but it can **never** come after the verb as in English "I get up *at seven*".

      ## Useful pairs
      - **上**班 / **下**班: start work / finish work. The same 上 and 下 as in 上午 and 下午. A class works the same way: 上课 (class begins) and 下课.
      - 起床 ("rise from bed") / 睡觉 ("sleep a sleep").
      - 回家: 回 is "to return", so no 去 is needed.

      ## Every
      **每** + measure word or time: 每天 (every day), 每个人 (everyone), 每个星期 (every week).

      ## Asking
      你几点起床？ (What time do you get up?) The question word 几点 sits in the time slot.

      忙 (busy) and 累 (lèi, tired) are describing words: 我很忙, with 很 and without 是. To ask: 你忙吗？ or 你忙不忙？
