      - {id: es3-07-equivocarse, type: vocab, l2: "equivocarse", l1: "to make a mistake / to be wrong",
         ex: "Me equivoqué de autobús.", ex_l1: "I got on the wrong bus.",
         note: "equivocarse de + noun = to get the wrong one. Spelling: me equivoqué."}
      - {id: es3-07-al-principio, type: vocab, l2: "al principio", l1: "at first / at the beginning",
         ex: "Al principio no entendía nada.", ex_l1: "At first I didn't understand anything.",
         note: "The opposite of al final."}
      - {id: es3-07-por-fin, type: vocab, l2: "por fin", l1: "at last / finally (after a wait)",
         ex: "¡Por fin has llegado!", ex_l1: "You've arrived at last!",
         note: "por fin expresses relief; al final just says how things ended."}
      - {id: es3-07-resulta-que, type: vocab, l2: "resulta que", l1: "it turns out that",
         ex: "Resulta que el hotel estaba cerrado.", ex_l1: "It turns out that the hotel was closed.",
         note: "A very common way to introduce the surprising part of a story."}
      - {id: es3-07-sin-querer, type: vocab, l2: "sin querer", l1: "by accident / without meaning to",
