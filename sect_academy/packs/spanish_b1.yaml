id: spanish-b1
title: "Spanish — B1 Intermediate"
kind: language
language: Spanish
lang: es-ES
hall: tongues_south
blurb: "Hold a real conversation: the subjunctive, the conditional, if-sentences, reported speech, connectors and the fillers Spaniards actually use, in 300 whole-sentence items."

units:
  # ---------------------------------------------------------------- 1
  - id: es3-01
    title: "What I want you to do: the present subjunctive"
    goal: "I can say what I want, need or prefer other people to do, and ask someone for a favour."
    notes: |
      The **presente de subjuntivo** is the mood Spanish uses when one person wants, hopes or feels something about what *another* person does. Form it from the **yo** form of the present: drop the **-o** and add the "opposite" vowel.

      | Pronoun | hablar | comer / vivir |
      | yo | hable | coma |
      | tú | hables | comas |
      | él / ella / usted | hable | coma |
      | nosotros | hablemos | comamos |
      | vosotros | habléis | comáis |
      | ellos / ustedes | hablen | coman |

      - Because it starts from *yo*, irregular *yo* forms carry over: *tengo → tenga*, *hago → haga*, *veo → vea*.
      - Spelling keeps the sound: *llegar → llegue*, *pagar → pague*, *buscar → busque*.
      - **querer que / necesitar que / preferir que** + subjunctive when the two subjects differ: *Quiero que vengas*.
      - Same subject: use the infinitive, with no *que*: *Quiero venir*.
      - English says "I want you to help"; Spanish never says *te quiero ayudar* for that.
    items:
      - {id: es3-01-dejar, type: vocab, l2: "dejar", l1: "to leave (something somewhere) / to let, to allow",
         ex: "¿Dónde he dejado las llaves?", ex_l1: "Where have I left my keys?",
         note: "dejar que + subjunctive = to let: Déjame que te ayude. To leave a place is salir or irse."}
      - {id: es3-01-avisar, type: vocab, l2: "avisar", l1: "to let (someone) know / to warn",
         ex: "Quiero que me avises mañana.", ex_l1: "I want you to let me know tomorrow.",
         note: "False friend: it is not 'to advise' (that is aconsejar)."}
      - {id: es3-01-acompanar, type: vocab, l2: "acompañar", l1: "to go with (someone) / to accompany",
         ex: "¿Me acompañas al médico?", ex_l1: "Will you come to the doctor's with me?"}
      - {id: es3-01-compartir, type: vocab, l2: "compartir", l1: "to share",
         ex: "Comparto piso con dos amigos.", ex_l1: "I share a flat with two friends.",
         note: "compartir piso = to share a flat, with no article."}
      - {id: es3-01-recoger, type: vocab, l2: "recoger", l1: "to tidy up / to pick up, to collect",
         ex: "Mi madre quiere que recoja mi habitación.", ex_l1: "My mother wants me to tidy my room.",
         note: "Spelling: yo recojo, subjunctive recoja (g → j before o and a)."}
      - {id: es3-01-quedar, type: vocab, l2: "quedar", l1: "to arrange to meet / to meet up (not reflexive)",
         ex: "¿Quedamos a las ocho en la plaza?", ex_l1: "Shall we meet at eight in the square?",
         note: "quedar = to meet up; quedarse = to stay. Very common in Spain; Latin America often says verse or encontrarse."}
      - {id: es3-01-favor, type: vocab, l2: "el favor", l1: "the favour",
         ex: "Necesito pedirte un favor.", ex_l1: "I need to ask you a favour.",
         note: "You 'ask' a favour with pedir and 'do' one with hacer."}
      - {id: es3-01-companero-piso, type: vocab, l2: "el compañero de piso", l1: "the flatmate / the housemate (male)",
         alt: ["el compañero de departamento", "el compañero de cuarto"],
         ex: "Mi compañero de piso es de Perú.", ex_l1: "My flatmate is from Peru.",
         note: "Feminine: la compañera de piso. Latin America: compañero de departamento / de cuarto."}
      - {id: es3-01-tareas-casa, type: vocab, l2: "las tareas de la casa", l1: "the housework / the household chores",
         alt: ["las tareas de casa", "las tareas del hogar", "las tareas domésticas"],
         ex: "En mi piso compartimos las tareas de la casa.", ex_l1: "In my flat we share the housework.",
         note: "Plural in Spanish. la tarea alone is a task (or homework in Latin America)."}
      - {id: es3-01-enseguida, type: vocab, l2: "enseguida", l1: "right away / straight away", alt: ["en seguida", "ahora mismo", "inmediatamente"],
         ex: "Vuelvo enseguida.", ex_l1: "I'll be right back.",
         note: "Usually written as one word. What a waiter says when you order: ¡Enseguida!"}
      - {id: es3-01-quiero-ayudes, type: phrase, l2: "Quiero que me ayudes.", l1: "I want you to help me. (informal)",
         note: "Two subjects (I want, you help) → que + subjunctive. Never 'Te quiero ayudar' for this meaning."}
      - {id: es3-01-quieres-acompane, type: phrase, l2: "¿Quieres que te acompañe?",
         l1: "Do you want me to come with you? (informal)", alt: ["¿Quieres que vaya contigo?"]}
      - {id: es3-01-no-quiero-llegues, type: phrase, l2: "No quiero que llegues tarde.",
         l1: "I don't want you to be late. (informal; to arrive late)",
         note: "llegar → llegue: the u keeps the hard g sound."}
      - {id: es3-01-prefiero-hablemos, type: phrase, l2: "Prefiero que hablemos mañana.",
         l1: "I'd rather we talked tomorrow.", alt: ["Prefiero que lo hablemos mañana"]}
      - {id: es3-01-me-haces-favor, type: phrase, l2: "¿Me haces un favor?", l1: "Can you do me a favour? (informal)",
         alt: ["¿Me puedes hacer un favor?", "¿Puedes hacerme un favor?"],
         note: "Spanish often asks with a plain present tense where English uses 'can you'."}
      - {id: es3-01-necesito-escuches, type: phrase, l2: "Necesito que me escuches.", l1: "I need you to listen to me. (informal)"}
      - {id: es3-01-que-quieres-haga, type: phrase, l2: "¿Qué quieres que haga?", l1: "What do you want me to do? (informal)",
         note: "hago → haga. The yo and él forms of the subjunctive are identical; context tells you who."}
      - {id: es3-01-c1, type: cloze, text: "Quiero que tú ___ con el jefe.", answer: "hables",
         l1: "I want you to speak to the boss.", note: "hablar → (tú) hables: -ar verbs take e"}
      - {id: es3-01-c2, type: cloze, text: "Mi madre quiere que yo ___ más fruta.", answer: "coma",
         l1: "My mother wants me to eat more fruit.", note: "comer → (yo) coma: -er verbs take a"}
      - {id: es3-01-c3, type: cloze, text: "¿Quieres que nosotros ___ en el centro?", answer: "vivamos",
         l1: "Do you want us to live in the centre?", note: "vivir → (nosotros) vivamos"}
      - {id: es3-01-c4, type: cloze, text: "El profesor quiere que vosotros ___ un correo en español.", answer: "escribáis",
         l1: "The teacher wants you (plural, informal) to write an e-mail in Spanish.",
         note: "escribir → (vosotros) escribáis. Latin America: que ustedes escriban"}
      - {id: es3-01-c5, type: cloze, text: "No quiero que mis hijos ___ tanta televisión.", answer: "vean",
         l1: "I don't want my children to watch so much television.", note: "veo → vea → (ellos) vean", alt: ["miren"]}
      - {id: es3-01-c6, type: cloze, text: "Hoy pago yo, pero prefiero que mañana ___ tú.", answer: "pagues",
         l1: "I'm paying today, but I'd rather you paid tomorrow.", note: "pagar → pagues: gu keeps the hard g sound"}
      - {id: es3-01-c7, type: cloze, text: "Mi jefe quiere que yo ___ a la oficina a las ocho.", answer: "llegue",
         l1: "My boss wants me to arrive at the office at eight.", note: "llegar → (yo) llegue"}
      - {id: es3-01-c8, type: cloze, text: "Estoy cansada: quiero ___ a casa.", answer: "volver", alt: ["regresar"],
         l1: "I'm tired: I want to go back home.", note: "same subject (I want, I go back) → infinitive, no que"}

  # ---------------------------------------------------------------- 2
  - id: es3-02
    title: "Hopes and needs: irregular subjunctives, esperar que, ojalá"
    goal: "I can express hopes and good wishes and say what it is important or necessary for someone to do."
    notes: |
      Six verbs have a subjunctive you cannot build from the *yo* form. Learn them by heart:

      | Infinitive | yo / él | tú | nosotros |
      | ser | sea | seas | seamos |
      | estar | esté | estés | estemos |
      | ir | vaya | vayas | vayamos |
      | haber | haya | hayas | hayamos |
      | saber | sepa | sepas | sepamos |
      | dar | dé | des | demos |

      - *hay* becomes **haya**: *Espero que haya sitio*.
      - Stem-changing verbs change as in the present, except in *nosotros / vosotros*: *pueda, puedas… podamos*.
      - **esperar que** + subjunctive = to hope that. (*esperar* also means to wait.)
      - **ojalá (que)** + subjunctive = "I really hope…", "if only…". It never changes form.
      - **es importante / necesario / mejor que** + subjunctive when you mean a particular person: *Es importante que vengas*. For a general truth use the infinitive: *Es importante dormir*.
      - Wishes often start with a bare **que**: *¡Que aproveche!* (enjoy your meal), *¡Que te mejores!*
    items:
      - {id: es3-02-ojala, type: vocab, l2: "ojalá", l1: "I hope so / hopefully / if only (one word, + subjunctive)",
         ex: "—¿Vas a aprobar? —¡Ojalá!", ex_l1: "“Are you going to pass?” “I hope so!”",
         note: "From Arabic; it never changes. Ojalá and ojalá que mean the same."}
      - {id: es3-02-proyecto, type: vocab, l2: "el proyecto", l1: "the project",
         ex: "Estamos trabajando en un proyecto nuevo.", ex_l1: "We are working on a new project."}
      - {id: es3-02-plazo, type: vocab, l2: "el plazo", l1: "the deadline / the time limit",
         ex: "El plazo termina el viernes.", ex_l1: "The deadline is on Friday.",
         note: "a corto / largo plazo = in the short / long term."}
      - {id: es3-02-conseguir, type: vocab, l2: "conseguir", l1: "to get, to obtain / to manage to",
         ex: "Espero que consigas el trabajo.", ex_l1: "I hope you get the job.",
         note: "Conjugated like seguir: consigo, consigues; subjunctive consiga."}
      - {id: es3-02-oportunidad, type: vocab, l2: "la oportunidad", l1: "the opportunity / the chance",
         ex: "Es una buena oportunidad para aprender.", ex_l1: "It is a good opportunity to learn.",
         note: "Nouns ending in -dad are feminine."}
      - {id: es3-02-exito, type: vocab, l2: "el éxito", l1: "the success",
         ex: "El proyecto fue un éxito.", ex_l1: "The project was a success.",
         note: "False friend: an exit is la salida. tener éxito = to be successful."}
      - {id: es3-02-mejorar, type: vocab, l2: "mejorar", l1: "to improve / to get better",
         ex: "Quiero mejorar mi español.", ex_l1: "I want to improve my Spanish.",
         note: "mejorarse = to get better after an illness."}
      - {id: es3-02-tener-ganas, type: vocab, l2: "tener ganas de", l1: "to feel like / to look forward to (doing something)",
         ex: "Tengo ganas de verte.", ex_l1: "I'm looking forward to seeing you.",
         note: "Followed by an infinitive or a noun: tengo ganas de vacaciones."}
      - {id: es3-02-salir-bien, type: vocab, l2: "salir bien", l1: "to turn out well / to go well (of a plan, an exam)",
         ex: "Espero que todo salga bien.", ex_l1: "I hope everything turns out well.",
         note: "The opposite is salir mal. salgo → salga."}
      - {id: es3-02-a-tiempo, type: vocab, l2: "a tiempo", l1: "on time / in time",
         ex: "Es importante que llegues a tiempo.", ex_l1: "It's important that you arrive on time.",
         note: "Not 'en tiempo'."}
      - {id: es3-02-espero-estes-bien, type: phrase, l2: "Espero que estés bien.", l1: "I hope you are well. (informal)",
         note: "The usual first line of a message or e-mail to a friend."}
      - {id: es3-02-ojala-tengas-suerte, type: phrase, l2: "Ojalá tengas suerte.",
         l1: "I really hope you're lucky. (informal, with ojalá)", alt: ["Ojalá que tengas suerte"]}
      - {id: es3-02-que-te-vaya-bien, type: phrase, l2: "¡Que te vaya bien!",
         l1: "I hope it goes well for you! / All the best! (informal, starts with Que)", alt: ["Que te vaya muy bien"],
         note: "Literally 'may it go well for you'. Said when someone is leaving for an exam, a trip, a new job."}
      - {id: es3-02-que-te-mejores, type: phrase, l2: "¡Que te mejores!", l1: "Get well soon! (informal)",
         alt: ["Que te mejores pronto"]}
      - {id: es3-02-importante-sepas, type: phrase, l2: "Es importante que lo sepas.",
         l1: "It's important that you know (it). (informal)", note: "saber → sepa, sepas: fully irregular."}
      - {id: es3-02-espero-no-sea-tarde, type: phrase, l2: "Espero que no sea demasiado tarde.", l1: "I hope it isn't too late."}
      - {id: es3-02-mejor-hagamos-hoy, type: phrase, l2: "Es mejor que lo hagamos hoy.", l1: "It's better that we do it today.",
         alt: ["Es mejor que lo hagamos hoy mismo"]}
      - {id: es3-02-c1, type: cloze, text: "Espero que el examen no ___ muy difícil.", answer: "sea",
         l1: "I hope the exam isn't very difficult.", note: "ser → sea (irregular)"}
      - {id: es3-02-c2, type: cloze, text: "Espero que Luis ___ la cena esta noche.", answer: "haga", alt: ["prepare"],
         l1: "I hope Luis makes dinner tonight.", note: "hacer: hago → haga"}
      - {id: es3-02-c3, type: cloze, text: "Es necesario que tú ___ al médico.", answer: "vayas",
         l1: "It's necessary for you to go to the doctor.", note: "ir → vaya, (tú) vayas (irregular)"}
      - {id: es3-02-c4, type: cloze, text: "Espero que ___ un supermercado cerca del hotel.", answer: "haya",
         l1: "I hope there is a supermarket near the hotel.", note: "hay → haya. Spelled with y, not ll"}
      - {id: es3-02-c5, type: cloze, text: "Es importante que todos ___ la verdad.", answer: "sepan",
         l1: "It's important that everyone knows the truth.", note: "saber → sepa, (ellos) sepan", alt: ["conozcan"]}
      - {id: es3-02-c6, type: cloze, text: "Espero que ustedes ___ venir a la fiesta.", answer: "puedan",
         l1: "I hope you (plural) can come to the party.", note: "poder → pueda, (ustedes) puedan: o → ue as in the present"}
      - {id: es3-02-c7, type: cloze, text: "Ojalá mis amigos ___ tiempo el sábado.", answer: "tengan",
         l1: "I hope my friends have time on Saturday.", note: "tengo → tenga, (ellos) tengan"}
      - {id: es3-02-c8, type: cloze, text: "Quiero que me ___ tu número de teléfono, Ana.", answer: "des",
         l1: "I want you to give me your phone number, Ana.", note: "dar → dé, (tú) des. Only dé has an accent"}

  # ---------------------------------------------------------------- 3
  - id: es3-03
    title: "Feelings, doubt and opinion: me alegra que, no creo que"
    goal: "I can give my opinion, agree and disagree, and react to news with pleasure, annoyance, surprise or doubt."
    notes: |
      Whether the verb after **que** is indicative or subjunctive depends on what the first half of the sentence does.

      | First half | Mood | Example |
      | states a belief | indicative | Creo que **tiene** razón. |
      | denies or doubts | subjunctive | No creo que **tenga** razón. |
      | reacts with a feeling | subjunctive | Me alegra que **tenga** razón. |

      - **Indicative** after *creo que, pienso que, me parece que, es verdad que, estoy seguro de que*.
      - **Subjunctive** after *no creo que, no pienso que, dudo que, no es verdad que, es posible que*.
      - **Subjunctive** after feelings: *me alegro de que, me molesta que, me sorprende que, siento que, tengo miedo de que, ¡qué pena que…!*
      - With one subject, use the infinitive: *Me alegro de verte*.
      - Verbs like **molestar**, **sorprender** and **parecer** work like *gustar*: *me molesta*, *te sorprende*, *nos parece*.
      - To agree: *estoy de acuerdo*, *tienes razón*. To disagree politely: *no estoy de acuerdo*, *yo no lo veo así*.
    items:
      - {id: es3-03-opinion, type: vocab, l2: "la opinión", l1: "the opinion",
         ex: "En mi opinión, es demasiado caro.", ex_l1: "In my opinion, it's too expensive.",
         note: "Nouns ending in -ión are feminine. Plural without the accent: las opiniones."}
      - {id: es3-03-alegrarse, type: vocab, l2: "alegrarse", l1: "to be glad / to be pleased",
         ex: "Me alegro mucho de verte.", ex_l1: "I'm very glad to see you.",
         note: "alegrarse de + infinitive, or de que + subjunctive. ¡Me alegro! = I'm glad (to hear it)!"}
      - {id: es3-03-molestar, type: vocab, l2: "molestar", l1: "to bother / to annoy",
         ex: "¿Te molesta el ruido?", ex_l1: "Does the noise bother you?",
         note: "False friend: nothing to do with 'molest'. Works like gustar: me molesta."}
      - {id: es3-03-sorprender, type: vocab, l2: "sorprender", l1: "to surprise",
         ex: "Me sorprende el precio.", ex_l1: "The price surprises me.",
         note: "Works like gustar: me sorprende que + subjunctive."}
      - {id: es3-03-dudar, type: vocab, l2: "dudar", l1: "to doubt",
         ex: "Lo dudo mucho.", ex_l1: "I very much doubt it.",
         note: "dudar que + subjunctive. But no dudo que (I don't doubt) usually takes the indicative."}
      - {id: es3-03-miedo, type: vocab, l2: "el miedo", l1: "the fear",
         ex: "Mi hijo tiene miedo de los perros.", ex_l1: "My son is afraid of dogs.",
         note: "English 'is afraid' = tener miedo, like tener hambre. Also dar miedo: me da miedo volar."}
      - {id: es3-03-seguro, type: vocab, l2: "seguro", l1: "sure, certain / safe (adjective, masculine)",
         ex: "—¿Estás seguro? —Sí, segurísimo.", ex_l1: "“Are you sure?” “Yes, absolutely sure.”",
         note: "estar seguro de que + indicative. Feminine: segura."}
      - {id: es3-03-tener-razon, type: vocab, l2: "tener razón", l1: "to be right (about something)",
         ex: "Mi padre siempre quiere tener razón.", ex_l1: "My father always wants to be right.",
         note: "You 'have' reason in Spanish; never 'ser correcto' for a person."}
      - {id: es3-03-de-acuerdo, type: vocab, l2: "estar de acuerdo", l1: "to agree (to be in agreement)",
         ex: "No estoy de acuerdo con mi jefe.", ex_l1: "I don't agree with my boss.",
         note: "Not 'yo acuerdo'. On its own, ¡De acuerdo! means 'OK, agreed!'"}
      - {id: es3-03-parecer, type: vocab, l2: "parecer", l1: "to seem",
         ex: "Me parece una buena idea.", ex_l1: "It seems like a good idea to me.",
         note: "me parece que + indicative = I think that; no me parece que + subjunctive."}
      - {id: es3-03-me-alegro-estes, type: phrase, l2: "Me alegro de que estés aquí.", l1: "I'm glad you're here. (informal)",
         alt: ["Me alegra que estés aquí", "Me alegro de que estés acá"]}
      - {id: es3-03-no-creo-verdad, type: phrase, l2: "No creo que sea verdad.", l1: "I don't think it's true.",
         alt: ["No pienso que sea verdad", "No creo que sea cierto"], note: "no creo que → subjunctive. Compare: Creo que es verdad."}
      - {id: es3-03-creo-tienes-razon, type: phrase, l2: "Creo que tienes razón.", l1: "I think you're right. (informal)",
         alt: ["Pienso que tienes razón", "Me parece que tienes razón"]}
      - {id: es3-03-que-pena, type: phrase, l2: "¡Qué pena que no puedas venir!", l1: "What a shame you can't come! (informal)",
         alt: ["Qué lástima que no puedas venir"], note: "A reaction with a feeling → subjunctive (puedas)."}
      - {id: es3-03-totalmente-de-acuerdo, type: phrase, l2: "Estoy totalmente de acuerdo contigo.",
         l1: "I totally agree with you. (informal)", alt: ["Estoy completamente de acuerdo contigo"]}
      - {id: es3-03-que-te-parece, type: phrase, l2: "¿Qué te parece?", l1: "What do you think (of it)? (informal, with parecer)",
         note: "The everyday way to ask for an opinion; literally 'how does it seem to you?'"}
      - {id: es3-03-me-da-igual, type: phrase, l2: "Me da igual.", l1: "I don't mind. / It's all the same to me.",
         alt: ["Me da lo mismo", "Me es igual"], note: "Neutral when choosing between options; can sound cold as a reaction to bad news."}
      - {id: es3-03-c1, type: cloze, text: "Creo que Luis ___ razón.", answer: "tiene",
         l1: "I think Luis is right.", note: "creo que states a belief → indicative"}
      - {id: es3-03-c2, type: cloze, text: "No creo que Marta ___ razón.", answer: "tenga",
         l1: "I don't think Marta is right.", note: "no creo que expresses doubt → subjunctive"}
      - {id: es3-03-c3, type: cloze, text: "Me molesta que la gente ___ en el cine.", answer: "hable",
         l1: "It bothers me that people talk in the cinema.", note: "feeling + que → subjunctive; la gente is singular"}
      - {id: es3-03-c4, type: cloze, text: "Dudo que nosotros ___ a tiempo.", answer: "lleguemos",
         l1: "I doubt we'll arrive on time.", note: "dudar que → subjunctive; llegar → lleguemos. No future tense here"}
      - {id: es3-03-c5, type: cloze, text: "Es posible que mañana ___.", answer: "llueva",
         l1: "It's possible that it will rain tomorrow.", note: "es posible que → subjunctive; llover → llueva"}
      - {id: es3-03-c6, type: cloze, text: "Me sorprende que no lo ___, Marta.", answer: "sepas",
         l1: "I'm surprised you don't know, Marta.", note: "feeling + que → subjunctive; saber → sepas"}
      - {id: es3-03-c7, type: cloze, text: "Es verdad que Pedro ___ mucho: está siempre en la oficina.", answer: "trabaja",
         l1: "It's true that Pedro works a lot: he's always in the office.", note: "es verdad que states a fact → indicative"}
      - {id: es3-03-c8, type: cloze, text: "Tengo miedo de que mis padres se ___ conmigo.", answer: "enfaden", alt: ["enojen"],
         l1: "I'm afraid my parents will get angry with me.",
         note: "tener miedo de que → subjunctive. Latin America: se enojen"}

  # ---------------------------------------------------------------- 4
  - id: es3-04
    title: "When it happens: cuando + subjunctive, para que, hasta que"
    goal: "I can talk about work and projects and say what will happen when, as soon as or before something else does."
    notes: |
      After **cuando**, Spanish separates what is already real from what has not happened yet.

      | Time | Mood | Example |
      | habit | indicative | Cuando **llego** a casa, ceno. |
      | past | indicative | Cuando **llegué**, cené. |
      | future | subjunctive | Cuando **llegue**, cenaré. |

      - English says "when I arrive, I'll call"; Spanish needs the subjunctive: *Cuando llegue, te llamo*. Never the future tense after *cuando*.
      - The same rule applies to **en cuanto** (as soon as), **hasta que** (until) and **después de que** (after).
      - **antes de que** (before) and **para que** (so that) *always* take the subjunctive.
      - With one subject, use the infinitive: *antes de salir*, *para aprender*, *después de comer*.
      - In a question, *cuándo* (with an accent) takes the normal future: *¿Cuándo vendrás?*
      - The main clause can be a present, a future or an imperative: *Cuando puedas, llámame*.
    items:
      - {id: es3-04-en-cuanto, type: vocab, l2: "en cuanto", l1: "as soon as", alt: ["tan pronto como", "apenas"],
         ex: "En cuanto llegue, te aviso.", ex_l1: "As soon as I arrive, I'll let you know.",
         note: "+ subjunctive for the future. Latin America also says apenas."}
      - {id: es3-04-hasta-que, type: vocab, l2: "hasta que", l1: "until (+ a verb)",
         ex: "Me quedo aquí hasta que vuelvas.", ex_l1: "I'm staying here until you come back.",
         note: "hasta + noun (hasta el lunes); hasta que + verb."}
      - {id: es3-04-para-que, type: vocab, l2: "para que", l1: "so that / in order that",
         ex: "Te lo digo para que lo sepas.", ex_l1: "I'm telling you so that you know.",
         note: "Always + subjunctive. Same subject: para + infinitive."}
      - {id: es3-04-antes-de-que, type: vocab, l2: "antes de que", l1: "before (+ a verb with a different subject)", alt: ["antes que"],
         ex: "Quiero hablar contigo antes de que te vayas.", ex_l1: "I want to talk to you before you leave.",
         note: "Always + subjunctive. Same subject: antes de + infinitive."}
      - {id: es3-04-jubilarse, type: vocab, l2: "jubilarse", l1: "to retire (from work)",
         ex: "Mi padre se jubiló el año pasado.", ex_l1: "My father retired last year.",
         note: "Reflexive. Latin America also says retirarse."}
      - {id: es3-04-contrato, type: vocab, l2: "el contrato", l1: "the contract",
         ex: "Tengo un contrato de un año.", ex_l1: "I have a one-year contract."}
      - {id: es3-04-firmar, type: vocab, l2: "firmar", l1: "to sign",
         ex: "Mañana firmamos el contrato.", ex_l1: "Tomorrow we sign the contract.",
         note: "The signature is la firma. False friend: a firm (company) is una empresa."}
      - {id: es3-04-encargarse, type: vocab, l2: "encargarse de", l1: "to take care of / to be in charge of (a task)",
         ex: "Ana se encarga de los clientes.", ex_l1: "Ana takes care of the customers.",
         note: "Reflexive + de. Subjunctive: me encargue."}
      - {id: es3-04-puesto, type: vocab, l2: "el puesto", l1: "the position / the post (a job)",
         ex: "Busco un puesto con un sueldo mejor.", ex_l1: "I'm looking for a position with a better salary.",
         note: "Also a market stall. puesto is also the participle of poner."}
      - {id: es3-04-entregar, type: vocab, l2: "entregar", l1: "to hand in / to deliver",
         ex: "Tengo que entregar el proyecto el lunes.", ex_l1: "I have to hand in the project on Monday.",
         note: "Spelling: entregué, subjunctive entregue."}
      - {id: es3-04-equipo, type: vocab, l2: "el equipo", l1: "the team",
         ex: "Trabajo en un equipo de seis personas.", ex_l1: "I work in a team of six people.",
         note: "Also 'equipment'. trabajar en equipo = to work as a team."}
      - {id: es3-04-cuando-llegue, type: phrase, l2: "Cuando llegue a casa, te llamo.",
         l1: "When I get home, I'll call you. (informal)",
         alt: ["Cuando llegue a casa, te llamaré", "Te llamo cuando llegue a casa", "Te llamaré cuando llegue a casa"],
         note: "Future meaning → subjunctive after cuando. Not 'cuando llegaré'."}
      - {id: es3-04-avisame-en-cuanto, type: phrase, l2: "Avísame en cuanto sepas algo.",
         l1: "Let me know as soon as you know anything. (informal)",
         alt: ["Avísame tan pronto como sepas algo", "Avísame apenas sepas algo"]}
      - {id: es3-04-cuando-tenga-dinero, type: phrase, l2: "Cuando tenga dinero, me compraré un coche.",
         l1: "When I have money, I'll buy myself a car.",
         alt: ["Cuando tenga dinero, me voy a comprar un coche", "Cuando tenga dinero, me compraré un carro", "Cuando tenga dinero, me compro un coche"],
         note: "Latin America: un carro or un auto."}
      - {id: es3-04-para-que-entiendas, type: phrase, l2: "Te lo explico para que lo entiendas.",
         l1: "I'm explaining it to you so that you understand it. (informal)", alt: ["Te lo explico para que lo comprendas"]}
      - {id: es3-04-hasta-que-termine, type: phrase, l2: "Voy a esperar hasta que termine la reunión.",
         l1: "I'm going to wait until the meeting ends.",
         alt: ["Voy a esperar hasta que acabe la reunión", "Esperaré hasta que termine la reunión", "Voy a esperar hasta que la reunión termine"]}
      - {id: es3-04-cuando-te-jubiles, type: phrase, l2: "¿Qué vas a hacer cuando te jubiles?",
         l1: "What are you going to do when you retire? (informal)", alt: ["¿Qué harás cuando te jubiles?", "¿Qué vas a hacer cuando te retires?"]}
      - {id: es3-04-yo-me-encargo, type: phrase, l2: "Yo me encargo.", l1: "I'll take care of it. / Leave it to me.",
         alt: ["Me encargo yo", "Yo me encargo de eso", "Ya me encargo yo"],
         note: "A present tense for an offer made on the spot, where English uses 'I'll'."}
      - {id: es3-04-c1, type: cloze, text: "Cuando nosotros ___ el proyecto, iremos de vacaciones.", answer: "terminemos", alt: ["acabemos"],
         l1: "When we finish the project, we'll go on holiday.", note: "future meaning → cuando + subjunctive"}
      - {id: es3-04-c2, type: cloze, text: "Cuando yo ___ mayor, quiero vivir en el campo.", answer: "sea",
         l1: "When I'm older, I want to live in the countryside.", note: "future meaning → cuando + subjunctive of ser"}
      - {id: es3-04-c3, type: cloze, text: "Llámame antes de que ___ el tren.", answer: "salga",
         l1: "Call me before the train leaves.", note: "antes de que always takes the subjunctive; salgo → salga"}
      - {id: es3-04-c4, type: cloze, text: "Cuando ___ a Madrid, siempre visito a mis abuelos.", answer: "voy",
         l1: "When I go to Madrid, I always visit my grandparents.", note: "a habit (siempre) → cuando + indicative"}
      - {id: es3-04-c5, type: cloze, text: "Lo repito para que ustedes me ___.", answer: "entiendan", alt: ["comprendan"],
         l1: "I'm repeating it so that you (plural) understand me.", note: "para que always takes the subjunctive"}
      - {id: es3-04-c6, type: cloze, text: "No voy a firmar el contrato hasta que lo ___ mi abogado.", answer: "lea",
         l1: "I'm not going to sign the contract until my lawyer reads it.", note: "hasta que + subjunctive for something still to come"}
      - {id: es3-04-c7, type: cloze, text: "En cuanto ___ el sueldo, pagaré el alquiler.", answer: "reciba", alt: ["cobre"],
         l1: "As soon as I receive my salary, I'll pay the rent.", note: "en cuanto + subjunctive for the future; recibir → reciba"}
      - {id: es3-04-c8, type: cloze, text: "Cuando ___ a Ana ayer, estaba muy contenta.", answer: "vi",
         l1: "When I saw Ana yesterday, she was very happy.", note: "a past event → cuando + indicative (indefinido)"}

  # ---------------------------------------------------------------- 5
  - id: es3-05
    title: "Do and don't: the negative imperative and pronouns — health"
    goal: "I can tell people what to do and what not to do, and give simple advice about health and lifestyle."
    notes: |
      The **negative imperative** borrows the present subjunctive: **no** + subjunctive.

      | Person | Do it | Don't do it |
      | tú | habla / come | no hables / no comas |
      | usted | hable / coma | no hable / no coma |
      | vosotros | hablad / comed | no habléis / no comáis |
      | ustedes | hablen / coman | no hablen / no coman |

      - Only the affirmative *tú* and *vosotros* forms are special; everything else is the subjunctive.
      - Irregular *tú* commands become regular again in the negative: *di → no digas*, *haz → no hagas*, *ven → no vengas*, *pon → no pongas*.
      - **Pronouns are glued to the end of an affirmative command**: *dímelo*, *siéntate*, *cómpralo*. Add an accent to keep the stress where it was.
      - **Pronouns go before a negative command**: *no me lo digas*, *no te sientes*.
      - Reflexive *vosotros* drops the **d**: *sentaos*. Latin America uses *ustedes* for any group: *siéntense*.
    items:
      - {id: es3-05-sentarse, type: vocab, l2: "sentarse", l1: "to sit down",
         ex: "¿Puedo sentarme aquí?", ex_l1: "May I sit here?",
         note: "Stem change e → ie: me siento. Me siento is also 'I feel' (from sentirse)."}
      - {id: es3-05-cuidarse, type: vocab, l2: "cuidarse", l1: "to look after oneself / to take care of oneself",
         ex: "Mi abuela se cuida mucho.", ex_l1: "My grandmother looks after herself very well.",
         note: "cuidar (not reflexive) = to look after someone or something else."}
      - {id: es3-05-relajarse, type: vocab, l2: "relajarse", l1: "to relax",
         ex: "Los domingos me relajo en casa.", ex_l1: "On Sundays I relax at home.",
         note: "Reflexive in Spanish: not just 'relajo'."}
      - {id: es3-05-estres, type: vocab, l2: "el estrés", l1: "the stress",
         ex: "Tengo mucho estrés en el trabajo.", ex_l1: "I have a lot of stress at work.",
         note: "Spanish adds e- before s + consonant: estrés, estudiante, España. Adjective: estresado."}
      - {id: es3-05-sano, type: vocab, l2: "sano", l1: "healthy (adjective, masculine)", alt: ["saludable"],
         ex: "Es importante comer sano.", ex_l1: "It's important to eat healthily.",
         note: "False friend: 'sane' is cuerdo. Feminine: sana."}
      - {id: es3-05-dejar-de, type: vocab, l2: "dejar de", l1: "to stop / to give up (doing something)",
         ex: "He dejado de fumar.", ex_l1: "I have stopped smoking.",
         note: "dejar de + infinitive, never a gerund: not 'dejar fumando'."}
      - {id: es3-05-hacer-ejercicio, type: vocab, l2: "hacer ejercicio", l1: "to exercise / to do exercise",
         ex: "Hago ejercicio tres veces a la semana.", ex_l1: "I exercise three times a week.",
         note: "No article. Not 'ejercitar'."}
      - {id: es3-05-evitar, type: vocab, l2: "evitar", l1: "to avoid",
         ex: "Hay que evitar el estrés.", ex_l1: "You have to avoid stress."}
      - {id: es3-05-olvidar, type: vocab, l2: "olvidar", l1: "to forget", alt: ["olvidarse"],
         ex: "No olvides tomar la pastilla.", ex_l1: "Don't forget to take the pill.",
         note: "Also olvidarse de: no te olvides de tomar la pastilla."}
      - {id: es3-05-consejo, type: vocab, l2: "el consejo", l1: "the piece of advice",
         ex: "¿Me das un consejo?", ex_l1: "Can you give me some advice?",
         note: "Countable in Spanish: un consejo, dos consejos."}
      - {id: es3-05-no-me-digas, type: phrase, l2: "¡No me digas!", l1: "You don't say! / No way! (informal, surprise at news)",
         note: "Literally 'don't tell me'. A very common reaction to gossip or surprising news."}
      - {id: es3-05-dimelo, type: phrase, l2: "Dímelo, por favor.", l1: "Tell me (it), please. (informal)",
         note: "di + me + lo, glued together, with an accent to keep the stress on di."}
      - {id: es3-05-no-te-lo-pierdas, type: phrase, l2: "No te lo pierdas.", l1: "Don't miss it! (informal)",
         note: "Negative command → pronouns go before the verb. perderse algo = to miss out on something."}
      - {id: es3-05-sientate-aqui, type: phrase, l2: "Siéntate aquí.", l1: "Sit here. (informal)", alt: ["Siéntate acá"],
         note: "Negative: no te sientes. Formal: siéntese."}
      - {id: es3-05-no-tengas-miedo, type: phrase, l2: "No tengas miedo.", l1: "Don't be afraid. (informal)"}
      - {id: es3-05-date-prisa, type: phrase, l2: "¡Date prisa!", l1: "Hurry up! (informal)", alt: ["Apúrate", "Apresúrate"],
         note: "From darse prisa. Latin America says ¡Apúrate!"}
      - {id: es3-05-cuidate-mucho, type: phrase, l2: "Cuídate mucho.", l1: "Take good care of yourself. (informal)",
         note: "A warm way to end a call or a message."}
      - {id: es3-05-no-se-preocupe, type: phrase, l2: "No se preocupe.", l1: "Don't worry. (formal)",
         note: "You know the informal no te preocupes; this is the usted form."}
      - {id: es3-05-c1, type: cloze, text: "No ___ tanto café, Luis.", answer: "bebas", alt: ["tomes"],
         l1: "Don't drink so much coffee, Luis.", note: "negative tú command = no + subjunctive: beber → no bebas"}
      - {id: es3-05-c2, type: cloze, text: "Señor, no ___ aquí, por favor.", answer: "fume",
         l1: "Sir, don't smoke here, please.", note: "negative usted command: fumar → no fume"}
      - {id: es3-05-c3, type: cloze, text: "Niños, no ___ en la calle.", answer: "juguéis",
         l1: "Children, don't play in the street. (vosotros)", note: "jugar → no juguéis. Latin America: no jueguen"}
      - {id: es3-05-c4, type: cloze, text: "No ___ nada a mi madre, por favor, Ana.", answer: "digas",
         l1: "Don't say anything to my mother, please, Ana.", note: "di → no digas (digo → diga)"}
      - {id: es3-05-c5, type: cloze, text: "Marta, no te ___ tarde esta noche.", answer: "acuestes",
         l1: "Marta, don't go to bed late tonight.", note: "acostarse → no te acuestes: the pronoun goes before a negative command"}
      - {id: es3-05-c6, type: cloze, text: "¿El libro? ___ en la mesa, por favor, Juan.", answer: "Ponlo", alt: ["Déjalo"],
         l1: "The book? Put it on the table, please, Juan.", note: "affirmative command + pronoun in one word: pon + lo"}
      - {id: es3-05-c7, type: cloze, text: "¿Estas pastillas? No ___ tomes con alcohol.", answer: "las",
         l1: "These pills? Don't take them with alcohol.", note: "the object pronoun goes before a negative command"}
      - {id: es3-05-c8, type: cloze, text: "___ usted, por favor, señora.", answer: "Siéntese",
         l1: "Sit down, please, madam.", note: "sentarse, usted command: siente + se, with an accent"}

  # ---------------------------------------------------------------- 6
  - id: es3-06
    title: "Would and could: the conditional — travel problems"
    goal: "I can make polite requests, give advice, say what I would like, and deal with delays, cancellations and complaints."
    notes: |
      The **condicional** means "would". Add one set of endings to the whole infinitive, for -ar, -er and -ir verbs alike.

      | Pronoun | hablar | Irregular stems |
      | yo | hablaría | tener → tendría |
      | tú | hablarías | poder → podría |
      | él / ella / usted | hablaría | hacer → haría |
      | nosotros | hablaríamos | decir → diría |
      | vosotros | hablaríais | salir → saldría |
      | ellos / ustedes | hablarían | venir → vendría |

      - The irregular stems are the ones you know from the future: also *querría*, *sabría*, *pondría*, *habría*.
      - **Politeness**: *¿Podría…?*, *¿Te importaría…?*, *Me gustaría…*
      - **Advice**: *Yo que tú, hablaría con él*; *Deberías descansar*; *Podrías llamar*.
      - **Wishes**: *Me encantaría ir*.
      - English "would" for a past habit ("we would go every summer") is the imperfecto, not the condicional: *íbamos*.
      - Every form has an accent on the **í**.
    items:
      - {id: es3-06-retraso, type: vocab, l2: "el retraso", l1: "the delay", alt: ["la demora"],
         ex: "El vuelo tiene dos horas de retraso.", ex_l1: "The flight is two hours late.",
         note: "con retraso = late. Latin America also says la demora."}
      - {id: es3-06-cancelar, type: vocab, l2: "cancelar", l1: "to cancel",
         ex: "Tengo que cancelar la reserva.", ex_l1: "I have to cancel the booking."}
      - {id: es3-06-averia, type: vocab, l2: "la avería", l1: "the breakdown (of a car or machine)",
         ex: "Tuvimos una avería cerca de Burgos.", ex_l1: "We had a breakdown near Burgos.",
         note: "estar averiado = to be out of order. Latin America often says descompuesto."}
      - {id: es3-06-huelga, type: vocab, l2: "la huelga", l1: "the strike (workers stop working)",
         ex: "Mañana hay huelga de trenes.", ex_l1: "There is a train strike tomorrow.",
         note: "estar en huelga = to be on strike. The h is silent."}
      - {id: es3-06-quejarse, type: vocab, l2: "quejarse", l1: "to complain",
         ex: "Mi vecino se queja del ruido.", ex_l1: "My neighbour complains about the noise.",
         note: "Always reflexive; quejarse de = to complain about."}
      - {id: es3-06-reclamacion, type: vocab, l2: "la reclamación", l1: "the (formal) complaint / the claim", alt: ["el reclamo", "la queja"],
         ex: "Escribí una reclamación al hotel.", ex_l1: "I wrote a complaint to the hotel.",
         note: "In Spain every business must have an hoja de reclamaciones. Latin America: el reclamo."}
      - {id: es3-06-mostrador, type: vocab, l2: "el mostrador", l1: "the counter / the desk (in an airport or shop)",
         ex: "Pregunte en el mostrador, por favor.", ex_l1: "Ask at the desk, please."}
      - {id: es3-06-facturar, type: vocab, l2: "facturar", l1: "to check in (luggage at the airport)", alt: ["documentar", "despachar"],
         ex: "Quiero facturar dos maletas.", ex_l1: "I want to check in two suitcases.",
         note: "Spain. Mexico says documentar; other countries despachar or registrar."}
      - {id: es3-06-seguro, type: vocab, l2: "el seguro", l1: "the insurance",
         ex: "¿Tienes seguro de viaje?", ex_l1: "Do you have travel insurance?",
         note: "The noun; as an adjective seguro means sure or safe."}
      - {id: es3-06-hacer-cola, type: vocab, l2: "hacer cola", l1: "to queue / to stand in line", alt: ["hacer fila"],
         ex: "Hicimos cola durante una hora.", ex_l1: "We queued for an hour.",
         note: "Latin America often says hacer fila."}
      - {id: es3-06-me-gustaria-cambiar, type: phrase, l2: "Me gustaría cambiar el billete.",
         l1: "I would like to change my ticket. (a travel ticket)",
         alt: ["Me gustaría cambiar el boleto", "Me gustaría cambiar el pasaje", "Quisiera cambiar el billete", "Me gustaría cambiar mi billete"],
         note: "Latin America: el boleto or el pasaje."}
      - {id: es3-06-podria-ayudarme, type: phrase, l2: "¿Podría ayudarme, por favor?", l1: "Could you help me, please? (formal)",
         alt: ["¿Me podría ayudar, por favor?"], note: "Softer than ¿Puede ayudarme?"}
      - {id: es3-06-yo-que-tu, type: phrase, l2: "Yo que tú, hablaría con el jefe.", l1: "If I were you, I'd talk to the boss. (informal)",
         alt: ["Yo en tu lugar, hablaría con el jefe", "Si yo fuera tú, hablaría con el jefe", "Si fuera tú, hablaría con el jefe", "Yo que tú hablaría con el jefe"],
         note: "Yo que tú + condicional is the everyday way to give advice."}
      - {id: es3-06-te-importaria, type: phrase, l2: "¿Te importaría cerrar la ventana?",
         l1: "Would you mind closing the window? (informal)", alt: ["¿Te importa cerrar la ventana?"]}
      - {id: es3-06-han-cancelado, type: phrase, l2: "Han cancelado mi vuelo.", l1: "My flight has been cancelled. (they have cancelled it)",
         alt: ["Me han cancelado el vuelo", "Cancelaron mi vuelo", "Me cancelaron el vuelo"],
         note: "Spanish prefers 'they have cancelled' to an English-style passive."}
      - {id: es3-06-poner-reclamacion, type: phrase, l2: "Quiero poner una reclamación.", l1: "I want to make a formal complaint.",
         alt: ["Quiero hacer una reclamación", "Quiero presentar una reclamación", "Quiero poner un reclamo", "Quiero presentar un reclamo"]}
      - {id: es3-06-me-encantaria, type: phrase, l2: "Me encantaría, pero no puedo.", l1: "I'd love to, but I can't."}
      - {id: es3-06-lleva-retraso, type: phrase, l2: "El tren lleva una hora de retraso.", l1: "The train is running an hour late.",
         alt: ["El tren tiene una hora de retraso", "El tren viene con una hora de retraso"]}
      - {id: es3-06-c1, type: cloze, text: "Yo ___ en el campo, pero mi trabajo está en la ciudad.", answer: "viviría",
         l1: "I would live in the countryside, but my job is in the city.", note: "vivir + -ía → (yo) viviría"}
      - {id: es3-06-c2, type: cloze, text: "¿Qué ___ tú en mi lugar?", answer: "harías",
         l1: "What would you do in my place?", note: "hacer → har- (irregular stem) → (tú) harías"}
      - {id: es3-06-c3, type: cloze, text: "Nosotros ___ más, pero no tenemos dinero.", answer: "viajaríamos",
         l1: "We would travel more, but we have no money.", note: "viajar + -íamos"}
      - {id: es3-06-c4, type: cloze, text: "Perdone, ¿___ usted un momento, por favor?", answer: "tendría",
         l1: "Excuse me, would you have a moment, please?", note: "tener → tendr- → (usted) tendría: the polite conditional"}
      - {id: es3-06-c5, type: cloze, text: "Mis padres ___ que no.", answer: "dirían",
         l1: "My parents would say no.", note: "decir → dir- → (ellos) dirían"}
      - {id: es3-06-c6, type: cloze, text: "Con más tiempo, ella ___ venir.", answer: "podría",
         l1: "With more time, she could (would be able to) come.", note: "poder → podr- → (ella) podría"}
      - {id: es3-06-c7, type: cloze, text: "Me ___ vivir en el extranjero.", answer: "gustaría", alt: ["encantaría"],
         l1: "I would like to live abroad.", note: "me gustaría + infinitive = I would like to"}
      - {id: es3-06-c8, type: cloze, text: "¿Vosotros ___ de casa sin paraguas con esta lluvia?", answer: "saldríais",
         l1: "Would you (plural, informal) leave the house without an umbrella in this rain?",
         note: "salir → saldr- → (vosotros) saldríais. Latin America: ustedes saldrían"}

  # ---------------------------------------------------------------- 7
  - id: es3-07
    title: "What had happened: the pluscuamperfecto — telling anecdotes"
    goal: "I can tell an anecdote and make clear what had already happened before something else in the past."
    notes: |
      The **pluscuamperfecto** is the "past of the past": English "had done". Use the imperfecto of **haber** plus a past participle.

      | Pronoun | haber | + participle |
      | yo | había | llegado |
      | tú | habías | comido |
      | él / ella / usted | había | salido |
      | nosotros | habíamos | llegado |
      | vosotros | habíais | comido |
      | ellos / ustedes | habían | salido |

      - It marks the earlier of two past actions: *Cuando llegué, el tren ya había salido*.
      - Typical partners: *ya*, *todavía no*, *nunca*, *antes*.
      - Nothing goes between *haber* and the participle: *ya lo había visto*, *se habían ido*.
      - More irregular participles: *abierto* (abrir), *roto* (romper), *muerto* (morir), *vuelto* (volver), *puesto* (poner), *dicho* (decir).
      - *yo* and *él* share the form **había**; add the pronoun if it is not clear who you mean.
      - In a story: the indefinido moves the action on, the imperfecto paints the scene, the pluscuamperfecto looks back.
    items:
      - {id: es3-07-darse-cuenta, type: vocab, l2: "darse cuenta", l1: "to realise / to notice",
         ex: "No me di cuenta de la hora.", ex_l1: "I didn't notice the time.",
         note: "darse cuenta de (que). False friend: realizar means to carry out, not to realise."}
      - {id: es3-07-acordarse, type: vocab, l2: "acordarse", l1: "to remember (reflexive, takes de)",
         ex: "No me acuerdo de su nombre.", ex_l1: "I don't remember his name.",
         note: "acordarse de algo = recordar algo. Stem change o → ue: me acuerdo."}
      - {id: es3-07-tardar, type: vocab, l2: "tardar", l1: "to take (a length of time) / to be long",
