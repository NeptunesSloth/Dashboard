  # ---------------------------------------------------------------- 8
  - id: es3-08
    title: "If…: real and imagined conditions — society and environment"
    goal: "I can say what happens if something is the case and what I would do if things were different."
    notes: |
      Spanish has two everyday kinds of **si** sentence.

      | Kind | si + … | Result | Example |
      | real, possible | presente | presente / futuro / imperativo | Si **llueve**, me quedo. |
      | imagined, unlikely | imperfecto de subjuntivo | condicional | Si **tuviera** dinero, viajaría. |

      - Never put the future, the conditional or the present subjunctive straight after *si*: not *si tendré*, not *si tenga*.
      - Build the **imperfecto de subjuntivo** from the *ellos* form of the indefinido: drop **-ron**, add **-ra**: *tuvieron → tuviera*, *hablaron → hablara*, *fueron → fuera*.
      - The ones you will hear most: **tuviera**, **fuera** (ser and ir), **pudiera**, **estuviera**, **supiera**, **hubiera**.
      - Endings: *-ra, -ras, -ra, -ramos, -rais, -ran*; the *nosotros* form takes an accent: *tuviéramos*.
      - A second set in **-se** (*tuviese*, *fuese*) means exactly the same.
      - The two halves can swap places: *Viajaría más si tuviera tiempo*.
    items:
      - {id: es3-08-medio-ambiente, type: vocab, l2: "el medio ambiente", l1: "the environment (nature)",
         ex: "Hay que cuidar el medio ambiente.", ex_l1: "We must look after the environment.",
         note: "Two words. Your surroundings in general are el entorno."}
      - {id: es3-08-reciclar, type: vocab, l2: "reciclar", l1: "to recycle",
         ex: "En casa reciclamos todo el plástico.", ex_l1: "At home we recycle all the plastic."}
      - {id: es3-08-basura, type: vocab, l2: "la basura", l1: "the rubbish / the garbage",
         ex: "¿Puedes sacar la basura?", ex_l1: "Can you take the rubbish out?",
         note: "sacar la basura = to take the rubbish out. Not used in the plural."}
      - {id: es3-08-cambio-climatico, type: vocab, l2: "el cambio climático", l1: "climate change",
         ex: "El cambio climático es un problema muy serio.", ex_l1: "Climate change is a very serious problem.",
         note: "Spanish needs the article when you talk about something in general."}
      - {id: es3-08-ahorrar, type: vocab, l2: "ahorrar", l1: "to save (money, energy, time)",
         ex: "Estoy ahorrando para comprar un piso.", ex_l1: "I'm saving up to buy a flat.",
         note: "To save a person is salvar; to save a file is guardar."}
      - {id: es3-08-gastar, type: vocab, l2: "gastar", l1: "to spend (money) / to use up",
         ex: "Gasto demasiado en ropa.", ex_l1: "I spend too much on clothes.",
         note: "You gastar money but pasar time."}
      - {id: es3-08-gobierno, type: vocab, l2: "el gobierno", l1: "the government",
         ex: "El gobierno quiere subir los precios.", ex_l1: "The government wants to raise prices."}
      - {id: es3-08-paro, type: vocab, l2: "el paro", l1: "unemployment (with its article)", alt: ["el desempleo"],
         ex: "Mi hermano está en paro.", ex_l1: "My brother is unemployed.",
         note: "estar en paro = to be out of work. Latin America, and formal Spanish everywhere, says el desempleo."}
      - {id: es3-08-vivienda, type: vocab, l2: "la vivienda", l1: "housing / the home (as a social issue)",
         ex: "El precio de la vivienda sube todos los años.", ex_l1: "The price of housing goes up every year."}
      - {id: es3-08-proteger, type: vocab, l2: "proteger", l1: "to protect",
         ex: "Esta ley protege a los animales.", ex_l1: "This law protects animals.",
         note: "Spelling: yo protejo, subjunctive proteja."}
      - {id: es3-08-si-puedo, type: phrase, l2: "Si puedo, te ayudo.", l1: "If I can, I'll help you. (informal)",
         alt: ["Si puedo, te ayudaré", "Te ayudo si puedo"], note: "A real condition: si + present. Never 'si podré'."}
      - {id: es3-08-si-tuviera-tiempo, type: phrase, l2: "Si tuviera más tiempo, viajaría más.",
         l1: "If I had more time, I would travel more.", alt: ["Si tuviese más tiempo, viajaría más", "Viajaría más si tuviera más tiempo"]}
      - {id: es3-08-si-yo-fuera-tu, type: phrase, l2: "Si yo fuera tú, no lo haría.", l1: "If I were you, I wouldn't do it. (informal, with si)",
         alt: ["Si fuera tú, no lo haría", "Si yo fuese tú, no lo haría", "Si fuese tú, no lo haría"]}
      - {id: es3-08-loteria, type: phrase, l2: "¿Qué harías si te tocara la lotería?",
         l1: "What would you do if you won the lottery? (informal)",
         alt: ["¿Qué harías si ganaras la lotería?", "¿Qué harías si te tocase la lotería?", "¿Qué harías si te ganaras la lotería?"],
         note: "tocarle a alguien la lotería: the prize 'falls to' you. Latin America also says ganarse la lotería."}
      - {id: es3-08-si-llueve, type: phrase, l2: "Si llueve, nos quedamos en casa.", l1: "If it rains, we'll stay at home.",
         alt: ["Si llueve, nos quedaremos en casa", "Nos quedamos en casa si llueve"]}
      - {id: es3-08-si-pudiera, type: phrase, l2: "Si pudiera, viviría cerca del mar.", l1: "If I could, I would live near the sea.",
         alt: ["Si pudiese, viviría cerca del mar"]}
      - {id: es3-08-cuidar-planeta, type: phrase, l2: "Tenemos que cuidar el planeta.", l1: "We have to look after the planet.",
         alt: ["Debemos cuidar el planeta", "Tenemos que cuidar del planeta"], note: "el planeta is masculine although it ends in -a."}
      - {id: es3-08-c1, type: cloze, text: "Si ___ tiempo mañana, te llamo.", answer: "tengo",
         l1: "If I have time tomorrow, I'll call you.", note: "real condition: si + present indicative"}
      - {id: es3-08-c2, type: cloze, text: "Si ___ dinero, compraría una casa.", answer: "tuviera", alt: ["tuviese"],
         l1: "If I had money, I would buy a house.", note: "imagined condition: si + imperfecto de subjuntivo (tuvieron → tuviera)"}
      - {id: es3-08-c3, type: cloze, text: "Si yo ___ más joven, aprendería a bailar.", answer: "fuera", alt: ["fuese"],
         l1: "If I were younger, I would learn to dance.", note: "ser: fueron → fuera"}
      - {id: es3-08-c4, type: cloze, text: "Si no reciclamos, ___ más basura.", answer: "habrá",
         l1: "If we don't recycle, there will be more rubbish.", note: "real condition → the result can be in the future: hay → habrá"}
      - {id: es3-08-c5, type: cloze, text: "Si ___ a Madrid, ven a verme.", answer: "vienes",
         l1: "If you come to Madrid, come and see me.", note: "real condition: si + present, result in the imperative"}
      - {id: es3-08-c6, type: cloze, text: "Si ___ hablar bien español, trabajaría en Chile.", answer: "supiera", alt: ["supiese"],
         l1: "If I knew how to speak Spanish well, I would work in Chile.", note: "saber: supieron → supiera"}
      - {id: es3-08-c7, type: cloze, text: "Si todos usáramos menos el coche, ___ menos contaminación.", answer: "habría",
         l1: "If we all used the car less, there would be less pollution.", note: "imagined condition → result in the conditional: hay → habría"}
      - {id: es3-08-c8, type: cloze, text: "Si ___ en la playa ahora, estaría más contento.", answer: "estuviera", alt: ["estuviese"],
         l1: "If I were at the beach now, I would be happier.", note: "estar: estuvieron → estuviera"}

  # ---------------------------------------------------------------- 9
  - id: es3-09
    title: "The one that…: relative clauses — books, films and art"
    goal: "I can describe people, places and things with que, quien, donde and lo que, and talk about a book, film or exhibition."
    notes: |
      A relative clause adds information about a noun. English often drops "that"; Spanish **never** drops **que**: *el libro que leo* = "the book I'm reading".

      | Word | Use | Example |
      | que | people and things | la chica **que** vive aquí |
      | quien / quienes | people, after a preposition | el amigo con **quien** vivo |
      | donde | places | el bar **donde** quedamos |
      | lo que | "what", "the thing that" | No sé **lo que** quiere. |
      | el que / la que | "the one that" | Me gusta **la que** es azul. |

      - A preposition can never be left at the end as in English. It goes in front: *la película de la que te hablé* = "the film I told you about".
      - After a preposition, things take **el que / la que / los que / las que**; people can take those or **quien**.
      - **lo que** refers to an idea, not to a noun: *Lo que necesito es dormir*.
      - If the person or thing is not yet known to exist, use the subjunctive: *Busco un piso que tenga terraza*.
    items:
      - {id: es3-09-entrada, type: vocab, l2: "la entrada", l1: "the ticket (for a concert, film or museum) / the entrance",
         alt: ["el boleto", "el ticket"],
         ex: "He comprado dos entradas para el concierto.", ex_l1: "I have bought two tickets for the concert.",
         note: "Spain: entrada for events, billete for transport. Latin America uses el boleto for both."}
      - {id: es3-09-obra, type: vocab, l2: "la obra", l1: "the play (theatre) / the work (of art)", alt: ["la obra de teatro"],
         ex: "Vimos una obra muy divertida.", ex_l1: "We saw a very funny play.",
         note: "In full, la obra de teatro. en obras = under construction."}
      - {id: es3-09-novela, type: vocab, l2: "la novela", l1: "the novel",
         ex: "Estoy leyendo una novela que me encanta.", ex_l1: "I'm reading a novel that I love.",
         note: "In Latin America la novela is also a TV soap (la telenovela)."}
      - {id: es3-09-escritor, type: vocab, l2: "el escritor", l1: "the writer (male)",
         ex: "Es un escritor que vivió en París.", ex_l1: "He is a writer who lived in Paris.",
         note: "Feminine: la escritora."}
      - {id: es3-09-cuadro, type: vocab, l2: "el cuadro", l1: "the painting / the picture (on a wall)",
         ex: "Ese cuadro es de Picasso.", ex_l1: "That painting is by Picasso.",
         note: "'By' an artist or author is de, not por."}
      - {id: es3-09-exposicion, type: vocab, l2: "la exposición", l1: "the exhibition",
         ex: "Fuimos a una exposición de fotos.", ex_l1: "We went to a photo exhibition.",
         note: "False friend: exhibición exists but usually means a display or show."}
      - {id: es3-09-personaje, type: vocab, l2: "el personaje", l1: "the character (in a story or film)",
         ex: "Mi personaje favorito es la abuela.", ex_l1: "My favourite character is the grandmother.",
         note: "Masculine even for a woman (-aje). carácter means personality."}
      - {id: es3-09-cancion, type: vocab, l2: "la canción", l1: "the song",
         ex: "¿Cómo se llama esta canción?", ex_l1: "What is this song called?",
         note: "Plural without the accent: las canciones."}
      - {id: es3-09-argumento, type: vocab, l2: "el argumento", l1: "the plot (of a book or film)", alt: ["la trama"],
         ex: "El argumento es muy sencillo.", ex_l1: "The plot is very simple.",
         note: "Also a reason in a debate, but never a quarrel: that is una discusión."}
      - {id: es3-09-tratar-de, type: vocab, l2: "tratar de", l1: "to be about (a book, a film) / to try to",
         ex: "La película trata de una familia.", ex_l1: "The film is about a family.",
         note: "tratar de + noun = to be about; tratar de + infinitive = to try to."}
      - {id: es3-09-no-entiendo-lo-que, type: phrase, l2: "No entiendo lo que dices.",
         l1: "I don't understand what you're saying. (informal)", alt: ["No entiendo lo que estás diciendo", "No comprendo lo que dices"],
         note: "'what' = lo que when it is not a question. Not 'qué dices' here."}
      - {id: es3-09-pelicula-de-la-que, type: phrase, l2: "Es la película de la que te hablé.",
         l1: "It's the film I told you about. (informal)", alt: ["Esa es la película de la que te hablé", "Es la peli de la que te hablé"],
         note: "The preposition moves to the front: hablar de → de la que."}
      - {id: es3-09-lo-que-mas, type: phrase, l2: "Lo que más me gusta es el final.", l1: "What I like most is the ending.",
         alt: ["Lo que me gusta más es el final"]}
      - {id: es3-09-donde-se-come, type: phrase, l2: "Es un sitio donde se come muy bien.",
         l1: "It's a place where the food is very good. (where one eats very well)", alt: ["Es un lugar donde se come muy bien"]}
      - {id: es3-09-de-que-trata, type: phrase, l2: "¿De qué trata la novela?", l1: "What is the novel about?",
         alt: ["¿De qué va la novela?", "¿De qué se trata la novela?"], note: "Colloquial Spain: ¿De qué va?"}
      - {id: es3-09-busco-alguien-que, type: phrase, l2: "Busco a alguien que hable inglés.",
         l1: "I'm looking for someone who speaks English.",
         note: "You don't know whether such a person exists → subjunctive. Personal a before alguien."}
      - {id: es3-09-haz-lo-que-quieras, type: phrase, l2: "Haz lo que quieras.", l1: "Do whatever you want. (informal)",
         note: "Subjunctive because 'whatever' is still open. Tone decides whether it is generous or annoyed."}
      - {id: es3-09-c1, type: cloze, text: "El libro ___ estoy leyendo es muy interesante.", answer: "que",
         l1: "The book I'm reading is very interesting.", note: "que can never be left out in Spanish"}
      - {id: es3-09-c2, type: cloze, text: "Esta es la ciudad ___ nací.", answer: "donde",
         l1: "This is the city where I was born.", note: "donde for places; no accent because it is not a question"}
      - {id: es3-09-c3, type: cloze, text: "La chica con ___ vivo es de Chile.", answer: "quien",
         l1: "The girl I live with is from Chile.", note: "preposition + quien for one person; the preposition goes first"}
      - {id: es3-09-c4, type: cloze, text: "___ que necesito es un café.", answer: "Lo",
         l1: "What I need is a coffee.", note: "lo que = what / the thing that"}
      - {id: es3-09-c5, type: cloze, text: "Los amigos con ___ viajé son muy simpáticos.", answer: "quienes",
         l1: "The friends I travelled with are very nice.", note: "quien has a plural: quienes"}
      - {id: es3-09-c6, type: cloze, text: "De estas dos camisas, prefiero ___ que es azul.", answer: "la",
         l1: "Of these two shirts, I prefer the one that is blue.", note: "la que = the one that (feminine singular: camisa)"}
      - {id: es3-09-c7, type: cloze, text: "Este cuadro es ___ que más me gusta de la exposición.", answer: "el",
         l1: "This painting is the one I like most in the exhibition.", note: "el que = the one that (masculine singular: cuadro)"}
      - {id: es3-09-c8, type: cloze, text: "Necesito un piso que ___ dos habitaciones.", answer: "tenga",
         l1: "I need a flat that has two bedrooms.", note: "a flat I haven't found yet → subjunctive"}

  # ---------------------------------------------------------------- 10
  - id: es3-10
    title: "She said that…: reported speech — news and technology"
    goal: "I can pass on what someone said, asked or told me to do, and talk about news, messages and social media."
    notes: |
      To report words, use **decir que** (statements), **preguntar si / qué / dónde…** (questions) and **decir que + subjunctive** (orders).

      When the reporting verb is in the past (*dijo*, *me preguntó*), the tense moves one step back:

      | Direct speech | Reported |
      | «**Estoy** cansado.» | Dijo que **estaba** cansado. |
      | «**He** terminado.» | Dijo que **había** terminado. |
      | «**Llegué** tarde.» | Dijo que **había llegado** tarde. |
      | «**Iré** mañana.» | Dijo que **iría** al día siguiente. |

      - With a present reporting verb nothing shifts: *Dice que está cansado*.
      - *que* is never dropped: "she says she's coming" = *dice **que** viene*.
      - Questions keep their accent: *Me preguntó **dónde** vivía*. A yes/no question takes **si**.
      - An order becomes a subjunctive: *«Llámame.» → Dice que la llames*.
      - Pronouns and time words shift with the speaker: *mañana → al día siguiente*, *aquí → allí*.
      - **decir** tells information; **contar** tells a story; **hablar** never takes *que*.
    items:
      - {id: es3-10-noticia, type: vocab, l2: "la noticia", l1: "the piece of news / the news item",
         ex: "Tengo una buena noticia.", ex_l1: "I have some good news.",
         note: "Countable: una noticia. The news programme is las noticias."}
      - {id: es3-10-periodista, type: vocab, l2: "el periodista", l1: "the journalist (male)",
         ex: "Mi hermano es periodista.", ex_l1: "My brother is a journalist.",
         note: "The -ista ending never changes; only the article does: la periodista."}
      - {id: es3-10-redes-sociales, type: vocab, l2: "las redes sociales", l1: "social media / social networks",
         ex: "No uso mucho las redes sociales.", ex_l1: "I don't use social media much.",
         note: "la red = the net; la Red = the internet."}
      - {id: es3-10-pantalla, type: vocab, l2: "la pantalla", l1: "the screen",
         ex: "Paso demasiadas horas delante de una pantalla.", ex_l1: "I spend too many hours in front of a screen."}
      - {id: es3-10-mensaje, type: vocab, l2: "el mensaje", l1: "the message",
         ex: "¿Has leído mi mensaje?", ex_l1: "Have you read my message?",
         note: "Masculine, like other nouns ending in -aje."}
      - {id: es3-10-descargar, type: vocab, l2: "descargar", l1: "to download", alt: ["bajar"],
         ex: "Voy a descargar la aplicación.", ex_l1: "I'm going to download the app.",
         note: "Colloquially also bajar. To upload is subir."}
      - {id: es3-10-contrasena, type: vocab, l2: "la contraseña", l1: "the password", alt: ["la clave"],
         ex: "Necesito cambiar la contraseña.", ex_l1: "I need to change the password.",
         note: "Also la clave, especially in Latin America."}
      - {id: es3-10-contar, type: vocab, l2: "contar", l1: "to tell (a story, what happened) / to count",
         ex: "Cuéntame qué pasó.", ex_l1: "Tell me what happened.",
         note: "Stem change o → ue: cuento, cuentas. decir = to say; contar = to tell at some length."}
      - {id: es3-10-enterarse, type: vocab, l2: "enterarse", l1: "to find out / to hear about (something)",
         ex: "Me enteré ayer por las redes sociales.", ex_l1: "I found out yesterday on social media.",
         note: "enterarse de algo. Colloquial Spain: no me entero = I don't get it."}
      - {id: es3-10-segun, type: vocab, l2: "según", l1: "according to",
         ex: "Según Ana, la reunión es mañana.", ex_l1: "According to Ana, the meeting is tomorrow.",
         note: "Followed by subject pronouns: según yo, según tú (not mí, ti)."}
      - {id: es3-10-me-dijo-cansado, type: phrase, l2: "Me dijo que estaba cansado.", l1: "He told me that he was tired.",
         note: "«Estoy cansado.» → present becomes imperfecto after dijo."}
      - {id: es3-10-dice-no-puede, type: phrase, l2: "Dice que no puede venir.", l1: "She says she can't come.",
         note: "Reporting verb in the present → no tense change. que cannot be dropped."}
      - {id: es3-10-me-pregunto-si, type: phrase, l2: "Me preguntó si quería ir al cine.",
         l1: "He asked me if I wanted to go to the cinema.", note: "A yes/no question is reported with si."}
      - {id: es3-10-dijeron-llamarian, type: phrase, l2: "Dijeron que llamarían hoy.", l1: "They said they would call today.",
         alt: ["Dijeron que iban a llamar hoy"], note: "«Llamaremos.» → the future becomes the conditional."}
      - {id: es3-10-te-has-enterado, type: phrase, l2: "¿Te has enterado de la noticia?",
         l1: "Have you heard the news? (informal, with enterarse)", alt: ["¿Te enteraste de la noticia?"]}
      - {id: es3-10-dice-que-la-llames, type: phrase, l2: "Mi madre dice que la llames.",
         l1: "My mother says you should call her. (informal)", note: "A reported order → decir que + subjunctive."}
      - {id: es3-10-olvidado-contrasena, type: phrase, l2: "Se me ha olvidado la contraseña.", l1: "I've forgotten my password.",
         alt: ["He olvidado la contraseña", "Se me olvidó la contraseña", "Olvidé la contraseña", "Me he olvidado de la contraseña", "He olvidado mi contraseña"],
         note: "se me ha olvidado: literally 'it has forgotten itself on me' — the natural, blame-free way to say it."}
      - {id: es3-10-te-mando-mensaje, type: phrase, l2: "Te mando un mensaje luego.", l1: "I'll send you a message later. (informal)",
         alt: ["Te envío un mensaje luego", "Te mandaré un mensaje luego", "Luego te mando un mensaje", "Te mando un mensaje más tarde", "Te mando un mensaje después"]}
      - {id: es3-10-c1, type: cloze, text: "Ana dice ___ no tiene tiempo.", answer: "que",
         l1: "Ana says she doesn't have time.", note: "decir que: the que is obligatory"}
      - {id: es3-10-c2, type: cloze, text: "«Estoy enfermo.» → Luis dijo que ___ enfermo.", answer: "estaba",
         l1: "“I am ill.” → Luis said that he was ill.", note: "present → imperfecto after a past reporting verb"}
      - {id: es3-10-c3, type: cloze, text: "«He terminado.» → Marta dijo que ___ terminado.", answer: "había",
         l1: "“I have finished.” → Marta said that she had finished.", note: "perfecto → pluscuamperfecto"}
      - {id: es3-10-c4, type: cloze, text: "«Iré mañana.» → Pedro dijo que ___ al día siguiente.", answer: "iría",
         l1: "“I will go tomorrow.” → Pedro said that he would go the next day.", note: "future → conditional; mañana → al día siguiente"}
      - {id: es3-10-c5, type: cloze, text: "Me preguntó ___ hablaba español.", answer: "si",
         l1: "He asked me whether I spoke Spanish.", note: "yes/no question → si (no accent)"}
      - {id: es3-10-c6, type: cloze, text: "Me preguntaron ___ vivía.", answer: "dónde",
         l1: "They asked me where I lived.", note: "a reported question word keeps its accent"}
      - {id: es3-10-c7, type: cloze, text: "El médico me dice que ___ más agua.", answer: "beba", alt: ["tome"],
         l1: "The doctor tells me to drink more water.", note: "reported order → decir que + subjunctive"}
      - {id: es3-10-c8, type: cloze, text: "«Tengo frío.» → Mi hija dijo que ___ frío.", answer: "tenía",
         l1: "“I am cold.” → My daughter said that she was cold.", note: "present → imperfecto: tengo → tenía"}

  # ---------------------------------------------------------------- 11
  - id: es3-11
    title: "How things are done: impersonal se and the passive with se"
    goal: "I can say what people in general do, what is allowed or forbidden, and understand signs and notices."
    notes: |
      Spanish avoids the English passive ("is spoken", "are sold"). The everyday tool is **se** + a verb in the third person.

      | Type | Pattern | Example |
      | impersonal | se + singular verb | Aquí **se vive** bien. |
      | passive, one thing | se + singular verb | **Se vende** piso. |
      | passive, several things | se + plural verb | **Se venden** pisos. |

      - The verb agrees with the thing: *se habla español*, *se hablan dos lenguas*.
      - With an infinitive or a clause, keep the singular: *se puede pagar*, *se dice que…*
      - It translates English "you", "one", "they" and "people": *¿Cómo se dice?* = "How do you say it?"
      - Signs: *Se alquila*, *Se busca camarero*, *Se prohíbe fumar*.
      - A plain "they" form does the same job: *Dicen que va a llover*; *Me han robado el móvil*.
      - The passive with **ser** + participle (*fue construido en 1900*) is correct but belongs mostly to newspapers and history books.
    items:
      - {id: es3-11-prohibir, type: vocab, l2: "prohibir", l1: "to forbid / to ban",
         ex: "Está prohibido fumar aquí.", ex_l1: "Smoking is forbidden here.",
         note: "Present with an accent: prohíbo, prohíbe. prohibido + infinitive on signs."}
      - {id: es3-11-permitir, type: vocab, l2: "permitir", l1: "to allow / to permit",
         ex: "No se permite entrar con perros.", ex_l1: "Dogs are not allowed in.",
         note: "permitir que + subjunctive: no permiten que entremos."}
      - {id: es3-11-ley, type: vocab, l2: "la ley", l1: "the law",
         ex: "Es una ley nueva.", ex_l1: "It is a new law.",
         note: "Plural: las leyes. Law as a subject of study is el derecho."}
      - {id: es3-11-costumbre, type: vocab, l2: "la costumbre", l1: "the custom / the habit",
         ex: "En España es costumbre cenar tarde.", ex_l1: "In Spain it is the custom to have dinner late.",
         note: "Feminine, like most nouns in -umbre. False friend: a fancy-dress costume is un disfraz."}
      - {id: es3-11-cartel, type: vocab, l2: "el cartel", l1: "the sign / the poster", alt: ["el letrero"],
         ex: "En el cartel pone «Se alquila».", ex_l1: "The sign says “For rent”.",
         note: "A text or sign 'says' with poner in Spain: ¿qué pone aquí? Latin America: ¿qué dice?"}
      - {id: es3-11-construir, type: vocab, l2: "construir", l1: "to build",
         ex: "Quieren construir un hotel aquí.", ex_l1: "They want to build a hotel here.",
         note: "Adds y: construyo, construyes; indefinido construyó, construyeron."}
      - {id: es3-11-vender, type: vocab, l2: "vender", l1: "to sell",
         ex: "Voy a vender mi coche.", ex_l1: "I'm going to sell my car.",
         note: "Se vende = For sale."}
      - {id: es3-11-multa, type: vocab, l2: "la multa", l1: "the fine (money you pay as a penalty)",
         ex: "Me pusieron una multa de cien euros.", ex_l1: "I got a hundred-euro fine.",
         note: "poner una multa = to give a fine. 'They fined me' = me pusieron una multa."}
      - {id: es3-11-votar, type: vocab, l2: "votar", l1: "to vote",
         ex: "En España se vota los domingos.", ex_l1: "In Spain people vote on Sundays.",
         note: "Don't confuse with botar (to bounce; in Latin America, to throw away)."}
      - {id: es3-11-ciudadano, type: vocab, l2: "el ciudadano", l1: "the citizen (male)",
         ex: "Todos los ciudadanos pueden votar.", ex_l1: "All citizens can vote.",
         note: "From ciudad. Feminine: la ciudadana."}
      - {id: es3-11-se-dice-mejor-bar, type: phrase, l2: "Se dice que es el mejor bar de la ciudad.",
         l1: "They say it's the best bar in town. (with se)",
         note: "se dice que / dicen que + indicative. 'In' after a superlative is de."}
      - {id: es3-11-se-habla-espanol, type: phrase, l2: "Aquí se habla español.", l1: "Spanish is spoken here.",
         alt: ["Se habla español aquí"]}
      - {id: es3-11-se-puede-pagar, type: phrase, l2: "¿Se puede pagar con tarjeta?", l1: "Can you pay by card? (impersonal: can one…)",
         note: "se puede + infinitive = it is possible / allowed."}
      - {id: es3-11-no-se-puede-aparcar, type: phrase, l2: "Aquí no se puede aparcar.", l1: "You can't park here. (impersonal)",
         alt: ["No se puede aparcar aquí", "Aquí no se puede estacionar", "No se puede estacionar aquí", "Aquí no se puede parquear"],
         note: "Spain: aparcar. Latin America: estacionar or parquear."}
      - {id: es3-11-como-se-escribe, type: phrase, l2: "¿Cómo se escribe tu apellido?", l1: "How do you spell your surname? (informal)",
         alt: ["¿Cómo se deletrea tu apellido?"], note: "Literally 'how is it written?' — the normal way to ask for a spelling."}
      - {id: es3-11-se-cena-tarde, type: phrase, l2: "En España se cena muy tarde.", l1: "In Spain people have dinner very late."}
      - {id: es3-11-se-alquila-piso, type: phrase, l2: "Se alquila piso en el centro.", l1: "Flat for rent in the centre. (a sign)",
         alt: ["Se alquila un piso en el centro", "Se alquila departamento en el centro", "Se renta departamento en el centro"],
         note: "Signs drop the article. Latin America: departamento; Mexico: se renta."}
      - {id: es3-11-c1, type: cloze, text: "En esta tienda ___ venden libros viejos.", answer: "se",
         l1: "Old books are sold in this shop.", note: "se + verb = the everyday passive"}
      - {id: es3-11-c2, type: cloze, text: "En Argentina se ___ mucha carne.", answer: "come",
         l1: "A lot of meat is eaten in Argentina.", note: "singular thing (carne) → singular verb"}
      - {id: es3-11-c3, type: cloze, text: "En mi empresa se ___ dos idiomas: inglés y español.", answer: "hablan",
         l1: "Two languages are spoken in my company: English and Spanish.", note: "plural thing (dos idiomas) → plural verb"}
      - {id: es3-11-c4, type: cloze, text: "Se ___ camareros para el verano.", answer: "buscan", alt: ["necesitan"],
         l1: "Waiters wanted for the summer.", note: "plural noun (camareros) → plural verb"}
      - {id: es3-11-c5, type: cloze, text: "¿Cómo se ___ «thank you» en español?", answer: "dice",
         l1: "How do you say “thank you” in Spanish?", note: "impersonal se: 'how does one say'"}
      - {id: es3-11-c6, type: cloze, text: "Esta casa se ___ en 1900.", answer: "construyó",
         l1: "This house was built in 1900.", note: "passive with se in the indefinido: construir → construyó"}
      - {id: es3-11-c7, type: cloze, text: "No se ___ cuándo empezará la huelga.", answer: "sabe",
         l1: "It is not known when the strike will start.", note: "se + singular verb before a clause"}
      - {id: es3-11-c8, type: cloze, text: "Las entradas se ___ por internet.", answer: "venden",
         l1: "The tickets are sold online.", note: "plural subject (las entradas) → plural verb"}

  # ---------------------------------------------------------------- 12
  - id: es3-12
    title: "Keeping the conversation going: connectors, fillers and idioms"
    goal: "I can link my ideas when I argue or tell a story, and sound natural with the little words Spaniards use all the time."
    notes: |
      **Connectors** turn separate sentences into an argument.

      | Job | Connector | English |
      | contrast | sin embargo / en cambio | however / on the other hand |
      | concession | aunque / a pesar de | although / in spite of |
      | result | por lo tanto / así que | therefore / so |
      | addition | además | besides, what's more |
      | rephrasing | o sea / es decir | I mean / that is |
      | excuse | es que… | the thing is… |

      - **aunque** + indicative for a fact (*aunque llueve* = although it is raining); + subjunctive for "even if" (*aunque llueva*).
      - **a pesar de** + noun or infinitive; *a pesar de que* + verb.
      - **es que** softens an excuse or a "no": *Es que no puedo*.

      **Fillers** buy you time and make you sound natural: **pues** (well…), **bueno** (well / OK), **a ver** (let's see), **vale** (OK, Spain), **la verdad** (to be honest). Short reactions: **¡Qué va!** (no way), **depende** (it depends), **¿en serio?** (really?).

      Latin America rarely says *vale*: you will hear *dale*, *bueno*, *listo* or *está bien*.
    items:
      - {id: es3-12-sin-embargo, type: vocab, l2: "sin embargo", l1: "however / nevertheless", alt: ["no obstante"],
         ex: "Es caro; sin embargo, me gusta.", ex_l1: "It's expensive; however, I like it.",
         note: "Slightly formal; in speech pero does most of the work. Set off by commas."}
      - {id: es3-12-aunque, type: vocab, l2: "aunque", l1: "although / even though",
         ex: "Aunque estoy cansado, voy a salir.", ex_l1: "Although I'm tired, I'm going to go out.",
         note: "+ indicative for a fact; + subjunctive for 'even if': aunque esté cansado."}
      - {id: es3-12-por-lo-tanto, type: vocab, l2: "por lo tanto", l1: "therefore / so (formal connector)", alt: ["por tanto", "por eso", "por consiguiente"],
         ex: "No ha estudiado; por lo tanto, no va a aprobar.", ex_l1: "He hasn't studied; therefore, he isn't going to pass.",
         note: "In speech, así que is more common: no ha estudiado, así que…"}
      - {id: es3-12-en-cambio, type: vocab, l2: "en cambio", l1: "on the other hand / whereas (contrasting two things)",
         ex: "A mí me gusta el mar; a mi mujer, en cambio, la montaña.", ex_l1: "I like the sea; my wife, on the other hand, likes the mountains.",
         note: "Contrasts two different subjects. Not 'in exchange' (that is a cambio)."}
      - {id: es3-12-ademas, type: vocab, l2: "además", l1: "besides / what's more / in addition",
         ex: "Es tarde y, además, estoy cansado.", ex_l1: "It's late and, besides, I'm tired.",
         note: "además de + noun or infinitive = as well as."}
      - {id: es3-12-a-pesar-de, type: vocab, l2: "a pesar de", l1: "in spite of / despite", alt: ["pese a"],
         ex: "Salimos a pesar de la lluvia.", ex_l1: "We went out in spite of the rain.",
         note: "+ noun or infinitive; a pesar de que + a verb."}
      - {id: es3-12-o-sea, type: vocab, l2: "o sea", l1: "I mean / in other words (spoken)", alt: ["es decir"],
         ex: "Es mi cuñado, o sea, el marido de mi hermana.", ex_l1: "He's my brother-in-law, I mean, my sister's husband.",
         note: "Two words, never 'osea'. The more formal version is es decir."}
      - {id: es3-12-pues, type: vocab, l2: "pues", l1: "well… (filler at the start of an answer)",
         ex: "—¿Qué quieres hacer? —Pues no sé.", ex_l1: "“What do you want to do?” “Well, I don't know.”",
         note: "The commonest Spanish filler; it commits you to nothing. Pues sí / pues no = well, yes / well, no."}
      - {id: es3-12-vale, type: vocab, l2: "vale", l1: "OK / all right (Spain)", alt: ["de acuerdo", "está bien", "dale", "okey"],
         ex: "—¿Quedamos a las ocho? —Vale.", ex_l1: "“Shall we meet at eight?” “OK.”",
         note: "Heard constantly in Spain. Latin America: dale, bueno, listo, está bien."}
      - {id: es3-12-a-ver, type: vocab, l2: "a ver", l1: "let's see (filler while you think or look)",
         ex: "A ver, ¿qué tenemos que comprar?", ex_l1: "Let's see, what do we have to buy?",
         note: "Two words. Don't confuse with haber (the verb), which sounds the same."}
      - {id: es3-12-es-que, type: phrase, l2: "Es que no tengo tiempo.", l1: "The thing is, I don't have time. (an excuse)",
         note: "es que introduces an explanation or excuse; it softens a 'no'."}
      - {id: es3-12-la-verdad, type: phrase, l2: "La verdad es que no me gusta.", l1: "To be honest, I don't like it.",
         alt: ["La verdad, no me gusta", "Sinceramente, no me gusta", "La verdad es que no me gusta nada"]}
      - {id: es3-12-que-va, type: phrase, l2: "¡Qué va!", l1: "No way! / Not at all! (spoken denial)", alt: ["Para nada"],
         note: "—¿Estás enfadado? —¡Qué va! A friendly, emphatic 'no'."}
      - {id: es3-12-depende, type: phrase, l2: "Depende.", l1: "It depends.", alt: ["Eso depende"],
         note: "With a noun it takes de, never 'en': depende del precio."}
      - {id: es3-12-bueno-me-tengo-que-ir, type: phrase, l2: "Bueno, me tengo que ir.", l1: "Well, I have to go.",
         alt: ["Bueno, tengo que irme", "Bueno, me tengo que marchar", "Bueno, tengo que marcharme"],
         note: "bueno as a filler signals a change of topic or the end of a chat."}
      - {id: es3-12-en-serio, type: phrase, l2: "¿En serio?", l1: "Seriously? / Really?", alt: ["¿De verdad?", "¿De veras?"],
         note: "The standard reaction to surprising news."}
      - {id: es3-12-no-pasa-nada, type: phrase, l2: "No pasa nada.", l1: "It doesn't matter. / No harm done. (reply to an apology)",
         alt: ["No importa", "No es nada", "No hay problema"],
         note: "Literally 'nothing happens'. The usual answer to perdón or lo siento."}
      - {id: es3-12-vale-la-pena, type: phrase, l2: "Vale la pena.", l1: "It's worth it.", alt: ["Merece la pena"],
         note: "Here vale is the verb valer (to be worth). valer la pena + infinitive: vale la pena ir."}
      - {id: es3-12-c1, type: cloze, text: "Estudia mucho; sin ___, no aprueba.", answer: "embargo",
         l1: "He studies a lot; however, he doesn't pass.", note: "sin embargo = however"}
      - {id: es3-12-c2, type: cloze, text: "___ llueve, vamos a dar un paseo.", answer: "Aunque",
         l1: "Although it's raining, we're going to go for a walk.", note: "aunque + indicative: it really is raining"}
      - {id: es3-12-c3, type: cloze, text: "A ___ del frío, fuimos a la playa.", answer: "pesar",
         l1: "In spite of the cold, we went to the beach.", note: "a pesar de + noun = in spite of"}
      - {id: es3-12-c4, type: cloze, text: "No tengo dinero; por lo ___, no puedo ir.", answer: "tanto",
         l1: "I have no money; therefore, I can't go.", note: "por lo tanto = therefore"}
      - {id: es3-12-c5, type: cloze, text: "Mi hermano es muy alto; yo, en ___, soy bajo.", answer: "cambio",
         l1: "My brother is very tall; I, on the other hand, am short.", note: "en cambio contrasts two subjects"}
      - {id: es3-12-c6, type: cloze, text: "El piso es caro y, ___, está lejos del centro.", answer: "además", alt: ["encima"],
         l1: "The flat is expensive and, what's more, it's far from the centre.", note: "además adds a second argument"}
      - {id: es3-12-c7, type: cloze, text: "Por ___, ¿has hablado con Ana?", answer: "cierto",
         l1: "By the way, have you spoken to Ana?", note: "por cierto = by the way (it changes the subject; it does not mean 'certainly')"}
      - {id: es3-12-c8, type: cloze, text: "Llego a las diez, o ___, dentro de una hora.", answer: "sea",
         l1: "I'm arriving at ten, I mean, in an hour.", note: "o sea = I mean / that is"}
