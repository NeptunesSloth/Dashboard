          - "Stop, leave the files untouched and report it to a manager"
        answer: 3
        why: "Possible misuse of regulated data is an incident: preserve the evidence and pass it to those responsible under the incident policy."
        whys:
          - "Destroys evidence of a possible breach."
          - "Alerts the user, and the investigation is not the technician's to run."
          - "Creates another uncontrolled copy of sensitive data and breaks evidence handling."
          - "Best: preserves the evidence and informs management."
      - id: ap2-4z-b15
        type: mcq
        best: true
        q: "A user asks IT to delete a seven-year-old folder of invoices to free up space. Company policy, based on tax law, requires invoices to be kept for ten years. What should the technician do?"
