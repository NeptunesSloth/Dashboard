          - "Keep a backup copy offline, out of reach of user PCs"
          - "Back up more often so less work is lost"
          - "Install anti-malware software on the NAS"
        answer: 1
        why: "Malware on a user's PC cannot reach or alter a copy that is offline or locked against change."
