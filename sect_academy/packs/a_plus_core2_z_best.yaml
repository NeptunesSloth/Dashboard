          - "A cloth dampened with warm water"
        answer: 0
        why: "A toner vacuum has a filter fine enough to trap toner and is built to collect it safely; a mask protects the lungs."
        whys:
          - "Best: traps the powder instead of spreading it, safely."
          - "Fine toner passes through ordinary filters into the air, and the dust can be ignited by the motor."
          - "Spreads fine powder through the printer and into the room."
          - "Water inside a printer is risky, and warmth makes toner smear and stick."
      - id: ap2-4z-b07
        type: mcq
        best: true
        q: "A regulator requires every user to see a notice about monitoring and authorised use before signing in to any workstation. The company has 300 domain PCs. Which method is BEST?"
