          - "Archive the employee's mailbox"
          - "Disable the employee's accounts"
          - "Forward the employee's email to their manager"
          - "Update the asset register to unassign their laptop"
        answer: 1
        why: "Cutting access at the moment of dismissal prevents misuse; the other tasks can safely follow."
        whys:
          - "Required, but can wait until access is cut."
          - "Best: removes the chance of misuse right away."
          - "Keeps business mail flowing, but can be set up after the account is disabled."
