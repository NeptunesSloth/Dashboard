  - id: ap2-3z
    title: "Best-answer practice: Software Troubleshooting"
    domain: "3"
    goal: "I can choose the fix that removes the cause of a Windows, mobile or security problem with the least disruption when several fixes would work."
    notes: |
      These questions describe a symptom and offer four fixes that would all work to some degree. Pick the one that **removes the cause with the least disruption**.

      **What to look for in Domain 3**

      - **Scope.** If one user, one app or one pairing is affected, fix that thing - not the whole profile, the phone or Windows.
      - **What the evidence names.** A log that says the disk is full, a battery screen that names an app, safe mode that stops the reboots: follow it.
      - **Root cause over symptom.** Update the leaking app instead of scheduling reboots.
      - **Least disruptive first.** Forget one network before resetting all network settings; roll back before reimaging; reset an app before a factory reset.
      - **Data first when hardware is failing.** A SMART warning means copy the data before any repair.
      - **Security symptoms come in clusters.** Protection disabled, updates and security sites blocked: malware.

      **Usual traps:** the factory reset or reinstall that would technically fix it; a change that only hides the symptom.
    items:
      - id: ap2-3z-b01
        type: mcq
        best: true
        q: "After this month's cumulative update, a line-of-business application crashes at start-up on every updated PC. The vendor confirms the conflict and promises a fix within a week; staff need the application today. Which action is BEST?"
        choices:
          - "Reinstall the application on the affected PCs"
          - "Roll each affected PC back with System Restore to last week"
          - "Uninstall that update and pause updates until the fix"
          - "Reimage the affected PCs from last month's standard image"
        answer: 2
        why: "Removing the one known cause restores the application with the least disruption, and the pause stops the update returning before the vendor's fix."
        whys:
          - "The application is not damaged; the conflict with the update remains."
          - "Would remove the update, but also undoes other recent changes and may not have a restore point on every PC."
          - "Best: targets the known cause, briefly, until the vendor fixes it."
          - "Removes the update, but at far greater effort and with loss of local changes."
      - id: ap2-3z-b02
        type: mcq
        best: true
        q: "A desktop publishing app crashes whenever one user opens it. Other users on the same PC run it normally, and reinstalling the app did not help. Which action is BEST to try next?"
        choices:
          - "Reset that user's settings for the app"
          - "Rebuild the user's whole Windows profile"
          - "Run a repair installation of Windows"
          - "Restore the PC to last week's restore point"
        answer: 0
        why: "The fault follows one user, so that user's app settings are the likely cause, and resetting them touches nothing else."
        whys:
          - "Best: the smallest change that addresses a fault confined to one user and one app."
          - "Would probably clear it too, but is far more disruptive than resetting one app's settings."
          - "Other users run the app fine, so Windows itself is not the problem."
          - "Rolls back system-wide changes, but nothing suggests a system change; the fault follows one user."
      - id: ap2-3z-b03
        type: mcq
        best: true
        q: "A backup service fails to start with a logon failure error. It runs under a dedicated domain account whose password was changed yesterday under the password policy. What is the BEST fix?"
        choices:
          - "Change the service to run as Local System"
          - "Restart the PC and try again"
          - "Reinstall the backup software"
          - "Enter the new password in the service's Log On settings"
        answer: 3
        why: "The service still holds the old password; updating it fixes the cause without changing the service's rights."
        whys:
          - "The service may start, but with far wider rights than it needs, and it may lose access to network locations."
          - "A restart does not change the stored password, so it fails the same way."
          - "Rebuilds the service, but the cause is only a stale password."
          - "Best: fixes the root cause and keeps the dedicated account."
      - id: ap2-3z-b04
        type: mcq
        best: true
        q: "Over a working day, one accounting application's memory use climbs steadily until Windows shows low-memory warnings. Closing and reopening the application clears it each time. The installed version is two releases behind. Which action BEST addresses the cause?"
        choices:
          - "Add more RAM to the PC"
          - "Install the vendor's latest version of the application"
          - "Increase the size of the page file"
          - "Schedule the PC to restart every lunchtime"
        answer: 1
        why: "Steady growth that resets when the app restarts is a memory leak in the application; only a fixed version removes it."
        whys:
          - "Delays the warnings, but the leak keeps growing into whatever memory is added."
          - "Best: targets the leaking program itself."
          - "Raises the commit limit, but the leak still grows and the PC slows as it pages."
          - "Treats the symptom; the leak returns every afternoon."
      - id: ap2-3z-b05
        type: mcq
        best: true
        q: "After a phone OS update, one banking app closes as soon as it opens. Other apps are fine, and the app store shows an update waiting for that app. What should the technician try FIRST?"
        choices:
          - "Install the waiting app update"
          - "Clear the app's data and sign in again"
          - "Uninstall and reinstall the app"
          - "Factory reset the phone"
        answer: 0
        why: "The app most likely needs its new version to work with the new OS, and updating loses nothing."
        whys:
          - "Best: the likeliest fix, and the least disruptive."
          - "May help a corrupt cache, but leaves an outdated app on the new OS."
          - "Would also fetch the new version, but loses the app's saved settings and sign-in for no gain."
          - "Far too much for one app."
      - id: ap2-3z-b06
        type: mcq
        best: true
        q: "Since a second memory module was added last week, a PC shows blue screens with a different stop code each time. No drivers have changed. What should the technician do FIRST?"
        choices:
          - "Update every device driver from the makers' websites"
          - "Run sfc /scannow"
          - "Test the memory with Windows Memory Diagnostic"
          - "Reinstall Windows"
        answer: 2
        why: "Random stop codes that began with new RAM point to faulty or mismatched memory; a memory test is quick and confirms it."
        whys:
          - "Drivers did not change, so this tests the wrong thing first."
          - "Checks system files, but varied stop codes after a RAM change point to the hardware."
          - "Best: tests the one thing that changed."
          - "Drastic, and the crashes would continue if the memory is faulty."
      - id: ap2-3z-b07
        type: mcq
