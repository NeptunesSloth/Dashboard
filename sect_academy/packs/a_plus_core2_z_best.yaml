          - "The printer manufacturer's service manual"
          - "The supplier's product page"
          - "The local council's waste-disposal guidance"
        answer: 0
        why: "The SDS is written for this product and covers storage, protective equipment and disposal."
        whys:
          - "Best: the authoritative safety document for this exact product."
          - "Explains the printer, not the hazards of this solvent."
          - "Describes the product, but is a sales page, not the safety document."
          - "Gives general rules, but not this product's specific hazards and handling."
      - id: ap2-4z-b14
