  - id: ap2-4z
    title: "Best-answer practice: Operational Procedures"
    domain: "4"
    goal: "I can choose the right next step in change, documentation, safety, compliance and customer-service situations when every option on offer is reasonable."
    notes: |
      Operational questions test **process and judgement**. The stem says which step you are at, or which duty applies.

      **What to look for in Domain 4**

      - **Where you are in the change process.** Test and plan the rollback before approval; roll back when a change fails inside its window.
      - **Backups must survive the attack.** Keep a copy offline or off-site, out of reach of user PCs.
      - **Safety first.** Unplug, then ground yourself; use a toner vacuum, not an ordinary one; the SDS is the authority for a chemical.
      - **Compliance is enforced centrally.** A notice every user must see belongs in a logon banner; retention rules beat a user's request.
      - **Incidents.** Preserve evidence and report; it is not the technician's investigation.
      - **People.** Open questions first; offer options and let the customer decide; follow up on intermittent faults; cut access at the moment of dismissal.
      - **AI output** must be checked for accuracy and bias before anyone relies on it.

      **Usual traps:** the quick fix that skips a step; relying on people to remember; the right outcome through the wrong channel.
    items:
      - id: ap2-4z-b01
        type: mcq
        best: true
        q: "After two hours, a technician solves an unusual email-profile fault that other users are likely to hit. What is the BEST way to make the fix reusable?"
        choices:
          - "Email the steps to the rest of the help-desk team"
          - "Write detailed notes in the ticket before closing it"
          - "Add the steps to the new-user setup checklist"
          - "Publish a knowledge-base article"
        answer: 3
        why: "A searchable knowledge-base article with the symptoms, cause and fix lets any technician find and repeat it."
        whys:
          - "Reaches today's team, but is hard to find later and misses new staff."
          - "Useful history, but closed tickets are hard to find when the next user calls."
          - "The checklist is for setting up new accounts, not for fixing a fault."
          - "Best: anyone can find the fix the next time the symptom appears."
      - id: ap2-4z-b02
        type: mcq
        best: true
        q: "An employee is being dismissed at a meeting at 3 p.m. today. Which off-boarding step should be done FIRST, at the time of the meeting?"
        choices:
          - "Archive the employee's mailbox"
          - "Disable the employee's accounts"
          - "Forward the employee's email to their manager"
          - "Update the asset register to unassign their laptop"
        answer: 1
        why: "Cutting access at the moment of dismissal prevents misuse; the other tasks can safely follow."
        whys:
          - "Required, but can wait until access is cut."
          - "Best: removes the chance of misuse right away."
          - "Keeps business mail flowing, but can be set up after the account is disabled."
          - "Needed for the records, and the least urgent."
      - id: ap2-4z-b03
        type: mcq
        best: true
        q: "During an approved change in the maintenance window, an update to the ordering application fails partway and the application will not start. The window ends in 30 minutes. What should the team do?"
        choices:
          - "Carry out the documented rollback plan"
          - "Keep troubleshooting until the update works"
          - "Call the vendor's support line and wait for advice"
          - "Leave it for the morning shift to finish"
        answer: 0
        why: "The rollback plan exists for exactly this, and returns a working system before the window closes."
        whys:
          - "Best: restores service within the window as planned."
          - "May succeed, but risks the system still being down when the window ends."
          - "Worth logging, but waiting may run past the window with the system down."
          - "Leaves the business without the application in working hours."
      - id: ap2-4z-b04
        type: mcq
        best: true
        q: "A technician is preparing a request to upgrade the accounting software on twenty PCs. Which of these should be done FIRST?"
        choices:
          - "Get the change board's approval"
          - "Book the change into the next maintenance window"
          - "Test it in a sandbox and write the rollback plan"
          - "Tell the accounting staff when the upgrade will happen"
        answer: 2
        why: "The change board judges risk on evidence, so testing and a rollback plan come before approval, scheduling and announcements."
        whys:
          - "Needed, but the board needs test results and a rollback plan to judge the risk."
          - "Scheduling follows approval."
          - "Best: produces the evidence every later step depends on."
          - "Users are told once the date is approved."
      - id: ap2-4z-b05
        type: mcq
        best: true
        q: "Laptop records are kept in three technicians' separate spreadsheets, and an audit could not match devices to staff or warranty dates. Which change BEST fixes this?"
        choices:
          - "Merge the three spreadsheets into one shared file"
