          - "Email the notice to all staff once a year"
          - "Add the notice to the acceptable use policy"
        answer: 1
        why: "A Group Policy logon banner shows the notice on every PC before sign-in, centrally and consistently."
        whys:
          - "Visible, but easily removed and not shown as part of signing in."
          - "Best: meets the requirement on every PC from one setting."
          - "Informs staff, but not at sign-in, as required."
          - "The policy should include it, but it is not shown at each sign-in."
      - id: ap2-4z-b08
        type: mcq
        best: true
        q: "A customer's four-year-old laptop needs a new motherboard, which will cost about 70% of the price of a comparable new laptop. What should the technician do?"
        choices:
          - "Order the motherboard, since the customer asked for a repair"
          - "Recommend a new laptop and close the repair ticket"
          - "Explain both options and costs, and let the customer decide"
          - "Ask a manager which option the company would rather sell"
        answer: 2
        why: "Offering repair and replacement options with clear costs lets the customer make an informed choice; the decision is theirs."
        whys:
          - "Honours the request, but the customer may not know a repair costs nearly as much as a replacement."
          - "May be the better deal, but the decision belongs to the customer."
          - "Best: sets clear expectations and leaves the choice with the customer."
          - "Puts the company's sales preference ahead of the customer's interest."
      - id: ap2-4z-b09
        type: mcq
        best: true
        q: "A technician has fixed a fault that used to appear only once or twice a week. Which way of finishing the job BEST serves the customer?"
        choices:
          - "Close the ticket once the fault cannot be reproduced"
          - "Ask the customer to call back if the fault returns"
          - "Email the customer the full technical log of the repair"
          - "Explain the fix simply and check back in a week"
        answer: 3
        why: "An intermittent fault cannot be proven fixed on the day; a plain explanation and a follow-up confirm the customer is satisfied."
        whys:
          - "A weekly fault will rarely reproduce on the day, so this proves little."
          - "Leaves the customer to chase a fault that may not be fixed."
          - "Documents the work, but in a form the customer may not understand, with no check that it worked."
          - "Best: the customer understands the fix, and the follow-up confirms it held."
      - id: ap2-4z-b10
        type: mcq
        best: true
        q: "A small office keeps its file server in a closed wooden cupboard. In summer it overheats and shuts itself down. It cannot be moved this year. Which action BEST addresses the cause?"
        choices:
          - "Ventilate the cupboard so hot air can escape"
          - "Clean the server's fans with compressed air every month"
          - "Set the server to shut down at a lower temperature"
          - "Prop the cupboard door open during hot weather"
        answer: 0
        why: "The cause is trapped heat; ventilating the cupboard fixes it permanently while the server stays where it is."
        whys:
          - "Best: removes the trapped heat for good."
          - "Good maintenance, but clean fans still recirculate hot air in a closed box."
          - "Protects the hardware, but makes outages more frequent."
          - "Helps, but only when someone remembers, and leaves the server exposed."
      - id: ap2-4z-b11
        type: mcq
        best: true
        q: "A technician is fitting a memory module in a desktop at a user's desk. There is no ESD mat, but the technician has a wrist strap. Which approach is BEST?"
        choices:
          - "Leave the PC plugged in but switched off, so the case stays grounded"
          - "Unplug the PC and clip the strap to bare chassis metal"
          - "Touch the metal case every few minutes while working"
          - "Rest the module on its antistatic bag until it is fitted"
        answer: 1
        why: "Power is removed for safety, and the strap keeps technician and chassis at the same potential throughout."
        whys:
          - "An older habit, but leaves mains power in the PC; safety guidance is to disconnect power first."
          - "Best: safe from mains and protected from static the whole time."
          - "Discharges static now and then, but charge builds up between touches."
          - "Sensible handling, but does nothing about the technician's own charge."
      - id: ap2-4z-b12
        type: mcq
        best: true
        q: "Workstations in a small office reboot several times a week when the lights dim briefly. Which device BEST stops this?"
