  - id: ap2-4z
    title: "Best-answer practice: Operational Procedures"
    domain: "4"
    goal: "I can choose the right next step in change, backup, safety, evidence and customer-service situations when every option on offer is reasonable."
    notes: |
      Operational questions test **process and judgement**. Every choice is something a careful technician might do; the stem says which step of a process you are at, or which duty applies.

      **What to look for in Domain 4**

      - **Where you are in the change process.** Test and plan the rollback before approval; respect a change freeze; roll back when a change fails inside its window; get end-user acceptance before closing.
      - **Backups must be proven and separated.** Test restores, keep a copy off-site, restore to an alternative location when both versions matter.
      - **Safety first.** Unplug, then ground yourself; the SDS is the authority for a chemical.
      - **Evidence and regulated data.** Document custody; follow retention rules even when a user asks otherwise.
      - **People.** Open questions before closed ones; cut access at the moment of dismissal; pilot a script before it reaches every PC.
      - **Verify what AI produces** before anyone relies on it.

      **Usual traps:** the quick fix that skips a step of the process; trusting a 'success' message; the right outcome through the wrong channel.
    items:
      - id: ap2-4z-b01
        type: mcq
        best: true
        q: "After two hours, a technician solves an unusual email-profile fault that other users are likely to hit. What is the BEST way to make the fix reusable?"
        choices:
          - "Email the steps to the rest of the help-desk team"
          - "Write detailed notes in the ticket before closing it"
          - "Add the steps to the new-user setup checklist"
          - "Publish a knowledge-base article"
        answer: 3
        why: "A searchable knowledge-base article with the symptoms, cause and fix lets any technician find and repeat it."
        whys:
          - "Reaches today's team, but is hard to find later and misses new staff."
          - "Useful history, but closed tickets are hard to find when the next user calls."
          - "The checklist is for setting up new accounts, not for fixing a fault."
          - "Best: anyone can find the fix the next time the symptom appears."
      - id: ap2-4z-b02
        type: mcq
        best: true
        q: "An employee is being dismissed at a meeting at 3 p.m. today. Which off-boarding step should be done FIRST, at the time of the meeting?"
