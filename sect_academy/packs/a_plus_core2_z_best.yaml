          - "Ask staff to report their laptop's serial number each quarter"
          - "An asset system, with an asset tag on each laptop"
        answer: 3
        why: "One asset management system links each tagged device to its user, warranty and licences, and is updated as part of the normal process."
        whys:
          - "Better than three, but a shared file has no ownership or checks and drifts again."
          - "Catches errors once a year, but records are wrong in between."
          - "Relies on staff, and still lands in an unmanaged record."
          - "Best: a single authoritative record tied to physical tags."
      - id: ap2-4z-b06
        type: mcq
        best: true
        q: "A laser printer's toner cartridge split and spilled powder over the paper path inside the printer. Which cleanup method is BEST?"
