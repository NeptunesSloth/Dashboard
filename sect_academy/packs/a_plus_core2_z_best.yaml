# Best-answer practice bank for CompTIA A+ Core 2 (220-1202).
# Every item is an mcq with best: true - all four choices are reasonable; whys explains each.
part_of: a-plus-core2
units:
  - id: ap2-1z
    title: "Best-answer practice: Operating Systems"
    domain: "1"
    goal: "I can pick the best installation, tool or configuration choice for Windows, macOS, Linux and cloud productivity tools when every option on offer is reasonable."
    notes: |
      **Every choice here is something a working technician might do.** One detail in the stem decides between them.

      **What to look for in Domain 1**

      - **The user's stated need.** Must keep apps and settings? Upgrade in place. Must still see every file? Pick the option that keeps it visible.
      - **The right tool for the OS in front of you.** Windows, macOS and Linux each have a native way; prefer it to a third-party workaround.
      - **The least effort that fully meets the need.** A built-in feature beats extra software; one central setting beats visiting every PC.
      - **Data first.** Before an upgrade, a repair or a registry edit, make sure there is a way back.
      - **Test before you trust.** Check a configuration change (fstab, a rollout) before it can break a boot or a whole site.

      **Usual traps:** a tool that shows the symptom but not the detail asked for; a fix that works but relies on people remembering; the heavy option (reimage, new hardware) when a light one meets the need.
    items:
      - id: ap2-1z-b01
        type: mcq
        best: true
        q: "A Windows 10 Pro desktop passes every Windows 11 hardware check. The user relies on fifteen installed applications and their settings, and there is no time to reinstall and reconfigure them. Which installation type BEST meets the need?"
        choices:
          - "A clean install of Windows 11 after backing up the user's data"
          - "Deploying the company's standard Windows 11 image"
          - "An in-place upgrade to Windows 11"
          - "A repair installation of Windows 10 before upgrading"
        answer: 2
        why: "An in-place upgrade keeps installed applications, settings and files, and the stem rules out rebuilding them."
        whys:
          - "Gives a tidy system, but every application would have to be reinstalled and reconfigured, which the stem rules out."
          - "Fast for new PCs, but an image replaces the user's applications and settings with the standard set."
          - "Best: the upgrade keeps applications, settings and files, and the hardware is already supported."
          - "Useful when the current install is damaged, but nothing says it is, so it only adds time."
      - id: ap2-1z-b02
        type: mcq
        best: true
        q: "A technician will upgrade a manager's laptop to Windows 11 in place. The compatibility checker passes and the manager's applications are confirmed to support Windows 11. What should the technician do FIRST?"
        choices:
          - "Back up the manager's files and user preferences"
          - "Install the latest UEFI firmware from the laptop maker"
          - "Disconnect the docking station and external peripherals"
          - "Download the Windows 11 drivers for this laptop model"
        answer: 0
        why: "Compatibility is already confirmed, so the next priority is a way back: an upgrade can fail or roll back, and only a backup protects the data."
        whys:
          - "Best: an upgrade can fail, and only a backup protects the data and preferences if it does."
          - "Often sensible, but a firmware update is itself a risk to the machine and should come after the data is safe."
          - "Reduces driver problems during setup, but protects nothing if the upgrade fails."
          - "Useful preparation, but it does not protect the data, which comes first."
      - id: ap2-1z-b03
        type: mcq
        best: true
        q: "A Windows 11 Pro for Workstations PC will hold a large mirrored Storage Spaces volume for research data. The volume will not boot Windows and needs neither EFS nor disk quotas. The priority is detecting and repairing silent data corruption automatically. Which filesystem is BEST for the volume?"
        choices:
          - "NTFS, with a weekly scheduled chkdsk scan"
          - "NTFS, with File History copying it to another disk"
          - "exFAT, so the disks can also be read on other systems"
          - "ReFS"
        answer: 3
        why: "ReFS was designed for resilience: it checksums data and, on a mirrored Storage Spaces volume, can repair a corrupt copy from the good one."
        whys:
          - "NTFS is the safe default, but chkdsk repairs filesystem structures, not silently corrupted file contents."
          - "Gives older versions to restore from, but does not detect or repair corruption by itself."
          - "Portable, but exFAT has no journaling or integrity checking at all."
          - "Best: ReFS checksums (integrity streams) let it detect corruption and repair it from the mirror's good copy."
      - id: ap2-1z-b04
        type: mcq
        best: true
        q: "A developer needs both Windows and Linux on one laptop. Her Linux work drives the GPU directly and needs full hardware performance, and she switches between them only a few times a week. Which setup is BEST?"
        choices:
          - "Run Linux in a virtual machine on Windows"
          - "Install both on separate partitions and choose at boot"
          - "Use the Windows Subsystem for Linux"
          - "Buy a second laptop just for the Linux work"
        answer: 1
        why: "Multiboot gives each OS native access to the hardware; switching a few times a week makes the reboot acceptable."
        whys:
          - "Convenient for switching, but a VM reaches the hardware through a hypervisor and loses GPU performance."
          - "Best: each OS runs natively on the hardware, and a reboot a few times a week is a small price."
          - "Handy for command-line work, but Linux runs in a lightweight VM managed by Windows, not with native control of the hardware."
          - "Also gives native performance, but spends a whole laptop to avoid a reboot a few times a week."
      - id: ap2-1z-b05
        type: mcq
        best: true
        q: "A PC's disk is constantly busy. Task Manager shows the busy process is a backup agent, and the technician now wants to see which files that process is reading and writing right now. Which tool BEST shows this?"
        choices:
          - "Task Manager's Processes tab, with the Disk column sorted"
          - "Resource Monitor's Disk tab"
          - "Performance Monitor with the PhysicalDisk counters added"
          - "Event Viewer's Application log, filtered for the backup agent"
        answer: 1
        why: "Resource Monitor's Disk tab lists the individual files each process is reading and writing, with the rate for each."
        whys:
          - "Already used: it shows how busy each process is, but not which files it is touching."
          - "Best: it lists the files each process is reading and writing, live."
          - "Records disk load over time, but per disk, not per file."
          - "May show errors from the agent, but not live file activity."
      - id: ap2-1z-b06
        type: mcq
        best: true
        q: "A PC restarted on its own overnight and the user lost unsaved work. The user asks whether Windows Update or something else caused it. Which source BEST answers the question?"
        choices:
          - "The Windows Update history page in Settings"
          - "Task Scheduler's history of tasks that ran overnight"
          - "System Information (msinfo32)"
          - "The System log in Event Viewer"
        answer: 3
        why: "The System log records who or what started a shutdown or restart, or an unexpected-shutdown entry after a crash or power loss, so it can tell the causes apart."
        whys:
          - "Shows which updates installed, but not what started the restart, so it cannot rule other causes in or out."
          - "Shows tasks that ran, but not crashes or power loss, so it only covers one possible cause."
          - "Describes hardware and software configuration, not events."
          - "Best: it records the restart, the process that started it, or an unexpected-shutdown entry if it was a crash or power cut."
      - id: ap2-1z-b07
        type: mcq
        best: true
        q: "A PC takes four minutes to boot. The technician wants to test whether a third-party service is to blame by starting Windows with every non-Microsoft service off, then turning them back on in groups. Which tool does this MOST efficiently?"
        choices:
          - "System Configuration (msconfig), hiding Microsoft services and disabling the rest"
          - "The Services console, setting each third-party service to Manual"
          - "Task Manager's Startup tab, disabling every startup item"
          - "Safe Mode, then comparing its boot time with a normal boot"
        answer: 0
        why: "msconfig's Services tab can hide Microsoft services and disable all the rest in one click, then re-enable them in groups."
        whys:
          - "Best: disables every non-Microsoft service in one step and re-enables them in groups just as easily."
          - "Achieves the same result, but one service at a time, and each original start type must be noted to undo it."
          - "Useful for slow sign-in, but it controls startup applications, not services."
          - "Shows whether a non-core component is involved, but also disables drivers and cannot be narrowed down in groups."
      - id: ap2-1z-b08
        type: mcq
        best: true
        q: "A technician must copy 300 GB of departmental folders to a new file server over a link that sometimes drops. The NTFS permissions must come across, and an interrupted copy must resume rather than restart. Which method is BEST?"
        choices:
          - "Drag the folders onto the new share in File Explorer"
          - "Back up the folders and restore the backup on the new server"
          - "robocopy with /E, /COPY:DATS and /Z"
          - "xcopy with /E and /O"
        answer: 2
        why: "robocopy copies subfolders with data, attributes, timestamps and security, and /Z restartable mode resumes a file after the link drops."
        whys:
          - "Simple, but a dropped link means starting again, and copies take the destination's permissions instead of the source's."
          - "Keeps permissions, but needs the space and time for a full backup and restore, and an interruption still restarts the job."
          - "Best: keeps the NTFS security and resumes interrupted files where they stopped."
          - "xcopy /O keeps ownership and ACLs, but it cannot resume a file part-way after the link drops."
      - id: ap2-1z-b09
        type: mcq
        best: true
        q: "A domain policy should map drive S: for the Sales team. It works for everyone except one user. The technician wants to see which Group Policy Objects were actually applied to that user on that PC. Which command BEST shows this?"
        choices:
          - "gpupdate /force"
          - "net use"
          - "whoami /groups"
          - "gpresult /r"
        answer: 3
        why: "gpresult /r lists the GPOs applied to the user and computer and those filtered out, which is exactly the question."
        whys:
          - "Reapplies policy, which may help, but does not show what was applied or why the mapping is missing."
          - "Confirms the drive is not mapped, but not which policies ran."
          - "Shows group membership, which might explain filtering, but not the policies themselves."
          - "Best: shows the applied and filtered-out GPOs for this user on this PC."
      - id: ap2-1z-b10
        type: mcq
        best: true
        q: "A cleanup script must run on a shared Windows PC at 2 a.m. every night, whether or not anyone is signed in. Which method is BEST?"
        choices:
          - "A Task Scheduler task set to run whether the user is signed in or not"
          - "A shortcut to the script in the All Users Startup folder"
          - "A Group Policy logon script that runs it"
          - "A PowerShell loop left running that sleeps until 2 a.m. each night"
        answer: 0
        why: "Task Scheduler runs a job at a set time under a chosen account, with nobody signed in."
        whys:
          - "Best: runs on schedule under a chosen account with no one signed in."
          - "Runs only when someone signs in, not at 2 a.m."
          - "Also runs at sign-in, not on a schedule."
          - "Could work, but needs a session left running and dies at the next restart or sign-out."
      - id: ap2-1z-b11
        type: mcq
        best: true
        q: "A vendor's support article says to change one registry value to fix a printing fault. System Protection is turned off on the PC by company policy. What should the technician do FIRST?"
        choices:
          - "Make the change, then restart the print spooler service"
          - "Create a restore point before editing anything"
          - "Export the registry key that holds the value"
          - "Take a full image backup of the PC"
        answer: 2
        why: "An export of the key gives a quick, exact way back, and needs no feature that policy has turned off."
        whys:
          - "Leaves no way back if the change makes things worse."
          - "The usual safety net, but System Protection is off, so no restore point can be made."
          - "Best: the exported key can be put back in seconds if the change goes wrong."
          - "Also protects the change, but takes far longer than one value needs."
      - id: ap2-1z-b12
        type: mcq
        best: true
        q: "A PC dual-boots Windows 11 and Linux. Linux often refuses to write to the Windows NTFS partition, saying Windows is hibernated, even though the user chose Shut down. Which change BEST stops this?"
        choices:
          - "Always use Restart, not Shut down, before booting into Linux"
          - "Turn off fast startup in Windows Power Options"
          - "Run chkdsk on the partition from Windows each time"
          - "Mount the NTFS partition read-only in Linux"
        answer: 1
        why: "Fast startup turns Shut down into a partial hibernation that leaves the partition in use; turning it off removes the cause."
        whys:
          - "Works, because Restart does a full shutdown, but relies on the user remembering every time."
          - "Best: removes the partial hibernation that locks the partition at every Shut down."
          - "Checks the filesystem, but the hibernated state comes back at the next Shut down."
          - "Avoids damage, but gives up the writing the user needs."
      - id: ap2-1z-b13
        type: mcq
        best: true
        q: "A 150-user domain needs a department share mapped as H: on whichever PC each user signs in to, and new PCs arrive every month. Which method is BEST?"
        choices:
          - "Run net use on each PC as it is set up for its user"
          - "A Group Policy drive map for the department's group"
          - "A how-to article so users can map the drive themselves"
          - "Folder redirection of the users' Documents folders to the share"
        answer: 1
        why: "A Group Policy drive mapping applies at every sign-in on every domain PC, new ones included, with no per-PC work."
        whys:
          - "Works per PC, but must be repeated for every PC and user, and is easily missed on new machines."
          - "Best: one central setting maps the drive everywhere the user signs in."
          - "Costs nothing to set up, but results will be inconsistent and it adds help-desk calls."
          - "Moves Documents to a server, but does not give the user an H: drive for the shared folder."
      - id: ap2-1z-b14
        type: mcq
        best: true
        q: "A Mac laptop is going in for a logic-board repair and the shop may replace its internal storage. The user wants every file, app and setting back afterwards, and has a spare external drive. What should the technician do FIRST?"
        choices:
          - "Make sure iCloud Drive has finished syncing Desktop and Documents"
          - "Copy the user's home folder to the external drive in Finder"
          - "Run a full Time Machine backup to the external drive"
          - "List the installed apps so they can be reinstalled from the App Store"
        answer: 2
        why: "A Time Machine backup can be restored with Migration Assistant, bringing back files, apps and settings together."
        whys:
          - "Protects some files, but not apps, settings or anything outside those folders."
          - "Saves the user's files, but not the apps and system settings."
          - "Best: one backup restores files, apps and settings together afterwards."
          - "Helpful, but rebuilds by hand what a full backup restores at once."
      - id: ap2-1z-b15
        type: mcq
        best: true
        q: "A consultant's MacBook holds client contracts and travels everywhere with her. The firm's worry is someone reading the data after the laptop is stolen. Which setting BEST addresses that risk?"
        choices:
          - "Turn on FileVault"
          - "Require the password immediately after sleep or the screen saver"
          - "Turn on Find My Mac"
          - "Set a long, unique login password"
        answer: 0
        why: "FileVault encrypts the startup disk with a key protected by the user's password or recovery key, so a thief cannot read the data."
        whys:
          - "Best: the disk's data stays encrypted until the right password or recovery key is entered."
          - "Protects a laptop left open, but without FileVault the data on the disk is not tied to that password."
          - "Helps locate or erase the Mac, but only once it comes online, and does not stop the data being read first."
          - "Stops casual log-ins, but without FileVault the stored data is not protected by the password."
      - id: ap2-1z-b16
        type: mcq
        best: true
        q: "A Mac application was installed from a .pkg file and added a background helper and a system extension. The user wants it removed completely. Which method is BEST?"
        choices:
          - "Drag the application from /Applications to the Trash"
          - "Remove its helper from Login Items in System Settings"
          - "Delete it from Launchpad"
          - "Run the uninstaller supplied by the developer"
        answer: 3
        why: "Only the developer's uninstaller knows every component the package installed outside the app bundle."
        whys:
          - "The usual way for a simple app, but leaves the helper and extension the .pkg placed elsewhere."
          - "Stops the helper starting, but leaves the app and its components installed."
          - "Launchpad deletion only works for App Store apps; this one came from a .pkg."
          - "Best: removes the app and everything the package put in place."
      - id: ap2-1z-b17
        type: mcq
        best: true
        q: "A Linux administrator adds a line to /etc/fstab so a new data disk mounts at boot. A mistake in that file can stop the system booting normally. What is the BEST way to check the entry before restarting?"
        choices:
          - "Reboot during a quiet period and watch the console"
          - "Run fsck on the new disk"
          - "Run 'sudo mount -a' and check the result with df"
          - "Mount the disk by hand with its device name and mount point"
        answer: 2
        why: "mount -a mounts every fstab entry not yet mounted, so a bad line shows an error now instead of at boot."
        whys:
          - "Will reveal a mistake, but by failing the boot, which is the outcome to avoid."
          - "Checks the filesystem on the disk, not the fstab line."
          - "Best: tests the fstab entry itself while the system is still running."
          - "Proves the disk can be mounted, but does not test the fstab line."
      - id: ap2-1z-b18
        type: mcq
        best: true
        q: "A junior Linux administrator must be able to install updates with apt on a shared server, and the organisation enforces least privilege. Which approach is BEST?"
        choices:
          - "A sudoers rule letting the user run only apt as root"
          - "Give the user the root password so they can use su"
          - "Add the user to the sudo group"
          - "Let the user sign in over SSH as root with a key"
        answer: 0
        why: "A narrow sudoers rule grants exactly the one command the job needs and logs each use under the user's own name."
        whys:
          - "Best: only the needed command is allowed, and each use is logged to the person."
          - "Works, but gives full root and the actions are not tied to the user."
          - "Convenient and logged, but allows every command as root, more than the task needs."
          - "Keys are strong, but this is still unrestricted root that cannot be traced to a person."
      - id: ap2-1z-b19
        type: mcq
        best: true
        q: "A server was renamed from 'files01' to 'files02'. On a Linux workstation, the technician must find every configuration file under /etc that still contains the old name. Which command is BEST?"
        choices:
          - "find /etc -name '*files01*'"
          - "grep -rl files01 /etc"
          - "ls -lR /etc | grep files01"
          - "cat /etc/hosts /etc/fstab | grep files01"
        answer: 1
        why: "grep -r searches the contents of every file under /etc, and -l lists the files that match."
        whys:
          - "Finds files whose names contain the text, not files whose contents do."
          - "Best: searches inside every file under /etc and lists those that mention the old name."
          - "Also matches only file names, from the directory listing."
          - "Checks the two likeliest files, but misses any other file that mentions the name."
      - id: ap2-1z-b20
        type: mcq
        best: true
        q: "On one Ubuntu desktop, a single internal web server's name resolves to the wrong address. Other names and other PCs are fine. What should the technician do FIRST?"
        choices:
          - "Add the correct address for the server to /etc/hosts"
          - "Point the desktop at a different DNS server"
          - "Restart the desktop to clear any cached results"
          - "Query the name with dig"
        answer: 3
        why: "Diagnose before changing anything: dig shows what DNS actually returns and from which server; if that is right, the fault is local, such as the hosts file."
        whys:
          - "Would hide the symptom, but it is a change made before the cause is known, and may cause trouble later."
          - "A change before diagnosis, and the DNS server may not be the problem at all."
          - "May clear a stale cache, but destroys the evidence of what was wrong."
          - "Best: verifies where the wrong answer comes from before anything is changed."
      - id: ap2-1z-b21
        type: mcq
        best: true
        q: "A technician must install a diagramming tool on Ubuntu workstations. The same version is in the distribution's official repository and is also offered as a .deb file on a blog. Which method is BEST?"
        choices:
          - "Install it with apt from the official repository"
          - "Download the .deb from the blog and install it with dpkg"
          - "Download the source code and compile it on each workstation"
          - "Copy the program's files over from another workstation"
        answer: 0
        why: "Repository packages are signed by a trusted source, their dependencies are resolved, and they receive updates with the rest of the system."
        whys:
          - "Best: a trusted, signed source, with dependencies handled and updates arriving automatically."
          - "Works, but the file's origin is unverified and it will not update with the system."
          - "Possible, but slow, and leaves the program outside package management."
          - "May miss dependencies, and the package system does not know it is there."
      - id: ap2-1z-b22
        type: mcq
        best: true
        q: "IT plans to roll out a new videoconferencing client to 300 staff at a site with a modest internet link. Which step BEST reduces the risk to the business?"
        choices:
          - "Confirm that every PC meets the published system requirements"
          - "Hold training sessions before the launch date"
          - "Pilot it with a small group and measure the network impact"
          - "Push it to everyone overnight so it is ready by morning"
        answer: 2
        why: "The stated risk is the modest link; a pilot measures the real network and device impact before 300 people depend on it."
        whys:
          - "Needed, but meeting the PC requirements says nothing about whether the link can carry 300 users' video."
          - "Helps adoption, but does not reduce the technical risk."
          - "Best: shows the real load on the link while only a few people are affected."
          - "Fast, but any problem hits the whole site at once."
      - id: ap2-1z-b23
        type: mcq
        best: true
        q: "A company issues Macs to staff, who buy work apps with their personal Apple IDs. When people leave, the paid apps leave with them. Which approach BEST fixes this?"
        choices:
          - "Have every employee create an Apple ID using their work email"
          - "Share one company Apple ID across all the Macs"
          - "Reimburse staff only for apps under a set price"
          - "Buy apps in volume through Apple's business programme and assign them with MDM"
        answer: 3
        why: "Volume-purchased licences belong to the company, and MDM can reclaim and reassign them when someone leaves."
        whys:
          - "Separates work from personal use, but the purchases still belong to individual accounts."
          - "Keeps purchases together, but one shared login has no accountability and does not scale."
          - "Controls cost, not who owns the licences."
          - "Best: the company owns the licences and can move them between users."
      - id: ap2-1z-b24
        type: mcq
        best: true
        q: "A team emails a budget spreadsheet back and forth, and edits keep getting lost between versions. All staff have the company's cloud productivity suite. Which change BEST solves this?"
        choices:
          - "Agree a file-naming rule with the date and editor's initials"
          - "Keep one copy in shared cloud storage and edit it together"
          - "Keep it on a network share so only one person can open it at a time"
          - "Make one person responsible for merging everyone's changes"
        answer: 1
        why: "Co-authoring one cloud file means everyone edits the same copy at once, with version history, so nothing is lost."
        whys:
          - "Makes versions easier to tell apart, but changes still have to be merged by hand."
          - "Best: a single shared file with simultaneous editing and version history."
          - "Prevents conflicting copies, but makes people wait their turn."
          - "Works, but adds a bottleneck and still loses edits if the owner misses one."
      - id: ap2-1z-b25
        type: mcq
        best: true
        q: "A user reads company mail on a laptop, a tablet and a phone. The laptop uses POP3, and messages read there vanish from the other devices. The mail server supports every common protocol. Which change is BEST?"
        choices:
          - "Switch the laptop to IMAP or the server's own sync protocol"
          - "Set the POP3 client to leave a copy of messages on the server"
          - "Forward all mail to a second mailbox for the mobile devices"
          - "Read mail only in the webmail portal on every device"
        answer: 0
        why: "With IMAP or a sync protocol, mail stays on the server and read state, folders and deletions sync across all devices."
        whys:
          - "Best: one server-side mailbox that every device sees the same way."
          - "Stops messages disappearing, but read status and folders still do not sync."
          - "Duplicates every message and splits the user's mail across two boxes."
          - "Consistent, but gives up the mail apps the user prefers."

  - id: ap2-2z
    title: "Best-answer practice: Security"
    domain: "2"
    goal: "I can pick the best security control, malware-removal step or hardening measure for a stated threat and constraint when every option is reasonable."
    notes: |
      Every choice here is a real security measure. The stem tells you **which threat, which constraint or which step** you are at.

      **What to look for in Domain 2**

      - **Match the control to the threat.** Vehicles need bollards, not guards; fileless attacks need behaviour monitoring, not file scans; a stolen VPN login needs Zero Trust, not more encryption.
      - **The malware-removal sequence.** Investigate, quarantine, disable System Restore (Home), remediate (update, scan, reimage), schedule scans and updates, re-enable System Restore, educate.
      - **Preventive beats detective** when the stem asks you to stop something.
      - **Least privilege and per-person accountability.** Shared passwords and standing admin rights lose to named, limited, removable access.
      - **Compensating controls** when the ideal fix is impossible: isolate what cannot be patched; apply the vendor's mitigation until a patch exists.
      - **Regulated data stays in your control**, even at the cost of a warranty swap.

      **Usual traps:** relying on users to remember; fixing one host when the whole class needs fixing; the strongest-sounding control that does not touch the stated threat.
    items:
      - id: ap2-2z-b01
        type: mcq
        best: true
        q: "An infected PC has been quarantined from the network. Its anti-malware definitions are three weeks old, and policy forbids reconnecting it until it is clean. What is the BEST way to update the definitions?"
        choices:
          - "Reconnect it to the LAN for the few minutes the download needs"
          - "Scan with the current definitions and update them afterwards"
          - "Fetch the offline update on a clean PC and carry it over"
          - "Connect it to a phone hotspot so it stays off the company network"
        answer: 2
        why: "Downloading the offline definition package on a clean PC and moving it on clean media updates the scanner while the infected PC stays off every network."
        whys:
          - "Quick, but breaks the quarantine policy and exposes the network."
          - "Saves time, but old definitions can miss the very malware that needs removing."
          - "Best: the definitions are current and the PC never goes back online."
          - "Keeps it off the LAN, but it is still reconnecting, which policy forbids, and lets the malware call home."
      - id: ap2-2z-b02
        type: mcq
        best: true
        q: "A company's ground-floor reception has full-height glass walls facing a car park. A risk review names a vehicle being driven into the building as the main physical threat. Which control BEST addresses it?"
        choices:
          - "A security guard posted at reception"
          - "Video surveillance covering the car park"
          - "Bollards along the front of the building"
