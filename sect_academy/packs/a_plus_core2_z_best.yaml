  - id: ap2-3z
    title: "Best-answer practice: Software Troubleshooting"
    domain: "3"
    goal: "I can choose the fix that removes the cause of a Windows, mobile or PC security problem with the least disruption when several fixes would work."
    notes: |
      Four fixes that would all work to some degree: pick the one that **removes the cause with the least disruption**.

      **What to look for in Domain 3**

      - **Scope.** If one printer, one app, one mapping or one pairing is involved, fix that thing - not the profile, the phone or Windows.
      - **What changed just before.** A firmware tweak, a new keyboard app, a fixed IP from a home guide: undo or test the change first.
      - **What the evidence names.** A log naming a blocked file, a timeout waiting for the network, safe mode that stops the reboots: follow it.
      - **Least disruptive first.** Remove one pairing before resetting network settings; repair one program before resetting the PC; reset before reimage.
      - **Data first when hardware is failing.** A SMART warning means copy the data before any repair.
      - **Security tools cause faults too.** A false positive or two competing firewalls is fixed narrowly, never by switching protection off.
      - **Contain before you clean** when data may be leaving.

      **Usual traps:** the reset that would technically fix it; a change that only hides the symptom.
    items:
      - id: ap2-3z-b01
        type: mcq
        best: true
        q: "An older line-of-business installer stops with a message that it needs .NET Framework 3.5. The PC runs Windows 11, and the vendor confirms the application is supported there. Which action is BEST?"
        choices:
          - "Run the installer in compatibility mode for Windows 7"
          - "Install a .NET 3.5 package downloaded from a third-party site"
          - "Turn on .NET Framework 3.5 in Windows Features"
          - "Install the application in a Windows 10 virtual machine instead"
        answer: 2
        why: ".NET Framework 3.5 ships with Windows 11 as an optional feature, so turning it on supplies the missing component from a trusted source."
        whys:
          - "Changes how the installer sees Windows, but does not supply the missing component."
          - "Supplies it, but from an untrusted source, when Windows already includes it."
          - "Best: the built-in optional feature provides exactly what the installer needs."
          - "Works, but builds a whole VM to supply one built-in component."
      - id: ap2-3z-b02
        type: mcq
        best: true
        q: "An accounting program crashes every time a user prints to one particular printer. Printing to any other printer from the same program works, and the program is fully up to date. Which action is BEST?"
        choices:
          - "Update or reinstall that printer's driver"
          - "Reinstall the accounting program"
          - "Run sfc /scannow"
          - "Create a new Windows profile for the user"
        answer: 0
        why: "The crash follows one printer, so that printer's driver is the likely cause."
        whys:
          - "Best: targets the one component the evidence points to."
          - "The program prints to every other printer, so it is unlikely to be damaged."
          - "Checks Windows system files, but the evidence points to one third-party driver."
          - "The fault follows the printer, not the user."
