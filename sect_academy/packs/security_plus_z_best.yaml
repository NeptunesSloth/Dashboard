          - "Best: automatic rotation, no human-known password, and nothing to administer."
      - id: sp-3z-b09
        type: mcq
        best: true
        q: "An employee has moved through four departments in six years and still holds the access from every one. Which control BEST prevents this happening again?"
        choices:
          - "Manager approval for every new access request"
