  - id: sp-4z
    title: "Best-answer practice: Security Operations"
    domain: "4"
    goal: "I can choose the right first step, next step and best operational control in incident, vulnerability, monitoring and identity scenarios where every option is plausible."
    notes: |
      Operations questions reward **process order** and **fit to the constraint**.

      **FIRST and NEXT.** Know the sequences and place the scenario in them:

      - Incident: identify, **contain**, investigate and eradicate, recover, notify as the law requires, review. If damage is still happening, contain. If it has stopped, preserve evidence - most volatile first.
      - Vulnerability: identify, validate, prioritise, remediate, **verify by rescanning**, report.
      - Verify before you change anything; record custody whenever evidence changes hands.

      **BEST control.** Find the word that decides: *prevent* rules out detection; *unknown* malware rules out signatures; *least effort* favours roles and automation; *personal device* rules out a full wipe. Prefer the option that fixes the cause for the whole class - automatic deprovisioning, no standing privilege, logs kept off the host - over one that finds the problem later.

      **Usual traps:** switching a noisy control off when it should be tuned; skipping verification; evidence-handling shortcuts; automation with no guardrail, or abandoning automation after one error.
    items:
      - id: sp-4z-b01
        type: mcq
        best: true
        q: "An analyst sees a workstation encrypting files on a shared drive right now. What should be done FIRST?"
        choices:
          - "Capture a forensic image of the workstation's disk"
          - "Restore the affected shares from backup"
          - "Find the e-mail or download that delivered the malware"
          - "Isolate the workstation from the network"
        answer: 3
        why: "Containment comes first: cutting the host off stops the damage spreading while leaving it powered on for evidence."
        whys:
          - "Needed for the investigation, but files are being destroyed while the image is taken."
          - "Recovery comes after containment, or the restored files are encrypted again."
          - "Important for the root cause, but not while the attack is still running."
          - "Best: it stops the encryption of shared files immediately and preserves the machine's state."
      - id: sp-4z-b02
        type: mcq
        best: true
        q: "A compromised server is still running and has been isolated from the network. Investigators want the best possible evidence. What should they collect FIRST?"
        choices:
          - "A bit-level image of the server's disks"
          - "Firewall records of the server's recent connections"
          - "A capture of the server's memory"
          - "The server's logs already forwarded to the SIEM"
        answer: 2
        why: "Evidence is collected in order of volatility: memory is lost first, so it is captured first."
        whys:
          - "Essential, but disk contents survive long enough to take second."
          - "Retained on another device, so least urgent."
          - "Best: the most volatile evidence, gone for ever at power-off."
          - "Already preserved elsewhere; they can wait."
      - id: sp-4z-b03
        type: mcq
        best: true
        q: "A laptop's drive has been imaged and both copies hashed for a case likely to go to court. The original drive is about to be handed to a courier for outside counsel. What is MOST important to do at this point?"
        choices:
