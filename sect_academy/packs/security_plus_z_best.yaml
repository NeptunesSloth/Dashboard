          - "A full business impact analysis of every process"
          - "A penetration test of the main systems"
        answer: 1
        why: "With no data and one week, a qualitative likelihood-and-impact rating gives a defensible ranking quickly."
        whys:
          - "More precise in principle, but there is no data to base the figures on."
          - "Best: needs no historical data and produces a ranked list in days."
          - "Valuable for continuity planning, but it measures impact only and takes longer than a week."
          - "Finds technical weaknesses, not a ranked view of business risk."
      - id: sp-5z-b04
        type: mcq
        best: true
        q: "A company is about to choose a disaster recovery strategy and set recovery objectives for its systems. What should it do FIRST?"
