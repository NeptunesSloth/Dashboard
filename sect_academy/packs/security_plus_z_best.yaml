  - id: sp-3z
    title: "Best-answer practice: Security Architecture"
    domain: "3"
    goal: "I can choose the architecture, data protection method or resilience option that best fits a stated requirement when several designs would work."
    notes: |
      Architecture questions are decided by the **requirement in the stem**, so read it as a specification.

      **What to look for in Domain 3**

      - **Numbers.** RTO, RPO, seconds of power loss, peak load. Discard any option that misses a number; of those left, *LEAST cost* means the cheapest that still meets it - not the most resilient.
      - **The stated priority.** Life safety beats everything; after that the stem tells you whether availability (fail open) or confidentiality (fail closed) wins.
      - **The data state and the method.** At rest, in transit or in use - a control for one does not cover another. Masking shows part of a value, tokenisation replaces it, hashing cannot be reversed, de-identification keeps structure without identity.
      - **Who decides.** The data owner approves access; the custodian implements it.
      - **Where the device sits.** A blocking device must be inline on the path of the traffic it protects.

      **Usual traps:** gold-plating (a hot site when warm meets the objectives); redundancy offered for a problem of diversity or capacity; logical separation offered where a physical guarantee was demanded.
    items:
      - id: sp-3z-b01
        type: mcq
        best: true
        q: "A law requires that citizens' health records are stored and processed only inside the country. The company already runs in a public cloud that has an in-country region. Which measure BEST meets the requirement at the LEAST cost?"
        choices:
          - "Encrypt the records with keys the company manages"
          - "Add a contract clause in which the provider promises in-country storage and processing"
          - "Deploy only in the in-country region, with policies that deny resources elsewhere"
          - "Build a private data centre in the country"
        answer: 2
        why: "The requirement is about location. Pinning resources to the in-country region with enforced policy meets it technically on the platform already in use."
        whys:
          - "Protects confidentiality, but encrypted data stored abroad is still stored abroad."
          - "Worth having, but a promise does not stop an engineer deploying to another region."
          - "Best: location is enforced technically, on infrastructure the company already has."
          - "Meets the law, at far greater cost than the existing in-country region."
      - id: sp-3z-b02
        type: mcq
        best: true
        q: "Virtual machines a company runs on an infrastructure-as-a-service platform were breached through an unpatched guest operating system. The fix must be in place this month without redesigning the application. Which action is MOST appropriate?"
        choices:
          - "Add a network firewall rule set in front of the machines"
          - "Migrate the application to a platform service where the provider patches the OS"
          - "Open a ticket asking the provider to patch the machines"
          - "Bring the virtual machines into the company's patch management process"
        answer: 3
        why: "In IaaS the customer is responsible for the guest OS. The direct fix is to bring those machines under the company's own patch management."
        whys:
          - "Reduces exposure, but leaves the unpatched systems in place."
          - "Shifts the responsibility for good, but it is a redesign that cannot be done this month."
          - "The provider patches its own hosts, not customers' guest systems."
          - "Best: guest OS patching is the customer's responsibility and this fixes it now."
