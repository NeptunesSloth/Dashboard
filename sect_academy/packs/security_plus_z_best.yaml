          - "Lists weaknesses; nobody attacks and nothing tests detection."
      - id: sp-5z-b10
        type: mcq
        best: true
        q: "A company intends to be certified against an information security standard within a year. Which activity should come FIRST?"
        choices:
          - "Buying a compliance management platform"
          - "Engaging the external certification auditor"
