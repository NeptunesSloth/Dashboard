  - id: sp-5z
    title: "Best-answer practice: Security Program Management and Oversight"
    domain: "5"
    goal: "I can choose the best governance, risk, third-party, compliance and audit decision when all the options are sound practice."
    notes: |
      In governance questions nearly every option is good practice, so the answer turns on **who**, **which document**, **what comes first** and **the numbers**.

      **What to look for in Domain 5**

      - **Do the arithmetic.** ALE = SLE x ARO. A treatment that costs more per year than the loss it removes is not the best answer; accepting, with sign-off, can be.
      - **Who owns it.** The business risk owner accepts risk; security advises; audit stays independent. A processor reports to its controller.
      - **Which artefact.** Policy (intent), standard (mandatory specifics), procedure (steps), guideline (advice). SLA, right to audit, rules of engagement and legal hold each solve one distinct problem.
      - **What comes first.** Impact analysis before recovery strategy; gap analysis before a certification project; legal hold before collecting evidence.
      - **Strength of evidence.** Independent beats self-reported; tested over a period beats a single date; records beat interviews; behaviour beats attendance.

      **Usual traps:** the security team making a business decision; a document that pays compensation offered where one that prevents was needed; a completion rate offered as proof of effectiveness.
    items:
      - id: sp-5z-b01
        type: mcq
        best: true
        q: "A risk has a single loss expectancy of $100,000 and is expected once every five years. The service it affects earns $2 million a year, and a one-off loss of $100,000 is within the company's stated risk tolerance. Which treatment is BEST?"
        choices:
          - "Transfer the risk with insurance at a premium of $30,000 a year"
          - "Mitigate with a control costing $50,000 a year that cuts the expected loss to $5,000 a year"
          - "Accept the risk, documented and signed by the risk owner"
          - "Avoid the risk by closing the service"
        answer: 2
        why: "The annual loss expectancy is $20,000. Every treatment on offer costs more than that each year, so documented acceptance is the rational choice."
        whys:
          - "The premium is more than the expected annual loss."
          - "Spends $50,000 to save $15,000."
          - "Best: ALE is $20,000 a year and every alternative costs more than it saves."
          - "Gives up $2 million of revenue to avoid a $20,000 expected loss."
      - id: sp-5z-b02
        type: mcq
        best: true
        q: "A security analyst finds that a sales application carries a residual risk slightly above the company's risk appetite. Fixing it would delay a product launch. Who is the MOST appropriate person to decide whether to accept the risk?"
        choices:
          - "The application's lead administrator"
          - "The executive who owns the sales application"
          - "The head of internal audit"
          - "The chief information security officer"
        answer: 1
        why: "Risk acceptance belongs to the accountable business owner, who answers for both the launch and the loss; security advises."
        whys:
          - "Knows the system, but has no authority to accept business risk."
          - "Best: the risk owner is accountable for both sides of the trade-off."
          - "Must stay independent of the decisions audit later reviews."
          - "Advises on and reports the risk, but does not own the business decision."
      - id: sp-5z-b03
        type: mcq
        best: true
        q: "A two-year-old company with no loss history needs a prioritised list of its risks for a board meeting next week. Which approach is BEST?"
