# Best-answer practice bank for CompTIA Security+ SY0-801.
# Every item is an mcq with best: true - all four choices are reasonable; whys explains each.
part_of: security-plus
units:
  - id: sp-1z
    title: "Best-answer practice: General Security Concepts"
    domain: "1"
    goal: "I can pick the best control, change-management step or cryptographic solution when every option on offer is reasonable."
    notes: |
      In these questions **every choice is something a competent professional might do**. The stem always contains one deciding constraint - find it before you read the choices.

      **What to look for in Domain 1**

      - **The control type asked for.** If the stem says *prevent*, a camera (detective) or a sign (deterring) is weaker however useful it is. If patching is impossible, the answer is a **compensating** control that removes exposure.
      - **The security goal.** *Cannot deny it* means non-repudiation - a private key only one person holds. *From the vendor and unchanged* means a signature, not a bare hash.
      - **The process step.** Analyse impact, test, get approval, schedule, implement, document - in that order. A hard limit on downtime points to the backout plan.
      - **The exact scope to encrypt.** Whole disk, one column, in transit - match the level to the threat named.

      **Usual traps:** the strongest-sounding control that ignores the budget; a control that records the problem instead of stopping it; more privilege than the task needs.
    items:
      - id: sp-1z-b01
        type: mcq
        best: true
        q: "An unstaffed server room has a badge reader, but an audit found people following badge holders through the door at night. The requirement is to physically PREVENT a second person entering on one badge. Which control BEST meets it?"
        choices:
          - "An access control vestibule that admits one person per badge"
          - "A warning sign stating that tailgating is a disciplinary offence"
          - "A camera above the door with recorded footage"
          - "Tailgating awareness training for all badge holders"
        answer: 0
        why: "Only the vestibule physically stops the second person; the others discourage, record or rely on people who are not there at night."
        whys:
          - "Best: it is the only choice that physically blocks a second person, with nobody needing to be present."
          - "A deterring and directive control; it discourages but cannot stop anyone."
          - "Useful, but detective only - it shows the tailgating after it has happened."
          - "Worth doing, but it depends on staff challenging people, and the stem asks for physical prevention."
      - id: sp-1z-b02
        type: mcq
        best: true
        q: "A lab instrument is driven by a PC whose operating system is out of support. The vendor will not certify a newer OS for 18 months and the instrument must stay in use. Which is the BEST compensating control?"
        choices:
          - "Enable verbose logging on the PC and forward it to the SIEM"
          - "Scan the PC for vulnerabilities every week instead of every quarter"
          - "Record the risk in the risk register with the lab manager's sign-off"
          - "Place the PC on an isolated segment that only the hosts it needs can reach"
        answer: 3
        why: "When the ideal control (patching) is impossible, the best compensating control removes the exposure: isolate the system so only the hosts that need it can reach it."
        whys:
          - "Helps investigation, but it detects misuse rather than limiting who can reach the system."
          - "Detective only - it will keep reporting flaws that cannot be fixed."
          - "Good governance, but it documents the risk rather than reducing it."
          - "Best: it cuts the attack paths to a system that cannot be patched, without touching the certified build."
      - id: sp-1z-b03
        type: mcq
        best: true
        q: "The CAB has approved a firmware upgrade on the production firewall pair. The business has stated that an outage of more than 30 minutes is unacceptable. Which item is MOST important to have ready before the maintenance window opens?"
        choices:
          - "A notice to stakeholders giving the window's start and end times"
          - "A tested backout plan with the previous firmware and configuration staged"
          - "A completed template for the post-change report"
          - "An updated network diagram showing the firewall pair"
        answer: 1
        why: "The stated constraint is a hard limit on downtime, so the thing that guarantees a quick return to the working state - a tested backout plan - matters most."
        whys:
          - "Expected practice, but telling people about an outage does not limit its length."
          - "Best: it is the only item that bounds the outage if the upgrade goes wrong."
          - "Useful afterwards; it has no effect on whether service returns within 30 minutes."
          - "Good documentation, but it does not shorten a failed change."
      - id: sp-1z-b04
        type: mcq
        best: true
        q: "An administrator has built a configuration fix for a production load balancer and tested it successfully in the lab. The issue is not causing an outage. Under the change management process, which step must come FIRST?"
        choices:
          - "Submit the change request and test results for CAB approval"
          - "Update the load balancer's configuration documentation"
          - "Apply the fix to one production node to confirm it behaves as in the lab"
          - "Book a maintenance window with the operations team"
        answer: 0
        why: "With testing done and no emergency, the step that must come first is approval: the CAB reviews the request, impact analysis and test results before anything is scheduled or applied."
        whys:
          - "Best: approval is the gate before anything else, and the test results are the evidence the CAB needs."
          - "Required, but it records a change once it has been made."
          - "A sensible phased rollout, but only after approval - doing it now is an unauthorised change."
          - "A necessary step, but the window is scheduled for an approved change."
      - id: sp-1z-b05
        type: mcq
        best: true
        q: "Finance needs proof that a named manager approved each wire transfer, strong enough that the manager cannot later deny it. Which solution BEST provides this?"
        choices:
          - "A digital signature on each approval made with the manager's individually issued private key"
          - "An entry in the payment application's audit log for each approval"
          - "Mutual TLS between the manager's workstation and the payment system"
          - "A message authentication code computed with a key shared by the manager and the payment system"
        answer: 0
        why: "Non-repudiation needs a secret only one person holds. A digital signature made with the manager's own private key gives exactly that."
        whys:
          - "Best: only the manager holds the key, so the signature ties the approval to that person."
          - "Good evidence, but an administrator or a stolen session could create or alter the entry."
          - "Authenticates the device and protects the session in transit, not the individual approval afterwards."
          - "Proves integrity and origin, but either holder of the shared key could have produced it."
      - id: sp-1z-b06
        type: mcq
        best: true
        q: "A breach review finds that a web application stores passwords as unsalted SHA-256 hashes. The team wants the change that MOST effectively defeats precomputed-table and high-speed offline cracking if the database leaks again. Which is it?"
        choices:
          - "Encrypt the password column with AES, with the key held by the application"
          - "Rehash with a per-user random salt and a slow key-derivation function"
          - "Raise the minimum password length from 8 to 12 characters"
          - "Switch from SHA-256 to SHA-512"
        answer: 1
        why: "A unique salt makes precomputed tables useless and a slow key-derivation function makes each guess expensive; together they address both attacks."
        whys:
          - "Adds a layer, but an attacker who takes the application usually takes the key too, and the weak hashes remain."
          - "Best: the salt defeats precomputed tables and the slow function throttles offline guessing."
          - "Helps, but common long passwords still fall quickly to a fast unsalted hash."
          - "A larger digest, but still fast and unsalted, so both attacks still work."
      - id: sp-1z-b07
        type: mcq
        best: true
        q: "Sales staff store customer files anywhere on their laptops, and two laptops were stolen from cars this year. The requirement is that all data on a stolen laptop is unreadable without relying on the user to do anything. Which control BEST meets it?"
        choices:
          - "Remote wipe through the device management platform"
          - "File-level encryption applied to a designated 'Customers' folder"
          - "Cable locks and a rule against leaving laptops in vehicles"
          - "Full-disk encryption enforced on every laptop"
        answer: 3
        why: "Full-disk encryption protects everything on the drive regardless of where users save files or whether the device ever comes back online."
        whys:
          - "Valuable, but it only works if the thief lets the laptop go online."
          - "Sound, but it only protects files that users remember to save in that folder."
          - "Reduces theft, but does nothing for the data once a laptop is taken."
          - "Best: it covers every file automatically and works even if the laptop never reconnects."
      - id: sp-1z-b08
        type: mcq
        best: true
        q: "A database holds one column of payment card numbers. Database administrators must keep full administrative rights but must not be able to read the numbers, and the rest of the database should carry no encryption overhead. Which approach is BEST?"
        choices:
          - "Encrypt the volume the database files are stored on"
          - "Require TLS on every connection to the database"
          - "Enable transparent data encryption of the whole database, with keys in a hardware security module"
          - "Encrypt that column in the application, with keys held outside the database"
        answer: 3
        why: "Encrypting just that field in the application, with keys the DBAs cannot reach, meets both the confidentiality requirement and the performance constraint."
        whys:
          - "Protects against stolen disks only; the running database shows cleartext to administrators."
          - "Protects the numbers in transit, not from someone querying the table."
          - "Protects the files at rest, but the engine decrypts for any authorised query, including a DBA's."
          - "Best: only the sensitive field is encrypted and the DBAs never see cleartext or keys."
      - id: sp-1z-b09
        type: mcq
        best: true
        q: "A web server's private key has been compromised and its certificate revoked. Many customers use phones on metered connections. The team wants clients to learn the revocation status during the very next handshake with the LEAST extra traffic for the client. Which is the BEST choice?"
        choices:
          - "Move to certificates that are valid for only 90 days"
          - "Have the CA publish its certificate revocation list every hour"
          - "Enable OCSP stapling on the web servers"
          - "Pin the new certificate in the company's mobile app"
        answer: 2
        why: "With OCSP stapling the server delivers a fresh, CA-signed status in the handshake itself, so the client makes no extra request and downloads no list."
        whys:
          - "Limits how long a future stolen key is useful, but does not tell clients about this revocation now."
          - "Works, but clients must download a growing list, which is the traffic the stem wants to avoid."
          - "Best: status arrives inside the handshake, current and with no extra client connection."
          - "Protects app users after they update, but not browsers and not until the update is installed."
      - id: sp-1z-b10
        type: mcq
        best: true
        q: "A company is launching a portal used by hundreds of partner firms from devices the company does not manage. Users must see no certificate warnings, and the company cannot install anything on partner devices. Which certificate choice is BEST?"
        choices:
          - "A wildcard certificate from the internal CA covering all company subdomains"
          - "A certificate issued by a public third-party CA"
          - "A certificate from the company's internal CA"
          - "A self-signed certificate with its fingerprint published to partners"
        answer: 1
        why: "Only a certificate chained to a root already in the partners' trust stores is trusted without touching their devices."
        whys:
          - "Convenient to manage, but it has the same untrusted-root problem and widens the impact of a key theft."
          - "Best: partner devices already trust the root, so nothing needs installing."
          - "Fine for managed devices, but partners would have to import the company's root."
          - "Encrypts the traffic, but every user sees a warning and must check a fingerprint by hand."
      - id: sp-1z-b11
        type: mcq
        best: true
        q: "Employees encrypt business e-mail with personal key pairs. When an employee left, the company could not read years of archived messages that a regulator now demands. Which measure would BEST prevent this while keeping messages encrypted?"
        choices:
          - "One shared key pair per department instead of personal keys"
          - "An exit checklist requiring leavers to hand over their private keys"
          - "Key escrow, with decryption keys recoverable by authorised recovery agents"
          - "Archiving a decrypted copy of every message on a restricted server"
        answer: 2
        why: "Key escrow lets the organisation recover decryption keys under controlled conditions without weakening the encryption or depending on the employee."
        whys:
          - "Makes recovery easy, but removes individual accountability and spreads one key widely."
          - "Reasonable, but it fails when someone leaves abruptly or refuses."
          - "Best: the company can always recover data, under dual control, and messages stay encrypted."
          - "Solves retrieval, but gives up the confidentiality the encryption was providing."
      - id: sp-1z-b12
        type: mcq
        best: true
        q: "Contractors need one internal web application and will use their own laptops. The company is adopting Zero Trust. Which access design BEST fits those principles?"
        choices:
          - "Company-issued laptops for every contractor, connected by VPN"
          - "A VPN whose firewall rules allow only the application's subnet"
          - "A proxy that verifies user and device on every request to that one application"
          - "A full-tunnel VPN with multifactor authentication"
        answer: 2
        why: "Zero Trust grants access per application and per request, after checking both the user and the device, rather than trusting a network location."
        whys:
          - "Improves device assurance at high cost, yet still relies on network-based trust."
          - "Narrower, but still network-level trust with no check of device health or of each request."
          - "Best: explicit verification every time, and access limited to the single resource needed."
          - "Strong sign-in, but once connected the laptop sits on the internal network with implicit trust."
      - id: sp-1z-b13
        type: mcq
        best: true
        q: "Help desk staff need to reset passwords and unlock accounts for ordinary users, and nothing else. Which approach BEST applies least privilege?"
        choices:
          - "Grant domain administrator rights during shifts and review the logs weekly"
          - "Add help desk staff to a built-in operators group that manages accounts"
          - "Let help desk staff check out a domain administrator account from a password vault when needed"
          - "Delegate reset and unlock rights on the standard-user organisational unit to a help desk group"
        answer: 3
        why: "Delegating exactly the two rights needed, on exactly the accounts concerned, gives the job its permissions and no more."
        whys:
          - "Detects misuse afterwards, but the privilege granted is still excessive."
          - "Works, but built-in groups carry extra rights such as creating and deleting accounts."
          - "Audited, but it hands over far more privilege than a password reset needs."
          - "Best: precisely the rights and scope the task requires."
      - id: sp-1z-b14
        type: mcq
        best: true
        q: "After a ransomware near-miss, a company can fund one control this quarter. The board's stated priority is to be operating again within four hours of a successful attack. Which control BEST meets that priority?"
        choices:
          - "An endpoint detection and response platform with a 24-hour managed monitoring service"
          - "Immutable backups with restores rehearsed against the four-hour target"
          - "Phishing awareness training for all staff"
          - "A cyber insurance policy covering ransomware losses"
        answer: 1
        why: "The priority is recovery time, so the corrective control - backups that an attacker cannot alter and that are proven to restore in time - is the one that delivers it."
        whys:
          - "Lowers the chance of a successful attack, but does not restore systems once one succeeds."
          - "Best: it is the only choice that directly restores operations, and the rehearsal proves the time."
          - "Reduces one way in, but has no effect on recovery time."
          - "Transfers the financial loss; it does not bring systems back in four hours."
      - id: sp-1z-b15
        type: mcq
        best: true
        q: "A database schema change went live in the maintenance window. A defect then appeared that puts the wrong delivery date on every new order, and the next scheduled window is a week away. Backing out means restoring the pre-change backup and losing three hours of orders already taken on the new schema; a fix has been tested and takes 15 minutes. Which action is BEST?"
        choices:
          - "Fail forward: apply the tested fix under emergency change approval"
          - "Take the system offline until a full regression test of the fix is complete"
          - "Back out by restoring the pre-change backup"
          - "Leave the defect and raise a normal change for the next window"
        answer: 0
        why: "When backout would destroy good data and a tested fix is available, failing forward under emergency change approval causes the least harm."
        whys:
          - "Best: it removes the defect without losing orders, and still goes through approval."
          - "Thorough, but it turns a data defect into an extended outage."
          - "The standard safe option, but here it discards three hours of real orders."
          - "Avoids risk today, but knowingly leaves production broken when a tested fix exists."
      - id: sp-1z-b16
        type: mcq
        best: true
        q: "A firewall has an old rule allowing a wide port range to a server subnet. Nobody knows which applications rely on it, and the team wants to remove it. What should the team do FIRST?"
        choices:
          - "Tell application owners the rule will be removed next month"
          - "Save a copy of the firewall configuration for backout"
          - "Disable the rule in a maintenance window and watch for complaints"
          - "Review the rule's hit counts and traffic logs to identify what depends on it"
        answer: 3
        why: "Impact analysis comes before any change: the rule's hit counts and traffic logs show which dependencies exist, and everything else follows from that."
        whys:
          - "Good communication, but the team does not yet know which owners are affected."
          - "Needed before implementation, but it does not reveal who uses the rule."
          - "A common test, but it discovers dependencies by breaking them."
          - "Best: it establishes the impact before anything is changed."
      - id: sp-1z-b17
        type: mcq
        best: true
        q: "Each night 2 TB of backups are encrypted and sent to a recovery provider. Encryption must be fast, and no secret key may be sent to the provider or typed by operators. Which design is BEST?"
        choices:
          - "Encrypt with a fresh AES-256 key each night, wrapped with the provider's RSA public key"
          - "Encrypt the backups directly with the provider's RSA public key"
          - "Encrypt with AES-256 using a passphrase the night operator enters"
          - "Encrypt with AES-256 using a key agreed once and delivered to the provider by courier in a tamper-evident envelope"
        answer: 0
        why: "Hybrid encryption gets the speed of symmetric encryption for the bulk data and uses the recipient's public key to protect the data key, so no secret is ever shared."
        whys:
          - "Best: fast bulk encryption, and the data key travels protected by a public key."
          - "Needs no shared secret, but asymmetric encryption is far too slow for 2 TB."
          - "Fast, but a human-chosen, human-typed secret is the weakest part of the design."
          - "Fast, but it relies on one long-lived shared secret that had to be transported."
      - id: sp-1z-b18
        type: mcq
        best: true
        q: "A vendor publishes firmware on several mirror sites. Customers must be able to confirm that a file really came from the vendor and has not been changed, even if a mirror is compromised. Which is the BEST method?"
        choices:
          - "Serve the downloads only over HTTPS"
          - "Publish a SHA-256 hash of the file beside each download link"
          - "Digitally sign the firmware with the vendor's private key"
          - "E-mail the file's checksum to customers who request it"
        answer: 2
        why: "A digital signature proves both origin and integrity, and an attacker who controls a mirror cannot forge it without the vendor's private key."
        whys:
          - "Protects the file in transit, not a file altered on the mirror itself."
          - "Shows integrity, but whoever replaces the file on a mirror can replace the hash too."
          - "Best: integrity and authenticity that a compromised mirror cannot fake."
          - "A separate channel helps, but it is manual and e-mail itself can be spoofed."
      - id: sp-1z-b19
        type: mcq
        best: true
        q: "Twelve engineers share one administrator account on the network switches. Auditors require every command to be attributable to a person, and junior engineers must be limited to show commands. Which solution BEST meets both requirements?"
        choices:
          - "Keep the shared account in a password vault that records who checked it out"
          - "Individual logins through a central AAA server with per-command authorisation and accounting"
          - "Send every configuration change from the switches to a syslog server"
          - "Require access through a jump server that records sessions"
        answer: 1
        why: "Centralised AAA with individual accounts gives authentication per person, per-command authorisation and accounting of each command - all three in one control."
        whys:
          - "Narrows who was logged in, but cannot limit commands and attribution is by time window only."
          - "Best: it attributes every command and restricts juniors to the commands allowed."
          - "Records what changed, but under the shared account it cannot say who did it."
          - "Good evidence of each session, but it does not restrict which commands a junior can run."
      - id: sp-1z-b20
        type: mcq
        best: true
        q: "Copper cable is being stolen from an unstaffed, fenced utility yard. There is little budget, and the goal is to discourage attempts rather than to investigate them afterwards. Which control is the MOST cost-effective?"
        choices:
          - "Hidden motion sensors that silently alert the security operations centre"
          - "A security guard on site around the clock"
          - "Bright lighting, warning signs and clearly visible cameras"
          - "Insurance cover for the stolen cable"
        answer: 2
        why: "The goal is deterrence on a small budget: lighting, clear warning signs and visible cameras discourage attempts for a fraction of the cost of guards."
        whys:
          - "Detective - being hidden, they do nothing to discourage an attempt."
          - "The strongest deterrent, but far beyond a small budget for an unstaffed yard."
          - "Best: a cheap, visible deterrent that matches the stated goal."
          - "Transfers the loss; the thefts continue."
  - id: sp-2z
    title: "Best-answer practice: Threats, Vulnerabilities, and Attacks"
    domain: "2"
    goal: "I can choose the most likely explanation, the first response and the most effective mitigation for a threat when several answers are defensible."
    notes: |
      Domain 2 best-answer questions come in three shapes.

      **MOST likely (actor, attack, malware).** Several options fit *some* of the evidence; the best fits *all* of it. Underline every clue - motive, patience, tooling, timing - and reject any answer that leaves one unexplained. Custom malware and no ransom is not organised crime; one password across 400 accounts is not brute force.

      **FIRST.** Stop the exposure before you investigate or improve: revoke the leaked key, close the public bucket. Log review and new tooling come later.

      **BEST or MOST effective mitigation.** Prefer the answer that removes the **root cause** for the whole class of attack over one that handles a single instance (block one site) or a symptom (flush the cache). When the stem says the real fix is impossible, switch to the best **compensating** control. For AI systems, the strongest control sits *outside* the model.

      **Usual traps:** training offered where the user could not have known; detective controls offered where prevention was asked for; the highest CVSS score with no route to it.
    items:
      - id: sp-2z-b01
        type: mcq
        best: true
        q: "A team can remediate only one finding this week. Which should be patched FIRST?"
        choices:
          - "CVSS 6.1 cross-site scripting on an intranet page"
          - "CVSS 7.5 on the internet-facing VPN gateway, listed as actively exploited in the wild"
          - "CVSS 9.8 on a server in an isolated lab network that has no route to or from other networks"
          - "CVSS 8.8 on an internal file server, exploitable only by an authenticated user"
        answer: 1
        why: "Prioritisation weighs exposure and real-world exploitation along with the base score: an internet-facing flaw that attackers are using now is the most likely to hurt the organisation this week."
        whys:
          - "Worth fixing, but lower impact and reachable only from inside."
          - "Best: reachable by anyone and already being exploited, so likelihood is highest."
          - "The highest score, but an attacker has no path to it this week."
          - "Serious, but it needs an attacker who is already inside with credentials."
      - id: sp-2z-b02
        type: mcq
        best: true
        q: "An aerospace manufacturer discovers that engine design files were copied out in small amounts over nine months by custom malware that used a previously unknown vulnerability. No ransom or demand was ever made. Which threat actor is MOST likely responsible?"
        choices:
          - "An organised crime syndicate"
          - "A competitor"
          - "A malicious insider"
          - "A state-sponsored group"
        answer: 3
        why: "Long patience, custom tooling, a zero-day and espionage with no attempt to monetise point to the resources and motives of a state-sponsored group."
        whys:
          - "Has the skill, but is financially motivated and would be expected to extort or sell quickly."
          - "Has the intellectual-property motive, but rarely the means to build custom malware around a zero-day."
          - "Could reach the files, but would not need a zero-day and custom malware to copy them."
          - "Best: the funding, sophistication, persistence and espionage motive all fit."
      - id: sp-2z-b03
        type: mcq
        best: true
        q: "The day after a company announces a controversial mining project, its public website is replaced with a protest message. The attackers used a published exploit for a known flaw in the content management system. Which threat actor is MOST likely?"
        choices:
          - "An unskilled attacker seeking notoriety"
          - "A hacktivist"
          - "A competitor"
          - "A disgruntled insider"
        answer: 1
        why: "The timing and the protest message show an ideological motive, which is the mark of a hacktivist; the simple technique fits too."
        whys:
          - "The technique fits, but the targeted protest message points to a cause, not bragging rights."
          - "Best: a public, message-carrying attack timed to a controversial announcement."
          - "Might want to embarrass the company, but would gain little from a protest slogan."
          - "Possible, but an insider would not need a public exploit and the message is about the project, not a grievance."
      - id: sp-2z-b04
        type: mcq
        best: true
        q: "Staff receive e-mails with a QR code that leads to a fake sign-in page. The page relays the password and the texted one-time code to the real site in real time. Which mitigation is MOST effective against this attack?"
        choices:
          - "Phishing-resistant authentication such as passkeys or FIDO2 security keys"
          - "Conditional access that blocks sign-ins from unfamiliar countries"
          - "An e-mail filter rule that quarantines inbound messages containing QR code images"
          - "Awareness training about QR codes in e-mail"
        answer: 0
        why: "The attack defeats any code a user can read and type. Authenticators bound to the genuine site's origin will not respond to the fake page at all."
        whys:
          - "Best: the credential is bound to the real site, so a relay page receives nothing usable."
          - "Useful, but attackers route the relay through hosts in the user's own country."
          - "Cuts volume, but attackers vary the image and use other channels."
          - "Helps, but some users will still scan, and the relay then succeeds."
      - id: sp-2z-b05
        type: mcq
        best: true
        q: "A managed service provider's remote-management tool was abused to push ransomware to several of its customers. Your company must keep using the provider. Which measure BEST reduces your exposure to the same attack?"
        choices:
          - "Send the provider a detailed security questionnaire every year and review the answers"
          - "Add a right-to-audit clause to the contract"
          - "Buy cyber insurance that covers third-party incidents"
          - "Limit the provider to just-in-time, least-privilege access with MFA"
        answer: 3
        why: "The attack rides on the provider's standing privileged access. Limiting that access - only when needed, only what is needed, with strong authentication - shrinks what a compromised provider can do."
        whys:
          - "Good due diligence, but answers on paper do not constrain a compromised tool."
          - "Gives visibility into their controls; it does not limit their access to yours."
          - "Transfers some cost after the event; exposure is unchanged."
          - "Best: a technical limit on what the provider's tools and accounts can reach, and when."
      - id: sp-2z-b06
        type: mcq
        best: true
        q: "Devices that look like USB memory sticks but act as keyboards are being left in the car park; when plugged in they type commands. Which control would MOST effectively stop this attack?"
        choices:
          - "Antivirus scanning of removable media on insertion"
          - "Device control that allows only approved USB device types and IDs"
          - "Disabling autorun for removable media"
          - "Training staff not to plug in found devices"
        answer: 1
        why: "The device is a keyboard, not storage, so controls aimed at files or autorun miss it. Only allowing approved device types and IDs blocks it."
        whys:
          - "There are no files on the device to scan."
          - "Best: an unapproved keyboard-class device is refused before it can type."
          - "Good hygiene, but nothing is auto-run - the device simply types."
