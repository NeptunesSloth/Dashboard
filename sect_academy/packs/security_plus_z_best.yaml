          - "A historian server in a screened subnet that both networks can reach"
          - "A firewall between the networks that permits only outbound connections from the control side"
          - "Separate VLANs with access control lists on the core switch"
        answer: 0
        why: "Only a one-way device gives a physical guarantee; anything rule-based can be misconfigured or exploited."
        whys:
          - "Best: traffic physically cannot flow inwards."
          - "A common design, but it creates a host reachable from the business side that also talks to the control side."
          - "Strong, but it depends on rules staying correct and the firewall having no flaws."
          - "Logical separation only, on shared equipment."
