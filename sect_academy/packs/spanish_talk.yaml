  # ---------------------------------------------------------------- 5
  - id: est-05
    title: "Making plans"
    goal: "I can invite someone, accept, decline politely, change an arrangement, handle a simple phone call and say I am running late."
    notes: |
      Making plans in Spanish turns on the verb **quedar** (to arrange to meet): *¿A qué hora quedamos?* · *¿Quedamos allí?*

      - **Invite**: *¿Te apetece…?* (Spain) · *¿Quieres…?* · *¿Qué tal a las siete y media?* · *¿Y si vamos al italiano?*
      - **Accept**: *¡Claro que sí!* · *Me encantaría.* · *¡Buena idea!* · *¿Llevo algo?*
      - **Decline** in three steps — regret, reason, alternative: *Me encantaría, pero no puedo.* → *Es que tengo que estudiar.* → *Otro día, ¿vale?* A bare *no* sounds cold; **es que…** introduces any excuse gently.
      - **Reschedule**: *Al final no puedo.* · *¿Te viene bien el domingo?* · *Me va genial.*
      - **No preference**: *Me da igual. ¿Tú qué prefieres?*
      - **Late**: *Perdona, voy a llegar tarde.* · *Lo siento mucho, de verdad.*
      - **Phone**: *¿Está Marta?* · *¿De parte de quién?* — *Soy Alex.* · *¿Le puede decir que he llamado?*

      Latin America prefers *¿Quieres…?* or *¿Te provoca…?* to *¿Te apetece…?*, and says *boletos* for *entradas*.
