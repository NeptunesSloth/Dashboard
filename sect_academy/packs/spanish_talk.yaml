  # ---------------------------------------------------------------- 4
  - id: est-04
    title: "Out and about"
    goal: "I can ask the way, use public transport, check into a hotel, sort out a small problem in a restaurant and explain what is wrong at the pharmacy or the doctor's."
    notes: |
      With strangers and staff, **usted** is safe and polite: *perdone*, *¿puede…?*, *aquí tiene*. People your age on the street often use **tú**: *perdona*, *¿puedes…?*

      - **Stop someone**: *Perdone, ¿cómo se va a…?* · *Perdona, ¿este autobús va al centro?*
      - **Check what you heard** by repeating the key part as a question: *¿Vía tres?* · *Todo recto y a la izquierda, ¿no?* This is the single most useful listening trick.
      - **Ask for it again**: *Perdone, ¿puede repetir?* · *¿Cuántas veces al día, perdona?*
      - **Raise a problem calmly**: *Perdone, creo que hay un error.* · *He pedido el pescado, no la carne.* · *No pasa nada.*
      - **Health**: *Me duele…* · *Tengo fiebre / tos.* · *¿Tienes algo para…?* · *¿Tengo que…?*
      - **Follow-up questions**: *¿Está muy lejos?* · *¿De qué vía sale?* · *¿A qué hora es…?* · *¿Dónde tengo que bajarme?*

      Spain says *coger el autobús*, *el billete*, *andando*; much of Latin America says *tomar*, *el boleto*, *caminando*. Everyone understands both.
    items:
