  # ---------------------------------------------------------------- 3
  - id: est-03
    title: "Small talk"
    goal: "I can chat about family, work, where I live, the weather, weekend plans and what I like, and keep the conversation going by asking back."
    notes: |
      Small talk is a game of catch: answer briefly, add **one** detail, and throw a question back.

      - **Ask back**: *¿Y tú?* · *¿Y la tuya?* · *¿Y tú a qué te dedicas?*
      - **React before you answer**. A reaction shows you are listening and gives you a second to think: *¡Qué bien!* · *¡Qué suerte!* · *¡Qué lejos!* · *¡Qué pronto!* · *¡No me digas!* · *¿En serio?* The pattern **¡Qué + adjective!** is endlessly reusable.
      - **Soften**: *más o menos*, *no mucho*, *un poco*, *nada especial*.
      - **Agree with likes**: *A mí también* (so do I) / *A mí tampoco* (neither do I).
      - **Catch up**: *¡Cuánto tiempo!* · *¿Qué tal todo?* · *Bien, como siempre.*
      - **Close warmly**: *¡Buen fin de semana!* · *Igualmente.* · *Cuando quieras.*

      *A ver si quedamos un día* ("let's meet up some time") is friendly, not a fixed appointment; answer *¡Claro! Cuando quieras.*
    items:
