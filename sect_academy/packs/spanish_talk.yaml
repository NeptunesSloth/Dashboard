  # ---------------------------------------------------------------- 8
  - id: est-08
    title: "Handling real life"
    goal: "I can clear up a misunderstanding, complain politely, ask the right questions about a flat or a job, explain a problem on the phone and leave a gathering gracefully."
    notes: |
      When something goes wrong, calm and courteous Spanish gets results. Three tools do most of the work.

      - **Soft openers**: *Quería comentarle un problema…* · *Perdona que te moleste…* · *Llamo porque…* The imperfect *quería* is the polite way to say "I want".
      - **The conditional for requests**: *¿Sería posible cambiar de habitación?* · *¿Os importaría bajarla?* · *¿No podría ser antes?* · *Podría empezar la semana que viene.*
      - **Understanding plus "but"**: *Lo entiendo, pero así no puedo dormir.* You acknowledge the other person, then hold your ground.

      More moves to keep ready:

      - **Misunderstandings**: *Yo había entendido…* · *Lo leí mal.* · *Ha sido culpa mía.* · *¿Y si…?*
      - **Buy time**: *Tengo que pensármelo.* · *A ver, un momento…*
      - **Thank formally**: *Le agradezco mucho la ayuda.* · *Gracias por recibirme.*
      - **Leave well**: *Se ha hecho tarde.* · *Lo he pasado genial.* · *Estaba todo riquísimo.* · *La próxima vez, en mi casa.*

      Keep **usted** with staff, officials and interviewers, and **vosotros** (Latin America: **ustedes**) when you speak to a group of friends.
