id: spanish-talk
title: "Spanish — Conversations"
kind: language
language: Spanish
lang: es-ES
hall: tongues_south
blurb: "Spoken-conversation practice to take alongside the A1–B1 courses: 56 everyday dialogues, from a first hello to sorting out real-life problems."

units:
  # ---------------------------------------------------------------- 1
  - id: est-01
    title: "First contact"
    goal: "I can greet someone, introduce myself, ask the same question back, say I am learning Spanish and ask people to repeat or slow down."
    notes: |
      A first conversation runs on a handful of moves. Learn them as whole chunks and say them aloud.

      - **Open**: *Hola, ¿qué tal?* works with almost anyone. With older people or in formal places use **usted**: *¿Cómo está usted?*
      - **Ask back**: after you answer, return the question with **¿Y tú?** (or **¿Y usted?**). It is the simplest way to keep a conversation alive.
      - **Buy help**: *Perdona, no entiendo.* · *Más despacio, por favor.* · *¿Puedes repetir?* · *¿Qué significa…?* · *¿Cómo se dice… en español?* Nobody minds; people slow down gladly.
      - **Show you followed**: *Ah, vale, ya entiendo.*
      - **Close**: *Bueno, tengo que irme.* · *Encantado/a de conocerte.* · *Igualmente.* · *¡Hasta luego!*

      In Spain people your own age say **tú** almost at once, and **vale** means "OK". In Latin America you will hear *okey*, *dale* or *listo* instead.
    items:
      - id: est-01-vecina
        type: dialogue
        title: "Meeting a neighbour"
        scene: "You have just moved into a flat in Madrid. A neighbour speaks to you on the stairs. You are Alex."
        you: B
        lines:
          - {who: A, l2: "¡Hola! Tú eres del tercero, ¿verdad?", l1: "Hi! You're from the third floor, aren't you?"}
          - {who: B, l2: "Sí. Hola, ¿qué tal?", l1: "Yes. Hi, how's it going?",
             alt: ["Sí. Hola, ¿cómo estás?", "Sí. Hola, ¿qué tal estás?", "Sí. Hola, ¿cómo va?", "Sí. Hola, ¿cómo te va?"]}
          - {who: A, l2: "Muy bien, gracias. Yo soy Carmen, la vecina del segundo. ¿Y tú, cómo te llamas?", l1: "Very well, thanks. I'm Carmen, the neighbour from the second floor. And you, what's your name?"}
          - {who: B, l2: "Me llamo Alex.", l1: "My name is Alex.",
             alt: ["Yo me llamo Alex.", "Soy Alex.", "Yo soy Alex.", "Mi nombre es Alex."]}
          - {who: A, l2: "Encantada, Alex. ¿Y de dónde eres?", l1: "Pleased to meet you, Alex. And where are you from?"}
          - {who: B, l2: "Soy de Inglaterra. ¿Y tú?", l1: "I'm from England. And you? (informal)",
             alt: ["Yo soy de Inglaterra. ¿Y tú?", "De Inglaterra. ¿Y tú?"]}
          - {who: A, l2: "Yo, de aquí, de Madrid de toda la vida. Bueno, ¡ya nos veremos por la escalera!", l1: "Me, from here, Madrid born and bred. Well, we'll see each other on the stairs!"}
          - {who: B, l2: "Claro. ¡Hasta luego!", l1: "Sure. See you later!",
             alt: ["Claro. ¡Nos vemos!", "Claro que sí. ¡Hasta luego!", "Por supuesto. ¡Hasta luego!", "Claro. ¡Hasta luego, Carmen!"]}

      - id: est-01-intercambio
        type: dialogue
        title: "At a language exchange"
        scene: "You arrive at a language-exchange evening in a bar and see a free chair next to a woman your age. You are Alex."
        you: A
        lines:
          - {who: A, l2: "Hola. ¿Puedo sentarme aquí?", l1: "Hi. Can I sit here?",
             alt: ["Hola. ¿Me puedo sentar aquí?", "Hola. ¿Puedo sentarme acá?", "Hola. ¿Me puedo sentar acá?", "Hola. ¿Me siento aquí?"]}
          - {who: B, l2: "¡Claro, siéntate! Yo soy Lucía. ¿Cómo te llamas?", l1: "Of course, sit down! I'm Lucía. What's your name?"}
          - {who: A, l2: "Soy Alex. Mucho gusto.", l1: "I'm Alex. Nice to meet you.",
             alt: ["Me llamo Alex. Mucho gusto.", "Yo soy Alex. Mucho gusto.", "Soy Alex. Encantado.", "Soy Alex. Encantada.", "Me llamo Alex. Encantado.", "Me llamo Alex. Encantada.", "Soy Alex. Un placer."]}
          - {who: B, l2: "Igualmente. No eres de aquí, ¿verdad?", l1: "Likewise. You're not from here, are you?"}
          - {who: A, l2: "No, soy de Irlanda. ¿Y tú?", l1: "No, I'm from Ireland. And you? (informal)",
             alt: ["No, yo soy de Irlanda. ¿Y tú?", "No, de Irlanda. ¿Y tú?", "No, soy irlandés. ¿Y tú?", "No, soy irlandesa. ¿Y tú?"]}
          - {who: B, l2: "Yo soy de Valencia, pero vivo aquí desde hace dos años. ¿Y qué haces en Madrid? ¿Trabajas o estudias?", l1: "I'm from Valencia, but I've lived here for two years. And what do you do in Madrid? Do you work or study?"}
          - {who: A, l2: "Trabajo en un hotel.", l1: "I work in a hotel.",
             alt: ["Yo trabajo en un hotel.", "Trabajo. Trabajo en un hotel."]}
          - {who: B, l2: "¡Ah, qué bien! Yo soy enfermera, trabajo en el hospital de aquí al lado.", l1: "Oh, how nice! I'm a nurse, I work at the hospital next door."}

      - id: est-01-aprendo
        type: dialogue
        title: "I'm learning Spanish"
        scene: "At a party, a friend of a friend hears your accent and starts chatting with you."
        you: B
        lines:
          - {who: A, l2: "Oye, hablas muy bien español. ¿De dónde eres?", l1: "Hey, you speak Spanish very well. Where are you from?"}
          - {who: B, l2: "Gracias. Soy de Canadá.", l1: "Thanks. I'm from Canada.",
             alt: ["Muchas gracias. Soy de Canadá.", "Gracias. Yo soy de Canadá.", "Gracias. Soy canadiense."]}
          - {who: A, l2: "¡Anda, de Canadá! ¿Y cuánto tiempo llevas aquí?", l1: "Wow, from Canada! And how long have you been here?"}
          - {who: B, l2: "Dos meses. Estoy aprendiendo español.", l1: "Two months. I'm learning Spanish.",
             alt: ["Dos meses. Estoy estudiando español.", "Dos meses. Aprendo español.", "Dos meses. Estudio español.", "Llevo dos meses. Estoy aprendiendo español."]}
          - {who: A, l2: "Pues para dos meses hablas genial. ¿Te parece difícil?", l1: "Well, for two months you speak great. Do you find it difficult?"}
          - {who: B, l2: "Un poco, sí. Los verbos son difíciles.", l1: "A bit, yes. The verbs are difficult.",
             alt: ["Sí, un poco. Los verbos son difíciles.", "Un poco. Los verbos son difíciles.", "Un poquito, sí. Los verbos son difíciles."]}
          - {who: A, l2: "Ya, los verbos son lo peor. ¿Y hablas otros idiomas?", l1: "Yeah, the verbs are the worst. And do you speak other languages?"}
          - {who: B, l2: "Sí, inglés y un poco de francés.", l1: "Yes, English and a little French.",
             alt: ["Sí, hablo inglés y un poco de francés.", "Sí, inglés y algo de francés.", "Sí, inglés y un poquito de francés."]}
          - {who: A, l2: "¡Qué envidia! Yo solo hablo español... y mal.", l1: "I'm so jealous! I only speak Spanish... and badly."}

      - id: est-01-repetir
        type: dialogue
        title: "Sorry, I don't understand"
        scene: "A young man stops you in the street and asks you something very fast."
        you: B
        lines:
          - {who: A, l2: "Perdona, ¿sabes si hay un cajero por aquí cerca?", l1: "Excuse me, do you know if there's a cash machine near here?"}
          - {who: B, l2: "Perdona, no entiendo.", l1: "Sorry, I don't understand. (informal)",
             alt: ["Perdón, no entiendo.", "Lo siento, no entiendo.", "Disculpa, no entiendo.", "Perdona, no te entiendo.", "Perdona, no comprendo.", "Perdona, no lo entiendo.", "Perdón, no te entiendo.", "Lo siento, no te entiendo."]}
          - {who: A, l2: "Que si hay un cajero, un cajero automático, para sacar dinero.", l1: "Whether there's a cash machine, an ATM, to take out money."}
          - {who: B, l2: "Más despacio, por favor.", l1: "More slowly, please.",
             alt: ["Más lento, por favor.", "Por favor, más despacio.", "Habla más despacio, por favor.", "¿Puedes hablar más despacio, por favor?", "Más despacito, por favor."]}
          - {who: A, l2: "Sí, perdona. Un cajero. Un banco. Para sacar dinero.", l1: "Yes, sorry. A cash machine. A bank. To take out money."}
          - {who: B, l2: "¡Ah, un banco! Sí, hay uno en la plaza.", l1: "Ah, a bank! Yes, there's one in the square.",
             alt: ["¡Ah, un banco! Sí, hay un banco en la plaza.", "¡Ah, un banco! Sí, en la plaza hay uno."]}
          - {who: A, l2: "¿En la plaza? Genial, muchas gracias.", l1: "In the square? Great, thanks a lot."}
          - {who: B, l2: "De nada. ¡Adiós!", l1: "You're welcome. Goodbye!",
             alt: ["No hay de qué. ¡Adiós!", "De nada. ¡Hasta luego!", "Nada. ¡Adiós!", "De nada. ¡Chao!"]}

      - id: est-01-usted
        type: dialogue
        title: "Meeting someone older"
        scene: "Your friend Pablo introduces you to his grandmother in Seville. She calls you tú; you politely use usted with her. You are Alex."
        you: B
        lines:
          - {who: A, l2: "Tú eres Alex, ¿verdad? Pablo habla mucho de ti.", l1: "You're Alex, aren't you? Pablo talks about you a lot."}
          - {who: B, l2: "Sí, soy Alex. Mucho gusto, señora.", l1: "Yes, I'm Alex. Pleased to meet you, madam.",
             alt: ["Sí, soy Alex. Encantado, señora.", "Sí, soy Alex. Encantada, señora.", "Sí, soy yo. Mucho gusto, señora.", "Sí, soy Alex. Un placer, señora."]}
          - {who: A, l2: "Igualmente, cielo. ¿Cómo estás?", l1: "Likewise, dear. How are you?"}
          - {who: B, l2: "Muy bien, gracias. ¿Y usted?", l1: "Very well, thank you. And you? (formal)",
             alt: ["Estoy muy bien, gracias. ¿Y usted?", "Muy bien, gracias. ¿Y usted cómo está?", "Muy bien, gracias. ¿Cómo está usted?", "Muy bien, muchas gracias. ¿Y usted?"]}
          - {who: A, l2: "Bien, bien, aquí estamos. ¿Y te gusta Sevilla?", l1: "Fine, fine, getting by. And do you like Seville?"}
          - {who: B, l2: "Sí, me gusta mucho.", l1: "Yes, I like it a lot.",
             alt: ["Sí, mucho.", "Sí, me gusta muchísimo.", "Sí, Sevilla me gusta mucho."]}
          - {who: A, l2: "Me alegro. ¿Quieres un café? ¿O un poquito de tortilla?", l1: "I'm glad. Would you like a coffee? Or a little bit of omelette?"}
          - {who: B, l2: "Un café, por favor. Muchas gracias.", l1: "A coffee, please. Thank you very much.",
             alt: ["Sí, un café, por favor. Muchas gracias.", "Un café, por favor. Muchísimas gracias.", "Un cafecito, por favor. Muchas gracias."]}
          - {who: A, l2: "Nada, nada. Siéntate, que ahora mismo te lo traigo.", l1: "Not at all. Sit down, I'll bring it to you right away."}

      - id: est-01-palabra
        type: dialogue
        title: "What does that mean?"
        scene: "You are having a coffee with your Spanish flatmate Marta. She uses a word you don't know."
        you: A
        lines:
          - {who: B, l2: "Uf, hoy estoy agotada.", l1: "Phew, I'm exhausted today."}
          - {who: A, l2: "¿Qué significa «agotada»?", l1: "What does 'agotada' mean?",
             alt: ["¿Qué quiere decir «agotada»?", "¿Qué es «agotada»?", "¿«Agotada» qué significa?"]}
          - {who: B, l2: "Agotada es muy, muy cansada. He trabajado diez horas.", l1: "'Agotada' is very, very tired. I've worked ten hours."}
          - {who: A, l2: "Ah, vale, ya entiendo.", l1: "Ah, OK, now I understand.",
             alt: ["Ah, vale, ahora entiendo.", "Ah, vale, ya lo entiendo.", "Ah, vale, entiendo.", "Ah, vale, ahora lo entiendo.", "Ah, okey, ya entiendo.", "Ah, ok, ya entiendo.", "Ah, bueno, ya entiendo.", "Ah, ya entiendo.", "Ah, vale, ya comprendo.", "Ah, okey, ahora entiendo.", "Ah, listo, ya entiendo."]}
          - {who: B, l2: "¿Y tú qué tal el día? ¿Mucho trabajo?", l1: "And how was your day? Lots of work?"}
          - {who: A, l2: "Sí. ¿Cómo se dice «busy» en español?", l1: "Yes. How do you say 'busy' in Spanish?",
             alt: ["Sí. ¿Cómo se dice «busy»?", "Sí. ¿Cómo se dice en español «busy»?", "Sí. ¿Cómo dices «busy» en español?"]}
          - {who: B, l2: "Ocupado. O «liado», que es más coloquial: hoy estoy muy liada.", l1: "'Ocupado'. Or 'liado', which is more colloquial: I'm really tied up today."}
          - {who: A, l2: "¿Puedes repetir, por favor?", l1: "Can you repeat that, please? (informal)",
             alt: ["¿Puedes repetirlo, por favor?", "¿Me lo repites, por favor?", "¿Lo puedes repetir, por favor?", "¿Puedes repetir eso, por favor?", "¿Me lo puedes repetir, por favor?", "¿Puedes repetírmelo, por favor?", "Repite, por favor.", "¿Puedes repetir?", "¿Puedes decirlo otra vez, por favor?"]}
          - {who: B, l2: "Claro: li-a-do. Liado. Hoy he estado muy liada.", l1: "Sure: li-a-do. Liado. I've been really tied up today."}

      - id: est-01-despedida
        type: dialogue
        title: "Wrapping up a first chat"
        scene: "You have been talking to Lucía at the Thursday language exchange. It is late and you want to leave on a friendly note."
        you: A
        lines:
          - {who: A, l2: "Bueno, tengo que irme.", l1: "Well, I have to go.",
             alt: ["Bueno, me tengo que ir.", "Bueno, tengo que irme ya.", "Bueno, ya me tengo que ir.", "Bueno, tengo que marcharme.", "Bueno, me tengo que marchar.", "Bueno, debo irme."]}
          - {who: B, l2: "¿Ya? ¡Qué pena! Bueno, encantada de conocerte.", l1: "Already? What a shame! Well, lovely to meet you."}
          - {who: A, l2: "Igualmente. ¿Vienes el próximo jueves?", l1: "Likewise. Are you coming next Thursday? (informal)",
             alt: ["Igualmente. ¿Vienes el jueves que viene?", "Lo mismo digo. ¿Vienes el próximo jueves?", "Igualmente. ¿Vas a venir el próximo jueves?", "Igualmente. ¿Vas a venir el jueves que viene?", "Lo mismo digo. ¿Vienes el jueves que viene?"]}
          - {who: B, l2: "Sí, vengo todos los jueves. ¿Y tú?", l1: "Yes, I come every Thursday. And you?"}
          - {who: A, l2: "Yo también. ¡Hasta el jueves!", l1: "Me too. See you on Thursday!",
             alt: ["Yo también. ¡Nos vemos el jueves!", "También. ¡Hasta el jueves!", "Yo también vengo. ¡Hasta el jueves!", "Yo también. ¡Hasta el jueves, entonces!"]}
          - {who: B, l2: "¡Perfecto! Oye, ¿me das tu número y hablamos?", l1: "Perfect! Hey, will you give me your number and we'll be in touch?"}
          - {who: A, l2: "Claro. ¿Tienes WhatsApp?", l1: "Sure. Do you have WhatsApp? (informal)",
             alt: ["Claro que sí. ¿Tienes WhatsApp?", "Por supuesto. ¿Tienes WhatsApp?", "Claro. ¿Tienes wasap?", "Sí, claro. ¿Tienes WhatsApp?", "Claro. ¿Usas WhatsApp?"]}
          - {who: B, l2: "Sí, claro, como todo el mundo. Apunta... Venga, ¡hasta el jueves!", l1: "Yes, of course, like everybody. Write this down... Right, see you on Thursday!"}

  # ---------------------------------------------------------------- 2
  - id: est-02
    title: "Getting things done"
    goal: "I can order in a bar, buy food and clothes, ask the price, pay, and ask where something is."
    notes: |
      In shops and bars the script is short and predictable, so you can sound fluent early.

      - **You are asked**: *¿Qué te pongo?* · *Dígame.* · *¿Quién va ahora?* (answer **Yo** when it is your turn).
      - **You ask**: name the thing and add *por favor*: *Un café con leche, por favor.* Spaniards also say *¿Me pones…?*; *Quería…* is the polite all-purpose opener.
      - **Keep it moving**: *¿Qué es eso?* · *¿Cuánto cuesta?* · *¿A cuánto están…?* (for market prices that change) · *¿La tienes en azul?*
      - **Finish**: *Nada más, gracias.* · *¿Cuánto es?* · *¿Me cobras?* · *¿Puedo pagar con tarjeta?* · *Me la llevo.*
      - **Find things**: *Perdona / Perdone, ¿dónde está…?* Then repeat the answer back (*¿Al fondo a la derecha?*) to check you heard it.

      Waiters and stallholders usually say **tú**; in a supermarket or an office, **usted** (*perdone*, *¿tienen…?*) is the safe choice.
    items:
      - id: est-02-bar
        type: dialogue
        title: "Ordering at a bar"
        scene: "It is breakfast time. You walk up to the counter of a neighbourhood bar."
        you: B
        lines:
          - {who: A, l2: "¡Hola, buenas! ¿Qué te pongo?", l1: "Hi there! What can I get you?"}
          - {who: B, l2: "Un café con leche, por favor.", l1: "A coffee with milk, please.",
             alt: ["Me pones un café con leche, por favor.", "Quiero un café con leche, por favor.", "Quería un café con leche, por favor.", "Para mí, un café con leche, por favor.", "Me das un café con leche, por favor.", "Me pone un café con leche, por favor.", "Un café con leche, porfa.", "Hola. Un café con leche, por favor."]}
          - {who: A, l2: "¿Algo para comer? Tenemos tostadas, cruasanes, tortilla...", l1: "Anything to eat? We have toast, croissants, omelette..."}
          - {who: B, l2: "Sí, una tostada con tomate.", l1: "Yes, a toast with tomato.",
             alt: ["Sí, una tostada con tomate, por favor.", "Sí, una tostada de tomate.", "Sí, quiero una tostada con tomate."]}
          - {who: A, l2: "Muy bien. ¿Para tomar aquí o para llevar?", l1: "Very good. To have here or to take away?"}
          - {who: B, l2: "Para tomar aquí.", l1: "To have here.",
             alt: ["Para aquí.", "Para tomar aquí, por favor.", "Para aquí, por favor.", "Aquí.", "Para acá.", "Para comer aquí.", "Para tomar acá."]}
          - {who: A, l2: "Perfecto. Siéntate donde quieras, ahora te lo llevo.", l1: "Perfect. Sit wherever you like, I'll bring it over in a moment."}
          - {who: B, l2: "Vale, muchas gracias.", l1: "OK, thanks a lot.",
             alt: ["Vale, gracias.", "Muy bien, muchas gracias.", "Okey, muchas gracias.", "Ok, muchas gracias.", "Bueno, muchas gracias.", "Dale, muchas gracias.", "Listo, muchas gracias.", "De acuerdo, muchas gracias."]}

      - id: est-02-cobrar
        type: dialogue
        title: "Paying at the bar"
        scene: "You have finished your breakfast and catch the waitress's eye to pay."
        you: A
        lines:
          - {who: A, l2: "Perdona, ¿me cobras, por favor?", l1: "Excuse me, can you take my payment, please? (informal; literally 'will you charge me?')",
             alt: ["Perdona, ¿me cobras?", "Perdona, la cuenta, por favor.", "Perdona, ¿me traes la cuenta, por favor?", "Disculpa, ¿me cobras, por favor?", "Perdone, ¿me cobra, por favor?", "Perdone, la cuenta, por favor.", "Disculpa, la cuenta, por favor.", "Perdona, ¿me puedes cobrar, por favor?", "Perdón, ¿me cobras, por favor?"]}
          - {who: B, l2: "Sí, claro. A ver... un café con leche y una tostada. Son cuatro con veinte.", l1: "Yes, of course. Let's see... a coffee with milk and a toast. That's four twenty."}
          - {who: A, l2: "¿Puedo pagar con tarjeta?", l1: "Can I pay by card?",
             alt: ["¿Se puede pagar con tarjeta?", "¿Puedo pagar con la tarjeta?", "¿Con tarjeta?", "¿Aceptan tarjeta?", "¿Aceptáis tarjeta?", "¿Puedo pagar con tarjeta, por favor?", "¿Te puedo pagar con tarjeta?"]}
          - {who: B, l2: "Uy, lo siento, la máquina no funciona hoy. Solo efectivo.", l1: "Oh, I'm sorry, the machine isn't working today. Cash only."}
          - {who: A, l2: "No pasa nada. Aquí tienes.", l1: "No problem. Here you are. (informal)",
             alt: ["No pasa nada. Toma.", "No hay problema. Aquí tienes.", "No importa. Aquí tienes.", "No pasa nada. Aquí tiene.", "No te preocupes. Aquí tienes.", "Tranquila. Aquí tienes.", "No hay problema. Toma."]}
          - {who: B, l2: "Cinco euros... y aquí tienes la vuelta, ochenta céntimos.", l1: "Five euros... and here's your change, eighty cents."}
          - {who: A, l2: "Gracias. ¡Que tengas un buen día!", l1: "Thanks. Have a good day! (informal)",
             alt: ["Gracias. ¡Que tengas buen día!", "Gracias. ¡Buen día!", "Gracias. ¡Que pases un buen día!", "Muchas gracias. ¡Que tengas un buen día!", "Gracias. ¡Que tengas un lindo día!"]}
          - {who: B, l2: "¡Igualmente! ¡Hasta luego!", l1: "You too! See you!"}

      - id: est-02-panaderia
        type: dialogue
        title: "At the bakery"
        scene: "You are in the queue at a bakery. The baker, an older woman, calls the next customer: you."
        you: B
        lines:
          - {who: A, l2: "¡Siguiente! Buenos días, dígame.", l1: "Next! Good morning, what can I do for you?"}
          - {who: B, l2: "Buenos días. Una barra de pan, por favor.", l1: "Good morning. A loaf of bread (una barra), please.",
             alt: ["Buenos días. Quería una barra de pan, por favor.", "Buenos días. Quiero una barra de pan, por favor.", "Buenos días. Me da una barra de pan, por favor.", "Buenos días. Me pone una barra de pan, por favor.", "Hola, buenos días. Una barra de pan, por favor.", "Buenos días. Una barra, por favor."]}
          - {who: A, l2: "Aquí tiene. ¿Qué más?", l1: "Here you are. What else?"}
          - {who: B, l2: "¿Qué es eso?", l1: "What is that?",
             alt: ["¿Eso qué es?", "¿Y eso qué es?", "¿Qué es eso de ahí?", "¿Y qué es eso?"]}
          - {who: A, l2: "Son magdalenas de limón, las hacemos aquí. Están riquísimas.", l1: "They're lemon muffins, we make them here. They're delicious."}
          - {who: B, l2: "Vale, pues cuatro, por favor.", l1: "OK, four then, please.",
             alt: ["Vale, pues cuatro.", "Vale, cuatro, por favor.", "Vale, entonces cuatro, por favor.", "Bueno, pues cuatro, por favor.", "Bueno, entonces cuatro, por favor.", "Okey, pues cuatro, por favor.", "Vale, pues deme cuatro, por favor.", "Pues cuatro, por favor.", "Okey, entonces cuatro, por favor."]}
          - {who: A, l2: "Muy bien. ¿Algo más?", l1: "Very good. Anything else?"}
          - {who: B, l2: "No, nada más, gracias.", l1: "No, nothing else, thanks.",
             alt: ["No, nada más.", "Nada más, gracias.", "No, gracias, nada más.", "No, eso es todo, gracias.", "No, es todo, gracias.", "No, gracias. Eso es todo.", "No, ya está, gracias."]}
          - {who: A, l2: "Pues son tres euros con sesenta.", l1: "That's three euros sixty, then."}

      - id: est-02-camiseta
        type: dialogue
        title: "How much is it?"
        scene: "You are looking at T-shirts on a street-market stall. The stallholder is about your age."
        you: A
        lines:
          - {who: A, l2: "Hola. ¿Cuánto cuesta esta camiseta?", l1: "Hi. How much is this T-shirt?",
