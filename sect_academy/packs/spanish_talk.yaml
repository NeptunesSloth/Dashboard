  # ---------------------------------------------------------------- 6
  - id: est-06
    title: "Telling what happened"
    goal: "I can tell someone about my weekend, a trip, a mishap or my childhood, and react naturally to their good and bad news."
    notes: |
      A story needs two things: your telling, and the listener's reactions. Practise both.

      - **Open a story**: *No te vas a creer lo que me pasó ayer.* · *Te cuento una.* · *Un día…*
      - **Tell it**: the **indefinido** for what happened (*fui*, *me robaron*, *me di cuenta*), the **imperfecto** for the scene and for habits (*estaba en el metro*, *vivía en un pueblo*, *jugaba en la calle*).
      - **Keep the other person talking**: *¿Y eso?* · *¿Y qué hiciste?* · *¿Y cómo está?*
      - **Good news**: *¿En serio? ¡Enhorabuena!* · *¡Qué bien! Me alegro mucho por ti.* · *Hay que celebrarlo.*
      - **Bad news**: *¡Vaya! Lo siento mucho.* · *¡Qué pena!* · *Pobrecito.* · *¿Puedo ayudarte en algo?*
      - **Relief**: *Menos mal.* · *Solo fue un susto.*
      - **Promise**: *¡Eso está hecho!*

      For a period that is not over (*hoy*, *esta mañana*) Spain says *he puesto una denuncia*; Latin America says *puse*. For *ayer* or *el sábado*, everyone uses the indefinido. *¡Enhorabuena!* is mainly Spain; *¡Felicidades!* works everywhere.
