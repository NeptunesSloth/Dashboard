  # ---------------------------------------------------------------- 7
  - id: est-07
    title: "Opinions and feelings"
    goal: "I can give my opinion with reasons, agree and disagree politely, buy time while I think, compare things, recommend a film and say how I feel."
    notes: |
      A discussion in Spanish is lively, but disagreement comes wrapped in softeners. Collect these chunks.

      - **Agree**: *Estoy totalmente de acuerdo.* · *Exacto.* · *Tienes razón.* · *Eso sí.*
      - **Disagree gently**: start with *Bueno…* or concede first — *Puede ser, pero…* · *Yo no lo veo así.* · *No estoy tan seguro/a.* Then give ground where you can: *En eso sí tienes razón.*
      - **Give reasons**: *Por varias razones.* · *Sobre todo…* · *Además…* · *Por eso…*
      - **Buy time**: *A ver…* · *Pues…* · *Déjame pensar.* · *Es que… ¿cómo te diría?* · *O sea…* · *Depende.* Fillers are not bad Spanish; natives use them constantly, and they keep your turn while you think.
      - **Compare**: *más… que*, *menos… que*, *no es para tanto*, *están igual*.
      - **Recommend**: *Te la recomiendo.* · *Trata de…* · *Vale la pena.*
      - **Feelings**: *La verdad es que no estoy muy bien.* · *Echo de menos a…* · *Gracias por escucharme.*

      Latin America says *extrañar* for *echar de menos* and often *la plata* for *el dinero*.
    items:
      - id: est-07-acuerdo
        type: dialogue
        title: "Agreeing"
        scene: "Lunch with your colleague Dani. He is complaining about having to come into the office."
        you: B
        lines:
          - {who: A, l2: "Yo creo que trabajar desde casa es mucho mejor que venir a la oficina. ¿Tú qué opinas?", l1: "I think working from home is much better than coming to the office. What do you think?"}
          - {who: B, l2: "Estoy totalmente de acuerdo contigo.", l1: "I totally agree with you. (informal)",
             alt: ["Estoy completamente de acuerdo contigo.", "Estoy totalmente de acuerdo.", "Estoy completamente de acuerdo.", "Estoy muy de acuerdo contigo.", "Estoy del todo de acuerdo contigo.", "Estoy absolutamente de acuerdo contigo.", "Estoy cien por cien de acuerdo contigo.", "Estoy cien por ciento de acuerdo contigo.", "Totalmente de acuerdo contigo.", "Totalmente de acuerdo.", "Yo estoy totalmente de acuerdo contigo."]}
          - {who: A, l2: "Es que pierdes dos horas al día en el transporte. ¡Dos horas!", l1: "You just lose two hours a day commuting. Two hours!"}
          - {who: B, l2: "Exacto. Y además se ahorra dinero.", l1: "Exactly. And besides, you save money.",
             alt: ["Exacto. Y además ahorras dinero.", "Exacto. Y además te ahorras dinero.", "Exactamente. Y además se ahorra dinero.", "Exactamente. Y además ahorras dinero.", "Exacto. Y encima se ahorra dinero.", "Exacto. Además, se ahorra dinero.", "Exacto. Además, ahorras dinero.", "Eso es. Y además se ahorra dinero.", "Exacto. Y también se ahorra dinero.", "Exacto. Y además se ahorra plata.", "Exacto. Y además ahorras plata.", "Exactamente. Y además te ahorras dinero.", "Exacto. Y además uno ahorra dinero.", "Exacto. Y encima ahorras dinero.", "Exactamente. Y además ahorras plata."]}
          - {who: A, l2: "¡Claro! Aunque reconozco que a veces echo de menos a los compañeros.", l1: "Of course! Although I admit that sometimes I miss my colleagues."}
          - {who: B, l2: "Sí, tienes razón. Eso es lo único malo.", l1: "Yes, you're right. That's the only bad thing.",
             alt: ["Sí, tienes razón. Es lo único malo.", "Sí, es verdad. Eso es lo único malo.", "Sí, es cierto. Eso es lo único malo.", "Ya, tienes razón. Eso es lo único malo.", "Sí, llevas razón. Eso es lo único malo.", "Sí, tienes razón. Eso es lo único negativo.", "Sí, tienes razón. Es lo único negativo.", "Sí, es verdad. Es lo único malo.", "Sí, tienes razón. Esa es la única cosa mala.", "Sí, tienes razón. Eso es lo único que es malo.", "Sí, en eso tienes razón. Eso es lo único malo."]}
          - {who: A, l2: "Por eso lo ideal sería venir dos días y quedarse en casa tres, ¿no crees?", l1: "That's why the ideal would be to come in two days and stay at home three, don't you think?"}
          - {who: B, l2: "Yo también creo que es lo mejor.", l1: "I also think that's the best thing.",
             alt: ["Yo también pienso que es lo mejor.", "También creo que es lo mejor.", "A mí también me parece lo mejor.", "También me parece lo mejor.", "A mí también me parece que es lo mejor.", "Yo también creo que eso es lo mejor.", "Yo también pienso que eso es lo mejor.", "También pienso que es lo mejor.", "Yo también opino que es lo mejor.", "Yo también creo que sería lo mejor.", "A mí también me parece la mejor opción."]}

      - id: est-07-desacuerdo
        type: dialogue
        title: "Disagreeing politely"
        scene: "Your friend Pablo is fed up with city life. You like the city, and say so without starting an argument."
        you: B
        lines:
          - {who: A, l2: "Para mí, vivir en una ciudad grande es un horror. Yo me iría a un pueblo mañana mismo.", l1: "For me, living in a big city is a nightmare. I'd move to a village tomorrow."}
          - {who: B, l2: "Bueno, yo no lo veo así.", l1: "Well, I don't see it that way.",
             alt: ["Bueno, no lo veo así.", "Pues yo no lo veo así.", "Bueno, yo no lo veo de esa manera.", "Bueno, yo lo veo de otra manera.", "Bueno, yo no lo veo igual.", "Bueno, yo no pienso así.", "Bueno, yo no pienso lo mismo.", "Bueno, yo no opino lo mismo.", "Bueno, yo no opino igual.", "Bueno, yo no estoy de acuerdo.", "Bueno, no estoy de acuerdo.", "Bueno, yo no creo lo mismo.", "Bueno, yo lo veo distinto.", "Bueno, yo no lo veo de ese modo.", "Hombre, yo no lo veo así."]}
          - {who: A, l2: "¿Ah, no? Pero si aquí todo es ruido, contaminación, prisas...", l1: "Oh, no? But here it's all noise, pollution, rushing about..."}
          - {who: B, l2: "Puede ser, pero hay más trabajo y más cultura.", l1: "Maybe, but there's more work and more culture.",
             alt: ["Puede que sí, pero hay más trabajo y más cultura.", "Quizás, pero hay más trabajo y más cultura.", "Quizá, pero hay más trabajo y más cultura.", "Tal vez, pero hay más trabajo y más cultura.", "Es posible, pero hay más trabajo y más cultura.", "A lo mejor, pero hay más trabajo y más cultura.", "Puede ser, pero hay más trabajo y cultura.", "Puede, pero hay más trabajo y más cultura.", "Puede ser, pero también hay más trabajo y más cultura.", "Es posible, pero hay más trabajo y cultura.", "Quizás, pero hay más trabajo y cultura.", "Tal vez, pero hay más trabajo y cultura."]}
