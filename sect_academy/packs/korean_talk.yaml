          - {who: B, l2: "서울대학교로 가 주세요.", rom: "seouldaehakgyoro ga juseyo.", l1: "To Seoul National University, please.", alt: ["서울대학교요.", "서울대학교까지 가 주세요.", "서울대로 가 주세요."]}
          - {who: A, l2: "네. 오늘은 길이 좀 막히네요.", rom: "ne. oneureun giri jom makineyo.", l1: "Okay. The traffic's a bit heavy today."}
          - {who: B, l2: "얼마나 걸려요?", rom: "eolmana geollyeoyo?", l1: "How long will it take?", alt: ["시간이 얼마나 걸려요?", "오래 걸려요?"]}
          - {who: A, l2: "삼십 분쯤 걸릴 거예요.", rom: "samsip bunjjeum geollil geoyeyo.", l1: "About thirty minutes, I'd say."}
          - {who: B, l2: "정문 앞에서 세워 주세요.", rom: "jeongmun apeseo sewo juseyo.", l1: "Please stop in front of the main gate.", alt: ["정문 앞에서 내릴게요.", "정문에서 세워 주세요."]}
          - {who: A, l2: "네, 도착했습니다. 만 이천 원입니다.", rom: "ne, dochakaesseumnida. man icheon wonimnida.", l1: "Here we are. That's 12,000 won."}
          - {who: B, l2: "카드로 할게요. 감사합니다.", rom: "kadeuro halgeyo. gamsahamnida.", l1: "I'll pay by card. Thank you.", alt: ["카드 돼요?", "카드로 계산할게요. 감사합니다."]}

      - id: ko-talk-04-helping
        type: dialogue
        title: "Giving directions"
        scene: "Now someone asks you the way. The station is about 100 metres ahead on the left, next to a convenience store."
        you: B
        lines:
          - {who: A, l2: "실례합니다. 이 근처에 역이 있어요?", rom: "sillyehamnida. i geuncheoe yeogi isseoyo?", l1: "Excuse me. Is there a station near here?"}
          - {who: B, l2: "네, 있어요. 이 길로 쭉 가세요.", rom: "ne, isseoyo. i gillo jjuk gaseyo.", l1: "Yes, there is. Go straight along this road.", alt: ["네, 이 길로 쭉 가세요.", "네, 있어요. 똑바로 가세요."]}
          - {who: A, l2: "얼마나 가야 돼요?", rom: "eolmana gaya dwaeyo?", l1: "How far do I have to go?"}
          - {who: B, l2: "백 미터쯤 가면 왼쪽에 있어요.", rom: "baek miteojjeum gamyeon oenjjoge isseoyo.", l1: "About 100 metres, and it's on the left.", alt: ["조금 가면 왼쪽에 있어요.", "백 미터쯤 가면 있어요."]}
          - {who: A, l2: "편의점 옆이에요?", rom: "pyeonuijeom yeopieyo?", l1: "Is it next to the convenience store?"}
          - {who: B, l2: "네, 맞아요. 편의점 옆에 있어요.", rom: "ne, majayo. pyeonuijeom yeope isseoyo.", l1: "Yes, that's right. It's next to the convenience store.", alt: ["네, 맞아요.", "네, 편의점 옆에 있어요."]}
          - {who: A, l2: "감사합니다!", rom: "gamsahamnida!", l1: "Thank you!"}
          - {who: B, l2: "아니에요. 조심히 가세요.", rom: "anieyo. josimhi gaseyo.", l1: "Not at all. Take care.", alt: ["아니에요.", "천만에요."]}

  # ───────────────────────────────────────────────────────────────── 5
  - id: ko-talk-05
    title: "At the doctor's and the pharmacy"
    goal: "I can register at a clinic, describe symptoms and how long I have had them, understand instructions for medicine and call in sick."
    notes: |
      Clinic and pharmacy staff use very polite forms. Learn to recognise them:

      | you hear | it means |
      |---|---|
      | 어떻게 오셨어요? | what brings you here? |
      | 어디가 불편하세요? / 어디가 아프세요? | what's the matter? |
      | 언제부터 그러셨어요? | since when? |
      | 하루에 세 번, 식사 후에 드세요 | three times a day, after meals |

      ## Describing what is wrong
      - (body part)이/가 아파요: 배가 아파요, 목이 아파요.
      - **-부터**: since: 어제부터, 사흘 전부터 (for three days).
      - 열이 나요, 기침을 해요, 콧물이 나요, 몸이 안 좋아요 (I don't feel well).
      - Injuries use the past: 발목을 다쳤어요, 넘어졌어요.

      ## Asking about medicine
      약은 하루에 몇 번 먹어야 돼요? · 이 약을 먹으면 졸려요? · 운동해도 돼요?

      Clinics (병원, 의원) usually want your passport or alien registration card the first time: 처음 오셨어요? 신분증 있으세요?

      To a manager on the phone, keep it short and formal: 죄송합니다. 오늘 몸이 너무 안 좋아서 출근을 못 하겠습니다.
    items:
      - id: ko-talk-05-reception
        type: dialogue
        title: "At the clinic reception"
        scene: "You walk into a local clinic for the first time with a sore throat."
        you: B
        lines:
          - {who: A, l2: "안녕하세요. 어떻게 오셨어요?", rom: "annyeonghaseyo. eotteoke osyeosseoyo?", l1: "Hello. What brings you here?"}
          - {who: B, l2: "목이 아파서 왔어요.", rom: "mogi apaseo wasseoyo.", l1: "I've come because I have a sore throat.", alt: ["목이 아파요.", "감기에 걸렸어요.", "목이 너무 아파서 왔어요."]}
          - {who: A, l2: "처음 오셨어요?", rom: "cheoeum osyeosseoyo?", l1: "Is this your first visit?"}
          - {who: B, l2: "네, 처음이에요.", rom: "ne, cheoeumieyo.", l1: "Yes, it's my first time.", alt: ["네, 처음 왔어요.", "처음이에요."]}
          - {who: A, l2: "신분증 있으세요? 그리고 여기에 이름하고 전화번호를 써 주세요.", rom: "sinbunjeung isseuseyo? geurigo yeogie ireumhago jeonhwabeonhoreul sseo juseyo.", l1: "Do you have ID? And please write your name and phone number here."}
          - {who: B, l2: "네, 여권 여기 있어요.", rom: "ne, yeogwon yeogi isseoyo.", l1: "Yes, here's my passport.", alt: ["여기 여권이요.", "네, 여기 있어요."]}
          - {who: A, l2: "감사합니다. 앉아서 잠시만 기다려 주세요.", rom: "gamsahamnida. anjaseo jamsiman gidaryeo juseyo.", l1: "Thank you. Please take a seat and wait a moment."}
          - {who: B, l2: "네, 감사합니다.", rom: "ne, gamsahamnida.", l1: "Okay, thank you.", alt: ["감사합니다.", "네, 알겠습니다."]}

      - id: ko-talk-05-stomach
        type: dialogue
        title: "A stomach ache"
        scene: "You have had a stomach ache since eating raw fish last night. The doctor asks you about it."
        you: B
        lines:
          - {who: A, l2: "어디가 불편하세요?", rom: "eodiga bulpyeonhaseyo?", l1: "What seems to be the problem?"}
          - {who: B, l2: "어제부터 배가 아파요.", rom: "eojebuteo baega apayo.", l1: "I've had a stomach ache since yesterday.", alt: ["배가 아파요.", "어제부터 배가 너무 아파요."]}
          - {who: A, l2: "어제 뭐 드셨어요?", rom: "eoje mwo deusyeosseoyo?", l1: "What did you eat yesterday?"}
          - {who: B, l2: "저녁에 회를 먹었어요.", rom: "jeonyeoge hoereul meogeosseoyo.", l1: "I had raw fish in the evening.", alt: ["회를 먹었어요.", "어제 저녁에 회를 먹었어요."]}
          - {who: A, l2: "배탈이 났네요. 오늘은 죽만 드세요.", rom: "baetari nanneyo. oneureun jungman deuseyo.", l1: "You have an upset stomach. Eat only rice porridge today."}
          - {who: B, l2: "약은 하루에 몇 번 먹어야 돼요?", rom: "yageun harue myeot beon meogeoya dwaeyo?", l1: "How many times a day should I take the medicine?", alt: ["약은 몇 번 먹어요?", "하루에 몇 번 먹어야 해요?", "약은 하루에 몇 번 먹어요?"]}
          - {who: A, l2: "하루에 세 번, 식사 후에 드세요.", rom: "harue se beon, siksa hue deuseyo.", l1: "Three times a day, after meals."}
          - {who: B, l2: "네, 알겠습니다. 감사합니다.", rom: "ne, algesseumnida. gamsahamnida.", l1: "All right. Thank you.", alt: ["알겠습니다. 감사합니다.", "네, 감사합니다."]}

      - id: ko-talk-05-pharmacy
        type: dialogue
        title: "At the pharmacy"
        scene: "You have a headache and go into a pharmacy."
        you: B
        lines:
          - {who: A, l2: "어서 오세요. 어떻게 오셨어요?", rom: "eoseo oseyo. eotteoke osyeosseoyo?", l1: "Hello. How can I help?"}
          - {who: B, l2: "머리가 아파요. 진통제 있어요?", rom: "meoriga apayo. jintongje isseoyo?", l1: "I have a headache. Do you have painkillers?", alt: ["머리가 아파요. 약 있어요?", "머리가 아픈데 약 있어요?", "진통제 있어요?"]}
          - {who: A, l2: "열도 있으세요?", rom: "yeoldo isseuseyo?", l1: "Do you have a temperature as well?"}
          - {who: B, l2: "아니요, 열은 없어요.", rom: "aniyo, yeoreun eopseoyo.", l1: "No, I don't have a temperature.", alt: ["아니요, 열은 안 나요.", "열은 없어요."]}
          - {who: A, l2: "그럼 이 약을 드세요. 네 시간마다 한 알씩 드세요.", rom: "geureom i yageul deuseyo. ne siganmada han alssik deuseyo.", l1: "Then take this. One tablet every four hours."}
          - {who: B, l2: "이 약 먹으면 졸려요?", rom: "i yak meogeumyeon jollyeoyo?", l1: "Will this make me sleepy?", alt: ["먹으면 졸려요?", "이 약을 먹으면 졸려요?"]}
          - {who: A, l2: "아니요, 괜찮아요. 사천 원입니다.", rom: "aniyo, gwaenchanayo. sacheon wonimnida.", l1: "No, it won't. That's 4,000 won."}
          - {who: B, l2: "여기 있어요. 감사합니다.", rom: "yeogi isseoyo. gamsahamnida.", l1: "Here you are. Thank you.", alt: ["감사합니다.", "여기요. 감사합니다."]}

      - id: ko-talk-05-ankle
        type: dialogue
        title: "A twisted ankle"
        scene: "You fall over on the way to a café with a Korean friend."
        you: B
        lines:
          - {who: A, l2: "어머, 괜찮아요?", rom: "eomeo, gwaenchanayo?", l1: "Oh no, are you all right?"}
          - {who: B, l2: "넘어져서 발목을 다쳤어요.", rom: "neomeojyeoseo balmogeul dachyeosseoyo.", l1: "I fell and hurt my ankle.", alt: ["발목을 다쳤어요.", "넘어졌어요. 발목이 아파요."]}
          - {who: A, l2: "많이 아파요? 걸을 수 있어요?", rom: "mani apayo? georeul su isseoyo?", l1: "Does it hurt a lot? Can you walk?"}
          - {who: B, l2: "아니요, 너무 아파서 못 걷겠어요.", rom: "aniyo, neomu apaseo mot geotgesseoyo.", l1: "No, it hurts too much to walk.", alt: ["아니요, 걸을 수 없어요.", "너무 아파서 못 걸어요."]}
          - {who: A, l2: "병원에 가야겠어요. 택시 부를게요.", rom: "byeongwone gayagesseoyo. taeksi bureulgeyo.", l1: "You need to see a doctor. I'll call a taxi."}
          - {who: B, l2: "고마워요. 같이 가 줄 수 있어요?", rom: "gomawoyo. gachi ga jul su isseoyo?", l1: "Thank you. Could you come with me?", alt: ["고마워요. 같이 가 주세요.", "같이 가 줄 수 있어요?"]}
          - {who: A, l2: "그럼요. 걱정하지 마세요.", rom: "geureomyo. geokjeonghaji maseyo.", l1: "Of course. Don't worry."}

      - id: ko-talk-05-followup
        type: dialogue
        title: "Back at the doctor's"
        scene: "A few days later you go back to the clinic about your cold."
        you: B
        lines:
          - {who: A, l2: "오늘은 좀 어떠세요?", rom: "oneureun jom eotteoseyo?", l1: "How are you feeling today?"}
          - {who: B, l2: "많이 좋아졌어요.", rom: "mani joajyeosseoyo.", l1: "Much better.", alt: ["좀 좋아졌어요.", "많이 나았어요."]}
          - {who: A, l2: "기침은 아직도 하세요?", rom: "gichimeun ajikdo haseyo?", l1: "Are you still coughing?"}
          - {who: B, l2: "네, 밤에 조금 해요.", rom: "ne, bame jogeum haeyo.", l1: "Yes, a little at night.", alt: ["네, 조금 해요.", "밤에 조금 해요."]}
          - {who: A, l2: "약을 사흘 더 드세요. 그리고 물을 많이 드세요.", rom: "yageul saheul deo deuseyo. geurigo mureul mani deuseyo.", l1: "Take the medicine for three more days. And drink plenty of water."}
          - {who: B, l2: "운동해도 돼요?", rom: "undonghaedo dwaeyo?", l1: "Can I do exercise?", alt: ["운동할 수 있어요?", "운동해도 괜찮아요?"]}
          - {who: A, l2: "이번 주에는 푹 쉬세요.", rom: "ibeon jueneun puk swiseyo.", l1: "Get plenty of rest this week."}
          - {who: B, l2: "네, 알겠습니다. 감사합니다.", rom: "ne, algesseumnida. gamsahamnida.", l1: "All right. Thank you.", alt: ["알겠습니다.", "네, 감사합니다."]}

      - id: ko-talk-05-sickday
        type: dialogue
        title: "Calling in sick"
        scene: "You wake up with a fever and phone your team leader. You are Sara."
        you: B
        lines:
          - {who: A, l2: "여보세요?", rom: "yeoboseyo?", l1: "Hello?"}
          - {who: B, l2: "팀장님, 저 사라예요. 오늘 몸이 너무 안 좋아요.", rom: "timjangnim, jeo sarayeyo. oneul momi neomu an joayo.", l1: "It's Sara. I'm feeling really unwell today.", alt: ["팀장님, 사라예요. 오늘 많이 아파요.", "팀장님, 저 사라입니다. 오늘 몸이 너무 안 좋아요."]}
          - {who: A, l2: "어디가 아파요?", rom: "eodiga apayo?", l1: "What's wrong?"}
          - {who: B, l2: "열이 많이 나고 기침을 해요.", rom: "yeori mani nago gichimeul haeyo.", l1: "I have a high temperature and a cough.", alt: ["열이 나고 기침을 해요.", "감기에 걸렸어요."]}
          - {who: A, l2: "그럼 오늘은 쉬고 병원에 가 보세요.", rom: "geureom oneureun swigo byeongwone ga boseyo.", l1: "Then take today off and go to the doctor's."}
          - {who: B, l2: "죄송합니다. 내일은 출근할게요.", rom: "joesonghamnida. naeireun chulgeunhalgeyo.", l1: "I'm sorry. I'll come in tomorrow.", alt: ["죄송합니다. 내일은 출근하겠습니다.", "감사합니다. 내일은 출근할게요."]}
          - {who: A, l2: "무리하지 말고 푹 쉬어요.", rom: "murihaji malgo puk swieoyo.", l1: "Don't push yourself, get some proper rest."}
          - {who: B, l2: "네, 감사합니다.", rom: "ne, gamsahamnida.", l1: "I will, thank you.", alt: ["감사합니다.", "네, 고맙습니다."]}

  # ───────────────────────────────────────────────────────────────── 6
  - id: ko-talk-06
    title: "Making plans"
    goal: "I can invite someone, accept or decline politely, suggest another time, change a plan and say I am running late."
    notes: |
      ## Inviting
      | | |
      |---|---|
      | 이번 주말에 시간 있어요? | are you free this weekend? |
      | 같이 영화 보러 갈까요? | shall we go and see a film? |
      | 같이 갈래요? | do you want to come? (friendly) |
      | 삼겹살 어때요? | how about pork belly? |

      ## Saying yes
      좋아요! · 네, 그래요. · 그때 봐요! (see you then).

      ## Saying no without saying no
      Koreans rarely refuse flatly. Apologise, give a short reason, and offer another time:

      미안해요. 그날은 약속이 있어요. 다음 주는 어때요?

      **약속** is any arrangement to meet someone, from a business meeting to coffee with a friend.

      ## Changing plans and running late
      - Start with **미안한데요** / 죄송한데요 ("sorry, but …"): 미안한데요, 시간을 좀 바꿀 수 있어요?
      - Running late: 십 분쯤 늦을 거예요. 거의 다 왔어요 ("I'm nearly there").
      - The other person will reassure you: 천천히 오세요.

      **이따 봐요** is "see you later (today)"; **내일 봐요**, **그때 봐요** are "see you tomorrow / then".
    items:
      - id: ko-talk-06-movie
        type: dialogue
        title: "Inviting a friend to the cinema"
        scene: "You want to see a new Korean film this weekend with your friend Jisu."
        you: A
        lines:
          - {who: A, l2: "지수 씨, 이번 주말에 시간 있어요?", rom: "jisu ssi, ibeon jumare sigan isseoyo?", l1: "Jisu, are you free this weekend?", alt: ["이번 주말에 시간 있어요?", "지수 씨, 주말에 시간 있어요?"]}
          - {who: B, l2: "토요일은 괜찮아요. 왜요?", rom: "toyoireun gwaenchanayo. waeyo?", l1: "Saturday is fine. Why?"}
          - {who: A, l2: "같이 영화 보러 갈까요?", rom: "gachi yeonghwa boreo galkkayo?", l1: "Shall we go and see a film together?", alt: ["같이 영화 볼까요?", "같이 영화 보러 가요."]}
          - {who: B, l2: "좋아요! 무슨 영화요?", rom: "joayo! museun yeonghwayo?", l1: "Great! Which film?"}
          - {who: A, l2: "요즘 인기 있는 한국 영화요.", rom: "yojeum ingi inneun hanguk yeonghwayo.", l1: "That Korean film everyone's watching at the moment.", alt: ["새 한국 영화요.", "한국 영화요."]}
          - {who: B, l2: "아, 저도 보고 싶었어요. 몇 시에 볼까요?", rom: "a, jeodo bogo sipeosseoyo. myeot sie bolkkayo?", l1: "Oh, I wanted to see that too. What time shall we go?"}
          - {who: A, l2: "오후 세 시 어때요?", rom: "ohu se si eottaeyo?", l1: "How about 3 p.m.?", alt: ["세 시 어때요?", "오후 세 시에 볼까요?"]}
          - {who: B, l2: "좋아요. 그럼 토요일에 봐요!", rom: "joayo. geureom toyoire bwayo!", l1: "Fine. See you on Saturday, then!"}

      - id: ko-talk-06-decline
        type: dialogue
        title: "Not tomorrow, how about next week?"
        scene: "A colleague invites you to dinner tomorrow, but you already have plans."
        you: B
        lines:
          - {who: A, l2: "내일 저녁에 같이 밥 먹을까요?", rom: "naeil jeonyeoge gachi bap meogeulkkayo?", l1: "Shall we have dinner together tomorrow evening?"}
          - {who: B, l2: "미안해요. 내일은 약속이 있어요.", rom: "mianhaeyo. naeireun yaksogi isseoyo.", l1: "Sorry. I already have plans tomorrow.", alt: ["죄송해요. 내일은 약속이 있어요.", "미안해요. 내일은 안 돼요."]}
          - {who: A, l2: "아, 그래요? 그럼 다음 주는 어때요?", rom: "a, geuraeyo? geureom daeum juneun eottaeyo?", l1: "Oh, I see. How about next week, then?"}
          - {who: B, l2: "다음 주 수요일은 괜찮아요.", rom: "daeum ju suyoireun gwaenchanayo.", l1: "Next Wednesday is fine.", alt: ["수요일은 괜찮아요.", "다음 주 수요일 어때요?"]}
          - {who: A, l2: "좋아요. 수요일 저녁에 만나요.", rom: "joayo. suyoil jeonyeoge mannayo.", l1: "Great. Let's meet on Wednesday evening."}
          - {who: B, l2: "네, 그때 봐요!", rom: "ne, geuttae bwayo!", l1: "Okay, see you then!", alt: ["네, 수요일에 봐요!", "좋아요. 그때 봐요!"]}

      - id: ko-talk-06-change
        type: dialogue
        title: "Changing the time"
        scene: "You are meeting Minsu at six, but a meeting has come up. You call him."
        you: A
        lines:
          - {who: A, l2: "민수 씨, 미안한데요. 약속 시간을 좀 바꿀 수 있어요?", rom: "minsu ssi, mianhandeyo. yaksok siganeul jom bakkul su isseoyo?", l1: "Minsu, I'm sorry, but could we change the time?", alt: ["미안한데요. 약속 시간을 좀 바꿀 수 있어요?", "민수 씨, 죄송한데요. 약속 시간 좀 바꿀 수 있어요?"]}
          - {who: B, l2: "네, 괜찮아요. 무슨 일 있어요?", rom: "ne, gwaenchanayo. museun il isseoyo?", l1: "Sure, no problem. Has something come up?"}
          - {who: A, l2: "갑자기 회의가 생겼어요.", rom: "gapjagi hoeuiga saenggyeosseoyo.", l1: "A meeting has suddenly come up.", alt: ["회의가 생겼어요.", "갑자기 회의가 잡혔어요."]}
          - {who: B, l2: "그럼 몇 시에 만날까요?", rom: "geureom myeot sie mannalkkayo?", l1: "So what time shall we meet?"}
          - {who: A, l2: "일곱 시 반은 어때요?", rom: "ilgop si baneun eottaeyo?", l1: "How about half past seven?", alt: ["일곱 시 반 어때요?", "7시 반은 어때요?"]}
          - {who: B, l2: "좋아요. 그럼 일곱 시 반에 거기서 봐요.", rom: "joayo. geureom ilgop si bane geogiseo bwayo.", l1: "Fine. See you there at half past seven, then."}
          - {who: A, l2: "고마워요. 이따 봐요!", rom: "gomawoyo. itta bwayo!", l1: "Thanks. See you later!", alt: ["고마워요. 이따가 봐요!", "이따 봐요!"]}

      - id: ko-talk-06-where
        type: dialogue
        title: "What shall we eat?"
        scene: "You and a friend are deciding where to have lunch. You had meat yesterday."
        you: B
        lines:
          - {who: A, l2: "점심에 뭐 먹을까요?", rom: "jeomsime mwo meogeulkkayo?", l1: "What shall we have for lunch?"}
          - {who: B, l2: "저는 다 좋아요. 뭐 먹고 싶어요?", rom: "jeoneun da joayo. mwo meokgo sipeoyo?", l1: "Anything's fine with me. What do you feel like?", alt: ["다 좋아요. 뭐 먹고 싶어요?", "저는 아무거나 괜찮아요. 뭐 먹고 싶어요?"]}
          - {who: A, l2: "삼겹살 어때요?", rom: "samgyeopsal eottaeyo?", l1: "How about pork belly?"}
          - {who: B, l2: "어제 고기를 먹었어요. 다른 거 먹어요.", rom: "eoje gogireul meogeosseoyo. dareun geo meogeoyo.", l1: "I had meat yesterday. Let's have something else.", alt: ["어제 고기 먹었어요. 다른 거 먹을까요?", "어제 고기를 먹었어요. 다른 거 먹을까요?"]}
          - {who: A, l2: "그럼 칼국수는 어때요? 근처에 맛집이 있어요.", rom: "geureom kalguksuneun eottaeyo? geuncheoe matjibi isseoyo.", l1: "Then how about noodle soup? There's a great place nearby."}
          - {who: B, l2: "좋아요! 칼국수 먹으러 가요.", rom: "joayo! kalguksu meogeureo gayo.", l1: "Great! Let's go and have noodle soup.", alt: ["좋아요. 칼국수 먹어요!", "좋아요! 거기 가요."]}

      - id: ko-talk-06-hiking
        type: dialogue
        title: "A team hike"
        scene: "A colleague tells you about a hike with the team on Saturday."
        you: B
        lines:
          - {who: A, l2: "이번 토요일에 팀 사람들하고 등산 가요. 같이 갈래요?", rom: "ibeon toyoire tim saramdeulhago deungsan gayo. gachi gallaeyo?", l1: "The team is going hiking this Saturday. Do you want to come?"}
          - {who: B, l2: "저도 가고 싶어요. 몇 시에 출발해요?", rom: "jeodo gago sipeoyo. myeot sie chulbalhaeyo?", l1: "I'd love to come. What time do you set off?", alt: ["좋아요. 몇 시에 출발해요?", "네, 갈게요. 몇 시에 출발해요?"]}
          - {who: A, l2: "아침 일곱 시에 회사 앞에서 출발해요.", rom: "achim ilgop sie hoesa apeseo chulbalhaeyo.", l1: "We leave from outside the office at seven in the morning."}
          - {who: B, l2: "일찍 가네요! 뭐 가져가야 돼요?", rom: "iljjik ganeyo! mwo gajyeogaya dwaeyo?", l1: "That's early! What should I bring?", alt: ["뭐 가져가야 돼요?", "뭐 가져가야 해요?", "일찍 출발하네요! 뭐 가져가야 돼요?"]}
          - {who: A, l2: "물하고 간식만 가져오세요. 점심은 같이 먹어요.", rom: "mulhago gansingman gajyeooseyo. jeomsimeun gachi meogeoyo.", l1: "Just bring water and snacks. We'll have lunch together."}
          - {who: B, l2: "등산화가 없는데 운동화도 괜찮아요?", rom: "deungsanhwaga eomneunde undonghwado gwaenchanayo?", l1: "I don't have hiking boots. Are trainers okay?", alt: ["운동화 신어도 돼요?", "운동화도 괜찮아요?"]}
          - {who: A, l2: "네, 괜찮아요. 쉬운 산이에요.", rom: "ne, gwaenchanayo. swiun sanieyo.", l1: "Yes, that's fine. It's an easy mountain."}

      - id: ko-talk-06-late
        type: dialogue
        title: "Running late"
        scene: "You are on a bus stuck in traffic and will be late meeting Jisu. You phone her."
        you: A
        lines:
          - {who: A, l2: "지수 씨, 미안해요. 십 분쯤 늦을 거예요.", rom: "jisu ssi, mianhaeyo. sip bunjjeum neujeul geoyeyo.", l1: "Jisu, I'm sorry. I'll be about ten minutes late.", alt: ["미안해요. 십 분쯤 늦을 거예요.", "죄송해요. 십 분쯤 늦어요."]}
          - {who: B, l2: "괜찮아요. 지금 어디쯤이에요?", rom: "gwaenchanayo. jigeum eodijjeumieyo?", l1: "That's all right. Where are you now?"}
          - {who: A, l2: "버스 안이에요. 길이 많이 막혀요.", rom: "beoseu anieyo. giri mani makyeoyo.", l1: "I'm on the bus. The traffic is really bad.", alt: ["지금 버스 안이에요. 길이 막혀요.", "버스 안이에요. 길이 막혀요."]}
          - {who: B, l2: "천천히 오세요. 저는 카페에서 기다릴게요.", rom: "cheoncheonhi oseyo. jeoneun kapeeseo gidarilgeyo.", l1: "Take your time. I'll wait in a café."}
          - {who: A, l2: "고마워요. 어느 카페예요?", rom: "gomawoyo. eoneu kapeyeyo?", l1: "Thanks. Which café?", alt: ["어느 카페예요?", "고마워요. 어느 카페에 있어요?"]}
          - {who: B, l2: "역 앞에 있는 카페예요.", rom: "yeok ape inneun kapeyeyo.", l1: "The one in front of the station."}
          - {who: A, l2: "알겠어요. 빨리 갈게요!", rom: "algesseoyo. ppalli galgeyo!", l1: "Okay. I'll be there as soon as I can!", alt: ["금방 갈게요!", "알겠어요. 금방 갈게요!"]}

  # ───────────────────────────────────────────────────────────────── 7
  - id: ko-talk-07
    title: "On the phone"
    goal: "I can ask for someone on the phone, leave and take a message, book a table, cope with a bad line and deal with a delivery call."
    notes: |
      A phone call starts with **여보세요?** Businesses answer with their name + 입니다: 네, 하나여행사입니다.

      ## Asking for someone
      - ○○ 씨 계세요? (is ○○ there?): 계시다, because you are being polite about them.
      - ○○ 씨 좀 바꿔 주세요. (please put ○○ on)
      - Answers: 지금 자리에 안 계세요 (not at their desk), 통화 중이세요 (on another call), 외근 중이세요 (out of the office).

      ## Messages
      | | |
      |---|---|
      | 메시지 남겨 드릴까요? | shall I take a message? |
      | 전화 부탁드려요. | please ask them to call me |
      | 전해 드릴게요. | I'll pass it on |

      ## When the line is bad
      잘 안 들려요 (I can't hear you well) · 다시 전화할게요 · 이제 들려요?

      ## Phone numbers
      Read digit by digit with Sino-Korean numbers; 0 is 공, and the groups are separated by a pause (or 에 in fast speech): 공일공, 일이삼사, 오육칠팔.

      Delivery drivers (택배) phone to ask where to leave a parcel. 문 앞에 놓아 주세요 = leave it at the door.

      End a call to someone working with **수고하세요** ("keep up the good work"), but not to a superior.
    items:
      - id: ko-talk-07-office
        type: dialogue
        title: "Calling an office"
        scene: "You phone a travel agency to speak to Kim Minho. He is not at his desk. You are Sara."
        you: B
        lines:
          - {who: A, l2: "네, 하나여행사입니다.", rom: "ne, hanayeohaengsaimnida.", l1: "Hello, Hana Travel."}
          - {who: B, l2: "안녕하세요. 김민호 씨 계세요?", rom: "annyeonghaseyo. gimminho ssi gyeseyo?", l1: "Hello. Is Kim Minho there?", alt: ["안녕하세요. 김민호 씨 좀 바꿔 주세요.", "김민호 씨 계세요?", "안녕하세요. 김민호 씨하고 통화할 수 있어요?"]}
          - {who: A, l2: "지금 자리에 안 계세요. 메시지 남겨 드릴까요?", rom: "jigeum jarie an gyeseyo. mesiji namgyeo deurilkkayo?", l1: "He's not at his desk at the moment. Shall I take a message?"}
          - {who: B, l2: "네, 저는 사라예요. 전화 부탁드려요.", rom: "ne, jeoneun sarayeyo. jeonhwa butakdeuryeoyo.", l1: "Yes, this is Sara. Please ask him to call me.", alt: ["네, 사라예요. 전화 부탁드려요.", "제 이름은 사라예요. 전화 부탁드립니다."]}
          - {who: A, l2: "네, 전화번호가 어떻게 되세요?", rom: "ne, jeonhwabeonhoga eotteoke doeseyo?", l1: "Certainly. What's your number?"}
          - {who: B, l2: "공일공, 일이삼사, 오육칠팔이에요.", rom: "gongilgong, irisamsa, oyukchilparieyo.", l1: "It's 010-1234-5678.", alt: ["공일공 일이삼사 오육칠팔이에요.", "010-1234-5678이에요.", "공일공에 일이삼사에 오육칠팔이에요.", "gongilgong ilisamsa oyukchilparieyo"]}
          - {who: A, l2: "네, 전해 드릴게요.", rom: "ne, jeonhae deurilgeyo.", l1: "Thank you. I'll pass it on."}
          - {who: B, l2: "감사합니다. 안녕히 계세요.", rom: "gamsahamnida. annyeonghi gyeseyo.", l1: "Thank you. Goodbye.", alt: ["감사합니다.", "네, 감사합니다."]}

      - id: ko-talk-07-callback
        type: dialogue
        title: "Calling a friend back"
        scene: "You missed a call from your friend Jisu during class, so you call her back. You are Sara."
        you: B
        lines:
          - {who: A, l2: "여보세요?", rom: "yeoboseyo?", l1: "Hello?"}
          - {who: B, l2: "지수 씨, 저 사라예요. 아까 전화했어요?", rom: "jisu ssi, jeo sarayeyo. akka jeonhwahaesseoyo?", l1: "Jisu, it's Sara. Did you call me earlier?", alt: ["지수 씨, 사라예요. 아까 전화했어요?", "저 사라예요. 아까 전화했어요?"]}
          - {who: A, l2: "네, 했어요. 바빴어요?", rom: "ne, haesseoyo. bappasseoyo?", l1: "Yes, I did. Were you busy?"}
          - {who: B, l2: "미안해요. 수업 중이라서 못 받았어요.", rom: "mianhaeyo. sueop jungiraseo mot badasseoyo.", l1: "Sorry. I was in class, so I couldn't answer.", alt: ["미안해요. 수업 중이었어요.", "미안해요. 수업 때문에 못 받았어요."]}
          - {who: A, l2: "괜찮아요. 내일 제 생일 파티에 올 수 있어요?", rom: "gwaenchanayo. naeil je saengil patie ol su isseoyo?", l1: "That's okay. Can you come to my birthday party tomorrow?"}
          - {who: B, l2: "그럼요! 몇 시에 가면 돼요?", rom: "geureomyo! myeot sie gamyeon dwaeyo?", l1: "Of course! What time should I come?", alt: ["네, 갈 수 있어요! 몇 시에 가요?", "물론이죠! 몇 시에 가면 돼요?"]}
          - {who: A, l2: "저녁 여섯 시까지 오세요.", rom: "jeonyeok yeoseot sikkaji oseyo.", l1: "Come by six in the evening."}
          - {who: B, l2: "알겠어요. 내일 봐요!", rom: "algesseoyo. naeil bwayo!", l1: "Okay. See you tomorrow!", alt: ["좋아요. 내일 봐요!", "네, 내일 봐요!"]}

      - id: ko-talk-07-booking
        type: dialogue
        title: "Booking a table by phone"
        scene: "You call a restaurant to book a table for four on Friday at seven. You are Sarah Jones."
        you: B
        lines:
          - {who: A, l2: "네, 한강식당입니다.", rom: "ne, hangangsikdangimnida.", l1: "Hello, Hangang Restaurant."}
          - {who: B, l2: "안녕하세요. 예약하고 싶어요.", rom: "annyeonghaseyo. yeyakago sipeoyo.", l1: "Hello. I'd like to make a booking.", alt: ["예약할 수 있어요?", "안녕하세요. 예약 좀 하고 싶은데요.", "예약하고 싶어요."]}
          - {who: A, l2: "언제 오실 거예요?", rom: "eonje osil geoyeyo?", l1: "When would you like to come?"}
          - {who: B, l2: "이번 금요일 저녁 일곱 시요.", rom: "ibeon geumyoil jeonyeok ilgop siyo.", l1: "This Friday at seven in the evening.", alt: ["금요일 저녁 일곱 시요.", "이번 금요일 일곱 시요."]}
          - {who: A, l2: "몇 분이세요?", rom: "myeot buniseyo?", l1: "For how many people?"}
          - {who: B, l2: "네 명이에요.", rom: "ne myeongieyo.", l1: "Four.", alt: ["네 명이요.", "4명이에요."]}
          - {who: A, l2: "성함하고 연락처를 알려 주세요.", rom: "seonghamhago yeollakcheoreul allyeo juseyo.", l1: "Could I have your name and contact number?"}
          - {who: B, l2: "사라 존스예요. 이 번호로 연락 주세요.", rom: "sara jonseuyeyo. i beonhoro yeollak juseyo.", l1: "Sarah Jones. Please contact me on this number.", alt: ["사라 존스입니다. 이 번호로 연락 주세요.", "사라 존스예요."]}
          - {who: A, l2: "네, 예약되었습니다. 감사합니다.", rom: "ne, yeyakdoeeosseumnida. gamsahamnida.", l1: "That's booked. Thank you."}

      - id: ko-talk-07-badline
        type: dialogue
        title: "A bad line"
        scene: "A colleague phones while you are on the subway and you can hardly hear him."
        you: B
        lines:
          - {who: A, l2: "여보세요? 사라 씨?", rom: "yeoboseyo? sara ssi?", l1: "Hello? Sara?"}
          - {who: B, l2: "여보세요? 잘 안 들려요.", rom: "yeoboseyo? jal an deullyeoyo.", l1: "Hello? I can't hear you very well.", alt: ["잘 안 들려요.", "네? 잘 안 들려요."]}
          - {who: A, l2: "지금 어디예요?", rom: "jigeum eodiyeyo?", l1: "Where are you right now?"}
          - {who: B, l2: "지하철 안이에요. 조금 후에 다시 전화할게요.", rom: "jihacheol anieyo. jogeum hue dasi jeonhwahalgeyo.", l1: "I'm on the subway. I'll call you back in a bit.", alt: ["지하철이에요. 나중에 다시 전화할게요.", "지하철 안이에요. 이따가 다시 전화할게요."]}
          - {who: A, l2: "네, 알겠어요.", rom: "ne, algesseoyo.", l1: "Okay, sure."}
          - {who: B, l2: "여보세요? 이제 잘 들려요?", rom: "yeoboseyo? ije jal deullyeoyo?", l1: "Hello? Can you hear me now?", alt: ["이제 들려요?", "이제 잘 들려요?"]}
          - {who: A, l2: "네, 잘 들려요. 내일 회의가 열 시로 바뀌었어요.", rom: "ne, jal deullyeoyo. naeil hoeuiga yeol siro bakkwieosseoyo.", l1: "Yes, I can hear you fine. Tomorrow's meeting has moved to ten."}
          - {who: B, l2: "열 시요? 알겠어요. 고마워요.", rom: "yeol siyo? algesseoyo. gomawoyo.", l1: "Ten? Got it. Thanks.", alt: ["알겠어요. 고마워요.", "열 시요? 알겠습니다."]}

      - id: ko-talk-07-delivery
        type: dialogue
        title: "A delivery call"
        scene: "A delivery driver phones you while you are at work."
        you: B
        lines:
          - {who: A, l2: "안녕하세요, 택배입니다. 지금 집에 계세요?", rom: "annyeonghaseyo, taekbaeimnida. jigeum jibe gyeseyo?", l1: "Hello, it's the delivery service. Are you at home now?"}
          - {who: B, l2: "아니요, 지금 회사에 있어요.", rom: "aniyo, jigeum hoesae isseoyo.", l1: "No, I'm at work right now.", alt: ["아니요, 지금 집에 없어요.", "아니요, 회사에 있어요."]}
          - {who: A, l2: "그럼 택배를 어디에 놓을까요?", rom: "geureom taekbaereul eodie noeulkkayo?", l1: "Then where shall I leave the parcel?"}
          - {who: B, l2: "문 앞에 놓아 주세요.", rom: "mun ape noa juseyo.", l1: "Please leave it outside the door.", alt: ["문 앞에 놔 주세요.", "경비실에 맡겨 주세요."]}
          - {who: A, l2: "네, 문 앞에 놓을게요.", rom: "ne, mun ape noeulgeyo.", l1: "Okay, I'll leave it outside the door."}
          - {who: B, l2: "감사합니다. 수고하세요.", rom: "gamsahamnida. sugohaseyo.", l1: "Thank you. Have a good day. (to someone working)", alt: ["감사합니다.", "고맙습니다. 수고하세요."]}

      - id: ko-talk-07-message
        type: dialogue
        title: "Taking a message for a colleague"
        scene: "The phone rings on your manager's empty desk, and you answer it. Your manager, Manager Park, is out until three."
        you: B
        lines:
          - {who: A, l2: "여보세요, 박 과장님 자리예요?", rom: "yeoboseyo, bak gwajangnim jariyeyo?", l1: "Hello, is this Manager Park's desk?"}
          - {who: B, l2: "네, 맞아요. 지금 자리에 안 계세요.", rom: "ne, majayo. jigeum jarie an gyeseyo.", l1: "Yes, it is. She's not at her desk right now.", alt: ["네. 지금 안 계세요.", "네, 맞습니다. 지금 자리에 안 계세요."]}
          - {who: A, l2: "언제 돌아오세요?", rom: "eonje doraoseyo?", l1: "When will she be back?"}
          - {who: B, l2: "세 시쯤 돌아오실 거예요.", rom: "se sijjeum doraosil geoyeyo.", l1: "She should be back around three.", alt: ["세 시쯤 오실 거예요.", "세 시쯤 돌아오세요."]}
          - {who: A, l2: "그럼 하나무역 이민수가 전화했다고 전해 주세요.", rom: "geureom hanamuyeok iminsuga jeonhwahaetdago jeonhae juseyo.", l1: "Then please tell her Lee Minsu from Hana Trading called."}
          - {who: B, l2: "네, 알겠습니다. 전해 드릴게요.", rom: "ne, algesseumnida. jeonhae deurilgeyo.", l1: "Certainly. I'll let her know.", alt: ["네, 전해 드리겠습니다.", "알겠습니다. 전해 드릴게요."]}
          - {who: A, l2: "감사합니다.", rom: "gamsahamnida.", l1: "Thank you."}

  # ───────────────────────────────────────────────────────────────── 8
  - id: ko-talk-08
    title: "Hotels and stations"
    goal: "I can check in and out of a hotel, sort out a problem with the room, buy a train ticket, find my seat and report lost property."
    notes: |
      Hotels, stations and airports use the formal **합쇼체** (-ㅂ니다, -습니까?, -십시오). You will hear far more of it than you say, but a few formal sentences of your own sound good here: 예약했습니다, 감사합니다.

      | you hear | it means |
      |---|---|
      | 체크인하시겠습니까? | would you like to check in? |
      | 확인했습니다. | I've found your booking |
      | 잠시만 기다려 주십시오. | one moment, please |
      | 내리실 문은 오른쪽입니다. | the doors will open on the right |

      ## At the hotel
      - Rooms are 호 with Sino-Korean numbers: 칠백십이 호 (room 712).
      - Problems: (thing)이/가 안 돼요 (doesn't work), 고장 났어요 (is broken).
      - Leaving bags: 짐 좀 맡길 수 있어요?

      ## Trains
      - Ask by destination: 부산 가는 기차표 한 장 주세요.
      - 창가 자리 (window seat), 통로 자리 (aisle seat).
      - The platform is 타는 곳: 삼 번 타는 곳.

      ## Lost property
      Leaving something behind is **두고 내리다** (get off leaving it): 지하철에 가방을 두고 내렸어요. Be ready to say which line, when, and what it looks like: 검은색 배낭이에요.
    items:
      - id: ko-talk-08-checkin
        type: dialogue
        title: "Checking in"
        scene: "You arrive at your hotel in Seoul. You booked two nights under the name Sarah Jones."
        you: B
        lines:
          - {who: A, l2: "어서 오십시오. 체크인하시겠습니까?", rom: "eoseo osipsio. chekeuinhasigesseumnikka?", l1: "Good evening. Would you like to check in?"}
          - {who: B, l2: "네, 사라 존스로 예약했어요.", rom: "ne, sara jonseuro yeyakaesseoyo.", l1: "Yes, I have a booking under Sarah Jones.", alt: ["네, 사라 존스 이름으로 예약했어요.", "네, 사라 존스로 예약했습니다.", "사라 존스로 예약했어요."]}
          - {who: A, l2: "네, 확인했습니다. 이틀 동안 묵으시죠?", rom: "ne, hwaginhaesseumnida. iteul dongan mugeusijyo?", l1: "Yes, I have it here. You're staying two nights, aren't you?"}
          - {who: B, l2: "네, 맞아요. 아침 식사도 돼요?", rom: "ne, majayo. achim siksado dwaeyo?", l1: "Yes, that's right. Is breakfast included?", alt: ["네, 맞아요. 아침 식사도 포함돼요?", "네. 아침 식사 있어요?"]}
          - {who: A, l2: "네, 아침 식사는 일 층 식당에서 일곱 시부터 열 시까지입니다.", rom: "ne, achim siksaneun il cheung sikdangeseo ilgop sibuteo yeol sikkajiimnida.", l1: "Yes, breakfast is in the restaurant on the ground floor, from seven to ten."}
          - {who: B, l2: "와이파이 비밀번호가 뭐예요?", rom: "waipai bimilbeonhoga mwoyeyo?", l1: "What's the wifi password?", alt: ["와이파이 비밀번호 좀 알려 주세요.", "와이파이 비밀번호는 뭐예요?"]}
          - {who: A, l2: "카드 키 봉투에 있습니다. 방은 칠백십이 호입니다.", rom: "kadeu ki bongtue isseumnida. bangeun chilbaeksibi hoimnida.", l1: "It's on the key-card envelope. Your room is 712."}
          - {who: B, l2: "감사합니다.", rom: "gamsahamnida.", l1: "Thank you.", alt: ["고맙습니다.", "네, 감사합니다."]}

      - id: ko-talk-08-room
        type: dialogue
        title: "A problem with the room"
        scene: "The air conditioning in room 712 does not work. You phone reception."
        you: B
        lines:
          - {who: A, l2: "네, 프런트입니다.", rom: "ne, peureonteuimnida.", l1: "Reception, good evening."}
          - {who: B, l2: "여기 칠백십이 호인데요. 에어컨이 안 돼요.", rom: "yeogi chilbaeksibi hoindeyo. eeokeoni an dwaeyo.", l1: "This is room 712. The air conditioning isn't working.", alt: ["칠백십이 호인데요. 에어컨이 안 돼요.", "여기 칠백십이 호예요. 에어컨이 고장 났어요."]}
          - {who: A, l2: "죄송합니다. 바로 직원을 보내 드리겠습니다.", rom: "joesonghamnida. baro jigwoneul bonae deurigesseumnida.", l1: "I'm sorry. I'll send someone up right away."}
          - {who: B, l2: "그리고 수건도 좀 더 주세요.", rom: "geurigo sugeondo jom deo juseyo.", l1: "And some more towels too, please.", alt: ["수건도 좀 더 주세요.", "그리고 수건 좀 더 주세요."]}
          - {who: A, l2: "네, 같이 가져다 드리겠습니다. 다른 필요하신 건 없으세요?", rom: "ne, gachi gajyeoda deurigesseumnida. dareun piryohasin geon eopseuseyo?", l1: "Certainly, we'll bring them up at the same time. Is there anything else you need?"}
          - {who: B, l2: "아니요, 없어요. 감사합니다.", rom: "aniyo, eopseoyo. gamsahamnida.", l1: "No, that's all. Thank you.", alt: ["없어요. 감사합니다.", "아니요, 괜찮아요. 감사합니다."]}

      - id: ko-talk-08-checkout
        type: dialogue
        title: "Checking out and leaving bags"
        scene: "You check out in the morning but want to leave your luggage until the afternoon."
        you: B
        lines:
          - {who: B, l2: "체크아웃할게요.", rom: "chekeuautalgeyo.", l1: "I'd like to check out, please.", alt: ["체크아웃하고 싶어요.", "체크아웃해 주세요."]}
          - {who: A, l2: "네, 방 키 주시겠어요? 미니바 사용하셨습니까?", rom: "ne, bang ki jusigesseoyo? miniba sayonghasyeosseumnikka?", l1: "Certainly. May I have your key? Did you use the minibar?"}
          - {who: B, l2: "아니요, 안 썼어요.", rom: "aniyo, an sseosseoyo.", l1: "No, I didn't.", alt: ["아니요, 사용 안 했어요.", "아니요, 안 했어요."]}
          - {who: A, l2: "감사합니다. 편히 쉬셨어요?", rom: "gamsahamnida. pyeonhi swisyeosseoyo?", l1: "Thank you. Did you have a comfortable stay?"}
          - {who: B, l2: "네, 아주 좋았어요. 짐 좀 맡길 수 있어요?", rom: "ne, aju joasseoyo. jim jom matgil su isseoyo?", l1: "Yes, it was lovely. Could I leave my luggage here?", alt: ["네, 좋았어요. 짐 좀 맡길 수 있어요?", "짐을 맡길 수 있어요?", "네. 짐 좀 맡아 주세요."]}
          - {who: A, l2: "네, 몇 시에 찾으러 오실 거예요?", rom: "ne, myeot sie chajeureo osil geoyeyo?", l1: "Of course. What time will you be back for it?"}
          - {who: B, l2: "오후 네 시쯤 찾으러 올게요.", rom: "ohu ne sijjeum chajeureo olgeyo.", l1: "I'll come and collect it around four in the afternoon.", alt: ["네 시쯤 찾으러 올게요.", "오후 네 시쯤 올게요."]}
          - {who: A, l2: "알겠습니다. 이 번호표를 가지고 계세요.", rom: "algesseumnida. i beonhopyoreul gajigo gyeseyo.", l1: "Very good. Please keep this ticket."}

      - id: ko-talk-08-ticket
        type: dialogue
        title: "Buying a train ticket"
        scene: "At the station ticket office you want the fastest train to Busan, with a window seat."
        you: B
        lines:
          - {who: B, l2: "부산 가는 기차표 한 장 주세요.", rom: "busan ganeun gichapyo han jang juseyo.", l1: "One ticket to Busan, please.", alt: ["부산까지 기차표 한 장 주세요.", "부산 가는 표 한 장 주세요.", "부산 한 장 주세요."]}
          - {who: A, l2: "몇 시 기차로 드릴까요?", rom: "myeot si gicharo deurilkkayo?", l1: "Which train would you like?"}
          - {who: B, l2: "제일 빠른 기차는 몇 시에 있어요?", rom: "jeil ppareun gichaneun myeot sie isseoyo?", l1: "What time is the earliest train?", alt: ["제일 빠른 거 몇 시예요?", "제일 빠른 기차는 몇 시예요?"]}
          - {who: A, l2: "열 시 기차가 있습니다. 부산까지 두 시간 반 걸립니다.", rom: "yeol si gichaga isseumnida. busankkaji du sigan ban geollimnida.", l1: "There's one at ten. It takes two and a half hours to Busan."}
          - {who: B, l2: "그걸로 주세요. 창가 자리 있어요?", rom: "geugeollo juseyo. changga jari isseoyo?", l1: "I'll take that one. Is there a window seat?", alt: ["그걸로 할게요. 창가 자리 있어요?", "그걸로 주세요. 창가 자리로 주세요."]}
          - {who: A, l2: "네, 있습니다. 오만 구천 원입니다.", rom: "ne, isseumnida. oman gucheon wonimnida.", l1: "Yes, there is. That's 59,000 won."}
          - {who: B, l2: "어디에서 타요?", rom: "eodieseo tayo?", l1: "Where do I board?", alt: ["몇 번 타는 곳이에요?", "어디서 타요?"]}
          - {who: A, l2: "삼 번 타는 곳에서 타세요.", rom: "sam beon taneun goseseo taseyo.", l1: "From platform 3."}

      - id: ko-talk-08-seat
        type: dialogue
        title: "Someone in your seat"
        scene: "On the train, a man is sitting in your seat, number 15."
        you: B
        lines:
          - {who: B, l2: "실례합니다. 여기 제 자리예요.", rom: "sillyehamnida. yeogi je jariyeyo.", l1: "Excuse me. This is my seat.", alt: ["실례합니다. 여기는 제 자리예요.", "저기요. 여기 제 자리예요."]}
          - {who: A, l2: "아, 그래요? 몇 번이세요?", rom: "a, geuraeyo? myeot beoniseyo?", l1: "Oh, is it? What number are you?"}
          - {who: B, l2: "십오 번이에요.", rom: "sibo beonieyo.", l1: "Number 15.", alt: ["저는 십오 번이에요.", "15번이에요."]}
          - {who: A, l2: "아, 죄송합니다. 제가 잘못 앉았네요.", rom: "a, joesonghamnida. jega jalmot anjanneyo.", l1: "Oh, I'm sorry. I'm in the wrong seat."}
          - {who: B, l2: "괜찮아요.", rom: "gwaenchanayo.", l1: "That's all right.", alt: ["아니에요, 괜찮아요.", "네, 괜찮아요."]}
          - {who: A, l2: "어디까지 가세요?", rom: "eodikkaji gaseyo?", l1: "Where are you going?"}
          - {who: B, l2: "부산까지 가요. 얼마나 더 가야 돼요?", rom: "busankkaji gayo. eolmana deo gaya dwaeyo?", l1: "To Busan. How much further is it?", alt: ["부산까지 가요. 얼마나 더 걸려요?", "부산까지요. 얼마나 더 가야 돼요?"]}
          - {who: A, l2: "한 시간쯤 더 가야 돼요.", rom: "han siganjjeum deo gaya dwaeyo.", l1: "About another hour."}

      - id: ko-talk-08-lost
        type: dialogue
        title: "Lost property"
        scene: "You left your backpack on a line 4 train an hour ago. You go to the station's lost-property office."
        you: B
        lines:
          - {who: B, l2: "실례합니다. 지하철에 가방을 두고 내렸어요.", rom: "sillyehamnida. jihacheore gabangeul dugo naeryeosseoyo.", l1: "Excuse me. I left my bag on the train.", alt: ["지하철에 가방을 두고 내렸어요.", "실례합니다. 가방을 잃어버렸어요."]}
          - {who: A, l2: "몇 호선이었어요?", rom: "myeot hoseonieosseoyo?", l1: "Which line was it?"}
          - {who: B, l2: "사 호선이었어요. 한 시간 전에 내렸어요.", rom: "sa hoseonieosseoyo. han sigan jeone naeryeosseoyo.", l1: "Line 4. I got off an hour ago.", alt: ["사 호선이에요. 한 시간 전에 내렸어요.", "사 호선이었어요."]}
          - {who: A, l2: "가방이 어떻게 생겼어요?", rom: "gabangi eotteoke saenggyeosseoyo?", l1: "What does the bag look like?"}
          - {who: B, l2: "검은색 배낭이에요. 안에 노트북이 있어요.", rom: "geomeunsaek baenangieyo. ane noteubugi isseoyo.", l1: "It's a black backpack. There's a laptop in it.", alt: ["검은색 배낭이에요.", "까만색 배낭이에요. 안에 노트북이 있어요."]}
          - {who: A, l2: "잠시만 기다려 주십시오. 이 가방이에요?", rom: "jamsiman gidaryeo jusipsio. i gabangieyo?", l1: "One moment, please. Is this the one?"}
          - {who: B, l2: "네, 맞아요! 정말 감사합니다.", rom: "ne, majayo! jeongmal gamsahamnida.", l1: "Yes, that's it! Thank you so much.", alt: ["네, 그거예요! 감사합니다.", "맞아요! 정말 감사합니다."]}
