          - {who: A, l2: "네, 됩니다. 뭐 드릴까요?", rom: "ne, doemnida. mwo deurilkkayo?", l1: "Yes, you can. What would you like?"}
          - {who: B, l2: "떡볶이 일 인분하고 김밥 두 줄 주세요.", rom: "tteokbokki il inbunhago gimbap du jul juseyo.", l1: "One portion of tteokbokki and two rolls of gimbap, please.", alt: ["떡볶이 1인분하고 김밥 두 줄 주세요.", "떡볶이 하나하고 김밥 두 줄 주세요."]}
          - {who: A, l2: "십오 분쯤 걸려요. 괜찮으세요?", rom: "sibo bunjjeum geollyeoyo. gwaenchaneuseyo?", l1: "It'll take about fifteen minutes. Is that all right?"}
