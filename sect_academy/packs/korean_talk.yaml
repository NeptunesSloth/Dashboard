          - {who: A, l2: "공깃밥은 몇 개 드릴까요?", rom: "gonggitbabeun myeot gae deurilkkayo?", l1: "How many bowls of rice would you like?"}
          - {who: B, l2: "두 개 주세요.", rom: "du gae juseyo.", l1: "Two, please.", alt: ["공깃밥 두 개 주세요.", "공기밥 두 개 주세요.", "밥 두 개 주세요."]}
