          - {who: A, l2: "나가실 때 카운터에서 하시면 됩니다.", rom: "nagasil ttae kaunteoeseo hasimyeon doemnida.", l1: "You can pay at the counter on your way out."}
          - {who: B, l2: "네, 감사합니다.", rom: "ne, gamsahamnida.", l1: "Okay, thank you.", alt: ["감사합니다.", "알겠습니다. 감사합니다."]}

