          - {who: B, l2: "그럼 비빔밥 주세요. 고기는 빼 주세요.", rom: "geureom bibimbap juseyo. gogineun ppae juseyo.", l1: "Then bibimbap, please. Without the meat.", alt: ["그럼 비빔밥 하나 주세요. 고기는 빼 주세요.", "비빔밥 주세요. 고기는 빼 주세요."]}
          - {who: A, l2: "계란은 괜찮으세요?", rom: "gyeraneun gwaenchaneuseyo?", l1: "Are eggs all right?"}
