id: korean-talk
title: "Korean — Conversations"
kind: language
language: Korean
lang: ko-KR
track: korean
addon: talk
hall: tongues_west
blurb: "Spoken-conversation practice to take alongside A1 and A2: 50 everyday exchanges you rehearse line by line, from first meetings to restaurants, shops, the doctor's, phone calls, hotels and trains."

# rom is Revised Romanization as in korean-a1 and korean-a2, written word by word.
# Partner lines may use forms the learner has only met passively; learner lines stay short.
units:
  # ───────────────────────────────────────────────────────────────── 1
  - id: ko-talk-01
    title: "First meetings"
    goal: "I can introduce myself, ask the same questions back, say how long I have been learning Korean and close a first conversation warmly."
    notes: |
      A first conversation runs on a few moves. Say them aloud as whole chunks.

      - **Open**: 안녕하세요? 저는 ○○예요/이에요. With someone older, or at work, the formal style is safer: 처음 뵙겠습니다. 저는 ○○입니다.
      - **Ask back**: add **-은요? / -는요?** to a name to return the question: 지민 씨는요? ("and you, Jimin?"). There is no polite everyday word for "you": use the name + 씨, or a title.
      - **Work**: business cards (명함) are given and taken with both hands, and the meeting ends with **잘 부탁드립니다** ("I look forward to working with you").
      - **Buy time**: 다시 한번 말해 주세요. · 천천히 말해 주세요. · ○○이/가 무슨 뜻이에요?
      - **Close**: 오늘 즐거웠어요. · 연락 주세요. · 조심히 가세요. · 또 만나요!

      Koreans often ask your age early on, because it decides how you speak to each other. 나이가 어떻게 되세요? is the polite way.

      Being praised for your Korean (한국말 잘하네요!) is answered modestly: 아니에요, 아직 잘 못해요.
    items:
      - id: ko-talk-01-class
        type: dialogue
        title: "First day at language school"
        scene: "It is your first day at a Korean language school in Seoul. The student next to you says hello. You are Alex, from England."
        you: B
        lines:
          - {who: A, l2: "안녕하세요? 저는 지민이에요. 이름이 뭐예요?", rom: "annyeonghaseyo? jeoneun jiminieyo. ireumi mwoyeyo?", l1: "Hello. I'm Jimin. What's your name?"}
          - {who: B, l2: "안녕하세요? 저는 알렉스예요.", rom: "annyeonghaseyo? jeoneun allekseuyeyo.", l1: "Hello. I'm Alex.", alt: ["안녕하세요? 제 이름은 알렉스예요.", "저는 알렉스예요.", "안녕하세요? 알렉스예요."]}
          - {who: A, l2: "알렉스 씨, 반가워요. 어느 나라에서 왔어요?", rom: "allekseu ssi, bangawoyo. eoneu naraeseo wasseoyo?", l1: "Nice to meet you, Alex. Which country are you from?"}
          - {who: B, l2: "영국에서 왔어요. 지민 씨는요?", rom: "yeonggugeseo wasseoyo. jimin ssineunyo?", l1: "I'm from England. And you, Jimin?", alt: ["저는 영국에서 왔어요. 지민 씨는요?", "영국 사람이에요. 지민 씨는요?"]}
          - {who: A, l2: "저는 부산에서 왔어요. 대학교 때문에 서울에 왔어요.", rom: "jeoneun busaneseo wasseoyo. daehakgyo ttaemune seoure wasseoyo.", l1: "I'm from Busan. I came to Seoul for university."}
          - {who: B, l2: "아, 그래요? 만나서 반가워요.", rom: "a, geuraeyo? mannaseo bangawoyo.", l1: "Oh, really? Nice to meet you.", alt: ["만나서 반가워요.", "아, 그래요? 반가워요."]}
          - {who: A, l2: "저도요. 앞으로 잘 지내요!", rom: "jeodoyo. apeuro jal jinaeyo!", l1: "Me too. Let's get on well from now on!"}
          - {who: B, l2: "네, 잘 부탁해요!", rom: "ne, jal butakaeyo!", l1: "Yes, I'm glad to know you! (please treat me well)", alt: ["네, 잘 지내요!", "잘 부탁해요!"]}

      - id: ko-talk-01-business
        type: dialogue
        title: "Meeting a business contact"
        scene: "At a trade fair you meet a Korean manager for the first time. You are Sarah Jones. Use the formal style."
        you: B
        lines:
          - {who: A, l2: "처음 뵙겠습니다. 저는 김민호라고 합니다.", rom: "cheoeum boepgesseumnida. jeoneun gimminhorago hamnida.", l1: "How do you do? My name is Kim Minho."}
          - {who: B, l2: "처음 뵙겠습니다. 저는 사라 존스입니다.", rom: "cheoeum boepgesseumnida. jeoneun sara jonseuimnida.", l1: "How do you do? I'm Sarah Jones.", alt: ["반갑습니다. 저는 사라 존스입니다.", "처음 뵙겠습니다. 사라 존스라고 합니다.", "처음 뵙겠습니다. 사라 존스입니다."]}
          - {who: A, l2: "만나서 반갑습니다. 여기 제 명함입니다.", rom: "mannaseo bangapseumnida. yeogi je myeonghamimnida.", l1: "Pleased to meet you. Here is my card."}
          - {who: B, l2: "감사합니다. 이건 제 명함입니다.", rom: "gamsahamnida. igeon je myeonghamimnida.", l1: "Thank you. And this is my card.", alt: ["감사합니다. 제 명함입니다.", "고맙습니다. 이건 제 명함입니다.", "감사합니다. 여기 제 명함입니다."]}
          - {who: A, l2: "한국에는 언제 오셨어요?", rom: "hangugeneun eonje osyeosseoyo?", l1: "When did you arrive in Korea?"}
          - {who: B, l2: "지난주에 왔습니다.", rom: "jinanjue wasseumnida.", l1: "I arrived last week.", alt: ["지난주에 왔어요.", "지난주에 도착했습니다."]}
          - {who: A, l2: "앞으로 잘 부탁드립니다.", rom: "apeuro jal butakdeurimnida.", l1: "I look forward to working with you."}
          - {who: B, l2: "저도 잘 부탁드립니다.", rom: "jeodo jal butakdeurimnida.", l1: "Likewise, I look forward to working with you.", alt: ["잘 부탁드립니다.", "네, 저도 잘 부탁드립니다.", "저도요. 잘 부탁드립니다."]}

      - id: ko-talk-01-learning
        type: dialogue
        title: "Why are you learning Korean?"
        scene: "A Korean colleague is curious about your Korean lessons."
        you: B
        lines:
          - {who: A, l2: "한국어를 어디에서 배웠어요?", rom: "hangugeoreul eodieseo baewosseoyo?", l1: "Where did you learn Korean?"}
          - {who: B, l2: "학원에서 배우고 있어요.", rom: "hagwoneseo baeugo isseoyo.", l1: "I'm learning at a language school.", alt: ["학원에서 배워요.", "한국어 학원에서 배우고 있어요."]}
          - {who: A, l2: "얼마나 배웠어요?", rom: "eolmana baewosseoyo?", l1: "How long have you been learning?"}
          - {who: B, l2: "일 년쯤 배웠어요.", rom: "il nyeonjjeum baewosseoyo.", l1: "About a year.", alt: ["일 년 배웠어요.", "1년쯤 배웠어요.", "일 년쯤 됐어요."]}
          - {who: A, l2: "와, 잘하네요! 왜 한국어를 배워요?", rom: "wa, jalhaneyo! wae hangugeoreul baewoyo?", l1: "Wow, you're good! Why are you learning Korean?"}
          - {who: B, l2: "한국 드라마를 좋아해서 배워요.", rom: "hanguk deuramareul joahaeseo baewoyo.", l1: "I'm learning it because I like Korean dramas.", alt: ["한국 드라마를 좋아해요.", "한국 드라마가 좋아서 배워요.", "한국 드라마를 좋아해서요."]}
          - {who: A, l2: "저도 드라마 좋아해요. 요즘 뭐 봐요?", rom: "jeodo deurama joahaeyo. yojeum mwo bwayo?", l1: "I like dramas too. What are you watching at the moment?"}
          - {who: B, l2: "요즘은 바빠서 못 봐요.", rom: "yojeumeun bappaseo mot bwayo.", l1: "I'm too busy to watch anything these days.", alt: ["요즘은 시간이 없어서 못 봐요.", "요즘 바빠서 못 봐요."]}

      - id: ko-talk-01-sorry
        type: dialogue
        title: "Sorry, could you say that again?"
        scene: "In the lift of your block of flats, a neighbour starts chatting. You miss the first question."
        you: B
        lines:
          - {who: A, l2: "이 아파트에 사세요?", rom: "i apateue saseyo?", l1: "Do you live in this block?"}
          - {who: B, l2: "죄송해요. 다시 한번 말해 주세요.", rom: "joesonghaeyo. dasi hanbeon malhae juseyo.", l1: "Sorry. Please say that again.", alt: ["죄송해요. 다시 말해 주세요.", "죄송합니다. 다시 한번 말해 주세요.", "네? 다시 한번 말해 주세요."]}
          - {who: A, l2: "이 아파트에 사세요?", rom: "i apateue saseyo?", l1: "Do you live in this block?"}
          - {who: B, l2: "아, 네. 여기 살아요.", rom: "a, ne. yeogi sarayo.", l1: "Ah, yes. I live here.", alt: ["네, 여기 살아요.", "네, 이 아파트에 살아요."]}
          - {who: A, l2: "저도 여기 살아요. 몇 동에 살아요?", rom: "jeodo yeogi sarayo. myeot donge sarayo?", l1: "I live here too. Which building number do you live in?"}
          - {who: B, l2: "동이 무슨 뜻이에요?", rom: "dongi museun tteusieyo?", l1: "What does dong mean?", alt: ["동이 뭐예요?", "'동'이 무슨 뜻이에요?"]}
          - {who: A, l2: "아파트 건물 번호예요. 백 동, 이백 동처럼요.", rom: "apateu geonmul beonhoyeyo. baek dong, ibaek dongcheoreomyo.", l1: "It's the building number in a block of flats. Like building 100, building 200."}
          - {who: B, l2: "아, 알겠어요. 저는 백 동에 살아요.", rom: "a, algesseoyo. jeoneun baek donge sarayo.", l1: "Ah, I see. I live in building 100.", alt: ["아, 백 동에 살아요.", "백 동이에요.", "아, 알겠어요. 백 동이에요."]}
          - {who: A, l2: "와, 이웃이네요! 반가워요.", rom: "wa, iusineyo! bangawoyo.", l1: "Oh, we're neighbours! Nice to meet you."}

      - id: ko-talk-01-older
        type: dialogue
        title: "An older neighbour"
        scene: "An older woman from your building stops you outside the convenience store. She speaks warmly and a little informally; you stay polite."
        you: B
        lines:
          - {who: A, l2: "외국 사람이에요? 한국말 잘하네요.", rom: "oeguk saramieyo? hangungmal jalhaneyo.", l1: "Are you from abroad? Your Korean is good."}
          - {who: B, l2: "감사합니다. 아직 많이 배우고 있어요.", rom: "gamsahamnida. ajik mani baeugo isseoyo.", l1: "Thank you. I'm still learning a lot.", alt: ["아니에요. 아직 많이 배우고 있어요.", "감사합니다. 아직 잘 못해요.", "아니에요. 아직 잘 못해요."]}
          - {who: A, l2: "한국에 온 지 얼마나 됐어요?", rom: "hanguge on ji eolmana dwaesseoyo?", l1: "How long have you been in Korea?"}
          - {who: B, l2: "육 개월 됐어요.", rom: "yuk gaewol dwaesseoyo.", l1: "Six months.", alt: ["여섯 달 됐어요.", "육 개월쯤 됐어요.", "6개월 됐어요."]}
          - {who: A, l2: "혼자 살아요? 밥은 잘 먹고 다녀요?", rom: "honja sarayo? babeun jal meokgo danyeoyo?", l1: "Do you live on your own? Are you eating properly?"}
          - {who: B, l2: "네, 잘 먹고 있어요. 걱정하지 마세요.", rom: "ne, jal meokgo isseoyo. geokjeonghaji maseyo.", l1: "Yes, I'm eating well. Don't worry.", alt: ["네, 잘 먹어요. 걱정하지 마세요.", "네, 잘 먹고 있어요."]}
          - {who: A, l2: "다음에 우리 집에 밥 먹으러 와요.", rom: "daeume uri jibe bap meogeureo wayo.", l1: "Come round to my place for a meal some time."}
          - {who: B, l2: "정말 감사합니다. 꼭 갈게요.", rom: "jeongmal gamsahamnida. kkok galgeyo.", l1: "Thank you so much. I'll definitely come.", alt: ["감사합니다. 꼭 갈게요.", "네, 감사합니다!", "정말 고맙습니다. 꼭 갈게요."]}

      - id: ko-talk-01-job
        type: dialogue
        title: "What do you do?"
        scene: "At a friend's party you get talking to a Korean office worker. You teach English at a primary school."
        you: B
        lines:
          - {who: A, l2: "무슨 일 하세요?", rom: "museun il haseyo?", l1: "What do you do?"}
          - {who: B, l2: "저는 영어 선생님이에요. 초등학교에서 가르쳐요.", rom: "jeoneun yeongeo seonsaengnimieyo. chodeunghakgyoeseo gareuchyeoyo.", l1: "I'm an English teacher. I teach at a primary school.", alt: ["영어 선생님이에요. 초등학교에서 가르쳐요.", "저는 초등학교에서 영어를 가르쳐요.", "저는 영어 교사예요. 초등학교에서 가르쳐요."]}
          - {who: A, l2: "아, 그래요? 일이 재미있어요?", rom: "a, geuraeyo? iri jaemiisseoyo?", l1: "Oh, really? Do you enjoy the work?"}
          - {who: B, l2: "네, 재미있지만 좀 피곤해요.", rom: "ne, jaemiitjiman jom pigonhaeyo.", l1: "Yes, it's fun but a bit tiring.", alt: ["재미있지만 좀 피곤해요.", "네, 재미있지만 조금 피곤해요."]}
          - {who: A, l2: "저는 회사에 다녀요. 은행에서 일해요.", rom: "jeoneun hoesae danyeoyo. eunhaengeseo ilhaeyo.", l1: "I work for a company. At a bank."}
          - {who: B, l2: "회사가 어디에 있어요?", rom: "hoesaga eodie isseoyo?", l1: "Where is your office?", alt: ["회사는 어디에 있어요?", "회사가 어디예요?"]}
          - {who: A, l2: "강남에 있어요. 매일 지하철로 출근해요.", rom: "gangname isseoyo. maeil jihacheollo chulgeunhaeyo.", l1: "In Gangnam. I go to work by subway every day."}
          - {who: B, l2: "와, 출근 시간이 길겠어요.", rom: "wa, chulgeun sigani gilgesseoyo.", l1: "Wow, your commute must be long.", alt: ["출근 시간이 길겠어요.", "와, 힘들겠어요."]}

      - id: ko-talk-01-goodbye
        type: dialogue
        title: "Wrapping up an evening"
        scene: "It is late after a language-exchange evening. Your new Korean friend has to go home."
        you: B
        lines:
          - {who: A, l2: "벌써 열 시예요. 저는 이제 가야 해요.", rom: "beolsseo yeol siyeyo. jeoneun ije gaya haeyo.", l1: "It's already ten. I have to go now."}
          - {who: B, l2: "저도 가야 돼요. 오늘 정말 즐거웠어요.", rom: "jeodo gaya dwaeyo. oneul jeongmal jeulgeowosseoyo.", l1: "I have to go too. I really enjoyed today.", alt: ["저도요. 오늘 정말 즐거웠어요.", "오늘 정말 즐거웠어요.", "저도 가야 해요. 오늘 즐거웠어요."]}
          - {who: A, l2: "저도요. 전화번호 좀 알려 줄 수 있어요?", rom: "jeodoyo. jeonhwabeonho jom allyeo jul su isseoyo?", l1: "Me too. Could you give me your number?"}
          - {who: B, l2: "네, 제 번호는 이거예요.", rom: "ne, je beonhoneun igeoyeyo.", l1: "Sure, this is my number.", alt: ["네, 이거예요.", "네, 여기요."]}
          - {who: A, l2: "고마워요. 제가 문자 보낼게요.", rom: "gomawoyo. jega munja bonaelgeyo.", l1: "Thanks. I'll send you a text."}
          - {who: B, l2: "네, 연락 주세요. 조심히 가세요.", rom: "ne, yeollak juseyo. josimhi gaseyo.", l1: "Okay, keep in touch. Get home safely.", alt: ["연락 주세요. 조심히 가세요.", "네, 연락 주세요."]}
          - {who: A, l2: "네, 또 만나요!", rom: "ne, tto mannayo!", l1: "Okay, see you again!"}
          - {who: B, l2: "안녕히 가세요!", rom: "annyeonghi gaseyo!", l1: "Bye!", alt: ["또 만나요!", "잘 가요!", "네, 또 만나요!"]}

  # ───────────────────────────────────────────────────────────────── 2
  - id: ko-talk-02
    title: "At the restaurant"
    goal: "I can get a table, order and change a dish, sort out a mistake, ask for more side dishes and pay."
    notes: |
      Restaurant staff speak in very polite forms. You do not need to copy them: polite 해요 Korean is exactly right for a customer.

      | staff say | it means |
      |---|---|
      | 몇 분이세요? | how many of you? |
      | 예약하셨어요? | do you have a booking? |
      | 주문하시겠어요? / 뭐 드릴까요? | are you ready to order? |
      | 잠시만 기다려 주세요. | one moment, please |
      | 맛있게 드세요. | enjoy your meal |

      ## Useful moves
      - Call the staff with **저기요!** (or 여기요!). Many tables have a call button.
      - Change a dish: 고기는 **빼** 주세요 (leave out the meat), 덜 맵게 해 주세요.
      - Order rice by the bowl (공깃밥, often written 공기밥 on menus), grilled meat by the portion (이 인분), gimbap by the roll (한 줄).
      - Pay at the counter by the door: 계산은 어디에서 해요? 카드로 할게요.
      - On leaving: **잘 먹었습니다**.

      **-(으)ㄹ게요** ("I'll …") is the natural way to tell someone what you have decided: 기다릴게요, 카드로 할게요. It is about your own action only.
    items:
      - id: ko-talk-02-table
        type: dialogue
        title: "Getting a table"
        scene: "You arrive at a busy restaurant with two friends, without a booking. You are Sara."
        you: B
        lines:
          - {who: A, l2: "어서 오세요. 몇 분이세요?", rom: "eoseo oseyo. myeot buniseyo?", l1: "Welcome. How many of you are there?"}
          - {who: B, l2: "세 명이에요.", rom: "se myeongieyo.", l1: "Three.", alt: ["세 명이요.", "3명이에요.", "세 명입니다."]}
          - {who: A, l2: "예약하셨어요?", rom: "yeyakasyeosseoyo?", l1: "Do you have a booking?"}
          - {who: B, l2: "아니요, 예약 안 했어요.", rom: "aniyo, yeyak an haesseoyo.", l1: "No, we haven't booked.", alt: ["아니요, 안 했어요.", "아니요, 예약 안 했는데요."]}
          - {who: A, l2: "죄송하지만 지금 자리가 없어요. 십 분쯤 기다리셔야 돼요.", rom: "joesonghajiman jigeum jariga eopseoyo. sip bunjjeum gidarisyeoya dwaeyo.", l1: "I'm sorry, there are no tables right now. You'll have to wait about ten minutes."}
          - {who: B, l2: "괜찮아요. 기다릴게요.", rom: "gwaenchanayo. gidarilgeyo.", l1: "That's fine. We'll wait.", alt: ["네, 기다릴게요.", "괜찮아요. 기다릴 수 있어요."]}
          - {who: A, l2: "성함이 어떻게 되세요?", rom: "seonghami eotteoke doeseyo?", l1: "May I have your name?"}
          - {who: B, l2: "사라예요.", rom: "sarayeyo.", l1: "Sara.", alt: ["사라입니다.", "제 이름은 사라예요."]}

      - id: ko-talk-02-order
        type: dialogue
        title: "Ordering for the table"
        scene: "You are ordering for yourself and a friend in a Korean restaurant."
        you: B
        lines:
          - {who: A, l2: "주문하시겠어요?", rom: "jumunhasigesseoyo?", l1: "Are you ready to order?"}
