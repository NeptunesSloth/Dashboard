          - {who: A, l2: "안녕히 가세요. 또 오세요.", rom: "annyeonghi gaseyo. tto oseyo.", l1: "Goodbye. Please come again."}
          - {who: B, l2: "잘 먹었습니다. 안녕히 계세요.", rom: "jal meogeosseumnida. annyeonghi gyeseyo.", l1: "Thank you for the meal. Goodbye.", alt: ["안녕히 계세요.", "잘 먹었습니다."]}

