          - {who: A, l2: "이 스카프는 어떠세요? 요즘 인기가 많아요.", rom: "i seukapeuneun eotteoseyo? yojeum ingiga manayo.", l1: "How about this scarf? It's very popular at the moment."}
          - {who: B, l2: "예뻐요. 다른 색도 있어요?", rom: "yeppeoyo. dareun saekdo isseoyo?", l1: "It's pretty. Do you have other colours too?", alt: ["예쁘네요. 다른 색도 있어요?", "다른 색도 있어요?"]}
          - {who: A, l2: "빨간색하고 회색이 있어요.", rom: "ppalgansaekago hoesaegi isseoyo.", l1: "We have red and grey."}
          - {who: B, l2: "빨간색이 더 예뻐요. 빨간색으로 주세요.", rom: "ppalgansaegi deo yeppeoyo. ppalgansaegeuro juseyo.", l1: "The red is prettier. I'll take the red one.", alt: ["빨간색으로 주세요.", "빨간색이 더 예뻐요. 이걸로 주세요."]}
          - {who: A, l2: "선물 포장해 드릴까요?", rom: "seonmul pojanghae deurilkkayo?", l1: "Shall I gift-wrap it for you?"}
          - {who: B, l2: "네, 포장해 주세요.", rom: "ne, pojanghae juseyo.", l1: "Yes, please wrap it.", alt: ["네, 부탁드려요.", "네, 부탁해요."]}

