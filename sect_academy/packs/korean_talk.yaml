          - {who: A, l2: "젓가락 필요하세요?", rom: "jeotgarak piryohaseyo?", l1: "Do you need chopsticks?"}
          - {who: B, l2: "아니요, 괜찮아요. 집에 있어요.", rom: "aniyo, gwaenchanayo. jibe isseoyo.", l1: "No, that's all right. I have some at home.", alt: ["아니요, 괜찮아요.", "아니요, 필요 없어요."]}

  # ───────────────────────────────────────────────────────────────── 3
  - id: ko-talk-03
    title: "Shopping"
    goal: "I can ask to try things on, ask for another size or colour, buy at a market and in a convenience store, bargain a little and return something."
    notes: |
      Shop staff greet you with 어서 오세요 and often follow you with 찾으시는 거 있으세요? ("are you looking for anything?"). 그냥 구경하고 있어요 ("I'm just looking") lets you browse in peace.

      ## Asking permission: -아/어도 돼요?
      입어 봐**도 돼요**? (May I try it on?) · 카드로 해**도 돼요**? The answer is 네, 돼요 / 네, 그러세요.

      ## Deciding
      - **이걸로 할게요** / 이걸로 주세요: I'll take this one.
      - 딱 맞아요: it fits perfectly. 좀 커요 / 작아요 / 길어요.
      - At a market, prices are often per item: 한 개에 이천 원. A seller may add one free: 하나 더 넣어 드릴게요.

      ## Returning and exchanging
      Start with the background and -는데요, which sounds polite and leaves the request open: 어제 이 신발을 샀는데요… Then: 환불돼요? / 다른 사이즈로 바꿀 수 있어요? Keep the receipt (영수증).

      ## Convenience stores
      You will be asked 봉투 필요하세요? (do you need a bag?): bags cost extra. Transport cards are topped up at the till, usually with cash only: 교통카드 충전해 주세요.

      Bargaining (깎아 주세요) is fine at traditional markets and street stalls, not in shops with price tags.
    items:
      - id: ko-talk-03-tryon
        type: dialogue
        title: "Trying trousers on"
        scene: "You are in a clothes shop and like a pair of trousers."
        you: B
        lines:
          - {who: A, l2: "찾으시는 거 있으세요?", rom: "chajeusineun geo isseuseyo?", l1: "Are you looking for anything in particular?"}
          - {who: B, l2: "이 바지 입어 봐도 돼요?", rom: "i baji ibeo bwado dwaeyo?", l1: "May I try these trousers on?", alt: ["이거 입어 봐도 돼요?", "이 바지 입어 볼 수 있어요?"]}
          - {who: A, l2: "네, 탈의실은 저쪽이에요. 사이즈가 어떻게 되세요?", rom: "ne, taruisireun jeojjogieyo. saijeuga eotteoke doeseyo?", l1: "Of course, the fitting room is over there. What size are you?"}
          - {who: B, l2: "보통 미디엄 입어요.", rom: "botong midieom ibeoyo.", l1: "I usually wear a medium.", alt: ["미디엄이요.", "보통 M 사이즈 입어요.", "보통 엠 사이즈 입어요."]}
          - {who: A, l2: "어떠세요? 잘 맞으세요?", rom: "eotteoseyo? jal majeuseyo?", l1: "How are they? Do they fit?"}
          - {who: B, l2: "좀 길어요. 더 짧은 거 있어요?", rom: "jom gireoyo. deo jjalbeun geo isseoyo?", l1: "They're a bit long. Do you have shorter ones?", alt: ["좀 길어요. 짧은 거 있어요?", "조금 길어요. 더 짧은 거 있어요?"]}
          - {who: A, l2: "네, 이거 한번 입어 보세요.", rom: "ne, igeo hanbeon ibeo boseyo.", l1: "Yes, try these."}
          - {who: B, l2: "이게 딱 맞아요. 이걸로 할게요.", rom: "ige ttak majayo. igeollo halgeyo.", l1: "These fit perfectly. I'll take them.", alt: ["딱 맞아요. 이걸로 할게요.", "이게 딱 맞아요. 이거 주세요.", "이걸로 주세요."]}

      - id: ko-talk-03-market
        type: dialogue
        title: "Apples at the market"
        scene: "A fruit seller at a traditional market calls out to you."
        you: B
        lines:
          - {who: A, l2: "사과 사세요! 아주 달아요.", rom: "sagwa saseyo! aju darayo.", l1: "Buy some apples! They're very sweet."}
          - {who: B, l2: "사과 한 개에 얼마예요?", rom: "sagwa han gaee eolmayeyo?", l1: "How much is it for one apple?", alt: ["사과 얼마예요?", "사과 하나에 얼마예요?"]}
          - {who: A, l2: "한 개에 이천 원이에요. 다섯 개에 만 원이에요.", rom: "han gaee icheon wonieyo. daseot gaee man wonieyo.", l1: "2,000 won each. Five for 10,000 won."}
          - {who: B, l2: "그럼 다섯 개 주세요.", rom: "geureom daseot gae juseyo.", l1: "Then I'll have five.", alt: ["다섯 개 주세요.", "그럼 다섯 개 살게요."]}
          - {who: A, l2: "배도 맛있어요. 배도 드릴까요?", rom: "baedo masisseoyo. baedo deurilkkayo?", l1: "The pears are good too. Would you like some pears as well?"}
          - {who: B, l2: "아니요, 사과만 주세요.", rom: "aniyo, sagwaman juseyo.", l1: "No, just the apples, please.", alt: ["아니요, 괜찮아요.", "사과만 주세요."]}
          - {who: A, l2: "알겠어요. 하나 더 넣어 드릴게요.", rom: "algesseoyo. hana deo neoeo deurilgeyo.", l1: "All right. I'll put in one extra for you."}
          - {who: B, l2: "와, 감사합니다!", rom: "wa, gamsahamnida!", l1: "Oh, thank you!", alt: ["감사합니다!", "고맙습니다!"]}

      - id: ko-talk-03-refund
        type: dialogue
        title: "Returning shoes"
        scene: "You bought shoes yesterday but they are too small. You go back to the shop with the receipt."
        you: B
        lines:
          - {who: B, l2: "어제 이 신발을 샀는데요. 환불돼요?", rom: "eoje i sinbareul sanneundeyo. hwanbuldwaeyo?", l1: "I bought these shoes yesterday. Can I get a refund?", alt: ["어제 이 신발을 샀는데 환불돼요?", "이 신발 환불할 수 있어요?"]}
          - {who: A, l2: "무슨 문제가 있으세요?", rom: "museun munjega isseuseyo?", l1: "Is there a problem with them?"}
          - {who: B, l2: "사이즈가 너무 작아요.", rom: "saijeuga neomu jagayo.", l1: "They're too small.", alt: ["너무 작아요.", "사이즈가 안 맞아요."]}
          - {who: A, l2: "다른 사이즈로 바꿔 드릴까요?", rom: "dareun saijeuro bakkwo deurilkkayo?", l1: "Shall I change them for another size?"}
          - {who: B, l2: "아니요, 환불해 주세요.", rom: "aniyo, hwanbulhae juseyo.", l1: "No, I'd like a refund, please.", alt: ["아니요, 환불하고 싶어요.", "환불해 주세요."]}
          - {who: A, l2: "영수증 있으세요?", rom: "yeongsujeung isseuseyo?", l1: "Do you have the receipt?"}
          - {who: B, l2: "네, 여기 있어요.", rom: "ne, yeogi isseoyo.", l1: "Yes, here it is.", alt: ["네, 여기요.", "여기 있어요."]}
          - {who: A, l2: "카드로 계산하셨으니까 카드로 환불해 드릴게요.", rom: "kadeuro gyesanhasyeosseunikka kadeuro hwanbulhae deurilgeyo.", l1: "You paid by card, so I'll refund it to your card."}

      - id: ko-talk-03-gift
        type: dialogue
        title: "A present for your mother"
        scene: "You are looking for a present for your mother in a department store."
        you: B
        lines:
