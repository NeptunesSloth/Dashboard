          - {who: B, l2: "이거 계산해 주세요.", rom: "igeo gyesanhae juseyo.", l1: "I'd like to pay for these, please.", alt: ["계산해 주세요.", "이거 계산할게요."]}
          - {who: A, l2: "봉투 필요하세요?", rom: "bongtu piryohaseyo?", l1: "Do you need a bag?"}
          - {who: B, l2: "네, 하나 주세요.", rom: "ne, hana juseyo.", l1: "Yes, one please.", alt: ["네, 주세요.", "네, 봉투 하나 주세요."]}
          - {who: A, l2: "봉투는 백 원이에요. 모두 사천오백 원입니다.", rom: "bongtuneun baek wonieyo. modu sacheonobaek wonimnida.", l1: "The bag is 100 won. That's 4,500 won altogether."}
          - {who: B, l2: "교통카드도 충전할 수 있어요?", rom: "gyotongkadeudo chungjeonhal su isseoyo?", l1: "Can I top up my transport card as well?", alt: ["교통카드 충전돼요?", "교통카드 충전도 돼요?"]}
          - {who: A, l2: "네, 얼마 충전해 드릴까요?", rom: "ne, eolma chungjeonhae deurilkkayo?", l1: "Yes. How much would you like to put on it?"}
          - {who: B, l2: "만 원 해 주세요.", rom: "man won hae juseyo.", l1: "10,000 won, please.", alt: ["만 원이요.", "만 원 충전해 주세요."]}

      - id: ko-talk-03-bargain
        type: dialogue
        title: "A leather bag at a street stall"
        scene: "At a street market you like a bag, but the price is high."
        you: B
        lines:
          - {who: B, l2: "이 가방 얼마예요?", rom: "i gabang eolmayeyo?", l1: "How much is this bag?", alt: ["이 가방은 얼마예요?", "이거 얼마예요?"]}
          - {who: A, l2: "육만 원이에요. 진짜 가죽이에요.", rom: "yungman wonieyo. jinjja gajugieyo.", l1: "60,000 won. It's real leather."}
          - {who: B, l2: "좀 비싸요. 좀 깎아 주세요.", rom: "jom bissayo. jom kkakka juseyo.", l1: "That's a bit expensive. Can you give me a discount?", alt: ["너무 비싸요. 좀 깎아 주세요.", "좀 깎아 주세요."]}
          - {who: A, l2: "그럼 오만 오천 원에 드릴게요.", rom: "geureom oman ocheon wone deurilgeyo.", l1: "Then I'll let you have it for 55,000 won."}
          - {who: B, l2: "오만 원은 안 돼요?", rom: "oman woneun an dwaeyo?", l1: "How about 50,000?", alt: ["오만 원에 안 돼요?", "오만 원에 주세요."]}
          - {who: A, l2: "아이고, 알겠어요. 오만 원에 가져가세요.", rom: "aigo, algesseoyo. oman wone gajyeogaseyo.", l1: "Oh, all right. Take it for 50,000."}
          - {who: B, l2: "감사합니다! 현금으로 드릴게요.", rom: "gamsahamnida! hyeongeumeuro deurilgeyo.", l1: "Thank you! I'll pay in cash.", alt: ["감사합니다! 현금으로 할게요.", "감사합니다!"]}

  # ───────────────────────────────────────────────────────────────── 4
  - id: ko-talk-04
    title: "Asking the way"
    goal: "I can ask for and follow directions, check which bus or subway line to take, take a taxi and give simple directions myself."
    notes: |
      Stop someone with **실례합니다** or **저기요**, then ask with 어떻게 가요? or 어디에 있어요?

      ## Following directions
      | | |
      |---|---|
      | 쭉 가세요 / 똑바로 가세요 | go straight on |
      | 사거리에서 오른쪽으로 도세요 | turn right at the crossroads |
      | 길을 건너세요 | cross the road |
      | 가면 왼쪽에 있어요 | when you get there it's on the left |
      | 걸어서 오 분 | five minutes on foot |

      **Check what you heard** by repeating the key words with 요: 사거리에서 오른쪽이요? It shows you are following and lets the other person correct you.

      ## Transport
      - Bus numbers are Sino-Korean: 백오십 번 버스 (bus 150).
      - Subway lines: 삼 호선 (line 3). Change lines: ○○에서 갈아타세요.
      - In a taxi, give the destination with **(으)로 가 주세요**, and say where to stop: 저기 앞에서 세워 주세요. The driver may say 어디로 모실까요? ("where can I take you?").

      **-(으)ㄹ 거예요** in a partner's answer is often a polite guess: 이십 분쯤 걸릴 거예요, "it should take about twenty minutes".
    items:
      - id: ko-talk-04-pharmacy
        type: dialogue
        title: "Is there a pharmacy near here?"
        scene: "You need a pharmacy and stop a passer-by."
        you: A
        lines:
          - {who: A, l2: "실례합니다. 이 근처에 약국이 있어요?", rom: "sillyehamnida. i geuncheoe yakgugi isseoyo?", l1: "Excuse me. Is there a pharmacy near here?", alt: ["저기요. 이 근처에 약국이 있어요?", "실례합니다. 근처에 약국 있어요?"]}
          - {who: B, l2: "네, 저기 사거리에서 오른쪽으로 가면 있어요.", rom: "ne, jeogi sageorieseo oreunjjogeuro gamyeon isseoyo.", l1: "Yes, go right at the crossroads over there and you'll find one."}
          - {who: A, l2: "멀어요?", rom: "meoreoyo?", l1: "Is it far?", alt: ["여기에서 멀어요?", "많이 멀어요?"]}
          - {who: B, l2: "아니요, 걸어서 오 분쯤 걸려요.", rom: "aniyo, georeoseo o bunjjeum geollyeoyo.", l1: "No, it's about five minutes on foot."}
          - {who: A, l2: "사거리에서 오른쪽이요?", rom: "sageorieseo oreunjjogiyo?", l1: "Right at the crossroads?", alt: ["오른쪽이요?", "사거리에서 오른쪽으로요?"]}
          - {who: B, l2: "네, 맞아요. 은행 옆에 있어요.", rom: "ne, majayo. eunhaeng yeope isseoyo.", l1: "Yes, that's right. It's next to the bank."}
          - {who: A, l2: "감사합니다!", rom: "gamsahamnida!", l1: "Thank you!", alt: ["고맙습니다!", "네, 감사합니다!"]}

      - id: ko-talk-04-bus
        type: dialogue
        title: "Is this the right bus?"
        scene: "You want to get to City Hall and ask a woman at the bus stop."
        you: A
        lines:
          - {who: A, l2: "저기요, 이 버스 시청에 가요?", rom: "jeogiyo, i beoseu sicheonge gayo?", l1: "Excuse me, does this bus go to City Hall?", alt: ["이 버스 시청에 가요?", "실례합니다. 이 버스가 시청에 가요?"]}
          - {who: B, l2: "아니요, 이 버스는 안 가요. 백오십 번 버스를 타세요.", rom: "aniyo, i beoseuneun an gayo. baegosip beon beoseureul taseyo.", l1: "No, this one doesn't. Take the number 150."}
          - {who: A, l2: "백오십 번은 어디에서 타요?", rom: "baegosip beoneun eodieseo tayo?", l1: "Where do I get the 150?", alt: ["어디에서 타요?", "백오십 번 버스는 어디에서 타요?", "백오십 번은 어디서 타요?"]}
          - {who: B, l2: "길 건너편 정류장에서 타세요.", rom: "gil geonneopyeon jeongnyujangeseo taseyo.", l1: "From the stop across the road."}
          - {who: A, l2: "시청까지 얼마나 걸려요?", rom: "sicheongkkaji eolmana geollyeoyo?", l1: "How long does it take to City Hall?", alt: ["얼마나 걸려요?", "시청까지 오래 걸려요?"]}
          - {who: B, l2: "이십 분쯤 걸릴 거예요.", rom: "isip bunjjeum geollil geoyeyo.", l1: "It should take about twenty minutes."}
          - {who: A, l2: "감사합니다.", rom: "gamsahamnida.", l1: "Thank you.", alt: ["고맙습니다.", "네, 감사합니다."]}

      - id: ko-talk-04-subway
        type: dialogue
        title: "Changing lines"
        scene: "You are at a subway station and want to go to Gangnam. You ask a station worker."
        you: A
        lines:
          - {who: A, l2: "실례합니다. 강남에 어떻게 가요?", rom: "sillyehamnida. gangname eotteoke gayo?", l1: "Excuse me. How do I get to Gangnam?", alt: ["실례합니다. 강남까지 어떻게 가요?", "강남에 어떻게 가요?"]}
          - {who: B, l2: "여기에서 삼 호선을 타세요. 그리고 교대에서 갈아타세요.", rom: "yeogieseo sam hoseoneul taseyo. geurigo gyodaeeseo garataseyo.", l1: "Take line 3 from here. Then change at Gyodae."}
          - {who: A, l2: "교대에서 몇 호선을 타요?", rom: "gyodaeeseo myeot hoseoneul tayo?", l1: "Which line do I take at Gyodae?", alt: ["몇 호선을 타요?", "교대에서 몇 호선으로 갈아타요?"]}
          - {who: B, l2: "초록색 이 호선을 타세요. 강남은 교대에서 한 정거장이에요.", rom: "choroksaek i hoseoneul taseyo. gangnameun gyodaeeseo han jeonggeojangieyo.", l1: "Take the green line, line 2. Gangnam is one stop from Gyodae."}
          - {who: A, l2: "전부 얼마나 걸려요?", rom: "jeonbu eolmana geollyeoyo?", l1: "How long does it take altogether?", alt: ["얼마나 걸려요?", "모두 얼마나 걸려요?"]}
          - {who: B, l2: "이십오 분쯤 걸려요.", rom: "isibo bunjjeum geollyeoyo.", l1: "About twenty-five minutes."}
          - {who: A, l2: "알겠습니다. 감사합니다.", rom: "algesseumnida. gamsahamnida.", l1: "I see. Thank you.", alt: ["감사합니다.", "알겠어요. 감사합니다."]}

      - id: ko-talk-04-lost
        type: dialogue
        title: "I'm lost"
        scene: "You are trying to reach Namsan Tower on foot and have lost your way."
        you: A
        lines:
          - {who: A, l2: "실례합니다. 길을 잃어버렸어요.", rom: "sillyehamnida. gireul ireobeoryeosseoyo.", l1: "Excuse me. I'm lost.", alt: ["죄송해요. 길을 잃어버렸어요.", "실례합니다. 길을 잃었어요.", "저기요. 길을 잃어버렸어요."]}
          - {who: B, l2: "어디에 가세요?", rom: "eodie gaseyo?", l1: "Where are you going?"}
          - {who: A, l2: "남산 타워에 가고 싶어요.", rom: "namsan tawoe gago sipeoyo.", l1: "I want to go to Namsan Tower.", alt: ["남산 타워에 가요.", "남산 타워요."]}
          - {who: B, l2: "남산 타워요? 여기에서 좀 멀어요. 택시를 타세요.", rom: "namsan tawoyo? yeogieseo jom meoreoyo. taeksireul taseyo.", l1: "Namsan Tower? It's quite far from here. Take a taxi."}
          - {who: A, l2: "택시는 어디에서 타요?", rom: "taeksineun eodieseo tayo?", l1: "Where can I get a taxi?", alt: ["택시는 어디서 타요?", "어디에서 택시를 타요?"]}
          - {who: B, l2: "저기 호텔 앞에 택시가 많아요.", rom: "jeogi hotel ape taeksiga manayo.", l1: "There are lots of taxis in front of that hotel."}
          - {who: A, l2: "알겠습니다. 정말 감사합니다.", rom: "algesseumnida. jeongmal gamsahamnida.", l1: "I see. Thank you so much.", alt: ["감사합니다.", "정말 고맙습니다."]}

      - id: ko-talk-04-taxi
        type: dialogue
        title: "In a taxi"
