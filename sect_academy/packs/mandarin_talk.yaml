        you: A
        lines:
          - {who: A, l2: "喂，你好，我想订一个位子。", rom: "Wéi, nǐ hǎo, wǒ xiǎng dìng yí ge wèizi.", l1: "Hello, I'd like to book a table.", alt: ["你好，我想订个位子。", "喂，你好，我想订位。", "你好，我想订一个位子。"]}
          - {who: B, l2: "好的，哪天？几位？", rom: "Hǎo de, nǎ tiān? Jǐ wèi?", l1: "Certainly. Which day? For how many?"}
          - {who: A, l2: "星期六晚上，四个人。", rom: "Xīngqīliù wǎnshang, sì ge rén.", l1: "Saturday evening, four people.", alt: ["星期六晚上，四位。", "这个星期六晚上，四个人。"]}
          - {who: B, l2: "几点？", rom: "Jǐ diǎn?", l1: "What time?"}
          - {who: A, l2: "六点半，可以吗？", rom: "Liù diǎn bàn, kěyǐ ma?", l1: "Half past six, if that's all right?", alt: ["六点半。", "六点半行吗？", "六点半有位子吗？"]}
          - {who: B, l2: "可以。请问您贵姓？", rom: "Kěyǐ. Qǐngwèn nín guì xìng?", l1: "Yes. May I have your surname?"}
          - {who: A, l2: "我姓白。", rom: "Wǒ xìng Bái.", l1: "My surname is Bai.", alt: ["免贵姓白。", "姓白。"]}
          - {who: B, l2: "好的，白先生，星期六晚上六点半，四位，给您订好了。", rom: "Hǎo de, Bái xiānsheng, xīngqīliù wǎnshang liù diǎn bàn, sì wèi, gěi nín dìng hǎo le.", l1: "Very good, Mr Bai: Saturday evening, half past six, four people. You're booked."}
          - {who: A, l2: "谢谢！星期六见。", rom: "Xièxie! Xīngqīliù jiàn.", l1: "Thank you! See you on Saturday.", alt: ["谢谢，星期六见！", "好，谢谢！"]}

      - id: zh-talk-07-badline
        type: dialogue
        title: "I can't hear you"
        scene: "A colleague calls you from somewhere very noisy."
        you: B
        lines:
          - {who: A, l2: "喂？喂？你听得见吗？", rom: "Wéi? Wéi? Nǐ tīng de jiàn ma?", l1: "Hello? Hello? Can you hear me?"}
          - {who: B, l2: "听不清楚，你那边太吵了。", rom: "Tīng bu qīngchu, nǐ nàbiān tài chǎo le.", l1: "I can't hear you clearly; it's too noisy where you are.", alt: ["听不清楚，你那儿太吵了。", "我听不清楚。", "听不太清楚，你那边太吵了。"]}
          - {who: A, l2: "我在地铁上。现在呢？", rom: "Wǒ zài dìtiě shang. Xiànzài ne?", l1: "I'm on the subway. How about now?"}
          - {who: B, l2: "好一点儿了。你说吧。", rom: "Hǎo yìdiǎnr le. Nǐ shuō ba.", l1: "That's a bit better. Go ahead.", alt: ["好点儿了，你说吧。", "现在好一点儿了。", "好一点儿了，你说。"]}
          - {who: A, l2: "明天的会几点开始？", rom: "Míngtiān de huì jǐ diǎn kāishǐ?", l1: "What time does tomorrow's meeting start?"}
          - {who: B, l2: "九点开始，在三楼。", rom: "Jiǔ diǎn kāishǐ, zài sān lóu.", l1: "It starts at nine, on the third floor.", alt: ["九点，在三楼。", "明天九点开始，在三楼。"]}
          - {who: A, l2: "好，我听见了。我一会儿再给你打吧！", rom: "Hǎo, wǒ tīngjiàn le. Wǒ yíhuìr zài gěi nǐ dǎ ba!", l1: "OK, I heard that. I'll call you again later!"}
          - {who: B, l2: "好，你下了地铁再打吧。", rom: "Hǎo, nǐ xià le dìtiě zài dǎ ba.", l1: "OK, call me when you're off the subway.", alt: ["好，等你下了地铁再打吧。", "好，一会儿再说。"]}

      - id: zh-talk-07-delivery
        type: dialogue
        title: "Your food has arrived"
        scene: "You ordered dinner on your phone. The delivery rider calls."
        you: B
        lines:
          - {who: A, l2: "喂，您好，您的外卖到了。我在楼下。", rom: "Wéi, nín hǎo, nín de wàimài dào le. Wǒ zài lóuxià.", l1: "Hello, your food delivery is here. I'm downstairs."}
          - {who: B, l2: "好的，你能送上来吗？我住十二楼。", rom: "Hǎo de, nǐ néng sòng shànglai ma? Wǒ zhù shí'èr lóu.", l1: "OK, could you bring it up? I'm on the twelfth floor.", alt: ["你能送上来吗？我在十二楼。", "能送上来吗？我住十二楼。", "好，你可以送上来吗？我住十二楼。"]}
          - {who: A, l2: "门口的保安不让我进去。", rom: "Ménkǒu de bǎo'ān bú ràng wǒ jìnqu.", l1: "The security guard at the gate won't let me in."}
          - {who: B, l2: "那我下去拿，请等一下。", rom: "Nà wǒ xiàqu ná, qǐng děng yíxià.", l1: "Then I'll come down for it; please wait a moment.", alt: ["那我下去拿吧，等一下。", "那我下去拿，请等我一下。", "好，我马上下去拿。"]}
          - {who: A, l2: "好的，我在大门口等您。", rom: "Hǎo de, wǒ zài dà ménkǒu děng nín.", l1: "OK, I'll wait for you at the main gate."}
          - {who: B, l2: "我马上到，我穿着红大衣。", rom: "Wǒ mǎshàng dào, wǒ chuān zhe hóng dàyī.", l1: "I'll be right there; I'm wearing a red coat.", alt: ["我马上到，我穿着红色的大衣。", "马上到，我穿着红大衣。"]}
          - {who: A, l2: "好，我看见您了！", rom: "Hǎo, wǒ kànjiàn nín le!", l1: "Right, I can see you!"}

  # ───────────────────────────────────────────────────────────────── 8
  - id: zh-talk-08
    title: "At the hotel and the station"
    goal: "I can check in and out, report a problem in my room, buy a train ticket, cope with a delay and find my seat."
    notes: |
      ## At the hotel
      - **Check in**: 我在网上订了一个房间, then show your passport: 给您.
      - **Ask**: 房间里能上网吗？ 早饭在几楼？ 电梯在哪儿？
      - **Problems**: something 坏了 (is broken): 空调坏了. 没有热水 (no hot water). Ask for 换一个房间.
      - **Check out**: 退房 (tuìfáng). Hand back the 房卡 (room card). You can leave bags: 可以把行李放在这儿吗？
      - Room numbers go digit by digit: 806 = 八零六.

      ## At the station
      - Tickets: 我要一张明天去上海的高铁票. Order: when, where to, which train. Seats on high-speed trains are 二等座 (second class) and 一等座 (first class). You need your passport to buy and to board.
      - Big cities have several stations: 北京南站 (Beijing South). Ask 从哪个站出发？
      - Boarding is at a 检票口 (jiǎnpiàokǒu, ticket gate).
      - **晚点** (wǎndiǎn) = delayed: 晚点多长时间？
      - Coaches are 车 (车厢): 五车 = coach 5.

      ## Sitting in the wrong seat
      It happens to everyone: 对不起，我坐错了！ (the result complement 错 again).

      Hotel staff greet you with 欢迎光临; you can ask them anything: 附近有什么好玩的地方？
    items:
      - id: zh-talk-08-checkin
        type: dialogue
        title: "Checking in"
        scene: "You arrive at your hotel in the evening and go to the front desk."
        you: B
        lines:
          - {who: A, l2: "您好，欢迎光临！您有预订吗？", rom: "Nín hǎo, huānyíng guānglín! Nín yǒu yùdìng ma?", l1: "Good evening, welcome! Do you have a reservation?"}
          - {who: B, l2: "有，我在网上订了一个房间。", rom: "Yǒu, wǒ zài wǎngshang dìng le yí ge fángjiān.", l1: "Yes, I booked a room online.", alt: ["有，我在网上订的。", "有，我订了一个房间。", "有，我在网上订了房间。"]}
          - {who: A, l2: "请给我看一下您的护照。", rom: "Qǐng gěi wǒ kàn yíxià nín de hùzhào.", l1: "May I see your passport, please?"}
          - {who: B, l2: "给您。我住三个晚上。", rom: "Gěi nín. Wǒ zhù sān ge wǎnshang.", l1: "Here you are. I'm staying three nights.", alt: ["给你。我住三个晚上。", "在这儿。我住三个晚上。", "给您，我住三晚。"]}
          - {who: A, l2: "好的。您的房间是八零六。早饭在二楼，六点半到九点半。", rom: "Hǎo de. Nín de fángjiān shì bā líng liù. Zǎofàn zài èr lóu, liù diǎn bàn dào jiǔ diǎn bàn.", l1: "Thank you. Your room is 806. Breakfast is on the second floor, from half past six to half past nine."}
          - {who: B, l2: "房间里能上网吗？", rom: "Fángjiān li néng shàngwǎng ma?", l1: "Is there internet in the room?", alt: ["房间里可以上网吗？", "房间能上网吗？"]}
          - {who: A, l2: "能，密码在房卡上。", rom: "Néng, mìmǎ zài fángkǎ shang.", l1: "Yes, the password is on your room card."}
          - {who: B, l2: "好的，谢谢！电梯在哪儿？", rom: "Hǎo de, xièxie! Diàntī zài nǎr?", l1: "Great, thanks! Where's the lift?", alt: ["谢谢！电梯在哪儿？", "好，谢谢。电梯在哪里？"]}
          - {who: A, l2: "在您右边。", rom: "Zài nín yòubian.", l1: "On your right."}

      - id: zh-talk-08-problem
        type: dialogue
        title: "The air conditioning is broken"
        scene: "It's a hot night and your room is stifling. You phone the front desk."
        you: A
        lines:
          - {who: A, l2: "喂，你好，我是八零六房间的。", rom: "Wéi, nǐ hǎo, wǒ shì bā líng liù fángjiān de.", l1: "Hello, this is room 806.", alt: ["你好，我是八零六房间的。", "喂，您好，我住八零六。", "喂，您好，我是八零六房间的。"]}
          - {who: B, l2: "您好，有什么可以帮您？", rom: "Nín hǎo, yǒu shénme kěyǐ bāng nín?", l1: "Hello, how can I help you?"}
          - {who: A, l2: "我房间的空调坏了，太热了。", rom: "Wǒ fángjiān de kōngtiáo huài le, tài rè le.", l1: "The air conditioning in my room is broken; it's far too hot.", alt: ["空调坏了，太热了。", "我房间空调坏了，很热。", "房间的空调坏了，太热了。"]}
          - {who: B, l2: "对不起，我马上叫人去看看。", rom: "Duìbuqǐ, wǒ mǎshàng jiào rén qù kànkan.", l1: "I'm sorry; I'll send someone to look at it right away."}
          - {who: A, l2: "还有，也没有热水。", rom: "Háiyǒu, yě méiyǒu rè shuǐ.", l1: "And there's no hot water either.", alt: ["还有，没有热水。", "而且没有热水。", "还有，热水也没有。"]}
          - {who: B, l2: "真对不起！如果修不好，我们就给您换一个房间。", rom: "Zhēn duìbuqǐ! Rúguǒ xiū bu hǎo, wǒmen jiù gěi nín huàn yí ge fángjiān.", l1: "I'm very sorry! If it can't be fixed, we'll move you to another room."}
          - {who: A, l2: "好，谢谢。请快一点儿。", rom: "Hǎo, xièxie. Qǐng kuài yìdiǎnr.", l1: "OK, thank you. Please be quick.", alt: ["好的，谢谢，请快一点儿。", "谢谢，请快点儿。", "好，谢谢。请快一点。"]}

      - id: zh-talk-08-checkout
        type: dialogue
        title: "Checking out"
        scene: "It's your last morning. Your train is in the afternoon."
        you: B
        lines:
          - {who: A, l2: "您好，退房吗？", rom: "Nín hǎo, tuìfáng ma?", l1: "Good morning, are you checking out?"}
          - {who: B, l2: "对，这是房卡。", rom: "Duì, zhè shì fángkǎ.", l1: "Yes, here's the room card.", alt: ["是的，这是房卡。", "对，给您房卡。", "退房，这是房卡。"]}
          - {who: A, l2: "好的，请稍等。您喝了冰箱里的饮料吗？", rom: "Hǎo de, qǐng shāo děng. Nín hē le bīngxiāng li de yǐnliào ma?", l1: "Thank you, one moment. Did you have any drinks from the minibar?"}
          - {who: B, l2: "喝了一瓶水。", rom: "Hē le yì píng shuǐ.", l1: "I had a bottle of water.", alt: ["我喝了一瓶水。", "只喝了一瓶水。"]}
          - {who: A, l2: "好的，一共是一千零五十块。", rom: "Hǎo de, yígòng shì yìqiān líng wǔshí kuài.", l1: "Thank you. That's one thousand and fifty yuan in total."}
          - {who: B, l2: "可以把行李放在这儿吗？我坐下午的火车。", rom: "Kěyǐ bǎ xíngli fàng zài zhèr ma? Wǒ zuò xiàwǔ de huǒchē.", l1: "Can I leave my luggage here? My train's in the afternoon.", alt: ["我可以把行李放在这儿吗？我坐下午的火车。", "行李可以放在这儿吗？我坐下午的火车。", "可以把行李放在这儿吗？我是下午的火车。"]}
          - {who: A, l2: "可以，您几点来拿？", rom: "Kěyǐ, nín jǐ diǎn lái ná?", l1: "Certainly. What time will you collect it?"}
          - {who: B, l2: "两点左右来拿。", rom: "Liǎng diǎn zuǒyòu lái ná.", l1: "Around two.", alt: ["两点左右。", "我两点左右来拿。", "下午两点左右。"]}
          - {who: A, l2: "好的，这是您的行李牌。", rom: "Hǎo de, zhè shì nín de xíngli pái.", l1: "Fine, here's your luggage tag."}

      - id: zh-talk-08-ticket
        type: dialogue
        title: "Buying a train ticket"
        scene: "You are at the ticket office of a Beijing station, passport in hand."
        you: A
        lines:
          - {who: A, l2: "你好，我要一张明天去上海的高铁票。", rom: "Nǐ hǎo, wǒ yào yì zhāng míngtiān qù Shànghǎi de gāotiě piào.", l1: "Hello, I'd like a high-speed ticket to Shanghai for tomorrow.", alt: ["你好，我想买一张明天去上海的高铁票。", "我要一张明天去上海的票。", "你好，买一张明天去上海的高铁票。"]}
          - {who: B, l2: "几点的？上午的票不多了。", rom: "Jǐ diǎn de? Shàngwǔ de piào bù duō le.", l1: "What time? There aren't many morning tickets left."}
          - {who: A, l2: "有下午的吗？", rom: "Yǒu xiàwǔ de ma?", l1: "Is there anything in the afternoon?", alt: ["有没有下午的？", "下午的有吗？"]}
          - {who: B, l2: "有，下午两点十分，还有二等座。", rom: "Yǒu, xiàwǔ liǎng diǎn shí fēn, hái yǒu èrděngzuò.", l1: "Yes, ten past two in the afternoon, with second-class seats still available."}
          - {who: A, l2: "多少钱？", rom: "Duōshao qián?", l1: "How much is it?", alt: ["二等座多少钱？", "一张多少钱？"]}
          - {who: B, l2: "五百五十三块。请给我您的护照。", rom: "Wǔbǎi wǔshísān kuài. Qǐng gěi wǒ nín de hùzhào.", l1: "Five hundred and fifty-three yuan. Your passport, please."}
          - {who: A, l2: "给您。从哪个站出发？", rom: "Gěi nín. Cóng nǎge zhàn chūfā?", l1: "Here you are. Which station does it leave from?", alt: ["给你。从哪个站出发？", "给您。在哪个站上车？"]}
          - {who: B, l2: "北京南站。", rom: "Běijīng Nán zhàn.", l1: "Beijing South."}

      - id: zh-talk-08-delay
        type: dialogue
        title: "The train is late"
        scene: "You are in the waiting hall at the station. You ask a member of staff about your train."
        you: A
        lines:
          - {who: A, l2: "请问，去上海的高铁在哪儿检票？", rom: "Qǐngwèn, qù Shànghǎi de gāotiě zài nǎr jiǎnpiào?", l1: "Excuse me, where do I board the high-speed train to Shanghai?", alt: ["去上海的高铁在哪儿检票？", "请问，去上海的车在哪儿检票？", "请问，去上海的高铁在哪里检票？"]}
          - {who: B, l2: "在十二号检票口。可是那趟车晚点了。", rom: "Zài shí'èr hào jiǎnpiàokǒu. Kěshì nà tàng chē wǎndiǎn le.", l1: "At gate 12. But that train is delayed."}
          - {who: A, l2: "晚点多长时间？", rom: "Wǎndiǎn duō cháng shíjiān?", l1: "How long is the delay?", alt: ["晚点多久？", "要晚多长时间？"]}
          - {who: B, l2: "大概四十分钟。", rom: "Dàgài sìshí fēnzhōng.", l1: "About forty minutes."}
          - {who: A, l2: "为什么晚点了？", rom: "Wèi shénme wǎndiǎn le?", l1: "Why is it delayed?", alt: ["为什么晚点？", "怎么晚点了？"]}
          - {who: B, l2: "因为前面下大雨。您可以在这儿等。", rom: "Yīnwèi qiánmiàn xià dà yǔ. Nín kěyǐ zài zhèr děng.", l1: "Because of heavy rain further down the line. You can wait here."}
          - {who: A, l2: "附近有吃饭的地方吗？", rom: "Fùjìn yǒu chī fàn de dìfang ma?", l1: "Is there anywhere to eat nearby?", alt: ["附近有餐厅吗？", "这儿有吃饭的地方吗？", "附近有吃东西的地方吗？"]}
          - {who: B, l2: "二楼有很多餐厅。", rom: "Èr lóu yǒu hěn duō cāntīng.", l1: "There are lots of restaurants on the second floor."}

      - id: zh-talk-08-seat
        type: dialogue
        title: "That's my seat"
        scene: "You have just sat down on the train when a woman with a suitcase stops beside you."
        you: B
        lines:
          - {who: A, l2: "对不起，这是我的座位。", rom: "Duìbuqǐ, zhè shì wǒ de zuòwèi.", l1: "Excuse me, this is my seat."}
          - {who: B, l2: "是吗？您看看我的票。", rom: "Shì ma? Nín kànkan wǒ de piào.", l1: "Is it? Have a look at my ticket.", alt: ["是吗？请看一下我的票。", "真的吗？您看看我的票。"]}
          - {who: A, l2: "你的是六车，这是五车。", rom: "Nǐ de shì liù chē, zhè shì wǔ chē.", l1: "Yours is coach 6; this is coach 5."}
          - {who: B, l2: "啊，对不起，我坐错了！", rom: "À, duìbuqǐ, wǒ zuò cuò le!", l1: "Oh, sorry, I'm in the wrong seat!", alt: ["对不起，我坐错了！", "不好意思，我坐错了！", "啊，不好意思，我坐错了！"]}
          - {who: A, l2: "没关系。", rom: "Méi guānxi.", l1: "No problem."}
          - {who: B, l2: "请问，六车在前面还是后面？", rom: "Qǐngwèn, liù chē zài qiánmiàn háishi hòumiàn?", l1: "Excuse me, is coach 6 in front or behind?", alt: ["六车在前面还是后面？", "请问，六车往哪边走？"]}
          - {who: A, l2: "在后面。你的箱子很重，我帮你拿下来吧。", rom: "Zài hòumiàn. Nǐ de xiāngzi hěn zhòng, wǒ bāng nǐ ná xiàlai ba.", l1: "Behind. Your case is heavy; let me help you get it down."}
          - {who: B, l2: "太谢谢你了！", rom: "Tài xièxie nǐ le!", l1: "Thank you so much!", alt: ["谢谢你！", "太谢谢了！", "谢谢，你真好！"]}

      - id: zh-talk-08-sights
        type: dialogue
        title: "What's worth seeing?"
        scene: "You have a free afternoon and ask the hotel receptionist for ideas."
        you: A
        lines:
          - {who: A, l2: "你好，附近有什么好玩的地方？", rom: "Nǐ hǎo, fùjìn yǒu shénme hǎowán de dìfang?", l1: "Hello, is there anything fun to see around here?", alt: ["请问，附近有什么好玩的地方？", "附近有什么好玩儿的地方？"]}
          - {who: B, l2: "很多啊！您喜欢逛街还是看风景？", rom: "Hěn duō a! Nín xǐhuan guàngjiē háishi kàn fēngjǐng?", l1: "Lots! Do you prefer shopping or sightseeing?"}
          - {who: A, l2: "我想看看老北京。", rom: "Wǒ xiǎng kànkan lǎo Běijīng.", l1: "I'd like to see old Beijing.", alt: ["我想看老北京。", "我想去看看老北京。"]}
          - {who: B, l2: "那您可以去胡同走走，离这儿不远。", rom: "Nà nín kěyǐ qù hútòng zǒuzou, lí zhèr bù yuǎn.", l1: "Then you could take a walk round the hutongs; they're not far from here."}
          - {who: A, l2: "怎么去？要打车吗？", rom: "Zěnme qù? Yào dǎ chē ma?", l1: "How do I get there? Do I need a taxi?", alt: ["怎么走？要打车吗？", "怎么去？需要打车吗？"]}
          - {who: B, l2: "不用，坐地铁两站就到了。", rom: "Bú yòng, zuò dìtiě liǎng zhàn jiù dào le.", l1: "No, it's just two stops on the subway."}
          - {who: A, l2: "太好了！你能帮我写一下地址吗？", rom: "Tài hǎo le! Nǐ néng bāng wǒ xiě yíxià dìzhǐ ma?", l1: "Great! Could you write the address down for me?", alt: ["你能帮我写一下地址吗？", "可以帮我写一下地址吗？", "太好了！可以帮我写一下地址吗？"]}
          - {who: B, l2: "当然可以。", rom: "Dāngrán kěyǐ.", l1: "Of course."}
