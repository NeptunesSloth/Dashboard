  # ───────────────────────────────────────────────────────────────── 6
  - id: ja-talk-06
    title: "Making plans"
    goal: "I can invite someone, accept or decline politely, settle a day, time and place, change a plan, warn that I'm running late, and make plans casually with friends."
    notes: |
      - **Invite softly**: 〜ません か (polite) or 〜ない？ (casual): こんど いっしょ に ごはん を たべません か.
      - **Accept**: いい です ね！ **ぜひ** (I'd love to) · たのしみ に して います.
      - **Decline**: never a flat いいえ. Thank them, then let a half-reason trail off: ありがとう ございます。 でも、 その ひ は ちょっと… · **また こんど さそって ください** (please ask me another time).
      - **Settle the details**: いつ が いい です か · 〜は どう です か · なんじ に しましょう か · どこ で あいましょう か. Then sum up: じゃ、 どようび の ろくじ に えき で.
      - **Change a plan**: すみません、 **きゅう に ようじ が できて** … (something has suddenly come up).
      - **Running late**: じゅっぷん ぐらい おくれます · さき に はじめて ください (start without me).
      - **With friends**: the same moves go casual: いく？ · いい ね！ · ごめん、 その ひ は ちょっと… · じゃ、 あと で.
      - In Tokyo, the statue of the dog **ハチこう** outside Shibuya station is the classic meeting point.
