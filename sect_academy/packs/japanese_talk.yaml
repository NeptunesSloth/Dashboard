        scene: "You work for the Bank of London in Tokyo. You phone a client company to speak to Mr. Tanaka."
        you: A
        lines:
          - {who: B, l2: "はい、 さくら しょうじ で ございます。", rom: "Hai, Sakura Shouji de gozaimasu.", l1: "Hello, Sakura Trading."}
          - {who: A, l2: "もしもし、 ロンドン ぎんこう の スミス と もうします。", rom: "Moshimoshi, Rondon Ginkou no Sumisu to moushimasu.", l1: "Hello, my name is Smith, from the Bank of London.", alt: ["もしもし、 ロンドン ぎんこう の スミス です。", "Moshimoshi, Rondon Ginkou no Sumisu desu.", "Moshimoshi, Rondon Ginkō no Sumisu to mōshimasu.", "Moshimoshi, Rondon Ginkō no Sumisu desu."]}
          - {who: B, l2: "いつも おせわ に なって おります。", rom: "Itsumo osewa ni natte orimasu.", l1: "Thank you for your continued business."}
          - {who: A, l2: "たなかさん は いらっしゃいます か。", rom: "Tanaka-san wa irasshaimasu ka.", l1: "Is Mr. Tanaka there, please?", alt: ["たなかさん を おねがいします。", "Tanaka-san o onegaishimasu.", "たなかさん は いらっしゃいます でしょう か。", "Tanaka-san wa irasshaimasu deshou ka.", "Tanaka-san ha irasshaimasu ka.", "Tanaka-san wo onegaishimasu.", "Tanaka-san ha irasshaimasu deshou ka.", "Tanaka-san wa irasshaimasu deshō ka.", "Tanaka-san ha irasshaimasu deshō ka."]}
          - {who: B, l2: "もうしわけ ございません。 たなか は いま かいぎ ちゅう で ございます。", rom: "Moushiwake gozaimasen. Tanaka wa ima kaigi chuu de gozaimasu.", l1: "I'm very sorry. Tanaka is in a meeting at the moment."}
          - {who: A, l2: "そう です か。 なんじ ごろ おわります か。", rom: "Sou desu ka. Nanji goro owarimasu ka.", l1: "I see. About what time will it finish?", alt: ["そう です か。 かいぎ は なんじ ごろ おわります か。", "Sou desu ka. Kaigi wa nanji goro owarimasu ka.", "Sō desu ka. Nanji goro owarimasu ka.", "Sou desu ka. Kaigi ha nanji goro owarimasu ka.", "Sō desu ka. Kaigi wa nanji goro owarimasu ka.", "Sō desu ka. Kaigi ha nanji goro owarimasu ka."]}
          - {who: B, l2: "さんじ ごろ に は おわる と おもいます。", rom: "Sanji goro ni wa owaru to omoimasu.", l1: "I think it will be over by about three."}
          - {who: A, l2: "じゃ、 さんじ すぎ に また おでんわ します。", rom: "Ja, sanji sugi ni mata odenwa shimasu.", l1: "Then I'll call again after three.", alt: ["では、 さんじ すぎ に また おでんわ します。", "Dewa, sanji sugi ni mata odenwa shimasu.", "じゃ、 また あと で おでんわ します。", "Ja, mata ato de odenwa shimasu.", "deha, sanji sugi ni mata odenwa shimasu."]}
          - {who: B, l2: "かしこまりました。 おでんわ が あった こと を つたえて おきます。", rom: "Kashikomarimashita. Odenwa ga atta koto o tsutaete okimasu.", l1: "Certainly. I'll let him know you called."}
          - {who: A, l2: "よろしく おねがいします。 しつれいします。", rom: "Yoroshiku onegaishimasu. Shitsurei shimasu.", l1: "Thank you. Goodbye.", alt: ["おねがいします。 しつれいします。", "Onegaishimasu. Shitsurei shimasu."]}
      - id: ja-talk-07-message
