          - {who: B, l2: "はい、 おねがいします。", rom: "Hai, onegaishimasu.", l1: "Yes, please.", alt: ["はい、 あたためて ください。", "Hai, atatamete kudasai."]}
          - {who: A, l2: "ふくろ は ごりよう です か。", rom: "Fukuro wa goriyou desu ka.", l1: "Do you need a bag?"}
          - {who: B, l2: "いいえ、 だいじょうぶ です。", rom: "Iie, daijoubu desu.", l1: "No, I'm fine, thanks.", alt: ["いいえ、 けっこう です。", "Iie, kekkou desu.", "だいじょうぶ です。", "Daijoubu desu.", "Iie, daijōbu desu.", "Iie, kekkō desu.", "Daijōbu desu."]}
          - {who: A, l2: "ポイントカード は おもち です か。", rom: "Pointokaado wa omochi desu ka.", l1: "Do you have a points card?"}
          - {who: B, l2: "いいえ、 もって いません。", rom: "Iie, motte imasen.", l1: "No, I don't have one.", alt: ["いいえ、 ありません。", "Iie, arimasen.", "もって いません。", "Motte imasen."]}
          - {who: A, l2: "ごひゃく よんじゅう えん です。", rom: "Gohyaku yonjuu en desu.", l1: "That's 540 yen."}
          - {who: B, l2: "スマホ で はらえます か。", rom: "Sumaho de haraemasu ka.", l1: "Can I pay with my phone?", alt: ["スマホ で いい です か。", "Sumaho de ii desu ka.", "スマホ は つかえます か。", "Sumaho wa tsukaemasu ka.", "Sumaho ha tsukaemasu ka."]}
          - {who: A, l2: "はい。 こちら に かざして ください。", rom: "Hai. Kochira ni kazashite kudasai.", l1: "Yes. Please hold it over here."}
