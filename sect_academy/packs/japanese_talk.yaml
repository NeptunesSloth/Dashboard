  # ───────────────────────────────────────────────────────────────── 8
  - id: ja-talk-08
    title: "Hotel and station"
    goal: "I can check in and out, ask about breakfast, Wi-Fi and luggage, report a problem in my room, buy a Shinkansen ticket and get help with lost property."
    notes: |
      Hotel and station staff speak polished keigo. You don't need to answer in kind: clear です/ます is perfect.

      - **Checking in**: チェックイン を おねがいします · **よやく して いる** スミス です (I have a booking). You will be asked for your パスポート.
      - **Questions**: ちょうしょく は なんじ から です か · ワイファイ の パスワード は なん です か · にもつ を あずけて も いい です か.
      - **Problems**: start soft with すみません and state the fact: エアコン が つきません · おゆ が でません · となり が うるさい です.
      - **Leaving**: チェックアウト を おねがいします · タクシー を よんで くれません か.
      - **Tickets**: [place] まで の きっぷ を ください · おとな いちまい · **していせき** (reserved seat) or **じゆうせき** (unreserved) · **まどがわ** (window) or **つうろがわ** (aisle).
      - **Lost property**: でんしゃ に [thing] を **わすれました** (I left … on the train). Japan's lost-and-found is famously good: describe the thing with colours and what is inside.
