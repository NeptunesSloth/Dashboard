          - {who: B, l2: "すみません、 よく きこえません。", rom: "Sumimasen, yoku kikoemasen.", l1: "Sorry, I can't hear you very well.", alt: ["すみません、 きこえません。", "Sumimasen, kikoemasen.", "もしもし？ よく きこえません。", "Moshimoshi? Yoku kikoemasen."]}
