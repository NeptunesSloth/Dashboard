id: japanese-talk
title: "Japanese — Conversations"
kind: language
language: Japanese
lang: ja-JP
track: japanese
addon: talk
hall: tongues_west
blurb: "Spoken-conversation practice to take alongside A1 and A2: 50 everyday exchanges you rehearse line by line, from a first self-introduction to checking in at a hotel."

units:
  # ───────────────────────────────────────────────────────────────── 1
  - id: ja-talk-01
    title: "Introductions"
    goal: "I can introduce myself, ask the same questions back, react to what I hear, ask people to repeat or explain a word, and take my leave politely."
    notes: |
      A Japanese first meeting follows a script that everyone knows, so learn it as whole chunks and say them aloud.

      - **Open**: はじめまして。 [name] です。 At work or with someone older: [name] **と もうします**.
      - **Close the introduction**: どうぞ よろしく おねがいします. The reply is **こちらこそ** (likewise).
      - **Ask back**: **〜さん は？** — the easiest way to keep a conversation going. Use the person's name, not あなた.
      - **React**: そう です か (I see), **へえ** (oh, really?), いい です ね, すごい です ね.
      - **When you are lost**: もう いちど おねがいします · ゆっくり おねがいします · **〜って なん です か** (what does … mean?).
      - **Compliments**: にほんご、 じょうず です ね！ The modest reply is いいえ、 まだまだ です — never just "thank you".
      - **Business cards**: give and take them with both hands, and read the card before you put it away.
      - **Leave**: **そろそろ しつれいします** (I'd better be going), じゃ、 また.
    items:
      - id: ja-talk-01-neighbour
        type: dialogue
        title: "Meeting the neighbour"
        scene: "You have just moved into a flat. On your first morning the woman next door greets you in the corridor."
        you: B
        lines:
          - {who: A, l2: "おはよう ございます。 となり に ひっこして きた かた です か。", rom: "Ohayou gozaimasu. Tonari ni hikkoshite kita kata desu ka.", l1: "Good morning. Are you the person who's just moved in next door?"}
          - {who: B, l2: "はい、 スミス です。 はじめまして。", rom: "Hai, Sumisu desu. Hajimemashite.", l1: "Yes, I'm Smith. How do you do?", alt: ["はい。 はじめまして、 スミス です。", "Hai. Hajimemashite, Sumisu desu.", "はい、 スミス と もうします。 はじめまして。", "Hai, Sumisu to moushimasu. Hajimemashite.", "Hai, Sumisu to mōshimasu. Hajimemashite."]}
          - {who: A, l2: "はじめまして。 となり の やまだ です。 どちら から いらっしゃいました か。", rom: "Hajimemashite. Tonari no Yamada desu. Dochira kara irasshaimashita ka.", l1: "How do you do? I'm Yamada from next door. Where have you come from?"}
          - {who: B, l2: "イギリス から きました。", rom: "Igirisu kara kimashita.", l1: "I came from Britain.", alt: ["イギリス です。", "Igirisu desu.", "イギリス から きました。 ロンドン です。", "Igirisu kara kimashita. Rondon desu."]}
          - {who: A, l2: "そう です か。 にほん は はじめて です か。", rom: "Sou desu ka. Nihon wa hajimete desu ka.", l1: "Really? Is this your first time in Japan?"}
          - {who: B, l2: "はい、 はじめて です。", rom: "Hai, hajimete desu.", l1: "Yes, it's my first time.", alt: ["ええ、 はじめて です。", "Ee, hajimete desu.", "Ē, hajimete desu."]}
          - {who: A, l2: "わからない こと が あったら、 いつでも きいて ください ね。", rom: "Wakaranai koto ga attara, itsudemo kiite kudasai ne.", l1: "If there's anything you're not sure about, just ask me any time."}
          - {who: B, l2: "ありがとう ございます。 よろしく おねがいします。", rom: "Arigatou gozaimasu. Yoroshiku onegaishimasu.", l1: "Thank you. I hope we'll get on well.", alt: ["ありがとう ございます。 どうぞ よろしく おねがいします。", "Arigatou gozaimasu. Douzo yoroshiku onegaishimasu.", "Arigatō gozaimasu. Yoroshiku onegaishimasu.", "Arigatō gozaimasu. Dōzo yoroshiku onegaishimasu."]}
      - id: ja-talk-01-exchange
        type: dialogue
        title: "At a language exchange"
        scene: "You arrive at a language-exchange evening in a café and see a free seat next to a young man. You are Alex."
        you: A
        lines:
          - {who: A, l2: "こんにちは。 ここ、 いい です か。", rom: "Konnichiwa. Koko, ii desu ka.", l1: "Hi. Is it OK if I sit here?", alt: ["Konnichiha. Koko, ii desu ka.", "Konnichiha. Koko ni suwatte mo ii desu ka.", "すみません、 ここ、 いい です か。", "Sumimasen, koko, ii desu ka.", "こんにちは。 ここ に すわって も いい です か。", "Konnichiwa. Koko ni suwatte mo ii desu ka."]}
          - {who: B, l2: "どうぞ、 どうぞ。 はじめまして。 けんた です。", rom: "Douzo, douzo. Hajimemashite. Kenta desu.", l1: "Sure, go ahead. Nice to meet you. I'm Kenta."}
          - {who: A, l2: "はじめまして。 アレックス です。 よろしく。", rom: "Hajimemashite. Arekkusu desu. Yoroshiku.", l1: "Nice to meet you. I'm Alex. Good to meet you.", alt: ["はじめまして。 アレックス です。 よろしく おねがいします。", "Hajimemashite. Arekkusu desu. Yoroshiku onegaishimasu."]}
          - {who: B, l2: "アレックスさん は がくせい です か。", rom: "Arekkusu-san wa gakusei desu ka.", l1: "Are you a student, Alex?"}
          - {who: A, l2: "いいえ、 かいしゃいん です。 けんたさん は？", rom: "Iie, kaishain desu. Kenta-san wa?", l1: "No, I work for a company. What about you, Kenta?", alt: ["いいえ、 かいしゃいん です。 けんたさん は がくせい です か。", "Iie, kaishain desu. Kenta-san wa gakusei desu ka.", "Iie, kaishain desu. Kenta-san ha?", "Iie, kaishain desu. Kenta-san ha gakusei desu ka."]}
          - {who: B, l2: "ぼく は だいがくせい です。 えいご を べんきょう して います。", rom: "Boku wa daigakusei desu. Eigo o benkyou shite imasu.", l1: "I'm a university student. I'm studying English."}
          - {who: A, l2: "そう です か。 わたし は にほんご を べんきょう して います。", rom: "Sou desu ka. Watashi wa Nihongo o benkyou shite imasu.", l1: "Oh, I see. I'm studying Japanese.", alt: ["へえ。 わたし は にほんご を べんきょう して います。", "Hee. Watashi wa Nihongo o benkyou shite imasu.", "Sou desu ka. Watashi wa Nihongo wo benkyou shite imasu.", "Sou desu ka. Watashi ha Nihongo o benkyou shite imasu.", "Sou desu ka. Watashi ha Nihongo wo benkyou shite imasu.", "Sō desu ka. Watashi wa Nihongo o benkyō shite imasu.", "Sō desu ka. Watashi wa Nihongo wo benkyō shite imasu.", "Sō desu ka. Watashi ha Nihongo o benkyō shite imasu.", "Sō desu ka. Watashi ha Nihongo wo benkyō shite imasu.", "Hee. Watashi wa Nihongo wo benkyou shite imasu.", "Hee. Watashi ha Nihongo o benkyou shite imasu.", "Hee. Watashi ha Nihongo wo benkyou shite imasu.", "Hē. Watashi wa Nihongo o benkyō shite imasu.", "Hē. Watashi wa Nihongo wo benkyō shite imasu.", "Hē. Watashi ha Nihongo o benkyō shite imasu.", "Hē. Watashi ha Nihongo wo benkyō shite imasu."]}
          - {who: B, l2: "じゃ、 いっしょ に がんばりましょう！", rom: "Ja, issho ni ganbarimashou!", l1: "Then let's both do our best!"}
      - id: ja-talk-01-compliment
        type: dialogue
        title: "Your Japanese is good!"
        scene: "At a barbecue, a friend of a friend hears you speaking Japanese and is impressed."
        you: B
        lines:
          - {who: A, l2: "にほんご、 じょうず です ね！", rom: "Nihongo, jouzu desu ne!", l1: "Your Japanese is really good!"}
          - {who: B, l2: "いいえ、 まだまだ です。", rom: "Iie, madamada desu.", l1: "Oh no, I've still got a long way to go.", alt: ["いえいえ、 まだまだ です。", "Ieie, madamada desu.", "いいえ、 まだまだ です よ。", "Iie, madamada desu yo."]}
          - {who: A, l2: "どの ぐらい べんきょう して います か。", rom: "Dono gurai benkyou shite imasu ka.", l1: "How long have you been studying?"}
          - {who: B, l2: "いちねん ぐらい です。", rom: "Ichinen gurai desu.", l1: "About a year.", alt: ["いちねん ぐらい べんきょう して います。", "Ichinen gurai benkyou shite imasu.", "いちねん ぐらい です ね。", "Ichinen gurai desu ne.", "Ichinen gurai benkyō shite imasu."]}
          - {who: A, l2: "いちねん で？ すごい です ね。 どう やって べんきょう しました か。", rom: "Ichinen de? Sugoi desu ne. Dou yatte benkyou shimashita ka.", l1: "In a year? That's amazing. How did you study?"}
          - {who: B, l2: "がっこう と アプリ で べんきょう しました。", rom: "Gakkou to apuri de benkyou shimashita.", l1: "At a language school and with an app.", alt: ["がっこう と アプリ です。", "Gakkou to apuri desu.", "Gakkō to apuri de benkyō shimashita.", "Gakkō to apuri desu."]}
          - {who: A, l2: "そう なんです か。 わたし も えいご を べんきょう したい ん です。", rom: "Sou nan desu ka. Watashi mo eigo o benkyou shitai n desu.", l1: "Is that right? I want to study English too."}
          - {who: B, l2: "じゃ、 こんど いっしょ に べんきょう しましょう。", rom: "Ja, kondo issho ni benkyou shimashou.", l1: "Then let's study together some time.", alt: ["じゃ、 こんど いっしょ に べんきょう しません か。", "Ja, kondo issho ni benkyou shimasen ka.", "じゃあ、 こんど いっしょ に べんきょう しましょう。", "Jaa, kondo issho ni benkyou shimashou.", "Ja, kondo issho ni benkyō shimashō.", "Ja, kondo issho ni benkyō shimasen ka.", "Jā, kondo issho ni benkyō shimashō."]}
      - id: ja-talk-01-what-does-it-mean
        type: dialogue
        title: "What does that word mean?"
        scene: "Your colleague Mr. Kondo is chatting with you over lunch and uses a word you don't know."
        you: B
        lines:
          - {who: A, l2: "スミスさん、 しゅっしん は どちら です か。", rom: "Sumisu-san, shusshin wa dochira desu ka.", l1: "Mr. Smith, where are you from originally?"}
          - {who: B, l2: "すみません、 しゅっしん って なん です か。", rom: "Sumimasen, shusshin tte nan desu ka.", l1: "Sorry, what does 'shusshin' mean?", alt: ["すみません、 「しゅっしん」 って なん です か。", "すみません、 しゅっしん は どういう いみ です か。", "Sumimasen, shusshin wa dou iu imi desu ka.", "Sumimasen, shusshin ha dou iu imi desu ka.", "Sumimasen, shusshin wa dō iu imi desu ka.", "Sumimasen, shusshin ha dō iu imi desu ka."]}
          - {who: A, l2: "ああ、 うまれた ところ です。 どこ で うまれました か。", rom: "Aa, umareta tokoro desu. Doko de umaremashita ka.", l1: "Oh, the place you were born. Where were you born?"}
          - {who: B, l2: "ああ、 わかりました。 マンチェスター です。", rom: "Aa, wakarimashita. Manchesutaa desu.", l1: "Ah, I see. Manchester.", alt: ["わかりました。 マンチェスター です。", "Wakarimashita. Manchesutaa desu.", "ああ、 わかりました。 マンチェスター で うまれました。", "Aa, wakarimashita. Manchesutaa de umaremashita.", "Ā, wakarimashita. Manchesutā desu.", "Wakarimashita. Manchesutā desu.", "Ā, wakarimashita. Manchesutā de umaremashita."]}
          - {who: A, l2: "マンチェスター？ サッカー で ゆうめい な まち です よね。", rom: "Manchesutaa? Sakkaa de yuumei na machi desu yo ne.", l1: "Manchester? That's the city famous for football, isn't it?"}
          - {who: B, l2: "すみません、 もう すこし ゆっくり おねがいします。", rom: "Sumimasen, mou sukoshi yukkuri onegaishimasu.", l1: "Sorry, a little more slowly, please.", alt: ["すみません、 ゆっくり おねがいします。", "Sumimasen, yukkuri onegaishimasu.", "すみません、 もう すこし ゆっくり はなして ください。", "Sumimasen, mou sukoshi yukkuri hanashite kudasai.", "Sumimasen, mō sukoshi yukkuri onegaishimasu.", "Sumimasen, mō sukoshi yukkuri hanashite kudasai."]}
          - {who: A, l2: "あ、 すみません。 サッカー で、 ゆうめい な、 まち です よね。", rom: "A, sumimasen. Sakkaa de, yuumei na, machi desu yo ne.", l1: "Oh, sorry. It's a city... famous... for football, right?"}
          - {who: B, l2: "はい、 そう です。 サッカー が すき です か。", rom: "Hai, sou desu. Sakkaa ga suki desu ka.", l1: "Yes, that's right. Do you like football?", alt: ["ええ、 そう です。 サッカー が すき です か。", "Ee, sou desu. Sakkaa ga suki desu ka.", "Hai, sō desu. Sakkā ga suki desu ka.", "Ē, sō desu. Sakkā ga suki desu ka."]}
      - id: ja-talk-01-business-cards
        type: dialogue
        title: "Exchanging business cards"
        scene: "You are Smith, visiting a client company in Tokyo. Mr. Tanaka meets you in reception."
        you: B
        lines:
          - {who: A, l2: "はじめまして。 さくら しょうじ の たなか と もうします。", rom: "Hajimemashite. Sakura Shouji no Tanaka to moushimasu.", l1: "How do you do? My name is Tanaka, of Sakura Trading."}
          - {who: B, l2: "はじめまして。 スミス と もうします。", rom: "Hajimemashite. Sumisu to moushimasu.", l1: "How do you do? My name is Smith.", alt: ["はじめまして。 スミス です。", "Hajimemashite. Sumisu desu.", "はじめまして。 わたくし は スミス と もうします。", "Hajimemashite. Watakushi wa Sumisu to moushimasu.", "Hajimemashite. Sumisu to mōshimasu.", "Hajimemashite. Watakushi ha Sumisu to moushimasu.", "Hajimemashite. Watakushi wa Sumisu to mōshimasu.", "Hajimemashite. Watakushi ha Sumisu to mōshimasu."]}
          - {who: A, l2: "こちら、 わたくし の めいし です。 どうぞ よろしく おねがいします。", rom: "Kochira, watakushi no meishi desu. Douzo yoroshiku onegaishimasu.", l1: "Here is my card. I look forward to working with you."}
          - {who: B, l2: "ありがとう ございます。 わたし の めいし です。", rom: "Arigatou gozaimasu. Watashi no meishi desu.", l1: "Thank you. And here is mine.", alt: ["ちょうだい します。 わたし の めいし です。", "Choudai shimasu. Watashi no meishi desu.", "ありがとう ございます。 こちら が わたし の めいし です。", "Arigatou gozaimasu. Kochira ga watashi no meishi desu.", "Arigatō gozaimasu. Watashi no meishi desu.", "Chōdai shimasu. Watashi no meishi desu.", "Arigatō gozaimasu. Kochira ga watashi no meishi desu."]}
          - {who: A, l2: "スミスさん は ロンドン から いらっしゃいました か。", rom: "Sumisu-san wa Rondon kara irasshaimashita ka.", l1: "Have you come from London, Mr. Smith?"}
          - {who: B, l2: "はい、 ロンドン の ほんしゃ から きました。", rom: "Hai, Rondon no honsha kara kimashita.", l1: "Yes, I've come from our head office in London.", alt: ["はい、 ロンドン から きました。", "Hai, Rondon kara kimashita.", "はい、 そう です。", "Hai, sou desu.", "Hai, sō desu."]}
          - {who: A, l2: "にほん の せいかつ は いかが です か。", rom: "Nihon no seikatsu wa ikaga desu ka.", l1: "How are you finding life in Japan?"}
          - {who: B, l2: "とても たのしい です。 たべもの が おいしい です。", rom: "Totemo tanoshii desu. Tabemono ga oishii desu.", l1: "I'm really enjoying it. The food is delicious.", alt: ["たのしい です。 たべもの が おいしい です ね。", "Tanoshii desu. Tabemono ga oishii desu ne."]}
      - id: ja-talk-01-leaving
        type: dialogue
        title: "Taking your leave"
        scene: "You have been chatting with a new acquaintance, Ms. Ueda, at a café for an hour. It's time to go."
        you: A
        lines:
          - {who: A, l2: "あ、 すみません。 そろそろ しつれいします。", rom: "A, sumimasen. Sorosoro shitsurei shimasu.", l1: "Oh, sorry. I'd better be going.", alt: ["すみません、 そろそろ しつれいします。", "Sumimasen, sorosoro shitsurei shimasu.", "あ、 すみません。 そろそろ かえります。", "A, sumimasen. Sorosoro kaerimasu."]}
          - {who: B, l2: "そう です か。 きょう は たのしかった です。", rom: "Sou desu ka. Kyou wa tanoshikatta desu.", l1: "Oh, OK. Today was fun."}
          - {who: A, l2: "わたし も たのしかった です。", rom: "Watashi mo tanoshikatta desu.", l1: "I enjoyed it too.", alt: ["わたし も です。", "Watashi mo desu.", "こちらこそ、 たのしかった です。", "Kochirakoso, tanoshikatta desu."]}
          - {who: B, l2: "また あいましょう。 れんらく します ね。", rom: "Mata aimashou. Renraku shimasu ne.", l1: "Let's meet again. I'll be in touch."}
          - {who: A, l2: "はい、 ぜひ。 また あいましょう。", rom: "Hai, zehi. Mata aimashou.", l1: "Yes, I'd love to. Let's meet again.", alt: ["ぜひ。 また あいましょう。", "Zehi. Mata aimashou.", "はい、 ぜひ。", "Hai, zehi.", "Hai, zehi. Mata aimashō.", "Zehi. Mata aimashō."]}
          - {who: B, l2: "き を つけて かえって ください ね。", rom: "Ki o tsukete kaette kudasai ne.", l1: "Get home safely."}
          - {who: A, l2: "ありがとう ございます。 じゃ、 また。", rom: "Arigatou gozaimasu. Ja, mata.", l1: "Thank you. See you, then.", alt: ["ありがとう。 じゃ、 また。", "Arigatou. Ja, mata.", "ありがとう ございます。 しつれいします。", "Arigatou gozaimasu. Shitsurei shimasu.", "Arigatō gozaimasu. Ja, mata.", "Arigatō. Ja, mata.", "Arigatō gozaimasu. Shitsurei shimasu."]}

  # ───────────────────────────────────────────────────────────────── 2
  - id: ja-talk-02
    title: "At a restaurant"
    goal: "I can get a table, order food and drink, ask what something is and what is recommended, explain what I can't eat, sort out a mistake and pay."
    notes: |
      Japanese restaurants run on set phrases from the staff, so most of your job is to understand them and answer briefly.

      - **Arriving**: staff call **いらっしゃいませ！ なんめいさま です か** (how many of you?). Answer with the people counter: ひとり, **ふたり**, さんにん.
      - **Calling staff**: **すみません！** is normal and polite. Many tables have a call button.
      - **Ordering**: [dish] を ください / [dish] を おねがいします / [dish] に します. Count with ひとつ, ふたつ.
      - **Asking**: **おすすめ は なん です か** (what do you recommend?) · これ は なん です か · 〜って なん です か.
      - **Food limits**: [food] が たべられません · [food] の **アレルギー が あります**.
      - **Problems**: すみません、 これ は たのんで いません (I didn't order this). Stay soft: すみません first, the fact second.
      - **Paying**: **おかいけい おねがいします**. You usually pay at the till by the door, and there is no tipping.
      - **Leaving**: ごちそうさま でした — the staff will thank you as you go.
    items:
      - id: ja-talk-02-table
        type: dialogue
        title: "Getting a table"
        scene: "You and a friend arrive at a busy restaurant at lunchtime. A waiter greets you at the door."
        you: B
        lines:
          - {who: A, l2: "いらっしゃいませ！ なんめいさま です か。", rom: "Irasshaimase! Nanmeisama desu ka.", l1: "Welcome! How many people?"}
          - {who: B, l2: "ふたり です。", rom: "Futari desu.", l1: "Two.", alt: ["ふたり おねがいします。", "Futari onegaishimasu.", "二人です"]}
          - {who: A, l2: "すみません、 いま まんせき です。 じゅっぷん ぐらい おまち いただけます か。", rom: "Sumimasen, ima manseki desu. Juppun gurai omachi itadakemasu ka.", l1: "I'm sorry, we're full at the moment. Could you wait about ten minutes?"}
          - {who: B, l2: "はい、 まちます。", rom: "Hai, machimasu.", l1: "Yes, we'll wait.", alt: ["はい、 だいじょうぶ です。", "Hai, daijoubu desu.", "はい、 まちます よ。", "Hai, machimasu yo.", "Hai, daijōbu desu."]}
          - {who: A, l2: "では、 こちら に おなまえ を おねがいします。", rom: "Dewa, kochira ni onamae o onegaishimasu.", l1: "Then could I have your name here, please?"}
          - {who: B, l2: "スミス です。", rom: "Sumisu desu.", l1: "It's Smith.", alt: ["スミス で おねがいします。", "Sumisu de onegaishimasu."]}
          - {who: A, l2: "スミスさま、 おふたりさま です ね。 しょうしょう おまち ください。", rom: "Sumisu-sama, ofutarisama desu ne. Shoushou omachi kudasai.", l1: "Mr. Smith, a table for two. Just a moment, please."}
          - {who: B, l2: "はい、 おねがいします。", rom: "Hai, onegaishimasu.", l1: "OK, thank you.", alt: ["はい。", "Hai.", "はい、 わかりました。", "Hai, wakarimashita."]}
      - id: ja-talk-02-ordering
        type: dialogue
        title: "Ordering a set meal"
        scene: "You are in a small set-meal restaurant. The waitress comes to take your order."
        you: B
        lines:
