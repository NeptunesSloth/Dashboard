        lines:
          - {who: B, l2: "はい、 さとう です。", rom: "Hai, Satou desu.", l1: "Hello, Sato residence."}
          - {who: A, l2: "もしもし、 スミス と もうします。 ゆきさん は いらっしゃいます か。", rom: "Moshimoshi, Sumisu to moushimasu. Yuki-san wa irasshaimasu ka.", l1: "Hello, my name is Smith. Is Yuki there, please?", alt: ["もしもし、 スミス です。 ゆきさん は いらっしゃいます か。", "Moshimoshi, Sumisu desu. Yuki-san wa irasshaimasu ka.", "もしもし、 スミス と もうします。 ゆきさん は います か。", "Moshimoshi, Sumisu to moushimasu. Yuki-san wa imasu ka.", "Moshimoshi, Sumisu to moushimasu. Yuki-san ha irasshaimasu ka.", "Moshimoshi, Sumisu to mōshimasu. Yuki-san wa irasshaimasu ka.", "Moshimoshi, Sumisu to mōshimasu. Yuki-san ha irasshaimasu ka.", "Moshimoshi, Sumisu desu. Yuki-san ha irasshaimasu ka.", "Moshimoshi, Sumisu to moushimasu. Yuki-san ha imasu ka.", "Moshimoshi, Sumisu to mōshimasu. Yuki-san wa imasu ka.", "Moshimoshi, Sumisu to mōshimasu. Yuki-san ha imasu ka."]}
