  # ───────────────────────────────────────────────────────────────── 4
  - id: ja-talk-04
    title: "Asking the way"
    goal: "I can stop someone politely, ask for a place, follow and check directions, find the right exit, platform or bus, and give simple directions myself."
    notes: |
      - **Stop someone**: すみません、 ちょっと いい です か. Then [place] は どこ です か, or [place] へ は どう いけば いい です か.
      - **Understand the answer**: listen for まっすぐ, みぎ, ひだり, 〜を わたって, 〜めの かど, つきあたり and landmarks: コンビニ, しんごう (traffic lights), こうさてん.
      - **Check you followed**: repeat the key part back with **〜です ね**: ふたつめ の しんごう を みぎ です ね. It is what Japanese speakers do too.
      - **Get help**: もう すこし ゆっくり おねがいします · ちず を かいて くれません か · とおい です か · あるいて なんぷん です か.
      - **Trains**: 〜いき は なんばんせん です か (which platform for …?) · のりかえ は あります か · この でんしゃ は 〜に とまります か.
      - **Buses**: この バス は 〜へ いきます か · 〜ばん の バス.
      - **Close**: ありがとう ございます。 **たすかりました** (that's a great help).
    items:
      - id: ja-talk-04-station
        type: dialogue
        title: "Where's the station?"
        scene: "You are walking in an unfamiliar neighbourhood and need the station. You stop a man in the street."
        you: A
        lines:
          - {who: A, l2: "すみません、 ちょっと いい です か。", rom: "Sumimasen, chotto ii desu ka.", l1: "Excuse me, have you got a moment?", alt: ["すみません。", "Sumimasen.", "あの、 すみません。", "Ano, sumimasen."]}
          - {who: B, l2: "はい、 なん でしょう。", rom: "Hai, nan deshou.", l1: "Yes, what is it?"}
          - {who: A, l2: "えき は どこ です か。", rom: "Eki wa doko desu ka.", l1: "Where is the station?", alt: ["えき へ は どう いけば いい です か。", "Eki e wa dou ikeba ii desu ka.", "えき は どちら です か。", "Eki wa dochira desu ka.", "えき に は どう いけば いい です か。", "Eki ni wa dou ikeba ii desu ka.", "Eki ha doko desu ka.", "Eki e ha dou ikeba ii desu ka.", "Eki he wa dou ikeba ii desu ka.", "Eki he ha dou ikeba ii desu ka.", "Eki e wa dō ikeba ii desu ka.", "Eki e ha dō ikeba ii desu ka.", "Eki he wa dō ikeba ii desu ka.", "Eki he ha dō ikeba ii desu ka.", "Eki ha dochira desu ka.", "Eki ni ha dou ikeba ii desu ka.", "Eki ni wa dō ikeba ii desu ka.", "Eki ni ha dō ikeba ii desu ka."]}
          - {who: B, l2: "えき です か。 この みち を まっすぐ いって、 ふたつめ の しんごう を みぎ です。", rom: "Eki desu ka. Kono michi o massugu itte, futatsume no shingou o migi desu.", l1: "The station? Go straight along this road and turn right at the second set of lights."}
          - {who: A, l2: "ふたつめ の しんごう を みぎ です ね。", rom: "Futatsume no shingou o migi desu ne.", l1: "Right at the second lights, yes?", alt: ["ふたつめ の しんごう を みぎ に まがる ん です ね。", "Futatsume no shingou o migi ni magaru n desu ne.", "ふたつめ の しんごう を みぎ に まがります ね。", "Futatsume no shingou o migi ni magarimasu ne.", "Futatsume no shingou wo migi desu ne.", "Futatsume no shingō o migi desu ne.", "Futatsume no shingō wo migi desu ne.", "Futatsume no shingou wo migi ni magaru n desu ne.", "Futatsume no shingō o migi ni magaru n desu ne.", "Futatsume no shingō wo migi ni magaru n desu ne.", "Futatsume no shingou wo migi ni magarimasu ne.", "Futatsume no shingō o migi ni magarimasu ne.", "Futatsume no shingō wo migi ni magarimasu ne."]}
          - {who: B, l2: "はい。 まがる と、 ひだり に みえます よ。", rom: "Hai. Magaru to, hidari ni miemasu yo.", l1: "That's right. When you turn, you'll see it on the left."}
          - {who: A, l2: "ありがとう ございます。 たすかりました。", rom: "Arigatou gozaimasu. Tasukarimashita.", l1: "Thank you. That's a great help.", alt: ["どうも ありがとう ございました。", "Doumo arigatou gozaimashita.", "ありがとう ございます。", "Arigatou gozaimasu.", "Arigatō gozaimasu. Tasukarimashita.", "Dōmo arigatō gozaimashita.", "Arigatō gozaimasu."]}
