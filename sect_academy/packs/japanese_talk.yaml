  # ───────────────────────────────────────────────────────────────── 5
  - id: ja-talk-05
    title: "At the doctor's"
    goal: "I can register at a clinic, describe my symptoms and since when, understand instructions for medicine, ask what I may and may not do, and call in sick."
    notes: |
      Clinics in Japan start at the reception desk with your **ほけんしょう** (insurance card) and a **もんしんひょう** (health questionnaire). Ask for an English one if you need it: えいご の は あります か.

      - **Symptoms**: [part] が いたい です · ねつ が あります · せき が でます · **はきけ が します** (I feel sick) · きもち が わるい です.
      - **Since when**: きのう から, けさ から, **みっか まえ から** (for three days).
      - **Medicine**: いちにち さんかい (three times a day) · しょくご (after meals) · ねる まえ に (before bed) · いつか ぶん (five days' worth).
      - **Ask back**: いつ まで のみます か · 〜て も いい です か (may I …?): おふろ に はいって も いい です か · しごと に いって も いい です か.
      - **Understand the answers**: 〜て ください, 〜ないで ください, 〜なければ なりません, 〜なくても いい です — all from A2.
      - **Calling in sick**: ねつ が ある ので、 きょう は やすませて ください. Your boss will say おだいじに.
      - **Unknown words**: 〜って なん です か works here too; doctors are used to explaining.
    items:
      - id: ja-talk-05-reception
        type: dialogue
        title: "At the clinic reception"
        scene: "You walk into a local clinic for the first time. The receptionist looks up."
        you: B
        lines:
          - {who: A, l2: "こんにちは。 はじめて です か。", rom: "Konnichiwa. Hajimete desu ka.", l1: "Hello. Is this your first visit?"}
          - {who: B, l2: "はい、 はじめて です。", rom: "Hai, hajimete desu.", l1: "Yes, it's my first time.", alt: ["ええ、 はじめて です。", "Ee, hajimete desu.", "Ē, hajimete desu."]}
          - {who: A, l2: "ほけんしょう を おねがいします。", rom: "Hokenshou o onegaishimasu.", l1: "Your insurance card, please."}
          - {who: B, l2: "はい、 これ です。", rom: "Hai, kore desu.", l1: "Yes, here it is.", alt: ["はい、 どうぞ。", "Hai, douzo.", "はい、 おねがいします。", "Hai, onegaishimasu.", "Hai, dōzo."]}
          - {who: A, l2: "では、 この もんしんひょう に かいて ください。 にほんご は だいじょうぶ です か。", rom: "Dewa, kono monshinhyou ni kaite kudasai. Nihongo wa daijoubu desu ka.", l1: "Then please fill in this questionnaire. Is Japanese all right for you?"}
          - {who: B, l2: "すこし むずかしい です。 えいご の は あります か。", rom: "Sukoshi muzukashii desu. Eigo no wa arimasu ka.", l1: "It's a bit difficult. Do you have one in English?", alt: ["ちょっと むずかしい です。 えいご の は あります か。", "Chotto muzukashii desu. Eigo no wa arimasu ka.", "すこし むずかしい です。 えいご の は ありません か。", "Sukoshi muzukashii desu. Eigo no wa arimasen ka.", "Sukoshi muzukashii desu. Eigo no ha arimasu ka.", "Chotto muzukashii desu. Eigo no ha arimasu ka.", "Sukoshi muzukashii desu. Eigo no ha arimasen ka."]}
          - {who: A, l2: "はい、 ございます。 こちら を どうぞ。", rom: "Hai, gozaimasu. Kochira o douzo.", l1: "Yes, we do. Here you are."}
          - {who: B, l2: "ありがとう ございます。", rom: "Arigatou gozaimasu.", l1: "Thank you.", alt: ["たすかります。 ありがとう ございます。", "Tasukarimasu. Arigatou gozaimasu.", "Arigatō gozaimasu.", "Tasukarimasu. Arigatō gozaimasu."]}
      - id: ja-talk-05-symptoms
        type: dialogue
        title: "Describing your symptoms"
        scene: "You are in the consulting room. The doctor asks what is wrong."
        you: B
        lines:
          - {who: A, l2: "きょう は どう しました か。", rom: "Kyou wa dou shimashita ka.", l1: "What brings you in today?"}
          - {who: B, l2: "おなか が いたい です。", rom: "Onaka ga itai desu.", l1: "I have a stomach ache.", alt: ["おなか が いたい ん です。", "Onaka ga itai n desu.", "ちょっと おなか が いたい です。", "Chotto onaka ga itai desu."]}
          - {who: A, l2: "いつ から です か。", rom: "Itsu kara desu ka.", l1: "Since when?"}
          - {who: B, l2: "きのう の よる から です。", rom: "Kinou no yoru kara desu.", l1: "Since last night.", alt: ["ゆうべ から です。", "Yuube kara desu.", "きのう の よる から いたい です。", "Kinou no yoru kara itai desu.", "Kinō no yoru kara desu.", "Yūbe kara desu.", "Kinō no yoru kara itai desu."]}
          - {who: A, l2: "はきけ は あります か。", rom: "Hakike wa arimasu ka.", l1: "Do you have any nausea?"}
          - {who: B, l2: "すみません、 はきけ って なん です か。", rom: "Sumimasen, hakike tte nan desu ka.", l1: "Sorry, what does 'hakike' mean?", alt: ["はきけ って なん です か。", "Hakike tte nan desu ka."]}
          - {who: A, l2: "きもち が わるくて、 はきたい かんじ の こと です。", rom: "Kimochi ga warukute, hakitai kanji no koto desu.", l1: "It means feeling ill, as if you're going to be sick."}
          - {who: B, l2: "ああ、 すこし あります。", rom: "Aa, sukoshi arimasu.", l1: "Oh, a little, yes.", alt: ["ああ、 ちょっと あります。", "Aa, chotto arimasu.", "はい、 すこし あります。", "Hai, sukoshi arimasu.", "Ā, sukoshi arimasu.", "Ā, chotto arimasu."]}
          - {who: A, l2: "そう です か。 じゃ、 ちょっと みせて ください ね。", rom: "Sou desu ka. Ja, chotto misete kudasai ne.", l1: "I see. Let me have a look, then."}
      - id: ja-talk-05-medicine
        type: dialogue
        title: "Collecting your medicine"
        scene: "At the pharmacy next to the clinic, the pharmacist hands over your prescription."
        you: A
        lines:
          - {who: B, l2: "スミスさま、 おくすり です。 こちら は いちにち さんかい、 しょくご に のんで ください。", rom: "Sumisu-sama, okusuri desu. Kochira wa ichinichi sankai, shokugo ni nonde kudasai.", l1: "Mr. Smith, here's your medicine. Take this one three times a day, after meals."}
          - {who: A, l2: "いちにち さんかい です ね。", rom: "Ichinichi sankai desu ne.", l1: "Three times a day, OK.", alt: ["いちにち さんかい、 しょくご です ね。", "Ichinichi sankai, shokugo desu ne."]}
          - {who: B, l2: "はい。 こちら は ねる まえ に いっかい です。", rom: "Hai. Kochira wa neru mae ni ikkai desu.", l1: "Yes. And this one is once, before bed."}
          - {who: A, l2: "いつ まで のみます か。", rom: "Itsu made nomimasu ka.", l1: "How long do I take them for?", alt: ["いつ まで のめば いい です か。", "Itsu made nomeba ii desu ka."]}
          - {who: B, l2: "いつか ぶん です。 ぜんぶ のんで ください ね。", rom: "Itsuka bun desu. Zenbu nonde kudasai ne.", l1: "It's five days' worth. Please finish them all."}
          - {who: A, l2: "おさけ を のんで も いい です か。", rom: "Osake o nonde mo ii desu ka.", l1: "Can I drink alcohol?", alt: ["おさけ は のんで も いい です か。", "Osake wa nonde mo ii desu ka.", "ビール を のんで も いい です か。", "Biiru o nonde mo ii desu ka.", "Osake wo nonde mo ii desu ka.", "Osake ha nonde mo ii desu ka.", "Biiru wo nonde mo ii desu ka.", "Bīru o nonde mo ii desu ka.", "Bīru wo nonde mo ii desu ka."]}
          - {who: B, l2: "くすり を のんで いる あいだ は、 のまないで ください。", rom: "Kusuri o nonde iru aida wa, nomanaide kudasai.", l1: "Please don't while you're taking the medicine."}
          - {who: A, l2: "わかりました。 ありがとう ございます。", rom: "Wakarimashita. Arigatou gozaimasu.", l1: "Understood. Thank you.", alt: ["はい、 わかりました。", "Hai, wakarimashita.", "Wakarimashita. Arigatō gozaimasu."]}
          - {who: B, l2: "おだいじに。", rom: "Odaijini.", l1: "Take care of yourself."}
      - id: ja-talk-05-dentist
        type: dialogue
        title: "At the dentist"
        scene: "You have had toothache for two days and finally sit in the dentist's chair."
        you: B
        lines:
          - {who: A, l2: "どう されました か。", rom: "Dou saremashita ka.", l1: "What seems to be the trouble?"}
          - {who: B, l2: "おく の は が いたい です。", rom: "Oku no ha ga itai desu.", l1: "A back tooth hurts.", alt: ["は が いたい です。", "Ha ga itai desu.", "おく の は が いたい ん です。", "Oku no ha ga itai n desu."]}
          - {who: A, l2: "つめたい もの を のむ と、 いたい です か。", rom: "Tsumetai mono o nomu to, itai desu ka.", l1: "Does it hurt when you drink something cold?"}
          - {who: B, l2: "はい、 とても いたい です。", rom: "Hai, totemo itai desu.", l1: "Yes, it really hurts.", alt: ["はい、 すごく いたい です。", "Hai, sugoku itai desu.", "はい、 いたい です。", "Hai, itai desu."]}
          - {who: A, l2: "むしば です ね。 きょう ちりょう しましょう。", rom: "Mushiba desu ne. Kyou chiryou shimashou.", l1: "It's a cavity. Let's treat it today."}
          - {who: B, l2: "いたく ない です か。", rom: "Itaku nai desu ka.", l1: "Won't it hurt?", alt: ["いたい です か。", "Itai desu ka.", "いたく ありません か。", "Itaku arimasen ka."]}
          - {who: A, l2: "ますい を します から、 だいじょうぶ です よ。", rom: "Masui o shimasu kara, daijoubu desu yo.", l1: "I'll give you an anaesthetic, so you'll be fine."}
          - {who: B, l2: "よかった。 おねがいします。", rom: "Yokatta. Onegaishimasu.", l1: "Thank goodness. Go ahead, please.", alt: ["よかった です。 おねがいします。", "Yokatta desu. Onegaishimasu.", "わかりました。 おねがいします。", "Wakarimashita. Onegaishimasu."]}
