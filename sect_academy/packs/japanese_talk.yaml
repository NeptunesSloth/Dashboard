          - {who: A, l2: "そっか。 じゃ、 カレー に しよう。", rom: "Sokka. Ja, karee ni shiyou.", l1: "Oh yeah. Let's have curry, then.", alt: ["そっか。 じゃ、 カレー は？", "Sokka. Ja, karee wa?", "そう だ ね。 じゃ、 カレー に しよう。", "Sou da ne. Ja, karee ni shiyou.", "Sokka. Ja, karē ni shiyō.", "Sokka. Ja, karee ha?", "Sokka. Ja, karē wa?", "Sokka. Ja, karē ha?", "Sō da ne. Ja, karē ni shiyō."]}
          - {who: B, l2: "いい ね！ えき の まえ の みせ、 おいしい よ。", rom: "Ii ne! Eki no mae no mise, oishii yo.", l1: "Good idea! The place in front of the station is good."}
          - {who: A, l2: "じゃ、 そこ に いこう。", rom: "Ja, soko ni ikou.", l1: "Let's go there, then.", alt: ["じゃ、 そこ へ いこう。", "Ja, soko e ikou.", "じゃあ、 そこ に いこう。", "Jaa, soko ni ikou.", "Ja, soko ni ikō.", "Ja, soko he ikou.", "Ja, soko e ikō.", "Ja, soko he ikō.", "Jā, soko ni ikō."]}
      - id: ja-talk-06-karaoke
        type: dialogue
        title: "Karaoke tonight?"
        scene: "Your friend Yui messages you, then calls. She talks casually."
        you: B
        lines:
          - {who: A, l2: "こんばん、 カラオケ いかない？", rom: "Konban, karaoke ikanai?", l1: "Do you want to go to karaoke tonight?"}
          - {who: B, l2: "いい ね！ なんじ から？", rom: "Ii ne! Nanji kara?", l1: "Sounds fun! What time?", alt: ["いい ね。 なんじ から？", "Ii ne. Nanji kara?", "いく！ なんじ から？", "Iku! Nanji kara?"]}
          - {who: A, l2: "はちじ から。 みんな で いく よ。", rom: "Hachiji kara. Minna de iku yo.", l1: "From eight. A whole group of us are going."}
          - {who: B, l2: "ごめん、 はちじ は ちょっと はやい な。 くじ でも いい？", rom: "Gomen, hachiji wa chotto hayai na. Kuji demo ii?", l1: "Sorry, eight's a bit early for me. Is nine OK?", alt: ["ごめん、 くじ から でも いい？", "Gomen, kuji kara demo ii?", "ごめん、 はちじ は ちょっと…。 くじ でも いい？", "Gomen, hachiji wa chotto…. Kuji demo ii?", "Gomen, hachiji ha chotto hayai na. Kuji demo ii?", "Gomen, hachiji ha chotto…. Kuji demo ii?"]}
          - {who: A, l2: "うん、 いい よ。 じゃ、 くじ に えき で ね。", rom: "Un, ii yo. Ja, kuji ni eki de ne.", l1: "Yeah, fine. Nine at the station, then."}
          - {who: B, l2: "わかった。 じゃ、 あと で。", rom: "Wakatta. Ja, ato de.", l1: "Got it. See you later.", alt: ["うん、 じゃ、 あと で。", "Un, ja, ato de.", "わかった。 じゃ、 あと で ね。", "Wakatta. Ja, ato de ne."]}

  # ───────────────────────────────────────────────────────────────── 7
  - id: ja-talk-07
    title: "On the phone"
    goal: "I can book a table by phone, ask for someone at a company, leave a message, deal with a wrong number or a bad line, and phone a friend."
    notes: |
      Phone Japanese is more formal than face-to-face Japanese, and it is full of fixed phrases.

      - **Open**: **もしもし** (only on the phone). Give your name with **と もうします**, or [company] の [name] です.
      - **Ask for someone**: 〜さん は **いらっしゃいます か**. You will hear: しょうしょう おまち ください · たなか は いま せき を はずして おります (is away from their desk) · でかけて おります (is out) · かいぎ ちゅう です (is in a meeting).
      - Staff refer to their own colleagues with no さん when talking to outsiders: たなか は…. When you ask for someone at another company, always say たなかさん.
      - **Messages**: でんごん を おねがいできます か · 〜から でんわ が あった と つたえて ください · また あと で おでんわ します.
      - **Line trouble**: すみません、 よく きこえません · もう すこし おおきい こえ で おねがいします.
      - **Numbers**: read digit by digit, with の for the hyphen, and repeat them back to check.
      - **Close**: **しつれいします** (polite), じゃ、 また / じゃ ね (friends). Wait for the other person to hang up first.
    items:
      - id: ja-talk-07-booking
        type: dialogue
        title: "Booking a table"
        scene: "You phone a restaurant to book a table for four on Saturday evening."
        you: A
        lines:
          - {who: B, l2: "はい、 レストラン さくら で ございます。", rom: "Hai, resutoran Sakura de gozaimasu.", l1: "Hello, Restaurant Sakura."}
          - {who: A, l2: "もしもし、 よやく を したい ん です が。", rom: "Moshimoshi, yoyaku o shitai n desu ga.", l1: "Hello, I'd like to make a reservation.", alt: ["もしもし、 よやく を おねがいします。", "Moshimoshi, yoyaku o onegaishimasu.", "もしもし、 よやく を したい です。", "Moshimoshi, yoyaku o shitai desu.", "Moshimoshi, yoyaku wo shitai n desu ga.", "Moshimoshi, yoyaku wo onegaishimasu.", "Moshimoshi, yoyaku wo shitai desu."]}
          - {who: B, l2: "ありがとう ございます。 いつ が よろしい でしょう か。", rom: "Arigatou gozaimasu. Itsu ga yoroshii deshou ka.", l1: "Thank you. When would you like?"}
          - {who: A, l2: "どようび の よる しちじ に、 よにん です。", rom: "Doyoubi no yoru shichiji ni, yonin desu.", l1: "Saturday at seven in the evening, for four.", alt: ["どようび の しちじ に、 よにん で おねがいします。", "Doyoubi no shichiji ni, yonin de onegaishimasu.", "どようび の よる しちじ、 よにん です。", "Doyoubi no yoru shichiji, yonin desu.", "Doyōbi no yoru shichiji ni, yonin desu.", "Doyōbi no shichiji ni, yonin de onegaishimasu.", "Doyōbi no yoru shichiji, yonin desu."]}
          - {who: B, l2: "どようび の しちじ、 よんめいさま です ね。 おなまえ を おねがいします。", rom: "Doyoubi no shichiji, yonmeisama desu ne. Onamae o onegaishimasu.", l1: "Saturday at seven for four. May I have your name?"}
          - {who: A, l2: "スミス です。", rom: "Sumisu desu.", l1: "It's Smith.", alt: ["スミス と もうします。", "Sumisu to moushimasu.", "Sumisu to mōshimasu."]}
          - {who: B, l2: "スミスさま。 おでんわばんごう は、 いま の ばんごう で よろしい です か。", rom: "Sumisu-sama. Odenwabangou wa, ima no bangou de yoroshii desu ka.", l1: "Mr. Smith. Is the number you're calling from the best one to reach you?"}
          - {who: A, l2: "はい、 だいじょうぶ です。", rom: "Hai, daijoubu desu.", l1: "Yes, that's fine.", alt: ["はい、 それ で おねがいします。", "Hai, sore de onegaishimasu.", "はい、 いい です。", "Hai, ii desu.", "Hai, daijōbu desu."]}
          - {who: B, l2: "かしこまりました。 では、 どようび に おまち して おります。", rom: "Kashikomarimashita. Dewa, doyoubi ni omachi shite orimasu.", l1: "Certainly. We look forward to seeing you on Saturday."}
          - {who: A, l2: "よろしく おねがいします。 しつれいします。", rom: "Yoroshiku onegaishimasu. Shitsurei shimasu.", l1: "Thank you. Goodbye.", alt: ["おねがいします。 しつれいします。", "Onegaishimasu. Shitsurei shimasu.", "ありがとう ございます。 しつれいします。", "Arigatou gozaimasu. Shitsurei shimasu.", "Arigatō gozaimasu. Shitsurei shimasu."]}
      - id: ja-talk-07-company
