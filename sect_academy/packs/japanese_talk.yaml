          - {who: B, l2: "ひがしぐち は どちら です か。", rom: "Higashiguchi wa dochira desu ka.", l1: "Which way is the east exit?", alt: ["ひがしぐち は どこ です か。", "Higashiguchi wa doko desu ka.", "Higashiguchi ha dochira desu ka.", "Higashiguchi ha doko desu ka."]}
          - {who: A, l2: "あそこ の かいだん を のぼって、 みぎ です。", rom: "Asoko no kaidan o nobotte, migi desu.", l1: "Up those stairs over there, then right."}
          - {who: B, l2: "かいだん を のぼって、 みぎ です ね。", rom: "Kaidan o nobotte, migi desu ne.", l1: "Up the stairs and right, OK.", alt: ["あの かいだん を のぼって、 みぎ です ね。", "Ano kaidan o nobotte, migi desu ne.", "Kaidan wo nobotte, migi desu ne.", "Ano kaidan wo nobotte, migi desu ne."]}
          - {who: A, l2: "ええ。 でる と、 すぐ まえ に あります よ。", rom: "Ee. Deru to, sugu mae ni arimasu yo.", l1: "Yes. As you come out, it's right in front of you."}
          - {who: B, l2: "わかりました。 どうも ありがとう ございました。", rom: "Wakarimashita. Doumo arigatou gozaimashita.", l1: "Got it. Thank you very much.", alt: ["わかりました。 ありがとう ございます。", "Wakarimashita. Arigatou gozaimasu.", "Wakarimashita. Dōmo arigatō gozaimashita.", "Wakarimashita. Arigatō gozaimasu."]}
