  # ───────────────────────────────────────────────────────────────── 3
  - id: ja-talk-03
    title: "Shopping"
    goal: "I can answer a cashier's questions, ask whether a shop has something, try things on, buy medicine, ask for gift wrapping and exchange a purchase."
    notes: |
      Shop staff ask the same few questions everywhere, and **はい、 おねがいします** or **いいえ、 だいじょうぶ です** answers almost all of them.

      | you hear | it means |
      |---|---|
      | ふくろ は ごりよう です か | Do you need a bag? |
      | あたためます か | Shall I heat it up? |
      | ポイントカード は おもち です か | Do you have a points card? |
      | レシート は おもち です か | Do you have the receipt? |

      - **Finding**: 〜は ありません か (don't you have …? — softer than あります か) · 〜は どこ です か.
      - **Choosing**: きて みて も いい です か · もう すこし おおきい の · これ に します.
      - **Walking away politely**: **ちょっと かんがえます** (I'll think about it).
      - **Gifts**: プレゼント です · べつべつ に つつんで ください (wrap them separately).
      - **Paying**: カード で / げんきん で / スマホ で. Put cash on the small tray, not in the cashier's hand.
      - **Exchanges**: [thing] を かいました が、 … — state the fact and let the が trail; the assistant will offer the solution.
    items:
      - id: ja-talk-03-konbini
        type: dialogue
        title: "At the convenience store"
        scene: "You are paying for a bento at a convenience store. The cashier asks a string of questions."
        you: B
