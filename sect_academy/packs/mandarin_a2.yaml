  # ───────────────────────────────────────────────────────────────── 5
  - id: zh2-05
    title: "Comparing: 比, 没有 … 那么, 跟 … 一样"
    goal: "I can compare two people or things and say which is the most."
    notes: |
      ## A 比 B + adjective
      | | | |
      |---|---|---|
      | 他比我高。 | Tā bǐ wǒ gāo. | He is taller than me. |
      | 今天比昨天冷一点儿。 | Jīntiān bǐ zuótiān lěng yìdiǎnr. | Today is a bit colder than yesterday. |
      | 地铁比出租车便宜得多。 | Dìtiě bǐ chūzūchē piányi de duō. | The subway is much cheaper than a taxi. |
      | 我姐姐比我大三岁。 | Wǒ jiějie bǐ wǒ dà sān suì. | My sister is three years older than me. |

      - **Never 很** in a 比 sentence: not 他比我很高. Use 更 (even more) instead, or put the amount *after* the adjective: 一点儿, 得多, 三岁.

      ## Not as … as: A 没有 B (那么) + adjective
      北京没有上海那么热。 Beijing isn't as hot as Shanghai. This is the usual negative. 不比 means "no more … than" and is used to contradict someone: 北京不比上海热 = Beijing is no hotter than Shanghai.

      ## The same: A 跟 B 一样 (+ adjective)
      我的手机跟你的一样。 This one is as expensive as that one: 这个跟那个一样贵。 Different: 不一样.

      ## The most: 最
      **最** + adjective: 最好, 最便宜. 最 also goes before verbs of liking: 我最喜欢春天.

      大 also means "old" in age comparisons: 他比我**大**, 我比他**小**.
