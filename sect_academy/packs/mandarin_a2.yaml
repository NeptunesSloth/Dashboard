      - {id: zh2-01-mingnian, type: vocab, l2: "明年", rom: "míngnián", l1: "next year", ex: "我明年去中国。", ex_rom: "Wǒ míngnián qù Zhōngguó.", ex_l1: "I'm going to China next year."}
      - {id: zh2-01-qiantian, type: vocab, l2: "前天", rom: "qiántiān", l1: "the day before yesterday", ex: "前天我没上班。", ex_rom: "Qiántiān wǒ méi shàngbān.", ex_l1: "I didn't go to work the day before yesterday."}
