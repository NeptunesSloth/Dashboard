  # ───────────────────────────────────────────────────────────────── 10
  - id: zh2-10
    title: "Which way? Direction complements"
    goal: "I can say which way people and things move, follow directions in the street and find a floor in a building."
    notes: |
      **来** means movement **towards the speaker**, **去** movement **away**. Put them after a verb of motion and they become a direction complement, said with a light tone:

      | | | | |
      |---|---|---|---|
      | 进来 jìnlai | come in | 出去 chūqu | go out |
      | 上来 shànglai | come up | 下去 xiàqu | go down |
      | 回来 huílai | come back | 过去 guòqu | go over |

      Upstairs calling down: 你上来吧！ Downstairs calling up: 你下来吧！

      ## Three-part directions
      Add a verb in front to say *how* you move: 走**进来** (walk in), 跑**出去** (run out), 拿**回来** (bring back).

      ## Where does the place go?
      A place word goes **before** 来 / 去: 回**家**去, 进**教室**来. Never 回去家.

      ## In the street
      - 往 + direction + **拐** = turn: 往左拐, 往右拐.
      - **路口** is a junction: 到第二个路口往右拐.
      - **对面** is opposite, across the road: 马路对面.
      - **附近** is nearby: 这儿附近有银行吗？

      ## In a building
      Floors are **楼** or **层**: 我家在五楼 / 五层. Take the 电梯 (lift). China counts the ground floor as 一楼.

      The four directions: 东 east, 南 south, 西 west, 北 north. 东西 ("east-west") is "a thing".
