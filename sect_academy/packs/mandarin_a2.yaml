  # ───────────────────────────────────────────────────────────────── 13
  - id: zh2-13
    title: "At work: can or can't — potential complements"
    goal: "I can say whether something can be done, heard, understood or finished, and talk about my working day."
    notes: |
      Put **得** or **不** between a verb and its result, and you say whether that result **can be reached**:

      | can | can't | |
      |---|---|---|
      | 看得懂 kàn de dǒng | 看不懂 kàn bu dǒng | can / can't understand (reading) |
      | 听得见 tīng de jiàn | 听不见 tīng bu jiàn | can / can't hear |
      | 做得完 zuò de wán | 做不完 zuò bu wán | can / can't finish |
      | 买得到 mǎi de dào | 买不到 mǎi bu dào | can / can't get (to buy) |
      | 来得及 lái de jí | 来不及 lái bu jí | there's time / no time |

      Both 得 and 不 are said lightly. You met one already: 我听不懂.

      ## Why not just 能?
      能 says whether you are *allowed or able in general*; the potential form says whether the *result* will happen. 我不能看 = I'm not allowed to look; 我看不懂 = I look but cannot understand. For "can't hear, can't understand, can't finish, can't buy", the potential form is what Chinese speakers say.

      ## Asking
      看得懂吗？ or 看得懂看不懂？

      ## Work words
      Your company is 公司, the boss 经理 or 老板, colleagues 同事. Meetings: 开会 (have a meeting). Working late: 加班. A business trip: 出差. To ask for time off: 请假.
    items:
      - {id: zh2-13-g-gong, type: glyph, l2: "公", rom: "gōng", l1: "public; company (first half of gōngsī)"}
      - {id: zh2-13-g-si, type: glyph, l2: "司", rom: "sī", l1: "to manage (second half of gōngsī)"}
