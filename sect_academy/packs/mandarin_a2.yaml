  # ───────────────────────────────────────────────────────────────── 8
  - id: zh2-08
    title: "Weather and seasons: 会 and 越来越"
    goal: "I can talk about the seasons, the temperature and the forecast, and say things are changing."
    notes: |
      ## The four seasons
      | | | | |
      |---|---|---|---|
      | 春天 chūntiān | 夏天 xiàtiān | 秋天 qiūtiān | 冬天 dōngtiān |
      | spring | summer | autumn | winter |

      ## Weather verbs
      As with 下雨, there is no "it": 下雪 (snow falls), 刮风 (wind blows). A sunny day is 晴天, an overcast one 阴天. Temperatures are counted in 度: 三十度, 零下五度 (minus five).

      ## 会: what is likely
      You know 会 as "can (a skill)". It also says what **will probably happen**: 明天**会**下雨 (it'll probably rain tomorrow); 他不会来 (he won't come). The weather forecast, 天气预报, is full of it.

      ## More and more: 越来越
      **越来越** + adjective = more and more …, usually with the "change" 了:
      - 天气越来越冷了。 It's getting colder and colder.
      - 他的汉语越来越好。 His Chinese keeps getting better.

      The longer pattern **越 A 越 B** means "the more A, the more B": 越吃越想吃 (the more you eat, the more you want).

      ## Taking things with you
      **带** (dài) is to bring or take along: 带伞 (take an umbrella). Do not confuse it with **戴** (also dài), to wear glasses or a hat.
    items:
      - {id: zh2-08-g-chun, type: glyph, l2: "春", rom: "chūn", l1: "spring (the character in chūntiān)", note: "The sun part 日 at the bottom."}
      - {id: zh2-08-g-xia, type: glyph, l2: "夏", rom: "xià", l1: "summer (the character in xiàtiān)", note: "Same sound as 下 (down)."}
      - {id: zh2-08-g-qiu, type: glyph, l2: "秋", rom: "qiū", l1: "autumn (the character in qiūtiān)", note: "Grain (禾) and fire (火): harvest and burning stubble."}
