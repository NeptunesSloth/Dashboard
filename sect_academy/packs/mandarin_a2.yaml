      - {id: zh2-01-zhoumo, type: vocab, l2: "周末", rom: "zhōumò", l1: "weekend", ex: "这个周末我不上班。", ex_rom: "Zhège zhōumò wǒ bú shàngbān.", ex_l1: "I'm not working this weekend."}
      - {id: zh2-01-zaofan, type: vocab, l2: "早饭", rom: "zǎofàn", l1: "breakfast", alt: ["早餐", "zǎocān"], ex: "我七点吃早饭。", ex_rom: "Wǒ qī diǎn chī zǎofàn.", ex_l1: "I have breakfast at seven."}
      - {id: zh2-01-wufan, type: vocab, l2: "午饭", rom: "wǔfàn", l1: "lunch", alt: ["午餐", "wǔcān"], ex: "我们十二点吃午饭。", ex_rom: "Wǒmen shí'èr diǎn chī wǔfàn.", ex_l1: "We have lunch at twelve."}
      - {id: zh2-01-xuelelangnian, type: phrase, l2: "我学了两年汉语。", rom: "Wǒ xué le liǎng nián Hànyǔ.", l1: "I studied Chinese for two years.", alt: ["我学汉语学了两年。", "我学了两年中文。"], note: "The length of time goes after the verb and before the object."}
      - {id: zh2-01-kuaibadian, type: phrase, l2: "快八点了。", rom: "Kuài bā diǎn le.", l1: "It's nearly eight o'clock.", alt: ["快到八点了。", "快要八点了。"]}
      - {id: zh2-01-buhele, type: phrase, l2: "我不喝咖啡了。", rom: "Wǒ bù hē kāfēi le.", l1: "I don't drink coffee any more.", note: "不 … 了 = no longer."}
      - {id: zh2-01-yaozoule, type: phrase, l2: "我要走了。", rom: "Wǒ yào zǒu le.", l1: "I'm off now (I'm about to leave).", alt: ["我得走了。", "我该走了。"]}
      - {id: zh2-01-c1, type: cloze, text: "我昨天睡___八个小时。", answer: "了", alt: ["le"], l1: "Yesterday I slept for eight hours.", note: "Verb + 了 + length of time."}
      - {id: zh2-01-c2, type: cloze, text: "___十二点了，我们吃午饭吧。", answer: "快", alt: ["kuài", "快要", "kuàiyào"], l1: "It's almost twelve; let's have lunch.", note: "快 … 了 = nearly, about to."}
