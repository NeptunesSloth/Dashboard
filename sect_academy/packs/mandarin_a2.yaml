  # ───────────────────────────────────────────────────────────────── 6
  - id: zh2-06
    title: "Measure words and the market"
    goal: "I can buy things by weight and by the piece, use the right measure word and pay in cash or by phone."
    notes: |
      Every noun has its measure word. A1 gave you 个, 杯, 碗, 瓶, 本 and 件; these are the next most useful.

      | measure | for | example |
      |---|---|---|
      | 张 zhāng | flat things: tickets, paper, tables, beds | 两张票 |
      | 条 tiáo | long, thin things: trousers, skirts, fish, roads | 一条裤子 |
      | 双 shuāng | pairs: shoes, socks, chopsticks | 一双鞋 |
      | 只 zhī | many animals; one of a pair | 一只猫 |
      | 种 zhǒng | kinds, types | 这种苹果 |
      | 斤 jīn | half a kilo (the market weight) | 两斤香蕉 |

      **些** means "some": 这些 (these), 那些 (those), 一些 (some, a few). It replaces the measure word and the number: 这些书.

      ## Prices by weight
      Markets price by the **斤** (500 g): 苹果多少钱一斤？ → 五块一斤. Supermarkets often use 公斤 (kilo).

      ## Paying
      - **一共** (altogether): 一共多少钱？
      - Most people pay by phone: **扫码** (scan the code). Cash is **现金**; by card, **刷卡**.
      - **找** is "to look for", and also "to give change": 找您五块 (here's five back).

      At a market, call the stallholder 老板 ("boss"): it is friendly, not cheeky.
    items:
      - {id: zh2-06-g-zhang, type: glyph, l2: "张", rom: "zhāng", l1: "measure word for flat things", note: "The bow part 弓 on the left. Also a common surname."}
      - {id: zh2-06-g-tiao, type: glyph, l2: "条", rom: "tiáo", l1: "measure word for long, thin things", note: "The wood part 木 at the bottom: a branch."}
      - {id: zh2-06-g-shuang, type: glyph, l2: "双", rom: "shuāng", l1: "pair (measure word)", note: "Two hands (又) side by side."}
      - {id: zh2-06-g-jin, type: glyph, l2: "斤", rom: "jīn", l1: "jin (half a kilo, the market weight)"}
      - {id: zh2-06-g-mai, type: glyph, l2: "卖", rom: "mài", l1: "to sell", note: "买 (to buy, mǎi) with 十 on top. Fourth tone."}
      - {id: zh2-06-g-gong, type: glyph, l2: "共", rom: "gòng", l1: "together, in all (as in yígòng)"}
      - {id: zh2-06-g-zhao, type: glyph, l2: "找", rom: "zhǎo", l1: "to look for; to give change", note: "The hand part 扌 on the left."}
      - {id: zh2-06-g-xie, type: glyph, l2: "些", rom: "xiē", l1: "some (in zhèxiē, nàxiē, yìxiē)"}
      - {id: zh2-06-yigong, type: vocab, l2: "一共", rom: "yígòng", l1: "altogether, in total", ex: "一共三十块。", ex_rom: "Yígòng sānshí kuài.", ex_l1: "That's thirty yuan altogether."}
