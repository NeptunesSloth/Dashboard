          - {who: A, l2: "我给你检查一下。你感冒了。", rom: "Wǒ gěi nǐ jiǎnchá yíxià. Nǐ gǎnmào le.", l1: "Let me examine you. You've got a cold."}
          - {who: B, l2: "我要吃药吗？", rom: "Wǒ yào chī yào ma?", l1: "Do I need to take medicine?", alt: ["我得吃药吗？", "要吃药吗？", "我需要吃药吗？"]}
          - {who: A, l2: "要。这种药一天吃三次。你应该多喝水，多休息。", rom: "Yào. Zhè zhǒng yào yì tiān chī sān cì. Nǐ yīnggāi duō hē shuǐ, duō xiūxi.", l1: "Yes. Take this medicine three times a day. You should drink plenty of water and rest."}
          - {who: B, l2: "好的，谢谢医生！", rom: "Hǎo de, xièxie yīshēng!", l1: "OK, thank you, doctor!", alt: ["好，谢谢医生！", "好的，谢谢大夫！", "谢谢医生！", "谢谢大夫！"]}

  # ───────────────────────────────────────────────────────────────── 12
  - id: zh2-12
    title: "School and study: result complements"
    goal: "I can say whether I finished, understood, found or got something right, and talk about classes and exams."
    notes: |
      English often has one verb for an action and its result ("I found it", "I understood"). Chinese says the **action** and then the **result**:

      | action + result | | meaning |
      |---|---|---|
      | 看 + 完 | 看完 | finish reading / watching |
      | 听 + 懂 | 听懂 | understand (by listening) |
      | 学 + 会 | 学会 | learn (until you can do it) |
      | 找 + 到 | 找到 | find (look for and reach) |
      | 看 + 见 | 看见 | see, catch sight of |
      | 写 + 错 | 写错 | write wrongly |
      | 做 + 好 | 做好 | do properly, get ready |

      - 了 usually follows: 我做完作业了。 我听懂了。
      - The negative is **没** + verb + result, without 了: 我**没听懂**. 我**没找到**我的词典.
      - 看 is just looking; **看见** is actually seeing. 找 is looking for; **找到** is finding.

      ## At school
      **上课** is "class begins / have class"; 下课 is "class is over". Homework is 作业; to revise is 复习. Your classmates are 同学. 题 is a question in an exercise or exam: 第三题 = question three.
