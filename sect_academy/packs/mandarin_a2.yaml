      - {id: zh2-11-jiancha, type: vocab, l2: "检查", rom: "jiǎnchá", l1: "to examine, to check; an examination", ex: "医生给我检查了一下。", ex_rom: "Yīshēng gěi wǒ jiǎnchá le yíxià.", ex_l1: "The doctor gave me a quick examination."}
      - {id: zh2-11-bushufu, type: phrase, l2: "我不舒服。", rom: "Wǒ bù shūfu.", l1: "I don't feel well.", alt: ["我有点儿不舒服。", "我身体不舒服。", "我有点不舒服。"]}
