  # ───────────────────────────────────────────────────────────────── 4
  - id: zh2-04
    title: "Clothes, colours and 着"
    goal: "I can describe what people are wearing and say that something is on, off, open or shut."
    notes: |
      **着** (*zhe*, neutral) after a verb says a **state is lasting**: the action happened and its result is still there.

      | | | |
      |---|---|---|
      | 灯开着。 | Dēng kāi zhe. | The light is on. |
      | 她穿着一件红毛衣。 | Tā chuān zhe yí jiàn hóng máoyī. | She is wearing a red sweater. |
      | 他戴着眼镜。 | Tā dài zhe yǎnjìng. | He is wearing glasses. |

      - Compare 在: 她**在**穿衣服 is "she is getting dressed"; 她**穿着**红衣服 is "she has red clothes on".
      - Posture verbs take 着 too: 坐着, 站着 (sitting, standing). Then a second verb says what you do that way: 我们**坐着**聊天 (we sat and chatted).
      - The negative is 没 + verb + 着: 灯没开着.

      ## Wearing: 穿 or 戴
      **穿** is for clothes and shoes you put your body into. **戴** is for things you put on: glasses, hats, watches, gloves.

      ## Colours
      A colour is the character + **色** (colour): 红色, 白色. Before a noun the bare character is usual: 红毛衣, 白衣服; or 红色的毛衣.

      | | | | |
      |---|---|---|---|
      | 红 hóng red | 白 bái white | 黑 hēi black | 蓝 lán blue |
      | 绿 lǜ green | 黄 huáng yellow | | |
    items:
      - {id: zh2-04-g-zhe, type: glyph, l2: "着", rom: "zhe", l1: "particle: a lasting state (verb + zhe)", note: "Neutral tone. In zháojí (worried) the same character is read zháo."}
      - {id: zh2-04-g-chuan, type: glyph, l2: "穿", rom: "chuān", l1: "to wear (clothes, shoes); to put on", note: "The hole part 穴 on top: putting your arm through a hole."}
