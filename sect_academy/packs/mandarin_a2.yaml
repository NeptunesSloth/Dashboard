      - {id: zh2-01-g-yi, type: glyph, l2: "以", rom: "yǐ", l1: "first half of yǐqián and yǐhòu (before, after)", note: "Third tone, the same sound as 已 in yǐjīng."}
      - {id: zh2-01-g-xian, type: glyph, l2: "先", rom: "xiān", l1: "first, before (doing something else)"}
      - {id: zh2-01-g-ran, type: glyph, l2: "然", rom: "rán", l1: "so, like that (first half of ránhòu)", note: "The fire part 灬 underneath."}
      - {id: zh2-01-g-kuai, type: glyph, l2: "快", rom: "kuài", l1: "fast; soon", note: "The heart part 忄 on the left. Same sound as 块 (yuan)."}
      - {id: zh2-01-shijian, type: vocab, l2: "时间", rom: "shíjiān", l1: "time (an amount of it)", ex: "我今天没有时间。", ex_rom: "Wǒ jīntiān méiyǒu shíjiān.", ex_l1: "I have no time today."}
