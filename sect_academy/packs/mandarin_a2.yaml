  # ───────────────────────────────────────────────────────────────── 9
  - id: zh2-09
    title: "Getting around: 离, 从 … 到 and 是 … 的"
    goal: "I can say how far places are, how long a journey takes, and how and when I travelled."
    notes: |
      ## How far: 离
      **A 离 B + 远 / 近**: 我家离学校很近 (my home is close to the school). Ask with 远吗？ or 有多远？

      ## From … to …: 从 … 到 …
      从北京到上海 = from Beijing to Shanghai. Add how long it takes with **要** or **坐 … 要**: 从这儿到机场要一个小时.

      ## How did you come? 是 … 的
      When an action has **already happened** and you want to talk about *how, when, where* or *with whom*, wrap that detail in **是 … 的**:

      | | |
      |---|---|
      | 你**是**怎么来**的**？ | How did you get here? |
      | 我**是**坐高铁来**的**。 | I came by high-speed train. |
      | 他**是**昨天到**的**。 | He arrived yesterday. |

      - 是 can drop out in the positive (我坐高铁来的), never 的.
      - Negative: 我**不是**坐飞机来**的**.
      - Use 了 for news ("he has arrived"), 是 … 的 for details about it ("he arrived yesterday").

      ## Verbs for vehicles
      **坐** anything you ride in as a passenger; **骑** (qí) things you sit astride: 骑自行车; **开** to drive: 开车. **打车** is to take a taxi. Vehicles are counted with **辆** (liàng).
