  # ───────────────────────────────────────────────────────────────── 3
  - id: zh2-03
    title: "Right now: 在 and 正在"
    goal: "I can say what people are doing at the moment and ask what someone is doing."
    notes: |
      To say an action is **in progress**, put **在** or **正在** before the verb. 呢 at the end adds "right now":

      | | | |
      |---|---|---|
      | 我在看电视。 | Wǒ zài kàn diànshì. | I'm watching TV. |
      | 妈妈正在做饭呢。 | Māma zhèngzài zuò fàn ne. | Mum is cooking right now. |
      | 你在做什么？ | Nǐ zài zuò shénme? | What are you doing? |

      - 正在 stresses "at this very moment". 呢 alone also works: 他睡觉呢.
      - The negative is **没(在)** + verb: 我没在看电视，我在看书。
      - Only actions can be in progress: never 在是, 在有, 在喜欢, 在知道.

      ## Three jobs for 在
      | | |
      |---|---|
      | 他**在**家。 | is at (a verb) |
      | 他**在**家看书。 | at, in (before a verb) |
      | 他**在**看书。 | is …ing |

      ## Doing things with someone
      **跟** + person (+ 一起) + verb = do it with them: 我跟朋友一起玩游戏。 和 works the same way.

      **玩** (wán) is to play, have fun, hang out. Beijingers say 玩儿 (wánr).
