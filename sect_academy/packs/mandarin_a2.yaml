  # ───────────────────────────────────────────────────────────────── 11
  - id: zh2-11
    title: "Health: 应该, 得 and 不用"
    goal: "I can say what is wrong with me, understand a doctor's advice and give advice myself."
    notes: |
      ## Saying what hurts
      Body part + **疼**: 我头疼 (my head hurts), 我肚子疼, 我嗓子疼 (sore throat). For illnesses, use the "new situation" 了: 我感冒了 (I've caught a cold), 我发烧了.

      The doctor will ask **你哪儿不舒服？** (what's wrong? literally "where aren't you comfortable?").

      ## Should, must, needn't
      | | | |
      |---|---|---|
      | 应该 yīnggāi | should (advice) | 你应该多休息。 |
      | 得 děi | have to (spoken) | 我得去医院。 |
      | 要 yào | need to, must | 你要按时吃药。 |
      | 不用 bú yòng | needn't | 你不用吃药。 |

      - The negative of 得 and 要 is **不用** (no need), never 不得. 不要 means "don't!".
      - **得** here is read *děi*. You will meet the same character as *de* in unit 14.

      ## More and less
      **多** + verb = do more of it: 多喝水, 多休息. **少** + verb = do less: 少吃糖.

      ## Seeing a doctor
      看病 or 看医生 is to see a doctor; the doctor 给你检查 (examines you). Medicine is *eaten*: **吃药**. 一天三次 = three times a day.
    items:
