  # ───────────────────────────────────────────────────────────────── 16
  - id: zh2-16
    title: "Mishaps: the 被 passive"
    goal: "I can say that something was stolen, lost, broken or eaten, report it and react to bad news."
    notes: |
      **被** marks the **receiver** of an action as the subject. It is used mostly for things that went **wrong**:

      **receiver + 被 + (doer) + verb + what happened**

      | | | |
      |---|---|---|
      | 我的钱包被偷了。 | Wǒ de qiánbāo bèi tōu le. | My wallet has been stolen. |
      | 蛋糕被弟弟吃了。 | Dàngāo bèi dìdi chī le. | The cake was eaten by my brother. |
      | 他被老师批评了。 | Tā bèi lǎoshī pīpíng le. | He got told off by the teacher. |

      - The doer can be left out: 被偷了.
      - Like 把, the verb needs something after it: 了, a result (撞坏, 拿走) or a place.
      - Negative: 没被: 我的车没被撞坏.
      - In speech 让 and 叫 do the same job, but then the doer must be named: 杯子叫猫打破了.

      ## Breaking things
      Result complements again: 摔坏 (drop and break), 撞坏 (crash into and break), 弄脏 (get dirty), 拿走 (take away).

      ## Reacting
      | | |
      |---|---|
      | 怎么办？ | What shall I do? |
      | 别着急。 | Don't panic. |
      | 别担心。 | Don't worry. |
      | 真倒霉！ | What bad luck! |
      | 小心！ | Careful! |

      In 着急 the character 着 is read **zháo**, not *zhe*.
