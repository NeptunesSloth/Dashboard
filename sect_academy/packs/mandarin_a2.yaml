  # ───────────────────────────────────────────────────────────────── 17
  - id: zh2-17
    title: "Because and although: 因为 … 所以, 虽然 … 但是"
    goal: "I can give reasons, make contrasts and talk about how people feel and what they are like."
    notes: |
      Chinese links clauses in **pairs**. Where English uses one word, Chinese often uses both halves.

      ## Because … so …
      **因为** A，**所以** B. 因为下雨，所以我没去。 Either half can be dropped in speech (下雨了，所以我没去), but both together is normal and correct.

      ## Although … but …
      **虽然** A，**但是** B. 虽然汉语很难，但是很有意思。 In English "although … but" is wrong; in Chinese, 虽然 without 但是 (or 可是, 不过) usually sounds unfinished. 可是 and 不过 are softer alternatives to 但是.

      | | | |
      |---|---|---|
      | 但是 dànshì | but | the standard word |
      | 可是 kěshì | but | a little more spoken |
      | 不过 búguò | however, though | the gentlest |
      | 而且 érqiě | and also, what's more | adds a point |

      ## Where they go
      虽然 and 因为 may come **before or after the subject**: 虽然**他**很忙 / **他**虽然很忙. 所以 and 但是 always start their clause.

      ## Feelings and character
      对 + something + 感兴趣 = to be interested in it: 我对中国电影很感兴趣. 对 … 满意 = satisfied with. 开心 is cheerful, 紧张 nervous, 失望 disappointed, 累 tired.
    items:
      - {id: zh2-17-g-yin, type: glyph, l2: "因", rom: "yīn", l1: "cause, reason (first half of yīnwèi)", note: "A person (大) inside a box."}
      - {id: zh2-17-g-wei, type: glyph, l2: "为", rom: "wèi", l1: "for (second half of yīnwèi and first half of wèi shénme)", note: "Also read wéi, 'to be, to act as'."}
      - {id: zh2-17-g-suo, type: glyph, l2: "所", rom: "suǒ", l1: "place; first half of suǒyǐ (so)"}
      - {id: zh2-17-g-sui, type: glyph, l2: "虽", rom: "suī", l1: "although (first half of suīrán)", note: "The mouth part 口 over 虫 (insect)."}
      - {id: zh2-17-g-dan, type: glyph, l2: "但", rom: "dàn", l1: "but (first half of dànshì)", note: "The person part 亻 and 旦 (dawn)."}
      - {id: zh2-17-g-zhen, type: glyph, l2: "真", rom: "zhēn", l1: "real, true; really"}
      - {id: zh2-17-g-jue, type: glyph, l2: "觉", rom: "jué", l1: "to feel (as in juéde)", note: "In shuìjiào (sleep) it is read jiào."}
      - {id: zh2-17-suoyi, type: vocab, l2: "所以", rom: "suǒyǐ", l1: "so, therefore", ex: "我很累，所以想回家。", ex_rom: "Wǒ hěn lèi, suǒyǐ xiǎng huí jiā.", ex_l1: "I'm tired, so I want to go home."}
      - {id: zh2-17-suiran, type: vocab, l2: "虽然", rom: "suīrán", l1: "although", ex: "虽然很贵，但是很好吃。", ex_rom: "Suīrán hěn guì, dànshì hěn hǎochī.", ex_l1: "It's expensive, but it's delicious."}
      - {id: zh2-17-danshi, type: vocab, l2: "但是", rom: "dànshì", l1: "but", ex: "我想去，但是没有时间。", ex_rom: "Wǒ xiǎng qù, dànshì méiyǒu shíjiān.", ex_l1: "I'd like to go, but I don't have time."}
      - {id: zh2-17-keshi, type: vocab, l2: "可是", rom: "kěshì", l1: "but (spoken)", ex: "我很饿，可是不想做饭。", ex_rom: "Wǒ hěn è, kěshì bù xiǎng zuò fàn.", ex_l1: "I'm hungry, but I don't feel like cooking."}
      - {id: zh2-17-buguo, type: vocab, l2: "不过", rom: "búguò", l1: "however, though", ex: "这件衣服很好看，不过有点儿贵。", ex_rom: "Zhè jiàn yīfu hěn hǎokàn, búguò yǒudiǎnr guì.", ex_l1: "This looks nice, though it's a bit expensive."}
      - {id: zh2-17-erqie, type: vocab, l2: "而且", rom: "érqiě", l1: "and also, what's more", ex: "这个餐厅很便宜，而且很好吃。", ex_rom: "Zhège cāntīng hěn piányi, érqiě hěn hǎochī.", ex_l1: "This restaurant is cheap, and the food is good too."}
