          - {who: B, l2: "每天学一个小时。", rom: "Měi tiān xué yí ge xiǎoshí.", l1: "An hour a day.", alt: ["我每天学一个小时。", "一个小时。", "每天一个小时。"]}
          - {who: A, l2: "你今天学了吗？", rom: "Nǐ jīntiān xué le ma?", l1: "Have you studied today?"}
          - {who: B, l2: "还没有。我先吃午饭，然后学。", rom: "Hái méiyǒu. Wǒ xiān chī wǔfàn, ránhòu xué.", l1: "Not yet. First I'll have lunch, then study.", alt: ["还没。我先吃午饭，然后学。", "还没有。我先吃午饭，然后再学。", "还没有。我先吃午饭，再学。"]}
