  # ───────────────────────────────────────────────────────────────── 7
  - id: zh2-07
    title: "At the restaurant: tastes, 有点儿 and 别"
    goal: "I can order for a group, say how food tastes, ask for less spice and take leftovers away."
    notes: |
      ## 有点儿 or 一点儿?
      Both mean "a little", but they sit on opposite sides of the adjective and mean different things.

      | | | |
      |---|---|---|
      | **有点儿** + adjective | a bit too … (a complaint) | 这个菜有点儿咸。 This dish is a bit salty. |
      | adjective + **一点儿** | a bit more … (a comparison or request) | 便宜一点儿吧。 Make it a bit cheaper. |

      So 有点儿贵 grumbles about the price; 便宜一点儿 asks for a better one.

      ## Don't: 别 and 不要
      **别** + verb (or **不要** + verb) tells someone not to do something: 别放辣椒 (no chilli, please), 别喝了 (stop drinking). Add 太: 别太辣 (not too spicy).

      ## Another one: 再
      **再** + verb = again, one more: 再来一瓶啤酒 (another bottle of beer), 再要一碗米饭.

      ## In the restaurant
      - Staff greet you with 几位？ **位** is the polite measure word for people.
      - **点菜** is ordering dishes. Dishes are shared, so order one per person plus rice.
      - **吃饱了** = I'm full. **打包** = box up the leftovers; nobody minds.
      - Vegetarian: 我吃素 (I eat vegetarian). Even then, ask: 这个菜有肉吗？

      Four tastes: 甜 sweet, 酸 sour, 咸 salty, 辣 spicy.
