      - {id: zh2-06-laoban, type: vocab, l2: "老板", rom: "lǎobǎn", l1: "boss; shop owner, stallholder", ex: "老板，这个多少钱？", ex_rom: "Lǎobǎn, zhège duōshao qián?", ex_l1: "Excuse me (to the stallholder), how much is this?"}
