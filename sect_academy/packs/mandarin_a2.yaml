      - {id: zh2-11-shufu, type: vocab, l2: "舒服", rom: "shūfu", l1: "comfortable; well", ex: "这个沙发很舒服。", ex_rom: "Zhège shāfā hěn shūfu.", ex_l1: "This sofa is very comfortable.", note: "不舒服 = unwell, uncomfortable."}
      - {id: zh2-11-yinggai, type: vocab, l2: "应该", rom: "yīnggāi", l1: "should, ought to", ex: "你应该去看医生。", ex_rom: "Nǐ yīnggāi qù kàn yīshēng.", ex_l1: "You should see a doctor."}
