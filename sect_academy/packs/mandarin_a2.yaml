  # ───────────────────────────────────────────────────────────────── 18
  - id: zh2-18
    title: "Plans and invitations: 如果 … 就, 一 … 就"
    goal: "I can make plans, invite someone, accept or decline, and say what will happen if or as soon as something happens."
    notes: |
      ## If … then …
      **如果** A，**就** B. 如果明天下雨，我们就不去了。

      - **就** goes **after the subject** of the second clause and before its verb: 我们**就**不去了, never 就我们不去了.
      - **…的话** at the end of the first clause also means "if", and is very common in speech: 下雨的话，我们就不去了. You may use both: 如果下雨的话.

      ## As soon as …
      **一** A **就** B: the second thing follows straight after the first.
      - 我一到家就给你打电话。 I'll phone you as soon as I get home.
      - 他一下课就回家了。 He went home as soon as class ended.

      The 一 changes tone as usual: *yí dào*, *yì tīng*.

      ## Inviting and planning
      | | |
      |---|---|
      | 你周末有空吗？ | Are you free at the weekend? |
      | 你打算做什么？ | What are you planning to do? |
      | 我想请你吃饭。 | I'd like to take you out for a meal. |
      | 一定来！ | Do come! |
      | 不见不散！ | See you there! |

      请 here means "invite, treat": 我请你 = it's on me. To accept: 好啊！ or 没问题！ To decline politely, give a reason and suggest another time: 对不起，我那天有事，下次吧。
    items:
