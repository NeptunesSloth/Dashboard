id: mandarin-a2
title: "Mandarin Chinese — A2 Elementary"
kind: language
language: Mandarin
lang: zh-CN
track: mandarin
level: A2
hall: tongues_west
blurb: "After A1: 了, 过, 着 and 把, comparisons, result and direction complements, 得, 被 and the linking words, with 130 new characters and 300 words for shopping, travel, health, school, work and plans."

# Continues mandarin_a1.yaml. Pinyin follows the A1 course: tone marks, words
# grouped as in standard pinyin, the changed tones of 一 and 不 written (yí ge,
# bú shì), third-tone sandhi not written (nǐ hǎo). An alternative written in
# characters lists its own pinyin in alt too.
units:
  # ───────────────────────────────────────────────────────────────── 1
  - id: zh2-01
    title: "了 again: how long, what next, what has changed"
    goal: "I can say how long something lasted, what I did first and next, and what has changed."
    notes: |
      In A1 you met **了** for a finished action. A2 adds three more jobs.

      ## How long: verb + 了 + length of time
      A length of time comes **after** the verb, unlike a clock time, which comes before it:

      | | | |
      |---|---|---|
      | 我睡了八个小时。 | Wǒ shuì le bā ge xiǎoshí. | I slept for eight hours. |
      | 我学了两年汉语。 | Wǒ xué le liǎng nián Hànyǔ. | I studied Chinese for two years. |

      Add a second 了 at the end and it is still going on: 我学了两年汉语**了** = I have been learning for two years (and still am).

      ## Change: 了 at the end
      Sentence-final 了 says "now it is so": 我二十岁**了**, 现在十点**了**. With 不 it means "no longer": 我**不**喝咖啡**了**.

      ## About to happen
      **快…了** and **要…了** say something is about to happen: 快八点了 (it's nearly eight), 我要走了 (I'm off now).

      ## First, then
      **先** … **然后** …: 我先吃饭，然后看电影。 You can also say 先 … 再 ….

      **点** is a clock time (三点); **小时** is a length of time, counted with 个 (三个小时).
    items:
      - {id: zh2-01-g-shi, type: glyph, l2: "时", rom: "shí", l1: "time; hour (the character in shíjiān)", note: "The sun part 日 on the left: time is measured by the sun."}
      - {id: zh2-01-g-jian, type: glyph, l2: "间", rom: "jiān", l1: "between; room (second half of shíjiān)", note: "The sun (日) seen through a door (门)."}
