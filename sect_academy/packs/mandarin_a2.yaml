  # ───────────────────────────────────────────────────────────────── 2
  - id: zh2-02
    title: "Experiences and travel: 过"
    goal: "I can say where I have been and what I have done, and how many times."
    notes: |
      **过** (said lightly, *guo*) after a verb means "have done it at some time": it is about **experience**, not one particular occasion.

      | | | |
      |---|---|---|
      | 我去过长城。 | Wǒ qù guo Chángchéng. | I have been to the Great Wall. |
      | 你吃过饺子吗？ | Nǐ chī guo jiǎozi ma? | Have you ever eaten dumplings? |
      | 我没去过上海。 | Wǒ méi qù guo Shànghǎi. | I have never been to Shanghai. |

      - The negative is **没 + verb + 过**, and here 过 **stays**, unlike 了.
      - **从来没 … 过** = never (ever): 我从来没坐过飞机。 **还没 … 过** = not yet.

      ## 了 or 过?
      我去**了**北京 tells what happened on one trip (maybe I'm still there). 我去**过**北京 says I have had the experience and am back.

      ## How many times
      **次** counts times, and the number goes after the verb: 我去过**两次**. With a place it can go either side: 我去过两次上海 / 我去过上海两次. With a person, the person comes first: 我见过他两次.

      **第** makes order numbers: 第一次 (the first time), 第二天 (the next day). Here 一 keeps its first tone: dì-yī.
    items:
      - {id: zh2-02-g-guo, type: glyph, l2: "过", rom: "guò", l1: "to pass, to cross; after a verb: have done (said guo)", note: "The walking part 辶 at the bottom left, as in 这 and 还."}
