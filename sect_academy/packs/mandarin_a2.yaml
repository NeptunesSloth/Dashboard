  # ───────────────────────────────────────────────────────────────── 14
  - id: zh2-14
    title: "Hobbies and sport: how well — 得"
    goal: "I can talk about my hobbies and say how well, how fast or how much someone does something."
    notes: |
      To say **how** someone does something, put **得** (*de*) after the verb and a description after that:

      | | | |
      |---|---|---|
      | 他跑得很快。 | Tā pǎo de hěn kuài. | He runs fast. |
      | 你说得很好！ | Nǐ shuō de hěn hǎo! | You speak very well! |
      | 我唱得不好。 | Wǒ chàng de bù hǎo. | I don't sing well. |

      - The negative goes **after** 得: 跑得不快, never 不跑得快.
      - Ask with 怎么样 or the yes-no form: 他唱得怎么样？ 他跑得快不快？

      ## With an object
      得 cannot follow the object directly. Either **repeat the verb**, or put the object first:

      - 他**说**汉语**说**得很好。
      - 他汉语说得很好。

      ## Hobbies
      **爱好** is a hobby. Ball games are 打 (hit) or 踢 (kick): 打篮球, 踢足球. Music is 弹 (pluck) for the piano and guitar: 弹钢琴.

      ## Three characters read de
      | | |
      |---|---|
      | 的 | before a noun: 我的书 |
      | 得 | after a verb: 跑得快 |
      | 地 | before a verb: 慢慢地走 (walk slowly) |

      They sound the same; only the writing differs.
