      - {id: zh2-02-xingli, type: vocab, l2: "行李", rom: "xíngli", l1: "luggage", ex: "我的行李很多。", ex_rom: "Wǒ de xíngli hěn duō.", ex_l1: "I have a lot of luggage.", note: "A suitcase is 行李箱 (xínglixiāng)."}
      - {id: zh2-02-jiudian, type: vocab, l2: "酒店", rom: "jiǔdiàn", l1: "hotel", alt: ["宾馆", "bīnguǎn", "饭店", "fàndiàn"], ex: "我们住在机场旁边的酒店。", ex_rom: "Wǒmen zhù zài jīchǎng pángbiān de jiǔdiàn.", ex_l1: "We're staying at a hotel next to the airport.", note: "Literally 'wine shop', but it means a hotel. 饭店 is also a hotel in names."}
      - {id: zh2-02-youming, type: vocab, l2: "有名", rom: "yǒumíng", l1: "famous", ex: "长城非常有名。", ex_rom: "Chángchéng fēicháng yǒumíng.", ex_l1: "The Great Wall is extremely famous."}
      - {id: zh2-02-diyici, type: vocab, l2: "第一次", rom: "dì-yī cì", l1: "the first time", ex: "这是我第一次坐飞机。", ex_rom: "Zhè shì wǒ dì-yī cì zuò fēijī.", ex_l1: "This is my first time on a plane.", note: "第 + number = an order number. 一 keeps its first tone here."}
      - {id: zh2-02-quguozhongguo, type: phrase, l2: "你去过中国吗？", rom: "Nǐ qù guo Zhōngguó ma?", l1: "Have you ever been to China?", alt: ["你去过中国没有？", "您去过中国吗？"]}
