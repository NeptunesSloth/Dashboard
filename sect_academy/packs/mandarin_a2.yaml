      - {id: zh2-02-c1, type: cloze, text: "我去___长城，长城很漂亮。", answer: "过", alt: ["guo", "guò"], l1: "I've been to the Great Wall; it's beautiful.", note: "Verb + 过 = have had the experience."}
      - {id: zh2-02-c2, type: cloze, text: "我___去过上海。", answer: "没", alt: ["méi", "没有", "méiyǒu", "从来没", "cónglái méi", "从来没有", "cónglái méiyǒu"], l1: "I have never been to Shanghai.", note: "没 + verb + 过: here 过 stays."}
