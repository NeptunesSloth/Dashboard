  # ───────────────────────────────────────────────────────────────── 15
  - id: zh2-15
    title: "Tidying up: 把 sentences"
    goal: "I can say what someone does to a particular thing: put it somewhere, move it, clean it or get rid of it."
    notes: |
      **把** brings the object **in front of** the verb, so the sentence can end with what happens to it:

      **subject + 把 + object + verb + what happens**

      | | | |
      |---|---|---|
      | 请把门关上。 | Qǐng bǎ mén guānshang. | Please shut the door. |
      | 我把书放在桌子上了。 | Wǒ bǎ shū fàng zài zhuōzi shang le. | I put the book on the table. |
      | 他把垃圾扔了。 | Tā bǎ lājī rēng le. | He threw the rubbish away. |

      ## The rules
      - The object is **specific**: *the* door, *my* keys, not "a door".
      - The verb **cannot stand alone**: it needs a place (放在…), a result (擦干净, 做完), a direction (拿出来) or at least 了.
      - **Negatives and modals go before 把**: 别把手机放在地上, 我没把作业做完, 你能把箱子拿下来吗？

      ## When to use it
      Use 把 when you **move, change or deal with** a particular thing, especially with 放在 (put in / on) and instructions. Verbs like 喜欢, 知道, 是, 有 never take 把.

      ## Inside and on
      A place after 在 often ends in 上 (on) or 里 (in), said lightly: 桌子上 (on the table), 柜子里 (in the cupboard), 地上 (on the floor).
    items:
