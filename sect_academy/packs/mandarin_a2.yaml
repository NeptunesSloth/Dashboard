      - {id: zh2-01-gangcai, type: vocab, l2: "刚才", rom: "gāngcái", l1: "just now (a moment ago)", ex: "刚才王老师来了。", ex_rom: "Gāngcái Wáng lǎoshī lái le.", ex_l1: "Teacher Wang came by just now."}
