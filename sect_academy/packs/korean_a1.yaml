  # ───────────────────────────────────────────────────────────────── 6
  - id: ko1-06
    title: "Greetings and politeness"
    goal: "I can greet people, thank them, apologise and say goodbye in the right polite style."
    notes: |
      Korean marks politeness at the **end of the sentence**. A beginner needs two polite styles.

      | style | ending | used |
      |---|---|---|
      | **해요** style | -요 | everyday polite speech: shops, colleagues, strangers, anyone you are not close to |
      | **합니다** style | -ㅂ니다 / -습니다, questions in -ㅂ니까? | formal: announcements, the news, presentations, the army, first meetings in business |

      This course uses the 해요 style. A few set phrases are almost always said in the formal style even in a relaxed conversation: **감사합니다**, **죄송합니다**, **반갑습니다**. Mixing them with 해요 sentences is completely normal.

      ## Sound
      Remember ㅂ + ㄴ → "mn": 감사합니다 is *gamsahamnida*, never "hab-ni-da".

      ## Two goodbyes
      Both start with 안녕히 ("in peace").

      - **안녕히 가세요** ("go in peace") to the person who is **leaving**.
      - **안녕히 계세요** ("stay in peace") to the person who is **staying**, when you leave.

      If you both leave, you both say 안녕히 가세요.

      ## Names
      Korean avoids the word "you". Use the person's name + **씨** (민수 씨), or a title such as 선생님.
    items:
      - {id: ko1-06-nyeong, type: glyph, l2: "녕", rom: "nyeong", l1: "ㄴ + ㅕ + ㅇ, as in 안녕 (peace, well-being)"}
      - {id: ko1-06-hap, type: glyph, l2: "합", rom: "hap", l1: "as in 합니다: alone 'hap', but 'ham' before ㄴ"}
      - {id: ko1-06-annyeonghaseyo, type: phrase, l2: "안녕하세요?", rom: "annyeonghaseyo", l1: "Hello. (polite, any time of day)", note: "Literally 'Are you at peace?'. The answer is the same phrase."}
      - {id: ko1-06-annyeonghasimnikka, type: phrase, l2: "안녕하십니까?", rom: "annyeonghasimnikka", alt: ["annyeonghasibnikka"], l1: "Hello. (formal style: news, announcements, business)", note: "You will hear this more than you say it. ㅂ + ㄴ is said mn."}
      - {id: ko1-06-gaseyo, type: phrase, l2: "안녕히 가세요.", rom: "annyeonghi gaseyo", l1: "Goodbye. (to someone who is leaving)", note: "가세요 = please go."}
      - {id: ko1-06-gyeseyo, type: phrase, l2: "안녕히 계세요.", rom: "annyeonghi gyeseyo", l1: "Goodbye. (to someone who is staying, when you leave)", note: "계세요 = please stay."}
      - {id: ko1-06-gamsahamnida, type: phrase, l2: "감사합니다.", rom: "gamsahamnida", alt: ["gamsahabnida", "고맙습니다.", "gomapseumnida", "gomabseubnida"], l1: "Thank you. (formal style, the everyday default)", note: "고맙습니다 means the same and is just as polite."}
      - {id: ko1-06-gomawoyo, type: phrase, l2: "고마워요.", rom: "gomawoyo", l1: "Thanks. (해요 style, to someone you know)", note: "Softer and friendlier than 감사합니다; not for customers or elders."}
      - {id: ko1-06-joesonghamnida, type: phrase, l2: "죄송합니다.", rom: "joesonghamnida", alt: ["joesonghabnida"], l1: "I'm sorry. (formal style)", note: "The safe apology with strangers and elders."}
      - {id: ko1-06-gwaenchanayo, type: phrase, l2: "괜찮아요.", rom: "gwaenchanayo", alt: ["gwaenchanhayo"], l1: "It's okay. / I'm fine.", note: "The ㅎ in 찮 is silent before a vowel and the ㄴ moves over: gwaen-cha-na-yo."}
      - {id: ko1-06-anieyo, type: phrase, l2: "아니에요.", rom: "anieyo", l1: "Not at all. (reply to thanks)", note: "Literally 'it is not'. The usual modest answer to 감사합니다."}
      - {id: ko1-06-bangapseumnida, type: phrase, l2: "만나서 반갑습니다.", rom: "mannaseo bangapseumnida", alt: ["반갑습니다.", "bangapseumnida", "mannaseo bangabseubnida"], l1: "Nice to meet you. (formal style)", note: "Literally 'having met you, I am glad'."}
      - {id: ko1-06-jeogiyo, type: phrase, l2: "저기요!", rom: "jeogiyo", l1: "Excuse me! (to call a waiter or get a stranger's attention)"}
      - {id: ko1-06-ttomannayo, type: phrase, l2: "또 만나요.", rom: "tto mannayo", l1: "See you again.", note: "또 = again, 만나요 = (we) meet."}
      - {id: ko1-06-ssi, type: vocab, l2: "씨", rom: "ssi", l1: "Mr. / Ms. (polite, after a given name or full name)", ex: "민수 씨, 안녕하세요?", ex_rom: "minsu ssi, annyeonghaseyo?", ex_l1: "Hello, Minsu.", note: "Never use it for yourself, and not for teachers or bosses: use their title."}
      - {id: ko1-06-c1, type: cloze, text: "안녕히 ___.", answer: "계세요", alt: ["gyeseyo"], l1: "Goodbye. (you are leaving; the other person stays)", note: "The one who stays is told 계세요, 'please stay'."}
      - {id: ko1-06-c2, type: cloze, text: "감사___.", answer: "합니다", alt: ["hamnida", "habnida"], l1: "Thank you. (formal style)", note: "감사 (thanks) + 합니다 (do, formal). Said 'hamnida'."}
      - {id: ko1-06-c3, type: cloze, text: "민수 ___, 안녕하세요?", answer: "씨", alt: ["ssi"], l1: "Hello, Minsu. (polite)", note: "Name + 씨 replaces 'you'."}
      - id: ko1-06-d1
        type: dialogue
        title: "A small collision"
        scene: "Someone bumps into you in a café, apologises and introduces himself. He leaves first."
        you: B
        lines:
          - {who: A, l2: "어, 죄송합니다!", rom: "eo, joesonghamnida!", l1: "Oh, I'm sorry!"}
          - {who: B, l2: "괜찮아요.", rom: "gwaenchanayo.", l1: "It's okay.", alt: ["아니에요, 괜찮아요.", "네, 괜찮아요."]}
          - {who: A, l2: "안녕하세요? 저는 민수예요.", rom: "annyeonghaseyo? jeoneun minsuyeyo.", l1: "Hello. I'm Minsu."}
          - {who: B, l2: "안녕하세요? 만나서 반갑습니다.", rom: "annyeonghaseyo? mannaseo bangapseumnida.", l1: "Hello. Nice to meet you.", alt: ["안녕하세요? 반갑습니다.", "안녕하세요? 만나서 반가워요."]}
          - {who: A, l2: "네, 반갑습니다. 그럼 안녕히 계세요.", rom: "ne, bangapseumnida. geureom annyeonghi gyeseyo.", l1: "Nice to meet you too. Well then, goodbye."}
          - {who: B, l2: "안녕히 가세요. 또 만나요.", rom: "annyeonghi gaseyo. tto mannayo.", l1: "Goodbye. See you again.", alt: ["네, 안녕히 가세요. 또 만나요.", "안녕히 가세요."]}

  # ───────────────────────────────────────────────────────────────── 7
  - id: ko1-07
    title: "Who I am: 이에요/예요 and the topic particle 은/는"
    goal: "I can say my name, nationality and job, ask others the same, and say what I am not."
    notes: |
      A Korean sentence ends with its verb, and small **particles** stuck to the end of nouns show each noun's job. There are no articles, and verbs do not change for I / you / she.

      ## "A is B"
      | the noun ends in | add | example |
      |---|---|---|
      | a consonant | **이에요** | 학생**이에요** (I am a student) |
      | a vowel | **예요** | 의사**예요** (I am a doctor) |

      The same sentence with a rising voice is a question: 학생이에요? The formal-style equivalents are 입니다 (imnida) and 입니까?

      ## The topic particle
      **은** after a consonant, **는** after a vowel, marks what the sentence is about: 저**는** 학생이에요, "as for me, (I) am a student". Once the topic is clear, drop it: Koreans do not repeat 저는 in every sentence.

      ## "A is not B"
      Noun + **이** (after a consonant) / **가** (after a vowel) + **아니에요**: 학생**이 아니에요**, 의사**가 아니에요**.

      ## Nationality and "my"
      Country + 사람: 한국 사람, 미국 사람. "My" in polite speech is **제**: 제 이름, 제 친구.

      Liaison keeps working across a particle: 이름이 is *ireumi*, 사람이에요 is *saramieyo*.
    items:
      - {id: ko1-07-ram, type: glyph, l2: "람", rom: "ram", l1: "ㄹ + ㅏ + ㅁ, as in 사람 (person)"}
      - {id: ko1-07-saeng, type: glyph, l2: "생", rom: "saeng", l1: "ㅅ + ㅐ + ㅇ, as in 학생, 선생님"}
      - {id: ko1-07-miguk, type: vocab, l2: "미국", rom: "miguk", l1: "the USA", ex: "저는 미국 사람이에요.", ex_rom: "jeoneun miguk saramieyo.", ex_l1: "I am American."}
      - {id: ko1-07-hanguksaram, type: vocab, l2: "한국 사람", rom: "hanguk saram", l1: "a Korean (person)", alt: ["한국인", "hangugin"], ex: "선생님은 한국 사람이에요.", ex_rom: "seonsaengnimeun hanguk saramieyo.", ex_l1: "The teacher is Korean."}
      - {id: ko1-07-hoesawon, type: vocab, l2: "회사원", rom: "hoesawon", l1: "office worker / company employee", ex: "제 친구는 회사원이에요.", ex_rom: "je chinguneun hoesawonieyo.", ex_l1: "My friend is an office worker."}
      - {id: ko1-07-daehaksaeng, type: vocab, l2: "대학생", rom: "daehaksaeng", l1: "university student", ex: "저는 대학생이에요.", ex_rom: "jeoneun daehaksaengieyo.", ex_l1: "I am a university student."}
      - {id: ko1-07-je, type: vocab, l2: "제", rom: "je", l1: "my (polite)", ex: "제 친구예요.", ex_rom: "je chinguyeyo.", ex_l1: "This is my friend.", note: "Short for 저의."}
      - {id: ko1-07-haksaengieyo, type: phrase, l2: "저는 학생이에요.", rom: "jeoneun haksaengieyo", l1: "I am a student.", alt: ["학생이에요."], note: "학생 ends in a consonant, so 이에요."}
      - {id: ko1-07-ireumi, type: phrase, l2: "이름이 뭐예요?", rom: "ireumi mwoyeyo", l1: "What is your name?", alt: ["이름이 무엇이에요?", "이름은 뭐예요?"], note: "Literally 'name is what?'. No word for 'your' is needed."}
      - {id: ko1-07-jeireumeun, type: phrase, l2: "제 이름은 사라예요.", rom: "je ireumeun sarayeyo", l1: "My name is Sara.", alt: ["저는 사라예요.", "jeoneun sarayeyo"], note: "사라 ends in a vowel, so 예요."}
      - {id: ko1-07-eoneunara, type: phrase, l2: "어느 나라 사람이에요?", rom: "eoneu nara saramieyo", l1: "Which country are you from?", note: "Literally 'which-country person are (you)?'. 어느 = which."}
      - {id: ko1-07-uisagaanieyo, type: phrase, l2: "저는 의사가 아니에요.", rom: "jeoneun uisaga anieyo", l1: "I am not a doctor.", alt: ["의사가 아니에요.", "저는 의사 아니에요."], note: "의사 ends in a vowel, so 가 before 아니에요."}
      - {id: ko1-07-c1, type: cloze, text: "저___ 회사원이에요.", answer: "는", alt: ["neun"], l1: "I am an office worker.", note: "Topic particle after a vowel (저): 는."}
      - {id: ko1-07-c2, type: cloze, text: "선생님___ 한국 사람이에요.", answer: "은", alt: ["eun"], l1: "The teacher is Korean. (topic particle)", note: "Topic particle after a consonant (님): 은."}
      - {id: ko1-07-c3, type: cloze, text: "제 친구는 의사___.", answer: "예요", alt: ["yeyo"], l1: "My friend is a doctor.", note: "After a vowel (사): 예요."}
      - {id: ko1-07-c4, type: cloze, text: "저는 대학생___.", answer: "이에요", alt: ["ieyo"], l1: "I am a university student.", note: "After a consonant (생): 이에요."}
      - {id: ko1-07-c5, type: cloze, text: "저는 학생___ 아니에요.", answer: "이", alt: ["i"], l1: "I am not a student.", note: "After a consonant: 이 아니에요. After a vowel it would be 가."}
      - id: ko1-07-d1
        type: dialogue
        title: "At a language exchange"
        scene: "You are Sara, an American office worker. A Korean student starts talking to you."
        you: B
        lines:
          - {who: A, l2: "안녕하세요? 이름이 뭐예요?", rom: "annyeonghaseyo? ireumi mwoyeyo?", l1: "Hello. What is your name?"}
          - {who: B, l2: "제 이름은 사라예요.", rom: "je ireumeun sarayeyo.", l1: "My name is Sara.", alt: ["저는 사라예요.", "사라예요."]}
          - {who: A, l2: "사라 씨는 어느 나라 사람이에요?", rom: "sara ssineun eoneu nara saramieyo?", l1: "Which country are you from, Sara?"}
          - {who: B, l2: "저는 미국 사람이에요.", rom: "jeoneun miguk saramieyo.", l1: "I am American.", alt: ["미국 사람이에요."]}
          - {who: A, l2: "학생이에요?", rom: "haksaengieyo?", l1: "Are you a student?"}
          - {who: B, l2: "아니요, 회사원이에요.", rom: "aniyo, hoesawonieyo.", l1: "No, I'm an office worker.", alt: ["아니요, 저는 회사원이에요.", "아니요, 학생이 아니에요. 회사원이에요."]}
          - {who: A, l2: "아, 그래요? 저는 대학생이에요.", rom: "a, geuraeyo? jeoneun daehaksaengieyo.", l1: "Oh, really? I am a university student."}
          - {who: B, l2: "만나서 반갑습니다.", rom: "mannaseo bangapseumnida.", l1: "Nice to meet you.", alt: ["반갑습니다.", "만나서 반가워요."]}

  # ───────────────────────────────────────────────────────────────── 8
  - id: ko1-08
    title: "What there is: 이/가, 있어요 and 없어요"
    goal: "I can point at things, say what there is and is not, what I have, and where something is."
    notes: |
      Two verbs do a great deal of work.

      - **있어요** (isseoyo): there is / it exists / (I) have
      - **없어요** (eopseoyo): there isn't / (I) don't have

      The thing that exists takes the **subject particle**: **이** after a consonant, **가** after a vowel.

      | | | |
      |---|---|---|
      | 시간**이** 있어요. | "time exists" | I have time. |
      | 친구**가** 없어요. | "a friend does not exist" | I have no friends. |

      ## Where it is
      Place + **에** + 있어요: 책이 가방**에** 있어요, "the book is in the bag". 어디에 있어요? = where is it?

      ## This and that
      Korean has three distances, not two.

      | near me | near you | far from both |
      |---|---|---|
      | 이거 this | 그거 that | 저거 that over there |
      | 여기 here | 거기 there | 저기 over there |

      이거, 그거, 저거 are the spoken forms of 이것, 그것, 저것 (것 = thing).

      ## 은/는 or 이/가?
      Use **이/가** when you bring something new into the conversation or answer "what?" / "who?". Use **은/는** for what is already being talked about, or to contrast: 가방**은** 있어요 = "a bag, I do have (but…)".

      Sound: in 있어요 and 없어요 the ㅅ slides over to the next block: i-sseo-yo, eop-seo-yo.
    items:
      - {id: ko1-08-it, type: glyph, l2: "있", rom: "it", l1: "as in 있어요 (isseoyo): alone, the final ㅆ is said t"}
      - {id: ko1-08-eop, type: glyph, l2: "없", rom: "eop", l1: "as in 없어요 (eopseoyo): alone, only ㅂ is said"}
      - {id: ko1-08-geot, type: glyph, l2: "것", rom: "geot", l1: "thing, as in 이것"}
      - {id: ko1-08-igeo, type: vocab, l2: "이거", rom: "igeo", l1: "this (thing near me; spoken form)", alt: ["이것", "igeot"]}
      - {id: ko1-08-geugeo, type: vocab, l2: "그거", rom: "geugeo", l1: "that (thing near you; spoken form)", alt: ["그것", "geugeot"]}
      - {id: ko1-08-jeogeo, type: vocab, l2: "저거", rom: "jeogeo", l1: "that over there (thing far from us both; spoken form)", alt: ["저것", "jeogeot"]}
      - {id: ko1-08-gabang, type: vocab, l2: "가방", rom: "gabang", l1: "bag", ex: "가방이 있어요.", ex_rom: "gabangi isseoyo.", ex_l1: "I have a bag."}
      - {id: ko1-08-hyudaepon, type: vocab, l2: "휴대폰", rom: "hyudaepon", l1: "mobile phone", alt: ["핸드폰", "haendeupon"], ex: "휴대폰이 없어요.", ex_rom: "hyudaeponi eopseoyo.", ex_l1: "I don't have my phone."}
      - {id: ko1-08-don, type: vocab, l2: "돈", rom: "don", l1: "money", ex: "돈이 있어요?", ex_rom: "doni isseoyo?", ex_l1: "Do you have money?"}
      - {id: ko1-08-sigan, type: vocab, l2: "시간", rom: "sigan", l1: "time", ex: "시간이 없어요.", ex_rom: "sigani eopseoyo.", ex_l1: "I have no time."}
      - {id: ko1-08-hwajangsil, type: vocab, l2: "화장실", rom: "hwajangsil", l1: "toilet / restroom", ex: "화장실이 여기에 있어요.", ex_rom: "hwajangsiri yeogie isseoyo.", ex_l1: "The toilet is here."}
      - {id: ko1-08-isseoyo, type: vocab, l2: "있어요", rom: "isseoyo", l1: "there is / (I) have", ex: "물이 있어요.", ex_rom: "muri isseoyo.", ex_l1: "There is water."}
      - {id: ko1-08-eopseoyo, type: vocab, l2: "없어요", rom: "eopseoyo", alt: ["eobseoyo"], l1: "there isn't / (I) don't have", ex: "우유가 없어요.", ex_rom: "uyuga eopseoyo.", ex_l1: "There is no milk."}
      - {id: ko1-08-igeomwoyeyo, type: phrase, l2: "이거 뭐예요?", rom: "igeo mwoyeyo", l1: "What is this?", alt: ["이게 뭐예요?", "ige mwoyeyo", "이것은 뭐예요?", "이거는 뭐예요?"]}
      - {id: ko1-08-hwajangsileodi, type: phrase, l2: "화장실이 어디에 있어요?", rom: "hwajangsiri eodie isseoyo", l1: "Where is the toilet?", alt: ["화장실이 어디예요?", "화장실 어디예요?", "화장실이 어디 있어요?", "화장실 어디에 있어요?", "hwajangsiri eodiyeyo"], note: "The final ㄹ of 실 moves over and becomes r: hwa-jang-si-ri."}
      - {id: ko1-08-c1, type: cloze, text: "시간___ 있어요.", answer: "이", alt: ["i"], l1: "I have time. (subject particle)", note: "Subject particle after a consonant (간): 이."}
      - {id: ko1-08-c2, type: cloze, text: "친구___ 없어요.", answer: "가", alt: ["ga"], l1: "I have no friends. (subject particle)", note: "Subject particle after a vowel (구): 가."}
      - {id: ko1-08-c3, type: cloze, text: "책이 가방___ 있어요.", answer: "에", alt: ["e"], l1: "The book is in the bag.", note: "Place + 에 + 있어요 says where something is."}
      - {id: ko1-08-c4, type: cloze, text: "돈이 ___.", answer: "없어요", alt: ["eopseoyo", "eobseoyo"], l1: "I have no money.", note: "없어요 is the opposite of 있어요."}
      - id: ko1-08-d1
        type: dialogue
