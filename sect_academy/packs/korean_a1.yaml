  # ───────────────────────────────────────────────────────────────── 4
  - id: ko1-04
    title: "Hangul 4: compound vowels"
    goal: "I can read the eleven compound vowels and words that contain them."
    notes: |
      The remaining vowels are made by **joining two vowels you already know** into one.

      | built from | letter | sound |
      |---|---|---|
      | ㅏ + ㅣ | ㅐ | ae |
      | ㅓ + ㅣ | ㅔ | e |
      | ㅑ + ㅣ | ㅒ | yae |
      | ㅕ + ㅣ | ㅖ | ye |
      | ㅗ + ㅏ | ㅘ | wa |
      | ㅗ + ㅐ | ㅙ | wae |
      | ㅗ + ㅣ | ㅚ | oe |
      | ㅜ + ㅓ | ㅝ | wo |
      | ㅜ + ㅔ | ㅞ | we |
      | ㅜ + ㅣ | ㅟ | wi |
      | ㅡ + ㅣ | ㅢ | ui |

      ## What you actually hear
      - **ㅐ** and **ㅔ** sound the same in modern Seoul speech, like the e in "bed". Only the spelling tells them apart, so 개 (dog) and 게 (crab) must be learned by eye.
      - **ㅙ**, **ㅚ** and **ㅞ** all sound like "we" in "wet".
      - **ㅢ** is "ui" at the start of a word (의사). Elsewhere it is usually said "i". The romanisation always writes *ui*.

      ## In a block
      A compound vowel with a flat part and a tall part wraps round the consonant: the flat part goes underneath, the tall part to the right. ㄱ + ㅘ = **과** (gwa), ㅎ + ㅚ = **회** (hoe).
    items:
