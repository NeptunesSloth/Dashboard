        scene: "You are at a street market and want a bag, but the first price is high."
        you: B
        lines:
          - {who: A, l2: "어서 오세요.", rom: "eoseo oseyo.", l1: "Welcome."}
          - {who: B, l2: "이 가방 얼마예요?", rom: "i gabang eolmayeyo?", l1: "How much is this bag?", alt: ["이 가방은 얼마예요?", "이 가방이 얼마예요?"]}
          - {who: A, l2: "오만 원이에요.", rom: "oman wonieyo.", l1: "It's 50,000 won."}
          - {who: B, l2: "너무 비싸요. 좀 깎아 주세요.", rom: "neomu bissayo. jom kkakka juseyo.", l1: "That's too expensive. Please give me a little discount.", alt: ["너무 비싸요. 깎아 주세요.", "너무 비싸요. 조금 깎아 주세요."]}
          - {who: A, l2: "그럼 사만 오천 원 주세요.", rom: "geureom saman ocheon won juseyo.", l1: "Then give me 45,000 won."}
          - {who: B, l2: "좋아요. 이거 주세요.", rom: "joayo. igeo juseyo.", l1: "Okay. I'll take this one, please.", alt: ["네, 좋아요. 이거 주세요.", "좋아요. 이걸 주세요."]}
          - {who: A, l2: "네, 감사합니다. 또 오세요!", rom: "ne, gamsahamnida. tto oseyo!", l1: "Thank you. Come again!"}

  # ───────────────────────────────────────────────────────────────── 16
  - id: ko1-16
    title: "Places and directions"
    goal: "I can ask where a place is, understand simple directions and say where things are in relation to each other."
    notes: |
      ## Asking where
      (place)**이/가 어디예요?** or **어디에 있어요?** both mean "where is …?". To ask whether there is one nearby: 이 근처에 은행이 있어요?

      Stop a stranger with **실례합니다** ("excuse me", formal) or 저기요.

      ## Position words
      Position words are nouns. They follow the reference point and take 에:

      | | |
      |---|---|
      | 역 **앞에** | in front of the station |
      | 은행 **옆에** | next to the bank |
      | 병원 **뒤에** | behind the hospital |
      | 가방 **안에** | inside the bag |
      | 의자 **위에** | on the chair |

      ## Directions
      - **으로** (after a consonant) / **로** (after a vowel or ㄹ) = "towards": 왼쪽**으로**, 오른쪽**으로**.
      - **가세요** = "please go". The ending (으)세요 is a polite instruction; you met it in 안녕히 가세요.
      - 똑바로 가세요 = go straight on.

      ## From … to
      **에서** also means "from", and **까지** means "as far as / until": 집**에서** 학교**까지** = from home to school. 여기에서 멀어요? = is it far from here?

      ## Sound
      왼쪽으로 is *oenjjogeuro* and 앞에 is *ape*: the final consonant moves over as always. 편의점 is written *pyeonuijeom* but usually said "pyeo-ni-jeom".
    items:
      - {id: ko1-16-jjok, type: glyph, l2: "쪽", rom: "jjok", l1: "side / direction, as in 왼쪽 and 오른쪽"}
      - {id: ko1-16-yeok, type: vocab, l2: "역", rom: "yeok", l1: "station (train or underground)", ex: "역에 가요.", ex_rom: "yeoge gayo.", ex_l1: "I am going to the station."}
      - {id: ko1-16-byeongwon, type: vocab, l2: "병원", rom: "byeongwon", l1: "hospital / doctor's clinic", ex: "병원이 어디에 있어요?", ex_rom: "byeongwoni eodie isseoyo?", ex_l1: "Where is the hospital?"}
      - {id: ko1-16-eunhaeng, type: vocab, l2: "은행", rom: "eunhaeng", l1: "bank", ex: "은행에 가요.", ex_rom: "eunhaenge gayo.", ex_l1: "I am going to the bank."}
      - {id: ko1-16-pyeonuijeom, type: vocab, l2: "편의점", rom: "pyeonuijeom", alt: ["pyeonijeom"], l1: "convenience store", ex: "편의점에서 물을 사요.", ex_rom: "pyeonuijeomeseo mureul sayo.", ex_l1: "I buy water at the convenience store."}
      - {id: ko1-16-oenjjok, type: vocab, l2: "왼쪽", rom: "oenjjok", l1: "left (side)", ex: "화장실은 왼쪽에 있어요.", ex_rom: "hwajangsireun oenjjoge isseoyo.", ex_l1: "The toilet is on the left."}
      - {id: ko1-16-oreunjjok, type: vocab, l2: "오른쪽", rom: "oreunjjok", l1: "right (side)", ex: "은행은 오른쪽에 있어요.", ex_rom: "eunhaengeun oreunjjoge isseoyo.", ex_l1: "The bank is on the right."}
      - {id: ko1-16-ap, type: vocab, l2: "앞", rom: "ap", l1: "front / in front of", ex: "학교 앞에 있어요.", ex_rom: "hakgyo ape isseoyo.", ex_l1: "It is in front of the school."}
