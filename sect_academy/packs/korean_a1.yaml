  # ───────────────────────────────────────────────────────────────── 17
  - id: ko1-17
    title: "Yesterday: the past tense and question words"
    goal: "I can say what I did, ask others what they did, and use the main question words."
    notes: |
      ## The past: 았어요 / 었어요
      The rule mirrors the present: stems whose last vowel is ㅏ or ㅗ take **았어요**, the others take **었어요**, and 하다 gives **했어요**.

      A shortcut that always works: take the 해요 form, remove 요, add **ㅆ어요**.

      | present | past | |
      |---|---|---|
      | 가요 | 갔어요 | went |
      | 와요 | 왔어요 | came |
      | 봐요 | 봤어요 | saw |
      | 먹어요 | 먹었어요 | ate |
      | 마셔요 | 마셨어요 | drank |
      | 해요 | 했어요 | did |
      | 있어요 | 있었어요 | there was / had |

      The ㅆ slides into 어: *ga-sseo-yo*, *meo-geo-sseo-yo*. For "was": 이었어요 after a consonant, 였어요 after a vowel. Negatives work as before: 안 갔어요, 못 갔어요.

      ## Question words
      누구 who · 뭐 what · 어디 where · 언제 when · 왜 why · 어떻게 how · 몇 how many · 얼마 how much

      A question word sits exactly where the answer will go; the word order does not change: 어제 **뭐** 했어요? → 어제 **영화를** 봤어요.

      As a subject, 누구 + 가 shrinks to **누가**: 누가 왔어요?

      ## Past time words
      어제 (yesterday) takes no 에; 지난주에 (last week) and 주말에 do.
