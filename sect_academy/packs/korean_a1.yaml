      - {id: ko1-18-halgeoyeyo, type: vocab, l2: "할 거예요", rom: "hal geoyeyo", l1: "am going to do / will do", ex: "주말에 뭐 할 거예요?", ex_rom: "jumare mwo hal geoyeyo?", ex_l1: "What are you going to do at the weekend?"}
      - {id: ko1-18-meogeulgeoyeyo, type: vocab, l2: "먹을 거예요", rom: "meogeul geoyeyo", l1: "am going to eat / will eat", ex: "저녁에 비빔밥을 먹을 거예요.", ex_rom: "jeonyeoge bibimbabeul meogeul geoyeyo.", ex_l1: "I am going to eat bibimbap this evening.", note: "먹다: the stem ends in a consonant, so 을."}
      - {id: ko1-18-gagosipeoyo, type: vocab, l2: "가고 싶어요", rom: "gago sipeoyo", l1: "(I) want to go", ex: "바다에 가고 싶어요.", ex_rom: "badae gago sipeoyo.", ex_l1: "I want to go to the sea."}
