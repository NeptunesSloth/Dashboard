      - {id: ko1-18-jalmotaeyo, type: phrase, l2: "한국어를 잘 못해요.", rom: "hangugeoreul jal motaeyo", l1: "I can't speak Korean well.", alt: ["한국어 잘 못해요.", "한국말을 잘 못해요.", "한국어를 잘 못 해요.", "hangugeoreul jal moshaeyo", "hangugeoreul jal mothaeyo"]}
      - {id: ko1-18-yeongeo, type: phrase, l2: "영어 할 수 있어요?", rom: "yeongeo hal su isseoyo", l1: "Can you speak English?", alt: ["영어를 할 수 있어요?", "영어 하세요?", "영어 할 수 있으세요?", "영어 할 줄 알아요?"], note: "영어 = English. 할 수 있어요 = can do."}
      - {id: ko1-18-dowajuseyo, type: phrase, l2: "도와주세요!", rom: "dowajuseyo", l1: "Help me, please!", alt: ["도와 주세요!", "좀 도와주세요!"]}
      - {id: ko1-18-c1, type: cloze, text: "내일 친구를 만날 ___.", answer: "거예요", alt: ["geoyeyo"], l1: "I am going to meet a friend tomorrow.", note: "만나다 → 만날 거예요."}
      - {id: ko1-18-c2, type: cloze, text: "한국에 가고 ___.", answer: "싶어요", alt: ["sipeoyo"], l1: "I want to go to Korea.", note: "Stem + 고 싶어요 = want to."}
      - {id: ko1-18-c3, type: cloze, text: "저녁에 집에서 먹___ 거예요.", answer: "을", alt: ["eul"], l1: "I am going to eat at home this evening.", note: "After a consonant stem: 을 거예요."}
      - {id: ko1-18-c4, type: cloze, text: "저는 김치를 ___ 먹어요. 너무 매워요.", answer: "못", alt: ["mot"], l1: "I can't eat kimchi. It's too spicy.", note: "못 = can't, placed directly before the verb."}
      - id: ko1-18-d1
        type: dialogue
        title: "Weekend plans, slowly"
        scene: "A Korean acquaintance speaks a little too fast for you. Ask for a repeat, then answer."
        you: B
        lines:
