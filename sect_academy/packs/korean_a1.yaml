      - {id: ko1-16-c2, type: cloze, text: "오른쪽___ 가세요.", answer: "으로", alt: ["euro"], l1: "Go to the right.", note: "Direction particle after a consonant: 으로."}
      - {id: ko1-16-c3, type: cloze, text: "집에서 학교___ 멀어요.", answer: "까지", alt: ["kkaji"], l1: "It is far from home to school.", note: "에서 … 까지 = from … to."}
      - id: ko1-16-d1
        type: dialogue
        title: "Looking for a bank"
        scene: "You need a bank and stop a passer-by in the street."
        you: A
        lines:
          - {who: A, l2: "실례합니다. 이 근처에 은행이 있어요?", rom: "sillyehamnida. i geuncheoe eunhaengi isseoyo?", l1: "Excuse me. Is there a bank near here?", alt: ["실례합니다. 근처에 은행이 있어요?", "실례합니다. 이 근처에 은행 있어요?", "저기요. 이 근처에 은행이 있어요?"]}
          - {who: B, l2: "네, 있어요. 똑바로 가세요. 그리고 편의점 앞에서 왼쪽으로 가세요.", rom: "ne, isseoyo. ttokbaro gaseyo. geurigo pyeonuijeom apeseo oenjjogeuro gaseyo.", l1: "Yes, there is. Go straight on. Then go left in front of the convenience store."}
          - {who: A, l2: "여기에서 멀어요?", rom: "yeogieseo meoreoyo?", l1: "Is it far from here?", alt: ["여기서 멀어요?", "멀어요?"]}
          - {who: B, l2: "아니요, 가까워요. 걸어서 오 분이에요.", rom: "aniyo, gakkawoyo. georeoseo o bunieyo.", l1: "No, it's close. It's five minutes on foot."}
          - {who: A, l2: "감사합니다.", rom: "gamsahamnida.", l1: "Thank you.", alt: ["고맙습니다.", "네, 감사합니다."]}
