  # ───────────────────────────────────────────────────────────────── 2
  - id: ko1-02
    title: "Hangul 2: the rest of the basic consonants"
    goal: "I can read the consonants ㄷ ㄹ ㅂ ㅅ ㅈ ㅎ and short words written with the basic letters."
    notes: |
      Six more consonants complete the basic set. They slot into blocks exactly as before: consonant first, vowel to the right or underneath.

      | letter | at the start of a syllable | things to know |
      |---|---|---|
      | ㄷ | d | at the start of a word it is close to t |
      | ㄹ | r | a quick tap of the tongue, like the tt in American "butter" |
      | ㅂ | b | at the start of a word it is close to p |
      | ㅅ | s | "sh" before ㅣ and the y-vowels: 시 is said "shi" |
      | ㅈ | j | at the start of a word it is close to ch |
      | ㅎ | h | a light h |

      ## Soft consonants
      ㄱ ㄷ ㅂ ㅈ are not as strong as English g, d, b, j. Between vowels they are clearly voiced (바**다** = ba**d**a); at the very start of a word they have a little of k, t, p, ch in them. The romanisation writes g, d, b, j in both places.

      ## Borrowed words
      A Korean syllable cannot begin with two consonants, and a final s is not heard as s (unit 5), so loanwords get the neutral vowel ㅡ added to keep the sound: *bus* becomes 버스 (beo-seu), *juice* becomes 주스 (ju-seu).

      Each consonant also has a value at the **end** of a block. That value is noted on the cards and explained in unit 5.
    items:
      - {id: ko1-02-d, type: glyph, l2: "ㄷ", rom: "d", l1: "a soft d, close to t at the start of a word; as a final: t"}
      - {id: ko1-02-r, type: glyph, l2: "ㄹ", rom: "r", alt: ["l"], l1: "a tapped r at the start of a syllable; as a final: l"}
      - {id: ko1-02-b, type: glyph, l2: "ㅂ", rom: "b", l1: "a soft b, close to p at the start of a word; as a final: p"}
      - {id: ko1-02-s, type: glyph, l2: "ㅅ", rom: "s", l1: "s ('sh' before ㅣ and y-vowels); as a final: t"}
      - {id: ko1-02-j, type: glyph, l2: "ㅈ", rom: "j", l1: "a soft j, close to ch at the start of a word; as a final: t"}
      - {id: ko1-02-h, type: glyph, l2: "ㅎ", rom: "h", l1: "a light h; as a final it is not heard as h (see unit 5)"}
      - {id: ko1-02-da, type: glyph, l2: "다", rom: "da", l1: "ㄷ + ㅏ"}
