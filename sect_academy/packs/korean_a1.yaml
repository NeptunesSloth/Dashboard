      - {id: ko1-03-kk, type: glyph, l2: "ㄲ", rom: "kk", l1: "tense ㄱ, no air; as a final: k"}
      - {id: ko1-03-tt, type: glyph, l2: "ㄸ", rom: "tt", l1: "tense ㄷ, no air; never a final"}
      - {id: ko1-03-pp, type: glyph, l2: "ㅃ", rom: "pp", l1: "tense ㅂ, no air; never a final"}
