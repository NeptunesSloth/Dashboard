          - {who: A, l2: "내일 시간이 있어요?", rom: "naeil sigani isseoyo?", l1: "Do you have time tomorrow?"}
          - {who: B, l2: "네, 있어요.", rom: "ne, isseoyo.", l1: "Yes, I do.", alt: ["네, 시간이 있어요.", "네, 시간 있어요."]}
          - {who: A, l2: "그럼 내일 오후에 만나요. 세 시 어때요?", rom: "geureom naeil ohue mannayo. se si eottaeyo?", l1: "Then let's meet tomorrow afternoon. How about three o'clock?"}
          - {who: B, l2: "좋아요. 세 시에 만나요.", rom: "joayo. se sie mannayo.", l1: "Sounds good. Let's meet at three.", alt: ["좋아요. 3시에 만나요.", "네, 좋아요. 세 시에 만나요."]}
          - {who: A, l2: "네, 내일 만나요!", rom: "ne, naeil mannayo!", l1: "Okay, see you tomorrow!"}
