  # ───────────────────────────────────────────────────────────────── 18
  - id: ko1-18
    title: "Plans, wishes and survival phrases"
    goal: "I can say what I am going to do and what I want to do, and cope when I do not understand."
    notes: |
      ## Going to: (으)ㄹ 거예요
      | the stem ends in | add | example |
      |---|---|---|
      | a consonant | **을 거예요** | 먹다 → 먹을 거예요 |
      | a vowel | **ㄹ 거예요** (ㄹ goes under the stem) | 가다 → 갈 거예요, 하다 → 할 거예요 |

      It states a plan or intention: 내일 서울에 갈 거예요, "I am going to go to Seoul tomorrow".

      ## Want to: 고 싶어요
      Add **고 싶어요** to any stem, with no changes at all: 가**고 싶어요**, 먹**고 싶어요**, 배우**고 싶어요**. It is used for your own wishes and for asking the other person: 뭐 먹고 싶어요?

      ## When you are lost
      | | |
      |---|---|
      | 잘 모르겠어요. | I'm not sure. / I don't really know. |
      | 이해 못 했어요. | I didn't understand. |
      | 다시 한번 말해 주세요. | Please say it once more. |
      | 천천히 말해 주세요. | Please speak slowly. |
      | 한국어를 잘 못해요. | I can't speak Korean well. |

      말해 주세요 is 말하다 (to speak) + the "please do it for me" pattern from unit 15. Koreans are generous with beginners: a compliment such as 한국어를 잘해요! is best answered modestly with 아니에요.

      ## Sound
      못해요 is said *motaeyo*: the t of 못 and the ㅎ merge. 싶어요 is *sipeoyo*. In 할 거예요 the 거 is often heard as "kkeo"; the romanisation still writes *geo*.
    items:
      - {id: ko1-18-sip, type: glyph, l2: "싶", rom: "sip", l1: "as in 싶어요 (sipeoyo): alone, the final ㅍ is said p"}
      - {id: ko1-18-daeumju, type: vocab, l2: "다음 주", rom: "daeum ju", l1: "next week", ex: "다음 주에 한국에 갈 거예요.", ex_rom: "daeum jue hanguge gal geoyeyo.", ex_l1: "I am going to Korea next week."}
