  # ───────────────────────────────────────────────────────────────── 11
  - id: ko1-11
    title: "Time and the days of the week"
    goal: "I can ask and tell the time, name the days of the week and arrange when to meet."
    notes: |
      Telling the time uses **both** number sets in one breath.

      | part | numbers | word | example |
      |---|---|---|---|
      | hours | native (한, 두, 세, 네 …) | **시** | 세 시 (3 o'clock) |
      | minutes | Sino-Korean | **분** | 십 분 (10 minutes) |

      So 3:10 is **세 시 십 분**. Half past is **반**: 두 시 반 (2:30). **오전** (a.m.) and **오후** (p.m.) come *before* the time: 오후 네 시.

      ## The time particle 에
      Add **에** to a clock time, a day or a part of the day to say "at / on / in": 세 시**에**, 토요일**에**, 오후**에**. Do **not** add it to 오늘, 내일, 지금 or 어제.

      (This is the same 에 that marks a location with 있어요. One particle, several jobs.)

      ## Days of the week
      Each day is one syllable + **요일**: 월, 화, 수, 목, 금, 토, 일.

      Liaison changes three of them when spoken: 월요일 *woryoil*, 목요일 *mogyoil*, 일요일 *iryoil*.

      ## Making a plan
      The 해요 form also means "let's": 세 시에 만나요 = "let's meet at three". **좋아요** = "good, okay". **어때요?** = "how about…?"
    items:
