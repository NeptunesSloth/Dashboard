          - {who: B, l2: "집에서 영화를 봐요.", rom: "jibeseo yeonghwareul bwayo.", l1: "I watch a film at home.", alt: ["집에서 영화 봐요.", "저녁에는 집에서 영화를 봐요."]}

  # ───────────────────────────────────────────────────────────────── 13
  - id: ko1-13
    title: "Family: 도 and 하고"
    goal: "I can name my family members, say how many of us there are, and join nouns with 'and' and 'too'."
    notes: |
      ## Older brothers and sisters
      The word depends on **who is speaking**.

      | | older brother | older sister |
      |---|---|---|
      | a man says | 형 | 누나 |
      | a woman says | 오빠 | 언니 |

      A younger brother or sister is **동생** for everyone (남동생 for a boy, 여동생 for a girl). Koreans also use 형, 누나, 오빠, 언니 for slightly older friends.

      You already know 아버지, 어머니 and 아빠; "mum" is 엄마.

      ## 우리
      Family and home are shared, so Korean says **우리** ("our") where English says "my": 우리 가족, 우리 어머니, 우리 집.

      ## Having family
      Use 있어요 and count with 명: 형이 한 명 있어요, "I have one older brother".

      ## Two new particles
      - **도** = "too / also". It **replaces** 은/는, 이/가 and 을/를: 저**도** 학생이에요 (I am a student too), 언니**도** 있어요 (I have an older sister as well).
      - **하고** = "and" between two nouns, and also "with": 아버지**하고** 어머니 (father and mother), 친구**하고** 가요 (I go with a friend). In writing you will also see 와/과; in casual speech 랑/이랑.

      Sound: 할아버지 is *harabeoji* (liaison turns ㄹ into r).
    items:
      - {id: ko1-13-hal, type: glyph, l2: "할", rom: "hal", l1: "ㅎ + ㅏ + ㄹ, as in 할머니 and 할아버지"}
      - {id: ko1-13-gajok, type: vocab, l2: "가족", rom: "gajok", l1: "family", ex: "우리 가족은 한국에 있어요.", ex_rom: "uri gajogeun hanguge isseoyo.", ex_l1: "My family is in Korea."}
      - {id: ko1-13-bumonim, type: vocab, l2: "부모님", rom: "bumonim", l1: "parents", ex: "부모님은 미국에 있어요.", ex_rom: "bumonimeun miguge isseoyo.", ex_l1: "My parents are in the USA."}
      - {id: ko1-13-hyeong, type: vocab, l2: "형", rom: "hyeong", l1: "older brother (said by a male)", ex: "형은 회사원이에요.", ex_rom: "hyeongeun hoesawonieyo.", ex_l1: "My older brother is an office worker."}
      - {id: ko1-13-nuna, type: vocab, l2: "누나", rom: "nuna", l1: "older sister (said by a male)", ex: "누나는 의사예요.", ex_rom: "nunaneun uisayeyo.", ex_l1: "My older sister is a doctor."}
      - {id: ko1-13-oppa, type: vocab, l2: "오빠", rom: "oppa", l1: "older brother (said by a female)", ex: "오빠는 대학생이에요.", ex_rom: "oppaneun daehaksaengieyo.", ex_l1: "My older brother is a university student."}
      - {id: ko1-13-eonni, type: vocab, l2: "언니", rom: "eonni", l1: "older sister (said by a female)", ex: "언니가 한 명 있어요.", ex_rom: "eonniga han myeong isseoyo.", ex_l1: "I have one older sister."}
      - {id: ko1-13-dongsaeng, type: vocab, l2: "동생", rom: "dongsaeng", l1: "younger brother or sister", ex: "동생은 학생이에요.", ex_rom: "dongsaengeun haksaengieyo.", ex_l1: "My younger sibling is a student.", note: "남동생 = younger brother, 여동생 = younger sister."}
      - {id: ko1-13-halmeoni, type: vocab, l2: "할머니", rom: "halmeoni", l1: "grandmother"}
      - {id: ko1-13-harabeoji, type: vocab, l2: "할아버지", rom: "harabeoji", alt: ["halabeoji"], l1: "grandfather"}
      - {id: ko1-13-nampyeon, type: vocab, l2: "남편", rom: "nampyeon", l1: "husband", ex: "남편은 한국 사람이에요.", ex_rom: "nampyeoneun hanguk saramieyo.", ex_l1: "My husband is Korean."}
      - {id: ko1-13-anae, type: vocab, l2: "아내", rom: "anae", l1: "wife", ex: "아내는 선생님이에요.", ex_rom: "anaeneun seonsaengnimieyo.", ex_l1: "My wife is a teacher."}
