  # ───────────────────────────────────────────────────────────────── 12
  - id: ko1-12
    title: "My day: verbs, 을/를, 에 and 에서"
    goal: "I can describe my daily routine: where I go, what I do and where I do it."
    notes: |
      Dictionaries list verbs in a form ending in **-다** (가다, 먹다). To speak politely, take the stem (drop 다) and add an ending.

      | the stem's last vowel | add | example |
      |---|---|---|
      | ㅏ or ㅗ | **아요** | 살다 → 살아요 |
      | anything else | **어요** | 먹다 → 먹어요, 읽다 → 읽어요 |
      | 하다 | becomes **해요** | 공부하다 → 공부해요 |

      When the stem ends in a vowel, the two vowels merge: 가 + 아요 → **가요**, 오 + 아요 → **와요**, 보 + 아요 → **봐요**, 마시 + 어요 → **마셔요**.

      One form serves for I, you, he, she, we and they, and for statements, questions and "let's".

      ## Three particles
      - **을** (after a consonant) / **를** (after a vowel) marks the **object**: 책**을** 읽어요, 커피**를** 마셔요.
      - **에** with 가요 / 와요 marks the **destination**: 학교**에** 가요.
      - **에서** marks the place where an **action happens**: 집**에서** 공부해요.

      Compare: 집**에** 있어요 (I am at home: just being there) and 집**에서** 먹어요 (I eat at home: doing something there).

      Sound: 읽어요 is *ilgeoyo* (the ㄱ moves over); 학교 is *hakgyo*.
    items:
      - {id: ko1-12-meok, type: glyph, l2: "먹", rom: "meok", l1: "the stem of 먹어요 (eat)"}
      - {id: ko1-12-ik, type: glyph, l2: "읽", rom: "ik", l1: "the stem of 읽어요 (read): alone, only ㄱ is said"}
      - {id: ko1-12-gayo, type: vocab, l2: "가요", rom: "gayo", l1: "go / goes (polite present)", ex: "학교에 가요.", ex_rom: "hakgyoe gayo.", ex_l1: "I go to school.", note: "Dictionary form: 가다."}
      - {id: ko1-12-wayo, type: vocab, l2: "와요", rom: "wayo", l1: "come / comes (polite present)", ex: "친구가 와요.", ex_rom: "chinguga wayo.", ex_l1: "A friend is coming.", note: "Dictionary form: 오다. 오 + 아요 → 와요."}
      - {id: ko1-12-meogeoyo, type: vocab, l2: "먹어요", rom: "meogeoyo", l1: "eat / eats (polite present)", ex: "사과를 먹어요.", ex_rom: "sagwareul meogeoyo.", ex_l1: "I eat an apple.", note: "Dictionary form: 먹다."}
      - {id: ko1-12-masyeoyo, type: vocab, l2: "마셔요", rom: "masyeoyo", l1: "drink / drinks (polite present)", ex: "물을 마셔요.", ex_rom: "mureul masyeoyo.", ex_l1: "I drink water.", note: "Dictionary form: 마시다. 마시 + 어요 → 마셔요."}
      - {id: ko1-12-bwayo, type: vocab, l2: "봐요", rom: "bwayo", l1: "see / watch (polite present)", ex: "영화를 봐요.", ex_rom: "yeonghwareul bwayo.", ex_l1: "I watch a film.", note: "Dictionary form: 보다. 보 + 아요 → 봐요."}
      - {id: ko1-12-haeyo, type: vocab, l2: "해요", rom: "haeyo", l1: "do / does (polite present)", ex: "지금 뭐 해요?", ex_rom: "jigeum mwo haeyo?", ex_l1: "What are you doing now?", note: "Dictionary form: 하다."}
      - {id: ko1-12-gongbuhaeyo, type: vocab, l2: "공부해요", rom: "gongbuhaeyo", l1: "study / studies (polite present)", ex: "한국어를 공부해요.", ex_rom: "hangugeoreul gongbuhaeyo.", ex_l1: "I study Korean.", note: "공부 (study) + 해요. Many verbs are noun + 하다."}
      - {id: ko1-12-jayo, type: vocab, l2: "자요", rom: "jayo", l1: "sleep / sleeps (polite present)", ex: "아이가 자요.", ex_rom: "aiga jayo.", ex_l1: "The child is sleeping.", note: "Dictionary form: 자다."}
      - {id: ko1-12-ilgeoyo, type: vocab, l2: "읽어요", rom: "ilgeoyo", l1: "read / reads (polite present)", ex: "책을 읽어요.", ex_rom: "chaegeul ilgeoyo.", ex_l1: "I read a book.", note: "Dictionary form: 읽다."}
      - {id: ko1-12-jip, type: vocab, l2: "집", rom: "jip", l1: "house / home", ex: "집에 가요.", ex_rom: "jibe gayo.", ex_l1: "I am going home."}
      - {id: ko1-12-hakgyo, type: vocab, l2: "학교", rom: "hakgyo", l1: "school", ex: "학교에서 공부해요.", ex_rom: "hakgyoeseo gongbuhaeyo.", ex_l1: "I study at school."}
      - {id: ko1-12-achim, type: vocab, l2: "아침", rom: "achim", l1: "morning / breakfast", ex: "아침에 우유를 마셔요.", ex_rom: "achime uyureul masyeoyo.", ex_l1: "I drink milk in the morning."}
      - {id: ko1-12-jeonyeok, type: vocab, l2: "저녁", rom: "jeonyeok", l1: "evening / dinner", ex: "저녁에 책을 읽어요.", ex_rom: "jeonyeoge chaegeul ilgeoyo.", ex_l1: "I read a book in the evening."}
      - {id: ko1-12-yeonghwa, type: vocab, l2: "영화", rom: "yeonghwa", l1: "film / movie", ex: "주말에 영화를 봐요.", ex_rom: "jumare yeonghwareul bwayo.", ex_l1: "I watch a film at the weekend."}
      - {id: ko1-12-mwohaeyo, type: phrase, l2: "오늘 뭐 해요?", rom: "oneul mwo haeyo", l1: "What are you doing today?", alt: ["오늘은 뭐 해요?", "오늘 뭐 하세요?"]}
      - {id: ko1-12-hoesaegayo, type: phrase, l2: "저는 회사에 가요.", rom: "jeoneun hoesae gayo", l1: "I go to the office.", alt: ["회사에 가요."]}
      - {id: ko1-12-c1, type: cloze, text: "저는 아침에 커피___ 마셔요.", answer: "를", alt: ["reul"], l1: "I drink coffee in the morning. (object particle)", note: "Object particle after a vowel (피): 를."}
      - {id: ko1-12-c2, type: cloze, text: "저는 책___ 읽어요.", answer: "을", alt: ["eul"], l1: "I read a book. (object particle)", note: "Object particle after a consonant (책): 을."}
      - {id: ko1-12-c3, type: cloze, text: "학교___ 한국어를 공부해요.", answer: "에서", alt: ["eseo"], l1: "I study Korean at school.", note: "An action happens there, so 에서."}
      - {id: ko1-12-c4, type: cloze, text: "오늘 친구가 집___ 와요.", answer: "에", alt: ["e"], l1: "A friend is coming to my house today.", note: "Destination of 가요 / 와요: 에."}
      - id: ko1-12-d1
        type: dialogue
        title: "What are you doing today?"
        scene: "A neighbour chats with you on your way out in the morning."
        you: B
        lines:
          - {who: A, l2: "오늘 뭐 해요?", rom: "oneul mwo haeyo?", l1: "What are you doing today?"}
          - {who: B, l2: "학교에 가요.", rom: "hakgyoe gayo.", l1: "I'm going to school.", alt: ["저는 학교에 가요.", "오늘 학교에 가요."]}
          - {who: A, l2: "학교에서 뭐 공부해요?", rom: "hakgyoeseo mwo gongbuhaeyo?", l1: "What do you study at school?"}
