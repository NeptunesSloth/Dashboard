      - {id: ko1-13-uri, type: vocab, l2: "우리", rom: "uri", l1: "we / our", ex: "우리 집이에요.", ex_rom: "uri jibieyo.", ex_l1: "This is my (our) home."}
      - {id: ko1-13-gajogimyeot, type: phrase, l2: "가족이 몇 명이에요?", rom: "gajogi myeot myeongieyo", l1: "How many people are there in your family?", alt: ["가족이 몇 명 있어요?"]}
      - {id: ko1-13-nemyeongieyo, type: phrase, l2: "우리 가족은 네 명이에요.", rom: "uri gajogeun ne myeongieyo", l1: "There are four people in my family.", alt: ["우리 가족은 4명이에요.", "네 명이에요."]}
      - {id: ko1-13-c1, type: cloze, text: "저는 누나가 있어요. 형___ 있어요.", answer: "도", alt: ["do"], l1: "I have an older sister. I have an older brother too.", note: "도 (too) replaces 이/가."}
      - {id: ko1-13-c2, type: cloze, text: "아버지___ 어머니는 한국에 있어요.", answer: "하고", alt: ["hago", "와", "wa", "랑", "rang"], l1: "My father and mother are in Korea.", note: "하고 joins two nouns. Written style: 아버지와; casual speech: 아버지랑."}
      - {id: ko1-13-c3, type: cloze, text: "저는 ___이 두 명 있어요.", answer: "동생", alt: ["dongsaeng"], l1: "I have two younger siblings.", note: "동생 covers both younger brothers and younger sisters."}
      - id: ko1-13-d1
        type: dialogue
        title: "Talking about family"
        scene: "You are Sara. A colleague asks about your family over lunch."
        you: B
        lines:
          - {who: A, l2: "사라 씨, 가족이 몇 명이에요?", rom: "sara ssi, gajogi myeot myeongieyo?", l1: "Sara, how many people are there in your family?"}
          - {who: B, l2: "우리 가족은 네 명이에요.", rom: "uri gajogeun ne myeongieyo.", l1: "There are four people in my family.", alt: ["네 명이에요.", "우리 가족은 4명이에요."]}
          - {who: A, l2: "언니나 오빠가 있어요?", rom: "eonnina oppaga isseoyo?", l1: "Do you have an older sister or an older brother?"}
          - {who: B, l2: "네, 언니가 한 명 있어요.", rom: "ne, eonniga han myeong isseoyo.", l1: "Yes, I have one older sister.", alt: ["네, 언니가 있어요.", "네, 언니 한 명 있어요.", "네, 언니가 1명 있어요."]}
          - {who: A, l2: "언니도 회사원이에요?", rom: "eonnido hoesawonieyo?", l1: "Is your sister an office worker too?"}
          - {who: B, l2: "아니요, 언니는 의사예요.", rom: "aniyo, eonnineun uisayeyo.", l1: "No, my sister is a doctor.", alt: ["아니요, 의사예요.", "아니요, 우리 언니는 의사예요."]}
          - {who: A, l2: "와, 그래요?", rom: "wa, geuraeyo?", l1: "Wow, really?"}

  # ───────────────────────────────────────────────────────────────── 14
  - id: ko1-14
    title: "Food and drink: ordering, liking and 안"
    goal: "I can order food and drink, say what I like and dislike, and say what I do not eat."
    notes: |
      ## Ordering
      Name the dish, say how many, and add **주세요**: 비빔밥 하나 주세요. **좀** ("a little") in front of 주세요 softens a request: 물 좀 주세요. Call the staff with 저기요! and ask for the bill with 계산해 주세요.

      Staff will say **뭐 드릴까요?** ("what shall I bring you?") and **맛있게 드세요** ("enjoy your meal"). Before eating, Koreans say **잘 먹겠습니다** ("I will eat well").

      ## Liking
      **좋아해요** (like) and **싫어해요** (dislike) are verbs and take the object particle: 김치**를** 좋아해요.

      Do not mix it up with 좋아요 from unit 11, which means "is good" and takes 이/가: 김치**가** 좋아요.

      ## Describing food
      맛있어요 (it is tasty; 맛 = taste, so literally "taste exists"), 맛없어요 (it is not tasty), 매워요 (it is spicy).

      ## Saying "not": 안
      Put **안** directly before the verb: 안 먹어요 (I don't eat), 안 매워요 (it isn't spicy), 안 좋아해요 (I don't like it).

      With noun + 해요 verbs, 안 goes between the two: 공부 **안** 해요.

      | | |
      |---|---|
      | 고기를 먹어요. | I eat meat. |
      | 고기를 **안** 먹어요. | I don't eat meat. |

      Sound: 맛있어요 is *masisseoyo*; 싫어해요 is *sireohaeyo*.
    items:
      - {id: ko1-14-mat, type: glyph, l2: "맛", rom: "mat", l1: "taste, as in 맛있어요"}
      - {id: ko1-14-bap, type: vocab, l2: "밥", rom: "bap", l1: "cooked rice / a meal", ex: "밥을 먹어요.", ex_rom: "babeul meogeoyo.", ex_l1: "I am eating (a meal)."}
      - {id: ko1-14-gimchi, type: vocab, l2: "김치", rom: "gimchi", alt: ["kimchi"], l1: "kimchi", ex: "김치가 매워요.", ex_rom: "gimchiga maewoyo.", ex_l1: "The kimchi is spicy."}
      - {id: ko1-14-bulgogi, type: vocab, l2: "불고기", rom: "bulgogi", l1: "bulgogi (marinated grilled beef)", ex: "불고기를 좋아해요.", ex_rom: "bulgogireul joahaeyo.", ex_l1: "I like bulgogi."}
      - {id: ko1-14-bibimbap, type: vocab, l2: "비빔밥", rom: "bibimbap", l1: "bibimbap (rice mixed with vegetables)", ex: "비빔밥이 맛있어요.", ex_rom: "bibimbabi masisseoyo.", ex_l1: "The bibimbap is tasty."}
      - {id: ko1-14-maekju, type: vocab, l2: "맥주", rom: "maekju", l1: "beer", ex: "맥주 한 병 주세요.", ex_rom: "maekju han byeong juseyo.", ex_l1: "One bottle of beer, please."}
      - {id: ko1-14-eumsik, type: vocab, l2: "음식", rom: "eumsik", l1: "food", ex: "한국 음식을 좋아해요.", ex_rom: "hanguk eumsigeul joahaeyo.", ex_l1: "I like Korean food."}
      - {id: ko1-14-sikdang, type: vocab, l2: "식당", rom: "sikdang", l1: "restaurant", ex: "식당에서 밥을 먹어요.", ex_rom: "sikdangeseo babeul meogeoyo.", ex_l1: "I eat at a restaurant."}
      - {id: ko1-14-masisseoyo, type: vocab, l2: "맛있어요", rom: "masisseoyo", l1: "(it is) tasty / delicious", ex: "이거 맛있어요!", ex_rom: "igeo masisseoyo!", ex_l1: "This is delicious!", note: "The opposite is 맛없어요 (madeopseoyo)."}
      - {id: ko1-14-maewoyo, type: vocab, l2: "매워요", rom: "maewoyo", l1: "(it is) spicy", ex: "이거 매워요?", ex_rom: "igeo maewoyo?", ex_l1: "Is this spicy?"}
      - {id: ko1-14-joahaeyo, type: vocab, l2: "좋아해요", rom: "joahaeyo", alt: ["johahaeyo"], l1: "like / likes (verb, takes 을/를)", ex: "저는 커피를 좋아해요.", ex_rom: "jeoneun keopireul joahaeyo.", ex_l1: "I like coffee."}
