  # ───────────────────────────────────────────────────────────────── 15
  - id: ko1-15
    title: "Shopping: describing things, 안 and 못"
    goal: "I can ask for things in a shop, say they are too expensive or too small, bargain and pay."
    notes: |
      ## Adjectives behave like verbs
      Korean has no separate "is" for adjectives. **비싸요** is a complete sentence: "(it) is expensive". They conjugate exactly like verbs: 싸요 (cheap), 커요 (big), 작아요 (small).

      ## 이 / 그 / 저 + noun
      The this/that words from unit 8 without 거 go straight before a noun: **이** 옷 (these clothes), **그** 가방 (that bag near you), **저** 신발 (those shoes over there).

      ## Can't: 못
      | | meaning | example |
      |---|---|---|
      | **안** + verb | don't, not (a choice or a plain fact) | 안 사요: I'm not buying it |
      | **못** + verb | can't (something prevents it) | 못 사요: I can't buy it |

      Use 안, never 못, with adjectives: 안 비싸요.

      ## Useful shop language
      - 이거 주세요: I'll take this.
      - (noun) 있어요?: Do you have …?
      - 좀 깎아 주세요: please bring the price down a little (fine at markets, not in shops with price tags).
      - 카드 돼요?: can I pay by card? (돼요 = it works, it's possible)

      Verb + **아/어 주세요** means "please do it for me": 깎아 주세요.

      ## Sound
      못 ends in a t sound and reacts to what follows: 못 가요 is "mot gayo", but 못 먹어요 is heard as "mon meogeoyo". The romanisation here writes each word separately: *mot meogeoyo*.
    items:
      - {id: ko1-15-kkak, type: glyph, l2: "깎", rom: "kkak", l1: "as in 깎아 주세요: tense ㄲ twice; the final one is said k"}
      - {id: ko1-15-sayo, type: vocab, l2: "사요", rom: "sayo", l1: "buy / buys (polite present)", ex: "시장에서 사과를 사요.", ex_rom: "sijangeseo sagwareul sayo.", ex_l1: "I buy apples at the market.", note: "Dictionary form: 사다."}
      - {id: ko1-15-bissayo, type: vocab, l2: "비싸요", rom: "bissayo", l1: "(it is) expensive", ex: "이 가방은 비싸요.", ex_rom: "i gabangeun bissayo.", ex_l1: "This bag is expensive."}
      - {id: ko1-15-ssayo, type: vocab, l2: "싸요", rom: "ssayo", l1: "(it is) cheap", ex: "시장은 싸요.", ex_rom: "sijangeun ssayo.", ex_l1: "The market is cheap."}
      - {id: ko1-15-keoyo, type: vocab, l2: "커요", rom: "keoyo", l1: "(it is) big", ex: "이 옷은 커요.", ex_rom: "i oseun keoyo.", ex_l1: "These clothes are big.", note: "Dictionary form: 크다."}
      - {id: ko1-15-jagayo, type: vocab, l2: "작아요", rom: "jagayo", l1: "(it is) small", ex: "가방이 작아요.", ex_rom: "gabangi jagayo.", ex_l1: "The bag is small.", note: "Dictionary form: 작다."}
      - {id: ko1-15-ot, type: vocab, l2: "옷", rom: "ot", l1: "clothes", ex: "옷을 사요.", ex_rom: "oseul sayo.", ex_l1: "I am buying clothes.", note: "With a particle the ㅅ is heard: 옷을 = oseul."}
      - {id: ko1-15-sinbal, type: vocab, l2: "신발", rom: "sinbal", l1: "shoes", ex: "이 신발 얼마예요?", ex_rom: "i sinbal eolmayeyo?", ex_l1: "How much are these shoes?"}
      - {id: ko1-15-sijang, type: vocab, l2: "시장", rom: "sijang", l1: "market", ex: "시장에 가요.", ex_rom: "sijange gayo.", ex_l1: "I am going to the market."}
      - {id: ko1-15-kadeu, type: vocab, l2: "카드", rom: "kadeu", l1: "card (bank card)", ex: "카드가 없어요.", ex_rom: "kadeuga eopseoyo.", ex_l1: "I don't have a card."}
      - {id: ko1-15-neomu, type: vocab, l2: "너무", rom: "neomu", l1: "too / so (very)", ex: "너무 커요.", ex_rom: "neomu keoyo.", ex_l1: "It's too big."}
      - {id: ko1-15-igeojuseyo, type: phrase, l2: "이거 주세요.", rom: "igeo juseyo", l1: "I'll take this one, please.", alt: ["이것 주세요.", "이걸 주세요.", "이거로 주세요."]}
      - {id: ko1-15-kkakkajuseyo, type: phrase, l2: "좀 깎아 주세요.", rom: "jom kkakka juseyo", l1: "Please give me a little discount.", alt: ["깎아 주세요.", "kkakka juseyo", "조금 깎아 주세요."]}
      - {id: ko1-15-kadeudwaeyo, type: phrase, l2: "카드 돼요?", rom: "kadeu dwaeyo", l1: "Can I pay by card?", alt: ["카드 되나요?", "카드로 돼요?"]}
      - {id: ko1-15-c1, type: cloze, text: "돈이 없어요. 그래서 ___ 사요.", answer: "못", alt: ["mot"], l1: "I have no money. So I can't buy it.", note: "Something prevents it: 못. 그래서 = so."}
