  # ───────────────────────────────────────────────────────────────── 5
  - id: ko1-05
    title: "Hangul 5: final consonants (batchim)"
    goal: "I can read blocks that end in a consonant and apply the first sound-change rules."
    notes: |
      A block can have a third part: a **final consonant**, called *batchim* ("support"), written at the **bottom**. ㅎ + ㅏ + ㄴ = **한** (han); ㄱ + ㅡ + ㄹ = **글** (geul).

      ## Only seven final sounds
      Almost every consonant can be written as a final (not ㄸ ㅃ ㅉ), but only seven sounds are heard there, and they are cut short, never released.

      | written | heard | example |
      |---|---|---|
      | ㄱ ㅋ ㄲ | k | 국, 밖 |
      | ㄴ | n | 한 |
      | ㄷ ㅅ ㅆ ㅈ ㅊ ㅌ ㅎ | t | 옷, 꽃, 낮 |
      | ㄹ | l | 글 |
      | ㅁ | m | 몸 |
      | ㅂ ㅍ | p | 밥, 앞 |
      | ㅇ | ng | 강 |

      ## Liaison
      When the next block starts with the silent ㅇ, the final consonant **moves over** and is said with its real sound: 한국어 is said 한구거 (hangugeo), 옷이 is 오시 (osi), 이름이 is 이르미 (ireumi).

      ## Nasal sounds
      Before ㄴ or ㅁ, a final k, t, p turns into ng, n, m. The one you will use every day: **ㅂ + 니다 is said "mnida"**, so 합니다 is *hamnida*.

      ## Two finals
      A few blocks have two final letters. Alone, only one is said (닭 dak, 값 gap); before a vowel the second moves over (값이 = gapsi).

      The romanisation follows the pronunciation, not the spelling.
    items:
