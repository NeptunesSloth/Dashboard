      - {id: ko1-09-gu, type: vocab, l2: "구", rom: "gu", l1: "nine (Sino-Korean)", ex: "구월", ex_rom: "guwol", ex_l1: "September"}
      - {id: ko1-09-sip, type: vocab, l2: "십", rom: "sip", l1: "ten (Sino-Korean)", ex: "이십오", ex_rom: "isibo", ex_l1: "twenty-five", note: "October is irregular: 시월, not 십월."}
      - {id: ko1-09-baek, type: vocab, l2: "백", rom: "baek", l1: "hundred", ex: "삼백", ex_rom: "sambaek", ex_l1: "three hundred"}
