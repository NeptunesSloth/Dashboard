blurb: "Start Korean from zero: read Hangul block by block, then greet, introduce yourself, count both ways, order, shop, ask the way and talk about yesterday and tomorrow."

units:
  # ───────────────────────────────────────────────────────────────── 1
  - id: ko1-01
    title: "Hangul 1: the vowels and the first consonants"
    goal: "I can read the ten basic vowels and the consonants ㅇ ㄱ ㄴ ㅁ, alone and in simple syllable blocks."
    notes: |
      Korean is written in **Hangul**, an alphabet of 24 basic letters. It is not a set of thousands of characters: every "character" you see is a small **block** built from letters, and each block is one syllable.

      ## How a block is built
      A block always starts with a consonant, then a vowel.

      - Tall vowels (ㅏ ㅓ ㅣ ㅑ ㅕ) stand to the **right** of the consonant: ㄱ + ㅏ = **가** (ga).
      - Flat vowels (ㅗ ㅜ ㅡ ㅛ ㅠ) sit **under** it: ㅁ + ㅗ = **모** (mo).
      - A syllable that begins with a vowel sound still needs a consonant in that place, so the silent placeholder **ㅇ** is written: ㅇ + ㅏ = **아** (a). 아이 is "a-i".

      ## The vowels
      | plain | ㅏ a | ㅓ eo | ㅗ o | ㅜ u | ㅡ eu | ㅣ i |
      |---|---|---|---|---|---|---|
      | with y | ㅑ ya | ㅕ yeo | ㅛ yo | ㅠ yu | | |

      One extra short stroke adds a **y**. In the romanisation used here (Revised Romanization) **eo** and **eu** are each one vowel sound: *eo* is like the o in "son", *eu* is "oo" said with the lips spread flat.

      ## The first consonants
      ㄱ g, ㄴ n, ㅁ m, and ㅇ, which is silent at the start of a block and "ng" at the end (unit 5).
    items:
