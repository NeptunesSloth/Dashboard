      - {id: ko1-09-i, type: vocab, l2: "이", rom: "i", l1: "two (Sino-Korean)", ex: "이 번", ex_rom: "i beon", ex_l1: "number two"}
      - {id: ko1-09-sam, type: vocab, l2: "삼", rom: "sam", l1: "three (Sino-Korean)", ex: "삼월", ex_rom: "samwol", ex_l1: "March"}
      - {id: ko1-09-sa, type: vocab, l2: "사", rom: "sa", l1: "four (Sino-Korean)", ex: "사월", ex_rom: "sawol", ex_l1: "April"}
      - {id: ko1-09-o, type: vocab, l2: "오", rom: "o", l1: "five (Sino-Korean)", ex: "오월", ex_rom: "owol", ex_l1: "May"}
      - {id: ko1-09-yuk, type: vocab, l2: "육", rom: "yuk", l1: "six (Sino-Korean)", ex: "육 번", ex_rom: "yuk beon", ex_l1: "number six", note: "June is irregular: 유월, not 육월."}
      - {id: ko1-09-chil, type: vocab, l2: "칠", rom: "chil", l1: "seven (Sino-Korean)", ex: "칠월", ex_rom: "chirwol", ex_l1: "July"}
