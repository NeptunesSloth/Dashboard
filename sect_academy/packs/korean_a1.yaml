      - {id: ko1-15-c4, type: cloze, text: "시장___ 옷을 사요.", answer: "에서", alt: ["eseo"], l1: "I buy clothes at the market.", note: "Buying is an action, so the place takes 에서."}
      - id: ko1-15-d1
        type: dialogue
