          - {who: B, l2: "아니에요. 잘 못해요.", rom: "anieyo. jal motaeyo.", l1: "Not at all. I can't speak it well.", alt: ["아니에요. 아직 잘 못해요.", "아니에요. 한국어를 잘 못해요.", "아니에요. 잘 못 해요."]}
