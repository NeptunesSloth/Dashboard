  # ───────────────────────────────────────────────────────────────── 3
  - id: ko1-03
    title: "Hangul 3: aspirated and tense consonants"
    goal: "I can tell plain, aspirated and tense consonants apart and read words that use them."
    notes: |
      Korean has **three versions** of several consonants. English has nothing quite like it, so listen for the difference from the first day.

      | plain | aspirated (a puff of air) | tense (tight, no air) |
      |---|---|---|
      | ㄱ g | ㅋ k | ㄲ kk |
      | ㄷ d | ㅌ t | ㄸ tt |
      | ㅂ b | ㅍ p | ㅃ pp |
      | ㅈ j | ㅊ ch | ㅉ jj |
      | ㅅ s | | ㅆ ss |

      - **Aspirated** letters are the plain letter with an added stroke. Say them with a strong breath: hold a sheet of paper in front of your mouth and it should move for 카 but hardly at all for 가.
      - **Tense** letters are the plain letter written twice. Tighten your throat and release the sound sharply, with no breath at all, like the t in "s**t**op" or the p in "s**p**y".
      - The romanisation shows the series clearly: g / k / kk, d / t / tt, b / p / pp, j / ch / jj, s / ss.

      The difference changes meaning: 차요 (chayo) is "it is cold", 짜요 (jjayo) is "it is salty", 자요 (jayo) is "sleeps".

      Words borrowed from English usually take the aspirated letters: 커피 (coffee), 피자 (pizza), 카드 (card).
    items:
      - {id: ko1-03-k, type: glyph, l2: "ㅋ", rom: "k", l1: "ㄱ with a strong puff of air; as a final: k"}
