# Best-answer practice bank for CompTIA CySA+ CS0-004.
# Every item is an mcq with best: true - all four choices are reasonable; whys explains each.
part_of: cysa-plus
units:
  - id: cy-1b2
    title: "Best-answer practice: Security Operations"
    domain: "1"
    goal: "I can pick the best monitoring, analysis or process-improvement decision in security operations when every option on offer is reasonable."
    notes: |
      In these questions **every choice is something a competent analyst might do**. One fact in the stem decides between them - find it before you read the choices.

      **What to look for in Domain 1**

      - **What the evidence actually supports.** Read the log line: one domain or many, answered or refused, response size, parent process. Pick the conclusion the data proves, not the scariest one.
      - **Verify before you disrupt.** If a quick, harmless check could explain an alert, it comes FIRST. Once compromise is confirmed, cut the attacker's access before tidying up.
      - **The stated constraint.** A budget, "must keep working", "personal data must not be touched", "powered off" - each rules out an otherwise good control.
      - **Root cause over symptom.** Fix the stale credential, not the noisy alert; remove the service, do not just hide it.
      - **Durable over brittle.** Behaviour outlasts hashes and addresses.

      **Usual traps:** blocking everything on a medium-confidence feed; suppressing a rule instead of fixing its cause; trusting an AI summary unchecked; automation with no approval step for critical assets.
    items:
      - id: cy-1b2-b01
        type: mcq
        best: true
        q: "An investigation shows an intruder was in the network for 200 days, but the SIEM keeps only 30 days of searchable logs and the budget cannot fund a year of hot storage. Which change BEST lets future investigations reach back a year?"
        choices:
          - "Extend hot, searchable retention in the SIEM to 365 days for every source"
          - "Increase the local event log size on every server and workstation"
          - "Archive authentication, DNS and proxy logs to low-cost storage for 12 months"
          - "Keep daily summary counts of each event type for 12 months"
        answer: 2
        why: "Tiered retention keeps the sources investigators need most for a year at a cost the budget allows; the logs can be restored and searched when needed."
        whys:
          - "Meets the need, but the stem says the budget cannot fund a year of hot storage."
          - "Helps a little, but local logs stay scattered and under the control of whoever compromises the host."
          - "Best: the key sources are kept centrally for a year on cheap storage, which fits the budget."
          - "Cheap, but counts lose the detail of who did what, which is what an investigation needs."
      - id: cy-1b2-b02
        type: mcq
        best: true
        q: "Stolen credentials were used to log on to several servers, but the domain controllers are set to audit failed logons only, so the SIEM cannot show where the account went. Which change BEST closes this gap for the next investigation?"
        choices:
          - "Audit successful logons as well and forward those events to the SIEM"
          - "Double the size of the Security event log on each domain controller"
          - "Capture full packets on the server VLAN and keep them for a week"
          - "Lower the SIEM threshold that alerts on repeated failed logons"
        answer: 0
        why: "A stolen password produces successful logons. The gap is in what the source records, so the fix is to log successes and collect them."
        whys:
          - "Best: use of a stolen credential appears as successful logons, which are not being recorded at all."
          - "Keeps more history, but more of the same failed-logon events does not show where the account went."
          - "Could show connections, but it is costly, short-lived and much authentication traffic is encrypted."
          - "Catches guessing sooner, but a thief with the right password causes no failures."
      - id: cy-1b2-b03
        type: mcq
        best: true
        q: "A scan of a new Linux web server image shows 14 listening services; the application needs two. The image will be the template for 60 servers. Which hardening step BEST reduces the attack surface?"
        choices:
          - "Enable the host firewall and allow inbound traffic only to the two needed ports"
          - "Install a host intrusion detection agent that alerts on changes to the services"
          - "Schedule a weekly credentialed vulnerability scan of every server built from it"
          - "Remove or disable the twelve unneeded services in the image itself"
        answer: 3
        why: "Removing what is not needed is the root fix: a service that is not installed cannot be exploited, and fixing the image fixes all 60 servers."
        whys:
          - "A good extra layer, but the services still run and are exposed again if a rule changes or an attacker is already on the host."
          - "Detective: it reports tampering but leaves the twelve services in place."
          - "Useful assurance, but it will keep finding flaws in services that should not be there."
          - "Best: it removes the surface itself, once, in the template every server inherits."
      - id: cy-1b2-b04
        type: mcq
        best: true
        q: "Database passwords and API keys sit in plain text in an infrastructure-as-code repository. The requirement is that no secret is stored in the repository and that keys can be rotated without redeploying code. Which approach BEST meets it?"
        choices:
          - "Encrypt the secrets file and commit the encrypted copy to the repository"
          - "Have workloads fetch secrets at run time from a secrets vault"
          - "Make the repository private and limit it to the operations team"
          - "Add a pre-commit hook that rejects commits containing secrets"
        answer: 1
        why: "A secrets manager keeps secrets out of the repository entirely and lets them be rotated centrally, because workloads read the current value when they run."
        whys:
          - "Better than plain text, but the secret is still in the repository and rotation needs a new commit and deployment."
          - "Best: nothing secret is stored in the code, and a rotated key is picked up at the next fetch."
          - "Narrows who can read the secrets, but they are still stored in the repository in plain text."
          - "Stops new secrets being committed, but gives them nowhere to live and no way to rotate them."
      - id: cy-1b2-b05
        type: mcq
        best: true
        q: "Contractors on their own laptops need one internal web application. They must get no network-level reach to anything else, and the application must not be published to the internet. The company already subscribes to a SASE service. Which is the BEST way to give access?"
        choices:
          - "A full-tunnel VPN account with firewall rules limiting each contractor"
          - "A virtual desktop inside the network from which they open the application"
          - "ZTNA through the SASE service, granting that one application per user"
          - "A reverse proxy on the internet in front of the application, with MFA"
        answer: 2
        why: "ZTNA brokers a connection to one application after checking identity, so the contractor never joins the network and the application stays unpublished."
        whys:
          - "Workable, but it places the laptop on the network and relies on rules to pull that reach back."
          - "Keeps data off the laptop, but gives the contractor a session inside the network and needs new infrastructure."
          - "Best: per-application access with no network-level reach, using a service the company already has."
          - "Gives application-only access, but publishes the application to the internet, which the stem forbids."
      - id: cy-1b2-b06
        type: mcq
        best: true
        q: "An intruder took the backup service account's password from the memory of the backup server. The account is a domain administrator because that was the quickest way to make backups work. Which change MOST reduces the damage a repeat of this theft could do?"
        choices:
          - "Give the account only the rights that backup jobs need"
          - "Rotate the account's password automatically every 30 days"
          - "Allow the account to log on only to the backup servers"
          - "Alert whenever the account logs on outside the backup window"
        answer: 0
        why: "Damage is set by what the stolen account can do. Least privilege turns the theft of a domain administrator into the theft of a backup operator."
        whys:
          - "Best: a stolen copy of the account can then do only what backups need, not control the domain."
          - "Shortens how long a stolen password works, but for up to 30 days it is still a domain administrator."
          - "Limits where the password works, but this thief was already on a backup server, where it would still hold full rights."
          - "Detective: it may reveal misuse, but does not limit what the account can do."
      - id: cy-1b2-b07
        type: mcq
        best: true
        q: "EDR on a Windows HMI that operators use to run a live chemical process reports malware calling out to an internet address. The plant manager states that losing the HMI without warning could create a safety hazard. Which is the BEST immediate containment?"
        choices:
          - "Isolate the HMI from the network through the EDR console"
          - "Shut the HMI down and rebuild it from the vendor's image"
          - "Watch the HMI closely and act at the next planned maintenance outage"
          - "Block the address at the firewall between the plant and IT networks"
        answer: 3
        why: "In operational technology, safety and availability come first. Blocking the call-out at the boundary cuts the attacker off without taking the operators' view of the process away."
        whys:
          - "Stops the malware, but also cuts the HMI off from the controllers it supervises - the hazard the plant manager named."
          - "Needed in the end, but doing it now removes the HMI without warning."
          - "Protects the process, but leaves the attacker's channel open until the outage."
          - "Best: it breaks the malware's channel while the HMI keeps running the process."
      - id: cy-1b2-b08
        type: mcq
        best: true
        q: "Staff are uploading customer lists to personal cloud storage accounts. The company's own sanctioned cloud storage tenant must keep working. Which control BEST prevents the leak?"
        choices:
          - "Block every cloud storage site at the web proxy"
          - "A CASB policy that blocks uploads to unsanctioned tenants"
          - "A weekly review of proxy logs for large uploads to cloud storage"
          - "An updated acceptable use policy with annual training"
        answer: 1
        why: "A CASB can tell the company's tenant from a personal one on the same service, so it blocks the leak path while the sanctioned storage keeps working."
        whys:
          - "Prevents the leak, but also breaks the sanctioned tenant that must keep working."
          - "Best: it stops uploads to personal tenants and leaves the company's tenant usable."
          - "Detective: it finds uploads after the customer list has already left."
          - "Administrative and worth having, but it relies on staff choosing to comply."
      - id: cy-1b2-b09
        type: mcq
        best: true
        q: "Sales laptops hold customer contracts. The risk to address is a laptop that is stolen while powered off and never connects to a network again. Which control BEST protects the data?"
        choices:
          - "Full-disk encryption with pre-boot authentication"
          - "A remote wipe command issued from the MDM console"
          - "A firmware password that stops booting from other media"
          - "DLP rules that block copying contracts to USB drives"
        answer: 0
        why: "Data at rest on a powered-off device is protected by encryption: without the key the disk is unreadable, whatever the thief does with it."
        whys:
          - "Best: the disk stays unreadable even if it is removed and read in another machine."
          - "Effective only if the laptop checks in, and the stem says it never connects again."
          - "Stops booting other media, but the disk can simply be taken out and read elsewhere."
          - "Addresses a different leak path - staff copying files - not theft of the device."
      - id: cy-1b2-b10
        type: mcq
        best: true
        q: "An employee who read company email on a personal phone enrolled in MDM is leaving today. Company data must be removed from the phone, and policy forbids touching personal data on employee-owned devices. Which action BEST meets both requirements?"
        choices:
          - "Send a full factory-reset wipe to the phone from the MDM console"
          - "Disable the user's account and let the mail app stop synchronising"
          - "Selectively wipe the managed work profile from the MDM console"
          - "Ask the employee to delete the mail account and confirm in writing"
        answer: 2
        why: "A selective (enterprise) wipe removes only the managed apps and data, which satisfies both the data-removal requirement and the personal-data policy."
        whys:
          - "Removes the company data, but destroys the employee's personal data, which policy forbids."
          - "Needed anyway, but mail and attachments already cached on the phone stay there."
          - "Best: it removes the work data and leaves the personal side of the phone alone."
          - "Respects the personal data, but the company cannot verify that anything was removed."
      - id: cy-1b2-b11
        type: mcq
        best: true
        q: "A DNS log shows one workstation sending about 4,000 queries an hour, all TXT lookups for names like `a9f3k2...x7.cdn-sync.example`, each with a different 50-character label under the same domain, and all of them are answered. Which explanation does the evidence BEST support?"
        choices:
          - "Malware using a domain generation algorithm to find its controller"
          - "A misconfigured application retrying a failed lookup in a loop"
          - "A browser prefetching names for links on pages the user visits"
          - "Data being carried out through DNS queries to one domain"
        answer: 3
        why: "Long, unique labels under a single domain, TXT records and a steady high volume are the pattern of DNS tunnelling: the data rides in the query names and answers."
        whys:
          - "A DGA produces many different domains, most of which fail to resolve; here there is one domain and every query is answered."
          - "A retry loop repeats the same name; here every label is different."
          - "Prefetching asks for address records across many unrelated domains, not TXT records under one."
          - "Best: unique long labels under one domain, answered TXT queries and high volume all fit DNS tunnelling."
      - id: cy-1b2-b12
        type: mcq
        best: true
        q: "An alert reports 'impossible travel': a user signed in from London at 09:00 and from Singapore at 09:20, both with MFA passed. The company recently moved remote users to a cloud proxy with exit points in several countries. What should the analyst do FIRST?"
        choices:
          - "Disable the account until the user can be reached by phone"
          - "Check whether the Singapore address is one of the proxy's exit points"
          - "Force a password reset and require the user to enrol MFA again"
          - "Search the mailbox audit log for new forwarding rules"
        answer: 1
        why: "Verify before you disrupt. The stem gives a likely benign cause, and checking the address against the proxy's exit points takes seconds and harms nobody."
        whys:
          - "Right if compromise is confirmed, but it locks out a user who may simply be behind the new proxy."
          - "Best: a quick, harmless check that either explains the alert or makes it serious."
          - "A containment step for a confirmed compromise; nothing is confirmed yet."
          - "A good next check if the address is not the proxy's, but slower and not the fact that explains this alert."
      - id: cy-1b2-b13
        type: mcq
        best: true
        q: "A mailbox audit confirms that an intruder signed in to a user's cloud email from abroad with a stolen session token and created a rule forwarding invoices to an outside address. Which action should come FIRST?"
        choices:
          - "Revoke the account's active sessions and reset its credentials"
          - "Delete the forwarding rule from the user's mailbox"
          - "Search every other mailbox for rules that forward to the same address"
          - "Warn the suppliers whose invoices were forwarded"
        answer: 0
        why: "Compromise is confirmed, so containment comes first: end the intruder's access. A stolen token survives a password change, so sessions must be revoked as well."
        whys:
          - "Best: it removes the intruder's access, including the stolen token, before anything else is cleaned up."
          - "Necessary, but while the session lives the intruder can simply create the rule again."
          - "Important scoping, but it leaves the known intruder inside this mailbox meanwhile."
          - "Will be needed, through the communication plan, once the access has been cut."
      - id: cy-1b2-b14
        type: mcq
        best: true
        q: "At 02:00 EDR records `powershell.exe -enc ...` started by the software-deployment agent on 300 workstations within one minute. No change notice reached the SOC. What should the analyst do FIRST?"
        choices:
          - "Isolate all 300 workstations from the network through EDR"
          - "Push a policy that blocks encoded PowerShell on workstations"
          - "Decode the command and check it against change records"
          - "Add a tuning rule that ignores PowerShell started by the agent"
        answer: 2
        why: "The pattern fits either a routine deployment or an attacker abusing the deployment tool. Decoding the command and checking for an approved change settles which, in minutes and without disruption."
        whys:
          - "Right if the command proves malicious, but it would take 300 users offline on an unverified alert."
          - "May break legitimate deployments and does not tell the analyst what just ran."
          - "Best: it establishes what ran and whether it was authorized before any disruptive step."
          - "Might be right later, but if the deployment tool has been hijacked this rule would hide the attack."
      - id: cy-1b2-b15
        type: mcq
        best: true
        q: "Switch logs show a new MAC address with a consumer wireless-router vendor prefix on a meeting-room port, and several unknown clients now appear behind it. Policy forbids unauthorized network devices. Which action BEST contains the risk right away?"
        choices:
          - "Send a technician to find and unplug the device"
          - "Add the device's MAC address to the switch's deny list"
          - "Run a vulnerability scan against the device and its clients"
          - "Administratively shut down that switch port"
        answer: 3
        why: "Shutting the port cuts the rogue device and everything behind it off at once, from the console, and affects only one meeting-room socket."
        whys:
          - "Has to happen next, but it takes time while the unknown clients stay connected."
          - "Quick, but a MAC address is easily changed and the port stays live."
          - "Tells the team about the device without removing it from the network."
          - "Best: immediate, certain and limited to the one port."
      - id: cy-1b2-b16
        type: mcq
        best: true
        q: "A web log shows these requests from one address, with status and response size: `/item?id=7'` 500 312; `/item?id=7 UNION SELECT null,null--` 500 318; `/item?id=7 UNION SELECT user,pass FROM users--` 200 48211. A normal item page is about 2,100 bytes. Which conclusion does the evidence BEST support?"
        choices:
          - "A scanner probed for SQL injection and every attempt failed"
          - "SQL injection succeeded and account data was probably returned"
          - "An attacker is still working out the column count and has no data yet"
          - "The application is faulty and is returning errors for odd input"
        answer: 1
        why: "The last request returned 200 with a response more than twenty times the normal size after selecting from the users table: the injection worked and data came back."
        whys:
          - "The first two requests failed, but the third returned 200 with a very large response."
          - "Best: a successful status and a 48 KB answer to a query on the users table point to data being returned."
          - "That describes the first two requests; the third is past that stage."
          - "The errors show poor input handling, but that does not explain the large successful response."
      - id: cy-1b2-b17
        type: mcq
        best: true
        q: "A cloud virtual machine is found mining cryptocurrency for an intruder. The team must cut the intruder off now and keep evidence, including what is in memory, for the investigation. Which response is BEST?"
        choices:
          - "Apply a security group that blocks all traffic, then snapshot the disk"
          - "Terminate the instance and deploy a replacement from the template"
          - "Stop the instance and take a snapshot of its disk afterwards"
          - "Leave it running untouched and watch its traffic for a day"
        answer: 0
        why: "Isolating a running instance cuts the intruder off while keeping memory intact for capture, and the snapshot preserves the disk."
        whys:
          - "Best: the intruder loses access, the disk is preserved and the instance stays up so memory can still be collected."
          - "Ends the activity, but destroys both the disk and the memory evidence."
          - "Keeps the disk, but stopping the instance discards what was in memory."
          - "Keeps all the evidence, but leaves the intruder in control, which the stem rules out."
      - id: cy-1b2-b18
        type: mcq
        best: true
        q: "Accounts payable nearly paid a fraudster who emailed new bank details from a lookalike of a supplier's domain. The lookalike domain had valid SPF and DKIM of its own. Which control BEST prevents this type of fraud from succeeding?"
        choices:
          - "Enforce a DMARC reject policy on the company's own domain"
          - "Tag every message from outside the company with a warning banner"
          - "Confirm bank-detail changes by calling a number already on file"
          - "Run yearly phishing awareness training for the finance team"
        answer: 2
        why: "The fraud succeeds at the moment the bank details are changed. An out-of-band check against known contact details stops it however convincing the email is."
        whys:
          - "Stops others spoofing the company's own domain; it does nothing about a lookalike domain that authenticates correctly."
          - "A useful prompt, but genuine supplier mail carries the same banner, so it does not single this message out."
          - "Best: the change is verified through a channel the fraudster does not control."
          - "Helps, but depends on someone spotting a one-character difference under time pressure."
      - id: cy-1b2-b19
        type: mcq
        best: true
        q: "An unknown executable is recovered from a server during what looks like a targeted intrusion. Its hash has no results on public services, the file may embed company data, and the team needs to know what it does when run. Which step is BEST?"
        choices:
          - "Upload the file to a public multi-engine scanning service"
          - "Run the strings utility and read the embedded text"
          - "Scan the file with the endpoint agent's current signatures"
          - "Detonate it in an isolated sandbox run in-house"
        answer: 3
        why: "Behaviour is learned by running the file. An in-house sandbox does that without publishing the sample, which could expose company data and tell the intruder it has been found."
        whys:
          - "Gives many verdicts, but shares the sample publicly: possible data exposure and a warning to the intruder."
          - "Safe and quick, but static text gives hints only, not what the file does when run."
          - "A signature verdict is unlikely for a file nobody has seen, and says little about behaviour."
          - "Best: it shows the file's behaviour while keeping the sample inside the company."
      - id: cy-1b2-b20
        type: mcq
        best: true
        q: "A community threat-intelligence pulse lists 500 IP addresses and domains for an active campaign. The source is rated medium confidence and some of the addresses belong to shared hosting providers. Which use of the indicators is BEST?"
        choices:
          - "Block all 500 at the perimeter firewall straight away"
          - "Load them into the SIEM to alert on and search past logs"
          - "Email the list to the analysts for reference during triage"
          - "Wait for a high-confidence source to confirm each one"
        answer: 1
        why: "Medium-confidence indicators that include shared hosting suit detection, not blocking: matching them against current and past logs gains the value without breaking legitimate traffic."
        whys:
          - "Fast protection, but shared-hosting addresses would block legitimate sites on medium-confidence data."
          - "Best: it finds past and present contact with the campaign and lets analysts confirm before anything is blocked."
          - "Gets the list seen, but relies on people remembering 500 entries."
          - "Avoids false positives, but throws away timely intelligence on an active campaign."
      - id: cy-1b2-b21
        type: mcq
        best: true
        q: "Malware is confirmed on one server. Analysis shows the group recompiles it for each victim host, so every copy has a different hash and its own controller address, but all copies share the same embedded configuration strings. Which is the BEST way to find the other infected hosts?"
        choices:
          - "Sweep endpoints with a YARA rule built on the shared strings"
          - "Search EDR telemetry for the hash of the recovered sample"
          - "Run a full antivirus scan on every server with current signatures"
          - "Block the sample's controller address and watch for hits"
        answer: 0
        why: "The only thing the copies have in common is the embedded strings, and matching content patterns across files is what YARA is for."
        whys:
          - "Best: it matches the one feature every copy shares."
          - "Quick, but each copy has a different hash, so it finds only the sample already in hand."
          - "Vendor signatures are unlikely to exist for builds made for this one victim."
          - "Each copy uses its own address, so only the known host would hit the block."
      - id: cy-1b2-b22
        type: mcq
        best: true
        q: "A 'repeated failed logon' rule fires 5,000 times a day for one service account. The cause is an old scheduled task on a single server that still uses the account's previous password. Which response is BEST?"
        choices:
          - "Exclude that service account from the rule"
          - "Raise the rule's threshold above 5,000 failures a day"
          - "Have the task's stored credential corrected or the task removed"
          - "Send the rule's alerts to a low-priority queue"
        answer: 2
        why: "The noise has a known, fixable cause. Fixing it removes the alerts and keeps the rule able to catch real password guessing against a service account."
        whys:
          - "Silences the noise, but blinds the SOC to real guessing against that account."
          - "Stops the alerts, but makes the rule useless for every other account as well."
          - "Best: it removes the cause, so the rule goes quiet without losing any coverage."
          - "Hides the noise, and real attacks on any account would sit unread in the same queue."
      - id: cy-1b2-b23
        type: mcq
        best: true
        q: "A two-person team can act on only one piece of intelligence this week. Which should it act on FIRST?"
        choices:
          - "A vendor blog about a group that targets a different industry"
          - "A list of controller addresses first seen fourteen months ago"
          - "An unverified forum claim of a zero-day in a product the company runs"
          - "An ISAC alert from yesterday on attacks against the mail gateway in use"
        answer: 3
        why: "Intelligence is worth acting on when it is timely, relevant and accurate. The ISAC alert is recent, concerns a product the company runs and comes from a trusted source."
        whys:
          - "Credible, but of low relevance: the group targets another industry."
          - "Relevant once, but stale; addresses change hands within months."
          - "Relevant and current, but unverified, so its accuracy is unknown."
          - "Best: timely, directly relevant and from a trusted sharing community."
      - id: cy-1b2-b24
        type: mcq
        best: true
        q: "An ATT&CK heat map of the SOC's detections shows dense coverage of initial access and almost none of lateral movement. Every intrusion reported in the company's sector this year spread through remote services after the first foothold. Where should detection engineering effort go FIRST?"
        choices:
          - "Deepening the initial-access detections that already work well"
          - "Lateral-movement techniques seen in the sector's intrusions"
          - "Every uncovered technique in the matrix, working left to right"
          - "A second commercial threat feed to enrich existing alerts"
        answer: 1
        why: "A heat map is for finding gaps; threat intelligence says which gap matters. The uncovered tactic that the sector's attackers actually use comes first."
        whys:
          - "Adds depth where coverage is already dense and leaves the known gap open."
          - "Best: it closes the gap that matches what attackers in this sector are doing."
          - "Complete in the end, but spends effort on techniques no relevant actor uses before the urgent gap."
          - "Enriches alerts, but cannot enrich a detection that does not exist."
      - id: cy-1b2-b25
        type: mcq
        best: true
        q: "An engineer who has resigned to join a competitor copies 40 times his usual volume of design files in his last week, using only access he legitimately holds. The files carry no classification labels. Which tool is MOST likely to flag this?"
        choices:
          - "UEBA comparing his activity with his own baseline"
          - "A DLP rule matching labelled or keyword-tagged documents"
          - "A network IDS with signatures for known attack traffic"
          - "A quarterly review of who has access to the design share"
        answer: 0
        why: "Nothing here breaks a rule: the access is legitimate and the files are unlabelled. What stands out is the change from his normal behaviour, which is what UEBA measures."
        whys:
          - "Best: 40 times his normal volume is a clear deviation from baseline."
          - "DLP needs labels or content patterns to match, and these files have none."
          - "Authorized file copies look nothing like attack traffic."
          - "Would confirm that he is entitled to the access; it says nothing about how he uses it."
      - id: cy-1b2-b26
        type: mcq
        best: true
        q: "A three-person SOC wants early warning of an intruder moving inside the network, with almost no false positives and little extra triage work. Which addition BEST fits?"
        choices:
          - "Lower thresholds on the existing SIEM lateral-movement rules"
          - "Full packet capture on the links between server VLANs"
          - "Decoy accounts and a decoy server nobody should touch"
          - "A wider set of IDS signatures on the internal sensors"
        answer: 2
        why: "Nobody has a legitimate reason to touch a decoy, so any use of one is a high-fidelity alert that costs a small team almost nothing to triage."
        whys:
          - "Catches more, but lower thresholds mean more false positives for three people."
          - "Excellent for investigation, but it alerts on nothing by itself and takes effort to use."
