        q: "While testing its own integration, a company finds that a partner's API returns other customers' records. The contract names a security contact at the partner. Which action is BEST?"
        choices:
          - "Disconnect the integration until the partner fixes the flaw"
          - "Publish an advisory so other customers can protect themselves"
          - "Report it privately to the partner's security contact"
          - "Pull more records to measure how much data is exposed"
        answer: 2
        why: "The flaw is the partner's to fix. Telling the named contact privately and promptly gets it fixed without exposing the data further."
