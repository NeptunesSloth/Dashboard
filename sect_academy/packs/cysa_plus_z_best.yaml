          - "Shows backlog, which depends on how much each team is tested."
      - id: cy-2b2-b23
        type: mcq
        best: true
        q: "Central scans of 10,000 hosts in 200 branches saturate the thin WAN links during the day, and backups use the links every night and at weekends. Weekly coverage of every host is still required. Which design is BEST?"
        choices:
          - "Throttle the central scanner until the links cope"
          - "Scan a 10% sample of branch hosts each week"
          - "Host agents that report results centrally"
          - "Scan each branch once a quarter in a planned window"
        answer: 2
        why: "Agents assess each host locally and send back only results, so the WAN carries a few kilobytes per host and every host is still covered weekly."
        whys:
          - "Protects the links, but a throttled scan of 10,000 hosts will not finish in a week."
          - "Light on the links, but 90% of hosts go unassessed each week."
          - "Best: full weekly coverage with almost no WAN traffic."
          - "Avoids the congestion, but misses the weekly requirement."
      - id: cy-2b2-b24
        type: mcq
        best: true
        q: "A deserialization flaw in a customer portal needs a code change that will take six weeks. The portal must stay online and the flaw is reachable from the internet. Which interim measure is BEST?"
        choices:
          - "Extra logging on the vulnerable endpoint, sent to the SIEM"
          - "A WAF rule blocking the exploit pattern on that endpoint"
          - "A documented risk acceptance until the fix is released"
          - "Taking the portal offline until the fix is released"
        answer: 1
        why: "When the real fix must wait and the service must stay up, a compensating control that blocks the attack path - a virtual patch - is the best interim measure."
        whys:
          - "Detective: it would record an exploit, not stop it."
          - "Best: it blocks the known attack path while the portal stays online."
          - "May be needed as paperwork, but alone it leaves the flaw open for six weeks."
          - "Removes the risk, but the stem says the portal must stay online."
      - id: cy-2b2-b25
        type: mcq
        best: true
        q: "A patch for an actively exploited flaw must go to 500 servers. The last urgent patch, pushed everywhere at once, caused an outage. Which deployment approach is BEST?"
        choices:
          - "Deploy to all 500 servers tonight to close the exposure"
          - "Patch a small pilot group first, then roll out in waves"
          - "Hold the patch for the next monthly maintenance cycle"
          - "Run three weeks of full regression testing first"
        answer: 1
        why: "A quick pilot followed by waves balances both risks: a bad patch is caught on a few servers, and the exposure is closed in days, not weeks."
        whys:
          - "Fastest, but repeats the approach that caused the last outage."
          - "Best: fast enough for an exploited flaw, with a check that limits the damage of a bad patch."
          - "Safe for stability, but leaves an actively exploited flaw open for weeks."
          - "Thorough, but far too slow while the flaw is being exploited."

  - id: cy-3b2
    title: "Best-answer practice: Incident Response and Management"
    domain: "3"
    goal: "I can choose the best next step, containment or recovery action in an incident when every option on offer is reasonable."
    notes: |
      In an incident nearly every option is something the team will do **eventually**. The question is which comes now.

      **What to look for in Domain 3**

      - **The phase.** Preparation, detection, analysis, containment, eradication, recovery, post-incident. Not yet confirmed? Validate. Confirmed and spreading? Contain. Contained? Remove the cause, then restore.
      - **Least disruptive containment that works.** Pull one node from the pool, block one protocol, sinkhole one domain - not "take everything down", unless nothing smaller stops it.
      - **How far the attacker got.** Domain administrator for weeks means rebuild and reset everything, and a backup taken inside the dwell time is not clean.
      - **Evidence.** Authorization before collection; preserve before it is overwritten; never destroy it to save an hour.
      - **Dependencies.** Restore what other systems need first.

      **Usual traps:** fixing an earlier stage the attacker has already passed; chasing addresses that change; cleaning in place after a deep compromise; retraining one user when the root cause is a missing control.
    items:
      - id: cy-3b2-b01
        type: mcq
        best: true
        q: "An intruder who entered through a phishing email three days ago is now compressing design files into archives on a file server and has begun uploading them to an outside address. Which action is the BEST immediate response?"
        choices:
          - "Reset the password of the user who was phished"
          - "Patch the flaw the intruder used to gain administrator rights"
          - "Send a phishing warning to all staff"
          - "Cut the file server's outbound access to the internet"
        answer: 3
        why: "The intruder is at the last stage - acting on objectives. The harm in progress is data leaving, so the first move is to stop the upload."
        whys:
          - "Needed, but it addresses a stage the intruder passed three days ago."
          - "Needed for eradication, but the intruder already holds the rights and the data is leaving now."
          - "Guards against the next phish; it does nothing about this theft."
          - "Best: it stops the data loss that is happening at this moment."
      - id: cy-3b2-b02
        type: mcq
        best: true
        q: "Responders find that an intruder created a scheduled task for persistence. Intelligence names the likely group. The team wants a structured list of other persistence methods this group is known to use, so it can hunt for them. Which resource is BEST?"
        choices:
          - "The Cyber Kill Chain's installation stage"
          - "MITRE ATT&CK's entry for the group"
          - "A Diamond Model drawing of this intrusion"
          - "The indicator list from the intelligence report"
        answer: 1
        why: "ATT&CK catalogues techniques by tactic and maps them to named groups, which is exactly a list of this group's known persistence methods."
        whys:
          - "Names the stage where persistence happens, but lists no specific techniques."
          - "Best: it lists the techniques attributed to the group, tactic by tactic."
          - "Relates adversary, capability, infrastructure and victim for this event; it is not a catalogue of techniques."
          - "Gives addresses and hashes to match, not the methods the group uses."
      - id: cy-3b2-b03
        type: mcq
        best: true
        q: "Last year's tabletop showed that managers know the plan. The incident lead now wants proof that responders can actually isolate hosts and restore systems with the real tools under time pressure. Which exercise is BEST?"
        choices:
          - "A hands-on simulation in a test environment"
          - "A second tabletop with a harder scenario"
          - "A walkthrough of the updated response plan"
          - "A vendor course on the EDR product"
        answer: 0
        why: "A tabletop tests decisions by discussion. Only a hands-on simulation shows whether people can carry out the technical steps with the tools."
        whys:
          - "Best: responders perform the real actions against the clock."
          - "Tests decisions again, still by talking, not doing."
          - "Confirms people have read the plan, not that they can execute it."
          - "Builds product skill, but does not test the team's own procedures under pressure."
      - id: cy-3b2-b04
        type: mcq
        best: true
        q: "During a peak sales day a web shell is found on one of six identical web servers behind a load balancer. The business will not accept taking the site down. Which containment is BEST?"
        choices:
          - "Block the attacker's source address at the perimeter firewall"
          - "Take the site offline until all six servers have been checked"
          - "Remove that server from the pool and isolate it"
          - "Delete the web shell and keep the server in service"
        answer: 2
        why: "The other five servers can carry the site. Removing and isolating the affected one contains it and preserves it for analysis with no outage."
        whys:
          - "Quick, but an attacker changes address in seconds and the shell remains."
          - "The most cautious choice, but the business has ruled out taking the site down."
          - "Best: the compromised server is cut off and kept as evidence while the site stays up."
          - "Removes one artefact, destroys evidence and leaves a server of unknown state serving customers."
      - id: cy-3b2-b05
        type: mcq
        best: true
        q: "A worm is spreading between workstations over SMB: 40 of 600 are infected and the number is rising every few minutes. Workstations never need to accept SMB connections from each other. Which containment is BEST?"
        choices:
          - "Block inbound SMB on all workstations by host firewall policy"
          - "Isolate each infected workstation through EDR as soon as it is found"
          - "Deploy the missing patch to all 600 workstations"
          - "Disconnect the site's WAN link to protect other sites"
        answer: 0
        why: "Blocking the one protocol the worm travels on, everywhere at once, stops the spread and costs nothing because workstations do not need it."
        whys:
          - "Best: it closes the worm's path on every workstation in one action, with no business impact."
          - "Correct for each host, but one at a time loses the race against a worm."
          - "The eventual fix, but patching 600 machines takes far longer than the worm does."
          - "Protects other sites, but the worm keeps spreading inside this one."
      - id: cy-3b2-b06
        type: mcq
        best: true
        q: "HR asks an analyst to collect a named employee's mailbox and browsing history for a misconduct case that may end in dismissal and a tribunal. What should the analyst do FIRST?"
        choices:
          - "Export the mailbox before the employee can delete anything"
          - "Hash and store the browsing logs for the last 90 days"
          - "Ask the employee's manager what they have noticed"
          - "Confirm written authorization and scope with legal and HR"
        answer: 3
        why: "Collecting an employee's data without clear authority and scope can breach privacy law and make the evidence unusable. Authorization comes before collection."
        whys:
          - "Will be done, but only once the analyst is authorized and knows the scope."
          - "Good evidence handling, but it is still collection before authorization."
          - "Risks tipping off the employee and is not the analyst's role."
          - "Best: it makes the collection lawful, bounded and defensible at a tribunal."
      - id: cy-3b2-b07
        type: mcq
        best: true
        q: "An intruder held domain administrator rights for three weeks before being contained. Twelve servers show signs of access. System backups are taken weekly and kept for a month. Which eradication approach for those servers is BEST?"
        choices:
          - "Remove the malicious files and tasks that the investigation identified"
          - "Rebuild from trusted media, then restore data that has been checked"
          - "Restore each server from last week's full system backup"
          - "Run a full antivirus scan with current signatures and clean what it finds"
        answer: 1
        why: "After weeks of full administrative control a server cannot be trusted, and last week's backup was taken while the intruder was inside. Only a rebuild from known-good media is clean."
        whys:
          - "Removes what was found; with three weeks of administrator access, there may be more that was not."
          - "Best: the system is known to be clean, and only verified data is brought back."
          - "Fast, but that backup was taken during the intrusion and may restore the intruder's persistence."
          - "Catches known malware only; an administrator's changes may not be malware at all."
      - id: cy-3b2-b08
        type: mcq
        best: true
        q: "After a ransomware attack every server must be restored. The order website earns the most revenue, and it, payroll and the file shares all authenticate against the directory service. Which should be restored FIRST?"
        choices:
          - "The public order website"
          - "The payroll system"
          - "The directory service"
          - "The file shares"
        answer: 2
        why: "Restoration order follows dependencies as well as value. Nothing else can authenticate until the directory service is back."
        whys:
          - "The highest earner, but it cannot work until the directory it authenticates against is running."
          - "Important, but it also depends on the directory service."
          - "Best: every other system on the list depends on it."
          - "Widely used, but again dependent on the directory service."
      - id: cy-3b2-b09
        type: mcq
        best: true
        q: "A rebuilt server is ready to leave isolation. The intruder got in through an unpatched remote-access service and a reused local administrator password. Which check is MOST important before it is reconnected?"
        choices:
          - "The asset inventory shows the new build date"
          - "Users have been told when service will resume"
          - "The patch is applied and the password is changed"
          - "The incident ticket has the rebuild steps recorded"
        answer: 2
        why: "Release from isolation follows verified remediation. If the way in is still open, the server will be compromised again as soon as it is reconnected."
        whys:
          - "Good record keeping, but it does not stop a second compromise."
          - "Courteous and useful, but not a security condition for reconnecting."
          - "Best: it confirms that both routes the intruder used are closed."
          - "Needed for the record, but it can be completed after the checks that matter."
      - id: cy-3b2-b10
        type: mcq
        best: true
        q: "An intruder logged in to the VPN with a password phished from one user. The root cause analysis names single-factor VPN login as the root cause. Which corrective action BEST addresses it?"
        choices:
          - "Require MFA for every VPN login"
          - "Retrain the user who entered the password"
          - "Block the phishing domain at the mail gateway"
          - "Alert on VPN logins from new countries"
        answer: 0
        why: "A corrective action should remove the root cause. With MFA, a phished password alone no longer opens the VPN, whoever is phished next."
        whys:
          - "Best: it removes the named root cause for every user."
          - "Helps one person; the next phished user opens the same door."
          - "Stops one campaign's domain; the next one uses another."
          - "Detective: it may spot the next misuse, but the door stays open."
      - id: cy-3b2-b11
        type: mcq
        best: true
        q: "An analyst is setting the severity of a confirmed intrusion on one server. Which finding does MOST to raise it?"
        choices:
          - "The malware belongs to a family seen in many organizations"
          - "The intruder connected from an address in another country"
          - "The server runs an operating system one version behind"
          - "The server holds 40,000 patient records and sent 3 GB out"
        answer: 3
        why: "Severity is driven by impact: the sensitivity and amount of data, and evidence that it left. Regulated records plus a large outbound transfer raises it most."
        whys:
          - "Useful for identifying the threat, but says little about the impact here."
          - "Worth noting, but the source address does not change what was harmed."
          - "A weakness to fix, not a measure of the damage done."
          - "Best: sensitive, regulated data and evidence of exfiltration define a high-impact incident."
      - id: cy-3b2-b12
        type: mcq
        best: true
        q: "An alert on host B on the 9th started the investigation. Analysis since has found the same malware on host A with a file creation time of the 3rd. The team needs the initial access vector. Which step is BEST next?"
        choices:
          - "Take a deeper forensic image of host B, where the first alert fired"
          - "Review host A's email, proxy and logon records around the 3rd"
          - "Interview the users of both hosts about anything unusual"
          - "Wait for the malware vendor report on the sample"
        answer: 1
        why: "The timeline now starts at host A on the 3rd. The way in is found by examining what happened on the earliest known host just before the earliest artefact."
        whys:
          - "Host B is where it was noticed, not where it began."
          - "Best: it looks at the earliest point in the timeline, where the entry must be."
          - "May add context, but memories of one day a week ago are weak evidence."
          - "Explains what the sample does, not how it arrived on host A."
      - id: cy-3b2-b13
        type: mcq
        best: true
        q: "A user reports that a laptop is slow and showed one pop-up. No security tool has alerted. What should the analyst do FIRST?"
        choices:
          - "Isolate the laptop from the network through EDR"
          - "Check the laptop's EDR telemetry for signs of compromise"
          - "Declare an incident and page the on-call incident manager"
          - "Arrange for the laptop to be reimaged"
        answer: 1
        why: "This is the detection and analysis stage: a vague report must be validated before it is treated as an incident."
        whys:
          - "A containment step; nothing yet shows there is anything to contain."
          - "Best: it establishes whether this is a security event at all, quickly and without disruption."
          - "Premature: one slow laptop and a pop-up meet no criterion for an incident."
          - "Destroys any evidence and costs the user a day, on no evidence of compromise."
      - id: cy-3b2-b14
        type: mcq
        best: true
        q: "In the last incident the IT director and the security manager gave responders conflicting instructions, and containment was delayed by an hour. Which preparation step BEST prevents a repeat?"
        choices:
          - "A shared chat channel for everyone involved in an incident"
          - "A tabletop exercise for the two managers"
          - "A longer contact list in the response plan"
          - "A named incident commander role in the response plan"
        answer: 3
        why: "Conflicting orders are a problem of undefined roles. The plan should say who has authority to direct the response."
        whys:
          - "Improves communication, but two people can still give opposite orders in one channel."
          - "Would expose the conflict again, but an exercise does not decide who is in charge."
          - "Helps reach people; it does not say who decides."
          - "Best: one defined role holds the authority, so instructions cannot conflict."
      - id: cy-3b2-b15
        type: mcq
        best: true
        q: "A suspected state-backed group is confirmed on three servers, and evidence suggests more footholds not yet found. There is no sign of data theft or damage in progress, and the incident lead has approved a short delay. Which approach to containment is BEST?"
        choices:
          - "Finish scoping quickly, then contain every foothold at once"
          - "Isolate the three known servers immediately"
          - "Block the three known controller addresses at the perimeter firewall now"
          - "Reset the passwords of all accounts used on the three servers now"
        answer: 0
        why: "Partial containment tells a capable adversary it has been seen while it still has other ways in. With no harm in progress and the lead's approval, scope first and then act everywhere together."
        whys:
          - "Best: the adversary loses all its access in one coordinated move."
          - "The normal reflex, but here it warns the group, which can dig in through footholds not yet found."
          - "Low disruption, but equally a warning, and other addresses are probably in use."
          - "Necessary later; done alone now it alerts the group and misses the unknown footholds."
      - id: cy-3b2-b16
        type: mcq
        best: true
        q: "A compromised payroll server must be back in service by tomorrow, and counsel says a prosecution is likely, so the evidence must be preserved intact. Which course of action BEST satisfies both?"
        choices:
          - "Reimage the server tonight after copying its log files"
          - "Keep payroll offline until the forensic work is finished"
          - "Preserve the server and bring up a clean replacement"
          - "Clean the server in place and record every step taken"
        answer: 2
        why: "The two needs stop conflicting when service is restored on a different system: the original stays untouched as evidence while a clean build takes over."
        whys:
          - "Restores service, but destroys the disk and memory evidence a prosecution needs."
          - "Protects the evidence, but misses tomorrow's deadline."
          - "Best: the evidence is kept intact and payroll runs on a system known to be clean."
          - "Alters the evidence and returns a server of doubtful integrity to service."
      - id: cy-3b2-b17
        type: mcq
        best: true
        q: "Malware on an unknown number of workstations finds its controller by resolving one domain; the address behind the domain changes every few hours. Which action BEST contains the malware and reveals which hosts are infected?"
        choices:
          - "Block the controller's current address at the firewall"
          - "Isolate the four workstations identified so far"
          - "Push new antivirus signatures to every workstation"
          - "Sinkhole the domain on the internal DNS servers"
        answer: 3
        why: "The domain is the fixed point. Answering it internally with a sinkhole address cuts every infected host off from the controller, and each host that asks identifies itself."
        whys:
          - "Works for a few hours, until the address changes."
          - "Right for those four, but the number infected is unknown."
          - "May clean some hosts, but neither cuts the channel now nor lists the infected."
          - "Best: one change breaks the channel for all hosts and logs every infected one."
      - id: cy-3b2-b18
        type: mcq
        best: true
        q: "A credential-harvesting email reached 30 mailboxes; four users have clicked so far, and their passwords are already being reset. Which action BEST stops more users from being caught?"
        choices:
          - "Remove the message from all 30 mailboxes"
          - "Send all staff a warning describing the email"
          - "Add the sender's address to the blocklist"
          - "Review the four users' recent sign-in activity"
        answer: 0
        why: "Twenty-six users still have the message. Removing it takes away the chance to click, without relying on anyone reading a warning."
        whys:
          - "Best: users cannot click a message that is no longer there."
          - "Helpful, but it depends on people reading it before they open the phish."
          - "Stops further copies from that sender; the 30 delivered copies remain."
          - "Needed to scope the damage for the four, but it protects nobody else."
      - id: cy-3b2-b19
        type: mcq
        best: true
        q: "A credential-dumping tool ran in memory on one server, leaving no file on disk. Three administrators had logged on to that server in the previous week. Which step tells the team MOST about how far the intrusion has spread?"
        choices:
          - "Search every endpoint for the tool's file hash"
          - "Take a full disk image of the server"
          - "Trace where those accounts have logged on since"
          - "Reverse engineer the tool from a memory capture"
        answer: 2
        why: "The intruder's gain is credentials, so the spread is wherever those credentials have been used. Following the accounts shows the scope."
        whys:
          - "The tool ran only in memory, so there is no file hash to find elsewhere."
          - "Preserves this server, but shows nothing about other systems."
          - "Best: it follows the stolen credentials to every system they have touched."
          - "Explains the tool, not where the intruder went with what it stole."
      - id: cy-3b2-b20
        type: mcq
        best: true
        q: "A critical alert fired at 02:00 and sat in a shared mailbox until staff arrived at 08:00. The SOC has no night shift and no budget for one. Which corrective action is BEST?"
        choices:
          - "A dashboard showing unread critical alerts"
          - "On-call paging with escalation if unacknowledged"
          - "A rule that analysts check the mailbox from home each night"
          - "A daily 08:00 review of overnight alerts"
        answer: 1
        why: "The alert was raised but reached nobody. Paging an on-call analyst, with escalation when there is no acknowledgement, gets a critical alert to a person at any hour without a night shift."
        whys:
          - "Shows the backlog, but only to someone who is looking at it."
          - "Best: the alert goes to a named person and keeps escalating until someone responds."
          - "Depends on habit and goodwill, with nothing to catch a missed night."
          - "Makes the morning review reliable, but the six-hour delay remains."
      - id: cy-3b2-b21
        type: mcq
        best: true
        q: "Forensics shows the intruder copied the Active Directory database (ntds.dit) from a domain controller. Three accounts are known to have been used by the intruder. Which credential action BEST completes eradication?"
        choices:
          - "Reset all account passwords and the krbtgt key twice"
          - "Reset the passwords of the three accounts known to have been used"
          - "Reset the passwords of all privileged accounts"
          - "Enforce MFA enrolment for all administrators"
        answer: 0
        why: "The database holds the password hashes of every account and the krbtgt key. All must be treated as stolen; krbtgt is reset twice so that forged tickets stop working."
        whys:
          - "Best: every credential in the stolen database is replaced, including the key used to forge tickets."
          - "Covers what was seen, but the intruder holds the hashes of every other account too."
          - "Covers the most valuable accounts, but leaves ordinary and service accounts and the krbtgt key compromised."
          - "Worth doing, but stolen hashes and forged tickets do not need to pass MFA prompts."
      - id: cy-3b2-b22
        type: mcq
        best: true
        q: "A new SOC has time to write one playbook this month, and management wants the largest immediate cut in handling time and mistakes. Over the past year 70% of its confirmed incidents were credential phishing; it has had no ransomware and no insider cases. Which playbook should be written FIRST?"
        choices:
          - "Ransomware on file servers"
          - "Insider theft of company data"
          - "Credential phishing"
          - "Denial of service on the website"
        answer: 2
        why: "A playbook pays back each time it is used. The stated goal is the largest immediate gain, and seven in ten incidents are credential phishing."
        whys:
          - "High impact and next in line, but it has not occurred and the goal is immediate gain."
          - "Serious when it happens, but there have been no cases."
          - "Best: it standardises the incident the SOC handles most often."
          - "Worth preparing, but nothing suggests it is frequent here."
      - id: cy-3b2-b23
        type: mcq
        best: true
        q: "An investigation into a slow, quiet intrusion will take weeks. The firewall keeps seven days of logs and overwrites the oldest; nothing forwards them elsewhere. What should the team do FIRST with those logs?"
        choices:
          - "Begin searching them on the firewall for the known indicators"
          - "Raise a change request to forward them to the SIEM"
          - "Ask the vendor whether the retention period can be extended"
          - "Export the current logs to protected storage and hash them"
        answer: 3
        why: "Evidence that is about to be overwritten is preserved first. Analysis and longer-term fixes can follow once a verified copy is safe."
        whys:
          - "Useful, but each day of searching in place is a day of the oldest evidence lost."
          - "The right long-term fix, but a change request does not save this week's logs."
          - "Might help future retention; today's logs keep rolling off meanwhile."
          - "Best: the evidence is secured, with a hash to show it has not changed."

  - id: cy-4b2
    title: "Best-answer practice: Reporting and Communication"
    domain: "4"
    goal: "I can choose the best report, metric, escalation or message for the audience in front of me when every option on offer is reasonable."
    notes: |
      Reporting questions offer four things that are all worth saying. The right one depends on **who is listening and what they must do next**.

      **What to look for in Domain 4**

      - **The audience.** Administrators need hosts and fixes; executives need impact, status and decisions; auditors need evidence mapped to a requirement.
      - **Who owns the decision.** Risk owners accept risk; the incident manager declares; legal and the communication plan govern contact with regulators, police, press and customers. An analyst escalates - and does not decide alone.
      - **Deadlines and duties.** A notification deadline is met with what is known, then updated.
      - **Honest numbers.** Rates beat raw counts; outcomes beat activity; a metric must answer the question asked.
      - **Need-to-know and safe channels** while an investigation is live.

      **Usual traps:** reassuring statements nobody has confirmed; recommendations with no owner or date; waiting for certainty before escalating; closing a finding because its owner asked.
    items:
      - id: cy-4b2-b01
        type: mcq
        best: true
        q: "Server administrators must act on this month's scan, which produced 9,000 findings across 400 hosts. Which report BEST serves them?"
        choices:
          - "A one-page summary of risk trends by business unit"
          - "The complete raw scanner export in a spreadsheet"
          - "Findings per host, ranked, with the fix for each"
          - "A scorecard of each team's SLA compliance"
        answer: 2
        why: "People who have to fix things need to know which host, which finding, in what order and what to do about it."
        whys:
          - "Right for executives; it tells an administrator nothing about what to change."
          - "Contains everything, but 9,000 unranked rows hide what matters."
          - "Best: it is organised around the work the administrators have to do."
          - "Shows managers how teams are performing, not which fixes to apply."
      - id: cy-4b2-b02
        type: mcq
        best: true
        q: "The board has five minutes for an update on an incident that is still being handled. Which content should the executive summary lead with to serve the board BEST?"
        choices:
          - "Business impact, current status and decisions needed"
          - "A minute-by-minute timeline of the intruder's actions"
          - "The indicators of compromise found so far"
          - "The tools and techniques the responders are using"
        answer: 0
