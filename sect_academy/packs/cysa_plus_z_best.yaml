  - id: cy-2b2
    title: "Best-answer practice: Vulnerability Management"
    domain: "2"
    goal: "I can choose the best scanning method, priority and treatment for a vulnerability when every option on offer is reasonable."
    notes: |
      Every choice here is a sensible thing to do with a vulnerability. The stem tells you which one fits **this** system and **this** business.

      **What to look for in Domain 2**

      - **Context beats the raw score.** Exposure (internet, internal, isolated), the value of the asset and whether the flaw is being exploited set the real priority. A "low" finding that exposes data outranks a "high" one that exposes nothing.
      - **Fix the class, not the instance.** A template, an image, a pipeline check or a coding standard beats 300 tickets.
      - **The control asked for.** If the stem says *prevent*, a weekly scan is detective. If it says *detective*, an approval step is not.
      - **When patching is impossible:** compensating control plus a dated exception signed by the risk owner - never a quiet closure.
      - **Scanning has a cost.** Load, credentials and reach all constrain the method.

      **Usual traps:** marking a mitigated true positive as false; moving the target instead of the process; treating "patch installed" as "flaw gone" without validation.
    items:
      - id: cy-2b2-b01
        type: mcq
        best: true
        q: "The vulnerability scanner's target list holds 400 hosts. DHCP and switch records for the same subnets show about 520 active devices. What should the vulnerability team do FIRST?"
        choices:
          - "Switch the 400 known hosts to deeper credentialed scans this week"
          - "Run a discovery scan and reconcile it with the inventory"
          - "Report on the 400 hosts and note the possible gap"
          - "Buy scanner licences to cover 520 devices"
        answer: 1
        why: "You cannot assess what you do not know you own. An accurate inventory comes before any decision about how to scan."
        whys:
          - "Improves depth on known hosts while about 120 devices remain unseen."
          - "Best: it establishes what is actually on the network, which every later step depends on."
          - "Honest, but it accepts a blind spot covering almost a quarter of the devices."
          - "May be needed, but only after discovery shows what the extra devices are."
      - id: cy-2b2-b02
        type: mcq
        best: true
        q: "Credentialed scans run with a domain administrator account whose password is typed into the scanner's settings. Auditors want the depth of credentialed scanning kept and the risk of that credential reduced. Which change is BEST?"
        choices:
          - "Switch to non-credentialed scans so no password is needed"
          - "Keep the account and alert on every logon it makes"
          - "Change the domain administrator password after each scan cycle"
          - "A dedicated least-privilege scan account held in a vault"
        answer: 3
        why: "The scanner needs to read configuration, not to administer the domain. A dedicated account with only those rights, released from a vault, keeps the depth and shrinks the risk."
        whys:
          - "Removes the credential, but gives up the depth the auditors want kept."
          - "Detective: misuse is noticed, but the credential is still a domain administrator."
          - "Limits how long a stolen password works, but it is still far more privilege than scanning needs."
          - "Best: the same scan depth with far less privilege and no password sitting in the settings."
      - id: cy-2b2-b03
        type: mcq
        best: true
        q: "An auto-scaling group launches cloud instances that live for about two hours, so the weekly network scan almost never sees them. Which method BEST finds vulnerabilities in these workloads?"
        choices:
          - "Scan the machine image in the build pipeline before release"
          - "Run the network scan daily instead of weekly"
          - "Scan one long-lived sample instance by hand whenever a team requests it"
          - "Run an external scan against the load balancer's address"
        answer: 0
        why: "Short-lived instances are copies of an image. Scanning the image before release assesses every instance that will ever run from it."
        whys:
          - "Best: one scan of the image covers every instance launched from it, before any of them runs."
          - "Sees more than a weekly scan, but still misses most two-hour instances."
          - "Gives a view of one instance, occasionally, and only when someone asks."
          - "Shows what the internet can reach, not what is installed on the instances."
      - id: cy-2b2-b04
        type: mcq
        best: true
        q: "A CIS benchmark scan shows the same 60 failed settings on all 300 Linux servers, which are built from one template and managed by a configuration management tool. Which remediation is BEST?"
