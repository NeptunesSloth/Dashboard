      - {id: ja2-14-c1, type: cloze, text: "あたま が いたい ___、 きょう は やすみます。", answer: "ので", l1: "I have a headache, so I'm taking today off.", alt: ["node", "から", "kara"], note: "Reason + ので / から."}
      - {id: ja2-14-c2, type: cloze, text: "たくさん べんきょう した ___、 しけん に おちました。", answer: "のに", l1: "Even though I studied a lot, I failed the exam.", alt: ["noni"], note: "のに = even though (disappointed)."}
      - {id: ja2-14-c3, type: cloze, text: "あめ ___ ので、 タクシー で いきます。", answer: "な", l1: "It's raining, so I'll take a taxi.", alt: ["na"], note: "Noun + な + ので."}
      - {id: ja2-14-c4, type: cloze, text: "___ ちこく しました か。", answer: "どうして", l1: "Why were you late?", alt: ["doushite", "dōshite", "なぜ", "naze", "なんで", "nande"], note: "どうして = why."}
