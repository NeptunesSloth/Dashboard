      - {id: ja2-01-shumi, type: vocab, l2: "しゅみ", rom: "shumi", l1: "hobby / pastime", alt: ["趣味"], ex: "わたし の しゅみ は テニス です。", ex_rom: "Watashi no shumi wa tenisu desu.", ex_l1: "My hobby is tennis.", note: "Kanji: 趣味."}
      - {id: ja2-01-koto, type: vocab, l2: "こと", rom: "koto", l1: "thing, matter (abstract); turns a verb into a noun", alt: ["事"], ex: "およぐ こと が すき です。", ex_rom: "Oyogu koto ga suki desu.", ex_l1: "I like swimming.", note: "A thing you can touch is もの. In this use こと is written in kana. Kanji: 事."}
      - {id: ja2-01-dekiru, type: vocab, l2: "できる", rom: "dekiru", l1: "to be able to / can (dictionary form)", alt: ["出来る"], ex: "スミスさん は にほんご が できます。", ex_rom: "Sumisu-san wa Nihongo ga dekimasu.", ex_l1: "Mr. Smith can speak Japanese.", note: "What you can do takes が. ます form: できます. Usually in kana."}
