          - {who: A, l2: "おてら が みたい です。 おいしい もの も たべたい です。", rom: "Otera ga mitai desu. Oishii mono mo tabetai desu.", l1: "I want to see temples. And I want to eat good food too.", alt: ["おてら を みたい です。 おいしい もの も たべたい です。", "Otera o mitai desu. Oishii mono mo tabetai desu.", "Otera wo mitai desu. Oishii mono mo tabetai desu."]}
          - {who: B, l2: "おてら なら、 きょうと の ほう が いい です よ。 でも、 たべもの は おおさか が いちばん です ね。", rom: "Otera nara, Kyouto no hou ga ii desu yo. Demo, tabemono wa Oosaka ga ichiban desu ne.", l1: "For temples, Kyoto is better. But for food, Osaka is the best."}
          - {who: A, l2: "きょうと から おおさか まで とおい です か。", rom: "Kyouto kara Oosaka made tooi desu ka.", l1: "Is it far from Kyoto to Osaka?", alt: ["きょうと と おおさか は とおい です か。", "Kyouto to Oosaka wa tooi desu ka.", "Kyōto kara Ōsaka made tōi desu ka.", "Kyouto to Oosaka ha tooi desu ka.", "Kyōto to Ōsaka wa tōi desu ka.", "Kyōto to Ōsaka ha tōi desu ka."]}
          - {who: B, l2: "いいえ、 でんしゃ で さんじゅっぷん ぐらい です。", rom: "Iie, densha de sanjuppun gurai desu.", l1: "No, it's about thirty minutes by train."}
          - {who: A, l2: "じゃ、 どちら も いきます。", rom: "Ja, dochira mo ikimasu.", l1: "Then I'll go to both.", alt: ["じゃあ、 どちら も いきます。", "Jaa, dochira mo ikimasu.", "じゃ、 りょうほう いきます。", "Ja, ryouhou ikimasu.", "Jā, dochira mo ikimasu.", "Ja, ryōhō ikimasu."]}

  # ───────────────────────────────────────────────────────────────── 18
  - id: ja2-18
    title: "Polite Japanese: recognising keigo"
    goal: "I can recognise common honorific and humble verbs, understand shop and office Japanese, and introduce myself politely at work."
    notes: |
      You already speak the middle level of politeness, です/ます. In shops, offices and announcements you will also hear **keigo**: special verbs that raise the other person (**honorific**, そんけいご) or lower yourself and your side (**humble**, けんじょうご). At this level the goal is to **understand** them; です/ます is always acceptable from a learner.

      | plain | honorific (others) | humble (me) |
      |---|---|---|
      | いる / いく / くる | **いらっしゃいます** | **おります** / **まいります** |
      | たべる / のむ | **めしあがります** | いただきます |
      | いう | **おっしゃいます** | **もうします** |
      | する | **なさいます** | **いたします** |
      | みる | **ごらんに なります** | はいけん します |
      | たずねる (visit), きく (ask) | — | **うかがいます** |
      | ある / です | — | **ございます** / で ございます |

      - **わたくし** is the formal "I".
      - Polite requests: お + [ます-stem] + **ください**: お**まち** ください (please wait).
      - Staff accepting an order: **かしこまりました** (certainly).
      - At work, people refer to their own boss *without* honorifics when talking to outsiders: たなか は いま せき を はずして おります — Tanaka is away from his desk.

      ## Introducing yourself at work
      スミス と **もうします**。 よろしく おねがい **いたします**。 Then hand over your **めいし** (business card) with both hands.
    items:
      - {id: ja2-18-k-kai, type: glyph, l2: "会", rom: "kai", l1: "meet; association (かい in 会社 かいしゃ and 会議 かいぎ; あ in 会う あう)", alt: ["a"]}
      - {id: ja2-18-k-sha, type: glyph, l2: "社", rom: "sha", l1: "company; shrine (しゃ in 会社 かいしゃ and 社長 しゃちょう; じゃ in 神社 じんじゃ)", alt: ["ja"]}
      - {id: ja2-18-k-in, type: glyph, l2: "員", rom: "in", l1: "member (いん in 会社員 かいしゃいん and 店員 てんいん)"}
      - {id: ja2-18-k-na, type: glyph, l2: "名", rom: "na", l1: "name (な in 名前 なまえ; めい in 名刺 めいし, a business card)", alt: ["mei"]}
      - {id: ja2-18-k-hou, type: glyph, l2: "方", rom: "hou", l1: "direction; side; person (ほう in A の方が, comparisons; かた in あの方 あのかた, that person, polite)", alt: ["kata", "hō"]}
      - {id: ja2-18-k-haji, type: glyph, l2: "始", rom: "haji", l1: "begin (はじ in 始まる はじまる and 始める はじめる; し in 開始 かいし, start)", alt: ["shi"]}
      - {id: ja2-18-k-o, type: glyph, l2: "終", rom: "o", l1: "end (お in 終わる おわる; しゅう in 終電 しゅうでん, the last train)", alt: ["shuu", "shū"]}
      - {id: ja2-18-irasshaimasu, type: vocab, l2: "いらっしゃいます", rom: "irasshaimasu", l1: "is / goes / comes (honorific, about others)", ex: "しゃちょう は いま かいぎしつ に いらっしゃいます。", ex_rom: "Shachou wa ima kaigishitsu ni irasshaimasu.", ex_l1: "The president is in the meeting room now.", note: "Honorific for いる, いく and くる. Shop greeting: いらっしゃいませ."}
      - {id: ja2-18-meshiagarimasu, type: vocab, l2: "めしあがります", rom: "meshiagarimasu", l1: "eats / drinks (honorific)", alt: ["召し上がります"], ex: "なに を めしあがります か。", ex_rom: "Nani o meshiagarimasu ka.", ex_l1: "What would you like to eat? (to a guest)", note: "Honorific for たべる and のむ. Kanji: 召し上がります."}
      - {id: ja2-18-osshaimasu, type: vocab, l2: "おっしゃいます", rom: "osshaimasu", l1: "says (honorific)", ex: "せんせい は あした やすみ だ と おっしゃいました。", ex_rom: "Sensei wa ashita yasumi da to osshaimashita.", ex_l1: "The teacher said that tomorrow is a holiday.", note: "Honorific for いう. Watch the small っ: o-s-sha-i-ma-su."}
      - {id: ja2-18-nasaimasu, type: vocab, l2: "なさいます", rom: "nasaimasu", l1: "does (honorific)", ex: "しゅうまつ は なに を なさいます か。", ex_rom: "Shuumatsu wa nani o nasaimasu ka.", ex_l1: "What do you do at weekends? (honorific)", note: "Honorific for する."}
      - {id: ja2-18-goran-ni-narimasu, type: vocab, l2: "ごらん に なります", rom: "goran ni narimasu", l1: "sees / looks at (honorific)", alt: ["ご覧になります"], ex: "こちら を ごらん ください。", ex_rom: "Kochira o goran kudasai.", ex_l1: "Please look at this. (formal)", note: "Honorific for みる. Request form: ごらん ください. Kanji: ご覧になります."}
      - {id: ja2-18-mairimasu, type: vocab, l2: "まいります", rom: "mairimasu", l1: "go / come (humble, about me)", alt: ["参ります"], ex: "あした また まいります。", ex_rom: "Ashita mata mairimasu.", ex_l1: "I will come again tomorrow.", note: "Announcements: でんしゃ が まいります (a train is coming). Kanji: 参ります."}
      - {id: ja2-18-orimasu, type: vocab, l2: "おります", rom: "orimasu", l1: "am / is (humble, about me or my side)", ex: "ちち は いま うち に おります。", ex_rom: "Chichi wa ima uchi ni orimasu.", ex_l1: "My father is at home now.", note: "Humble for いる; also 〜て おります for 〜て います."}
      - {id: ja2-18-moushimasu, type: vocab, l2: "もうします", rom: "moushimasu", l1: "say / am called (humble)", alt: ["申します", "mōshimasu"], ex: "わたくし は やまだ と もうします。", ex_rom: "Watakushi wa Yamada to moushimasu.", ex_l1: "My name is Yamada. (humble)", note: "Humble for いう. Kanji: 申します."}
      - {id: ja2-18-itashimasu, type: vocab, l2: "いたします", rom: "itashimasu", l1: "do (humble)", alt: ["致します"], ex: "あと で おでんわ いたします。", ex_rom: "Ato de odenwa itashimasu.", ex_l1: "I will call you later. (humble)", note: "Humble for する. Usually in kana."}
      - {id: ja2-18-ukagaimasu, type: vocab, l2: "うかがいます", rom: "ukagaimasu", l1: "visit; ask (humble)", alt: ["伺います"], ex: "らいしゅう そちら に うかがいます。", ex_rom: "Raishuu sochira ni ukagaimasu.", ex_l1: "I will visit you next week.", note: "Humble for たずねる (visit) and きく (ask). Kanji: 伺います."}
      - {id: ja2-18-gozaimasu, type: vocab, l2: "ございます", rom: "gozaimasu", l1: "there is / have (very polite あります)", ex: "エレベーター は あちら に ございます。", ex_rom: "Erebeetaa wa achira ni gozaimasu.", ex_l1: "The lift is over there.", note: "で ございます = very polite です: こちら で ございます."}
      - {id: ja2-18-watakushi, type: vocab, l2: "わたくし", rom: "watakushi", l1: "I (formal)", alt: ["私"], ex: "わたくし が ごあんない いたします。", ex_rom: "Watakushi ga goannai itashimasu.", ex_l1: "I will show you the way.", note: "The same kanji as わたし: 私."}
      - {id: ja2-18-kaigi, type: vocab, l2: "かいぎ", rom: "kaigi", l1: "meeting (at work)", alt: ["会議"], ex: "ごご さんじ から かいぎ が あります。", ex_rom: "Gogo sanji kara kaigi ga arimasu.", ex_l1: "There's a meeting from 3 p.m.", note: "Kanji: 会議."}
      - {id: ja2-18-kaigishitsu, type: vocab, l2: "かいぎしつ", rom: "kaigishitsu", l1: "meeting room", alt: ["会議室"], ex: "かいぎしつ は さんがい です。", ex_rom: "Kaigishitsu wa sangai desu.", ex_l1: "The meeting room is on the third floor.", note: "Kanji: 会議室."}
      - {id: ja2-18-shachou, type: vocab, l2: "しゃちょう", rom: "shachou", l1: "company president", alt: ["社長", "shachō"], ex: "しゃちょう は いま しゅっちょう ちゅう です。", ex_rom: "Shachou wa ima shutchou chuu desu.", ex_l1: "The president is away on business now.", note: "Also used as a form of address. Kanji: 社長."}
      - {id: ja2-18-meishi, type: vocab, l2: "めいし", rom: "meishi", l1: "business card", alt: ["名刺"], ex: "めいし を どうぞ。", ex_rom: "Meishi o douzo.", ex_l1: "Here is my card.", note: "Give and take it with both hands. Kanji: 名刺."}
      - {id: ja2-18-shucchou, type: vocab, l2: "しゅっちょう", rom: "shutchou", l1: "business trip (しゅっちょう する)", alt: ["出張", "shucchou", "shutchō", "shucchō"], ex: "らいしゅう おおさか へ しゅっちょう します。", ex_rom: "Raishuu Oosaka e shutchou shimasu.", ex_l1: "I'm going to Osaka on business next week.", note: "っ before ち is written t in rōmaji (shutchou); on a keyboard type c or t. Kanji: 出張."}
      - {id: ja2-18-shoushou-omachi, type: phrase, l2: "しょうしょう おまち ください。", rom: "Shoushou omachi kudasai.", l1: "One moment, please. (formal)", alt: ["少々お待ちください", "Shōshō omachi kudasai."], note: "しょうしょう = a little (formal). With kanji: 少々お待ちください"}
      - {id: ja2-18-kashikomarimashita, type: phrase, l2: "かしこまりました。", rom: "Kashikomarimashita.", l1: "Certainly. (staff accepting a request)", alt: ["畏まりました"], note: "A very polite わかりました. You will hear it in every shop and restaurant."}
      - {id: ja2-18-to-moushimasu, type: phrase, l2: "スミス と もうします。", rom: "Sumisu to moushimasu.", l1: "My name is Smith. (humble, at work)", alt: ["スミスと申します", "わたくし は スミス と もうします。", "Watakushi wa Sumisu to moushimasu.", "わたし は スミス と もうします。", "Watashi wa Sumisu to moushimasu.", "Sumisu to mōshimasu.", "Watakushi ha Sumisu to moushimasu.", "Watakushi wa Sumisu to mōshimasu.", "Watakushi ha Sumisu to mōshimasu.", "Watashi ha Sumisu to moushimasu.", "Watashi wa Sumisu to mōshimasu.", "Watashi ha Sumisu to mōshimasu."], note: "With kanji: スミスと申します"}
      - {id: ja2-18-onegai-itashimasu, type: phrase, l2: "よろしく おねがい いたします。", rom: "Yoroshiku onegai itashimasu.", l1: "I look forward to working with you. (very polite)", alt: ["よろしくお願いいたします", "よろしくお願い致します", "どうぞ よろしく おねがい いたします。", "Douzo yoroshiku onegai itashimasu.", "Dōzo yoroshiku onegai itashimasu."], note: "The humble form of よろしく おねがいします. With kanji: よろしくお願いいたします"}
      - {id: ja2-18-c1, type: cloze, text: "しゃちょう は いま かいぎしつ に ___。", answer: "いらっしゃいます", l1: "The president is in the meeting room now. (honorific)", alt: ["irasshaimasu"], note: "Honorific for いる."}
      - {id: ja2-18-c2, type: cloze, text: "どうぞ、 ___ ください。", answer: "めしあがって", l1: "Please, do have some. (honorific, offering food)", alt: ["meshiagatte", "召し上がって"], note: "Honorific for たべる: めしあがる → めしあがって."}
      - {id: ja2-18-c3, type: cloze, text: "あした、 そちら に ___。", answer: "うかがいます", l1: "I will visit you tomorrow. (humble)", alt: ["ukagaimasu", "伺います"], note: "Humble visit: うかがいます."}
      - {id: ja2-18-c4, type: cloze, text: "せんせい は なん と ___ か。", answer: "おっしゃいました", l1: "What did the teacher say? (honorific)", alt: ["osshaimashita"], note: "Honorific for いう."}
      - {id: ja2-18-c5, type: cloze, text: "トイレ は にかい に ___。", answer: "ございます", l1: "The toilets are on the second floor. (shop staff)", alt: ["gozaimasu"], note: "Very polite あります."}
      - {id: ja2-18-c6, type: cloze, text: "ちち は いま うち に ___。", answer: "おります", l1: "My father is at home now. (humble, on the phone)", alt: ["orimasu"], note: "Humble for いる, used for your own family."}
      - id: ja2-18-d-first-day
        type: dialogue
        title: "First day at the office"
        scene: "You are Smith, starting at a Japanese company. The section head, Ms. Mori, introduces you to the team."
        you: B
        lines:
          - {who: A, l2: "みなさん、 こちら は きょう から いっしょ に はたらく スミスさん です。", rom: "Minasan, kochira wa kyou kara issho ni hataraku Sumisu-san desu.", l1: "Everyone, this is Mr. Smith, who joins us from today."}
          - {who: B, l2: "はじめまして。 スミス と もうします。", rom: "Hajimemashite. Sumisu to moushimasu.", l1: "How do you do? My name is Smith.", alt: ["はじめまして。 わたくし は スミス と もうします。", "Hajimemashite. Watakushi wa Sumisu to moushimasu.", "はじめまして。 スミス です。", "Hajimemashite. Sumisu desu.", "Hajimemashite. Sumisu to mōshimasu.", "Hajimemashite. Watakushi ha Sumisu to moushimasu.", "Hajimemashite. Watakushi wa Sumisu to mōshimasu.", "Hajimemashite. Watakushi ha Sumisu to mōshimasu."]}
          - {who: A, l2: "スミスさん は ロンドン の ほんしゃ から いらっしゃいました。", rom: "Sumisu-san wa Rondon no honsha kara irasshaimashita.", l1: "Mr. Smith has come to us from the head office in London."}
          - {who: B, l2: "どうぞ よろしく おねがい いたします。", rom: "Douzo yoroshiku onegai itashimasu.", l1: "I look forward to working with you all.", alt: ["よろしく おねがい いたします。", "Yoroshiku onegai itashimasu.", "どうぞ よろしく おねがいします。", "Douzo yoroshiku onegaishimasu.", "よろしく おねがいします。", "Yoroshiku onegaishimasu.", "Dōzo yoroshiku onegai itashimasu.", "Dōzo yoroshiku onegaishimasu."]}
          - {who: A, l2: "スミスさん、 コーヒー を めしあがります か。", rom: "Sumisu-san, koohii o meshiagarimasu ka.", l1: "Mr. Smith, would you like some coffee?"}
          - {who: B, l2: "はい、 いただきます。", rom: "Hai, itadakimasu.", l1: "Yes, thank you, I'd love some.", alt: ["ありがとう ございます。 いただきます。", "Arigatou gozaimasu. Itadakimasu.", "はい、 おねがいします。", "Hai, onegaishimasu.", "Arigatō gozaimasu. Itadakimasu."]}
          - {who: A, l2: "それから、 ごご さんじ から かいぎ が ございます。 かいぎしつ は さんがい です。", rom: "Sorekara, gogo sanji kara kaigi ga gozaimasu. Kaigishitsu wa sangai desu.", l1: "Also, there is a meeting from 3 p.m. The meeting room is on the third floor."}
          - {who: B, l2: "かしこまりました。 さんがい です ね。", rom: "Kashikomarimashita. Sangai desu ne.", l1: "Certainly. The third floor, right?", alt: ["わかりました。 さんがい です ね。", "Wakarimashita. Sangai desu ne.", "はい、 わかりました。 さんがい です ね。", "Hai, wakarimashita. Sangai desu ne."]}
