        title: "Visiting a colleague's home"
        scene: "You are Smith, visiting your colleague Yamada's flat for the first time. She opens the door."
        you: B
        lines:
          - {who: A, l2: "いらっしゃい。 どうぞ、 はいって ください。", rom: "Irasshai. Douzo, haitte kudasai.", l1: "Welcome. Please come in."}
          - {who: B, l2: "おじゃまします。", rom: "Ojamashimasu.", l1: "Thank you. (said when entering someone's home)", alt: ["お邪魔します"]}
          - {who: A, l2: "どうぞ、 すわって ください。 コーヒー と おちゃ と、 どちら が いい です か。", rom: "Douzo, suwatte kudasai. Koohii to ocha to, dochira ga ii desu ka.", l1: "Please sit down. Which would you like, coffee or tea?"}
          - {who: B, l2: "おちゃ を おねがいします。", rom: "Ocha o onegaishimasu.", l1: "Tea, please.", alt: ["おちゃ を ください。", "Ocha o kudasai.", "おちゃ が いい です。", "Ocha ga ii desu.", "お茶をお願いします", "Ocha wo onegaishimasu.", "Ocha wo kudasai."]}
          - {who: A, l2: "はい、 どうぞ。 さとう は？", rom: "Hai, douzo. Satou wa?", l1: "Here you are. Sugar?"}
          - {who: B, l2: "いいえ、 けっこう です。", rom: "Iie, kekkou desu.", l1: "No, thank you.", alt: ["けっこう です。", "Kekkou desu.", "いいえ、 だいじょうぶ です。", "Iie, daijoubu desu.", "Iie, kekkō desu.", "Kekkō desu.", "Iie, daijōbu desu."]}
          - {who: A, l2: "あ、 さむい です か。 まど を しめましょう か。", rom: "A, samui desu ka. Mado o shimemashou ka.", l1: "Oh, are you cold? Shall I close the window?"}
          - {who: B, l2: "すみません、 しめて ください。", rom: "Sumimasen, shimete kudasai.", l1: "Sorry, yes, please close it.", alt: ["すみません、 おねがいします。", "Sumimasen, onegaishimasu.", "はい、 しめて ください。", "Hai, shimete kudasai."]}

  # ───────────────────────────────────────────────────────────────── 3
  - id: ja2-03
    title: "〜て いる: what is happening, how things are"
    goal: "I can say what someone is doing right now and describe states: where I live, whether I am married, what someone is wearing."
    notes: |
      [て-form] + **いる** (polite **います**) has two jobs.

      1. **An action in progress**: いま テレビ を み**て います** — I am watching TV now.
      2. **A state left by a change**: けっこん し**て います** — I am married (I married, and still am). おおさか に すん**で います** — I live in Osaka.

      | | means |
      |---|---|
      | すんで います | live (the place takes に) |
      | しって います | know (but: I don't know = **しりません**) |
      | けっこん して います | be married |
      | つとめて います | work for (the company takes に) |
      | きて います | be wearing (a shirt, a coat) |

      - Habits too: まいにち はしって います — I run every day (these days).
      - **まだ 〜て いません** = not yet: まだ たべて いません.
      - A verb can describe a noun from in front: めがね を かけて いる ひと — the person (who is) wearing glasses.

      ## Wearing
      Japanese chooses the verb by body part: **きる** for the top half or the whole body (シャツ, コート), **はく** for legs and feet (ズボン, くつ), **かぶる** for the head (ぼうし), **かける** for glasses, **する** for accessories (ネクタイ, とけい). Take off: **ぬぐ**.
    items:
      - {id: ja2-03-k-su, type: glyph, l2: "住", rom: "su", l1: "live, reside (す in 住む すむ; じゅう in 住所 じゅうしょ, address)", alt: ["juu", "jū"]}
      - {id: ja2-03-k-shi, type: glyph, l2: "知", rom: "shi", l1: "know (し in 知る しる; ち in 知人 ちじん, an acquaintance)", alt: ["chi"]}
      - {id: ja2-03-k-hatara, type: glyph, l2: "働", rom: "hatara", l1: "work (はたら in 働く はたらく; どう in 労働 ろうどう, labour)", alt: ["dou", "dō"]}
      - {id: ja2-03-k-ki, type: glyph, l2: "着", rom: "ki", l1: "wear; arrive (き in 着る きる, to wear; つ in 着く つく, to arrive)", alt: ["tsu"]}
      - {id: ja2-03-k-fuku, type: glyph, l2: "服", rom: "fuku", l1: "clothes (ふく in 服 ふく and 洋服 ようふく, Western clothes)"}
