  # ───────────────────────────────────────────────────────────────── 6
  - id: ja2-06
    title: "Plain form and casual speech"
    goal: "I can use the plain present, past and negative forms and chat casually with friends and family."
    notes: |
      With friends and family Japanese drops です and ます. The **plain forms** are also needed inside many patterns from here on.

      | | present | negative | past | past negative |
      |---|---|---|---|---|
      | る-verb | たべる | たべ**ない** | たべ**た** | たべ**なかった** |
      | う-verb | のむ | の**ま**ない | の**んだ** | の**ま**なかった |
      | い-adj | たかい | たか**くない** | たか**かった** | たか**くなかった** |
      | noun / な-adj | ひま **だ** | ひま **じゃない** | ひま **だった** | ひま **じゃなかった** |

      - **ない-form**: る-verbs drop る. う-verbs move to the あ-sound: の**ま**ない, か**か**ない. A final う becomes **わ**: か**わ**ない (かう), い**わ**ない (いう). する → **しない**, くる → **こない**, ある → **ない**.
      - **た-form**: take the て-form and swap て/で for た/だ: のんで → のん**だ**, いって → いっ**た**.
      - いい → **よかった** in the past.
      - In casual questions だ is dropped and the voice rises: ひま？ げんき？

      ## Casual talk
      | polite | casual |
      |---|---|
      | はい / いいえ | **うん** / **ううん** |
      | そう です か | **そう なんだ**, **そっか** |
      | 〜ます か | 〜る？ (rising): たべる？ |

      Use it with friends, family and children. With colleagues, strangers and anyone older, keep です/ます until they switch first.
    items:
