  # ───────────────────────────────────────────────────────────────── 11
  - id: ja2-11
    title: "Wants: ほしい, 〜たい, 〜たがる; shopping for clothes"
    goal: "I can say what I want, say what someone else seems to want, and shop for clothes by colour and size."
    notes: |
      ## Wanting things and wanting to do things
      | | for yourself | about someone else |
      |---|---|---|
      | a thing | [noun] **が ほしい です** | [noun] **を ほしがって います** |
      | an action | [ます-stem] **たい です** | [ます-stem] **たがって います** |

      - あたらしい くつ が ほしい です — I want new shoes.
      - いもうと は いぬ を ほしがって います — my sister wants a dog.
      - こども は ゲーム を し**たがって います** — the children want to play games.

      Japanese does not state another person's feelings as fact: you cannot see inside them, so you say they *show signs* of wanting (〜がる). And never ask a teacher or boss 〜たい です か or ほしい です か; offer instead: コーヒー は **いかが です か**.

      ## Colours
      | noun | い-adjective |
      |---|---|
      | あか | **あかい** red |
      | あお | **あおい** blue |
      | しろ | **しろい** white |
      | くろ | **くろい** black |
      | きいろ | **きいろい** yellow |
      | みどり | — green |
      A colour with no い-adjective takes の: みどり **の** シャツ.

      ## In a clothes shop
      **〜て みる** = try doing: きて みて も いい です か (may I try it on?). **〜の** stands in for a noun: もう すこし おおきい **の** (a slightly bigger one). Deciding: **これ に します**.
