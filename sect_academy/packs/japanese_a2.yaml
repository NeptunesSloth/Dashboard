id: japanese-a2
title: "Japanese — A2 Elementary"
kind: language
language: Japanese
lang: ja-JP
hall: tongues_west
blurb: "Carry on from A1: the dictionary, て-, plain, potential and volitional forms, casual speech, conditionals, giving and receiving and polite keigo, 300 everyday words and 130 more kanji."

units:
  # ───────────────────────────────────────────────────────────────── 1
  - id: ja2-01
    title: "Verbs in the dictionary form"
    goal: "I can turn a polite verb into its dictionary form and use it to say what I can do, what I do before something, and what my hobbies are."
    notes: |
      Every verb has a plain **dictionary form**: the form you look a verb up by, and the one used inside longer sentences. Verbs fall into three groups.

      | group | ます form | dictionary form |
      |---|---|---|
      | る-verbs | たべます, みます | たべ**る**, み**る** |
      | う-verbs | のみます, かきます, かいます, まちます, かえります | の**む**, か**く**, か**う**, ま**つ**, かえ**る** |
      | irregular | します, きます | **する**, **くる** |

      - **る-verbs**: drop ます, add る. Almost all end in *-iru* or *-eru*.
      - **う-verbs**: the い-sound before ます moves to the う-sound: み→む, き→く, い→う, ち→つ, り→る, し→す, び→ぶ, ぎ→ぐ.
      - A few *-iru / -eru* verbs are う-verbs: かえる (go home), はいる (enter), はしる (run), しる (know). The ます form gives them away: かえ**り**ます.

      ## Three patterns
      - [dictionary form] **こと が できます** — can: およぐ こと が できます.
      - [dictionary form] **まえ に** — before …ing: ねる まえ に.
      - しゅみ は [dictionary form] **こと です** — my hobby is …ing.

      こと turns a verb into a noun, like English *-ing*.

      ## Kanji
      Seven verbs you already use: 食べる, 飲む, 見る, 聞く, 読む, 書く, 話す. The kana after the kanji (べる, む, る …) is called *okurigana*; it changes as the verb changes.
    items:
