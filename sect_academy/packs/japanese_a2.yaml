  # ───────────────────────────────────────────────────────────────── 2
  - id: ja2-02
    title: "The て-form: please do"
    goal: "I can make the て-form of any verb, ask people politely to do things, and link actions in order."
    notes: |
      The **て-form** is the busiest verb form in Japanese: it joins sentences, makes requests, and builds a dozen patterns in this course. Make it from the dictionary form.

      | verb ends in | て-form | example |
      |---|---|---|
      | る (る-verbs) | て | たべる → たべ**て** |
      | う, つ, る | って | かう → か**って**, まつ → ま**って**, かえる → かえ**って** |
      | む, ぶ, ぬ | んで | のむ → の**んで**, あそぶ → あそ**んで** |
      | く | いて | かく → か**いて** |
      | ぐ | いで | およぐ → およ**いで** |
      | す | して | はなす → はな**して** |
      | irregular | | する → **して**, くる → **きて** |

      One exception to learn by heart: いく → **いって**.

      ## Please …
      [て-form] **ください** asks politely: まど を あけて ください. Add すみません、 before it and it is polite enough for anyone.

      ## And then …
      The て-form also strings actions together in order. Only the last verb shows the tense: ほん を か**って**、 うち へ かえり**ました** — I bought a book and went home.

      ## Visiting
      On entering someone's home say **おじゃまします** ("I'm disturbing you"). To turn down an offer politely: **いいえ、 けっこう です**.
