          - {who: B, l2: "てんきよほう で は、 ゆうがた から あめ だ そう です。", rom: "Tenkiyohou de wa, yuugata kara ame da sou desu.", l1: "The forecast says it will rain from this evening."}
          - {who: A, l2: "あした の てんき は どう です か。", rom: "Ashita no tenki wa dou desu ka.", l1: "What about tomorrow's weather?", alt: ["あした は どう です か。", "Ashita wa dou desu ka.", "Ashita no tenki ha dou desu ka.", "Ashita no tenki wa dō desu ka.", "Ashita no tenki ha dō desu ka.", "Ashita ha dou desu ka.", "Ashita wa dō desu ka.", "Ashita ha dō desu ka."]}
