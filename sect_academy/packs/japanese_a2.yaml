      - {id: ja2-14-zannen, type: vocab, l2: "ざんねん", rom: "zannen", l1: "a pity / disappointing (な-adjective)", alt: ["残念"], ex: "あした は いけません。 ざんねん です。", ex_rom: "Ashita wa ikemasen. Zannen desu.", ex_l1: "I can't go tomorrow. What a pity.", note: "Kanji: 残念."}
      - {id: ja2-14-tsukareru, type: vocab, l2: "つかれる", rom: "tsukareru", l1: "to get tired", alt: ["疲れる"], ex: "たくさん あるいて、 つかれました。", ex_rom: "Takusan aruite, tsukaremashita.", ex_l1: "I walked a lot and got tired.", note: "I'm tired (now) = つかれました or つかれて います. Kanji: 疲れる."}
      - {id: ja2-14-komaru, type: vocab, l2: "こまる", rom: "komaru", l1: "to be in trouble / to be stuck, at a loss", alt: ["困る"], ex: "みち が わからない ので、 こまりました。", ex_rom: "Michi ga wakaranai node, komarimashita.", ex_l1: "I didn't know the way, so I was stuck.", note: "こまって います = I'm in a fix. Kanji: 困る."}
      - {id: ja2-14-okureru, type: vocab, l2: "おくれる", rom: "okureru", l1: "to be late / to be delayed", alt: ["遅れる"], ex: "でんしゃ が じゅっぷん おくれました。", ex_rom: "Densha ga juppun okuremashita.", ex_l1: "The train was ten minutes late.", note: "Late for something: に おくれる. Kanji: 遅れる."}
      - {id: ja2-14-chikoku, type: vocab, l2: "ちこく", rom: "chikoku", l1: "lateness (for work or school) (ちこく する = to be late)", alt: ["遅刻"], ex: "けさ かいしゃ に ちこく しました。", ex_rom: "Kesa kaisha ni chikoku shimashita.", ex_l1: "I was late for work this morning.", note: "Kanji: 遅刻."}
      - {id: ja2-14-abunai, type: vocab, l2: "あぶない", rom: "abunai", l1: "dangerous (あぶない！ = look out!)", alt: ["危ない"], ex: "よる の こうえん は あぶない です。", ex_rom: "Yoru no kouen wa abunai desu.", ex_l1: "The park is dangerous at night.", note: "Kanji: 危ない."}
      - {id: ja2-14-ochiru, type: vocab, l2: "おちる", rom: "ochiru", l1: "to fail (an exam); to fall", alt: ["落ちる"], ex: "しけん に おちました。", ex_rom: "Shiken ni ochimashita.", ex_l1: "I failed the exam.", note: "The opposite of ごうかく する. る-verb. Kanji: 落ちる."}
      - {id: ja2-14-hayai, type: vocab, l2: "はやい", rom: "hayai", l1: "early; fast", alt: ["早い", "速い"], ex: "けさ は はやく おきました。", ex_rom: "Kesa wa hayaku okimashita.", ex_l1: "I got up early this morning.", note: "Early: 早い; fast: 速い. Adverb: はやく."}
      - {id: ja2-14-doushite, type: vocab, l2: "どうして", rom: "doushite", l1: "why", alt: ["dōshite"], ex: "どうして にほんご を べんきょう して います か。", ex_rom: "Doushite Nihongo o benkyou shite imasu ka.", ex_l1: "Why are you studying Japanese?", note: "The answer usually ends in 〜から です. Casual: なんで."}
      - {id: ja2-14-okureta-node, type: phrase, l2: "でんしゃ が おくれた ので、 ちこく しました。", rom: "Densha ga okureta node, chikoku shimashita.", l1: "I was late because the train was delayed.", alt: ["電車が遅れたので、遅刻しました", "でんしゃ が おくれた から、 ちこく しました。", "Densha ga okureta kara, chikoku shimashita.", "でんしゃ が おくれて、 ちこく しました。", "Densha ga okurete, chikoku shimashita."], note: "ので is the polite way to excuse yourself. With kanji: 電車が遅れたので、遅刻しました"}
      - {id: ja2-14-yokatta, type: phrase, l2: "よかった です ね。", rom: "Yokatta desu ne.", l1: "That's great! / I'm glad to hear it.", alt: ["良かったですね", "よかった！", "Yokatta!", "よかった ね。", "Yokatta ne."], note: "The past of いい: what you say to good news."}
      - {id: ja2-14-zannen-desu-ne, type: phrase, l2: "ざんねん です ね。", rom: "Zannen desu ne.", l1: "That's a shame. (sympathising)", alt: ["残念ですね", "それ は ざんねん です ね。", "Sore wa zannen desu ne.", "Sore ha zannen desu ne."], note: "For something worse: たいへん です ね (that must be hard). With kanji: 残念ですね"}
