      - {id: ja2-03-sumu, type: vocab, l2: "すむ", rom: "sumu", l1: "to live (in a place)", alt: ["住む"], ex: "とうきょう に すんで います。", ex_rom: "Toukyou ni sunde imasu.", ex_l1: "I live in Tokyo.", note: "Almost always すんで います; the place takes に. Kanji: 住む."}
      - {id: ja2-03-shiru, type: vocab, l2: "しる", rom: "shiru", l1: "to get to know (しって います = to know)", alt: ["知る"], ex: "たなかさん の でんわばんごう を しって います か。", ex_rom: "Tanaka-san no denwabangou o shitte imasu ka.", ex_l1: "Do you know Mr. Tanaka's phone number?", note: "An う-verb. Know = しって います; don't know = しりません. Kanji: 知る."}
