  # ───────────────────────────────────────────────────────────────── 16
  - id: ja2-16
    title: "Looks and seems: 〜そう, 〜よう, 〜みたい; weather and taste"
    goal: "I can say how things look or seem, talk about the weather and the forecast, and describe how food tastes."
    notes: |
      ## 〜そう です — looks (judging by what you see)
      | | rule | example |
      |---|---|---|
      | い-adjective | drop い | おいし**そう** (looks tasty) |
      | な-adjective | add そう | げんき**そう** (looks well) |
      | verb | ます-stem | ふり**そう** (looks like it'll rain) |
      - Two irregulars: いい → **よさそう**, ない → **なさそう**.
      - Before a noun add な: おいしそう **な** ケーキ.
      - Not for what is plain to see: an obviously pretty thing is きれい, not きれいそう.

      ## 〜よう です / 〜みたい です — it seems (from evidence)
      [plain form] + **よう です**; a noun takes **の よう**, a な-adjective **な よう**. **みたい** is the casual twin and follows nouns and な-adjectives directly:
      - だれ も いない **よう です** — there seems to be nobody in.
      - かぜ を ひいた **みたい** です — I seem to have caught a cold.
      - Both also mean "like": ゆめ **の よう** / ゆめ **みたい** — like a dream.

      ## Weather
      | | |
      |---|---|
      | はれ / くもり | sunny / cloudy |
      | あめ / ゆき が ふる | it rains / snows |
      | あめ が やむ | the rain stops |
      | すずしい / あたたかい | cool / warm |
      | むしあつい | hot and humid |

      ## Taste
      あまい (sweet), からい (spicy), にがい (bitter), しょっぱい (salty); for a drink or a thing to the touch, cold is **つめたい**, not さむい.
