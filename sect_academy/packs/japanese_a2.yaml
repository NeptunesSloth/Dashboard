  # ───────────────────────────────────────────────────────────────── 7
  - id: ja2-07
    title: "Experiences: 〜た こと が ある, 〜たり 〜たり"
    goal: "I can say what I have and have never done, and list some of the things I did on a trip."
    notes: |
      ## Have you ever …?
      [た-form] + **こと が あります** = "I have (at some time) …": すし を たべた **こと が あります**.
      - Never: 〜た こと が **ありません** (casual: ない). Never, not once: **いちど も** 〜た こと が ありません.
      - Ask: ふじさん に のぼった こと が あります か。
      - It is about experience in your life, not about one recent event. For yesterday, use the past: きのう すし を たべました.

      ## Doing things like …
      [た-form] + **り**, [た-form] + **り** + **します** gives a few examples out of more:
      - やすみ の ひ は ほん を よん**だり**、 えいが を み**たり** します — on my days off I read, watch films and so on.
      - The tense goes on the final する: 〜たり 〜たり **しました**.

      ## Travel words
      | | |
      |---|---|
      | りょこう する | to travel, go on a trip |
      | [mountain] に のぼる | to climb |
      | [hotel] に とまる | to stay (overnight) |
      | [vehicle] に のる | to ride, get on |
      | おみやげ | a gift brought back from a trip |

      Bringing **おみやげ** for colleagues and friends after a trip is close to obligatory in Japan: usually a box of local sweets to share.
    items:
