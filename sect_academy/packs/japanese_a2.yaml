  # ───────────────────────────────────────────────────────────────── 5
  - id: ja2-05
    title: "First this, then that: 〜て から, の まえ に, の あと で"
    goal: "I can describe my daily routine in order and say what I do before and after something."
    notes: |
      ## 〜て から — after doing
      [て-form] + **から** = "after …ing, (then)": シャワー を あびて **から**、 あさごはん を たべます.
      The plain て-form just lists steps in order. 〜て から stresses that the first action is finished *before* the second begins.

      ## Before and after a noun
      | | |
      |---|---|
      | [noun] **の まえ に** | before …: しょくじ の まえ に |
      | [noun] **の あと で** | after …: しごと の あと で |
      | [dictionary form] **まえ に** | before …ing (unit 1): ねる まえ に |

      ## About what time?
      **ごろ** after a time means "about": しちじ **ごろ** おきます. (For amounts, such as ten minutes, you will meet ぐらい.)

      ## Time words
      | | |
      |---|---|
      | ゆうがた | early evening (about 4–7 p.m.) |
      | こんばん | this evening, tonight |
      | ゆうべ | last night |
      | おととい / あさって | the day before yesterday / after tomorrow |
      | まいばん / まいしゅう | every evening / every week |

      ## Routine verbs
      シャワー を **あびる**, は を **みがく** (brush your teeth: は 歯 is a tooth), かお を **あらう**, **でかける** (go out), えき に **つく** (arrive), しごと が **はじまる / おわる**.
