      - {id: ja2-10-k-shi-serve, type: glyph, l2: "仕", rom: "shi", l1: "serve; do (し in 仕事 しごと)"}
      - {id: ja2-10-k-koto, type: glyph, l2: "事", rom: "koto", l1: "thing; matter (こと; ごと in 仕事 しごと; じ in 食事 しょくじ)", alt: ["goto", "ji"]}
