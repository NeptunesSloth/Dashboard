  # ───────────────────────────────────────────────────────────────── 8
  - id: ja2-08
    title: "Two at once: 〜ながら; free time"
    goal: "I can say that I do two things at the same time and talk about my free time and interests."
    notes: |
      ## 〜ながら — while
      Take the ます form, drop ます, add **ながら**: きき**ます** → きき**ながら**.
      - おんがく を **ききながら** はしります — I run while listening to music.
      - The main action is the **last** verb; the ながら action runs in the background.
      - Both actions belong to the same person.

      ## Talking about free time
      - **とき** (time, when) is a noun, so it follows the rules for nouns: ひま **な** とき (when I'm free), こども **の** とき (as a child), ねる とき (when I go to bed).
      - [verb] **の が すき です**: うたう **の が** すき です — I like singing. の turns a verb into a noun, like こと.
      - [thing] **に きょうみ が あります** — I'm interested in …
      - **どんな** + noun asks "what kind of …?": どんな おんがく が すき です か.

      | verb | used with |
      |---|---|
      | ひく | ピアノ, ギター |
      | する | ゲーム, スポーツ, サッカー, つり |
      | とる | しゃしん |
      | かく | え (a picture) |

      Note **え** (絵), a picture: the same sound as the particle へ (read *e*), but a different word.
