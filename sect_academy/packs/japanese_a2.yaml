  # ───────────────────────────────────────────────────────────────── 12
  - id: ja2-12
    title: "Musts: 〜なければ ならない, 〜なくても いい; health"
    goal: "I can say what I have to do and don't have to do, describe my symptoms at a clinic and understand simple advice."
    notes: |
      ## Have to: 〜なければ なりません
      Take the ない-form and swap ない for **なければ なりません**: のま**ない** → のま**なければ なりません** — I have to take (medicine).
      - 〜なければ いけません means the same.
      - In speech: 〜**なきゃ** (もう いかなきゃ — I've got to go).

      ## Don't have to: 〜なくても いい です
      ない → **なくても いい です**: あした は こ**なくても いい です** — you don't have to come tomorrow.

      ## Please don't: 〜ないで ください
      [ない-form] + **で ください**: むり を し**ないで ください** — please don't overdo it.

      ## At the doctor's
      | | |
      |---|---|
      | どう しました か | What seems to be the problem? |
      | [part] が いたい です | My … hurts |
      | ねつ が あります | I have a temperature |
      | せき が でます | I've got a cough |
      | かぜ を ひきました | I've caught a cold |
      | ぐあい が わるい です | I feel unwell |
      | おだいじに | Get well soon (to someone ill) |

      Medicine is drunk, even pills: くすり を **のむ**. Bring your ほけんしょう (health-insurance card) to every visit.
    items:
