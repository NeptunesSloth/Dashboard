  # ───────────────────────────────────────────────────────────────── 15
  - id: ja2-15
    title: "Giving and receiving: あげる, くれる, もらう"
    goal: "I can say who gave what to whom, thank people for favours, and offer or ask for help."
    notes: |
      Japanese has three verbs of giving, chosen by **direction**.
      | verb | direction | example |
      |---|---|---|
      | **あげる** | from me (or my side) outward | わたし は たなかさん **に** ほん を あげました |
      | **くれる** | from someone **to me** (or my family) | たなかさん が わたし **に** ほん を くれました |
      | **もらう** | I receive (from someone: に or から) | わたし は たなかさん **に** ほん を もらいました |

      - くれる only ever points towards you. *たなかさん が わたし に あげました* is wrong.
      - In くれる sentences わたし に is usually left out: たなかさん が ほん を くれました.

      ## Doing favours
      The same three verbs follow the て-form to talk about **favours**:
      - ともだち が しゅくだい を てつだって **くれました** — my friend (kindly) helped me with my homework.
      - せんせい に にほんご を なおして **もらいました** — I had my teacher correct my Japanese.
      - いもうと に えほん を よんで **あげました** — I read my sister a picture book.

      〜て あげる can sound patronising to the person helped; to offer help, say **〜ましょう か**: てつだいましょう か. To ask a favour: **〜て くれません か** (friends) or 〜て ください.

      Thanking for a favour: [て-form] **くれて ありがとう**.
