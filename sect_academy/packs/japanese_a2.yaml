  # ───────────────────────────────────────────────────────────────── 10
  - id: ja2-10
    title: "Plans: the volitional, 〜よう と おもう, 〜つもり"
    goal: "I can suggest doing something together and say what I am thinking of doing and what I plan to do."
    notes: |
      ## The volitional: let's (casual)
      | group | rule | example |
      |---|---|---|
      | る-verbs | る → **よう** | たべる → たべ**よう** |
      | う-verbs | う-sound → お-sound + **う** | いく → い**こう**, のむ → の**もう**, かう → か**おう** |
      | irregular | | する → **しよう**, くる → **こよう** |

      It is the casual version of 〜ましょう: いっしょ に いこう！ — Let's go together!

      ## I'm thinking of …
      [volitional] + **と おもって います**: らいねん にほん へ いこう と おもって います. Said with おもいます, it is a decision made just now: こんばん は すし を たべよう と おもいます.

      ## I intend to …
      [dictionary form] + **つもり です**: なつやすみ に りょこう する つもり です. Not planning to: [ない-form] + つもり です.
      つもり is firmer than 〜よう と おもう: the plan is made. Avoid asking a teacher or boss about their つもり; ask 〜ます か instead.

      ## I think that …
      [plain form] + **と おもいます** gives an opinion: にほんご は おもしろい と おもいます. After a noun or な-adjective add だ: いい まち だ と おもいます.

      ## Becoming
      [noun] **に なる** = to become: いしゃ に なりたい です.
    items:
      - {id: ja2-10-k-omo, type: glyph, l2: "思", rom: "omo", l1: "think (おも in 思う おもう; し in 意思 いし, intention)", alt: ["shi"]}
      - {id: ja2-10-k-shi-test, type: glyph, l2: "試", rom: "shi", l1: "test; try (し in 試験 しけん and 試合 しあい, a match)"}
      - {id: ja2-10-k-ken, type: glyph, l2: "験", rom: "ken", l1: "test; effect (けん in 試験 しけん and 経験 けいけん, experience)"}
      - {id: ja2-10-k-ben, type: glyph, l2: "勉", rom: "ben", l1: "effort (べん in 勉強 べんきょう)"}
