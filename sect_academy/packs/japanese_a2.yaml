      - {id: ja2-14-c6, type: cloze, text: "こども から でんわ が あって、 ___ しました。", answer: "あんしん", l1: "My child phoned, and I was relieved.", alt: ["anshin", "安心"], note: "あんしん する = to be relieved."}
      - id: ja2-14-d-late
        type: dialogue
        title: "Sorry I'm late"
        scene: "You are Smith. You arrive half an hour late to meet your friend Ms. Sato at a café."
        you: B
        lines:
          - {who: A, l2: "あ、 スミスさん！ どう した ん です か。 しんぱい しました よ。", rom: "A, Sumisu-san! Dou shita n desu ka. Shinpai shimashita yo.", l1: "Oh, Mr. Smith! What happened? I was worried."}
          - {who: B, l2: "すみません。 でんしゃ が おくれた ので、 ちこく しました。", rom: "Sumimasen. Densha ga okureta node, chikoku shimashita.", l1: "I'm sorry. The train was delayed, so I'm late.", alt: ["すみません。 でんしゃ が おくれた ので、 おそく なりました。", "Sumimasen. Densha ga okureta node, osoku narimashita.", "すみません。 でんしゃ が おくれました。", "Sumimasen. Densha ga okuremashita.", "ごめんなさい。 でんしゃ が おくれた ので、 ちこく しました。", "Gomennasai. Densha ga okureta node, chikoku shimashita."]}
          - {who: A, l2: "そう です か。 じこ です か。", rom: "Sou desu ka. Jiko desu ka.", l1: "I see. Was there an accident?"}
          - {who: B, l2: "わかりません。 でんしゃ が ぜんぜん うごきませんでした。", rom: "Wakarimasen. Densha ga zenzen ugokimasendeshita.", l1: "I don't know. The train didn't move at all.", alt: ["わかりません。 でんしゃ が うごきませんでした。", "Wakarimasen. Densha ga ugokimasendeshita."]}
          - {who: A, l2: "たいへん でした ね。 つかれた でしょう。", rom: "Taihen deshita ne. Tsukareta deshou.", l1: "What a pain. You must be tired."}
