  # ───────────────────────────────────────────────────────────────── 4
  - id: ja2-04
    title: "May I? Rules: 〜ても いい, 〜ては いけない"
    goal: "I can ask for and give permission, and understand what is not allowed in a museum, a temple or a car park."
    notes: |
      ## Permission: 〜て も いい です
      [て-form] + **も いい です** = "it is all right to …". As a question it asks permission:
      - しゃしん を とって **も いい です か**。 — May I take a photo?
      - ええ、 いい です よ。 / はい、 どうぞ。 — Yes, go ahead.
      - To refuse: **すみません、 ちょっと…** or **すみません、 だめ です**.

      ## Prohibition: 〜て は いけません
      [て-form] + **は いけません** = "you must not …": ここ で たばこ を すって **は いけません**.
      | | |
      |---|---|
      | 〜て も いい です か | may I …? |
      | 〜て も いい です | you may … |
      | 〜て は いけません | you must not … |
      | 〜て は だめ です | (in speech) you can't … |

      In casual speech て は shrinks to **ちゃ**: さわっちゃ だめ！

      ## Opening and closing
      Japanese has pairs of verbs: one for doing it to something (with を), one for it happening by itself (with が).
      | someone does it | it happens |
      |---|---|
      | ドア **を** あける | ドア **が** あく |
      | ドア **を** しめる | ドア **が** しまる |

      ## Places
      **〜や** is a shop (ほんや, パンや), **〜かん** a large building (びじゅつかん, はくぶつかん), **〜しつ** a room (きょうしつ). Signs say 禁煙 (no smoking) and 撮影禁止 (no photographs).
