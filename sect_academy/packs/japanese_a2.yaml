  # ───────────────────────────────────────────────────────────────── 13
  - id: ja2-13
    title: "If and when: 〜たら, 〜ば, 〜と; finding the way"
    goal: "I can give and follow directions and say what happens if or when something happens."
    notes: |
      ## 〜たら — if / when (the all-rounder)
      [た-form] + **ら**: えき に つい**たら** でんわ して ください — call me when you get to the station. あめ が ふっ**たら** いきません — if it rains, I won't go. When in doubt, use たら.

      ## 〜ば — if (the condition)
      | | rule | example |
      |---|---|---|
      | verbs | う-sound → え-sound + **ば** | いく → いけ**ば**, たべる → たべれ**ば**, する → すれ**ば** |
      | い-adj | い → **ければ** | やすい → やす**ければ** |
      Common in advice: どう すれ**ば** いい です か — what should I do?

      ## 〜と — whenever, and then (automatic results)
      [dictionary form] + **と**: はし を わたる **と**、 こうえん が あります — cross the bridge and there's a park. Use it for directions, machines and nature, never for requests or wishes.

      ## Directions
      | | |
      |---|---|
      | まっすぐ いく | go straight |
      | [corner] を みぎ に まがる | turn right at … |
      | はし を わたる | cross the bridge |
      | ふたつめ の かど | the second corner |
      | つきあたり | the end of the road |

      The route or the corner takes **を**; the direction takes **に**. Stations name their exits by compass point: ひがしぐち, にしぐち, みなみぐち, きたぐち.
    items:
      - {id: ja2-13-k-michi, type: glyph, l2: "道", rom: "michi", l1: "road; way (みち; どう in 北海道 ほっかいどう)", alt: ["dou", "dō"]}
      - {id: ja2-13-k-migi, type: glyph, l2: "右", rom: "migi", l1: "right (みぎ; う in 右折 うせつ, a right turn)", alt: ["u"]}
      - {id: ja2-13-k-hidari, type: glyph, l2: "左", rom: "hidari", l1: "left (ひだり; さ in 左折 させつ, a left turn)", alt: ["sa"]}
      - {id: ja2-13-k-eki, type: glyph, l2: "駅", rom: "eki", l1: "station (えき; on signs: 東京駅 とうきょうえき)"}
