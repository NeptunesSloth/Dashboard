      - {id: ja2-01-k-no, type: glyph, l2: "飲", rom: "no", l1: "drink (の in 飲む のむ; いん in 飲食 いんしょく, food and drink)", alt: ["in"]}
      - {id: ja2-01-k-mi, type: glyph, l2: "見", rom: "mi", l1: "see; look (み in 見る みる; けん in 見学 けんがく, a study visit)", alt: ["ken"]}
      - {id: ja2-01-k-ki, type: glyph, l2: "聞", rom: "ki", l1: "hear; ask (き in 聞く きく; ぶん in 新聞 しんぶん)", alt: ["bun"]}
      - {id: ja2-01-k-yo, type: glyph, l2: "読", rom: "yo", l1: "read (よ in 読む よむ; どく in 読書 どくしょ, reading)", alt: ["doku"]}
      - {id: ja2-01-k-ka, type: glyph, l2: "書", rom: "ka", l1: "write (か in 書く かく; しょ in 辞書 じしょ)", alt: ["sho"]}
