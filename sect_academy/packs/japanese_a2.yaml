  # ───────────────────────────────────────────────────────────────── 14
  - id: ja2-14
    title: "Because and although: から, ので, のに; feelings"
    goal: "I can give reasons, apologise with an explanation, react to good and bad news, and say how I feel."
    notes: |
      ## から and ので — because
      Both follow the reason: [reason] から / ので、 [result].
      | | after a verb or い-adjective | after a noun or な-adjective |
      |---|---|---|
      | から | さむい から | あめ **だ** から |
      | ので | さむい ので | あめ **な** ので |
      - **から** is direct; good for your own choices and for requests: あぶない から、 さわらないで.
      - **ので** sounds softer and more objective: use it for excuses and apologies. でんしゃ が おくれた **ので**、 ちこく しました.
      - Either can follow です/ます in polite speech: いそがしい です から.
      - Asking why: **どうして** (casual: なんで).

      ## のに — even though (and I'm not happy about it)
      [plain form] + **のに** (な-adjective and noun + **な のに**): たくさん べんきょう した **のに**、 しけん に おちました — I studied hard and still failed. It carries surprise or frustration; for a neutral "but" use が or でも.

      ## Feelings
      うれしい (glad), かなしい (sad), さびしい (lonely), こわい (scary, scared), しんぱい (worried), あんしん (relieved). These describe **your own** feelings; for someone else's, see 〜がる (unit 11) and 〜そう (unit 16).

      ## Reacting
      | news | you say |
      |---|---|
      | good | **よかった です ね** |
      | bad | **ざんねん です ね**, **たいへん です ね** |
    items:
      - {id: ja2-14-k-yasu, type: glyph, l2: "安", rom: "yasu", l1: "cheap; peaceful (やす in 安い やすい; あん in 安心 あんしん, relief)", alt: ["an"]}
      - {id: ja2-14-k-shin, type: glyph, l2: "心", rom: "shin", l1: "heart; mind (しん in 安心 あんしん and 心配 しんぱい; こころ on its own)", alt: ["kokoro"]}
      - {id: ja2-14-k-waru, type: glyph, l2: "悪", rom: "waru", l1: "bad (わる in 悪い わるい; あく in 最悪 さいあく, the worst)", alt: ["aku"]}
      - {id: ja2-14-k-haya, type: glyph, l2: "早", rom: "haya", l1: "early (はや in 早い はやい; そう in 早朝 そうちょう, early morning)", alt: ["sou", "sō"]}
      - {id: ja2-14-k-iso, type: glyph, l2: "急", rom: "iso", l1: "hurry; sudden (いそ in 急ぐ いそぐ; きゅう in 急行 きゅうこう, an express train)", alt: ["kyuu", "kyū"]}
      - {id: ja2-14-k-chika, type: glyph, l2: "近", rom: "chika", l1: "near (ちか in 近い ちかい and 近く ちかく; きん in 近所 きんじょ, the neighbourhood)", alt: ["kin"]}
      - {id: ja2-14-k-too, type: glyph, l2: "遠", rom: "too", l1: "far (とお in 遠い とおい; えん in 遠足 えんそく, a school outing)", alt: ["en", "tō"]}
      - {id: ja2-14-ureshii, type: vocab, l2: "うれしい", rom: "ureshii", l1: "glad / happy (about something that happened)", alt: ["嬉しい"], ex: "しけん に ごうかく して、 とても うれしい です。", ex_rom: "Shiken ni goukaku shite, totemo ureshii desu.", ex_l1: "I passed the exam and I'm really happy.", note: "Your own feelings. Kanji: 嬉しい."}
      - {id: ja2-14-kanashii, type: vocab, l2: "かなしい", rom: "kanashii", l1: "sad", alt: ["悲しい"], ex: "かなしい えいが を みて、 なきました。", ex_rom: "Kanashii eiga o mite, nakimashita.", ex_l1: "I watched a sad film and cried.", note: "なく = to cry. Kanji: 悲しい."}
      - {id: ja2-14-sabishii, type: vocab, l2: "さびしい", rom: "sabishii", l1: "lonely; missing someone", alt: ["寂しい"], ex: "ひとり で すんで いる ので、 ときどき さびしい です。", ex_rom: "Hitori de sunde iru node, tokidoki sabishii desu.", ex_l1: "I live on my own, so I sometimes get lonely.", note: "Kanji: 寂しい."}
      - {id: ja2-14-kowai, type: vocab, l2: "こわい", rom: "kowai", l1: "scary; scared", alt: ["怖い"], ex: "この いぬ は ちょっと こわい です。", ex_rom: "Kono inu wa chotto kowai desu.", ex_l1: "This dog is a bit scary.", note: "The same word for the thing and the feeling. Kanji: 怖い."}
      - {id: ja2-14-shinpai, type: vocab, l2: "しんぱい", rom: "shinpai", l1: "worry; worried (しんぱい する = to worry)", alt: ["心配"], ex: "こども が まだ かえらない ので、 しんぱい です。", ex_rom: "Kodomo ga mada kaeranai node, shinpai desu.", ex_l1: "My child isn't home yet, so I'm worried.", note: "Kanji: 心配."}
