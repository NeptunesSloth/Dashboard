        title: "Visiting a colleague's home"
        scene: "You are Smith, visiting your colleague Yamada's flat for the first time. She opens the door."
        you: B
        lines:
          - {who: A, l2: "いらっしゃい。 どうぞ、 はいって ください。", rom: "Irasshai. Douzo, haitte kudasai.", l1: "Welcome. Please come in."}
          - {who: B, l2: "おじゃまします。", rom: "Ojamashimasu.", l1: "Thank you. (said when entering someone's home)", alt: ["お邪魔します"]}
          - {who: A, l2: "どうぞ、 すわって ください。 コーヒー と おちゃ と、 どちら が いい です か。", rom: "Douzo, suwatte kudasai. Koohii to ocha to, dochira ga ii desu ka.", l1: "Please sit down. Which would you like, coffee or tea?"}
