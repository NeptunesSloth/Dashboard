      - {id: ja2-13-k-nishi, type: glyph, l2: "西", rom: "nishi", l1: "west (にし; せい in 西洋 せいよう, the West; さい in 関西 かんさい)", alt: ["sei", "sai"]}
      - {id: ja2-13-k-minami, type: glyph, l2: "南", rom: "minami", l1: "south (みなみ; なん in 南米 なんべい, South America)", alt: ["nan"]}
      - {id: ja2-13-k-kita, type: glyph, l2: "北", rom: "kita", l1: "north (きた; ほく in 東北 とうほく; ほっ in 北海道 ほっかいどう)", alt: ["hoku"]}
