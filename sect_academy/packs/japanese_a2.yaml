          - {who: B, l2: "いい です ね。 たのしんで きて ください。", rom: "Ii desu ne. Tanoshinde kite kudasai.", l1: "Lovely. Have a great time."}

  # ───────────────────────────────────────────────────────────────── 17
  - id: ja2-17
    title: "Comparing and counting"
    goal: "I can compare two or more things, say which I like best, and count floors, books, machines, animals and drinks."
    notes: |
      ## Comparing two
      - A は B **より** [adjective] です — A is more … than B: とうきょう は おおさか より おおきい です.
      - Ask: A **と** B **と どちら が** [adjective] です か.
      - Answer: A **の ほう が** [adjective] です (you can add B より: B より A の ほう が …).
      The adjective never changes: Japanese has no "-er".

      ## The most
      [group] **の なか で** [X] **が いちばん** [adjective] です: くだもの の なか で りんご が いちばん すき です. The question word matches the group: なに (things), どこ (places), だれ (people), いつ (times, seasons).

      ## Counters
      | counter | for | 1 | 3 | how many? |
      |---|---|---|---|---|
      | 〜かい / がい | floors | いっかい | さんがい | なんがい |
      | 〜さつ | books, magazines | いっさつ | さんさつ | なんさつ |
      | 〜だい | cars, machines | いちだい | さんだい | なんだい |
      | 〜ひき | small animals, fish | いっぴき | さんびき | なんびき |
      | 〜はい | cups, glasses, bowls | いっぱい | さんばい | なんばい |
      | 〜かい | times | いっかい | さんかい | なんかい |

      Watch the sound changes after 1, 3, 6, 8 and 10: ろっぴき, はっぴき, じゅっぴき. In Japan the ground floor is いっかい, the first floor.

      **ぐらい** after an amount means "about": さんじゅっぷん ぐらい.
    items:
      - {id: ja2-17-k-haru, type: glyph, l2: "春", rom: "haru", l1: "spring (はる; しゅん in 春分 しゅんぶん, the spring equinox)", alt: ["shun"]}
      - {id: ja2-17-k-natsu, type: glyph, l2: "夏", rom: "natsu", l1: "summer (なつ; also in 夏休み なつやすみ)"}
      - {id: ja2-17-k-aki, type: glyph, l2: "秋", rom: "aki", l1: "autumn (あき; しゅう in 秋分 しゅうぶん, the autumn equinox)", alt: ["shuu", "shū"]}
      - {id: ja2-17-k-fuyu, type: glyph, l2: "冬", rom: "fuyu", l1: "winter (ふゆ; とう in 冬季 とうき, the winter season)", alt: ["tou", "tō"]}
      - {id: ja2-17-k-oo, type: glyph, l2: "多", rom: "oo", l1: "many (おお in 多い おおい; た in 多分 たぶん, probably)", alt: ["ta", "ō"]}
      - {id: ja2-17-k-suko, type: glyph, l2: "少", rom: "suko", l1: "few; a little (すこ in 少し すこし; すく in 少ない すくない; しょう in 少年 しょうねん, a boy)", alt: ["suku", "shou", "shō"]}
