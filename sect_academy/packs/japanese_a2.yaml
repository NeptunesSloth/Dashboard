  # ───────────────────────────────────────────────────────────────── 9
  - id: ja2-09
    title: "Can do: the potential form"
    goal: "I can say what I can and cannot do: languages, skills, and what is possible in a place."
    notes: |
      ## Making the potential form
      | group | rule | example |
      |---|---|---|
      | る-verbs | る → **られる** | たべる → たべ**られる**, みる → み**られる** |
      | う-verbs | う-sound → え-sound + **る** | かく → か**ける**, のむ → の**める**, はなす → はな**せる**, かう → か**える** |
      | irregular | | する → **できる**, くる → **こられる** |

      The result is itself a る-verb: かけ**ます**, かけ**ません**, かけ**た**.

      - The thing you can do usually takes **が** instead of を: にほんご **が** はなせます. (を is heard too.)
      - In speech, る-verbs often drop ら: たべれる, みれる. You will hear it; write られる.
      - [dictionary form] こと が できる (unit 1) means the same and sounds a little more formal.
      - With a noun, just use できる: うんてん が できます, テニス が できます.

      ## Seeing and hearing
      **みえる** (be visible) and **きこえる** (be audible) are not potential forms. They say that something can be seen or heard naturally: ここ から うみ が みえます — you can see the sea from here. みられる means you have the chance to see it: あの えいが は えいがかん で みられます.

      ## Kanji
      Four kanji combine into everyday words: 自転車 (bicycle, "self-turning vehicle"), 自動車 (motor car), 運転 (driving), 電車 (train).
    items:
      - {id: ja2-09-k-un, type: glyph, l2: "運", rom: "un", l1: "carry; luck (うん in 運転 うんてん and 運動 うんどう)"}
      - {id: ja2-09-k-ten, type: glyph, l2: "転", rom: "ten", l1: "turn; roll (てん in 運転 うんてん and 自転車 じてんしゃ)"}
      - {id: ja2-09-k-kuruma, type: glyph, l2: "車", rom: "kuruma", l1: "car; vehicle (くるま; しゃ in 電車 でんしゃ and 自転車 じてんしゃ)", alt: ["sha"]}
