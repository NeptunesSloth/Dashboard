  # ---------------------------------------------------------------- 13
  - id: es-b2-13
    title: "Dear Sir or Madam: register, formal letters and discourse markers"
    goal: "I can choose between tú and usted, write a formal e-mail or letter, and structure an argument with connectors."
    notes: |
      **Tú or usted?** Spain uses *tú* with almost everyone of your age and in most workplaces; keep *usted* for older strangers, officials, customers and formal writing. Much of Latin America uses *usted* more widely. When unsure, start with *usted* and let the other person offer: *¿Nos tuteamos?* (Argentina, Uruguay and much of Central America say *vos* instead of *tú*.)

      **A formal e-mail**

      - Opening: *Estimado señor Ruiz:* / *Estimada señora:* — a **colon**, not a comma.
      - Purpose: *Le escribo para… / Me dirijo a usted para…*
      - Request: *Le agradecería que* + imperfect subjunctive.
      - Attachments: *Adjunto le envío…*
      - Close: *Quedo a la espera de su respuesta. Atentamente, / Un cordial saludo,*

      **Discourse markers** for writing and debate:

      | Job | Marker |
      | order | en primer lugar, por un lado / por otro, por último |
      | contrast | no obstante, sin embargo, en cambio |
      | result | por consiguiente, por lo tanto, así pues |
      | rephrase / reinforce | es decir, de hecho |
      | topic | en cuanto a, con respecto a |
      | conclude | en resumen, al fin y al cabo, en definitiva |

      After a negative, "but rather" is **sino**: *No es caro, sino carísimo*.
    items:
      - {id: es-b2-13-estimado, type: vocab, l2: "estimado", l1: "dear (opening a formal letter or e-mail)",
         ex: "Estimada señora Martín:", ex_l1: "Dear Mrs Martín,",
         note: "Agrees: estimado señor, estimada señora, estimados señores. Followed by a colon."}
      - {id: es-b2-13-atentamente, type: vocab, l2: "atentamente", l1: "yours sincerely / yours faithfully (closing a formal letter)",
         ex: "Atentamente, Ana López", ex_l1: "Yours sincerely, Ana López",
         note: "Less formal: un cordial saludo / saludos cordiales."}
      - {id: es-b2-13-adjuntar, type: vocab, l2: "adjuntar", l1: "to attach (a file, a document)",
         ex: "Le adjunto el informe.", ex_l1: "I attach the report. (formal)",
         note: "adjunto = attached; also used as 'please find attached': Adjunto le envío…"}
      - {id: es-b2-13-archivo-adjunto, type: vocab, l2: "el archivo adjunto", l1: "the attachment (to an e-mail)", alt: ["el adjunto", "el fichero adjunto"],
         ex: "No puedo abrir el archivo adjunto.", ex_l1: "I can't open the attachment."}
      - {id: es-b2-13-solicitud, type: vocab, l2: "la solicitud", l1: "the application (form) / the request",
         ex: "He enviado la solicitud para la beca.", ex_l1: "I've sent off the application for the grant.",
         note: "A phone app is una aplicación."}
      - {id: es-b2-13-solicitar, type: vocab, l2: "solicitar", l1: "to apply for / to request (formal)",
         ex: "Quisiera solicitar información sobre el curso.", ex_l1: "I would like to request information about the course.",
         note: "The formal equivalent of pedir."}
      - {id: es-b2-13-asunto, type: vocab, l2: "el asunto", l1: "the subject (of an e-mail) / the matter, the issue",
         ex: "Escribe el asunto del correo.", ex_l1: "Write the subject line of the e-mail.",
         note: "Also a matter or affair: es un asunto delicado."}
      - {id: es-b2-13-destinatario, type: vocab, l2: "el destinatario", l1: "the recipient / the addressee",
         ex: "Comprueba la dirección del destinatario.", ex_l1: "Check the recipient's address.",
         note: "From el destino (destination)."}
      - {id: es-b2-13-remitente, type: vocab, l2: "el remitente", l1: "the sender",
         ex: "La carta no tiene remitente.", ex_l1: "The letter has no sender's name.",
         note: "From remitir (to send, formal)."}
      - {id: es-b2-13-firma, type: vocab, l2: "la firma", l1: "the signature / the firm (company)",
         ex: "Falta tu firma en el contrato.", ex_l1: "Your signature is missing from the contract.",
         note: "From firmar."}
      - {id: es-b2-13-tutear, type: vocab, l2: "tutear", l1: "to address someone as tú",
         ex: "En mi empresa todos nos tuteamos.", ex_l1: "In my company we all call each other tú.",
         note: "The opposite: tratar de usted or hablar de usted."}
      - {id: es-b2-13-tratar-usted, type: vocab, l2: "tratar de usted", l1: "to address someone as usted / to be formal with someone",
         alt: ["hablar de usted"],
         ex: "A mi suegra la trato de usted.", ex_l1: "I call my mother-in-law usted."}
      - {id: es-b2-13-no-obstante, type: vocab, l2: "no obstante", l1: "nevertheless / however (formal)",
         ex: "El plan es bueno; no obstante, es caro.", ex_l1: "The plan is good; nevertheless, it's expensive.",
         note: "More formal than sin embargo."}
      - {id: es-b2-13-de-hecho, type: vocab, l2: "de hecho", l1: "in fact / actually (reinforcing)",
         ex: "No es tímido; de hecho, habla con todo el mundo.", ex_l1: "He isn't shy; in fact, he talks to everyone.",
         note: "'Actually' meaning 'currently' is actualmente or ahora."}
      - {id: es-b2-13-es-decir, type: vocab, l2: "es decir", l1: "that is to say / i.e.",
         ex: "Vuelvo en una quincena, es decir, dentro de dos semanas.", ex_l1: "I'll be back in a fortnight, that is to say, in two weeks.",
         note: "The written equivalent of o sea."}
      - {id: es-b2-13-por-consiguiente, type: vocab, l2: "por consiguiente", l1: "consequently / as a result (formal)",
         alt: ["en consecuencia"],
         ex: "Han subido los costes; por consiguiente, subiremos los precios.", ex_l1: "Costs have risen; consequently, we will raise prices."}
      - {id: es-b2-13-en-cuanto-a, type: vocab, l2: "en cuanto a", l1: "as regards / as for / with regard to",
         alt: ["con respecto a", "respecto a", "en relación con"],
         ex: "En cuanto al precio, no hay problema.", ex_l1: "As regards the price, there's no problem.",
         note: "en cuanto + verb = as soon as; en cuanto a + noun = as regards."}
      - {id: es-b2-13-en-resumen, type: vocab, l2: "en resumen", l1: "in short / to sum up", alt: ["en resumidas cuentas", "en suma"],
         ex: "En resumen, el proyecto ha sido un éxito.", ex_l1: "In short, the project has been a success."}
      - {id: es-b2-13-por-un-lado, type: vocab, l2: "por un lado", l1: "on the one hand", alt: ["por una parte"],
         ex: "Por un lado, me gusta la ciudad; por otro, es muy cara.", ex_l1: "On the one hand, I like the city; on the other, it's very expensive.",
         note: "Answered by por otro (lado) / por otra (parte)."}
      - {id: es-b2-13-fin-cabo, type: vocab, l2: "al fin y al cabo", l1: "after all / when all is said and done",
         ex: "Al fin y al cabo, es tu decisión.", ex_l1: "After all, it's your decision."}
      - {id: es-b2-13-primer-lugar, type: vocab, l2: "en primer lugar", l1: "firstly / in the first place",
         ex: "En primer lugar, quiero darles las gracias.", ex_l1: "Firstly, I want to thank you (all).",
         note: "en segundo lugar = secondly."}
      - {id: es-b2-13-por-ultimo, type: vocab, l2: "por último", l1: "lastly / finally (the last point)",
         ex: "Por último, hablaremos del presupuesto.", ex_l1: "Lastly, we will talk about the budget.",
         note: "For 'at last' (after waiting) say por fin."}
      - {id: es-b2-13-puntos-ies, type: vocab, l2: "poner los puntos sobre las íes", l1: "to dot the i's and cross the t's / to make things perfectly clear",
         ex: "Antes de firmar, quiero poner los puntos sobre las íes.", ex_l1: "Before signing, I want to make things perfectly clear.",
         note: "Plural of i is íes, with an accent."}
      - {id: es-b2-13-estimada-senora, type: phrase, l2: "Estimada señora García:", l1: "Dear Mrs García, (opening a formal e-mail)",
         alt: ["Estimada Sra. García:"], note: "A colon, not a comma, after the greeting."}
      - {id: es-b2-13-le-escribo, type: phrase, l2: "Le escribo para solicitar información sobre el curso.", l1: "I am writing to request information about the course. (formal)",
         alt: ["Me dirijo a usted para solicitar información sobre el curso", "Le escribo para pedir información sobre el curso"]}
      - {id: es-b2-13-agradeceria, type: phrase, l2: "Le agradecería que me respondiera lo antes posible.", l1: "I would be grateful if you could reply as soon as possible. (formal)",
         alt: ["Le agradecería que me respondiese lo antes posible", "Le agradecería que me contestara lo antes posible", "Le agradecería que me contestase lo antes posible"],
         note: "agradecería que + imperfect subjunctive: the politest way to ask."}
      - {id: es-b2-13-quedo-espera, type: phrase, l2: "Quedo a la espera de su respuesta.", l1: "I look forward to your reply. (formal)",
         alt: ["Quedo a la espera de sus noticias", "En espera de su respuesta"]}
      - {id: es-b2-13-adjunto-envio, type: phrase, l2: "Adjunto le envío mi currículum.", l1: "Please find my CV attached. (formal: I send you attached)",
         alt: ["Le adjunto mi currículum", "Le envío adjunto mi currículum", "Adjunto mi currículum"],
         note: "adjunto is an adjective and agrees: Le envío adjuntas las fotos."}
      - {id: es-b2-13-cordial-saludo, type: phrase, l2: "Un cordial saludo.", l1: "Kind regards. (closing an e-mail)",
         alt: ["Saludos cordiales", "Reciba un cordial saludo"]}
      - {id: es-b2-13-nos-tuteamos, type: phrase, l2: "¿Nos tuteamos?", l1: "Shall we call each other tú?",
         alt: ["¿Podemos tutearnos?", "¿Nos podemos tutear?"], note: "The polite way to offer a less formal footing."}
      - {id: es-b2-13-lamento, type: phrase, l2: "Lamento comunicarle que su solicitud ha sido rechazada.", l1: "I regret to inform you that your application has been rejected. (formal)",
         alt: ["Lamento informarle de que su solicitud ha sido rechazada", "Siento comunicarle que su solicitud ha sido rechazada", "Lamento informarle que su solicitud ha sido rechazada"],
         note: "informar de que (Spain, standard); informar que is common in Latin America."}
      - {id: es-b2-13-c1, type: cloze, text: "El hotel era caro; no ___, merecía la pena.", answer: "obstante",
         l1: "The hotel was expensive; nevertheless, it was worth it.", note: "no obstante = nevertheless (formal)"}
      - {id: es-b2-13-c2, type: cloze, text: "No es mi jefe, ___ mi compañero.", answer: "sino",
         l1: "He isn't my boss but my colleague.", note: "after a negative, 'but (rather)' = sino, not pero"}
      - {id: es-b2-13-c3, type: cloze, text: "No es nada tímida; de ___, es la más habladora del grupo.", answer: "hecho",
         l1: "She isn't shy at all; in fact, she's the most talkative in the group.", note: "de hecho = in fact"}
      - {id: es-b2-13-c4, type: cloze, text: "El curso es intensivo, es ___, cinco horas al día.", answer: "decir",
         l1: "The course is intensive, that is to say, five hours a day.", note: "es decir = that is to say"}
      - {id: es-b2-13-c5, type: cloze, text: "En ___ a su pregunta, le informo de que el plazo sigue abierto.", answer: "cuanto", alt: ["relación"],
         l1: "As regards your question, I can tell you that the application period is still open. (formal)", note: "en cuanto a = as regards. The standard alternatives are en relación con and con relación a; en relación a is common but less recommended."}
      - {id: es-b2-13-c6, type: cloze, text: "Por un lado, el trabajo es interesante; por ___, el sueldo es bajo.", answer: "otro",
         l1: "On the one hand, the job is interesting; on the other, the pay is low.", note: "por un lado… por otro (lado)"}
      - {id: es-b2-13-c7, type: cloze, text: "Le agradecería que me ___ el formulario.", answer: "enviara", alt: ["enviase", "mandara", "mandase"],
         l1: "I would be grateful if you could send me the form. (formal)", note: "agradecería que + imperfect subjunctive"}
      - {id: es-b2-13-c8, type: cloze, text: "Al fin y al ___, es tu decisión.", answer: "cabo",
         l1: "After all, it's your decision.", note: "al fin y al cabo = after all"}
      - {id: es-b2-13-c9, type: cloze, text: "En primer ___, quiero agradecerles su presencia.", answer: "lugar",
         l1: "Firstly, I want to thank you all for being here. (formal, to a group)", note: "en primer lugar = firstly"}
      - {id: es-b2-13-c10, type: cloze, text: "Por ___, me gustaría hablar del presupuesto.", answer: "último",
         l1: "Lastly, I'd like to talk about the budget.", note: "por último = lastly (por fin = at last)"}
      - {id: es-b2-13-c11, type: cloze, text: "Disculpe, ¿___ usted dónde está la secretaría?", answer: "sabe",
         l1: "Excuse me, do you know where the office is? (formal)", note: "usted takes the third-person form"}
      - {id: es-b2-13-c12, type: cloze, text: "Señora López, ___ asiento, por favor.", answer: "tome",
         l1: "Mrs López, please take a seat. (formal)", note: "formal imperative: tomar → tome (usted)"}
      - {id: es-b2-13-c13, type: cloze, text: "La empresa ha perdido clientes; por ___, habrá recortes.", answer: "consiguiente", alt: ["tanto"],
         l1: "The company has lost customers; consequently, there will be cuts.", note: "por consiguiente = consequently (formal)"}
      - {id: es-b2-13-c14, type: cloze, text: "Le escribo para ___ una beca.", answer: "solicitar", alt: ["pedir"],
         l1: "I am writing to apply for a grant. (formal)", note: "solicitar = to apply for (formal)"}
      - {id: es-b2-13-c15, type: cloze, text: "Sin otro ___, le saluda atentamente,", answer: "particular",
         l1: "With nothing further to add, yours sincerely, (traditional letter closing)", note: "a set formula at the end of a formal letter"}
      - {id: es-b2-13-c16, type: cloze, text: "¿Le ___ si abro la ventana?", answer: "importa", alt: ["molesta"],
         l1: "Do you mind if I open the window? (formal)", note: "¿le importa si…? = do you mind if…? (usted)"}

  # ---------------------------------------------------------------- 14
  - id: es-b2-14
    title: "Making your case: debates and discussions"
    goal: "I can give and justify an opinion, challenge someone politely, concede a point and propose a solution in a discussion."
    notes: |
      A discussion runs on a few moves. Learn them as whole chunks.

      - **State a view**: *A mi juicio…* · *Desde mi punto de vista…* · *Yo lo veo bien / mal.*
      - **Doubt**: *No creo que* + subjunctive: *No creo que pase eso.* · *Me parece imposible que funcione.*
      - **Ask for grounds**: *¿En qué te basas?* · *¿Por qué lo dices?*
      - **Concede, then push back**: *En eso tienes razón, pero…* · *No digo que no, pero…* · *Eso no quita que…* (that doesn't mean… not)
      - **Interrupt politely**: *Perdona / Perdone que te / le interrumpa, pero…* (note the subjunctive).
      - **Propose**: *Habría que…* · *Lo ideal sería…* · *¿Y si…?*
      - **Give way gracefully**: *Visto así…* · *Reconozco que tiene sentido.* · *Me has convencido.*

      The conditional softens everything: *haría falta*, *sería mejor*, *yo limitaría*. In a public meeting or on the radio keep **usted**: *Con todo respeto…*
    items:
      - id: es-b2-14-coches
        type: dialogue
        title: "A car-free centre?"
        scene: "Your friend Marta has just read that the council wants to close the city centre to cars. You use tú."
        you: B
        lines:
          - {who: A, l2: "¿Has visto que el ayuntamiento quiere cerrar el centro a los coches? Me parece una locura.", l1: "Have you seen that the council wants to close the centre to cars? I think it's madness."}
          - {who: B, l2: "Pues yo lo veo bien. Hay demasiada contaminación.", l1: "Well, I think it's a good idea. There's too much pollution.",
             alt: ["Pues a mí me parece bien. Hay demasiada contaminación.", "Pues yo lo veo bien, hay demasiada contaminación.", "Yo lo veo bien. Hay demasiada contaminación.", "Pues yo lo veo bien. Hay mucha contaminación.", "Pues a mí me parece bien, hay demasiada contaminación.", "Pues yo lo veo bien. Hay demasiada polución."]}
          - {who: A, l2: "Ya, pero ¿y las tiendas? Si la gente no puede aparcar, dejará de venir.", l1: "Sure, but what about the shops? If people can't park, they'll stop coming."}
          - {who: B, l2: "No creo que pase eso.", l1: "I don't think that will happen.",
             alt: ["No creo que eso pase.", "No creo que pase.", "No creo que ocurra eso.", "No creo que eso ocurra.", "Yo no creo que pase eso.", "No creo que suceda eso."]}
          - {who: A, l2: "¿En qué te basas?", l1: "What are you basing that on?"}
          - {who: B, l2: "En lo que ha pasado en otras ciudades.", l1: "On what has happened in other cities.",
             alt: ["En lo que ha ocurrido en otras ciudades.", "En lo que pasó en otras ciudades.", "En lo que ha pasado en otras ciudades europeas.", "En lo que ha sucedido en otras ciudades."]}
          - {who: A, l2: "Bueno, puede ser. Pero los que viven lejos lo van a tener muy difícil.", l1: "Well, maybe. But people who live far away are going to find it very hard."}
          - {who: B, l2: "En eso tienes razón. Habría que mejorar el transporte público.", l1: "You're right about that. Public transport would have to be improved.",
             alt: ["En eso tienes razón. Haría falta mejorar el transporte público.", "En eso tienes razón, habría que mejorar el transporte público.", "Ahí tienes razón. Habría que mejorar el transporte público.", "En eso tienes razón. Habría que mejorar el transporte.", "Tienes razón en eso. Habría que mejorar el transporte público.", "En eso tienes razón. Tendrían que mejorar el transporte público."]}

      - id: es-b2-14-teletrabajo
        type: dialogue
        title: "Working from home: for or against?"
        scene: "At the coffee machine, you chat with your colleague Dani about remote working. You use tú."
        you: A
        lines:
          - {who: A, l2: "¿Tú qué opinas del teletrabajo?", l1: "What's your view on working from home?",
             alt: ["¿Qué opinas del teletrabajo?", "¿Tú qué piensas del teletrabajo?", "¿Qué piensas del teletrabajo?", "¿Qué te parece el teletrabajo?", "¿A ti qué te parece el teletrabajo?"]}
          - {who: B, l2: "A mí me encanta. Ahorro dos horas de transporte al día y rindo más.", l1: "I love it. I save two hours of travelling a day and I get more done."}
          - {who: A, l2: "Ya, pero yo echo de menos a los compañeros.", l1: "Sure, but I miss my colleagues.",
             alt: ["Ya, pero echo de menos a los compañeros.", "Sí, pero yo echo de menos a los compañeros.", "Ya, pero yo extraño a los compañeros.", "Ya, pero yo echo de menos a mis compañeros.", "Sí, pero echo de menos a los compañeros."]}
          - {who: B, l2: "Eso no quita que se pueda hacer un par de días a la semana, ¿no?", l1: "That doesn't mean we can't do it a couple of days a week, does it?"}
          - {who: A, l2: "Visto así, tienes razón. Lo ideal sería un sistema mixto.", l1: "Seen like that, you're right. The ideal would be a mixed system.",
             alt: ["Visto así, tienes razón. Lo ideal sería un modelo mixto.", "Visto así, tienes razón, lo ideal sería un sistema mixto.", "Así visto, tienes razón. Lo ideal sería un sistema mixto.", "Visto así, tienes razón. Lo mejor sería un sistema mixto.", "Visto así tienes razón. Lo ideal sería un sistema mixto."]}
          - {who: B, l2: "Exacto. Lo malo es que la empresa no quiere ni oír hablar del tema.", l1: "Exactly. The trouble is that the company won't even hear of it."}
          - {who: A, l2: "Pues habría que proponérselo entre todos.", l1: "Well, we should all put it to them together.",
             alt: ["Pues habría que proponérselo todos juntos.", "Pues deberíamos proponérselo entre todos.", "Pues tendríamos que proponérselo entre todos.", "Habría que proponérselo entre todos.", "Pues podríamos proponérselo entre todos."]}
          - {who: B, l2: "Buena idea. Lo sacamos en la próxima reunión.", l1: "Good idea. We'll bring it up at the next meeting."}

      - id: es-b2-14-radio
        type: dialogue
        title: "A radio phone-in on tourism"
        scene: "You call a local radio programme in Barcelona that is debating tourism. The presenter speaks to you as usted."
        you: B
        lines:
          - {who: A, l2: "Buenas tardes, está usted en antena. ¿Qué opina del turismo en la ciudad?", l1: "Good afternoon, you're on air. What do you think about tourism in the city?"}
          - {who: B, l2: "Buenas tardes. A mi juicio, ya no es sostenible.", l1: "Good afternoon. In my view, it is no longer sustainable.",
             alt: ["Buenas tardes. En mi opinión, ya no es sostenible.", "Buenas tardes. Desde mi punto de vista, ya no es sostenible.", "Buenas tardes. A mi juicio ya no es sostenible.", "Buenas tardes. Para mí, ya no es sostenible.", "Buenas tardes. Creo que ya no es sostenible.", "Buenas tardes. A mi modo de ver, ya no es sostenible."]}
          - {who: A, l2: "¿Por qué lo dice?", l1: "Why do you say that?"}
          - {who: B, l2: "Porque los vecinos ya no pueden pagar el alquiler.", l1: "Because local residents can no longer afford the rent.",
             alt: ["Porque los vecinos no pueden pagar el alquiler.", "Porque los vecinos ya no pueden pagar los alquileres.", "Porque los vecinos ya no pueden permitirse el alquiler.", "Porque la gente del barrio ya no puede pagar el alquiler."]}
          - {who: A, l2: "Pero el turismo crea mucho empleo; eso no lo puede negar.", l1: "But tourism creates a lot of jobs; you can't deny that."}
          - {who: B, l2: "No digo que no, pero son trabajos mal pagados.", l1: "I'm not saying it doesn't, but they're badly paid jobs.",
             alt: ["No lo niego, pero son trabajos mal pagados.", "No digo que no, pero son empleos mal pagados.", "No lo niego, pero son empleos mal pagados.", "No digo que no, pero son trabajos muy mal pagados.", "Es verdad, pero son trabajos mal pagados.", "No digo que no, pero son trabajos precarios."]}
          - {who: A, l2: "¿Y qué propondría usted?", l1: "And what would you propose?"}
          - {who: B, l2: "Yo limitaría los pisos turísticos en el centro.", l1: "I would limit tourist flats in the centre.",
             alt: ["Limitaría los pisos turísticos en el centro.", "Yo limitaría los pisos turísticos del centro.", "Limitar los pisos turísticos en el centro.", "Yo limitaría los apartamentos turísticos en el centro.", "Limitaría los pisos turísticos del centro."]}
          - {who: A, l2: "Muy bien. Muchas gracias por su llamada.", l1: "Very good. Thank you very much for your call."}

      - id: es-b2-14-universidad
        type: dialogue
        title: "Should university be free?"
        scene: "After class, you and your classmate Iván argue about university fees. You use tú."
        you: A
        lines:
          - {who: A, l2: "Yo creo que la universidad debería ser gratuita para todos.", l1: "I think university should be free for everyone.",
             alt: ["Creo que la universidad debería ser gratuita para todos.", "Yo creo que la universidad debería ser gratis para todos.", "Creo que la universidad debería ser gratis para todos.", "Yo creo que la universidad tendría que ser gratuita para todos.", "Para mí, la universidad debería ser gratuita para todos."]}
          - {who: B, l2: "¿Para todos? ¿Incluso para los que pueden pagarla?", l1: "For everyone? Even for those who can pay for it?"}
          - {who: A, l2: "Sí, porque la educación es un derecho, no un privilegio.", l1: "Yes, because education is a right, not a privilege.",
             alt: ["Sí, porque la educación es un derecho y no un privilegio.", "Sí, la educación es un derecho, no un privilegio.", "Claro, porque la educación es un derecho, no un privilegio.", "Sí, porque la enseñanza es un derecho, no un privilegio."]}
          - {who: B, l2: "Ya, pero alguien tiene que pagarla. Si fuera gratis, subirían los impuestos.", l1: "Sure, but someone has to pay for it. If it were free, taxes would go up."}
          - {who: A, l2: "No necesariamente. Se podría ahorrar en otras cosas.", l1: "Not necessarily. Savings could be made elsewhere. (on other things)",
             alt: ["No necesariamente. Se podría recortar en otras cosas.", "No necesariamente, se podría ahorrar en otras cosas.", "No tiene por qué. Se podría ahorrar en otras cosas.", "No necesariamente. Podríamos ahorrar en otras cosas."]}
          - {who: B, l2: "¿En qué, por ejemplo?", l1: "On what, for example?"}
          - {who: A, l2: "En obras que no sirven para nada.", l1: "On building projects that are no use at all.",
             alt: ["En obras que no sirven de nada.", "Por ejemplo, en obras que no sirven para nada.", "En obras públicas que no sirven para nada.", "En las obras que no sirven para nada."]}
          - {who: B, l2: "Bueno, en eso no te voy a llevar la contraria.", l1: "Well, I'm not going to argue with you on that."}

      - id: es-b2-14-movil
        type: dialogue
        title: "A phone at twelve?"
        scene: "Your sister asks whether you'll let your son Lucas have a mobile phone. You use tú."
        you: B
        lines:
          - {who: A, l2: "¿Vas a dejar que Lucas tenga móvil con doce años?", l1: "Are you going to let Lucas have a mobile at twelve?"}
          - {who: B, l2: "No lo sé. Me da miedo que se pase el día en las redes.", l1: "I don't know. I'm afraid he'll spend all day on social media.",
             alt: ["No sé. Me da miedo que se pase el día en las redes.", "No lo sé. Me da miedo que se pase el día en las redes sociales.", "No lo sé, me da miedo que se pase el día en las redes.", "No lo sé. Tengo miedo de que se pase el día en las redes.", "No sé. Me da miedo que se pase todo el día en las redes."]}
          - {who: A, l2: "Pues todos sus amigos ya tienen uno. Si no se lo compras, se va a sentir excluido.", l1: "Well, all his friends already have one. If you don't buy him one, he's going to feel left out."}
          - {who: B, l2: "Ya, pero eso no es motivo suficiente.", l1: "Sure, but that isn't reason enough.",
             alt: ["Ya, pero eso no es razón suficiente.", "Ya, pero ese no es motivo suficiente.", "Ya, pero eso no es suficiente motivo.", "Sí, pero eso no es motivo suficiente.", "Ya, pero eso no es una razón suficiente."]}
          - {who: A, l2: "Podrías dárselo con condiciones: nada de móvil en la mesa ni en su habitación.", l1: "You could give it to him with conditions: no phone at the table or in his room."}
          - {who: B, l2: "Eso me parece más razonable.", l1: "That seems more reasonable to me.",
             alt: ["Eso me parece más sensato.", "Eso me parece más lógico.", "Así me parece más razonable.", "Eso ya me parece más razonable.", "Me parece más razonable."]}
          - {who: A, l2: "Y que sepa que, si no cumple las normas, se lo quitas.", l1: "And make sure he knows that if he doesn't stick to the rules, you'll take it away."}
          - {who: B, l2: "De acuerdo. Lo hablaré con él este fin de semana.", l1: "OK. I'll talk it over with him this weekend.",
             alt: ["Vale. Lo hablaré con él este fin de semana.", "De acuerdo. Lo hablo con él este fin de semana.", "De acuerdo, lo hablaré con él este fin de semana.", "Vale, lo hablo con él este fin de semana.", "De acuerdo. Hablaré con él este fin de semana."]}

      - id: es-b2-14-hotel
        type: dialogue
        title: "A neighbourhood meeting"
        scene: "At a public meeting, a company representative presents plans for a big hotel in your street. You are a resident; you speak to him as usted."
        you: B
        lines:
          - {who: A, l2: "El hotel creará cien puestos de trabajo y traerá vida al barrio.", l1: "The hotel will create a hundred jobs and bring life to the neighbourhood."}
          - {who: B, l2: "Perdone que le interrumpa, pero ¿han pensado en el ruido?", l1: "Sorry to interrupt, but have you thought about the noise?",
             alt: ["Perdone que lo interrumpa, pero ¿han pensado en el ruido?", "Disculpe que le interrumpa, pero ¿han pensado en el ruido?", "Disculpe que lo interrumpa, pero ¿han pensado en el ruido?", "Perdone la interrupción, pero ¿han pensado en el ruido?", "Perdone que le interrumpa, ¿pero han pensado en el ruido?"]}
          - {who: A, l2: "Por supuesto. El edificio cumplirá todas las normas.", l1: "Of course. The building will comply with all the regulations."}
          - {who: B, l2: "Con todo respeto, eso no es lo que pasó con el último hotel.", l1: "With all due respect, that's not what happened with the last hotel.",
             alt: ["Con todo el respeto, eso no es lo que pasó con el último hotel.", "Con todo respeto, eso no fue lo que pasó con el último hotel.", "Con todos mis respetos, eso no es lo que pasó con el último hotel.", "Con todo respeto, no es lo que pasó con el último hotel.", "Con todo respeto, eso no es lo que ocurrió con el último hotel."]}
          - {who: A, l2: "Entiendo su preocupación. Esta vez habrá un control mucho más estricto.", l1: "I understand your concern. This time there will be much stricter monitoring."}
          - {who: B, l2: "Entonces, ¿se comprometen a ponerlo por escrito?", l1: "So, will you commit to putting that in writing?",
             alt: ["¿Se comprometen a ponerlo por escrito?", "Entonces, ¿están dispuestos a ponerlo por escrito?", "Entonces ¿se comprometen a ponerlo por escrito?", "Entonces, ¿lo pondrán por escrito?", "Entonces, ¿se comprometen a dejarlo por escrito?"]}
          - {who: A, l2: "Sí. Lo incluiremos en el acuerdo con la asociación de vecinos.", l1: "Yes. We'll include it in the agreement with the residents' association."}
          - {who: B, l2: "En ese caso, no tengo nada en contra.", l1: "In that case, I have nothing against it.",
             alt: ["En ese caso, no tengo nada en contra del hotel.", "En ese caso no tengo nada en contra.", "Entonces no tengo nada en contra.", "En ese caso, no tengo ninguna objeción.", "En ese caso, no me opongo."]}

      - id: es-b2-14-luz
        type: dialogue
        title: "Paying more for green energy"
        scene: "You want to switch your shared flat to a renewable electricity tariff. You talk to your flatmate Carla. You use tú."
        you: A
        lines:
          - {who: A, l2: "He encontrado una tarifa de luz cien por cien renovable. ¿Nos cambiamos?", l1: "I've found a 100% renewable electricity tariff. Shall we switch?",
             alt: ["He encontrado una tarifa de luz 100 % renovable. ¿Nos cambiamos?", "He encontrado una tarifa de luz cien por cien renovable, ¿nos cambiamos?", "He encontrado una tarifa de electricidad cien por cien renovable. ¿Nos cambiamos?", "Encontré una tarifa de luz cien por ciento renovable. ¿Nos cambiamos?", "He encontrado una tarifa de luz cien por cien renovable. ¿Cambiamos?"]}
          - {who: B, l2: "¿Y cuánto cuesta? Porque no estamos para gastar más.", l1: "And how much is it? Because we're in no position to spend more."}
          - {who: A, l2: "Unos cinco euros más al mes, pero merece la pena.", l1: "About five euros more a month, but it's worth it.",
             alt: ["Unos cinco euros más al mes, pero vale la pena.", "Unos cinco euros más al mes, pero creo que merece la pena.", "Unos cinco euros más al mes pero merece la pena.", "Cinco euros más al mes, más o menos, pero merece la pena.", "Unos cinco euros más al mes, pero compensa."]}
          - {who: B, l2: "No sé... No es que no me importe el planeta, es que no llegamos a fin de mes.", l1: "I don't know... It's not that I don't care about the planet, it's that we can't make ends meet."}
          - {who: A, l2: "Lo entiendo. ¿Y si apagamos más las luces para compensar?", l1: "I understand. What if we turn the lights off more to make up for it?",
             alt: ["Lo entiendo. ¿Y si apagamos más las luces para compensarlo?", "Te entiendo. ¿Y si apagamos más las luces para compensar?", "Lo entiendo. ¿Y si apagáramos más las luces para compensar?", "Lo entiendo, ¿y si apagamos más las luces para compensar?", "Lo comprendo. ¿Y si apagamos más las luces para compensar?"]}
          - {who: B, l2: "Bueno, si lo pagamos a medias y ahorramos en otras cosas, vale.", l1: "Well, if we split it and save on other things, OK."}
          - {who: A, l2: "¡Trato hecho!", l1: "It's a deal!",
             alt: ["¡Hecho!", "¡Trato hecho, entonces!", "Trato hecho.", "¡Pues trato hecho!"]}
          - {who: B, l2: "Pero si la factura sube mucho, volvemos a la de antes, ¿eh?", l1: "But if the bill goes up a lot, we go back to the old one, OK?"}

      - id: es-b2-14-cuatro-dias
        type: dialogue
        title: "Won over: the four-day week"
        scene: "Your friend Pablo tells you about companies trying out a four-day working week. You are sceptical at first. You use tú."
        you: B
        lines:
          - {who: A, l2: "¿Te has enterado? Algunas empresas están probando la semana de cuatro días.", l1: "Have you heard? Some companies are trying out the four-day week."}
          - {who: B, l2: "Me parece imposible que funcione.", l1: "I can't see it working. (It seems impossible to me that it works.)",
             alt: ["Me parece imposible que eso funcione.", "Dudo que funcione.", "No creo que funcione.", "Me parece imposible que funcione bien.", "Dudo mucho que funcione."]}
          - {who: A, l2: "Pues, según los estudios, la gente rinde igual o más y está menos estresada.", l1: "Well, according to the studies, people get just as much or more done and are less stressed."}
          - {who: B, l2: "¿De verdad? No lo sabía.", l1: "Really? I didn't know that.",
             alt: ["¿En serio? No lo sabía.", "¿De veras? No lo sabía.", "¿De verdad? No tenía ni idea.", "¿Sí? No lo sabía.", "¿En serio? No tenía ni idea."]}
          - {who: A, l2: "Sí. Y además se reducen las bajas por enfermedad.", l1: "Yes. And on top of that, sick leave goes down."}
          - {who: B, l2: "Bueno, reconozco que tiene sentido.", l1: "Well, I admit it makes sense.",
             alt: ["Bueno, reconozco que tiene lógica.", "Vale, reconozco que tiene sentido.", "Bueno, tengo que reconocer que tiene sentido.", "Bueno, admito que tiene sentido.", "Reconozco que tiene sentido."]}
          - {who: A, l2: "¿Ves? Si me hubieras hecho caso desde el principio...", l1: "See? If you'd listened to me from the start..."}
          - {who: B, l2: "Vale, vale, me has convencido.", l1: "OK, OK, you've convinced me.",
             alt: ["Vale, me has convencido.", "Está bien, me has convencido.", "Bueno, me has convencido.", "Vale, vale, me convenciste.", "Vale, vale. Me has convencido."]}

  # ---------------------------------------------------------------- 15
  - id: es-b2-15
    title: "The job interview"
    goal: "I can present my experience, explain why I want a job, talk about strengths, weaknesses and a past problem, and discuss pay and start dates."
    notes: |
      Interviews in Spanish are usually in **usted**, though young companies in Spain often switch to **tú** at once. Follow the interviewer's lead.

      - **Your career**: *Estudié… y llevo seis años trabajando en…* · *Dirijo un equipo de…* · *Busco un puesto con más responsabilidad.*
      - **Motivation**: *Admiro su compromiso con…* · *Podría aportar…* (to contribute; English speakers forget this verb).
      - **Weaknesses**: *Me cuesta* + infinitive (I find it hard to…) · *Intento…*
      - **A past problem** (the STAR answer): set the scene in the imperfect, tell the events in the indefinido, use the pluperfect for what had happened before: *Le habíamos prometido una fecha que no podíamos cumplir.*
      - **Money and dates**: *la banda salarial* (salary range), *bruto / neto* (gross / net), *la incorporación* (start), *avisar con quince días de antelación* (give two weeks' notice), *¿Habría margen para negociar…?*
      - **On the phone**: *Sí, soy yo, dígame.* · *¿Cuándo les vendría bien?*
    items:
      - id: es-b2-15-presentacion
        type: dialogue
        title: "Tell me about yourself"
        scene: "You are being interviewed for a team-leader post at an engineering firm in Madrid. The interviewer uses usted."
        you: B
        lines:
          - {who: A, l2: "Buenos días. Siéntese, por favor. Hábleme un poco de usted.", l1: "Good morning. Have a seat, please. Tell me a little about yourself."}
          - {who: B, l2: "Pues estudié Ingeniería y llevo seis años trabajando en el sector.", l1: "Well, I studied engineering and I've been working in the sector for six years.",
             alt: ["Estudié Ingeniería y llevo seis años trabajando en el sector.", "Pues estudié Ingeniería y llevo seis años en el sector.", "Pues estudié Ingeniería y hace seis años que trabajo en el sector.", "Pues estudié Ingeniería y trabajo en el sector desde hace seis años.", "Pues estudié ingeniería y llevo seis años trabajando en el sector."]}
          - {who: A, l2: "¿Y qué hace actualmente?", l1: "And what are you doing at the moment?"}
          - {who: B, l2: "Dirijo un equipo de cinco personas en una empresa de software.", l1: "I manage a team of five people at a software company.",
             alt: ["Llevo un equipo de cinco personas en una empresa de software.", "Coordino un equipo de cinco personas en una empresa de software.", "Dirijo un equipo de cinco personas en una empresa de programas informáticos.", "Ahora dirijo un equipo de cinco personas en una empresa de software.", "Dirijo a un equipo de cinco personas en una empresa de software."]}
          - {who: A, l2: "Muy bien. ¿Y por qué quiere cambiar de trabajo?", l1: "Very good. And why do you want to change jobs?"}
          - {who: B, l2: "Busco un puesto con más responsabilidad.", l1: "I'm looking for a post with more responsibility.",
             alt: ["Busco un puesto con más responsabilidades.", "Estoy buscando un puesto con más responsabilidad.", "Busco un puesto de más responsabilidad.", "Quiero un puesto con más responsabilidad.", "Estoy buscando un puesto con más responsabilidades."]}
          - {who: A, l2: "Entiendo. Aquí tendría a su cargo un equipo bastante más grande.", l1: "I see. Here you would be in charge of a considerably larger team."}
          - {who: B, l2: "Eso es justo lo que busco.", l1: "That's exactly what I'm looking for.",
             alt: ["Eso es precisamente lo que busco.", "Es justo lo que busco.", "Eso es exactamente lo que busco.", "Eso es justo lo que estoy buscando.", "Es exactamente lo que busco."]}

      - id: es-b2-15-motivacion
        type: dialogue
        title: "Why do you want to work here?"
        scene: "The interview continues at a solar-energy company. The interviewer uses usted."
        you: B
        lines:
          - {who: A, l2: "¿Por qué le interesa trabajar con nosotros?", l1: "Why are you interested in working with us?"}
          - {who: B, l2: "Porque admiro su compromiso con la sostenibilidad.", l1: "Because I admire your commitment to sustainability.",
             alt: ["Porque admiro mucho su compromiso con la sostenibilidad.", "Admiro su compromiso con la sostenibilidad.", "Porque admiro su compromiso con el medio ambiente.", "Porque me gusta su compromiso con la sostenibilidad."]}
          - {who: A, l2: "¿Conoce nuestros proyectos?", l1: "Are you familiar with our projects?"}
          - {who: B, l2: "Sí, he leído mucho sobre el último, el de la planta solar.", l1: "Yes, I've read a lot about the latest one, the solar plant.",
             alt: ["Sí, he leído mucho sobre el último, el de la central solar.", "Sí, he leído bastante sobre el último, el de la planta solar.", "Sí, he leído mucho sobre el último proyecto, el de la planta solar.", "Sí, leí mucho sobre el último, el de la planta solar."]}
          - {who: A, l2: "¿Y qué cree que podría aportar a la empresa?", l1: "And what do you think you could bring to the company?"}
          - {who: B, l2: "Experiencia en gestión de equipos y muchas ganas de aprender.", l1: "Experience in managing teams and a real eagerness to learn.",
             alt: ["Experiencia en la gestión de equipos y muchas ganas de aprender.", "Podría aportar experiencia en gestión de equipos y muchas ganas de aprender.", "Experiencia gestionando equipos y muchas ganas de aprender.", "Experiencia en gestión de equipos y ganas de aprender."]}
          - {who: A, l2: "Nos gusta oír eso. ¿Habla otros idiomas?", l1: "We like to hear that. Do you speak other languages?"}
          - {who: B, l2: "Sí, hablo inglés y francés con fluidez.", l1: "Yes, I speak English and French fluently.",
             alt: ["Sí, hablo inglés y francés con soltura.", "Sí, hablo inglés y francés de forma fluida.", "Hablo inglés y francés con fluidez.", "Sí, hablo con fluidez inglés y francés.", "Sí, hablo inglés y francés perfectamente."]}

      - id: es-b2-15-puntos
        type: dialogue
        title: "Strengths and weaknesses"
        scene: "The interviewer asks the classic question. She uses usted."
        you: B
        lines:
          - {who: A, l2: "Dígame un punto fuerte y uno débil.", l1: "Tell me one strength and one weakness."}
          - {who: B, l2: "Mi punto fuerte es la organización.", l1: "My strong point is organisation.",
             alt: ["Mi punto fuerte es que sé organizarme.", "Mi punto fuerte es la capacidad de organización.", "Mi punto fuerte es la organización del trabajo.", "Mi punto fuerte es que soy muy organizado.", "Mi punto fuerte es que soy muy organizada."]}
          - {who: A, l2: "¿Y el débil?", l1: "And the weak one?"}
          - {who: B, l2: "A veces me cuesta delegar.", l1: "Sometimes I find it hard to delegate.",
             alt: ["A veces me resulta difícil delegar.", "A veces me cuesta mucho delegar.", "Me cuesta delegar a veces.", "A veces me cuesta delegar tareas.", "A veces me es difícil delegar."]}
          - {who: A, l2: "¿Y cómo lo está trabajando?", l1: "And how are you working on it?"}
          - {who: B, l2: "Intento confiar más en mi equipo.", l1: "I'm trying to trust my team more.",
             alt: ["Estoy intentando confiar más en mi equipo.", "Intento fiarme más de mi equipo.", "Trato de confiar más en mi equipo.", "Procuro confiar más en mi equipo.", "Estoy tratando de confiar más en mi equipo."]}
          - {who: A, l2: "Es una respuesta muy sincera.", l1: "That's a very honest answer."}
          - {who: B, l2: "Creo que reconocerlo es el primer paso.", l1: "I think admitting it is the first step.",
             alt: ["Creo que reconocerlo es el primer paso para mejorar.", "Reconocerlo es el primer paso, creo.", "Creo que admitirlo es el primer paso.", "Pienso que reconocerlo es el primer paso."]}

      - id: es-b2-15-situacion
        type: dialogue
        title: "A difficult situation at work"
        scene: "The interviewer asks you to describe a problem you solved. He uses usted."
        you: B
        lines:
          - {who: A, l2: "Cuénteme una situación difícil que haya tenido en el trabajo y cómo la resolvió.", l1: "Tell me about a difficult situation you've had at work and how you solved it."}
          - {who: B, l2: "Una vez, un cliente importante amenazó con irse.", l1: "Once, an important client threatened to leave.",
             alt: ["Una vez un cliente importante amenazó con irse.", "Una vez, un cliente importante amenazó con marcharse.", "Una vez, un cliente muy importante amenazó con irse.", "Una vez, un cliente importante amenazó con dejarnos."]}
          - {who: A, l2: "¿Y qué hizo usted?", l1: "And what did you do?"}
          - {who: B, l2: "Le pedí que me explicara el problema con calma.", l1: "I asked him to explain the problem to me calmly.",
             alt: ["Le pedí que me explicase el problema con calma.", "Le pedí que me explicara el problema tranquilamente.", "Le pedí que me contara el problema con calma.", "Le pedí que me explicara con calma el problema."]}
          - {who: A, l2: "¿Y cuál era el problema?", l1: "And what was the problem?"}
          - {who: B, l2: "Le habíamos prometido una fecha que no podíamos cumplir.", l1: "We had promised him a date we couldn't meet.",
             alt: ["Le habíamos prometido un plazo que no podíamos cumplir.", "Le habíamos prometido una fecha que no podíamos respetar.", "Le habíamos dado una fecha que no podíamos cumplir.", "Le habíamos prometido una fecha de entrega que no podíamos cumplir."]}
          - {who: A, l2: "¿Y cómo terminó?", l1: "And how did it end?"}
          - {who: B, l2: "Negociamos un nuevo plazo y al final se quedó con nosotros.", l1: "We negotiated a new deadline and in the end he stayed with us.",
             alt: ["Negociamos otro plazo y al final se quedó con nosotros.", "Negociamos un plazo nuevo y al final se quedó con nosotros.", "Negociamos un nuevo plazo y, al final, se quedó con nosotros.", "Negociamos un nuevo plazo y al final siguió con nosotros."]}

      - id: es-b2-15-condiciones
        type: dialogue
        title: "Pay and conditions"
        scene: "At the end of the interview, the HR manager asks if you have any questions. She uses usted."
        you: B
        lines:
          - {who: A, l2: "¿Tiene alguna pregunta sobre las condiciones?", l1: "Do you have any questions about the terms and conditions?"}
          - {who: B, l2: "Sí. ¿Podría decirme cuál es la banda salarial?", l1: "Yes. Could you tell me what the salary range is?",
             alt: ["Sí. ¿Me podría decir cuál es la banda salarial?", "Sí, ¿podría decirme cuál es la banda salarial?", "Sí. ¿Cuál es la banda salarial?", "Sí. ¿Podría decirme cuál es el rango salarial?", "Sí. ¿Me podría decir cuál es el rango salarial?"]}
          - {who: A, l2: "Entre cuarenta y cuarenta y cinco mil euros brutos al año, según la experiencia.", l1: "Between forty and forty-five thousand euros gross a year, depending on experience."}
          - {who: B, l2: "¿Y el horario es flexible?", l1: "And are the hours flexible?",
             alt: ["¿El horario es flexible?", "¿Y hay horario flexible?", "¿Y tienen horario flexible?", "¿Y el horario es flexible o fijo?"]}
          - {who: A, l2: "Sí, y se puede teletrabajar dos días a la semana.", l1: "Yes, and you can work from home two days a week."}
          - {who: B, l2: "Perfecto. ¿Cuándo sería la incorporación?", l1: "Perfect. When would the start date be?",
             alt: ["Perfecto. ¿Cuándo tendría que incorporarme?", "Perfecto. ¿Cuándo empezaría?", "Perfecto, ¿cuándo sería la incorporación?", "Perfecto. ¿Para cuándo sería la incorporación?", "Perfecto. ¿Cuándo me incorporaría?"]}
          - {who: A, l2: "Lo antes posible; idealmente, el mes que viene.", l1: "As soon as possible; ideally, next month."}
          - {who: B, l2: "Tendría que avisar a mi empresa con quince días de antelación.", l1: "I would have to give my company two weeks' notice.",
             alt: ["Tendría que avisar en mi empresa con quince días de antelación.", "Tendría que avisar a mi empresa con dos semanas de antelación.", "Tengo que avisar a mi empresa con quince días de antelación.", "Tendría que dar quince días de preaviso en mi empresa.", "Tendría que avisar a mi empresa con quince días de preaviso."]}

      - id: es-b2-15-preguntas
