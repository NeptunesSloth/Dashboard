  # ---------------------------------------------------------------- 7
  - id: es-b2-07
    title: "The minister denied that…: reported speech in depth — the media"
    goal: "I can report statements, questions and requests accurately, and talk about newspapers, television, advertising and fake news."
    notes: |
      With a past reporting verb, every tense moves one step back.

      | Direct speech | Reported (dijo que…) |
      | present: *trabajo* | imperfect: *trabajaba* |
      | indefinido / perfecto: *vi, he visto* | pluperfect: *había visto* |
      | future: *publicaremos* | conditional: *publicarían* |
      | imperative / present subj.: *apaga* | imperfect subj.: *que apagara* |
      | imperfect, conditional, pluperfect | no change |

      - Time and place words shift: *hoy → aquel día*, *ayer → el día anterior*, *mañana → al día siguiente*, *aquí → allí*, *este → ese / aquel*.
      - Use a precise reporting verb: **afirmar**, **asegurar** (to claim), **reconocer** (to admit), **añadir** (to add) + indicative; **negar que** (to deny) + subjunctive; **pedir**, **sugerir**, **aconsejar**, **advertir que** (to warn to) + subjunctive.
      - With a present reporting verb nothing shifts: *dice que va a llover*.
      - In everyday speech the indefinido often stays: *Dijo que lo vio* is heard as well as *Dijo que lo había visto*.
    items:
      - {id: es-b2-07-titular, type: vocab, l2: "el titular", l1: "the headline",
         ex: "El titular no tiene nada que ver con la noticia.", ex_l1: "The headline has nothing to do with the story.",
         note: "Also the holder of an account or passport."}
      - {id: es-b2-07-prensa, type: vocab, l2: "la prensa", l1: "the press (newspapers, journalists)",
         ex: "Lo he leído en la prensa.", ex_l1: "I read it in the press.",
         note: "la prensa rosa = celebrity gossip magazines."}
      - {id: es-b2-07-medios, type: vocab, l2: "los medios de comunicación", l1: "the media",
         alt: ["los medios"],
         ex: "Los medios de comunicación tienen mucho poder.", ex_l1: "The media have a lot of power.",
         note: "Often shortened to los medios. Always plural."}
      - {id: es-b2-07-cadena, type: vocab, l2: "la cadena", l1: "the (TV) channel / the network / the chain", alt: ["el canal"],
         ex: "¿En qué cadena ponen el partido?", ex_l1: "Which channel is the match on?",
         note: "poner (on TV) = to show: ¿qué ponen esta noche? Also a chain (of shops, a necklace)."}
      - {id: es-b2-07-anuncio, type: vocab, l2: "el anuncio", l1: "the advert / the commercial / the announcement",
         ex: "Hay demasiados anuncios en esta película.", ex_l1: "There are too many adverts during this film.",
         note: "anunciar = to advertise / to announce."}
      - {id: es-b2-07-publicidad, type: vocab, l2: "la publicidad", l1: "advertising",
         ex: "La publicidad dirigida a niños debería estar prohibida.", ex_l1: "Advertising aimed at children should be banned.",
         note: "Uncountable. Publicity in the PR sense is also la publicidad."}
      - {id: es-b2-07-reportaje, type: vocab, l2: "el reportaje", l1: "the (news) report / the feature / the documentary piece",
         ex: "Vimos un reportaje sobre la sequía.", ex_l1: "We watched a report on the drought.",
         note: "Masculine (-aje). A written report at work is un informe."}
      - {id: es-b2-07-presentador, type: vocab, l2: "el presentador", l1: "the presenter / the TV host (male)",
         ex: "El presentador del telediario es muy serio.", ex_l1: "The newsreader is very serious.",
         note: "Feminine: la presentadora. el telediario = the TV news (Spain)."}
      - {id: es-b2-07-bulo, type: vocab, l2: "el bulo", l1: "the hoax / the piece of fake news", alt: ["la noticia falsa", "el fake"],
         ex: "Ese mensaje es un bulo: no lo compartas.", ex_l1: "That message is a hoax: don't share it.",
         note: "Spain. Elsewhere people say noticias falsas or fake news (pronounced feik)."}
      - {id: es-b2-07-fuente, type: vocab, l2: "la fuente", l1: "the source (of information) / the fountain",
