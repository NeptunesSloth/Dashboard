         l1: "They put in solar panels so that the school would use less energy.", note: "para que after a past verb → imperfect subjunctive"}
      - {id: es-b2-05-c10, type: cloze, text: "Mientras ___ combustibles fósiles, las emisiones no bajarán.", answer: "usemos", alt: ["utilicemos", "quememos"],
