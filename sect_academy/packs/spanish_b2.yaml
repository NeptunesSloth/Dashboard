          - {who: A, l2: "¿Podría venir el jueves a las diez?", l1: "Could you come on Thursday at ten?"}
          - {who: B, l2: "El jueves por la mañana no puedo. ¿Podría ser por la tarde?", l1: "I can't do Thursday morning. Could it be in the afternoon?",
             alt: ["El jueves por la mañana me resulta imposible. ¿Podría ser por la tarde?", "El jueves por la mañana no me viene bien. ¿Podría ser por la tarde?", "El jueves por la mañana no puedo, ¿podría ser por la tarde?", "El jueves por la mañana no puedo. ¿Puede ser por la tarde?", "El jueves por la mañana me es imposible. ¿Podría ser por la tarde?"]}
          - {who: A, l2: "Sí, a las cuatro, por ejemplo.", l1: "Yes, at four, for example."}
          - {who: B, l2: "Perfecto. ¿Tengo que llevar algún documento?", l1: "Perfect. Do I need to bring any documents?",
             alt: ["Perfecto. ¿Tengo que traer algún documento?", "Perfecto. ¿Necesito llevar algún documento?", "Perfecto, ¿tengo que llevar algún documento?", "Perfecto. ¿Debo llevar algún documento?", "Perfecto. ¿Hace falta que lleve algún documento?"]}
          - {who: A, l2: "Solo una copia de su título. Le enviaré la dirección por correo.", l1: "Just a copy of your degree certificate. I'll send you the address by e-mail."}

      - id: es-b2-15-oferta
        type: dialogue
        title: "The job offer"
        scene: "A week later the HR manager at Ecolux calls you back. She uses usted."
        you: B
        lines:
          - {who: A, l2: "Buenas tardes. Le llamo para comunicarle que el puesto es suyo.", l1: "Good afternoon. I'm calling to let you know that the job is yours."}
          - {who: B, l2: "¡Muchísimas gracias! Me alegro mucho.", l1: "Thank you so much! I'm delighted.",
             alt: ["¡Muchas gracias! Me alegro mucho.", "¡Muchísimas gracias! Me alegro muchísimo.", "¡Muchísimas gracias! Qué alegría.", "¡Muchísimas gracias! Estoy encantado.", "¡Muchísimas gracias! Estoy encantada."]}
          - {who: A, l2: "La oferta es de cuarenta y dos mil euros al año.", l1: "The offer is forty-two thousand euros a year."}
          - {who: B, l2: "¿Habría margen para negociar el sueldo?", l1: "Would there be any room to negotiate the salary?",
             alt: ["¿Habría margen para negociar el salario?", "¿Hay margen para negociar el sueldo?", "¿Sería posible negociar el sueldo?", "¿Habría algún margen para negociar el sueldo?", "¿Habría posibilidad de negociar el sueldo?"]}
          - {who: A, l2: "Podríamos llegar a cuarenta y cuatro mil, pero no más.", l1: "We could go up to forty-four thousand, but no more."}
          - {who: B, l2: "Me parece justo. Acepto la oferta.", l1: "That seems fair. I accept the offer.",
             alt: ["Me parece justo, acepto la oferta.", "Me parece bien. Acepto la oferta.", "Me parece razonable. Acepto la oferta.", "Me parece justo. Acepto.", "Es justo. Acepto la oferta."]}
          - {who: A, l2: "Estupendo. Le enviaremos el contrato esta semana.", l1: "Excellent. We'll send you the contract this week."}
          - {who: B, l2: "Lo firmaré en cuanto lo reciba.", l1: "I'll sign it as soon as I receive it.",
