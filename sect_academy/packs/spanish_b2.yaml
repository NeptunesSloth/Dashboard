      - {id: es-b2-12-c6, type: cloze, text: "No encuentro las llaves. ¿Dónde las ___ puesto?", answer: "habré",
         l1: "I can't find my keys. Where can I have put them?", note: "future perfect in a question = I wonder"}
      - {id: es-b2-12-c7, type: cloze, text: "Cuando la llamé, ya habría ___ el autobús.", answer: "perdido",
         l1: "When I called her, she must already have missed the bus.", note: "conditional perfect = a guess about an earlier past"}
      - {id: es-b2-12-c8, type: cloze, text: "Llaman a la puerta. ¿Quién ___ a estas horas?", answer: "será",
         l1: "Someone's at the door. Who can it be at this time of night?", note: "future in a question = I wonder"}
      - {id: es-b2-12-c9, type: cloze, text: "___ mucho dinero, pero no es feliz.", answer: "Tendrá",
