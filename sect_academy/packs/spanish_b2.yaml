         l1: "“Why did he arrive so late?” “I don't know, there must have been a lot of traffic.”", note: "conditional of hay → habría: a guess about the past"}
      - {id: es-b2-12-c13, type: cloze, text: "Le ___ la cartera en el metro.", answer: "robaron",
