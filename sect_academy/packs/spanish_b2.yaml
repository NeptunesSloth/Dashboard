      - {id: es-b2-06-c2, type: cloze, text: "Necesitamos una aplicación que ___ sin conexión.", answer: "funcione",
         l1: "We need an app that works offline.", note: "a thing we're still looking for → subjunctive"}
      - {id: es-b2-06-c3, type: cloze, text: "Uso un programa que ___ los archivos automáticamente.", answer: "guarda",
         l1: "I use a program that saves files automatically.", note: "it exists and I use it → indicative"}
      - {id: es-b2-06-c4, type: cloze, text: "Es una científica ___ investigación ha cambiado la medicina.", answer: "cuya",
         l1: "She's a scientist whose research has changed medicine.", note: "cuya agrees with investigación (feminine singular)"}
      - {id: es-b2-06-c5, type: cloze, text: "Es un invento ___ resultados todavía no conocemos.", answer: "cuyos",
         l1: "It's an invention whose results we don't know yet.", note: "cuyos agrees with resultados (masculine plural)"}
      - {id: es-b2-06-c6, type: cloze, text: "El sistema falló, lo ___ provocó muchos problemas.", answer: "cual", alt: ["que"],
         l1: "The system failed, which caused a lot of problems.", note: "lo cual / lo que refers back to the whole sentence"}
      - {id: es-b2-06-c7, type: cloze, text: "Son las razones por las ___ dejé la empresa.", answer: "cuales", alt: ["que"],
         l1: "Those are the reasons why I left the company.", note: "preposition + las cuales (formal) or las que"}
      - {id: es-b2-06-c8, type: cloze, text: "___ quiera participar, que se apunte aquí.", answer: "Quien", alt: ["El que"],
         l1: "Whoever wants to take part should sign up here.", note: "quien + subjunctive = whoever"}
      - {id: es-b2-06-c9, type: cloze, text: "Puedes elegir lo que ___.", answer: "quieras", alt: ["prefieras"],
         l1: "You can choose whatever you want. (informal)", note: "lo que + subjunctive = whatever"}
      - {id: es-b2-06-c10, type: cloze, text: "No existe ninguna máquina que ___ hacer eso.", answer: "pueda",
         l1: "There is no machine that can do that.", note: "a denied thing → subjunctive"}
      - {id: es-b2-06-c11, type: cloze, text: "Los investigadores, ___ trabajan día y noche, esperan resultados pronto.", answer: "quienes",
         alt: ["que", "los cuales"],
         l1: "The researchers, who work day and night, hope for results soon.", note: "between commas, people can take quienes (or que)"}
      - {id: es-b2-06-c12, type: cloze, text: "El que ___ primero, que encienda el ordenador.", answer: "llegue",
         l1: "Whoever arrives first should switch on the computer.", note: "el que + subjunctive = whoever (not known yet)"}
      - {id: es-b2-06-c13, type: cloze, text: "Busco un portátil que no ___ demasiado.", answer: "pese",
         l1: "I'm looking for a laptop that doesn't weigh too much.", note: "something I'm still looking for → subjunctive"}
      - {id: es-b2-06-c14, type: cloze, text: "La investigadora con la ___ trabajo es argentina.", answer: "que", alt: ["cual"],
         l1: "The researcher I work with is Argentinian.", note: "the preposition goes first: con la que / con la cual (or con quien)"}
      - {id: es-b2-06-c15, type: cloze, text: "Querían un candidato que ___ experiencia en inteligencia artificial.", answer: "tuviera", alt: ["tuviese"],
