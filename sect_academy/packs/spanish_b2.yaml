      - {id: es-b2-05-por-si-acaso, type: phrase, l2: "Llévate el paraguas por si acaso.", l1: "Take the umbrella just in case. (informal)",
         alt: ["Llévate el paraguas, por si acaso", "Coge el paraguas por si acaso", "Lleva el paraguas por si acaso"],
         note: "por si acaso = just in case; por si + indicative: por si llueve."}
      - {id: es-b2-05-con-tal-que, type: phrase, l2: "Iré con tal de que vengas tú.", l1: "I'll go as long as you come. (informal)",
