          - {who: A, l2: "Empezamos con una reunión corta a las nueve y luego cada uno trabaja en lo suyo.", l1: "We start with a short meeting at nine and then everyone gets on with their own work."}
          - {who: B, l2: "¿Y hay posibilidades de formación?", l1: "And are there opportunities for training?",
