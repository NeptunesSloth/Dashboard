      - {id: es-b2-12-desaparecer, type: vocab, l2: "desaparecer", l1: "to disappear / to go missing",
         ex: "Mi bici ha desaparecido.", ex_l1: "My bike has gone missing.",
         note: "Like conocer: desaparezco. un desaparecido = a missing person."}
      - {id: es-b2-12-vista-gorda, type: vocab, l2: "hacer la vista gorda", l1: "to turn a blind eye",
         ex: "La policía hacía la vista gorda.", ex_l1: "The police turned a blind eye.",
         note: "Literally 'to make the sight fat'."}
      - {id: es-b2-12-manos-masa, type: vocab, l2: "con las manos en la masa", l1: "red-handed / in the act",
         ex: "Pillaron al ladrón con las manos en la masa.", ex_l1: "They caught the thief red-handed.",
         note: "Literally 'with your hands in the dough'. pillar (Spain) / agarrar = to catch."}
      - {id: es-b2-12-con-la-suya, type: vocab, l2: "salirse con la suya", l1: "to get your own way / to get away with it",
         ex: "Al final siempre se sale con la suya.", ex_l1: "In the end she always gets her own way.",
         note: "The possessive changes: me salgo con la mía, te sales con la tuya."}
      - {id: es-b2-12-dos-por-tres, type: vocab, l2: "cada dos por tres", l1: "all the time / every five minutes (colloquial)",
         ex: "Mi vecino llama a la policía cada dos por tres.", ex_l1: "My neighbour calls the police every five minutes."}
      - {id: es-b2-12-hecho-pecho, type: phrase, l2: "A lo hecho, pecho.", l1: "What's done is done. (face up to the consequences)",
         note: "Literally 'to what is done, chest': stand up and take it."}
      - {id: es-b2-12-donde-estara, type: phrase, l2: "¿Dónde estará mi cartera?", l1: "I wonder where my wallet is.",
         alt: ["¿Dónde estará la cartera?"], note: "The future in a question = I wonder."}
      - {id: es-b2-12-serian-tres, type: phrase, l2: "Serían las tres cuando oí el ruido.", l1: "It must have been about three when I heard the noise.",
         alt: ["Serían como las tres cuando oí el ruido", "Serían más o menos las tres cuando oí el ruido"],
