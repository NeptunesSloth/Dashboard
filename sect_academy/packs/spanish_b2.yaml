      - {id: es-b2-05-c12, type: cloze, text: "Siempre que ___ a la playa, recojo la basura que veo.", answer: "voy",
         l1: "Whenever I go to the beach, I pick up the rubbish I see.", note: "siempre que + indicative = whenever (a habit)"}
      - {id: es-b2-05-c13, type: cloze, text: "Puedes ir a la fiesta siempre que ___ antes de las doce.", answer: "vuelvas", alt: ["regreses"],
