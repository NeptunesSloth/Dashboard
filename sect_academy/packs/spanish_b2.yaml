         ex: "Has dado en el clavo: el problema es el precio.", ex_l1: "You've hit the nail on the head: the problem is the price."}
      - {id: es-b2-04-pelos-lengua, type: vocab, l2: "no tener pelos en la lengua", l1: "to speak your mind / not to mince your words (idiom)",
         ex: "La alcaldesa no tiene pelos en la lengua.", ex_l1: "The mayor doesn't mince her words.",
         note: "Literally 'to have no hairs on your tongue'."}
      - {id: es-b2-04-lena, type: vocab, l2: "echar leña al fuego", l1: "to add fuel to the fire (idiom)",
         ex: "Ese comentario solo echa leña al fuego.", ex_l1: "That comment only adds fuel to the fire.",
         note: "la leña = firewood."}
      - {id: es-b2-04-espada-pared, type: vocab, l2: "estar entre la espada y la pared", l1: "to be between a rock and a hard place (idiom)",
         ex: "Si acepto, pierdo a mis amigos; si no, pierdo el trabajo. Estoy entre la espada y la pared.", ex_l1: "If I accept, I lose my friends; if not, I lose my job. I'm between a rock and a hard place.",
         note: "Literally 'between the sword and the wall'."}
      - {id: es-b2-04-dicho-hecho, type: phrase, l2: "Del dicho al hecho hay mucho trecho.", l1: "Easier said than done. (proverb)",
         alt: ["Del dicho al hecho hay un gran trecho"], note: "Literally 'from saying to doing there is a long way'. Often said about election promises."}
      - {id: es-b2-04-si-hubiera-sabido, type: phrase, l2: "Si lo hubiera sabido, no habría venido.", l1: "If I had known, I wouldn't have come.",
         alt: ["Si lo hubiese sabido, no habría venido", "Si lo hubiera sabido, no hubiera venido", "Si lo hubiese sabido, no hubiese venido", "De haberlo sabido, no habría venido", "No habría venido si lo hubiera sabido"],
         note: "Type 3: si + pluperfect subjunctive, conditional perfect."}
      - {id: es-b2-04-hecho-caso, type: phrase, l2: "Si me hubieras hecho caso, ahora no estarías así.", l1: "If you had listened to me, you wouldn't be in this state now. (informal)",
         alt: ["Si me hubieses hecho caso, ahora no estarías así", "Si me hubieras hecho caso, no estarías así ahora"],
         note: "Mixed type: past condition, present result. hacer caso a alguien = to take notice of someone's advice."}
      - {id: es-b2-04-si-ganan, type: phrase, l2: "Si ganan las elecciones, subirán los impuestos.", l1: "If they win the election, taxes will go up.",
         alt: ["Si ganan las elecciones, van a subir los impuestos", "Si ganan las elecciones, suben los impuestos"],
         note: "Type 1: si + present, future result."}
      - {id: es-b2-04-c1, type: cloze, text: "Si llueve el domingo, la gente no ___ a votar.", answer: "irá", alt: ["va", "saldrá", "sale"],
         l1: "If it rains on Sunday, people won't go and vote.", note: "type 1: si + present → future (or present) in the result"}
      - {id: es-b2-04-c2, type: cloze, text: "Si yo ___ alcalde, construiría más viviendas.", answer: "fuera", alt: ["fuese"],
         l1: "If I were mayor, I would build more housing.", note: "type 2: si + imperfect subjunctive → conditional"}
      - {id: es-b2-04-c3, type: cloze, text: "Si hubiera menos desigualdad, la sociedad ___ más justa.", answer: "sería",
         l1: "If there were less inequality, society would be fairer.", note: "type 2 result: conditional (ser → sería)"}
      - {id: es-b2-04-c4, type: cloze, text: "Si ___ votado, ahora no te quejarías.", answer: "hubieras", alt: ["hubieses"],
         l1: "If you had voted, you wouldn't be complaining now. (informal)", note: "mixed: past condition (pluperfect subjunctive), present result (conditional)"}
      - {id: es-b2-04-c5, type: cloze, text: "Si el partido hubiera hecho una buena campaña, ___ ganado.", answer: "habría", alt: ["hubiera", "hubiese"],
         l1: "If the party had run a good campaign, it would have won.", note: "type 3 result: habría (or hubiera) + participle"}
      - {id: es-b2-04-c6, type: cloze, text: "Si no ___ salido a la calle, nada habría cambiado.", answer: "hubiéramos", alt: ["hubiésemos"],
         l1: "If we hadn't taken to the streets, nothing would have changed.", note: "type 3: si + pluperfect subjunctive"}
      - {id: es-b2-04-c7, type: cloze, text: "Yo no ___ esa petición si fuera tú.", answer: "firmaría",
         l1: "I wouldn't sign that petition if I were you.", note: "the result half can come first: conditional + si + imperfect subjunctive"}
      - {id: es-b2-04-c8, type: cloze, text: "Si ___ tiempo, iría a la manifestación.", answer: "tuviera", alt: ["tuviese"],
         l1: "If I had time, I'd go to the demonstration.", note: "never si + conditional: si tuviera, not si tendría"}
      - {id: es-b2-04-c9, type: cloze, text: "De ___ sabido, no habría votado por ellos.", answer: "haberlo",
         l1: "Had I known, I wouldn't have voted for them.", note: "de + perfect infinitive = a compact type 3 'if'"}
      - {id: es-b2-04-c10, type: cloze, text: "Si ___ más prudente, no habrías dicho eso.", answer: "fueras", alt: ["fueses"],
         l1: "If you were more careful, you wouldn't have said that. (informal)", note: "mixed: a permanent trait now, a past result"}
      - {id: es-b2-04-c11, type: cloze, text: "Si ___ algo, llámame.", answer: "necesitas",
         l1: "If you need anything, call me. (informal)", note: "type 1: si + present → imperative"}
      - {id: es-b2-04-c12, type: cloze, text: "No sabía si ___ a votar o no.", answer: "iría", alt: ["iba"],
         l1: "I didn't know whether I would go and vote or not.", note: "si = whether: the conditional is fine here"}
      - {id: es-b2-04-c13, type: cloze, text: "Si me lo hubieras ___, te habría ayudado.", answer: "pedido",
         l1: "If you had asked me, I would have helped you. (informal)", note: "type 3: pedir → pedido"}
      - {id: es-b2-04-c14, type: cloze, text: "Si las elecciones ___ hoy, ganaría la izquierda.", answer: "fueran", alt: ["fuesen"],
         l1: "If the elections were today, the left would win.", note: "type 2: ser → fueran (agrees with las elecciones)"}
      - {id: es-b2-04-c15, type: cloze, text: "Si el ayuntamiento ___ el presupuesto, habrá más parques.", answer: "aprueba",
         l1: "If the council approves the budget, there will be more parks.", note: "type 1: si + present; aprobar also means to approve"}
      - {id: es-b2-04-c16, type: cloze, text: "Te lo diría si lo ___.", answer: "supiera", alt: ["supiese"],
         l1: "I'd tell you if I knew.", note: "type 2 with the result first"}

  # ---------------------------------------------------------------- 5
  - id: es-b2-05
    title: "Unless we act: conjunctions with the subjunctive — the environment"
    goal: "I can talk about environmental problems and solutions, and set conditions, purposes and concessions."
    notes: |
      Some conjunctions **always** take the subjunctive, because what follows has not happened (yet).

      | Conjunction | Meaning |
      | para que | so that |
      | antes de que | before |
      | sin que | without (someone doing) |
      | a menos que / a no ser que | unless |
      | con tal de que / siempre que | provided that, as long as |
      | en caso de que | in case, in the event that |

      Others change meaning with the mood:

      - **aunque** + indicative = although (a fact): *Aunque llovió, salimos*. + subjunctive = even if / even though it may: *Aunque llueva, saldremos*.
      - **siempre que** + indicative = whenever: *Siempre que voy, llueve*. + subjunctive = provided that.
      - **mientras** + indicative = while; + subjunctive = as long as: *Mientras usemos petróleo…*
      - **cuando** + subjunctive for the future: *Cuando se agote el petróleo…*
      - **por mucho que** + subjunctive = however much.
      - Same subject: preposition + infinitive: *antes de salir*, *sin decir nada*, *para ahorrar*.
    items:
      - {id: es-b2-05-sequia, type: vocab, l2: "la sequía", l1: "the drought",
         ex: "Este verano ha habido una sequía terrible.", ex_l1: "This summer there has been a terrible drought.",
         note: "From seco (dry). The accent on the í breaks the diphthong: se-quí-a."}
      - {id: es-b2-05-incendio, type: vocab, l2: "el incendio forestal", l1: "the forest fire / the wildfire",
         ex: "El incendio forestal destruyó mil hectáreas.", ex_l1: "The forest fire destroyed a thousand hectares.",
         note: "el incendio = a fire that destroys (a building, a forest); el fuego = fire in general."}
      - {id: es-b2-05-inundacion, type: vocab, l2: "la inundación", l1: "the flood",
         ex: "Las inundaciones dejaron a muchas familias sin casa.", ex_l1: "The floods left many families homeless.",
         note: "inundar = to flood."}
      - {id: es-b2-05-calentamiento, type: vocab, l2: "el calentamiento global", l1: "global warming",
         ex: "El calentamiento global es una realidad.", ex_l1: "Global warming is a reality."}
      - {id: es-b2-05-emisiones, type: vocab, l2: "las emisiones", l1: "the emissions",
         ex: "Hay que reducir las emisiones de CO2.", ex_l1: "We must reduce CO2 emissions.",
         note: "Singular la emisión; also a broadcast."}
      - {id: es-b2-05-renovables, type: vocab, l2: "las energías renovables", l1: "renewable energy / renewables", alt: ["la energía renovable"],
         ex: "España produce mucha electricidad con energías renovables.", ex_l1: "Spain produces a lot of electricity from renewables.",
         note: "Spanish often uses the plural: las energías renovables."}
      - {id: es-b2-05-placa-solar, type: vocab, l2: "la placa solar", l1: "the solar panel", alt: ["el panel solar"],
         ex: "Hemos puesto placas solares en el tejado.", ex_l1: "We've put solar panels on the roof.",
         note: "Spain: la placa solar; many countries: el panel solar."}
      - {id: es-b2-05-residuos, type: vocab, l2: "los residuos", l1: "the waste (as a technical or environmental term)", alt: ["los desechos"],
         ex: "Las fábricas producen muchos residuos.", ex_l1: "Factories produce a lot of waste.",
         note: "More formal than la basura. Usually plural."}
      - {id: es-b2-05-envase, type: vocab, l2: "el envase", l1: "the container / the packaging (bottle, carton, tin)",
         ex: "Los envases de plástico van al contenedor amarillo.", ex_l1: "Plastic packaging goes in the yellow bin.",
