  # ---------------------------------------------------------------- 16
  - id: es-b2-16
    title: "Complaints and getting things fixed"
    goal: "I can complain firmly but politely in shops, on the phone and to officials, insist on my rights and agree a solution."
    notes: |
      A good complaint has four steps: **state the problem**, **give the facts**, **say what you want**, **get it confirmed**.

      - **The problem**: *Me han cobrado cuarenta euros de más.* · *Hice un pedido hace dos semanas y todavía no me ha llegado.* · *Quería poner una queja por…*
      - **Facts against excuses**: *Eso es imposible: ese día estuve en casa.* · *Yo nunca he contratado ese servicio.* · *Llamé el lunes y me la confirmaron.*
      - **What you want** (subjunctive): *Quiero que me devuelvan el dinero.* · *Preferiría que me la cambiaran.* · *Le agradecería que me informaran…*
      - **Confirmation**: *¿Me lo puede confirmar por escrito?* · *¿Me pueden dar un justificante?*
      - **Escalate**: *Me gustaría hablar con el responsable.* In Spain every business must give you **la hoja de reclamaciones** (the official complaints form); in Peru it is *el libro de reclamaciones*.

      Useful words: *la garantía* (guarantee), *el tique* (receipt), *el reembolso / la devolución* (refund), *dar de baja* (to cancel a service), *la fianza* (rental deposit, Spain; *el depósito* in much of Latin America).
    items:
      - id: es-b2-16-cafetera
        type: dialogue
        title: "A faulty coffee machine"
        scene: "You take a coffee machine back to the shop where you bought it a month ago. You and the assistant use usted."
        you: A
        lines:
          - {who: A, l2: "Buenos días. Compré esta cafetera hace un mes y ya no funciona.", l1: "Good morning. I bought this coffee machine a month ago and it's already stopped working.",
             alt: ["Buenos días. Compré esta cafetera hace un mes y ya no va.", "Buenos días, compré esta cafetera hace un mes y ya no funciona.", "Buenos días. Hace un mes compré esta cafetera y ya no funciona.", "Buenos días. Compré esta cafetera hace un mes y ha dejado de funcionar.", "Buenos días. Compré esta cafetera hace un mes y ya no anda."]}
          - {who: B, l2: "Vaya, lo siento. ¿Trae el tique de compra?", l1: "Oh dear, I'm sorry. Have you brought the receipt?"}
          - {who: A, l2: "Sí, aquí lo tiene. Está en garantía, ¿verdad?", l1: "Yes, here it is. It's under guarantee, isn't it?",
             alt: ["Sí, aquí lo tiene. Está en garantía, ¿no?", "Sí, aquí tiene. Está en garantía, ¿verdad?", "Sí, aquí lo tiene. Está dentro de la garantía, ¿verdad?", "Sí, aquí está. Está en garantía, ¿verdad?", "Aquí lo tiene. Está en garantía, ¿verdad?"]}
          - {who: B, l2: "Sí. Podemos enviarla al servicio técnico; tardarán unas tres semanas.", l1: "Yes. We can send it to the repair service; they'll take about three weeks."}
          - {who: A, l2: "¿Tres semanas? Preferiría que me la cambiaran por otra.", l1: "Three weeks? I'd rather you exchanged it for another one.",
             alt: ["¿Tres semanas? Preferiría que me la cambiasen por otra.", "¿Tres semanas? Prefiero que me la cambien por otra.", "¿Tres semanas? Preferiría que me dieran otra.", "¿Tres semanas? Preferiría que me la cambiaran por una nueva.", "¿Tres semanas? Me gustaría que me la cambiaran por otra."]}
          - {who: B, l2: "Lo siento, pero la política de la tienda es repararla primero.", l1: "I'm sorry, but the shop's policy is to repair it first."}
          - {who: A, l2: "Entonces quisiera la hoja de reclamaciones, por favor.", l1: "In that case, I'd like the complaints form, please.",
             alt: ["Entonces quiero la hoja de reclamaciones, por favor.", "Entonces, ¿me da la hoja de reclamaciones, por favor?", "En ese caso, quisiera la hoja de reclamaciones, por favor.", "Entonces me gustaría la hoja de reclamaciones, por favor.", "Entonces, ¿me puede dar la hoja de reclamaciones, por favor?", "Entonces quisiera el libro de reclamaciones, por favor."]}
          - {who: B, l2: "Espere, voy a hablar con la encargada. Seguro que encontramos una solución.", l1: "Wait, I'll talk to the manager. I'm sure we'll find a solution."}

      - id: es-b2-16-factura
        type: dialogue
        title: "An overcharged phone bill"
        scene: "You call your mobile phone company's customer service. You and the agent use usted."
        you: B
        lines:
          - {who: A, l2: "Servicio de atención al cliente, buenos días. ¿En qué puedo ayudarle?", l1: "Customer service, good morning. How can I help you?"}
          - {who: B, l2: "Me han cobrado cuarenta euros de más en la última factura.", l1: "I've been overcharged by forty euros on my last bill.",
             alt: ["Me han cobrado cuarenta euros de más en la factura.", "Me han cobrado de más cuarenta euros en la última factura.", "En la última factura me han cobrado cuarenta euros de más.", "Me cobraron cuarenta euros de más en la última factura.", "Me han cobrado cuarenta euros de más en mi última factura."]}
          - {who: A, l2: "Déjeme comprobarlo... Aparece un servicio de música que contrató en marzo.", l1: "Let me check... There's a music service on it that you signed up for in March."}
          - {who: B, l2: "Yo nunca he contratado ese servicio.", l1: "I have never signed up for that service.",
             alt: ["Nunca he contratado ese servicio.", "Yo no he contratado nunca ese servicio.", "Yo nunca contraté ese servicio.", "Yo no he contratado ese servicio nunca.", "Nunca contraté ese servicio."]}
          - {who: A, l2: "Es posible que se activara por error al actualizar la aplicación.", l1: "It may have been switched on by mistake when the app was updated."}
          - {who: B, l2: "Pues quiero que me devuelvan el dinero y que lo den de baja.", l1: "Well, I want you to refund the money and cancel it.",
             alt: ["Pues quiero que me devuelvan el dinero y que lo cancelen.", "Quiero que me devuelvan el dinero y que lo den de baja.", "Pues quiero que me devuelvan el dinero y lo den de baja.", "Pues quiero que me devuelvan el dinero y que me lo den de baja.", "Pues quiero que me reembolsen el dinero y que lo den de baja."]}
          - {who: A, l2: "Por supuesto. Le haremos el abono en la próxima factura.", l1: "Of course. We'll credit it to your next bill."}
          - {who: B, l2: "¿Me lo puede confirmar por escrito?", l1: "Can you confirm that in writing?",
             alt: ["¿Me lo podría confirmar por escrito?", "¿Puede confirmármelo por escrito?", "¿Podría confirmármelo por escrito?", "¿Me lo pueden confirmar por escrito?", "¿Me lo puede enviar por escrito?"]}
          - {who: A, l2: "Sí, ahora mismo le envío un correo con el número de incidencia.", l1: "Yes, I'll send you an e-mail with the incident number right now."}

      - id: es-b2-16-maleta
        type: dialogue
        title: "The missing suitcase"
        scene: "You have just landed in Seville for a wedding. Your suitcase hasn't appeared, so you go to the airline's desk. You use usted."
        you: A
        lines:
          - {who: A, l2: "Buenas tardes. Mi maleta no ha salido.", l1: "Good afternoon. My suitcase hasn't come out.",
             alt: ["Buenas tardes, mi maleta no ha salido.", "Buenas tardes. Mi maleta no ha llegado.", "Buenas tardes. No ha salido mi maleta.", "Buenas tardes. Mi maleta no salió.", "Buenas tardes. Mi maleta no ha aparecido."]}
          - {who: B, l2: "Lo siento mucho. ¿Me deja su tarjeta de embarque y la etiqueta de la maleta?", l1: "I'm very sorry. Could I have your boarding pass and the luggage tag?"}
          - {who: A, l2: "Aquí tiene. Es una maleta roja, grande, con ruedas.", l1: "Here you are. It's a big red suitcase with wheels.",
             alt: ["Aquí tiene. Es una maleta grande, roja, con ruedas.", "Aquí tiene. Es una maleta roja y grande, con ruedas.", "Aquí tiene. Es una maleta grande y roja con ruedas.", "Aquí tiene. Es una maleta roja grande con ruedas.", "Aquí la tiene. Es una maleta roja, grande, con ruedas."]}
          - {who: B, l2: "Según el sistema, se ha quedado en Fráncfort. Llegará en el vuelo de mañana.", l1: "According to the system, it was left behind in Frankfurt. It will arrive on tomorrow's flight."}
          - {who: A, l2: "Pero llevo dentro todo lo que necesito para una boda.", l1: "But everything I need for a wedding is in it.",
             alt: ["Pero ahí llevo todo lo que necesito para una boda.", "Pero dentro llevo todo lo que necesito para una boda.", "Pero tengo dentro todo lo que necesito para una boda.", "Pero ahí dentro llevo todo lo que necesito para una boda.", "Pero en la maleta llevo todo lo que necesito para una boda."]}
          - {who: B, l2: "Entiendo. Puede comprar lo imprescindible y la compañía se lo reembolsará.", l1: "I understand. You can buy the essentials and the airline will reimburse you."}
          - {who: A, l2: "¿Hasta qué cantidad me reembolsan?", l1: "Up to what amount will you reimburse me?",
             alt: ["¿Hasta cuánto me reembolsan?", "¿Hasta qué cantidad me devuelven?", "¿Hasta cuánto me devuelven?", "¿Hasta qué cantidad me reembolsarán?", "¿Hasta qué importe me reembolsan?"]}
          - {who: B, l2: "Hasta cien euros. Guarde todos los tiques, por favor.", l1: "Up to a hundred euros. Please keep all your receipts."}
          - {who: A, l2: "De acuerdo. ¿Me la pueden llevar al hotel?", l1: "All right. Can you deliver it to my hotel?",
             alt: ["De acuerdo. ¿Me la podrían llevar al hotel?", "Vale. ¿Me la pueden llevar al hotel?", "De acuerdo, ¿me la pueden llevar al hotel?", "De acuerdo. ¿Me la pueden mandar al hotel?", "De acuerdo. ¿Me la pueden enviar al hotel?"]}

      - id: es-b2-16-pedido
        type: dialogue
        title: "The parcel that never came"
        scene: "You call an online shop because your order hasn't arrived. The agent uses usted."
        you: B
        lines:
          - {who: A, l2: "Atención al cliente, le atiende Raúl. ¿En qué puedo ayudarle?", l1: "Customer service, Raúl speaking. How can I help you?"}
          - {who: B, l2: "Hice un pedido hace dos semanas y todavía no me ha llegado.", l1: "I placed an order two weeks ago and it still hasn't arrived.",
             alt: ["Hice un pedido hace dos semanas y aún no me ha llegado.", "Hice un pedido hace dos semanas y todavía no ha llegado.", "Hace dos semanas hice un pedido y todavía no me ha llegado.", "Hice un pedido hace dos semanas y no me ha llegado todavía.", "Hice un pedido hace dos semanas y todavía no me llegó."]}
          - {who: A, l2: "¿Me da el número de pedido, por favor?", l1: "Can you give me the order number, please?"}
          - {who: B, l2: "Ahora mismo no lo tengo. ¿Le vale mi correo electrónico?", l1: "I haven't got it to hand right now. Will my e-mail address do?",
             alt: ["Ahora mismo no lo tengo. ¿Le sirve mi correo electrónico?", "Ahora mismo no lo tengo a mano. ¿Le vale mi correo electrónico?", "Ahora no lo tengo. ¿Le vale mi correo electrónico?", "Ahora mismo no lo tengo. ¿Le vale mi correo?", "Ahora mismo no lo tengo. ¿Le sirve mi correo?"]}
          - {who: A, l2: "Sí... Aquí está. Según la empresa de transporte, se lo entregaron el martes.", l1: "Yes... Here it is. According to the delivery company, it was delivered to you on Tuesday."}
          - {who: B, l2: "Eso es imposible: el martes estuve en casa todo el día.", l1: "That's impossible: I was at home all day on Tuesday.",
             alt: ["Eso es imposible, el martes estuve en casa todo el día.", "Es imposible: el martes estuve todo el día en casa.", "Eso es imposible: el martes estuve todo el día en casa.", "No puede ser: el martes estuve en casa todo el día.", "Imposible: el martes estuve en casa todo el día."]}
          - {who: A, l2: "Puede que lo dejaran en otra dirección. Voy a abrir una reclamación.", l1: "They may have left it at another address. I'm going to open a claim."}
          - {who: B, l2: "Si no aparece, ¿me lo volverán a enviar?", l1: "If it doesn't turn up, will you send it again?",
             alt: ["Si no aparece, ¿me lo enviarán otra vez?", "Si no aparece, ¿me lo volverán a mandar?", "Si no aparece, ¿me lo van a volver a enviar?", "Si no aparece, ¿me lo vuelven a enviar?", "Y si no aparece, ¿me lo volverán a enviar?"]}
          - {who: A, l2: "Sí, o le devolvemos el importe, lo que usted prefiera.", l1: "Yes, or we'll refund the amount, whichever you prefer."}
          - {who: B, l2: "Prefiero que me lo vuelvan a enviar.", l1: "I'd rather you sent it again.",
             alt: ["Prefiero que me lo envíen otra vez.", "Prefiero que me lo envíen de nuevo.", "Preferiría que me lo volvieran a enviar.", "Prefiero que me lo manden otra vez.", "Preferiría que me lo enviaran de nuevo."]}

      - id: es-b2-16-fianza
        type: dialogue
        title: "Getting your deposit back"
        scene: "You moved out of your rented flat two months ago and your landlord, Jorge, still hasn't returned the deposit. You call him; you use tú."
        you: A
        lines:
          - {who: A, l2: "Hola, Jorge. Te llamo por lo de la fianza.", l1: "Hi, Jorge. I'm calling about the deposit.",
             alt: ["Hola, Jorge. Te llamo por la fianza.", "Hola, Jorge, te llamo por lo de la fianza.", "Hola, Jorge. Te llamo por el tema de la fianza.", "Hola, Jorge. Te llamaba por lo de la fianza.", "Hola, Jorge. Te llamo por lo del depósito."]}
          - {who: B, l2: "Ya, perdona, sé que han pasado dos meses. Es que había que pintar el salón y arreglar una persiana.", l1: "Yes, sorry, I know it's been two months. The thing is, the living room needed painting and a blind needed fixing."}
          - {who: A, l2: "El salón ya estaba así cuando entré; lo pone en el inventario.", l1: "The living room was already like that when I moved in; it says so in the inventory.",
             alt: ["El salón ya estaba así cuando entré, lo pone en el inventario.", "El salón ya estaba así cuando llegué; lo pone en el inventario.", "El salón ya estaba así cuando entré; está en el inventario.", "El salón ya estaba así cuando entré; viene en el inventario.", "El salón ya estaba así cuando entré a vivir; lo pone en el inventario."]}
          - {who: B, l2: "Ah, ¿sí? No me acordaba. ¿Y la persiana?", l1: "Oh, really? I didn't remember. And the blind?"}
          - {who: A, l2: "Vale, la persiana la rompí yo. Descuéntamela de la fianza.", l1: "OK, I did break the blind. Take it off the deposit.",
             alt: ["Vale, la persiana sí la rompí yo. Descuéntamela de la fianza.", "Vale, la persiana la rompí yo; descuéntamela de la fianza.", "Vale, la persiana la rompí yo. Descuéntala de la fianza.", "Bueno, la persiana la rompí yo. Descuéntamela de la fianza.", "Vale, la persiana la rompí yo. Quítamela de la fianza."]}
          - {who: B, l2: "Me parece justo. Te devuelvo el resto esta semana.", l1: "That seems fair. I'll give you back the rest this week."}
          - {who: A, l2: "Te agradecería que me lo ingresaras antes del viernes.", l1: "I'd be grateful if you paid it into my account before Friday.",
             alt: ["Te agradecería que me lo ingresases antes del viernes.", "Te agradecería que me lo transfirieras antes del viernes.", "Te agradecería que me lo ingresaras antes de este viernes.", "Te agradecería que me lo pagaras antes del viernes.", "Te agradecería que me lo depositaras antes del viernes."]}
          - {who: B, l2: "Sin problema. Te lo ingreso mañana mismo.", l1: "No problem. I'll pay it in tomorrow."}

      - id: es-b2-16-reserva
        type: dialogue
        title: "The booking that wasn't"
        scene: "You arrive at a busy restaurant with five friends, but they can't find your booking. You use usted with the head waiter."
        you: A
        lines:
          - {who: A, l2: "Buenas noches. Tenemos una reserva a nombre de Moreno, para seis.", l1: "Good evening. We have a booking in the name of Moreno, for six.",
             alt: ["Buenas noches. Tenemos una reserva a nombre de Moreno para seis personas.", "Buenas noches, tenemos una reserva a nombre de Moreno, para seis.", "Buenas noches. Tenemos reserva a nombre de Moreno, para seis.", "Buenas noches. Hay una reserva a nombre de Moreno, para seis.", "Buenas noches. Tenemos una reservación a nombre de Moreno, para seis."]}
          - {who: B, l2: "Moreno... Lo siento, no me aparece ninguna reserva con ese nombre.", l1: "Moreno... I'm sorry, I can't see any booking under that name."}
          - {who: A, l2: "No puede ser. Llamé el lunes y me la confirmaron.", l1: "That can't be right. I called on Monday and they confirmed it.",
             alt: ["Es imposible. Llamé el lunes y me la confirmaron.", "No puede ser, llamé el lunes y me la confirmaron.", "No puede ser. Llamé el lunes y me confirmaron la reserva.", "No puede ser. Llamé el lunes y me lo confirmaron.", "No es posible. Llamé el lunes y me la confirmaron."]}
          - {who: B, l2: "Quizás la apuntaron para otro día. Ahora mismo estamos completos.", l1: "Perhaps it was written down for another day. We're full right now."}
          - {who: A, l2: "¿Y no podrían juntar dos mesas en la terraza?", l1: "And couldn't you put two tables together on the terrace?",
             alt: ["¿No podrían juntar dos mesas en la terraza?", "¿Y no se podrían juntar dos mesas en la terraza?", "¿Y no podrían unir dos mesas en la terraza?", "¿Y no pueden juntar dos mesas en la terraza?", "¿Y no podrían juntarnos dos mesas en la terraza?"]}
          - {who: B, l2: "Déjeme ver... Si esperan diez minutos, les preparo una mesa fuera.", l1: "Let me see... If you wait ten minutes, I'll get a table ready for you outside."}
          - {who: A, l2: "Muy amable. Esperamos en la barra.", l1: "That's very kind. We'll wait at the bar.",
             alt: ["Muy amable. Esperaremos en la barra.", "Muy amable, esperamos en la barra.", "Muchas gracias. Esperamos en la barra.", "Es usted muy amable. Esperamos en la barra.", "Muy amable. Le esperamos en la barra."]}
          - {who: B, l2: "Y la primera ronda corre de nuestra cuenta, por las molestias.", l1: "And the first round is on us, for the inconvenience."}

      - id: es-b2-16-obras
        type: dialogue
        title: "A complaint to the town hall"
        scene: "Road works in your street start at dawn. You call the town hall's citizen helpline. You use usted."
        you: B
        lines:
          - {who: A, l2: "Ayuntamiento, buenos días. ¿En qué puedo ayudarle?", l1: "Town hall, good morning. How can I help you?"}
          - {who: B, l2: "Quería poner una queja por las obras de mi calle.", l1: "I'd like to make a complaint about the works in my street.",
             alt: ["Quería presentar una queja por las obras de mi calle.", "Quisiera poner una queja por las obras de mi calle.", "Quería poner una queja sobre las obras de mi calle.", "Quería quejarme de las obras de mi calle.", "Quería hacer una queja por las obras de mi calle."]}
          - {who: A, l2: "¿Cuál es exactamente el problema?", l1: "What exactly is the problem?"}
          - {who: B, l2: "Empiezan a las seis de la mañana, incluso los sábados.", l1: "They start at six in the morning, even on Saturdays.",
             alt: ["Empiezan a trabajar a las seis de la mañana, incluso los sábados.", "Empiezan a las seis de la mañana, hasta los sábados.", "Empiezan a las seis de la mañana, también los sábados.", "Comienzan a las seis de la mañana, incluso los sábados.", "Empiezan a las seis de la mañana incluso los sábados."]}
          - {who: A, l2: "Según la normativa municipal, no pueden empezar antes de las ocho.", l1: "Under the local regulations, they can't start before eight."}
          - {who: B, l2: "Pues no la cumplen. Llevo un mes sin dormir bien.", l1: "Well, they're not complying with them. I haven't slept properly for a month.",
             alt: ["Pues no la cumplen, llevo un mes sin dormir bien.", "Pues no la cumplen. Hace un mes que no duermo bien.", "Pues no la están cumpliendo. Llevo un mes sin dormir bien.", "Pues no la respetan. Llevo un mes sin dormir bien.", "Pues no la cumplen. Llevo un mes sin poder dormir bien."]}
          - {who: A, l2: "Tomo nota. Enviaremos a un inspector esta semana.", l1: "I've made a note of it. We'll send an inspector this week."}
          - {who: B, l2: "Le agradecería que me informaran del resultado.", l1: "I'd be grateful if you would let me know the outcome.",
             alt: ["Le agradecería que me informasen del resultado.", "Le agradecería que me informaran de los resultados.", "Le agradecería que me comunicaran el resultado.", "Les agradecería que me informaran del resultado.", "Le agradecería que me informaran sobre el resultado."]}
          - {who: A, l2: "Por supuesto. ¿Me da un teléfono de contacto?", l1: "Of course. Could you give me a contact number?"}

      - id: es-b2-16-curso
        type: dialogue
        title: "A refund for a cancelled course"
        scene: "The photography course you paid for has been cancelled. You go to the school's reception. You use usted."
        you: A
        lines:
          - {who: A, l2: "Buenos días. Han cancelado el curso en el que me matriculé.", l1: "Good morning. You've cancelled the course I enrolled on.",
             alt: ["Buenos días. Han cancelado el curso en el que me inscribí.", "Buenos días. Han cancelado el curso al que me apunté.", "Buenos días, han cancelado el curso en el que me matriculé.", "Buenos días. Han cancelado el curso en el que estaba matriculado.", "Buenos días. Han cancelado el curso en el que estaba matriculada."]}
          - {who: B, l2: "Sí, lo sentimos mucho. No hubo suficientes alumnos. Le podemos ofrecer otro curso.", l1: "Yes, we're very sorry. There weren't enough students. We can offer you another course."}
          - {who: A, l2: "Se lo agradezco, pero prefiero que me devuelvan la matrícula.", l1: "Thank you, but I'd rather have my fee refunded.",
             alt: ["Se lo agradezco, pero preferiría que me devolvieran la matrícula.", "Se lo agradezco, pero prefiero que me devuelvan el dinero.", "Gracias, pero prefiero que me devuelvan la matrícula.", "Se lo agradezco, pero prefiero que me devuelvan el importe de la matrícula.", "Se lo agradezco, pero preferiría que me devolviesen la matrícula."]}
          - {who: B, l2: "Entiendo. La devolución tarda unos treinta días.", l1: "I understand. The refund takes about thirty days."}
          - {who: A, l2: "¿Treinta días? Me cobraron en el momento.", l1: "Thirty days? They charged me straight away.",
             alt: ["¿Treinta días? A mí me cobraron en el momento.", "¿Treinta días? Me cobraron al momento.", "¿Treinta días? Me cobraron en el acto.", "¿Treinta días? Pues me cobraron en el momento.", "¿Treinta días? Me lo cobraron en el momento."]}
          - {who: B, l2: "Lo comprendo, pero es el plazo del banco; no depende de nosotros.", l1: "I understand, but that's the bank's timescale; it doesn't depend on us."}
          - {who: A, l2: "Está bien. ¿Me pueden dar un justificante?", l1: "All right. Can you give me written proof (of the refund)?",
             alt: ["Está bien. ¿Me podrían dar un justificante?", "Vale. ¿Me pueden dar un justificante?", "Está bien, ¿me pueden dar un justificante?", "Está bien. ¿Me puede dar un justificante?", "Está bien. ¿Me pueden dar un comprobante?"]}
          - {who: B, l2: "Claro, se lo imprimo ahora mismo.", l1: "Of course, I'll print it for you right now."}

      - id: es-b2-16-gimnasio
        type: dialogue
        title: "Taking it to the manager"
        scene: "Your gym kept charging you after you cancelled. The receptionist couldn't help, so the manager comes out to speak to you. You use usted."
        you: B
        lines:
          - {who: A, l2: "Buenas tardes, soy la directora del centro. Me dicen que tiene usted un problema.", l1: "Good afternoon, I'm the manager of the centre. I'm told you have a problem."}
          - {who: B, l2: "Sí. Me di de baja en junio y me siguen cobrando la cuota.", l1: "Yes. I cancelled my membership in June and you're still charging me the fee.",
             alt: ["Sí. Me di de baja en junio y me siguen cobrando.", "Sí, me di de baja en junio y me siguen cobrando la cuota.", "Sí. Me di de baja en junio y todavía me cobran la cuota.", "Sí. Me di de baja en junio y siguen cobrándome la cuota.", "Sí. Me di de baja en junio y me siguen cobrando la mensualidad."]}
          - {who: A, l2: "¿Tiene algún comprobante de la baja?", l1: "Do you have any proof of the cancellation?"}
          - {who: B, l2: "Sí, aquí tiene el correo en el que me la confirmaron.", l1: "Yes, here's the e-mail in which they confirmed it.",
             alt: ["Sí, aquí tiene el correo donde me la confirmaron.", "Sí, aquí tiene el correo en el que me lo confirmaron.", "Sí, aquí tiene el correo en que me la confirmaron.", "Sí, aquí está el correo en el que me la confirmaron.", "Sí, aquí tiene el correo electrónico en el que me la confirmaron."]}
          - {who: A, l2: "Tiene usted razón. Ha sido un error nuestro y le pido disculpas.", l1: "You're right. It was our mistake and I apologise."}
          - {who: B, l2: "Lo que pido es que me devuelvan los tres meses.", l1: "What I'm asking is for you to refund the three months.",
             alt: ["Lo que pido es que me devuelvan las tres cuotas.", "Solo pido que me devuelvan los tres meses.", "Lo único que pido es que me devuelvan los tres meses.", "Lo que quiero es que me devuelvan los tres meses.", "Lo que pido es que me devuelvan el dinero de los tres meses."]}
          - {who: A, l2: "Por supuesto. Y, como compensación, le regalamos un mes si algún día vuelve.", l1: "Of course. And by way of compensation, we'll give you a free month if you ever come back."}
          - {who: B, l2: "Se lo agradezco. Así da gusto.", l1: "Thank you. That's how it should be done.",
             alt: ["Se lo agradezco mucho. Así da gusto.", "Muchas gracias. Así da gusto.", "Se lo agradezco, así da gusto.", "Se lo agradezco mucho.", "Muchas gracias, se lo agradezco."]}
