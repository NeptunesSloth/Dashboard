          - {who: A, l2: "Sí, tenemos un presupuesto anual para cursos.", l1: "Yes, we have an annual budget for courses."}
          - {who: B, l2: "¿Cuáles son los próximos pasos del proceso?", l1: "What are the next steps in the process?",
             alt: ["¿Cuáles son los siguientes pasos del proceso?", "¿Cuál es el siguiente paso del proceso?", "¿Cuál es el próximo paso?", "¿Cuáles son los próximos pasos?", "¿Cuáles son los siguientes pasos?"]}
          - {who: A, l2: "Te llamaremos antes del viernes para darte una respuesta.", l1: "We'll call you before Friday to give you an answer."}
          - {who: B, l2: "Muchas gracias por vuestro tiempo.", l1: "Thank you very much for your time. (to both of them)",
             alt: ["Gracias por vuestro tiempo.", "Muchas gracias por su tiempo.", "Muchísimas gracias por vuestro tiempo.", "Muchas gracias por todo.", "Gracias por su tiempo."]}

      - id: es-b2-15-llamada
        type: dialogue
        title: "The call to arrange an interview"
