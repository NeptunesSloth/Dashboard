      - {id: es-b2-05-c14, type: cloze, text: "Apaga las luces antes de ___.", answer: "salir", alt: ["irte", "marcharte"],
         l1: "Turn off the lights before you leave. (informal)", note: "same subject → antes de + infinitive"}
      - {id: es-b2-05-c15, type: cloze, text: "Por mucho que ___, no me vas a convencer.", answer: "insistas",
         l1: "However much you insist, you're not going to convince me.", note: "por mucho que + subjunctive = however much"}
      - {id: es-b2-05-c16, type: cloze, text: "A no ser que el gobierno ___ medidas urgentes, muchas especies desaparecerán.", answer: "tome", alt: ["adopte"],
         l1: "Unless the government takes urgent measures, many species will disappear.", note: "a no ser que = a menos que, + subjunctive"}

  # ---------------------------------------------------------------- 6
  - id: es-b2-06
    title: "Whose work changed the world: relative clauses — science and technology"
    goal: "I can describe discoveries, devices and apps precisely, using whose, which and whatever, and say what I am looking for."
    notes: |
      **Subjunctive or indicative?** In a relative clause, the mood depends on whether the thing is known to exist.

      - Known, real: *Uso una aplicación que **funciona** sin conexión*.
      - Unknown, wanted or denied: *Busco una aplicación que **funcione** sin conexión*; *No hay nadie que **sepa** arreglarlo*.
      - "Whoever / whatever" is still open: *El que **llegue** primero…*, *Elige lo que **quieras***.

      **Which relative word?**

      | Word | Use | Example |
      | lo que / lo cual | refers back to a whole idea | Falló, **lo cual** causó problemas. |
      | el cual, la cual, los cuales, las cuales | after a preposition (formal) | las razones por **las cuales**… |
      | quien / quienes | people; "whoever" | **Quien** quiera venir, que se apunte. |
      | cuyo, cuya, cuyos, cuyas | whose | una científica **cuya** obra… |

      - **cuyo** agrees with the thing possessed, not with the owner: *el investigador cuyas ideas…*
      - Commas around a clause about people allow *quien(es)*: *Los médicos, quienes…*; without commas use *que*.
      - In questions "whose?" is *¿de quién?*, never *cuyo*.
    items:
      - {id: es-b2-06-investigador, type: vocab, l2: "el investigador", l1: "the researcher (male)",
         ex: "Un equipo de investigadores ha descubierto una nueva especie.", ex_l1: "A team of researchers has discovered a new species.",
         note: "Feminine: la investigadora."}
      - {id: es-b2-06-investigacion, type: vocab, l2: "la investigación", l1: "the research / the investigation",
         ex: "La investigación científica necesita más dinero.", ex_l1: "Scientific research needs more money.",
         note: "Uncountable in English, but Spanish can say una investigación (a study, a police inquiry)."}
      - {id: es-b2-06-descubrimiento, type: vocab, l2: "el descubrimiento", l1: "the discovery",
         ex: "Fue uno de los grandes descubrimientos del siglo.", ex_l1: "It was one of the great discoveries of the century.",
         note: "descubrir → descubierto (irregular participle)."}
      - {id: es-b2-06-invento, type: vocab, l2: "el invento", l1: "the invention",
         ex: "La imprenta fue un invento revolucionario.", ex_l1: "The printing press was a revolutionary invention."}
      - {id: es-b2-06-avance, type: vocab, l2: "el avance", l1: "the advance / the breakthrough",
         ex: "Ha sido un gran avance en la lucha contra el cáncer.", ex_l1: "It has been a great breakthrough in the fight against cancer."}
      - {id: es-b2-06-ia, type: vocab, l2: "la inteligencia artificial", l1: "artificial intelligence (AI)", alt: ["la IA"],
         ex: "La inteligencia artificial está cambiando muchos trabajos.", ex_l1: "Artificial intelligence is changing many jobs.",
         note: "Abbreviated la IA (not AI)."}
      - {id: es-b2-06-dispositivo, type: vocab, l2: "el dispositivo", l1: "the device",
         ex: "Puedes usar la aplicación en cualquier dispositivo.", ex_l1: "You can use the app on any device."}
      - {id: es-b2-06-aplicacion, type: vocab, l2: "la aplicación", l1: "the app / the application", alt: ["la app"],
         ex: "Me he descargado una aplicación para aprender idiomas.", ex_l1: "I've downloaded an app for learning languages.",
         note: "A job application is una solicitud."}
      - {id: es-b2-06-datos, type: vocab, l2: "los datos", l1: "the data / the (mobile) data",
         ex: "Me he quedado sin datos en el móvil.", ex_l1: "I've run out of data on my phone.",
         note: "Plural in Spanish: los datos son… el dato = one piece of information."}
      - {id: es-b2-06-usuario, type: vocab, l2: "el usuario", l1: "the user (male)",
         ex: "La aplicación tiene un millón de usuarios.", ex_l1: "The app has a million users.",
         note: "Also the username: el nombre de usuario."}
      - {id: es-b2-06-actualizar, type: vocab, l2: "actualizar", l1: "to update",
         ex: "Tienes que actualizar el sistema.", ex_l1: "You have to update the system.",
         note: "False friend: actual means current, not actual. Spelling: actualice (z → c before e)."}
      - {id: es-b2-06-archivo, type: vocab, l2: "el archivo", l1: "the file (on a computer) / the archive", alt: ["el fichero"],
         ex: "No puedo abrir el archivo.", ex_l1: "I can't open the file.",
         note: "Spain also says el fichero."}
      - {id: es-b2-06-guardar, type: vocab, l2: "guardar", l1: "to save (a file) / to keep, to put away",
         ex: "No te olvides de guardar el documento.", ex_l1: "Don't forget to save the document.",
         note: "To save money is ahorrar; to save a life is salvar."}
      - {id: es-b2-06-cargar, type: vocab, l2: "cargar", l1: "to charge (a battery) / to load",
         ex: "Tengo que cargar el móvil.", ex_l1: "I have to charge my phone.",
         note: "el cargador = the charger. Spelling: cargue (g → gu before e)."}
      - {id: es-b2-06-enchufe-plug, type: vocab, l2: "el enchufe", l1: "the plug / the (power) socket",
         ex: "¿Hay algún enchufe libre?", ex_l1: "Is there a free socket?",
         note: "enchufar = to plug in. Figuratively, tener enchufe = to have connections."}
      - {id: es-b2-06-cientifico, type: vocab, l2: "el científico", l1: "the scientist (male)",
         ex: "Los científicos llevan años estudiando el virus.", ex_l1: "Scientists have been studying the virus for years.",
         note: "Feminine: la científica. As an adjective: scientific."}
      - {id: es-b2-06-privacidad, type: vocab, l2: "la privacidad", l1: "privacy",
         ex: "Me preocupa la privacidad de mis datos.", ex_l1: "I'm worried about the privacy of my data."}
      - {id: es-b2-06-desarrollar, type: vocab, l2: "desarrollar", l1: "to develop",
         ex: "La empresa está desarrollando un coche eléctrico.", ex_l1: "The company is developing an electric car.",
         note: "Double r in the middle: de-sa-rro-llar. el desarrollo = development."}
      - {id: es-b2-06-al-dia, type: vocab, l2: "estar al día", l1: "to be up to date / to keep up",
         ex: "Es difícil estar al día con tantos avances.", ex_l1: "It's hard to keep up with so many advances.",
         note: "ponerse al día = to catch up."}
      - {id: es-b2-06-ciencia-cierta, type: vocab, l2: "a ciencia cierta", l1: "for certain / for sure (usually with saber)",
         ex: "Nadie sabe a ciencia cierta cómo empezó.", ex_l1: "Nobody knows for certain how it started."}
      - {id: es-b2-06-abrir-cerrar, type: vocab, l2: "en un abrir y cerrar de ojos", l1: "in the blink of an eye / in a flash",
         ex: "El archivo se descargó en un abrir y cerrar de ojos.", ex_l1: "The file downloaded in the blink of an eye."}
      - {id: es-b2-06-tres-pies, type: vocab, l2: "buscarle tres pies al gato", l1: "to overcomplicate things / to look for problems where there are none (idiom)",
         ex: "No le busques tres pies al gato: funciona y ya está.", ex_l1: "Don't overcomplicate it: it works and that's that.",
         note: "Literally 'to look for three feet on the cat' (the original was five feet)."}
      - {id: es-b2-06-harina, type: phrase, l2: "Eso es harina de otro costal.", l1: "That's a different kettle of fish. / That's another matter. (idiom)",
         alt: ["Eso es otro cantar"], note: "Literally 'that's flour from another sack'."}
      - {id: es-b2-06-nadie-programar, type: phrase, l2: "No conozco a nadie que sepa programar.", l1: "I don't know anyone who can program.",
         alt: ["No conozco a nadie que sepa programar bien"], note: "Denying that such a person exists → subjunctive."}
      - {id: es-b2-06-cuyo-trabajo, type: phrase, l2: "Es una científica cuyo trabajo admiro mucho.", l1: "She's a scientist whose work I really admire.",
         note: "cuyo agrees with trabajo (masculine), not with the woman."}
      - {id: es-b2-06-lo-cual, type: phrase, l2: "Llegó tarde, lo cual no me sorprendió.", l1: "He arrived late, which didn't surprise me.",
         alt: ["Llegó tarde, lo que no me sorprendió"], note: "lo cual / lo que refers back to the whole idea."}
      - {id: es-b2-06-c1, type: cloze, text: "¿Hay alguien aquí que ___ arreglar esta impresora?", answer: "sepa",
         l1: "Is there anyone here who knows how to fix this printer?", note: "we don't know if such a person exists → subjunctive"}
      - {id: es-b2-06-c2, type: cloze, text: "Necesitamos una aplicación que ___ sin conexión.", answer: "funcione",
         l1: "We need an app that works offline.", note: "a thing we're still looking for → subjunctive"}
      - {id: es-b2-06-c3, type: cloze, text: "Uso un programa que ___ los archivos automáticamente.", answer: "guarda",
         l1: "I use a program that saves files automatically.", note: "it exists and I use it → indicative"}
      - {id: es-b2-06-c4, type: cloze, text: "Es una científica ___ investigación ha cambiado la medicina.", answer: "cuya",
         l1: "She's a scientist whose research has changed medicine.", note: "cuya agrees with investigación (feminine singular)"}
      - {id: es-b2-06-c5, type: cloze, text: "Es un invento ___ resultados todavía no conocemos.", answer: "cuyos",
         l1: "It's an invention whose results we don't know yet.", note: "cuyos agrees with resultados (masculine plural)"}
      - {id: es-b2-06-c6, type: cloze, text: "El sistema falló, lo ___ provocó muchos problemas.", answer: "cual", alt: ["que"],
         l1: "The system failed, which caused a lot of problems.", note: "lo cual / lo que refers back to the whole sentence"}
      - {id: es-b2-06-c7, type: cloze, text: "Son las razones por las ___ dejé la empresa.", answer: "cuales", alt: ["que"],
         l1: "Those are the reasons why I left the company.", note: "preposition + las cuales (formal) or las que"}
      - {id: es-b2-06-c8, type: cloze, text: "___ quiera participar, que se apunte aquí.", answer: "Quien",
         l1: "Whoever wants to take part should sign up here.", note: "quien + subjunctive = whoever"}
      - {id: es-b2-06-c9, type: cloze, text: "Puedes elegir lo que ___.", answer: "quieras", alt: ["prefieras"],
         l1: "You can choose whatever you want. (informal)", note: "lo que + subjunctive = whatever"}
      - {id: es-b2-06-c10, type: cloze, text: "No existe ninguna máquina que ___ hacer eso.", answer: "pueda",
         l1: "There is no machine that can do that.", note: "a denied thing → subjunctive"}
      - {id: es-b2-06-c11, type: cloze, text: "Los investigadores, ___ trabajan día y noche, esperan resultados pronto.", answer: "quienes",
         alt: ["que"],
         l1: "The researchers, who work day and night, hope for results soon.", note: "between commas, people can take quienes (or que)"}
      - {id: es-b2-06-c12, type: cloze, text: "El que ___ primero, que encienda el ordenador.", answer: "llegue",
         l1: "Whoever arrives first should switch on the computer.", note: "el que + subjunctive = whoever (not known yet)"}
      - {id: es-b2-06-c13, type: cloze, text: "Busco un portátil que no ___ demasiado.", answer: "pese",
         l1: "I'm looking for a laptop that doesn't weigh too much.", note: "something I'm still looking for → subjunctive"}
      - {id: es-b2-06-c14, type: cloze, text: "La investigadora con la ___ trabajo es argentina.", answer: "que", alt: ["cual"],
         l1: "The researcher I work with is Argentinian.", note: "the preposition goes first: con la que / con la cual (or con quien)"}
      - {id: es-b2-06-c15, type: cloze, text: "Querían un candidato que ___ experiencia en inteligencia artificial.", answer: "tuviera", alt: ["tuviese"],
         l1: "They wanted a candidate who had experience in artificial intelligence.", note: "past + a person who may not exist → imperfect subjunctive"}
      - {id: es-b2-06-c16, type: cloze, text: "___ que más me preocupa es la privacidad.", answer: "Lo",
         l1: "What worries me most is privacy.", note: "lo que = what (the thing that)"}
      - {id: es-b2-06-c17, type: cloze, text: "Todavía hay gente que no ___ usar internet.", answer: "sabe",
         l1: "There are still people who don't know how to use the internet.", note: "these people exist → indicative"}

  # ---------------------------------------------------------------- 7
  - id: es-b2-07
    title: "The minister denied that…: reported speech in depth — the media"
    goal: "I can report statements, questions and requests accurately, and talk about newspapers, television, advertising and fake news."
    notes: |
      With a past reporting verb, every tense moves one step back.

      | Direct speech | Reported (dijo que…) |
      | present: *trabajo* | imperfect: *trabajaba* |
      | indefinido / perfecto: *vi, he visto* | pluperfect: *había visto* |
      | future: *publicaremos* | conditional: *publicarían* |
      | imperative / present subj.: *apaga* | imperfect subj.: *que apagara* |
      | imperfect, conditional, pluperfect | no change |

      - Time and place words shift: *hoy → aquel día*, *ayer → el día anterior*, *mañana → al día siguiente*, *aquí → allí*, *este → ese / aquel*.
      - Use a precise reporting verb: **afirmar**, **asegurar** (to claim), **reconocer** (to admit), **añadir** (to add) + indicative; **negar que** (to deny) + subjunctive; **pedir**, **sugerir**, **aconsejar**, **advertir que** (to warn to) + subjunctive.
      - With a present reporting verb nothing shifts: *dice que va a llover*.
      - In everyday speech the indefinido often stays: *Dijo que lo vio* is heard as well as *Dijo que lo había visto*.
    items:
      - {id: es-b2-07-titular, type: vocab, l2: "el titular", l1: "the headline",
         ex: "El titular no tiene nada que ver con la noticia.", ex_l1: "The headline has nothing to do with the story.",
         note: "Also the holder of an account or passport."}
      - {id: es-b2-07-prensa, type: vocab, l2: "la prensa", l1: "the press (newspapers, journalists)",
         ex: "Lo he leído en la prensa.", ex_l1: "I read it in the press.",
         note: "la prensa rosa = celebrity gossip magazines."}
      - {id: es-b2-07-medios, type: vocab, l2: "los medios de comunicación", l1: "the media",
         alt: ["los medios"],
         ex: "Los medios de comunicación tienen mucho poder.", ex_l1: "The media have a lot of power.",
         note: "Often shortened to los medios. Always plural."}
      - {id: es-b2-07-cadena, type: vocab, l2: "la cadena", l1: "the (TV) channel / the network / the chain", alt: ["el canal"],
         ex: "¿En qué cadena ponen el partido?", ex_l1: "Which channel is the match on?",
         note: "poner (on TV) = to show: ¿qué ponen esta noche? Also a chain (of shops, a necklace)."}
      - {id: es-b2-07-anuncio, type: vocab, l2: "el anuncio", l1: "the advert / the commercial / the announcement",
         ex: "Hay demasiados anuncios en esta película.", ex_l1: "There are too many adverts during this film.",
         note: "anunciar = to advertise / to announce."}
      - {id: es-b2-07-publicidad, type: vocab, l2: "la publicidad", l1: "advertising",
         ex: "La publicidad dirigida a niños debería estar prohibida.", ex_l1: "Advertising aimed at children should be banned.",
         note: "Uncountable. Publicity in the PR sense is also la publicidad."}
      - {id: es-b2-07-reportaje, type: vocab, l2: "el reportaje", l1: "the (news) report / the feature / the documentary piece",
         ex: "Vimos un reportaje sobre la sequía.", ex_l1: "We watched a report on the drought.",
         note: "Masculine (-aje). A written report at work is un informe."}
      - {id: es-b2-07-presentador, type: vocab, l2: "el presentador", l1: "the presenter / the TV host (male)",
         ex: "El presentador del telediario es muy serio.", ex_l1: "The newsreader is very serious.",
         note: "Feminine: la presentadora. el telediario = the TV news (Spain)."}
      - {id: es-b2-07-bulo, type: vocab, l2: "el bulo", l1: "the hoax / the piece of fake news", alt: ["la noticia falsa", "el fake"],
         ex: "Ese mensaje es un bulo: no lo compartas.", ex_l1: "That message is a hoax: don't share it.",
         note: "Spain. Elsewhere people say noticias falsas or fake news (pronounced feik)."}
      - {id: es-b2-07-fuente, type: vocab, l2: "la fuente", l1: "the source (of information) / the fountain",
         ex: "Siempre hay que comprobar la fuente.", ex_l1: "You always have to check the source.",
         note: "según fuentes oficiales = according to official sources."}
      - {id: es-b2-07-espectador, type: vocab, l2: "el espectador", l1: "the viewer / the spectator (male)",
         ex: "El programa tuvo tres millones de espectadores.", ex_l1: "The programme had three million viewers.",
         note: "Feminine: la espectadora. Radio listeners are los oyentes."}
      - {id: es-b2-07-difundir, type: vocab, l2: "difundir", l1: "to spread / to circulate (news, information)",
         ex: "Las redes sociales difunden los bulos muy rápido.", ex_l1: "Social media spread hoaxes very quickly.",
         note: "la difusión = circulation, spreading."}
      - {id: es-b2-07-rueda-prensa, type: vocab, l2: "la rueda de prensa", l1: "the press conference", alt: ["la conferencia de prensa"],
         ex: "El entrenador dio una rueda de prensa después del partido.", ex_l1: "The coach gave a press conference after the match.",
         note: "Spain: rueda de prensa; Latin America usually conferencia de prensa."}
      - {id: es-b2-07-libertad-expresion, type: vocab, l2: "la libertad de expresión", l1: "freedom of speech / freedom of expression",
         ex: "La libertad de expresión tiene límites.", ex_l1: "Freedom of speech has limits."}
      - {id: es-b2-07-afirmar, type: vocab, l2: "afirmar", l1: "to state / to claim (firmly)",
         ex: "El ministro afirmó que no había ningún problema.", ex_l1: "The minister stated that there was no problem."}
      - {id: es-b2-07-negar, type: vocab, l2: "negar", l1: "to deny",
         ex: "Siempre ha negado las acusaciones.", ex_l1: "He has always denied the accusations.",
         note: "e → ie: niego, niegas. negar que + subjunctive: negó que fuera verdad."}
      - {id: es-b2-07-reconocer, type: vocab, l2: "reconocer", l1: "to admit / to acknowledge / to recognise",
         ex: "Reconozco que me equivoqué.", ex_l1: "I admit that I was wrong.",
         note: "Like conocer: reconozco. + indicative."}
      - {id: es-b2-07-advertir, type: vocab, l2: "advertir", l1: "to warn",
         ex: "Ya te lo advertí.", ex_l1: "I did warn you.",
         note: "False friend: to advertise is anunciar. advertir de algo = to warn about; advertir que + subjunctive = to warn (someone) to."}
      - {id: es-b2-07-sugerir, type: vocab, l2: "sugerir", l1: "to suggest",
         ex: "Te sugiero que leas otro periódico.", ex_l1: "I suggest you read another newspaper.",
         note: "e → ie / i: sugiero, sugirió. sugerir que + subjunctive."}
      - {id: es-b2-07-tomar-pelo, type: vocab, l2: "tomar el pelo", l1: "to pull someone's leg / to wind someone up (idiom)",
         ex: "¿Me estás tomando el pelo?", ex_l1: "Are you pulling my leg?",
         note: "The person goes in as an indirect object: me tomas el pelo."}
      - {id: es-b2-07-ir-grano, type: vocab, l2: "ir al grano", l1: "to get (straight) to the point",
         ex: "No tengo mucho tiempo, así que voy al grano.", ex_l1: "I don't have much time, so I'll get to the point.",
         note: "Literally 'to go to the grain'."}
      - {id: es-b2-07-ramas, type: vocab, l2: "irse por las ramas", l1: "to beat about the bush / to go off on a tangent", alt: ["andarse por las ramas"],
         ex: "No te vayas por las ramas y contesta a la pregunta.", ex_l1: "Don't beat about the bush and answer the question."}
      - {id: es-b2-07-correr-voz, type: vocab, l2: "correr la voz", l1: "to spread the word / for word to get around",
         ex: "Corre la voz de que el alcalde va a dimitir.", ex_l1: "Word is going around that the mayor is going to resign."}
      - {id: es-b2-07-pajarito, type: phrase, l2: "Me lo ha dicho un pajarito.", l1: "A little bird told me.",
         alt: ["Me lo dijo un pajarito"]}
      - {id: es-b2-07-nego-recibido, type: phrase, l2: "El ministro negó que hubiera recibido dinero.", l1: "The minister denied that he had received money.",
         alt: ["El ministro negó que hubiese recibido dinero", "El ministro negó haber recibido dinero"],
         note: "negar que + subjunctive; an earlier past → pluperfect subjunctive. Same subject: negó haber recibido."}
      - {id: es-b2-07-dijo-llamara, type: phrase, l2: "Me dijo que la llamara al día siguiente.", l1: "She told me to call her the next day.",
         alt: ["Me dijo que la llamase al día siguiente"], note: "«Llámame mañana.» → an order becomes que + imperfect subjunctive."}
      - {id: es-b2-07-segun-fuentes, type: phrase, l2: "Según fuentes oficiales, no hay heridos.", l1: "According to official sources, nobody has been injured.",
         alt: ["Según fuentes oficiales, no ha habido heridos"], note: "los heridos = the injured (from herir, to wound)."}
      - {id: es-b2-07-c1, type: cloze, text: "«Trabajo en la radio.» → Dijo que ___ en la radio.", answer: "trabajaba",
         l1: "“I work in radio.” → He said he worked in radio.", note: "present → imperfect"}
      - {id: es-b2-07-c2, type: cloze, text: "«Vi el reportaje.» → Me contó que había ___ el reportaje.", answer: "visto",
         l1: "“I saw the report.” → She told me she had seen the report.", note: "indefinido → pluperfect (había + participle)"}
      - {id: es-b2-07-c3, type: cloze, text: "«Publicaremos la entrevista.» → Anunciaron que ___ la entrevista.", answer: "publicarían",
         l1: "“We will publish the interview.” → They announced they would publish the interview.", note: "future → conditional"}
      - {id: es-b2-07-c4, type: cloze, text: "«Apaga la tele.» → Mi madre me dijo que ___ la tele.", answer: "apagara", alt: ["apagase"],
         l1: "“Turn off the TV.” → My mother told me to turn off the TV.", note: "imperative → que + imperfect subjunctive"}
      - {id: es-b2-07-c5, type: cloze, text: "«¿Has leído el periódico?» → Me preguntó si ___ leído el periódico.", answer: "había",
         l1: "“Have you read the paper?” → He asked me if I had read the paper.", note: "perfecto → pluperfect; a yes/no question → si"}
      - {id: es-b2-07-c6, type: cloze, text: "«No es verdad.» → El portavoz negó que ___ verdad.", answer: "fuera", alt: ["fuese"],
         l1: "“It isn't true.” → The spokesman denied that it was true.", note: "negar que + subjunctive; past → imperfect subjunctive"}
      - {id: es-b2-07-c7, type: cloze, text: "«Estoy aquí desde ayer.» → Dijo que estaba allí desde el día ___.", answer: "anterior",
         l1: "“I've been here since yesterday.” → He said he had been there since the day before.", note: "ayer → el día anterior; aquí → allí"}
      - {id: es-b2-07-c8, type: cloze, text: "«Hoy hay rueda de prensa.» → Dijeron que ___ día había rueda de prensa.", answer: "aquel", alt: ["ese"],
         l1: "“There's a press conference today.” → They said there was a press conference that day.", note: "hoy → aquel día"}
      - {id: es-b2-07-c9, type: cloze, text: "«¿A qué hora sales?» → Me preguntó a qué hora ___.", answer: "salía",
         l1: "“What time are you leaving?” → She asked me what time I was leaving.", note: "a reported question: present → imperfect; qué keeps its accent"}
      - {id: es-b2-07-c10, type: cloze, text: "«¿Qué necesitas?» → Me preguntó qué ___.", answer: "necesitaba",
         l1: "“What do you need?” → He asked me what I needed.", note: "a reported question: present → imperfect"}
      - {id: es-b2-07-c11, type: cloze, text: "El presentador dice que mañana ___ a llover.", answer: "va",
         l1: "The presenter says it's going to rain tomorrow.", note: "present reporting verb → no shift"}
      - {id: es-b2-07-c12, type: cloze, text: "Le sugerí que ___ otra fuente.", answer: "buscara", alt: ["buscase"],
         l1: "I suggested he look for another source.", note: "sugerir que + subjunctive; past → imperfect subjunctive"}
      - {id: es-b2-07-c13, type: cloze, text: "Nos advirtieron que no ___ ese bulo.", answer: "difundiéramos", alt: ["difundiésemos", "compartiéramos", "compartiésemos"],
         l1: "They warned us not to spread that hoax.", note: "advertir que (a warning to do / not do) + subjunctive"}
      - {id: es-b2-07-c14, type: cloze, text: "El periódico reconoció que había ___ un error.", answer: "cometido",
         l1: "The newspaper admitted it had made a mistake.", note: "cometer un error = to make a mistake (not hacer)"}
      - {id: es-b2-07-c15, type: cloze, text: "«Llegaré tarde.» → Dijo que ___ tarde.", answer: "llegaría",
         l1: "“I'll be late.” → She said she would be late.", note: "future → conditional"}
      - {id: es-b2-07-c16, type: cloze, text: "«No sé nada del asunto.» → Afirmó que no ___ nada del asunto.", answer: "sabía",
         l1: "“I know nothing about the matter.” → He stated that he knew nothing about the matter.", note: "afirmar + indicative; present → imperfect"}
