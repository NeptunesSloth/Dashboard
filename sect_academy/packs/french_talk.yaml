  # ───────────────────────────────────────────────────────────────── 4
  - id: frt-04
    title: "Out and about"
    goal: "I can ask for and check directions, buy tickets and use transport, check in at a hotel, deal with a problem in a restaurant, and explain a simple health problem."
    notes: |
      When you are out in a French town you mostly talk to strangers who are working or in a hurry. The strategy is the same everywhere: get their attention politely, say what you need in one short sentence, and **check what you heard**.

      ## Moves to practise
      - **Getting attention**: *Excusez-moi…* / *Pardon…* then the request: *Je cherche la gare.*
      - **Checking by repeating**: say the key words back with a rising voice — *Tout droit, puis à gauche au feu ?* The other person confirms with *C'est ça*.
      - **Admitting a gap**: *Je ne connais pas ce mot*, *Pardon, combien de fois par jour ?*
      - **Asking for an alternative**: *Il n'y a pas de train plus tôt ?*
      - **Complaining gently**: state the fact, not the blame — *Je n'ai pas commandé ça.* Then accept the apology: *Ce n'est pas grave.*

      ## At the doctor's or pharmacy
      *J'ai mal à…* (la tête, la gorge, au ventre), *depuis hier* (since yesterday), *il y a deux jours* (two days ago). Expect *Depuis quand ?* and *Vous avez de la fièvre ?*
