  # ───────────────────────────────────────────────────────────────── 7
  - id: frt-07
    title: "Opinions and feelings"
    goal: "I can give my opinion and my reasons, agree or disagree politely, buy time while I think, compare two things, recommend a film and say how I feel."
    notes: |
      French conversation loves a friendly argument. Disagreeing is not rude, as long as you wrap it properly.

      ## Giving an opinion
      *À mon avis…*, *Je trouve que…*, *Pour moi…*, *Franchement…* / *Honnêtement…* Add a reason with *parce que*, a consequence with *c'est pour ça que*, and highlight with **Ce qui me plaît le plus, c'est…**

      ## Agreeing — and not
      - Yes: *Je suis d'accord avec toi*, *Tu as raison*, *C'est vrai*, *Ça ne m'étonne pas.*
      - Soft no: **concede first, then turn**. *Oui, c'est vrai, mais…*, *Peut-être, mais…*, *Je ne suis pas tout à fait d'accord*, *Ça dépend.*
      - Meeting halfway: *Là, on est d'accord !*

      ## Buying time
      Fill the silence: *Euh…*, *Laisse-moi réfléchir*, *Comment dire…*, *Je ne sais pas trop, en fait*, *D'un autre côté…*

      ## Comparing and recommending
      *plus… que*, *aussi… que*, *mieux*; *Je te le conseille vraiment*, *Ça vaut le coup*.

      ## Feelings
      *Je suis stressé(e)*, *J'ai peur de…*, *Ça m'empêche de dormir*, and the kind reply: *Ça fait du bien d'en parler.*
    items:
