  # ───────────────────────────────────────────────────────────────── 3
  - id: frt-03
    title: "Small talk"
    goal: "I can chat about family, work, where I live, the weather, weekend plans and what I like, and keep the exchange going by asking back and reacting."
    notes: |
      Small talk is not about information; it is about showing interest. French speakers do it with three tools, and you need all of them.

      ## Three tools
      - **Ask back.** *Et toi ?* / *Et vous ?* after your answer, or return the whole question: *Et toi, tu as des enfants ?*
      - **React before you answer.** *Ah bon ?* (really?), *Sympa !*, *C'est bien !*, *Tant mieux !* (good!), *Dommage* (pity), *Tu as de la chance !* A reaction plus a short answer sounds far more fluent than a long, silent sentence.
      - **Soften.** *Pas trop* (not really), *un peu* (a bit), *je pense* (I think), *Pourquoi pas !* (why not!). Blunt *non* is rare in friendly talk.

      ## Spoken French
      In conversation people say **on** for "we" (*On va au restaurant*), and ask questions with plain intonation: *Tu fais quoi ce week-end ?*

      ## Safe topics
      The weather (*Il fait froid, non ?*), the weekend (*Bon week-end !* on Friday, *C'était bien, ton week-end ?* on Monday), food and where you live.
