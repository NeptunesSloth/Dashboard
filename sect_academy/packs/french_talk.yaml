  # ───────────────────────────────────────────────────────────────── 5
  - id: frt-05
    title: "Making plans"
    goal: "I can invite someone, accept or decline politely, fix or change a time and place, make a simple phone call and say that I am running late."
    notes: |
      Making plans in French is a dance of small formulas.

      ## Inviting
      Test the ground first — *Tu es libre vendredi soir ?* — then propose with **Ça te dit de… ?** (do you fancy…?). Then *Vers sept heures, ça te va ?* and *Ça marche !*

      ## Accepting and declining
      - Yes: *Avec plaisir !*, *Ça me dit bien !*, *Je veux bien.* Then offer something: *Je peux apporter quelque chose ?*
      - No: never a bare *non*. Thank, refuse, give a reason, offer another day: *C'est gentil, mais je ne peux pas. Je dois travailler. Je suis libre dimanche.*

      ## Changing plans
      *J'ai un empêchement* ("something has come up") is the standard, slightly vague excuse. Then *On peut se voir vendredi ?*

      ## On the phone
      *Allô ?* only on the phone. *Est-ce que Julien est là ?*, *C'est de la part de qui ?* (who's calling?), *Il peut me rappeler ?*

      ## Late
      *Désolé(e), je suis en retard. J'arrive dans dix minutes.*
