  # ───────────────────────────────────────────────────────────────── 6
  - id: frt-06
    title: "Telling what happened"
    goal: "I can tell someone about my weekend, a trip, a mishap or a childhood memory, and react naturally to good and bad news."
    notes: |
      Telling a story is a duet in French. The listener keeps prompting — *Ah bon ?*, *Raconte !*, *Et alors ?* — and the teller feeds short pieces. Practise both roles.

      ## Telling
      - **Announce it**: *Tu ne vas pas me croire…*, *Il m'est arrivé un truc bête.*
      - **What happened**: passé composé — *J'ai perdu mon téléphone. Je suis allé(e) à la mer.*
      - **What it was like / used to be**: imparfait — *C'était génial. L'eau était froide. On jouait toujours dehors.*
      - **Evaluate**: a story without a verdict feels unfinished — *C'était sympa*, *heureusement*, *trop tard !*
      - **Si** contradicts a negative question: *Il n'y avait pas trop de monde ? — Si !*

      ## Reacting
      - Good news: *C'est pas vrai ! Félicitations ! Je suis content(e) pour toi.*
      - Bad news: *Oh non ! Je suis désolé(e) pour toi. Ça arrive à tout le monde. Ça va aller.*
      - Then **ask a follow-up**: *Tu commences quand ?*, *Et toi, tu as fait quoi ?*

    items:
