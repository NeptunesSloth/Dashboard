  # ───────────────────────────────────────────────────────────────── 8
  - id: frt-08
    title: "Handling real life"
    goal: "I can clear up a misunderstanding, make a complaint, ask the right questions when renting a flat, talk about myself in a job conversation, explain a practical problem and take my leave warmly after an evening."
    notes: |
      Real life means conversations where something is at stake: money, a flat, a job, a neighbour's goodwill. The skill is staying polite **and** firm.

      ## Firm but polite
      - State facts, not accusations: *Il ne marche plus*, *J'avais compris seize heures*, *Il doit y avoir un malentendu.*
      - Acknowledge, then hold your line: **Je comprends, mais…** *je préfère un remboursement.*
      - Ask with the conditional: *Vous pourriez baisser un peu ?*, *Je voudrais être remboursé(e).*
      - Apologise before bothering someone: *Excusez-moi de vous déranger.*
      - Let people save face: *Ce n'est pas grave, ça arrive.*

      ## Practical words
      *le loyer* (rent), *les charges comprises* (bills included), *le dossier* (the application file every landlord wants), *une fuite* (a leak), *le ticket de caisse* (receipt), *un remboursement* (refund).

      ## Leaving well
      French goodbyes take time. Announce it — *Bon, il se fait tard, je vais y aller* — compliment — *J'ai passé une excellente soirée* — thank — *Merci pour tout* — and promise a next time.

