          - {who: B, l2: "Elle a quel âge, ta sœur ?", l1: "How old is your sister? (informal)",
             alt: ["Ta sœur a quel âge ?", "Quel âge a ta sœur ?", "Quel âge elle a, ta sœur ?", "Elle a quel âge ?", "Ta sœur, elle a quel âge ?"]}
          - {who: A, l2: "Elle a dix-neuf ans. Et toi, tu as des frères et sœurs ?", l1: "She's nineteen. And you, do you have brothers and sisters?"}
          - {who: B, l2: "Oui, j'ai un frère.", l1: "Yes, I have a brother.",
