id: french-talk
title: "French — Conversations"
kind: language
language: French
lang: fr-FR
track: french
addon: talk
hall: tongues_west
blurb: "Spoken-conversation practice to take alongside the A1-B1 courses: 56 everyday exchanges you rehearse line by line, from a first hello to handling real life."

units:
  # ───────────────────────────────────────────────────────────────── 1
  - id: frt-01
    title: "First contact"
    goal: "I can greet someone, introduce myself, ask the same question back, say I am learning French and ask people to repeat or slow down."
    notes: |
      A first conversation in French follows a small, predictable script. Learn the moves and you can survive almost any first meeting.

      ## The moves
      - **Open**: *Bonjour !* with strangers, *Salut !* with people your age at a party. Then *Moi, c'est Alex* — what people really say, more than *Je m'appelle*.
      - **Ask back**: *Et vous ?* / *Et toi ?* Two words that keep the conversation alive. Use them after every answer.
      - **React**: *Ah bon ?* (really?), *D'accord* (OK), *Enchanté(e)* (nice to meet you).
      - **Repair**: nobody minds if you say *Pardon, je ne comprends pas*, *Vous pouvez répéter ?* or *Plus lentement, s'il vous plaît*. Saying *J'apprends le français* makes people slow down and smile.
      - **Ask about words**: *Comment on dit … en français ?* and *Ça veut dire quoi ?*

      ## Tu or vous
      Neighbours, strangers on a train, receptionists: **vous**. A party, a class, a language exchange: **tu**. Stay with the one you started with.

      Say every line aloud, at normal speed, before you check it.
    items:
      - id: frt-01-neighbour
        type: dialogue
        title: "Meeting a neighbour"
        scene: "You have just moved in. A woman you have never met greets you on the stairs of your building."
        you: B
        lines:
          - {who: A, l2: "Bonjour ! Vous habitez ici ?", l1: "Hello! Do you live here?"}
          - {who: B, l2: "Bonjour ! Oui, j'habite ici.", l1: "Hello! Yes, I live here.",
             alt: ["Bonjour ! Oui, je vis ici."]}
          - {who: A, l2: "Ah, enchantée ! Moi, c'est Claire, votre voisine.", l1: "Ah, nice to meet you! I'm Claire, your neighbour."}
          - {who: B, l2: "Enchanté. Je m'appelle Alex.", l1: "Nice to meet you. My name is Alex.",
             alt: ["Enchantée. Je m'appelle Alex.", "Enchanté. Moi, c'est Alex.", "Enchantée. Moi, c'est Alex.", "Enchanté. Je suis Alex.", "Enchantée. Je suis Alex."]}
          - {who: A, l2: "Vous venez d'où, Alex ?", l1: "Where are you from, Alex?"}
          - {who: B, l2: "Je viens d'Angleterre. Et vous ?", l1: "I come from England. And you? (formal)",
             alt: ["Je suis d'Angleterre. Et vous ?", "Moi, je viens d'Angleterre. Et vous ?"]}
          - {who: A, l2: "Moi, je suis de Lyon. Bienvenue dans l'immeuble !", l1: "I'm from Lyon. Welcome to the building!"}
          - {who: B, l2: "Merci beaucoup. Bonne journée !", l1: "Thank you very much. Have a good day!",
             alt: ["Merci beaucoup. Bonne journée à vous !", "Merci bien. Bonne journée !"]}

      - id: frt-01-party
        type: dialogue
        title: "Hello at a party"
        scene: "You are at your colleague Paul's party. You walk up to someone your own age who is standing alone."
        you: A
        lines:
          - {who: A, l2: "Salut ! Moi, c'est Alex. Et toi ?", l1: "Hi! I'm Alex. And you? (informal)",
             alt: ["Salut ! Je m'appelle Alex. Et toi ?", "Salut ! Je suis Alex. Et toi ?", "Bonjour ! Moi, c'est Alex. Et toi ?"]}
          - {who: B, l2: "Salut Alex ! Moi, c'est Inès. Tu connais Paul comment ?", l1: "Hi Alex! I'm Inès. How do you know Paul?"}
          - {who: A, l2: "On travaille ensemble.", l1: "We work together.",
             alt: ["Nous travaillons ensemble.", "On bosse ensemble."]}
          - {who: B, l2: "Ah, d'accord ! Et tu es d'où ? Tu as un petit accent.", l1: "Ah, OK! And where are you from? You have a slight accent."}
          - {who: A, l2: "Je viens du Canada.", l1: "I come from Canada.",
             alt: ["Je suis du Canada.", "Moi, je viens du Canada."]}
          - {who: B, l2: "Du Canada ? Génial ! Moi, je suis de Marseille.", l1: "From Canada? Great! I'm from Marseille."}
          - {who: A, l2: "Ah bon ? J'adore Marseille !", l1: "Really? I love Marseille!",
             alt: ["Ah oui ? J'adore Marseille !", "C'est vrai ? J'adore Marseille !"]}
          - {who: B, l2: "C'est gentil ! Bon, tu veux boire quelque chose ?", l1: "That's kind! Right, do you want something to drink?"}
          - {who: A, l2: "Oui, je veux bien, merci.", l1: "Yes, I'd like that, thanks.",
             alt: ["Je veux bien, merci.", "Oui, avec plaisir, merci.", "Oui, volontiers, merci."]}

      - id: frt-01-train
        type: dialogue
        title: "A stranger on the train"
        scene: "You are sitting on a train to Bordeaux. A man sits down next to you and starts chatting, a little too fast."
        you: B
        lines:
          - {who: A, l2: "Excusez-moi, cette place est libre ?", l1: "Excuse me, is this seat free?"}
          - {who: B, l2: "Oui, bien sûr.", l1: "Yes, of course.",
             alt: ["Oui, bien sûr, allez-y.", "Oui, je vous en prie.", "Bien sûr."]}
          - {who: A, l2: "Merci. Dites, vous savez si on arrive bientôt à Bordeaux ?", l1: "Thanks. Say, do you know if we're arriving in Bordeaux soon?"}
          - {who: B, l2: "Pardon, je ne comprends pas.", l1: "Sorry, I don't understand.",
             alt: ["Pardon, je comprends pas.", "Pardon, je n'ai pas compris.", "Désolé, je ne comprends pas.", "Désolée, je ne comprends pas.", "Désolé, je n'ai pas compris.", "Désolée, je n'ai pas compris.", "Excusez-moi, je ne comprends pas."]}
          - {who: A, l2: "Oh, pardon. Bordeaux… c'est bientôt ?", l1: "Oh, sorry. Bordeaux… is it soon?"}
          - {who: B, l2: "Ah ! Oui, dans dix minutes.", l1: "Ah! Yes, in ten minutes.",
             alt: ["Ah ! Oui, dans 10 minutes.", "Ah, oui ! Dans dix minutes."]}
          - {who: A, l2: "Merci. Vous n'êtes pas d'ici, je crois ?", l1: "Thanks. You're not from here, I think?"}
          - {who: B, l2: "Non, j'apprends le français.", l1: "No, I'm learning French.",
             alt: ["Non. J'apprends le français.", "Non, je suis en train d'apprendre le français."]}
          - {who: A, l2: "Eh bien, vous parlez déjà très bien !", l1: "Well, you already speak very well!"}
          - {who: B, l2: "Merci, c'est gentil !", l1: "Thank you, that's kind!",
             alt: ["Merci, c'est très gentil !", "Merci, vous êtes gentil !", "Merci, c'est sympa !", "Merci beaucoup, c'est gentil !"]}

      - id: frt-01-slow-down
        type: dialogue
        title: "Too fast for me"
        scene: "You are at a language-exchange evening. A friendly French student comes over and speaks very quickly."
        you: A
        lines:
          - {who: B, l2: "Salut ! Alors, tu es là pour l'échange de conversation, c'est ça ?", l1: "Hi! So, you're here for the conversation exchange, is that right?"}
          - {who: A, l2: "Tu peux répéter, s'il te plaît ?", l1: "Can you repeat that, please? (informal)",
             alt: ["Tu peux répéter ?", "Peux-tu répéter, s'il te plaît ?", "Est-ce que tu peux répéter, s'il te plaît ?", "Pardon, tu peux répéter ?", "Pardon, tu peux répéter, s'il te plaît ?", "Tu pourrais répéter, s'il te plaît ?"]}
          - {who: B, l2: "Oui, pardon ! Tu es là pour parler français ?", l1: "Yes, sorry! Are you here to speak French?"}
          - {who: A, l2: "Oui ! Mais je suis débutant.", l1: "Yes! But I'm a beginner.",
             alt: ["Oui ! Mais je suis débutante.", "Oui ! Mais je débute."]}
          - {who: B, l2: "Pas de souci, on va parler tranquillement. Tu apprends le français depuis longtemps ?", l1: "No worries, we'll take it easy. Have you been learning French for long?"}
          - {who: A, l2: "Plus lentement, s'il te plaît.", l1: "More slowly, please. (informal)",
             alt: ["Plus doucement, s'il te plaît.", "Moins vite, s'il te plaît.", "Tu peux parler plus lentement, s'il te plaît ?", "Tu peux parler moins vite, s'il te plaît ?", "Un peu plus lentement, s'il te plaît."]}
          - {who: B, l2: "Bien sûr. Tu apprends… le français… depuis quand ?", l1: "Of course. You've been learning… French… since when?"}
          - {who: A, l2: "Depuis trois mois.", l1: "For three months.",
             alt: ["Depuis 3 mois.", "Ça fait trois mois.", "J'apprends le français depuis trois mois."]}
          - {who: B, l2: "Trois mois seulement ? Bravo, tu te débrouilles bien !", l1: "Only three months? Well done, you're managing well!"}

      - id: frt-01-how-are-you
        type: dialogue
        title: "Bumping into a classmate"
        scene: "On the way to your French class you run into Léa, a student you know from the same school."
        you: B
        lines:
          - {who: A, l2: "Tiens, salut ! Ça va ?", l1: "Oh, hi! How are you?"}
          - {who: B, l2: "Salut ! Ça va bien, et toi ?", l1: "Hi! I'm fine, and you? (informal)",
             alt: ["Salut ! Ça va, et toi ?", "Salut ! Ça va très bien, et toi ?", "Salut ! Je vais bien, et toi ?", "Salut ! Très bien, et toi ?", "Salut ! Bien, et toi ?", "Salut ! Oui, ça va bien, et toi ?", "Salut ! Oui, ça va, et toi ?"]}
          - {who: A, l2: "Ça va, un peu fatiguée aujourd'hui. Tu vas au cours de français ?", l1: "OK, a bit tired today. Are you going to the French class?"}
          - {who: B, l2: "Oui, j'ai cours à dix heures.", l1: "Yes, I have class at ten o'clock.",
             alt: ["Oui, j'ai cours à 10 heures.", "Oui, j'ai cours à 10h.", "Oui, j'ai un cours à dix heures.", "Oui, j'ai mon cours à dix heures."]}
          - {who: A, l2: "Ah, moi aussi ! On y va ensemble ?", l1: "Oh, me too! Shall we go together?"}
          - {who: B, l2: "D'accord, bonne idée !", l1: "OK, good idea!",
             alt: ["OK, bonne idée !", "Oui, bonne idée !", "D'accord, c'est une bonne idée !"]}
          - {who: A, l2: "Super. Et après, un café ?", l1: "Great. And afterwards, a coffee?"}
          - {who: B, l2: "Oui, avec plaisir !", l1: "Yes, with pleasure!",
             alt: ["Oui, volontiers !", "Oui, avec grand plaisir !", "Avec plaisir !", "Oui, je veux bien !"]}

      - id: frt-01-spell
        type: dialogue
        title: "Giving your name"
        scene: "It is your first day at a language school. You go to the reception desk to sign in."
        you: B
        lines:
          - {who: A, l2: "Bonjour ! Je peux vous aider ?", l1: "Hello! Can I help you?"}
          - {who: B, l2: "Bonjour. Je suis ici pour le cours de français.", l1: "Hello. I'm here for the French class.",
             alt: ["Bonjour. Je suis là pour le cours de français.", "Bonjour. Je viens pour le cours de français."]}
          - {who: A, l2: "Très bien. Votre nom, s'il vous plaît ?", l1: "Very good. Your name, please?"}
          - {who: B, l2: "Je m'appelle Alex Reid.", l1: "My name is Alex Reid.",
             alt: ["Alex Reid.", "C'est Alex Reid.", "Moi, c'est Alex Reid.", "Mon nom, c'est Alex Reid.", "Je suis Alex Reid."]}
          - {who: A, l2: "Reid… Comment ça s'écrit ?", l1: "Reid… How is that spelled?"}
          - {who: B, l2: "Ça s'écrit R, E, I, D.", l1: "It's spelled R, E, I, D.",
             alt: ["R, E, I, D.", "Ça s'écrit R-E-I-D.", "C'est R, E, I, D."]}
          - {who: A, l2: "Merci. Et vous venez de quel pays ?", l1: "Thank you. And which country are you from?"}
          - {who: B, l2: "Je viens d'Irlande.", l1: "I come from Ireland.",
             alt: ["Je suis d'Irlande.", "D'Irlande.", "Moi, je viens d'Irlande."]}
          - {who: A, l2: "Parfait. Vous êtes dans le groupe débutant, salle trois.", l1: "Perfect. You're in the beginners' group, room three."}
          - {who: B, l2: "Merci beaucoup. Au revoir !", l1: "Thank you very much. Goodbye!",
             alt: ["Merci bien. Au revoir !", "Merci beaucoup, madame. Au revoir !", "Merci beaucoup, monsieur. Au revoir !"]}

      - id: frt-01-how-do-you-say
        type: dialogue
        title: "Asking about a word"
        scene: "You are having lunch with Karim, a French colleague, and you use him as your walking dictionary."
        you: A
        lines:
          - {who: A, l2: "Comment on dit « late » en français ?", l1: "How do you say 'late' in French?",
             alt: ["Comment dit-on « late » en français ?", "Comment est-ce qu'on dit « late » en français ?", "Comment tu dis « late » en français ?", "Comment ça se dit, « late », en français ?"]}
          - {who: B, l2: "On dit « en retard ». Par exemple : je suis en retard.", l1: "You say 'en retard'. For example: I am late."}
          - {who: A, l2: "Et « bosser », ça veut dire quoi ?", l1: "And 'bosser', what does that mean?",
             alt: ["Et « bosser », qu'est-ce que ça veut dire ?", "Et que veut dire « bosser » ?", "Et « bosser », ça signifie quoi ?", "Et ça veut dire quoi, « bosser » ?", "Et qu'est-ce que ça veut dire, « bosser » ?"]}
          - {who: B, l2: "C'est un mot familier pour « travailler ». Tout le monde le dit.", l1: "It's an informal word for 'to work'. Everyone says it."}
          - {who: A, l2: "D'accord, je comprends.", l1: "OK, I understand.",
             alt: ["OK, je comprends.", "Ah d'accord, je comprends.", "D'accord, j'ai compris.", "D'accord, je vois."]}
          - {who: B, l2: "Tu apprends vite ! Ce n'est pas trop difficile, le français ?", l1: "You learn fast! Isn't French too hard?"}
          - {who: A, l2: "C'est difficile, mais j'aime bien.", l1: "It's hard, but I like it.",
             alt: ["C'est difficile, mais j'aime ça.", "C'est dur, mais j'aime bien.", "C'est difficile, mais ça me plaît.", "Si, c'est difficile, mais j'aime bien.", "C'est difficile, mais j'aime bien ça."]}
          - {who: B, l2: "C'est normal. Continue comme ça !", l1: "That's normal. Keep it up!"}

  # ───────────────────────────────────────────────────────────────── 2
  - id: frt-02
    title: "Getting things done"
    goal: "I can order in a café or bakery, buy something in a shop, ask the price, pay, and ask where something is."
    notes: |
      Shops and cafés run on a fixed ritual. Miss a step and you sound abrupt; follow it and everything goes smoothly.

      ## The ritual
      1. **Bonjour** first — always, before anything else.
      2. Ask with **s'il vous plaît**: *Un café, s'il vous plaît.* A noun plus *s'il vous plaît* is perfectly polite; *Je voudrais…* and *Je vais prendre…* are the fuller versions.
      3. Expect the follow-up questions: *Et avec ceci ?* (anything else?) / *Ce sera tout ?* (will that be all?), *Sur place ou à emporter ?* (eat in or take away?). Close with *C'est tout, merci.*
      4. Money: *C'est combien ?* / *Ça fait combien ?*, then *Je peux payer par carte ?*
      5. Leave with **Merci, bonne journée !** — and answer theirs with *À vous aussi !*

      ## Survival phrases
      - *Je regarde, merci* — "just looking".
      - *Excusez-moi, où sont… ?* — repeat the answer back (*Au fond, à droite, d'accord*) to check you understood.
      - *Pardon, vous pouvez répéter ?* — prices are said fast; asking again is normal.

      Everything here is **vous**.
    items:
      - id: frt-02-cafe
        type: dialogue
        title: "Ordering at a café"
        scene: "You sit down on a café terrace in the morning. The waiter comes to your table."
        you: B
        lines:
          - {who: A, l2: "Bonjour ! Qu'est-ce que je vous sers ?", l1: "Hello! What can I get you?"}
          - {who: B, l2: "Bonjour. Un café, s'il vous plaît.", l1: "Hello. A coffee, please.",
             alt: ["Bonjour. Je voudrais un café, s'il vous plaît.", "Bonjour. Je vais prendre un café, s'il vous plaît.", "Bonjour. Je prends un café, s'il vous plaît."]}
          - {who: A, l2: "Un café. Et avec ça ?", l1: "A coffee. And with that?"}
          - {who: B, l2: "Un croissant aussi, s'il vous plaît.", l1: "A croissant too, please.",
             alt: ["Et un croissant, s'il vous plaît.", "Je voudrais aussi un croissant, s'il vous plaît.", "Et un croissant aussi, s'il vous plaît."]}
          - {who: A, l2: "Désolé, je n'ai plus de croissants. Un pain au chocolat, peut-être ?", l1: "Sorry, I have no croissants left. A pain au chocolat, perhaps?"}
          - {who: B, l2: "D'accord, un pain au chocolat.", l1: "OK, a pain au chocolat.",
             alt: ["OK, un pain au chocolat.", "Oui, un pain au chocolat.", "D'accord, un pain au chocolat, alors."]}
          - {who: A, l2: "Et voilà : un café et un pain au chocolat. Autre chose ?", l1: "There you are: a coffee and a pain au chocolat. Anything else?"}
          - {who: B, l2: "Non merci. L'addition, s'il vous plaît.", l1: "No thanks. The bill, please.",
             alt: ["Non, merci. Je peux avoir l'addition, s'il vous plaît ?", "Non merci. Je voudrais l'addition, s'il vous plaît.", "Non merci, c'est tout. L'addition, s'il vous plaît."]}
          - {who: A, l2: "Tout de suite. Ça fait quatre euros cinquante.", l1: "Right away. That's four euros fifty."}

      - id: frt-02-bakery
        type: dialogue
        title: "At the bakery"
        scene: "You are at the front of the queue in a busy bakery. The baker is waiting for your order."
        you: A
        lines:
          - {who: A, l2: "Bonjour, madame. Une baguette, s'il vous plaît.", l1: "Hello, ma'am. A baguette, please.",
             alt: ["Bonjour, madame. Je voudrais une baguette, s'il vous plaît.", "Bonjour, madame. Je vais prendre une baguette, s'il vous plaît."]}
          - {who: B, l2: "Bonjour ! Une tradition ou une baguette normale ?", l1: "Hello! A 'tradition' or an ordinary baguette?"}
          - {who: A, l2: "Une tradition. C'est combien ?", l1: "A 'tradition'. How much is it?",
             alt: ["Une tradition. Ça coûte combien ?", "Une tradition. Combien ça coûte ?", "Une tradition. C'est combien, s'il vous plaît ?", "Une tradition, s'il vous plaît. C'est combien ?", "Une tradition. Elle est à combien ?"]}
          - {who: B, l2: "Un euro trente. Et avec ceci ?", l1: "One euro thirty. And with that?"}
          - {who: A, l2: "Deux croissants, s'il vous plaît.", l1: "Two croissants, please.",
             alt: ["2 croissants, s'il vous plaît.", "Et deux croissants, s'il vous plaît.", "Je voudrais deux croissants, s'il vous plaît.", "Je vais prendre deux croissants, s'il vous plaît."]}
          - {who: B, l2: "Voilà. Ce sera tout ?", l1: "There you are. Will that be all?"}
          - {who: A, l2: "Oui, c'est tout, merci.", l1: "Yes, that's all, thank you.",
             alt: ["Oui, ce sera tout, merci.", "C'est tout, merci.", "Oui, merci, c'est tout."]}
          - {who: B, l2: "Alors, ça vous fait trois euros soixante-dix.", l1: "So, that comes to three euros seventy."}
          - {who: A, l2: "Voilà. Merci, bonne journée !", l1: "Here you are. Thanks, have a good day!",
             alt: ["Tenez. Merci, bonne journée !", "Voici. Merci, bonne journée !", "Voilà. Merci, bonne journée à vous !", "Voilà. Merci et bonne journée !"]}
          - {who: B, l2: "Merci, à vous aussi !", l1: "Thank you, you too!"}

      - id: frt-02-clothes
        type: dialogue
        title: "Just looking — then buying"
        scene: "You walk into a clothes shop. At first you only want to browse; a moment later you spot a jumper you like and call the assistant back."
        you: B
        lines:
          - {who: A, l2: "Bonjour ! Je peux vous aider ?", l1: "Hello! Can I help you?"}
          - {who: B, l2: "Non merci, je regarde.", l1: "No thanks, I'm just looking.",
             alt: ["Non merci, je regarde juste.", "Non merci, je regarde seulement.", "Non merci, je ne fais que regarder.", "Merci, je regarde.", "Non merci, je regarde, c'est tout."]}
          - {who: A, l2: "Très bien. N'hésitez pas si vous avez besoin.", l1: "Very good. Don't hesitate if you need anything."}
          - {who: B, l2: "Excusez-moi, vous avez ce pull en bleu ?", l1: "(A moment later, to the assistant) Excuse me, do you have this jumper in blue? (formal)",
             alt: ["Excusez-moi, est-ce que vous avez ce pull en bleu ?", "Excusez-moi, avez-vous ce pull en bleu ?", "Pardon, vous avez ce pull en bleu ?", "Excusez-moi, vous l'avez en bleu, ce pull ?"]}
          - {who: A, l2: "Oui, bien sûr. Vous faites quelle taille ?", l1: "Yes, of course. What size are you?"}
          - {who: B, l2: "Je fais du M.", l1: "I'm a medium (say: M).",
             alt: ["Du M.", "Je prends du M.", "Je fais du M, je pense.", "Taille M."]}
          - {who: A, l2: "Voilà. Il est très doux, vous allez voir.", l1: "Here you are. It's very soft, you'll see."}
          - {who: B, l2: "Merci. Je peux l'essayer ?", l1: "Thanks. Can I try it on?",
             alt: ["Merci. Est-ce que je peux l'essayer ?", "Merci. Je peux essayer ?", "Merci. Je pourrais l'essayer ?", "Merci. Je peux l'essayer, s'il vous plaît ?", "Merci. Puis-je l'essayer ?"]}
          - {who: A, l2: "Bien sûr ! Les cabines sont au fond, à gauche.", l1: "Of course! The fitting rooms are at the back, on the left."}

      - id: frt-02-market
        type: dialogue
        title: "Asking the price at the market"
        scene: "You are at an open-air market on Sunday morning, in front of a fruit stall. The seller talks fast."
        you: A
        lines:
          - {who: A, l2: "Bonjour ! C'est combien, les fraises ?", l1: "Hello! How much are the strawberries?",
             alt: ["Bonjour ! Les fraises, c'est combien ?", "Bonjour ! Elles sont à combien, les fraises ?", "Bonjour ! Les fraises sont à combien ?", "Bonjour ! Combien coûtent les fraises ?", "Bonjour ! Ça coûte combien, les fraises ?", "Bonjour ! Elles coûtent combien, les fraises ?"]}
          - {who: B, l2: "Bonjour ! Quatre euros la barquette, sept euros les deux.", l1: "Hello! Four euros a punnet, seven euros for two."}
          - {who: A, l2: "Pardon, vous pouvez répéter ?", l1: "Sorry, can you repeat that? (formal)",
