# CompTIA CySA+ CS0-004 - part file for domains 3 and 4.
# Coverage of the topics the base course leaves untested, plus exam-hard practice.
# Original content written against the public objectives. No real exam items.
# Syllabus: docs/research/notes/blueprint_cysa_plus.md
part_of: cysa-plus
units:
  # ───────────────────────── Domain 3: coverage ─────────────────────────
  - id: cy-3x
    title: "Incident response in depth: frameworks, roles, logs and evidence"
    domain: "3"
    goal: "I can map an observed action to the right framework element, name who does what in a response, and collect evidence in the right order."
    notes: |
      The base units taught the three frameworks and the seven phases. This unit fills in the detail the exam expects.

      **Kill Chain.** Know all seven stages by their evidence: research (reconnaissance), building (weaponization), sending (delivery), triggering (exploitation), foothold (installation), remote control (command and control), the goal (actions on objectives).

      **Diamond Model.** Besides the four core features, each event carries **meta-features**: timestamp, phase, result, direction, methodology and resources. The line joining adversary and victim is the **social-political axis** (why this target); the line joining capability and infrastructure is the **technology axis**. **Pivoting** means using one known feature to find another.

      **ATT&CK** has three levels: **tactic** (why), **technique** (how) and **procedure** (exactly how one group did it). The fourteen Enterprise tactics run from Reconnaissance and Resource Development to Exfiltration and Impact.

      **Roles.** An **incident commander** decides and assigns; a **scribe** records; others do the technical work and the communicating.

      **Logs in an incident.** Collect them centrally, where an intruder cannot edit them; **correlate** across sources; **enrich** with context; make sure **alerts** reach a person who will act.

      **Evidence.** Follow the **order of volatility**:

      | Collect | Example |
      |---|---|
      | First | CPU registers and cache |
      | Then | memory, process table, ARP cache |
      | Then | temporary files and swap |
      | Then | the disk |
      | Last | remote logs, archived backups |
    items:
      - {id: cy-3x-reconnaissance, type: concept, term: "Reconnaissance (Kill Chain)",
         def: "The opening stage of the seven-stage intrusion model, in which the attacker researches and selects the target, for example by harvesting staff names or probing exposed services."}
      - {id: cy-3x-c2-stage, type: concept, term: "Command and control (Kill Chain)",
         def: "The sixth stage of the seven-stage intrusion model, in which the compromised host opens a channel to the attacker's server so that it can be operated remotely."}
      - {id: cy-3x-technique, type: concept, term: "Technique (ATT&CK)",
         def: "The specific method an adversary uses to reach a goal, identified in the matrix by a T-number; the 'how' of an action."}
      - {id: cy-3x-procedure, type: concept, term: "Procedure (ATT&CK)",
         def: "The exact way one particular group or malware family has carried out a catalogued method in a real intrusion, down to the tools and commands used."}
      - {id: cy-3x-meta-features, type: concept, term: "Meta-features (Diamond Model)",
         def: "The supplementary attributes recorded for an intrusion event alongside its four core features: timestamp, phase, result, direction, methodology and resources."}
      - {id: cy-3x-pivoting, type: concept, term: "Analytic pivoting",
         def: "Taking one known element of an intrusion event and using other data sources to discover the elements linked to it, such as going from a malware sample to the servers it contacts."}
      - {id: cy-3x-social-political, type: concept, term: "Social-political axis (Diamond Model)",
         def: "The relationship between attacker and target in the four-feature intrusion model: the intent and motivation that explain why this target was chosen."}
      - {id: cy-3x-incident-commander, type: concept, term: "Incident commander",
         def: "The person with overall authority over a response, who sets priorities, assigns tasks and makes the decisions rather than doing the hands-on technical work."}
      - {id: cy-3x-scribe, type: concept, term: "Incident scribe",
         def: "The response-team role that keeps the running record of what was found, decided and done, by whom and at what time."}
      - {id: cy-3x-log-correlation, type: concept, term: "Log correlation",
         def: "Linking records from different sources by shared values such as time, address, account or host name, so that separate events are seen as one activity."}
      - {id: cy-3x-log-enrichment, type: concept, term: "Log enrichment",
         def: "Adding context to a record that it did not originally carry, such as the owner of an asset, the reputation of an address or the country of a login."}
      - {id: cy-3x-order-of-volatility, type: concept, term: "Order of volatility",
         def: "The principle of collecting evidence starting with the data that disappears soonest, such as processor cache and memory, and ending with the most durable, such as archived media."}
      - {id: cy-3x-timeline, type: concept, term: "Incident timeline",
         def: "A single chronological reconstruction of the intruder's actions and the responders' actions, assembled from many sources on one common clock."}
      - {id: cy-3x-preservation, type: concept, term: "Evidence preservation",
         def: "Protecting collected or potential evidence from change or loss, for example by imaging a disk through a write blocker and working only on the copy."}
      - {id: cy-3x-escalation, type: concept, term: "Incident escalation",
         def: "Passing a case to a higher tier of expertise or authority because it exceeds what the current handler is able or permitted to deal with."}
      - {id: cy-3x-release-isolation, type: concept, term: "Release from isolation",
         def: "Reconnecting a quarantined system to the production network once its fix has been confirmed to work."}
      - {id: cy-3x-q01, type: mcq,
         q: "Before any contact with the target, an attacker downloads the company's public staff directory, lists its mail servers from DNS and notes which remote-access product its job adverts mention. Which Kill Chain stage is this?",
         choices: ["Weaponization", "Delivery", "Reconnaissance", "Exploitation"],
         answer: 2,
         why: "Researching and selecting the target is reconnaissance. Weaponization comes next, when the attacker uses what was learned to build something to send; nothing has been built or sent yet."}
      - {id: cy-3x-q02, type: mcq,
         q: "A user opens an emailed PDF. A flaw in the reader lets code hidden in the file run in memory. Nothing has yet been written to disk or set to start at boot. Which Kill Chain stage has just occurred?",
         choices: ["Exploitation", "Delivery", "Installation", "Command and control"],
         answer: 0,
         why: "Exploitation is the moment the delivered code is triggered. Delivery was the email arriving; installation would be the next step, when a persistent foothold is placed on the host."}
      - {id: cy-3x-q03, type: mcq,
         q: "Proxy logs show an infected workstation making an HTTPS request to the same external domain every 300 seconds. Each reply is a few hundred bytes of encoded text, and shortly after some replies the workstation runs new commands. Which Kill Chain stage is this?",
         choices: ["Installation", "Command and control", "Actions on objectives", "Delivery"],
         answer: 1,
         why: "A regular outbound channel through which the host receives orders is command and control. Installation put the implant there; actions on objectives would be the theft or damage the commands eventually cause."}
      - {id: cy-3x-q04, type: mcq,
         q: "After two weeks inside a network, an intruder compresses the finance share into an archive and uploads it to a cloud storage account. Which Kill Chain stage is this?",
         choices: ["Command and control", "Exploitation", "Installation", "Actions on objectives"],
         answer: 3,
         why: "Stealing the data is what the intruder came for, so it is actions on objectives, the last stage. Command and control is the channel used to direct the host, not the goal itself."}
      - {id: cy-3x-q05, type: mcq,
         q: "An analyst reverse-engineers a dropper and finds a hard-coded domain. Passive DNS gives the address it resolved to, and proxy logs then show three more internal hosts contacting that address. Through which Diamond Model features did the analyst pivot?",
         choices: ["Capability, then infrastructure, then victim", "Victim, then adversary, then capability", "Infrastructure, then capability, then adversary", "Adversary, then infrastructure, then victim"],
         answer: 0,
         why: "The dropper is a capability, the domain and address are infrastructure, and the three hosts are further victims. The adversary was never identified, so no pivot went through that feature."}
      - {id: cy-3x-q06, type: mcq,
         q: "In the Diamond Model, which two features does the social-political axis connect?",
         choices: ["Capability and infrastructure", "Infrastructure and victim", "Adversary and victim", "Adversary and capability"],
         answer: 2,
         why: "The social-political axis is the relationship between adversary and victim: why this target matters to this attacker. Capability and infrastructure are joined by the technology axis."}
      - {id: cy-3x-q07, type: mcq,
         q: "A threat report states: 'The group ran rundll32.exe with comsvcs.dll MiniDump against the process ID of LSASS and wrote the dump to a temporary folder.' In ATT&CK terms, what level of description is this?",
         choices: ["A tactic", "A technique", "A mitigation", "A procedure"],
         answer: 3,
         why: "A procedure is the exact implementation a particular group used. The tactic here is Credential Access and the technique is OS Credential Dumping; the specific command line is one procedure for that technique."}
      - {id: cy-3x-q08, type: mcq,
         q: "Using an administrator password hash taken from one workstation, an intruder connects to a file server's admin share and then opens a Remote Desktop session to a second server. Which ATT&CK tactic do these connections serve?",
         choices: ["Privilege Escalation", "Lateral Movement", "Discovery", "Persistence"],
         answer: 1,
         why: "Moving from one system to another inside the network is Lateral Movement. Privilege Escalation is gaining higher rights; here the intruder already holds administrator rights and is using them to reach new hosts."}
      - {id: cy-3x-q09, type: mcq,
         q: "Minutes after a phishing compromise, EDR records these commands on the victim's workstation: whoami /groups, net group 'Domain Admins' /domain, nltest /dclist:corp. Which ATT&CK tactic do they serve?",
         choices: ["Reconnaissance", "Collection", "Discovery", "Credential Access"],
         answer: 2,
         why: "Learning about accounts, groups and domain controllers from inside the environment is Discovery. In ATT&CK, Reconnaissance is information gathering before the attacker has access, and no secrets are being stolen, so it is not Credential Access."}
      - {id: cy-3x-q10, type: mcq,
         q: "Just before logging off a compromised server, an intruder runs: wevtutil cl Security. Which ATT&CK tactic does this serve?",
         choices: ["Defense Evasion", "Impact", "Persistence", "Exfiltration"],
         answer: 0,
         why: "Clearing the Security event log removes traces of the intrusion, which ATT&CK lists as Indicator Removal under Defense Evasion. Impact is about harming the victim's data or availability, not hiding."}
      - {id: cy-3x-q11, type: mcq,
         q: "Weeks before a campaign, an adversary registers several look-alike domains, rents virtual servers and buys a code-signing certificate. Which ATT&CK tactic covers this activity?",
         choices: ["Reconnaissance", "Initial Access", "Command and Control", "Resource Development"],
         answer: 3,
         why: "Acquiring infrastructure and capabilities to support an operation is Resource Development. Reconnaissance is gathering information about the target, and the servers have not yet been used for control."}
      - {id: cy-3x-q12, type: mcq,
         q: "During a major incident three engineers each propose a different containment action and begin to argue. Under the role definitions in the response plan, who makes the decision and assigns the tasks?",
         choices: ["The technical lead", "The incident commander", "The scribe", "The communications lead"],
         answer: 1,
         why: "The incident commander holds overall authority and decides between options. The technical lead advises on what is feasible, but one person must own the decision so that the team acts together."}
      - {id: cy-3x-q13, type: mcq,
         q: "A week after an incident, nobody can say at what time the firewall rule was changed, who approved taking the mail server offline, or which commands were run on it. Which response role was left unfilled?",
         choices: ["Scribe", "Incident commander", "Communications lead", "System owner"],
         answer: 0,
         why: "The scribe keeps the contemporaneous record of findings, decisions and actions with their times. Without it the timeline and the after-action report have to be rebuilt from memory."}
      - {id: cy-3x-q14, type: mcq,
         q: "An intruder had root on a Linux web server for six days. The server keeps its logs locally and also forwards them in real time to a central collector that the intruder never reached. Which copy should the investigation rely on, and why?",
         choices: ["The local copy, because it is the original", "The local copy, because it is more recent", "The central copy, because the intruder could not alter it", "The central copy, because it records more event types"],
         answer: 2,
         why: "Root can edit or delete anything on the server, so the local logs cannot be trusted. Central collection matters in an incident because it puts a copy out of the intruder's reach, not because it records more."}
      - {id: cy-3x-q15, type: mcq,
         q: "A SIEM rule fires only when a VPN login from a country the user has never used before is followed within ten minutes by the same account opening the finance share. The two events come from different log sources. What is the rule doing?",
         choices: ["Log enrichment", "Log retention", "Log ingestion", "Log correlation"],
         answer: 3,
         why: "The rule links events from separate sources by account and time: correlation. Enrichment would add context to a single event, such as the country name looked up from the address."}
      - {id: cy-3x-q16, type: mcq,
         q: "A critical alert for a domain controller fired at 01:00 on Saturday and sat unread on a dashboard until Monday morning. Which change BEST addresses the failure?",
         choices: ["Add more log sources to the SIEM", "Page the on-call analyst for critical alerts and require acknowledgement", "Extend log retention to one year", "Raise the rule's severity threshold"],
         answer: 1,
         why: "Detection worked; the notification never reached a person. Routing critical alerts to an on-call contact with an acknowledgement timer closes that gap, while more sources or longer retention change nothing about who is told."}
      - {id: cy-3x-q17, type: mcq,
         q: "With no incident in progress, a team signs a retainer with a forensics firm, rolls out EDR to the last unmanaged servers and writes a ransomware playbook. Which phase of the response process is this work?",
         choices: ["Preparation", "Post-incident", "Detection", "Recovery"],
         answer: 0,
         why: "Putting people, tools and procedures in place before anything happens is preparation. Post-incident work also improves readiness, but it follows a specific incident and is driven by its findings."}
      - {id: cy-3x-q18, type: mcq,
         q: "A user phones the help desk because her files have a strange new extension, and at the same moment EDR raises an alert on her laptop. Nobody has yet confirmed what is happening. Which phase is the organization in?",
         choices: ["Analysis", "Containment", "Detection", "Preparation"],
         answer: 2,
         why: "Detection is the point at which a tool or a person first signals that something may be wrong. Analysis starts when someone examines the signal to confirm it and work out its scope."}
      - {id: cy-3x-q19, type: mcq,
         q: "A responder reaches a running, compromised workstation and can collect each of the following. Which should be captured FIRST?",
         choices: ["A full image of the internal disk", "The host's logs held in the SIEM", "Last month's backup of the user profile", "Running processes and network connections"],
         answer: 3,
         why: "Process and connection state lives in memory and changes from second to second, so it is the most volatile. The disk, the SIEM copy and the backup will all still be there an hour later."}
      - {id: cy-3x-q20, type: mcq,
         q: "A compromised application server has been patched and the intruder's account removed. It is still in the quarantine VLAN and its owner asks for it to be reconnected. What must happen before it is released from isolation?",
         choices: ["The lessons-learned meeting is held", "A rescan and indicator sweep confirm the fix worked", "The after-action report is signed off", "Customers are told about the outage"],
         answer: 1,
         why: "Remediation has to be verified before the system is trusted on the network again; an unverified fix risks reconnecting a host that is still compromised. Reports and reviews come after recovery."}
      - {id: cy-3x-q21, type: mcq,
         q: "A root cause analysis finds that an intruder logged in to the VPN with a stolen password. Which of these is a properly developed corrective action?",
         choices: ["Enforce MFA on the VPN; owner: IAM lead; due 30 June", "Staff should take more care with their passwords", "The intruder used a password stolen by phishing", "Security will be strengthened going forward"],
         answer: 0,
         why: "A corrective action is a specific change that removes the cause, with an owner and a date. 'Take more care' cannot be checked or completed, and the stolen password is a finding, not an action."}
      - {id: cy-3x-q22, type: mcq,
         q: "A red team launches a staged attack in a test network. The SOC must detect it, isolate hosts and collect evidence with its real tools while observers time each step. What kind of training is this?",
         choices: ["A tabletop exercise", "A playbook review", "A lessons-learned review", "A simulation"],
         answer: 3,
         why: "Responding hands-on to a staged attack is a simulation. A tabletop exercise only talks through what people would do and never touches the tools."}
      - {id: cy-3x-m01, type: multi,
         q: "Which THREE of these are ATT&CK tactics, rather than Kill Chain stages or Diamond Model features? (Choose THREE.)",
         choices: ["Lateral Movement", "Weaponization", "Defense Evasion", "Infrastructure", "Collection", "Delivery"],
         answers: [0, 2, 4],
         why: "Lateral Movement, Defense Evasion and Collection are columns of the ATT&CK matrix. Weaponization and Delivery are Kill Chain stages, and infrastructure is one of the four Diamond features."}
      - {id: cy-3x-m02, type: multi,
         q: "Which TWO of these are meta-features of a Diamond Model event? (Choose TWO.)",
         choices: ["Timestamp", "Capability", "Result", "Victim", "Infrastructure"],
         answers: [0, 2],
         why: "Timestamp and result are meta-features, along with phase, direction, methodology and resources. Capability, victim and infrastructure are three of the four core features."}
      - {id: cy-3x-m03, type: multi,
         q: "Which TWO of these are examples of enriching a log record? (Choose TWO.)",
         choices: ["Adding the country looked up from the source address", "Deleting records older than 90 days", "Adding the asset's owner and criticality from the inventory", "Forwarding syslog over TLS", "Synchronizing the source's clock with NTP"],
         answers: [0, 2],
         why: "Enrichment adds context the original record lacked, such as location or asset ownership. Deleting old records is retention, TLS protects logs in transit and NTP keeps timestamps accurate."}
      - {id: cy-3x-o01, type: order,
         q: "Put these evidence sources in the order they should be collected, most volatile first.",
         steps: ["CPU registers and cache", "Contents of RAM, including the process table", "Temporary files and swap space", "Data on the hard disk", "Archived backup media"],
         why: "Evidence is collected in order of volatility: processor state lasts nanoseconds, memory lasts until power-off, temporary and swap data are overwritten in normal use, disk contents persist, and archives last for years."}
      - {id: cy-3x-o02, type: order,
         q: "A suspect's disk has been removed from a powered-off computer. Put the acquisition steps in order.",
         steps: ["Record the disk's make, model and serial number on the custody form", "Attach the disk to the forensic workstation through a write blocker", "Create a bit-for-bit image of the disk", "Hash the image and confirm it matches the hash of the original", "Seal the original in evidence storage and analyse only the copy"],
         why: "The item is documented before anything is done to it, the write blocker must be in place before the disk is read, the image can only be verified after it exists, and analysis starts only on a verified copy."}

  # ───────────────────────── Domain 3: exam-hard ─────────────────────────
  - id: cy-3y
    title: "Incident response: exam-hard practice"
    domain: "3"
    goal: "I can choose the right next action in an incident from the phase the team is in, the evidence at stake and the framework stage of what I see."
    notes: |
      These are scenario questions above exam difficulty. Three habits answer most of them.

      **1. Name the phase before you choose the action.** Ask what has been confirmed and what has not.

      - New hosts found after containment began? Go back to **analysis**: scope first, then contain all of it.
      - Malware removed but the way in still open? **Eradication** is not finished.
      - Fix applied but not checked? Do not **release from isolation**.
      - Restoring a backup? Compare its date with the *earliest* compromise on the timeline, not with the detection date.

      **2. Protect the evidence in the order it disappears.** Memory before disk, disk before remote logs, remote logs before archives. A hash proves the copy has not changed *since it was hashed*; a custody record proves *who held it*. They are different guarantees, and a question often breaks only one of them.

      **3. Map what you see, not what you fear.**

      | Clue | Framework answer |
      |---|---|
      | The email or download arrives | Kill Chain: delivery |
      | The code is triggered | Kill Chain: exploitation |
      | A Run key, service or task appears | Kill Chain: installation |
      | Regular call-outs for orders | Kill Chain: command and control |
      | Malware, exploit, tool | Diamond: capability |
      | Domain, address, server, sender account | Diamond: infrastructure |

      For ATT&CK, ask what the action is *for*: hiding is Defense Evasion, gathering before sending is Collection, sending out is Exfiltration.
    items:
      - {id: cy-3y-q01, type: mcq,
         q: "EDR has isolated one workstation that was beaconing to a control domain. While reviewing DNS logs, an analyst finds six more hosts that resolved the same domain this week. The team lead wants to begin reimaging the isolated workstation now. What should the team do NEXT?",
         choices: ["Reimage the workstation, then look at the six hosts", "Restore the workstation's data from backup", "Scope the six hosts and contain them before eradicating anything", "Close the alert and schedule the lessons-learned meeting"],
         answer: 2,
         why: "New evidence has reopened analysis: the incident is larger than the one contained host. Eradicating one machine while six others remain connected leaves the intruder in place and warns them that they have been seen."}
      - {id: cy-3y-q02, type: mcq, best: true,
         q: "A team has found three backdoors planted by a group that is known to install fresh ones on other hosts as soon as it sees one removed. The group is collecting data slowly and has done nothing destructive. How many more backdoors exist is unknown. Which approach is BEST?",
         choices: ["Block each backdoor's control address at the firewall as it is found", "Finish scoping quietly, then contain and eradicate everything in one coordinated action", "Reimage the three known hosts tonight and continue hunting", "Disconnect the company from the internet until the hunt is complete"],
         answer: 1,
         why: "Against an adversary that reacts to partial clean-up, eradication only works if every foothold is removed together, and the slow, non-destructive activity gives the team time to finish scoping.",
         whys: ["Stops those three channels but shows the group it has been found while unknown backdoors remain.", "Best: nothing alerts the group until every known foothold can be removed at the same time.", "Removes three of an unknown number and triggers exactly the re-infection the group is known for.", "Would contain everything, but the business cost is out of proportion to slow, non-destructive activity."]}
      - {id: cy-3y-q03, type: mcq, best: true,
         q: "A virtual file server began encrypting its own data volumes four minutes ago. This ransomware family is known to hold its encryption key in memory while it runs. Which action is BEST?",
         choices: ["Suspend the virtual machine and take a snapshot that includes memory", "Power the virtual machine off from the hypervisor", "Shut the guest operating system down cleanly", "Disconnect the virtual network adapter and leave it running"],
         answer: 0,
         why: "Suspending freezes the encryption at once and the memory snapshot keeps the key, the most volatile and most valuable evidence here.",
         whys: ["Best: stops the damage immediately and preserves memory, where the key is.", "Stops the damage but discards the memory that holds the key.", "Loses memory, takes longer, and the shutdown itself writes to the disks.", "Stops any spread, but the local volumes keep being encrypted."]}
      - {id: cy-3y-q04, type: mcq,
         q: "An analyst lines up four records from one workstation. Which one is evidence of the Kill Chain's exploitation stage?",
         choices: ["10:02 proxy: invoice.docm downloaded from a link in an email", "10:04 EDR: new value written under the user's registry Run key", "10:05 proxy: POST to the same external site every 60 seconds", "10:03 EDR: winword.exe starts powershell.exe with an encoded command"],
         answer: 3,
         why: "Word launching PowerShell is the macro's code being triggered on the victim: exploitation. The download is delivery, the Run key is installation and the regular POSTs are command and control."}
      - {id: cy-3y-q05, type: mcq,
         q: "A group's known playbook is: an emailed macro document, the macro launches a downloader, the downloader installs a backdoor, the backdoor beacons over HTTPS, and data leaves as web uploads. Which control breaks this chain at the EARLIEST stage?",
         choices: ["Egress filtering through an authenticated proxy", "Detonating attachments in a sandbox at the mail gateway", "Application allowlisting on workstations", "Data loss prevention on outbound uploads"],
         answer: 1,
         why: "The mail gateway acts at delivery, the first stage the defender can touch here. Allowlisting acts at exploitation or installation, egress filtering at command and control, and DLP only at actions on objectives."}
      - {id: cy-3y-q06, type: mcq,
         q: "Two intrusions at different companies used unrelated malware families. In both, the control servers sat in the same small netblock and were registered with the same email address, and both targets were regional water utilities. Which Diamond Model features do the two events share?",
         choices: ["Infrastructure and victim", "Capability and infrastructure", "Capability and victim", "Adversary and capability"],
         answer: 0,
         why: "The servers and registration details are infrastructure, and the common type of target is the victim feature. The malware differs, so capability is not shared, and the adversary is only inferred from the overlap, not observed."}
      - {id: cy-3y-q07, type: mcq,
         q: "An analyst has one infected host and the malicious DLL recovered from it. The goal is to find other victims inside the company. Which step is the BEST next pivot?",
         choices: ["Block the DLL's hash on every endpoint", "Compare the code style with known groups to name the adversary", "Extract the control-server addresses from the DLL and search network logs for them", "Search endpoint telemetry for the first victim's host name"],
         answer: 2,
         why: "Pivoting from capability to infrastructure and then to victims finds every host that contacted the same servers, even if the DLL was repacked with a new hash. Blocking a hash is protection, not discovery, and attribution does not locate victims."}
      - {id: cy-3y-q08, type: mcq,
         q: "An intruder already has a command prompt on a workstation. Instead of running a malicious DLL directly, the intruder loads it through rundll32.exe, a signed Windows binary, so that the application allowlisting policy lets it run. Which ATT&CK tactic does the choice of rundll32.exe serve?",
         choices: ["Persistence", "Privilege Escalation", "Lateral Movement", "Defense Evasion"],
         answer: 3,
         why: "Proxying execution through a trusted, signed binary exists to get past a security control, which ATT&CK lists as System Binary Proxy Execution under Defense Evasion. Nothing here survives a reboot, raises rights or reaches another host."}
      - {id: cy-3y-q09, type: mcq,
         q: "EDR on a compromised server records: 7z a -pS3cret C:/ProgramData/a.7z //fs01/finance/*. Firewall logs show no outbound transfer from the server yet. Which ATT&CK tactic does this command serve?",
         choices: ["Exfiltration", "Collection", "Impact", "Discovery"],
         answer: 1,
         why: "Gathering and archiving data ready to be stolen is Collection (Archive Collected Data). Exfiltration is the transfer out of the network, which the firewall shows has not happened yet."}
      - {id: cy-3y-q10, type: mcq,
         q: "Within one minute a standard domain user account requests Kerberos service tickets for 40 different service accounts, all with RC4 encryption (many event ID 4769 entries with encryption type 0x17). No logons to those services follow. Which ATT&CK tactic is MOST likely being served?",
         choices: ["Credential Access", "Discovery", "Lateral Movement", "Privilege Escalation"],
         answer: 0,
         why: "Requesting many RC4 service tickets without using them is Kerberoasting: the tickets are taken away and cracked offline to recover service-account passwords, a Credential Access technique. Lateral Movement would show actual connections to the services."}
      - {id: cy-3y-q11, type: mcq,
         q: "An analyst images a disk and records a SHA-256 hash. The image drive is then sent by courier to an outside forensic firm, but nobody records the handover or the firm's receipt. When the firm hashes the image, the value matches. What is the weakness in this evidence?",
         choices: ["The image's integrity can no longer be shown", "The order of volatility was not followed", "The chain of custody has a gap", "The legal hold has been breached"],
         answer: 2,
         why: "The matching hash shows the image is unchanged, so integrity holds. What is missing is the record of who had the drive during transit, which is a break in the chain of custody."}
      - {id: cy-3y-q12, type: mcq,
         q: "A suspect's disk was connected directly to an analysis workstation and mounted read-write for several minutes. It was then imaged, and the image's hash matched the disk's hash taken at that moment. Which statement BEST describes the evidence?",
         choices: ["The matching hashes prove the disk is exactly as the suspect left it", "The image is useless because two hashes were needed", "The chain of custody is broken because the disk was mounted", "The image matches the disk as imaged, but the disk may have changed before that"],
         answer: 3,
         why: "A hash only proves nothing changed after it was calculated. Mounting the original read-write without a write blocker may already have altered timestamps and files, which is a preservation failure the later hash cannot reveal."}
      - {id: cy-3y-q13, type: mcq,
         q: "Counsel issues a legal hold covering all records of three employees' activity for an expected lawsuit. The SOC's EDR platform automatically purges telemetry after 30 days, including telemetry from those employees' laptops. What should the SOC do?",
         choices: ["Let the purge run, because legal holds apply only to email", "Suspend the purge for the telemetry that is in scope of the hold", "Record a hash of the telemetry and then let it be purged", "Shorten the purge period so less data is held"],
         answer: 1,
         why: "A legal hold overrides normal retention for every relevant record, whatever system holds it. A hash proves integrity of something you still have; it does not replace data that has been deleted."}
      - {id: cy-3y-q14, type: mcq, best: true,
         q: "A database server behind the web shop is sending small batches of customer records to one external address every hour. The shop must keep taking orders, and investigators need the server's memory and disk intact. Which containment action is BEST?",
         choices: ["Restrict the server's traffic to the web application tier only", "Power the server off", "Rebuild the server from the standard image", "Leave it unchanged and add a packet capture"],
         answer: 0,
         why: "Segmenting the server cuts the route the data is leaving by while orders keep flowing and the evidence stays untouched; it is the only choice that meets all three constraints.",
         whys: ["Best: stops the theft, keeps the shop trading and preserves memory and disk.", "Stops the theft but halts orders and discards memory.", "Stops the theft but halts orders and destroys both memory and disk evidence.", "Keeps the shop running and the evidence intact, but customer records keep leaving."]}
      - {id: cy-3y-q15, type: mcq,
         q: "Ransomware was detected on 20 May. The timeline shows the intruder's first access was on 11 May. After eradication, the team restores the file server from the backup taken on 17 May. What is the problem with this recovery?",
         choices: ["The backup may hold the intruder's backdoor, because it was taken after the first access", "The backup is too old to be useful", "Restoring any backup always destroys the chain of custody", "The backup should have been restored before eradication"],
         answer: 0,
         why: "A backup is only known to be clean if it predates the earliest compromise, which was 11 May, not the detection date. Restoring the 17 May copy can bring the intruder's foothold back with the data."}
      - {id: cy-3y-q16, type: mcq,
         q: "An isolated server has been patched and an antivirus scan is clean, but the vulnerability rescan still reports the flawed version because the patch needs a reboot that has not happened. The owner insists on reconnecting it now. What is the correct decision?",
         choices: ["Release it with extra monitoring", "Mark the rescan result as a false positive and release it", "Restore it from backup instead", "Keep it isolated until it is rebooted and the rescan passes"],
         answer: 3,
         why: "Release from isolation follows verified remediation, and the rescan shows the fix is not yet effective. Calling an accurate result a false positive would reconnect a server that is still exploitable."}
      - {id: cy-3y-q17, type: mcq,
         q: "An intruder stole the password hash of the krbtgt account and has been forging Kerberos ticket-granting tickets. Every compromised host has been rebuilt. Which eradication step is still needed to invalidate the forged tickets?",
         choices: ["Reset every user's password once", "Reboot all the domain controllers", "Reset the krbtgt account's password twice", "Reissue the domain controllers' certificates"],
         answer: 2,
         why: "Forged tickets are signed with the krbtgt key, and the domain accepts both the current and the previous key, so the password must be changed twice. Resetting user passwords does not touch the key that signs tickets."}
      - {id: cy-3y-q18, type: mcq,
         q: "A compromised cloud virtual machine belongs to an auto-scaling group that terminates and replaces any instance failing its health check. What should the responder do FIRST to preserve evidence?",
         choices: ["Terminate the instance so that a clean one replaces it", "Take it out of the scaling group, snapshot its disk and move it to a quarantine security group", "Log in to the instance and run investigation commands", "Change the health check so that it always fails"],
         answer: 1,
         why: "If the instance is terminated its disk and memory are gone, so it must first be protected from the scaling group, captured and isolated. Logging in to investigate changes the evidence before a copy exists."}
      - {id: cy-3y-q19, type: mcq,
         q: "A company phone is seized from an employee under investigation. It is powered on and unlocked, and the employee could trigger a remote wipe from another device. How should the responder handle it while waiting for the examiner?",
         choices: ["Power it off and store it in a locked drawer", "Connect it to the corporate Wi-Fi and start a backup", "Leave it as it is on the investigator's desk", "Keep it powered and place it in a Faraday bag"],
         answer: 3,
         why: "Blocking all radio signals stops a remote wipe, and keeping it powered avoids the device locking and encrypting its contents. Powering off prevents the wipe but may make the data unreachable without the passcode."}
      - {id: cy-3y-q20, type: mcq,
         q: "A domain controller, logging in local time (UTC+2), records an administrator logon at 15:02. A firewall, logging in UTC, records a large outbound transfer at 13:05. Which event happened first, and by how much?",
         choices: ["The transfer, by 1 hour 57 minutes", "The transfer, by 3 hours 57 minutes", "The logon, by 3 minutes", "The logon, by 2 hours 3 minutes"],
         answer: 2,
         why: "15:02 at UTC+2 is 13:02 UTC, three minutes before the 13:05 transfer. Comparing the raw values without converting makes the transfer look earlier by 1 hour 57 minutes."}
      - {id: cy-3y-q21, type: mcq,
         q: "While examining an employee's laptop for malware, an analyst opens a folder containing images that appear to be child abuse material. What should the analyst do NEXT?",
         choices: ["Stop the examination, secure the laptop and escalate to management and legal counsel", "Copy the images to the case folder as evidence", "Delete the images and continue the malware analysis", "Send screenshots to the employee's manager"],
         answer: 0,
         why: "This is now a possible crime beyond the analyst's authority: the device is secured and the matter escalated so that counsel can involve law enforcement. Copying, viewing further or deleting the material could itself be unlawful and damages the evidence."}
      - {id: cy-3y-q22, type: mcq,
         q: "An intrusion began with an emailed attachment. An analyst reconstructing it needs evidence of the delivery stage. Which source is MOST useful?",
         choices: ["EDR process-creation events", "Mail gateway logs", "DNS query logs", "Data loss prevention alerts"],
         answer: 1,
         why: "The mail gateway recorded the message arriving: sender, recipient, time and attachment. EDR process events show the later exploitation and installation stages on the host."}
      - {id: cy-3y-q23, type: mcq,
         q: "A firewall alert shows 10.4.7.22 sending 1.2 GB to an external address at 03:14. The DHCP log shows that 10.4.7.22 was leased to LAPTOP-114 until 02:50 and to KIOSK-9 from 03:01. Which device should responders isolate?",
         choices: ["LAPTOP-114", "The DHCP server", "The firewall", "KIOSK-9"],
         answer: 3,
         why: "Correlating the alert time with the lease history shows KIOSK-9 held the address at 03:14. Acting on the address alone, or on an older asset record, would send responders to the laptop that had released it."}
      - {id: cy-3y-q24, type: mcq,
         q: "A team deletes a web shell from an internet-facing server and returns the server to service. Two days later a new web shell appears in the same directory, placed through the same file-upload flaw. Which phase was left incomplete?",
         choices: ["Detection", "Containment", "Eradication", "Recovery"],
         answer: 2,
         why: "Eradication means removing the intruder's presence and closing the weakness that let them in. The team removed the artifact but left the upload flaw, so the same route worked again."}
      - {id: cy-3y-q25, type: mcq,
         q: "A responder has limited time with a compromised host. Which of these sources is LEAST urgent to collect?",
         choices: ["The host's logs already archived on the SIEM", "The contents of RAM", "The pagefile", "An image of the system disk"],
         answer: 0,
         why: "Logs already stored on a separate system are the least volatile item listed and will still be there tomorrow. RAM is lost at power-off, the pagefile is overwritten in use, and the disk keeps changing while the host runs."}
      - {id: cy-3y-q26, type: mcq, best: true,
         q: "An employee is suspected of taking design files, and the case is likely to reach court. Her laptop is powered off in her desk. Which way of obtaining the evidence is BEST?",
         choices: ["Boot the laptop and copy her folders to a USB drive", "Remove the disk, image it through a write blocker, hash both and log custody", "Retrieve her files from last night's backup", "Log in remotely with an administrator account and search for the files"],
         answer: 1,
         why: "Because the case may go to court, the evidence must be complete, demonstrably unaltered and accounted for; a write-blocked image with matching hashes and a custody record gives all three.",
         whys: ["Booting changes hundreds of files and timestamps on the original.", "Best: the original is never written to, the copy is provably exact and every handler is recorded.", "Leaves the original untouched, but a backup lacks deleted files and device-connection history.", "Needs the laptop running and alters the original through the logon and the search."]}
      - {id: cy-3y-q27, type: mcq, best: true,
         q: "Ransomware is contained and eradicated. The recovery time objective is 24 hours, of which four have passed. The insurer and counsel require forensic images, and the encrypted servers are the only hardware available. Which course is BEST?",
         choices: ["Wipe and restore at once, relying on SIEM logs as the evidence", "Delay restoration until the forensic analysis is complete", "Restore half the servers now and image the other half", "Image the affected disks, or swap them for new ones, and then restore"],
         answer: 3,
         why: "Imaging or swapping disks takes hours, not days, so it preserves the required evidence and still fits inside the 20 hours that remain.",
         whys: ["Meets the deadline but destroys the disk evidence the insurer and counsel require.", "Preserves evidence, but analysis can take weeks and the objective would be missed.", "Loses the evidence on every server restored first.", "Best: evidence is preserved first and restoration still meets the objective."]}
      - {id: cy-3y-q28, type: mcq, best: true,
         q: "A commodity worm is found on an operator workstation (HMI) that controls a running chemical process. Losing the workstation abruptly would force an unsafe manual shutdown. The IT playbook says to isolate infected hosts from the EDR console at once. Which action is BEST?",
         choices: ["Isolate the workstation from the EDR console immediately", "Power the workstation off", "Block the worm at the IT/OT boundary firewall and plan the clean-up with plant operations", "Leave everything unchanged until the next annual shutdown"],
         answer: 2,
         why: "In operational technology, safety and availability come first: containing at the network boundary stops the spread without taking away the operators' view of the process.",
         whys: ["Right for an office PC, but here it removes control of a live process and creates a safety risk.", "Contains the worm at the cost of the same unsafe shutdown.", "Best: stops the spread now and removes the worm at a time operations agree is safe.", "Avoids disruption but lets the worm spread for months."]}
      - {id: cy-3y-m01, type: multi,
         q: "A responder is about to cut power to a compromised server. Which TWO sources of evidence will be lost when the power goes? (Choose TWO.)",
         choices: ["The contents of RAM", "Files in the administrator's Documents folder", "The list of active network connections", "The file system's master file table", "Web server access logs on the disk"],
         answers: [0, 2],
         why: "Memory and live connection state exist only while the system runs. Documents, the master file table and log files are stored on disk and survive a power cut."}
      - {id: cy-3y-m02, type: multi,
         q: "An intruder is using a stolen account from one infected workstation. Which TWO of these actions are containment? (Choose TWO.)",
         choices: ["Reimaging the workstation", "Disabling the stolen account", "Restoring the user's files from backup", "Isolating the workstation with the EDR agent", "Patching the exploited flaw on every workstation", "Holding the lessons-learned meeting"],
         answers: [1, 3],
         why: "Disabling the account and isolating the host limit what the intruder can reach. Reimaging and patching are eradication, restoring files is recovery and the review is post-incident."}
      - {id: cy-3y-m03, type: multi,
         q: "Which TWO controls act at the command-and-control stage of the Kill Chain? (Choose TWO.)",
         choices: ["Attachment filtering at the mail gateway", "DNS sinkholing of known malicious domains", "Prompt patching of browsers and document readers", "Egress filtering that blocks unapproved outbound connections", "Security awareness training on phishing"],
         answers: [1, 3],
         why: "Sinkholing and egress filtering stop an implant reaching its controller. Mail filtering and awareness training act at delivery, and patching removes the flaw that exploitation needs."}
      - {id: cy-3y-m04, type: multi,
         q: "A report reads: 'A state-backed group sent messages from newly created webmail accounts to aerospace engineers. The attachment exploited a document-reader flaw and installed a custom remote-access trojan fetched from compromised blog sites.' Which TWO elements are Diamond Model capabilities? (Choose TWO.)",
         choices: ["The custom remote-access trojan", "The compromised blog sites", "The aerospace engineers", "The exploit for the document-reader flaw", "The state-backed group", "The webmail accounts used to send the messages"],
         answers: [0, 3],
         why: "Capability is the tools and techniques used: the trojan and the exploit. The blog sites and webmail accounts are infrastructure, the engineers are the victim and the group is the adversary."}
      - {id: cy-3y-m05, type: multi,
         q: "Which THREE of these observations show an intruder establishing persistence? (Choose THREE.)",
         choices: ["A new service that starts the payload at boot", "A dump of the LSASS process memory", "A new value under a registry Run key", "A port scan of the server subnet", "A scheduled task that runs the payload at every logon", "The Security event log being cleared"],
         answers: [0, 2, 4],
         why: "A boot-time service, a Run key and a logon task all make the payload start again after a restart. Dumping LSASS is Credential Access, scanning is Discovery and clearing logs is Defense Evasion."}
      - {id: cy-3y-m06, type: multi,
         q: "Which TWO entries must a chain-of-custody form contain for each transfer of an evidence item? (Choose TWO.)",
         choices: ["The date and time of the transfer", "The suspected root cause of the incident", "The names and signatures of the person releasing and the person receiving", "The CVSS score of the exploited flaw", "The analyst's opinion of the suspect's guilt"],
         answers: [0, 2],
         why: "Custody is proved by recording when each transfer happened and who handed the item over and received it. Root cause, scores and opinions belong in the investigation report, not the custody record."}
      - {id: cy-3y-o01, type: order,
         q: "Six events were observed in one intrusion. Arrange them in the left-to-right order of their tactics in the ATT&CK Enterprise matrix.",
         steps: ["A phishing attachment is opened (Initial Access)", "The macro runs a PowerShell command (Execution)", "A registry Run key is added (Persistence)", "LSASS memory is dumped (Credential Access)", "A Remote Desktop session is opened to a file server (Lateral Movement)", "An archive is uploaded to an external site (Exfiltration)"],
         why: "The matrix orders tactics roughly as an intrusion unfolds: Initial Access, Execution, Persistence, then later Credential Access, Lateral Movement and, near the end, Exfiltration."}
      - {id: cy-3y-o02, type: order,
         q: "A sign-in alert suggests a mailbox has been taken over after a phishing email. Put the response actions in order.",
         steps: ["Confirm the sign-in is malicious and identify every affected mailbox", "Revoke active sessions and disable the affected accounts", "Remove the intruder's forwarding rules and reset passwords and MFA methods", "Re-enable the accounts and watch their sign-ins closely", "Review the incident and update the phishing playbook"],
         why: "This follows analysis, containment, eradication, recovery and post-incident. Scope is established before containing, the intruder's rules and credentials are removed before accounts are given back, and the review comes last."}
