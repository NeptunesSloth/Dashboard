  # ───────────────────────────────────────────────────────────────── 9
  - id: fr-09
    title: "Getting around: places, directions & aller"
    goal: "I can ask for and follow simple directions and say where I am going and where I live."
    notes: |
      **aller** (to go) is the only irregular *-er* verb:

      | pronoun | aller |
      |---|---|
      | je | vais |
      | tu | vas |
      | il / elle / on | va |
      | nous | allons |
      | vous | allez |
      | ils / elles | vont |

      ## à + article
      *à* (to, at, in) merges with *le* and *les*:

      - à + le = **au**: *au supermarché*
      - à + la = **à la**: *à la gare*
      - à + l' = **à l'**: *à l'hôtel*
      - à + les = **aux**: *aux États-Unis*

      *de* does the same: **du**, de la, de l', **des** — *près du musée*.

      ## In / to a place
      - Cities: **à** Paris, à Londres.
      - Feminine countries (most end in -e): **en** France, en Italie.
      - Masculine countries: **au** Canada. Plural: **aux** États-Unis.
      - Someone's home or business: **chez** Paul, chez le médecin.

      French uses the same word for "in" and "to": *Je suis à Paris / Je vais à Paris.*
    items:
      - {id: fr-09-aller, type: vocab, l2: "aller", l1: "to go", ex: "J'aime aller au cinéma.", ex_l1: "I like going to the cinema.", note: "Irregular: je vais, tu vas, il va, nous allons, vous allez, ils vont."}
      - {id: fr-09-ville, type: vocab, l2: "la ville", l1: "the city / the town", ex: "Paris est une grande ville.", ex_l1: "Paris is a big city.", note: "Here the l is pronounced: 'veel' (unlike fille)."}
      - {id: fr-09-rue, type: vocab, l2: "la rue", l1: "the street", ex: "J'habite dans cette rue.", ex_l1: "I live in this street.", note: "'In the street' = dans la rue."}
      - {id: fr-09-gare, type: vocab, l2: "la gare", l1: "the train station", ex: "La gare est près d'ici.", ex_l1: "The station is near here."}
      - {id: fr-09-hotel, type: vocab, l2: "l'hôtel", l1: "the hotel", ex: "Je cherche l'hôtel de la gare.", ex_l1: "I am looking for the station hotel.", note: "masculine: un hôtel. Silent h, so liaison: un‿hôtel."}
      - {id: fr-09-musee, type: vocab, l2: "le musée", l1: "the museum", ex: "Le musée est fermé le mardi.", ex_l1: "The museum is closed on Tuesdays.", note: "Masculine even though it ends in -ée."}
      - {id: fr-09-pharmacie, type: vocab, l2: "la pharmacie", l1: "the pharmacy", ex: "Il y a une pharmacie dans la rue.", ex_l1: "There is a pharmacy in the street.", note: "Look for the green cross sign."}
      - {id: fr-09-supermarche, type: vocab, l2: "le supermarché", l1: "the supermarket", ex: "Le supermarché est ouvert le dimanche.", ex_l1: "The supermarket is open on Sundays."}
      - {id: fr-09-ici, type: vocab, l2: "ici", l1: "here", ex: "J'habite ici.", ex_l1: "I live here."}
      - {id: fr-09-a-gauche, type: vocab, l2: "à gauche", l1: "on the left / to the left", ex: "La banque est à gauche.", ex_l1: "The bank is on the left."}
      - {id: fr-09-a-droite, type: vocab, l2: "à droite", l1: "on the right / to the right", ex: "Le musée est à droite.", ex_l1: "The museum is on the right.", note: "Hear the final t: 'drwat'. Compare tout droit (straight ahead), where it is silent."}
      - {id: fr-09-tout-droit, type: vocab, l2: "tout droit", l1: "straight ahead", ex: "Allez tout droit.", ex_l1: "Go straight ahead.", note: "droit ('drwa') = straight; droite ('drwat') = right. Listen for the t!"}
      - {id: fr-09-pres-de, type: vocab, l2: "près de", l1: "near / close to", ex: "L'hôtel est près de la gare.", ex_l1: "The hotel is near the station.", note: "de + le = du: près du musée."}
      - {id: fr-09-loin-de, type: vocab, l2: "loin de", l1: "far from", ex: "J'habite loin de Paris.", ex_l1: "I live far from Paris."}
      - {id: fr-09-chez, type: vocab, l2: "chez", l1: "at / to the home of (someone)", ex: "Je vais chez mon frère.", ex_l1: "I am going to my brother's.", note: "Only with people: chez moi = at my place, chez le médecin = at the doctor's."}
      - {id: fr-09-ou-est-la-gare, type: phrase, l2: "Où est la gare, s'il vous plaît ?", l1: "Where is the train station, please? (formal)", alt: ["Où se trouve la gare, s'il vous plaît ?", "La gare est où, s'il vous plaît ?"]}
      - {id: fr-09-tournez-a-gauche, type: phrase, l2: "Tournez à gauche.", l1: "Turn left. (formal)", alt: ["Prenez à gauche."], note: "The vous command is just the vous form without vous."}
      - {id: fr-09-c-est-loin, type: phrase, l2: "C'est loin ?", l1: "Is it far?", alt: ["Est-ce que c'est loin ?", "Est-ce loin ?", "C'est loin d'ici ?"]}
      - {id: fr-09-je-suis-perdu, type: phrase, l2: "Je suis perdu.", l1: "I am lost. (said by a man)", note: "A woman writes: Je suis perdue (same sound)."}
      - {id: fr-09-c1, type: cloze, text: "Je ___ à la banque.", answer: "vais", l1: "I am going to the bank.", note: "aller → je vais."}
      - {id: fr-09-c2, type: cloze, text: "Tu ___ où ce soir ?", answer: "vas", l1: "Where are you going tonight? (to a friend)", note: "aller → tu vas."}
      - {id: fr-09-c3, type: cloze, text: "Nous ___ au cinéma demain.", answer: "allons", l1: "We are going to the cinema tomorrow.", note: "aller → nous allons."}
      - {id: fr-09-c4, type: cloze, text: "Les enfants ___ à l'école en bus.", answer: "vont", l1: "The children go to school by bus.", note: "aller → ils vont."}
      - {id: fr-09-c5, type: cloze, text: "Elle va ___ supermarché.", answer: "au", l1: "She is going to the supermarket.", note: "à + le = au (supermarché is masculine)."}
      - {id: fr-09-c6, type: cloze, text: "Mon frère habite ___ États-Unis.", answer: "aux", l1: "My brother lives in the United States.", note: "à + les = aux, for plural countries."}
      - {id: fr-09-c7, type: cloze, text: "J'habite ___ France.", answer: "en", l1: "I live in France.", note: "en + feminine country: en France, en Italie."}

  # ───────────────────────────────────────────────────────────────── 10
  - id: fr-10
    title: "Describing: adjectives & colours"
    goal: "I can describe people, places and things, including their colour and size."
    notes: |
      A French adjective **agrees** with its noun in gender and number.

      | | masculine | feminine |
      |---|---|---|
      | singular | grand | grande |
      | plural | grands | grandes |

      - Usually add **-e** for feminine and **-s** for plural. The added *e* makes a silent final consonant audible: *grand* ("gran") → *grande* ("grand").
      - Adjectives already ending in *-e* don't change in the feminine: *rouge, jeune*.
      - Irregular feminines: *bon → bonne, blanc → blanche, beau → belle, nouveau → nouvelle, vieux → vieille*.

      ## Position
      Most adjectives, and all colours, come **after** the noun: *une voiture rouge*.

      A few short, common ones come **before**: *beau, bon, mauvais, grand, petit, jeune, vieux, nouveau, joli* — *un petit chien, une bonne idée*.

      ## This / that
      **ce** + masculine, **cette** + feminine, **ces** + plural (and **cet** before a masculine noun starting with a vowel or silent h: *cet homme*).

      ## Hair and eyes
      Use *avoir* + *les*: *Elle a les yeux bleus.*

      **très** = very; **trop** = too.
    items:
      - {id: fr-10-grand, type: vocab, l2: "grand", l1: "big / tall (masculine)", ex: "Mon frère est grand.", ex_l1: "My brother is tall.", note: "Feminine: grande (the d is then pronounced). Goes before the noun: un grand jardin."}
      - {id: fr-10-petit, type: vocab, l2: "petit", l1: "small / short (masculine)", ex: "J'ai un petit chien.", ex_l1: "I have a small dog.", note: "Feminine: petite. Goes before the noun."}
      - {id: fr-10-bon, type: vocab, l2: "bon", l1: "good (masculine)", ex: "C'est un bon restaurant.", ex_l1: "It's a good restaurant.", note: "Feminine: bonne. Goes before the noun."}
      - {id: fr-10-mauvais, type: vocab, l2: "mauvais", l1: "bad (masculine)", ex: "Le film est mauvais.", ex_l1: "The film is bad.", note: "Feminine: mauvaise. Already ends in s, so no extra s in the masculine plural."}
      - {id: fr-10-beau, type: vocab, l2: "beau", l1: "beautiful / handsome (masculine)", ex: "C'est un beau jardin.", ex_l1: "It's a beautiful garden.", note: "Feminine: belle. Before a masculine vowel: bel (un bel homme). Plural: beaux."}
      - {id: fr-10-nouveau, type: vocab, l2: "nouveau", l1: "new (masculine)", ex: "J'ai un nouveau téléphone.", ex_l1: "I have a new phone.", note: "Feminine: nouvelle. Plural: nouveaux."}
      - {id: fr-10-vieux, type: vocab, l2: "vieux", l1: "old (masculine)", ex: "Mon chien est vieux.", ex_l1: "My dog is old.", note: "Feminine: vieille ('vyay'). For a person's age, âgé is more polite."}
      - {id: fr-10-jeune, type: vocab, l2: "jeune", l1: "young", ex: "Ma mère est jeune.", ex_l1: "My mother is young.", note: "Same form for masculine and feminine."}
      - {id: fr-10-content, type: vocab, l2: "content", l1: "happy / pleased (masculine)", alt: ["heureux"], ex: "Il est content de son travail.", ex_l1: "He is happy with his job.", note: "Feminine: contente. heureux / heureuse is a stronger 'happy'."}
      - {id: fr-10-rouge, type: vocab, l2: "rouge", l1: "red", ex: "J'aime le vin rouge.", ex_l1: "I like red wine.", note: "Colours go after the noun. Same form for both genders."}
      - {id: fr-10-bleu, type: vocab, l2: "bleu", l1: "blue (masculine)", ex: "Le stylo est bleu.", ex_l1: "The pen is blue.", note: "Feminine: bleue (same sound). Plural: bleus."}
      - {id: fr-10-vert, type: vocab, l2: "vert", l1: "green (masculine)", ex: "J'ai un sac vert.", ex_l1: "I have a green bag.", note: "Feminine: verte (the t is then pronounced)."}
      - {id: fr-10-noir, type: vocab, l2: "noir", l1: "black (masculine)", ex: "Mon chat est noir.", ex_l1: "My cat is black.", note: "Feminine: noire (same sound)."}
      - {id: fr-10-blanc, type: vocab, l2: "blanc", l1: "white (masculine)", ex: "Je voudrais un verre de vin blanc.", ex_l1: "I would like a glass of white wine.", note: "Final c silent. Irregular feminine: blanche."}
      - {id: fr-10-tres, type: vocab, l2: "très", l1: "very", ex: "La ville est très belle.", ex_l1: "The city is very beautiful.", note: "Not used with 'much': 'very much' is simply beaucoup."}
      - {id: fr-10-quelle-couleur, type: phrase, l2: "De quelle couleur est ta voiture ?", l1: "What colour is your car? (to a friend)", alt: ["Ta voiture est de quelle couleur ?", "Elle est de quelle couleur, ta voiture ?"], note: "French asks 'OF what colour …?'"}
      - {id: fr-10-cheveux-noirs, type: phrase, l2: "Elle a les cheveux noirs.", l1: "She has black hair.", note: "Hair is plural in French (les cheveux), so the adjective takes an s."}
      - {id: fr-10-yeux-bleus, type: phrase, l2: "Il a les yeux bleus.", l1: "He has blue eyes.", note: "les yeux is the irregular plural of un œil (an eye). Liaison: les‿yeux."}
      - {id: fr-10-bonne-idee, type: phrase, l2: "C'est une bonne idée.", l1: "It's a good idea.", note: "idée is feminine, so bon → bonne."}
      - {id: fr-10-c1, type: cloze, text: "Ma sœur est ___.", answer: "grande", l1: "My sister is tall.", note: "Feminine singular: grand + e."}
      - {id: fr-10-c2, type: cloze, text: "La maison est ___.", answer: "blanche", l1: "The house is white.", note: "Irregular feminine: blanc → blanche."}
      - {id: fr-10-c3, type: cloze, text: "Paul et Marc sont très ___.", answer: "contents", alt: ["heureux"], l1: "Paul and Marc are very happy.", note: "Masculine plural: content + s."}
      - {id: fr-10-c4, type: cloze, text: "C'est une ___ voiture.", answer: "belle", alt: ["jolie"], l1: "It's a beautiful car.", note: "Irregular feminine: beau → belle. It goes before the noun."}
      - {id: fr-10-c5, type: cloze, text: "Elle porte une robe ___.", answer: "verte", l1: "She is wearing a green dress.", note: "robe is feminine: vert + e. Colours follow the noun."}
      - {id: fr-10-c6, type: cloze, text: "___ fille est ma sœur.", answer: "cette", l1: "This girl is my sister.", note: "ce (masculine) / cette (feminine) / ces (plural)."}
      - {id: fr-10-c7, type: cloze, text: "Ces pommes sont très ___.", answer: "bonnes", l1: "These apples are very good.", note: "Feminine plural: bon → bonne + s."}

  # ───────────────────────────────────────────────────────────────── 11
  - id: fr-11
    title: "Plans & abilities: irregular verbs and the near future"
    goal: "I can say what I can, must and want to do, and talk about my plans for the near future."
    notes: |
      The most useful verbs are irregular. Learn *je*, *nous* and *ils* and you can usually guess the rest.

      | | je | nous | vous | ils |
      |---|---|---|---|---|
      | faire | fais | faisons | faites | font |
      | pouvoir | peux | pouvons | pouvez | peuvent |
      | vouloir | veux | voulons | voulez | veulent |
      | devoir | dois | devons | devez | doivent |
      | venir | viens | venons | venez | viennent |
      | prendre | prends | prenons | prenez | prennent |

      The *tu* form is spelled like *je*; the *il* form usually ends in *-t* (*il fait, peut, veut, doit, vient*) but: *il prend*.

      ## Verb + infinitive
      *pouvoir, vouloir, devoir* are followed by an unconjugated verb: *Je peux venir. Je dois partir.*

      **Il faut** + infinitive = it is necessary to: *Il faut attendre.*

      ## The near future
      **aller** (present) + infinitive = "going to": Je **vais** visiter Paris. This is all the future you need at A1.

      Negative: Je **ne** vais **pas** travailler.

      *venir de* + place = to come from: *Je viens de Londres.*
    items:
      - {id: fr-11-faire, type: vocab, l2: "faire", l1: "to do / to make", ex: "Qu'est-ce que tu aimes faire le soir ?", ex_l1: "What do you like to do in the evening?", note: "Irregular: je fais, tu fais, il fait, nous faisons, vous faites, ils font."}
      - {id: fr-11-pouvoir, type: vocab, l2: "pouvoir", l1: "to be able to / can", ex: "Je peux entrer ?", ex_l1: "Can I come in?", note: "je peux, tu peux, il peut, nous pouvons, vous pouvez, ils peuvent."}
      - {id: fr-11-venir, type: vocab, l2: "venir", l1: "to come", ex: "Tu viens avec nous ?", ex_l1: "Are you coming with us?", note: "je viens, tu viens, il vient, nous venons, vous venez, ils viennent."}
      - {id: fr-11-prendre, type: vocab, l2: "prendre", l1: "to take", ex: "Je prends le métro.", ex_l1: "I take the metro.", note: "Also used for food and drink: Je prends un café = I'll have a coffee."}
      - {id: fr-11-devoir, type: vocab, l2: "devoir", l1: "to have to / must", ex: "Je dois travailler demain.", ex_l1: "I have to work tomorrow.", note: "je dois, tu dois, il doit, nous devons, vous devez, ils doivent."}
      - {id: fr-11-savoir, type: vocab, l2: "savoir", l1: "to know (a fact, or how to do something)", ex: "Je sais parler français.", ex_l1: "I know how to speak French.", note: "je sais, tu sais, il sait, nous savons, vous savez, ils savent."}
      - {id: fr-11-voir, type: vocab, l2: "voir", l1: "to see", ex: "Je vois la gare.", ex_l1: "I can see the station.", note: "je vois, tu vois, il voit, nous voyons, vous voyez, ils voient."}
      - {id: fr-11-partir, type: vocab, l2: "partir", l1: "to leave / to go away", ex: "Le train part à six heures.", ex_l1: "The train leaves at six o'clock.", note: "je pars, tu pars, il part, nous partons, vous partez, ils partent."}
      - {id: fr-11-demain, type: vocab, l2: "demain", l1: "tomorrow", ex: "Demain, c'est dimanche.", ex_l1: "Tomorrow is Sunday.", note: "À demain ! = See you tomorrow!"}
      - {id: fr-11-maintenant, type: vocab, l2: "maintenant", l1: "now", ex: "Je suis à la maison maintenant.", ex_l1: "I am at home now."}
      - {id: fr-11-bientot, type: vocab, l2: "bientôt", l1: "soon", ex: "Nous arrivons bientôt.", ex_l1: "We are arriving soon."}
      - {id: fr-11-ce-soir, type: vocab, l2: "ce soir", l1: "tonight / this evening", ex: "Ce soir, je vais au cinéma.", ex_l1: "Tonight, I am going to the cinema."}
      - {id: fr-11-week-end, type: vocab, l2: "le week-end", l1: "the weekend", ex: "Le week-end, je ne travaille pas.", ex_l1: "At the weekend, I don't work.", note: "Borrowed from English, written with a hyphen."}
      - {id: fr-11-semaine-prochaine, type: vocab, l2: "la semaine prochaine", l1: "next week", ex: "Je vais à Paris la semaine prochaine.", ex_l1: "I am going to Paris next week.", note: "French keeps the article: 'the next week'."}
      - {id: fr-11-vacances, type: vocab, l2: "les vacances", l1: "the holidays / the vacation", ex: "Je suis en vacances.", ex_l1: "I am on holiday.", note: "Always plural, and feminine: les grandes vacances = the summer holidays."}
      - {id: fr-11-tu-fais-ce-week-end, type: phrase, l2: "Qu'est-ce que tu fais ce week-end ?", l1: "What are you doing this weekend? (to a friend)", alt: ["Tu fais quoi ce week-end ?", "Que fais-tu ce week-end ?"]}
      - {id: fr-11-pouvez-vous-m-aider, type: phrase, l2: "Pouvez-vous m'aider, s'il vous plaît ?", l1: "Can you help me, please? (formal)", alt: ["Vous pouvez m'aider, s'il vous plaît ?", "Est-ce que vous pouvez m'aider, s'il vous plaît ?", "Pourriez-vous m'aider, s'il vous plaît ?"], note: "m' = me, placed before the infinitive."}
      - {id: fr-11-je-dois-partir, type: phrase, l2: "Je dois partir.", l1: "I have to leave.", alt: ["Je dois y aller.", "Il faut que je parte."]}
      - {id: fr-11-il-faut-attendre, type: phrase, l2: "Il faut attendre.", l1: "You have to wait. (impersonal: it is necessary to wait)", alt: ["Il faut patienter."], note: "il faut + infinitive: an impersonal 'you / we have to'. It exists only with il."}
      - {id: fr-11-c1, type: cloze, text: "Qu'est-ce que vous ___ dans la vie ?", answer: "faites", l1: "What do you do for a living?", note: "faire → vous faites (never 'faisez')."}
      - {id: fr-11-c2, type: cloze, text: "Tu ___ venir ce soir ?", answer: "peux", l1: "Can you come tonight?", note: "pouvoir → tu peux, followed by an infinitive."}
      - {id: fr-11-c3, type: cloze, text: "Nous ___ le train à huit heures.", answer: "prenons", l1: "We take the train at eight o'clock.", note: "prendre → nous prenons (the d disappears in the plural)."}
      - {id: fr-11-c4, type: cloze, text: "Elle ___ de Lyon.", answer: "vient", l1: "She comes from Lyon.", note: "venir → il / elle vient. venir de = to come from."}
      - {id: fr-11-c5, type: cloze, text: "Les enfants ___ une glace.", answer: "veulent", l1: "The children want an ice cream.", note: "vouloir → ils veulent."}
      - {id: fr-11-c6, type: cloze, text: "Demain, je ___ visiter le musée.", answer: "vais", l1: "Tomorrow, I am going to visit the museum.", note: "Near future: aller (je vais) + infinitive."}
      - {id: fr-11-c7, type: cloze, text: "Ils ___ partir en vacances en août.", answer: "vont", l1: "They are going to go on holiday in August.", note: "Near future: ils vont + infinitive."}

  # ───────────────────────────────────────────────────────────────── 12
  - id: fr-12
    title: "Shopping, weather & what happened"
    goal: "I can shop and pay, talk about the weather, and say a few things I did yesterday."
    notes: |
      ## Weather
      Weather uses **il fait** + adjective: *il fait beau, il fait chaud, il fait froid*. Also *il pleut* (it's raining) and *il y a du soleil* (it's sunny). Never *c'est chaud* for the weather.

      ## The past: passé composé
      To say what happened, use two words: the present of **avoir** + a **past participle**.

      - *-er* verbs: *-er → -é*. *manger → j'ai mangé, acheter → j'ai acheté.* It sounds the same as the infinitive.
      - Learn these irregular participles: *faire → fait, prendre → pris, voir → vu, avoir → eu, être → été*.

      *J'ai mangé* means both "I ate" and "I have eaten".

      ## A few verbs take être
      Verbs of coming and going use **être** instead: *aller, venir, arriver, partir*.

      - *Je suis allé à Paris.* — I went to Paris.
      - The participle then agrees with the subject, like an adjective: *elle est allée*, *ils sont allés*.

      ## Negative
      *ne … pas* goes around the first verb: Je **n'ai pas** mangé.

      Time words: *hier* (yesterday), *hier soir* (last night), *la semaine dernière* (last week).
    items:
      - {id: fr-12-magasin, type: vocab, l2: "le magasin", l1: "the shop / the store", alt: ["la boutique"], ex: "Il y a un magasin près de l'hôtel.", ex_l1: "There is a shop near the hotel.", note: "False friend: a magazine is un magazine."}
      - {id: fr-12-acheter, type: vocab, l2: "acheter", l1: "to buy", ex: "Je vais acheter du pain.", ex_l1: "I am going to buy some bread.", note: "Takes a grave accent when the ending is silent: j'achète, but nous achetons."}
      - {id: fr-12-payer, type: vocab, l2: "payer", l1: "to pay", ex: "Je voudrais payer, s'il vous plaît.", ex_l1: "I would like to pay, please.", note: "No preposition for what you buy: payer le café = to pay FOR the coffee."}
      - {id: fr-12-argent, type: vocab, l2: "l'argent", l1: "the money", ex: "Je n'ai pas d'argent.", ex_l1: "I don't have any money.", note: "masculine. It also means 'silver'."}
      - {id: fr-12-prix, type: vocab, l2: "le prix", l1: "the price", ex: "Quel est le prix ?", ex_l1: "What is the price?", note: "The x is silent: 'pree'. Same form in the plural. Also means 'prize'."}
      - {id: fr-12-cher, type: vocab, l2: "cher", l1: "expensive (masculine)", ex: "Ce restaurant est très cher.", ex_l1: "This restaurant is very expensive.", note: "Feminine: chère. C'est trop cher = it's too expensive."}
      - {id: fr-12-hier, type: vocab, l2: "hier", l1: "yesterday", ex: "Hier, j'ai travaillé.", ex_l1: "Yesterday, I worked.", note: "Silent h: 'ee-air'."}
      - {id: fr-12-temps, type: vocab, l2: "le temps", l1: "the weather / time (in general)", ex: "Le temps est mauvais aujourd'hui.", ex_l1: "The weather is bad today.", note: "The p and s are silent. For clock time use l'heure, not le temps."}
      - {id: fr-12-soleil, type: vocab, l2: "le soleil", l1: "the sun", ex: "Il y a du soleil aujourd'hui.", ex_l1: "It is sunny today.", note: "-eil sounds like 'ay-y': 'so-lay-y'."}
      - {id: fr-12-pluie, type: vocab, l2: "la pluie", l1: "the rain", ex: "Je n'aime pas la pluie.", ex_l1: "I don't like the rain.", note: "The verb: il pleut = it is raining."}
      - {id: fr-12-chaud, type: vocab, l2: "chaud", l1: "hot / warm (masculine)", ex: "Il fait chaud en août.", ex_l1: "It is hot in August.", note: "Feminine: chaude. For a person say j'ai chaud, never je suis chaud."}
      - {id: fr-12-froid, type: vocab, l2: "froid", l1: "cold (masculine)", ex: "Il fait froid aujourd'hui.", ex_l1: "It is cold today.", note: "Feminine: froide. For a person: j'ai froid."}
      - {id: fr-12-ouvert, type: vocab, l2: "ouvert", l1: "open (masculine)", ex: "Le musée est ouvert.", ex_l1: "The museum is open.", note: "Feminine: ouverte."}
      - {id: fr-12-ferme, type: vocab, l2: "fermé", l1: "closed (masculine)", ex: "Le magasin est fermé le lundi.", ex_l1: "The shop is closed on Mondays.", note: "Feminine: fermée (same sound)."}
      - {id: fr-12-combien-ca-coute, type: phrase, l2: "Combien ça coûte ?", l1: "How much does it cost?", alt: ["Ça coûte combien ?", "C'est combien ?", "Combien est-ce que ça coûte ?", "Combien coûte-t-il ?", "Combien cela coûte-t-il ?", "Ça fait combien ?"], note: "Point at the item and ask. Shorter still: C'est combien ?"}
      - {id: fr-12-quel-temps, type: phrase, l2: "Quel temps fait-il ?", l1: "What is the weather like?", alt: ["Il fait quel temps ?", "Quel temps il fait ?", "Quel temps fait-il aujourd'hui ?"], note: "Weather uses faire: literally 'What weather does it make?'"}
      - {id: fr-12-il-fait-beau, type: phrase, l2: "Il fait beau.", l1: "The weather is nice.", alt: ["Il fait bon.", "Il fait beau aujourd'hui."], note: "il fait + adjective for weather: il fait beau / mauvais / chaud / froid."}
      - {id: fr-12-payer-par-carte, type: phrase, l2: "Je peux payer par carte ?", l1: "Can I pay by card?", alt: ["Est-ce que je peux payer par carte ?", "Puis-je payer par carte ?", "Je peux payer par carte bancaire ?", "Je peux payer avec la carte ?"]}
      - {id: fr-12-pouvez-vous-repeter, type: phrase, l2: "Pouvez-vous répéter, s'il vous plaît ?", l1: "Can you repeat, please? (formal)", alt: ["Vous pouvez répéter, s'il vous plaît ?", "Est-ce que vous pouvez répéter, s'il vous plaît ?", "Pourriez-vous répéter, s'il vous plaît ?", "Répétez, s'il vous plaît."], note: "The single most useful sentence for a beginner. Add 'plus lentement' for 'more slowly'."}
      - {id: fr-12-c1, type: cloze, text: "Hier, j'ai ___ un livre.", answer: "acheté", l1: "Yesterday, I bought a book.", note: "Passé composé: avoir + past participle. -er → -é."}
      - {id: fr-12-c2, type: cloze, text: "Nous ___ mangé au restaurant.", answer: "avons", l1: "We ate at the restaurant.", note: "Most verbs build the past with avoir: nous avons mangé."}
      - {id: fr-12-c3, type: cloze, text: "Elle ___ allée à Paris.", answer: "est", l1: "She went to Paris.", note: "aller takes être in the past, and the participle agrees: allée."}
      - {id: fr-12-c4, type: cloze, text: "Tu as ___ le film ?", answer: "vu", alt: ["regardé"], l1: "Did you see the film?", note: "Irregular past participle: voir → vu."}
      - {id: fr-12-c5, type: cloze, text: "Je ___ arrivé hier.", answer: "suis", l1: "I arrived yesterday.", note: "arriver takes être: je suis arrivé (a woman writes arrivée)."}
      - {id: fr-12-c6, type: cloze, text: "Qu'est-ce que tu as ___ hier ?", answer: "fait", l1: "What did you do yesterday?", note: "Irregular past participle: faire → fait."}
      - {id: fr-12-c7, type: cloze, text: "Ils ont ___ le train.", answer: "pris", l1: "They took the train.", note: "Irregular past participle: prendre → pris."}
