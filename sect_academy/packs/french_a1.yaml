      - {id: fr-08-c1, type: cloze, text: "Je voudrais ___ pain, s'il vous plaît.", answer: "du", l1: "I would like some bread, please.", note: "Partitive, masculine: de + le = du."}
      - {id: fr-08-c2, type: cloze, text: "Vous voulez de ___ salade ?", answer: "la", l1: "Do you want some salad?", note: "Partitive, feminine: de la."}
      - {id: fr-08-c3, type: cloze, text: "Je mange ___ légumes tous les jours.", answer: "des", l1: "I eat vegetables every day.", note: "Plural 'some': des. English often leaves it out."}
