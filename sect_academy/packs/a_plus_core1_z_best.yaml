# CompTIA A+ Core 1 (220-1201) - best-answer practice bank (BEST / MOST / FIRST / LEAST).
# Every choice is something a working technician might do; the stem supplies the deciding constraint.
# Original content written against the public exam objectives.
part_of: a-plus-core1

units:
  - id: ap1-1z
    title: "Best-answer practice: Mobile Devices"
    domain: "1"
    goal: "I can pick the best part, accessory or mobile setting for a user's stated need when every option on offer would work."
    notes: |
      Domain 1 best-answer questions give four fixes that would all do something useful for a laptop or phone user. The stem decides between them, so look for **the need the user actually stated** and pick the option that meets it in full with the least cost or disruption.

      **Constraints to look for**

      | Clue in the stem | What it decides |
      | "cheapest", "within budget" | The smallest part that meets the need, not a new device |
      | "nothing extra to carry", "on the move" | A built-in part beats a dongle or a power bank |
      | "works for other users", "worked yesterday" | Check the simple, local thing first |
      | "offline", "no signal on site" | Rule out anything that needs a network |
      | "company-owned" vs "personal" | How much control MDM may take |

      **Usual traps**

      - Replacing the whole laptop when one field-replaceable part fixes it.
      - Choosing an accessory that works at the desk when the user needs it on the road.
      - Re-pairing or reinstalling before checking a battery, a setting or a dirty sensor.

    items:
      - id: ap1-1z-b01
        type: mcq
        best: true
        q: "A data analyst's laptop has 8GB of memory soldered to the board and one empty SODIMM slot that accepts up to 16GB of DDR4-3200. Her models use about 18GB, and the laptop is otherwise fast enough. Which is the BEST way to meet her need at the lowest cost?"
        choices:
          - "Fit an 8GB DDR4-3200 SODIMM in the empty slot"
          - "Fit a 16GB DDR4-3200 SODIMM in the empty slot"
          - "Replace the laptop with a model that has 32GB of memory"
          - "Replace the SATA SSD with a faster NVMe SSD so paging is quicker"
        answer: 1
        why: "8GB soldered plus a 16GB module gives 24GB, enough for an 18GB workload, using a part the laptop already accepts."
        whys:
          - "Cheaper, but 16GB in total is still less than the 18GB she uses, so the laptop keeps paging."
          - "Best: it brings the total to 24GB, clears the 18GB need and costs only one module."
          - "Meets the need, but replaces a working laptop when a single module would do."
          - "Makes paging less painful, but she still runs short of memory; it treats the symptom."

      - id: ap1-1z-b02
        type: mcq
        best: true
        q: "A sales rep's three-year-old laptop gave six hours on battery when new, which is all she needs. Its battery report now shows 48% of design capacity and about 90 minutes of use. The battery is a user-replaceable part. Which is the BEST fix?"
        choices:
          - "Give her a USB-C power bank to carry"
          - "Turn on the operating system's battery-saver mode"
          - "Fit a new manufacturer's battery"
          - "Replace the laptop with a newer model"
        answer: 2
        why: "The cells have worn out; a new battery restores the six hours she needs at the cost of one part."
        whys:
          - "Adds runtime, but she must carry and charge another device, and the worn battery keeps declining."
          - "Stretches what is left a little, but cannot turn 90 minutes back into six hours."
          - "Best: it replaces the worn part and restores the original runtime at modest cost."
          - "Solves it, but discards a working laptop to fix one replaceable part."

      - id: ap1-1z-b03
        type: mcq
        best: true
        q: "A user's Bluetooth mouse worked yesterday but today the pointer does not move. Her Bluetooth headset still works with the same laptop. What should the technician do FIRST?"
        choices:
          - "Remove the mouse from the paired devices list and pair it again"
          - "Update the laptop's Bluetooth driver"
          - "Replace the mouse with a new one"
          - "Check the mouse's power switch and battery"
        answer: 3
        why: "The headset proves the laptop's Bluetooth works, so the quickest likely cause is the mouse itself having no power."
        whys:
          - "A reasonable later step, but it takes longer and will not help if the mouse has no power."
          - "The working headset already shows the laptop's Bluetooth stack is fine."
          - "May be needed in the end, but buys a part before a free check."
          - "Best: the laptop side is proven good, and a flat battery or switched-off mouse is the cheapest cause to rule out."

      - id: ap1-1z-b04
        type: mcq
        best: true
        q: "A company is ordering new laptops for field engineers who need internet all day at customer sites. Policy forbids joining customers' Wi-Fi, and the engineers complain that tethering drains their phones by midday. They want nothing extra to carry or charge. Which option is BEST?"
        choices:
          - "Order the laptop model with a built-in 5G modem and an eSIM data plan"
          - "Issue each engineer a portable mobile hotspot device"
          - "Issue USB-C cables so they can tether by cable, which also charges the phone"
          - "Issue each engineer a high-capacity power bank for the phone"
        answer: 0
        why: "A built-in cellular modem gives the laptop its own connection with no extra device and no load on the phone."
        whys:
          - "Best: the connection is part of the laptop, so there is nothing more to carry, charge or forget."
          - "Works well, but it is another device to carry and keep charged."
          - "Keeps the phone charged, but it ties the phone to the laptop by a cable all day."
          - "Keeps tethering going, but adds a device to carry and charge."

      - id: ap1-1z-b05
        type: mcq
        best: true
        q: "A laptop's fingerprint reader rejects one user every time, although two colleagues who share the laptop sign in with it without trouble. She recently had a cut on the enrolled finger. What should the technician do FIRST?"
        choices:
          - "Replace the fingerprint reader"
          - "Update the fingerprint reader's driver"
          - "Delete and re-enrol her fingerprint"
          - "Switch her to PIN sign-in permanently"
        answer: 2
        why: "The reader works for others, so the fault is her stored print; re-enrolling it is quick and free."
        whys:
          - "Other users prove the hardware works; replacing it would change nothing for her."
          - "The driver serves every user, and it works for two of them."
          - "Best: the scar changed her print, and a new enrolment matches the finger as it is now."
          - "Gets her in, but gives up biometrics when a two-minute fix would keep them."

      - id: ap1-1z-b06
        type: mcq
        best: true
        q: "A week after a coffee spill, three keys on a laptop no longer respond; everything else works. On this model the keyboard is a separate part held by screws under the bottom panel. The business wants a permanent fix at the lowest cost. Which is BEST?"
        choices:
          - "Replace the whole top-case assembly, which includes the keyboard"
          - "Replace the keyboard"
          - "Give the user an external USB keyboard to use from now on"
          - "Replace the laptop"
        answer: 1
        why: "The damaged part is the keyboard, and it can be swapped on its own for the price of one part."
        whys:
          - "Fixes it, but pays for a palm rest and trackpad that are not damaged."
          - "Best: it replaces only the failed part, permanently, at the lowest cost."
          - "Cheap, but the laptop stays faulty and the user must carry a keyboard."
          - "Fixes it, but at many times the cost of one part."

      - id: ap1-1z-b07
        type: mcq
        best: true
        q: "A consultant's laptop has a full 256GB M.2 SSD in its only drive slot. She works on flights and at sites with no connection, and needs about 600GB of files with her at all times. Which is the BEST solution?"
        choices:
          - "Move the older files to a cloud storage service, downloaded on demand"
          - "Give her a 1TB external USB SSD"
          - "Add a 512GB microSD card in the laptop's card reader"
          - "Clone the drive to a 1TB M.2 SSD and fit it in the slot"
        answer: 3
        why: "A larger internal drive keeps all the files inside the laptop, available offline, with nothing to carry."
        whys:
          - "Frees space, but on-demand files are not there when she has no connection."
          - "Holds everything, but it is a separate device she must carry and can lose or forget."
          - "Built in, but too small for 600GB and much slower than an SSD."
          - "Best: all 600GB is always inside the laptop, fast and available offline."

      - id: ap1-1z-b08
        type: mcq
        best: true
        q: "An executive uses her laptop's webcam for calls every day, but wants a visible guarantee that the camera cannot see her the rest of the time. Which is the BEST way to give her that?"
        choices:
          - "Fit a sliding physical privacy shutter over the lens"
          - "Disable the camera in the operating system's privacy settings"
          - "Disable the camera in the UEFI firmware settings"
          - "Rely on the camera's activity light"
        answer: 0
        why: "A shutter blocks the lens physically, can be seen at a glance, and opens in a second for calls."
        whys:
          - "Best: a closed shutter is a physical, visible guarantee, and she can open it for each call."
          - "Hides the camera from apps, but software settings can be changed and give no visible proof."
          - "Blocks the camera completely, but she would have to restart into the firmware before every call."
          - "Shows when the camera is on, but only tells her afterwards; it does not prevent anything."

      - id: ap1-1z-b09
        type: mcq
        best: true
        q: "The office is moving to 6GHz Wi-Fi. A user's laptop has a Wi-Fi 5 card on a removable M.2 module and walks between meeting rooms all day; she wants nothing sticking out of the laptop. Which is the BEST way to give it 6GHz?"
        choices:
          - "Plug in a USB Wi-Fi 6E adapter"
          - "Connect it to a USB Ethernet dongle at her desk"
          - "Fit a supported internal Wi-Fi 6E M.2 card"
          - "Leave the card and have her join the office's 5GHz network"
        answer: 2
        why: "A supported internal 6E card adds the 6GHz band with nothing external, and uses the laptop's own antennas."
        whys:
          - "Adds 6GHz, but sticks out of the laptop and is easy to knock or lose."
          - "Fast at the desk, but gives nothing in the meeting rooms she moves between."
          - "Best: it adds 6GHz inside the laptop, and choosing a supported part avoids firmware compatibility problems."
          - "Keeps her connected, but does not give the 6GHz access the office is moving to."

      - id: ap1-1z-b10
        type: mcq
        best: true
        q: "Staff hot-desk with a mix of laptop brands, all with USB-C ports that support DisplayPort Alt Mode and USB Power Delivery. IT wants one model of desk device for every desk that gives two monitors, wired network and charging over one cable. Which is BEST?"
        choices:
          - "A different manufacturer's proprietary dock for each laptop brand"
          - "A universal USB-C docking station with Power Delivery and two display outputs"
          - "A USB-C port replicator that passes video and USB but has no power delivery"
          - "Separate cables at each desk for the charger, the network and both of the monitors"
        answer: 1
        why: "A standards-based USB-C dock works with every brand's USB-C port and does charging, video and network over one cable."
        whys:
          - "Works, but breaks the single-model requirement and fails when someone sits at another brand's desk."
          - "Best: one model serves every brand, with charging, two displays and network over one cable."
          - "Video and peripherals work, but the laptop still needs its own charger plugged in."
          - "Works with anything, but is several cables, not one."

      - id: ap1-1z-b11
        type: mcq
        best: true
        q: "A company is buying 40 phones for delivery drivers. Each phone must arrive with work apps and security policies applied the first time the driver switches it on, without a technician handling it. Which approach is BEST?"
        choices:
          - "Have a technician unbox and configure each phone before it is handed out"
          - "Send drivers instructions to install the MDM app themselves"
          - "Use the MDM's automatic enrolment for corporate-owned phones"
          - "Issue the phones bare and push apps later by email link"
        answer: 2
        why: "Automatic corporate enrolment ties each purchased phone to the MDM, so it configures itself on first start."
        whys:
          - "Gives the right result, but needs a technician to touch every phone, which the stem rules out."
          - "Suits personal BYOD phones, but depends on each driver and leaves phones unmanaged until they act."
          - "Best: company-owned phones enrol and receive apps and policies on first power-up, with no hands-on work."
          - "Leaves phones unmanaged and relies on drivers following links."

      - id: ap1-1z-b12
        type: mcq
        best: true
        q: "A survey app must record where field staff stand to within a few metres. Much of the work is outdoors in hills with no cellular signal and no Wi-Fi. Which location source should the app rely on MOST?"
        choices:
          - "The device's GPS receiver"
          - "Cellular tower positioning"
          - "Wi-Fi network positioning"
          - "Staff typing in a grid reference by hand"
        answer: 0
        why: "GPS works from satellites alone and gives metre-level accuracy outdoors, with no network needed."
        whys:
          - "Best: satellite positioning needs no network and is accurate to a few metres under open sky."
          - "Works without GPS, but needs a signal and is accurate to hundreds of metres at best."
          - "Accurate in towns, but needs nearby known Wi-Fi networks, which the hills lack."
          - "Possible, but slow and prone to typing errors when a receiver does it automatically."

  - id: ap1-2z
    title: "Best-answer practice: Networking"
    domain: "2"
    goal: "I can pick the best protocol, server role, device, address plan or connection type when every option on offer would work."
    notes: |
      Domain 2 best-answer questions give four network choices that all function. The stem names the requirement that only one meets in full: encryption, scale, cost, or who has to do the work.

      **Constraints to look for**

      | Clue in the stem | What it decides |
      | "encrypted", "policy forbids cleartext" | SSH, HTTPS or a VPN, not Telnet, HTTP or an open port |
      | "every device", "one place" | A central service (DNS, NTP, AAA, DHCP option) beats per-device edits |
      | "cheapest", "small office" | The simplest device that does the job |
      | "nobody has to start anything" | Site-to-site rather than client VPN |
      | "block-level", "latency", "upload" | The technology that meets that number |

      **Usual traps**

      - Choosing the most capable appliance when the stem asked for the cheapest.
      - Fixing every PC by hand when one server setting reaches them all.
      - Exposing a service to the internet with a strong password when a VPN keeps it closed.

      Ask "what does only one of these do?" before you choose.
    items:
      - id: ap1-2z-b01
        type: mcq
        best: true
        q: "An administrator must change settings on twenty branch switches from the head office. Policy forbids sending administrator logins across the network in cleartext, and the work is done at the command line. Which access method is BEST?"
        choices:
          - "SSH to each switch"
          - "Telnet, restricted to a management VLAN"
          - "Remote Desktop to a PC at each branch, then a console cable"
          - "Drive to each branch and use the console port"
        answer: 0
        why: "SSH gives an encrypted command-line session from anywhere, which meets the policy without travel."
        whys:
          - "Best: encrypted remote command-line access to every switch from one desk."
          - "Limits who can see it, but Telnet still sends the login in cleartext, which the policy forbids."
          - "Works, but needs a PC and a cable fitted at every branch and adds a hop to manage."
          - "Secure, but takes days of travel for routine remote work."

      - id: ap1-2z-b02
        type: mcq
        best: true
        q: "After a security incident, the logs from the firewall, switches and servers cannot be lined up because each device's clock says something different, by up to several minutes. Which is the BEST fix for the future?"
        choices:
          - "Set every device's clock by hand to match the firewall"
          - "Replace the CMOS batteries in the servers"
          - "Have the syslog server stamp each message with its own time of arrival"
          - "Point every device at the same NTP server"
        answer: 3
        why: "NTP keeps every clock synchronised continuously, so all logs share one time base."
        whys:
          - "Aligns them today, but clocks drift apart again within weeks."
          - "Helps clocks survive power loss, but does not keep running clocks in step."
          - "Helps for syslog, but local logs and devices that buffer messages still disagree."
          - "Best: one time source keeps every clock in step automatically, now and later."

      - id: ap1-2z-b03
        type: mcq
        best: true
        q: "Six network administrators share one administrator password on forty switches. After an outage nobody could tell who had made a change. Management wants each person to sign in as themselves and wants changes recorded. Which is the BEST solution?"
        choices:
          - "Change the shared password every month"
          - "Create six local accounts on each of the forty switches"
          - "Keep a paper change log beside the rack"
          - "Use a central AAA server with one account per admin"
        answer: 3
        why: "AAA authenticates each person centrally and records what they did, across every switch at once."
        whys:
          - "Limits exposure of the password, but everyone still signs in as the same user."
          - "Gives individual sign-ins, but 240 accounts to keep in step, with no central record."
          - "Depends on people writing things down; it does not stop anyone from skipping it."
          - "Best: one account per person, managed centrally, with accounting of their actions."

      - id: ap1-2z-b04
        type: mcq
        best: true
        q: "A 25-person firm has no full-time IT staff. It wants firewalling, gateway antivirus, intrusion prevention and web content filtering, managed from one console. Which is the BEST choice?"
        choices:
          - "A unified threat management (UTM) appliance"
          - "A separate firewall, intrusion prevention system and filtering proxy"
          - "A proxy server for content filtering behind the ISP router"
          - "Antivirus software on each PC"
        answer: 0
        why: "A UTM combines all four functions in one box with one console, which suits a firm without IT staff."
        whys:
          - "Best: every required function in one appliance with one place to manage it."
          - "Gives all the functions, but three devices to buy, update and manage."
          - "Filters web content, but provides no firewall policy or intrusion prevention of its own."
          - "Protects each PC, but gives no network firewall, intrusion prevention or central filtering."

      - id: ap1-2z-b05
        type: mcq
        best: true
        q: "An office has smart TVs and thermostats on the same network as its PCs. The vendor has stopped issuing firmware, and the devices must keep working. Which is the BEST way to reduce the risk they pose to the PCs?"
        choices:
          - "Remove the devices from the network"
          - "Isolate the devices on their own VLAN"
          - "Turn off UPnP on the router"
          - "Check the vendor's site monthly for new firmware"
        answer: 1
        why: "Segmentation keeps working-but-unpatchable devices away from the PCs, which is the realistic control here."
        whys:
          - "Removes the risk, but the devices must keep working."
          - "Best: the devices keep working while a compromised one cannot reach the PCs."
          - "Removes one route for devices to open ports, but leaves them able to reach the PCs."
          - "The vendor has stopped issuing firmware, so there will be nothing to install."

      - id: ap1-2z-b06
        type: mcq
        best: true
        q: "A company's website is hosted by a provider whose server address changes a few times a year. The company wants www.example.com to keep pointing at it without anyone editing DNS each time. The provider publishes a stable host name for the site. Which record is BEST for www?"
        choices:
          - "A CNAME record pointing to the provider's host name"
          - "An A record with the server's current IPv4 address"
          - "An AAAA record with the server's current IPv6 address"
          - "A TXT record with the provider's address in it"
        answer: 0
        why: "A CNAME follows the provider's name, so address changes on the provider's side need no edit by the company."
        whys:
          - "Best: the alias follows the provider's own record, so it stays right automatically."
          - "Works today, but must be edited every time the provider changes the address."
          - "Works for IPv6 clients, but has the same manual-update problem as an A record."
          - "TXT records carry text such as SPF, not addresses that browsers look up."

      - id: ap1-2z-b07
        type: mcq
        best: true
        q: "A firm runs its own mail server and has a second mail server at another site. If the main server is down, incoming mail must still be accepted. Which DNS change is BEST?"
        choices:
          - "Add a second MX record for the backup server with a higher preference number"
          - "Add a second A record so the mail host name round-robins between both servers"
          - "Add a CNAME that points the mail host name at the backup server"
          - "Lower the TTL so the MX record can be changed quickly in an outage"
        answer: 0
        why: "Sending servers try MX records in preference order, so the backup receives mail only when the main one is unreachable."
        whys:
          - "Best: senders fall back to it automatically when the main server does not answer."
          - "Spreads mail across both all the time, not only when the main server fails."
          - "Sends all mail to the backup, not just when the main one is down."
          - "Speeds up a manual change, but still needs someone to make it during the outage."

      - id: ap1-2z-b08
        type: mcq
        best: true
        q: "A business has two offices, each with broadband and a router that supports VPNs. Staff in both must reach each other's file servers all day without starting anything on their PCs, at the lowest cost. Which is BEST?"
        choices:
          - "A client VPN on every PC"
          - "A leased private line between the offices"
          - "A site-to-site VPN between the two routers"
          - "A cloud file-sync service for the shared folders"
        answer: 2
        why: "A router-to-router VPN joins the two networks permanently over the existing broadband, with nothing for users to start."
        whys:
          - "Secure, but each user must launch it, and every PC needs set-up."
          - "Works and is private, but costs far more than a VPN over existing broadband."
          - "Best: always on, invisible to users, and uses the broadband and routers already there."
          - "Shares files, but changes how staff work and does not give access to the servers themselves."

      - id: ap1-2z-b09
        type: mcq
        best: true
        q: "A home office needs six more wired ports for a PC, printer and some media devices. There are no VLAN or monitoring needs, and the owner wants the cheapest device that does the job. Which is BEST?"
        choices:
          - "An eight-port managed switch"
          - "An eight-port PoE managed switch"
          - "A second router with a four-port switch"
          - "An eight-port unmanaged switch"
        answer: 3
        why: "An unmanaged switch adds ports with no configuration, and nothing in the stem needs management features."
        whys:
          - "Works, but costs more for VLAN and monitoring features nobody will use."
          - "Works, but pays for power the devices do not need and management features nobody will use."
          - "Adds ports, but has too few and risks a second NAT layer if wired wrongly."
          - "Best: the cheapest device that adds the ports, with nothing to configure."

      - id: ap1-2z-b10
        type: mcq
        best: true
        q: "A user's VPN connects from home, but she cannot reach any office server. Her home router and the office both use 192.168.1.0/24. She owns her home router, and the office network serves 300 people. Which is the BEST fix?"
        choices:
          - "Renumber the office network to a different range"
          - "Move her home LAN to another range, e.g. 192.168.77.0/24"
          - "Add a route for each office server on her laptop every time she connects"
          - "Give her a web-based remote desktop gateway instead of the VPN"
        answer: 1
        why: "The overlap is the fault; changing the one home network removes it with no effect on anyone else."
        whys:
          - "Removes the overlap too, but disrupts 300 people to fix one home network."
          - "Best: removes the address clash on a device she controls, in minutes."
          - "Can work, but is fragile and must be repeated on every connection."
          - "Avoids the clash, but replaces her whole way of working instead of fixing the cause."

      - id: ap1-2z-b11
        type: mcq
        best: true
        q: "A construction firm needs internet in a site office from next week for six months. There is no cable, DSL or fiber, but every phone on site shows a strong 5G signal. Which connection is BEST?"
        choices:
          - "Order a fiber line to the site"
          - "Staff tether their laptops to their own phones"
          - "A satellite service with a dish on the site office roof"
          - "A 5G cellular router with a business data plan"
        answer: 3
        why: "Strong 5G is already there, so a cellular router gives a proper shared connection in days with no installation."
        whys:
          - "Fast, but a new fiber line takes far longer than a week and is wasted after six months."
          - "Works for a day, but drains personal phones and plans and gives no shared office network."
          - "Works with no ground infrastructure, but needs a dish fitted and usually costs more when good 5G is available."
          - "Best: quick to set up, no digging or dish, and uses the strong signal already on site."

      - id: ap1-2z-b12
        type: mcq
        best: true
        q: "Two virtualisation hosts must share storage so that a virtual machine can restart on the other host if one fails. The hypervisor needs block-level access to the shared disks. Which is the BEST choice?"
        choices:
          - "A NAS sharing a folder over SMB"
          - "A RAID 1 pair inside each host"
          - "A storage area network (SAN)"
          - "Nightly copies of the VM files to cloud storage"
        answer: 2
        why: "A SAN presents shared block storage to both hosts, which is what failover between them needs."
        whys:
          - "Shares files, but SMB is file-level, not the block-level access the stem requires."
          - "Protects each host's disks, but neither host can see the other's storage."
          - "Best: both hosts see the same block-level disks, so either can run any VM."
          - "A useful backup, but a day out of date and far too slow for failover."

      - id: ap1-2z-b13
        type: mcq
        best: true
        q: "A PC has no network link. The technician has already proved the patch cable good with a cable tester. Which tool is BEST for checking whether the PC's own network port works?"
        choices:
          - "A toner probe"
          - "A loopback plug"
          - "A Wi-Fi analyzer"
          - "A punchdown tool"
        answer: 1
        why: "A loopback plug feeds the port's transmit pins back to its receive pins, testing the port on its own."
        whys:
          - "Traces cables through walls, but says nothing about whether the PC's port works."
          - "Best: it tests the network port alone, with the cable and switch taken out of the picture."
          - "Measures wireless signals, not a wired port."
          - "Terminates wires at a jack or panel; it does not test anything."

      - id: ap1-2z-b14
        type: mcq
        best: true
        q: "A warehouse with tall metal shelving is getting its first two access points. The manager wants good coverage in every aisle and does not want to move them after they are bolted to the ceiling. What should the technician do FIRST?"
        choices:
          - "Mount them in the two corners nearest the network closet"
          - "Set both access points to maximum transmit power"
          - "Do a site survey with a Wi-Fi analyzer"
          - "Buy a third access point in case coverage is short"
        answer: 2
        why: "Metal shelving blocks and reflects signal unpredictably, so a survey finds positions that work before anything is fixed in place."
        whys:
          - "Shortest cable runs, but may leave far aisles uncovered behind the metal shelving."
          - "Louder access points may not reach behind metal, and clients still have to reply."
          - "Best: it measures real coverage among the shelves and fixes the positions before mounting."
          - "Spends money before anyone knows whether it is needed."

      - id: ap1-2z-b15
        type: mcq
        best: true
        q: "A technician has a crimper, a spool of Cat 6 and a bag of plugs. Tomorrow a new rack needs forty patch cables of standard lengths, and they must all pass at gigabit speed first time. Which is the BEST approach?"
        choices:
          - "Crimp the forty cables tonight and test each with a cable tester"
          - "Buy forty factory-made Cat 6 patch cables"
          - "Crimp the cables and fix any failures after the rack goes live"
          - "Reuse patch cables from a decommissioned rack"
        answer: 1
        why: "Factory-made cables are consistent and tested, saving hours of work for standard lengths."
        whys:
          - "Works, but takes most of a night, and hand-made plugs fail more often than moulded ones."
          - "Best: reliable, tested cables in standard lengths with no labour."
          - "Saves time tonight, but risks failures in a live rack, against the stated requirement."
          - "Cheap, but their category and condition are unknown."

      - id: ap1-2z-b16
        type: mcq
        best: true
        q: "Staff working from home need to reach their office PCs by Remote Desktop. Someone proposes forwarding TCP 3389 from the internet to the PCs. The office firewall supports a client VPN. Which is the BEST approach?"
        choices:
          - "Forward 3389, and require long passwords on the PCs"
          - "Forward Remote Desktop on a non-standard port number instead of 3389"
          - "Forward 3389 only from each user's home IP address"
          - "Keep 3389 closed and require the VPN first"
        answer: 3
        why: "Through the VPN, Remote Desktop is never exposed to internet-wide scanning and password guessing."
        whys:
          - "Helps, but the service is still reachable by anyone on the internet."
          - "Cuts casual scanning, but a port scan finds it quickly; it hides rather than protects."
          - "Narrows exposure, but home addresses change, and anyone on a listed address still reaches it."
          - "Best: nothing is exposed, and only authenticated VPN users can reach the PCs."

      - id: ap1-2z-b17
        type: mcq
        best: true
        q: "An office of 30 PCs reaches its file server only by IP address, because staff cannot open it by name. The PCs use the ISP's DNS servers. The office has a Windows server that can run DNS. Which is the BEST fix?"
        choices:
          - "Add the file server's name to the hosts file on every PC"
          - "Tell staff to keep using the IP address"
          - "Run internal DNS with an A record for the server"
          - "Ask the ISP to add the file server's private address to its DNS"
        answer: 2
        why: "An internal DNS server resolves local names for every PC from one place, and grows with the office."
        whys:
          - "Works, but thirty files to edit, and every one goes stale when an address changes."
          - "Works, but does not fix anything and breaks if the address changes."
          - "Best: one central record serves every PC, and new names are added in one place."
          - "Publishes a private address publicly, and few ISPs will maintain a customer's internal names."

      - id: ap1-2z-b18
        type: mcq
        best: true
        q: "An office of 80 PCs that receive their addresses by DHCP must start using a new DNS server address by tomorrow. Which approach is BEST?"
        choices:
          - "Change the DNS option in the DHCP scope"
          - "Visit each PC and type in the new DNS address"
          - "Send staff instructions to change the setting themselves"
          - "Set every PC to a static address that includes the new DNS server"
        answer: 0
        why: "One change to the scope reaches every DHCP client automatically when it renews or restarts."
        whys:
          - "Best: one central change reaches all eighty PCs with no visits."
          - "Works, but eighty visits, and the hand-typed setting overrides DHCP from then on."
          - "Relies on staff with admin rights and accuracy; many will not do it."
          - "Gives up DHCP for the whole office to change one setting."

      - id: ap1-2z-b19
        type: mcq
        best: true
        q: "A home user's ISP supplies a combined cable modem and router. He buys his own router for its better features and wants to avoid two layers of address translation. Which setup is BEST?"
        choices:
          - "Plug the new router into a LAN port of the ISP box and use both as routers"
          - "Put the ISP box into bridge (modem-only) mode and connect the new router to it"
          - "Turn off only the Wi-Fi on the ISP box"
          - "Return the ISP box and buy a retail cable modem without checking the provider's approved list"
        answer: 1
        why: "Bridge mode makes the ISP box a plain modem, so the new router alone does routing and NAT."
        whys:
          - "Usually works, but creates the double NAT he wants to avoid."
          - "Best: one router, one NAT layer, and the ISP's modem still connects to the cable network."
          - "Removes duplicate Wi-Fi, but the ISP box still routes and translates, so NAT is still doubled."
          - "Could work, but the provider may refuse to activate a modem that is not on its list."

      - id: ap1-2z-b20
        type: mcq
        best: true
        q: "A remote lodge has a weak cellular signal and no wired service. Its main need is video calls with guests' families, and it can choose between two satellite plans of the same speed. Which is BEST?"
        choices:
          - "A low-Earth-orbit (LEO) satellite service"
          - "A geostationary satellite service, because one dish never needs to track"
          - "A cellular router with an external antenna"
          - "A geostationary service with a larger dish"
        answer: 0
        why: "LEO satellites orbit close to Earth, giving latency low enough for smooth video calls."
        whys:
          - "Best: its low latency suits live calls, which are the lodge's main need."
          - "Simple and proven, but the round trip of over 500 ms makes calls awkward."
          - "Might help, but the signal there is weak, and the choice offered is between satellite plans."
          - "A bigger dish improves signal, not the distance to the satellite, so latency stays high."

      - id: ap1-2z-b21
        type: mcq
        best: true
        q: "Ten staff keep work files on their own desktops. The owner wants one central place with per-folder permissions and nightly backups, and work must continue when the internet is down. Which is BEST?"
        choices:
          - "A cloud file-sharing service"
          - "Each user backs up their desktop to a USB drive"
          - "Email files to each other as needed"
          - "A NAS with shared folders on the office LAN"
        answer: 3
        why: "A local file share gives central storage, permissions and backups, and works with no internet."
        whys:
          - "Central and backed up, but access depends on the internet connection."
          - "Protects files, but leaves them scattered across ten desktops with no sharing."
          - "Shares files, but leaves no central copy, no permissions and no backups."
          - "Best: central, permission-controlled and backed up, and it works with the internet down."

  - id: ap1-3z
    title: "Best-answer practice: Hardware"
    domain: "3"
    goal: "I can pick the best display, cable, memory, storage, board, power supply or printer setting for a stated need when every option on offer would work."
    notes: |
      Domain 3 best-answer questions offer four parts or settings that all work. The stem adds one number or rule that only one of them meets, so read it for **the limit**: a resolution and refresh rate, a fire code, a budget, an uptime need, a case size.

      **Constraints to look for**

      | Clue in the stem | What it decides |
      | "4K at 144Hz", "10 Gbps" | Which cable, port or card can carry that number |
      | "code requires", "policy" | The rated part, even if another would work electrically |
      | "must keep running if X fails" | Redundancy for that exact failure |
      | "cheapest per terabyte", "archive" | Spinning disks, not flash |
      | "same output on every system" | A page-description language, not a vendor driver |

      **Usual traps**

      - Choosing the fastest part when the stem asked for capacity or cost.
      - Mistaking RAID for backup, or a UPS for a redundant power supply.
      - Buying first and checking compatibility after: check the board's support list first.
    items:
      - id: ap1-3z-b01
        type: mcq
        best: true
        q: "A photo editor needs accurate colour and wide viewing angles on a mid-range budget. Her editing program shows the same toolbars in the same place ten hours a day. Which panel type is BEST?"
        choices:
          - "TN"
          - "VA"
          - "OLED"
          - "IPS"
        answer: 3
        why: "IPS gives good colour and wide viewing angles at mid-range prices, without burn-in risk from static toolbars."
        whys:
          - "Cheap and fast, but colour shifts badly when viewed off-centre."
          - "Strong contrast, but colour and viewing angles are weaker than IPS."
          - "Superb colour, but costs more and static toolbars all day risk burn-in."
          - "Best: accurate colour and wide angles at a mid-range price, with no burn-in risk."

      - id: ap1-3z-b02
        type: mcq
        best: true
        q: "A gamer's graphics card renders 200 frames per second in his favourite game, but his 1080p monitor refreshes at 60Hz, and fast motion looks juddery. He has a fixed budget for one upgrade. Which is BEST?"
        choices:
          - "A 240Hz 1080p monitor"
          - "A 4K monitor at 60Hz"
          - "A more powerful graphics card"
          - "A monitor with a wider colour gamut"
        answer: 0
        why: "The monitor can show only 60 of the 200 frames each second; a higher refresh rate shows them."
        whys:
          - "Best: displays far more of the frames the card already produces, smoothing motion."
          - "Sharper, but still 60Hz, so motion stays as juddery as before."
          - "Produces even more frames the 60Hz monitor cannot show."
          - "Richer colour, but does nothing for motion."

      - id: ap1-3z-b03
        type: mcq
        best: true
        q: "A video editor grades HDR footage in a bright studio and needs very high peak brightness and deep blacks. The same timeline and menus stay on screen for hours, and she is worried about burn-in. Which display technology is BEST?"
        choices:
          - "OLED"
          - "Mini-LED backlit LCD"
          - "An edge-lit IPS LCD with HDR support"
          - "TN LCD"
        answer: 1
        why: "Mini-LED uses thousands of dimming zones for high brightness and deep blacks, and as an LCD it does not burn in."
        whys:
          - "Perfect blacks, but lower peak brightness in a bright room, and static menus risk burn-in."
          - "Best: high HDR brightness with local dimming for deep blacks, and no burn-in."
          - "No burn-in, but edge lighting cannot dim small areas, so blacks are greyish."
          - "No burn-in, but weak colour and contrast for grading."

      - id: ap1-3z-b04
        type: mcq
        best: true
        q: "New Cat 6 runs will pass through the space above a suspended ceiling that carries return air for the building's ventilation. The building code requires plenum-rated cable there. Which cable is BEST?"
        choices:
          - "Cat 6a shielded twisted pair with a PVC jacket"
          - "Direct-burial Cat 6"
          - "Standard PVC-jacketed Cat 6 UTP"
          - "Plenum-rated (CMP) Cat 6 UTP"
        answer: 3
        why: "Only plenum-rated cable meets the code for air-handling spaces, because it gives off less smoke and toxic gas if it burns."
        whys:
          - "Faster and shielded, but a PVC jacket is not plenum-rated."
          - "Built for wet soil, not rated for an air-handling space."
          - "Electrically fine, but not permitted in a plenum space."
          - "Best: it meets the code requirement and the network need."

      - id: ap1-3z-b05
        type: mcq
        best: true
        q: "A new monitor runs at 3840 x 2160 at 144Hz. It has HDMI 2.0 and DisplayPort 1.4 inputs; the graphics card has HDMI 2.0 and DisplayPort 1.4 outputs. Which connection is BEST?"
        choices:
          - "DisplayPort 1.4"
          - "HDMI 2.0"
          - "Dual-link DVI-D through an adapter"
          - "A USB-C to HDMI adapter"
        answer: 0
        why: "DisplayPort 1.4 can carry 4K at 144Hz (with DSC or reduced colour depth); HDMI 2.0 tops out at 4K 60Hz."
        whys:
          - "Best: the only link here with the bandwidth for 4K at 144Hz."
          - "Gives a 4K picture, but only up to 60Hz."
          - "Dual-link DVI tops out far below 4K at 144Hz."
          - "The card has no USB-C output, and the HDMI end has the same 60Hz limit."

      - id: ap1-3z-b06
        type: mcq
        best: true
        q: "A brand-new managed switch has no IP address set yet, and its web interface is unreachable. The technician's laptop has only USB ports; the switch has an RJ45 serial console port. Which is the BEST way to do the first configuration?"
        choices:
          - "Connect with SSH"
          - "Find its default address with a network scan and use the web interface"
          - "Use a USB-to-serial adapter and a rollover console cable"
          - "Reset it to factory settings and try again"
        answer: 2
        why: "The console port needs no IP address, so a USB-to-serial adapter and console cable reach it immediately."
        whys:
          - "Needs an IP address, which the switch does not have yet."
          - "Worth a try on some models, but the stem says the web interface is unreachable."
          - "Best: console access works with no network settings at all."
          - "It is already at factory settings; a reset changes nothing."

      - id: ap1-3z-b07
        type: mcq
        best: true
        q: "A builder is choosing memory for a small accounting file server. Its board and CPU support both ECC and non-ECC modules, and silent data corruption is the owner's main worry. Which memory is BEST?"
        choices:
          - "ECC modules at the board's rated speed"
          - "Twice as much non-ECC memory"
          - "The fastest non-ECC modules the board supports"
          - "Non-ECC modules with heat spreaders"
        answer: 0
        why: "ECC detects and corrects single-bit memory errors, the cause of silent corruption that the owner fears."
        whys:
          - "Best: it corrects memory errors before they reach the accounting data."
          - "More headroom, but no protection against memory errors."
          - "Faster, but speed does nothing against corrupted data."
          - "Cooler, but heat spreaders do not detect or correct errors."

      - id: ap1-3z-b08
        type: mcq
        best: true
        q: "A desktop board has four slots and supports dual-channel memory. The user wants 32GB now, the best memory performance, and room for a later upgrade. Which purchase is BEST?"
        choices:
          - "One 32GB module"
          - "A matched 2 x 16GB kit in the paired slots"
          - "Four 8GB modules"
          - "Two 16GB modules of different brands and speeds"
        answer: 1
        why: "Two matched modules run in dual channel and leave two slots free for later."
        whys:
          - "Leaves three slots free, but a single module runs in single-channel mode, which is slower."
          - "Best: dual-channel speed now, with two slots left for an upgrade."
          - "Runs in dual channel, but fills every slot, so an upgrade means replacing modules."
          - "Will usually run, but at the slower module's speed and with a higher risk of instability."

      - id: ap1-3z-b09
        type: mcq
        best: true
        q: "A video studio must add 20TB to a desktop for finished projects that are opened a few times a year. The budget is tight and speed hardly matters. Which storage is BEST?"
        choices:
          - "Large 3.5-inch hard drives"
          - "M.2 NVMe SSDs"
          - "2.5-inch SATA SSDs"
          - "A set of large USB flash drives"
        answer: 0
        why: "Hard drives still give by far the lowest cost per terabyte, and archive work does not need flash speed."
        whys:
          - "Best: the cheapest per terabyte, and fast enough for files opened a few times a year."
          - "Very fast, but costs several times more per terabyte for speed nobody needs."
          - "Faster than disks, but much dearer per terabyte."
          - "Portable, but expensive per terabyte, slow, and easy to lose."

      - id: ap1-3z-b10
        type: mcq
        best: true
        q: "A database server has four identical drives. The array must survive a drive failure and give the best write performance; usable capacity matters least. Which RAID level is BEST?"
        choices:
          - "RAID 0"
          - "RAID 5"
          - "RAID 6"
          - "RAID 10"
        answer: 3
        why: "RAID 10 survives a drive failure and writes quickly because it mirrors and stripes with no parity to calculate."
        whys:
          - "The fastest writes, but a single drive failure loses everything."
          - "Survives a failure with more capacity, but every write pays a parity penalty."
          - "Survives two failures, but has an even larger write penalty with double parity."
          - "Best: redundancy with fast writes, at the cost of half the capacity, which matters least here."

      - id: ap1-3z-b11
        type: mcq
        best: true
        q: "A small firm's server keeps its files on a two-drive RAID 1 mirror. Last month a user deleted a folder by mistake and it could not be recovered. Which is the BEST step to prevent that happening again?"
        choices:
          - "Add a third drive as a hot spare"
          - "Rebuild the array as RAID 5 with a third drive"
          - "Add versioned backups with an off-site copy"
          - "Replace the drives with enterprise-grade models"
        answer: 2
        why: "RAID copies a deletion to every drive instantly; only a backup keeps older versions to restore."
        whys:
          - "Speeds recovery from a drive failure, but a deletion is still mirrored at once."
          - "Changes the redundancy, but deletions are still written to every drive."
          - "Best: earlier versions survive a deletion, and an off-site copy survives a fire or theft."
          - "Lowers the chance of drive failure, which was not the problem."

      - id: ap1-3z-b12
        type: mcq
        best: true
        q: "A customer wants the smallest possible desktop for a living room that still holds one full-size, double-width graphics card. Which motherboard form factor is BEST?"
