          - "Best: meets the 10 Gbps need over the existing Cat 6a."
          - "Adds a port, but still 1 Gbps per link."

      - id: ap1-3z-b17
        type: mcq
        best: true
        q: "A builder is putting a mid-range PC into a very small case where airflow is tight. Several cables from the last build were left bundled unused behind the drive cage, blocking air. Which power supply feature is BEST for this build?"
        choices:
          - "A higher wattage rating"
          - "A fully modular design"
          - "A higher energy-efficiency rating"
          - "A redundant pair of supplies"
        answer: 1
        why: "Modular supplies let unused cables be left out, clearing the clutter that blocks airflow in a small case."
