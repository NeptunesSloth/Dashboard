          - "Adds headroom, but does nothing about unused cables."
          - "Best: no unused cables, so better airflow in the tight case."
          - "Saves power and heat, but does not remove the cable clutter."
          - "Gives failover, but needs more space, which the case lacks."

      - id: ap1-3z-b18
        type: mcq
        best: true
        q: "A file server is protected by a UPS. The owner wants it to keep running, with no restart, if one of its power supply units fails. Which is the BEST addition?"
        choices:
          - "A second, larger UPS on a separate circuit"
          - "A higher-wattage power supply"
          - "A spare power supply kept on the shelf"
          - "Redundant hot-swappable power supplies"
        answer: 3
        why: "With redundant supplies, the server runs on the surviving unit and the failed one is swapped without a shutdown."
        whys:
          - "Protects against mains failure, not against the server's own supply failing."
          - "A bigger single supply is still a single point of failure."
          - "Shortens the repair, but the server still goes down when the supply fails."
          - "Best: the server keeps running through a supply failure."

      - id: ap1-3z-b19
        type: mcq
        best: true
        q: "A design studio prints complex vector artwork from both Macs and Windows PCs, and the clients need identical output whichever system sends the job. The printer supports PCL and PostScript. Which driver choice is BEST?"
        choices:
          - "The PCL driver on every computer"
          - "Whichever driver each computer installs automatically"
          - "The operating systems' generic built-in drivers"
          - "The PostScript driver on every computer"
        answer: 3
        why: "PostScript describes pages device-independently and is the long-standing standard for graphics work on every platform."
        whys:
          - "Fast for office documents, but rendering can differ between drivers and platforms."
          - "Likely mixes driver types, which is what causes differing output."
          - "Easy to install, but may omit features and render differently."
          - "Best: consistent, device-independent rendering of vector graphics on Mac and Windows alike."

      - id: ap1-3z-b20
        type: mcq
        best: true
        q: "Staff scan 100-page contracts on a multifunction device. The files must end up in each user's folder on the office file server, and the mail system rejects attachments over 10MB. Which scan service is BEST?"
