  - id: ap1-4z
    title: "Best-answer practice: Virtualization and Cloud Computing"
    domain: "4"
    goal: "I can pick the best hypervisor, virtual network, disk type or cloud model when every option on offer would work."
    notes: |
      Domain 4 best-answer questions usually ask which model or setting fits a stated need. Every choice would run the workload; the stem says **who should do the work** and **what must be kept apart**.

      **Constraints to look for**

      | Clue in the stem | What it decides |
      | "on my laptop", "offline", "no budget" | A Type 2 hypervisor on hardware already owned |
      | "must not reach the LAN" | An internal or host-only virtual network |
      | "no patching", "no servers to manage" | PaaS or SaaS, not IaaS |
      | "must stay on our hardware" | Private cloud |
      | "survive a data-centre outage" | More than one availability zone or region |
      | "same everywhere" | A container image |

      **Usual traps**

      - Buying hardware when a virtual machine does the job.
      - Choosing IaaS when the stem wants the provider to patch the software.
      - Treating a password as enough when a management interface has a known flaw: keep it off the user network.

    items:
      - id: ap1-4z-b01
        type: mcq
        best: true
        q: "A developer must test a desktop app on three operating systems. He works on a powerful laptop, often offline, and has no budget for hardware or cloud services. Which is BEST?"
        choices:
          - "Three spare physical PCs, one per operating system"
          - "Dual-boot the laptop into each operating system"
          - "Rent cloud virtual machines for each operating system"
          - "VMs under a Type 2 hypervisor on the laptop"
        answer: 3
        why: "A Type 2 hypervisor runs all three systems side by side on the laptop he has, offline and at no cost."
        whys:
          - "Realistic tests, but costs hardware he has no budget for and cannot travel with him."
          - "Free, but only one system runs at a time, with a restart for every switch."
          - "Flexible, but costs money and needs a connection he often lacks."
          - "Best: all three systems on his own laptop, free, offline and with snapshots to reset them."

      - id: ap1-4z-b02
        type: mcq
        best: true
        q: "A trainer builds three virtual machines for a security class: they must talk to one another but must never reach the office LAN, the host or the internet. Which virtual network setting is BEST?"
        choices:
          - "Bridged networking"
          - "NAT networking"
          - "An internal (private) virtual network"
          - "Host-only networking between the VMs and the host"
        answer: 2
        why: "An internal network connects the VMs to each other and to nothing else, not even the host."
        whys:
          - "Puts the VMs directly on the office LAN."
          - "Gives the VMs internet access through the host."
          - "Best: the VMs reach each other and nothing beyond."
          - "Keeps them off the LAN, but the host can still reach them and they can reach the host."

      - id: ap1-4z-b03
        type: mcq
        best: true
        q: "Two departments need different versions of the same reporting program, and the versions conflict when installed on one PC. Staff in both departments sometimes use the same PCs. Which is the BEST approach?"
        choices:
          - "Give each department its own set of PCs"
          - "Deliver each version through application virtualization"
          - "Run each version in a full virtual machine on every PC"
          - "Uninstall one version and reinstall the other whenever it is needed"
        answer: 1
        why: "Application virtualization runs each version in its own isolated package, so both work on the same PC."
        whys:
          - "Avoids the conflict, but costs hardware and fails when staff share PCs."
          - "Best: both versions run side by side on any PC without conflicting."
          - "Works, but a whole guest OS on every PC to run one program is heavy."
          - "Works in theory, but is slow and error-prone."

      - id: ap1-4z-b04
        type: mcq
        best: true
        q: "A retailer's website runs on cloud virtual machines in one availability zone. Management wants it to stay up if that provider's data centre suffers an outage. Which is BEST?"
        choices:
          - "Spread the VMs across two or more availability zones"
          - "Take daily snapshots of the virtual machines"
          - "Move to larger virtual machines in the same availability zone"
          - "Buy a UPS for the office"
        answer: 0
        why: "Separate zones fail independently, so the site keeps running from the zone that is still up."
        whys:
          - "Best: if one zone goes down, traffic shifts to servers in another zone."
          - "Allows recovery, but the site is down until the copies are restored elsewhere."
          - "Adds capacity, but still in the zone that fails."
          - "Protects the office, not the provider's data centre."

      - id: ap1-4z-b05
        type: mcq
        best: true
        q: "A defence contractor must keep its data on hardware it owns and controls, but its developers want self-service, on-demand virtual machines like a public cloud offers. Which model is BEST?"
        choices:
          - "Public cloud"
          - "Community cloud"
          - "Hybrid cloud"
          - "Private cloud"
        answer: 3
        why: "A private cloud gives cloud-style self-service on hardware the organisation owns and controls."
        whys:
          - "Self-service, but data sits on the provider's shared hardware."
          - "Shared with other organisations, so the contractor does not control the hardware alone."
          - "Part of the workload would be on public infrastructure."
          - "Best: self-service virtual machines with all data kept on hardware it controls."

      - id: ap1-4z-b06
        type: mcq
        best: true
        q: "Staff move between office desktops and laptops, often work on trains with no connection, and need the latest copy of their files on whichever device they open. The firm already pays for cloud storage. Which is BEST?"
        choices:
          - "A file share on the office server, reached over the VPN"
          - "A cloud sync client with files kept offline"
          - "Email files to themselves"
          - "A USB stick for each user"
        answer: 1
        why: "Sync keeps a local copy on every device that updates automatically, so files are current and available offline."
        whys:
          - "Central, but unreachable on the train with no connection, even over the VPN."
          - "Best: up-to-date files on every device, available offline, using a service already paid for."
          - "Works, but creates many versions and relies on people remembering to send them."
          - "Portable, but one copy to lose, and it is easily out of date."

      - id: ap1-4z-b07
        type: mcq
        best: true
        q: "A virtual machine will run a busy database that writes constantly. The host has plenty of free SSD space, and steady disk performance matters more than saving space. Which virtual disk type is BEST?"
        choices:
          - "A dynamically expanding disk"
          - "A fixed-size (pre-allocated) disk"
          - "A differencing disk based on a template"
          - "A virtual disk stored on a network share"
        answer: 1
        why: "A fixed-size disk is allocated in advance, so writes never wait for the file to grow and it does not fragment."
        whys:
          - "Saves space, but growing the file adds overhead and fragmentation under heavy writes."
          - "Best: steady performance, and the space it uses is available."
          - "Saves space when making copies, but adds a layer of overhead to every read and write."
          - "Central, but adds network latency to every database write."

      - id: ap1-4z-b08
        type: mcq
        best: true
        q: "A team's app works on developers' machines but breaks in testing and production because library versions differ. They want it to run identically everywhere. Which is BEST?"
        choices:
          - "Write a longer installation guide listing every library version"
          - "Give testing and production full copies of a developer's virtual machine"
          - "Package the app and its libraries as a container image"
          - "Install the same operating system on every server"
        answer: 2
        why: "A container image carries the app with its exact libraries, so it runs the same wherever it is deployed."
        whys:
          - "Helps, but relies on people following it exactly on every machine."
          - "Consistent, but copies a whole operating system each time, heavy to ship and update."
          - "Best: the app and its dependencies travel together and run the same everywhere."
          - "A start, but library versions can still differ between servers."

      - id: ap1-4z-b09
        type: mcq
        best: true
        q: "A small team needs a SQL database for a new web app. Nobody wants to patch the operating system or the database software, but they must design their own tables and queries. Which is BEST?"
        choices:
          - "A managed database service from a cloud provider (PaaS)"
          - "A cloud virtual machine with the database installed (IaaS)"
          - "A database server in the office"
          - "A SaaS application with a built-in data store"
        answer: 0
        why: "A managed database leaves the provider to patch the OS and database while the team designs its own schema."
        whys:
          - "Best: the provider patches everything underneath, and the team keeps control of its tables."
          - "Flexible, but the team still patches the OS and the database."
          - "Full control, but full patching and hardware work as well."
          - "No patching, but the team cannot design its own database inside someone else's app."

      - id: ap1-4z-b10
        type: mcq
        best: true
        q: "A hypervisor's web management page has a published flaw, and the vendor's fix is a month away. The page is currently reachable from the whole staff network. Until the patch arrives, which control is BEST?"
        choices:
          - "Change the administrator password to a long one"
          - "Put the management page on an admin-only network"
          - "Change the management page to a non-standard port"
          - "Review the hypervisor logs each week"
        answer: 1
        why: "If ordinary users cannot reach the page, they cannot exploit its flaw; this compensates until the patch."
        whys:
          - "Good practice, but many such flaws bypass authentication entirely."
          - "Best: removes the flawed page from everyone's reach except a few admins."
          - "Slows casual discovery, but a port scan finds it quickly."
          - "Detective only: it would show an attack after it happened."

  - id: ap1-5z
    title: "Best-answer practice: Hardware and Network Troubleshooting"
    domain: "5"
    goal: "I can choose the right first step, the least disruptive fix or the safest action for a hardware, network or printer fault when every option would help."
    notes: |
      Domain 5 is the largest domain. In a best-answer troubleshooting question every choice could fix *something*; the stem tells you **where the fault is** and **what order to work in**.

      **Constraints to look for**

      | Clue in the stem | What it decides |
      | "only one user", "others are fine" | Look at that user's device, not the shared one |
      | "since X was changed" | Undo or check X first |
      | "FIRST", "NEXT" | The cheapest, quickest check that narrows the fault |
      | "hot", "smoke", "swollen" | Safety before diagnosis |
      | "at lunchtime", "every afternoon" | Something that happens at that time |

      **Usual traps**

      - Restarting or replacing a shared device (router, printer, server) for a one-user fault.
      - Buying a part before checking a cable, setting or battery.
      - Reaching into a laser printer before the fuser has cooled.
      - Stopping at "it works": verify the whole system, then document.

      Work from the simple and local outwards, and change one thing at a time.
    items:
      - id: ap1-5z-b01
        type: mcq
        best: true
        q: "A user's laptop shuts itself off during evening video calls she takes from her bed, but never when used at her desk. Its fans and vents are clean. Which is the BEST fix?"
        choices:
          - "Replace the thermal paste"
          - "Use it on a hard, flat surface"
          - "Buy her a cooling pad to put under the laptop"
          - "Replace the cooling fan"
        answer: 1
        why: "Bedding blocks the intake vents; keeping them clear removes the cause at no cost."
        whys:
          - "The laptop runs fine at a desk, so the cooling system itself is working."
          - "Best: the vents can breathe again, which is the whole cause, at no cost."
          - "Would help, but buys a part to work around something a habit change fixes."
          - "The fan is clean and copes at the desk, so it is not faulty."

      - id: ap1-5z-b02
        type: mcq
        best: true
        q: "On Monday a desktop shows 'Bootable device not found'. It worked on Friday, nothing inside was changed, and a USB stick the user copied files to on Friday is still plugged in. What should the technician do FIRST?"
        choices:
          - "Run the drive maker's diagnostics on the system drive"
          - "Reseat the system drive's data and power cables"
          - "Remove the USB stick and restart"
          - "Reinstall the operating system"
        answer: 2
        why: "A forgotten USB stick early in the boot order is a common, quick cause to rule out before anything else."
        whys:
          - "Worth doing if the simple check fails, but it takes far longer."
          - "Reasonable later, but nothing inside the case was touched."
          - "Best: the quickest check of the most likely cause."
          - "Drastic and destructive; nothing yet shows the drive or the OS is at fault."

      - id: ap1-5z-b03
        type: mcq
        best: true
        q: "A busy order database runs on a RAID 5 array of four 7,200rpm hard drives. Monitoring shows the disks saturated with small random writes at peak times; the CPU and memory are mostly idle. The owner wants a lasting fix. Which is BEST?"
        choices:
          - "Defragment the array overnight"
          - "Add more RAM to the server"
          - "Move the database to an SSD array"
          - "Rebuild the array as RAID 6 with a fifth drive"
        answer: 2
        why: "Small random writes are limited by disk IOPS, and SSDs provide many times more."
        whys:
          - "May help sequential reads a little, but cannot raise the IOPS of spinning disks."
          - "Helps reads through caching, but the bottleneck is writes, and memory is mostly idle already."
          - "Best: removes the IOPS bottleneck at its source."
          - "Adds a second parity calculation, making writes slower still."

      - id: ap1-5z-b04
        type: mcq
        best: true
        q: "A user changed his monitor's refresh rate in the display settings and confirmed it. Now the monitor shows only 'Out of range' at every start-up. What is the BEST way to fix it?"
        choices:
          - "Replace the monitor"
          - "Replace the video cable"
          - "Reinstall the graphics driver from the maker's website"
          - "Use low-resolution video mode and reset the rate"
        answer: 3
        why: "The PC is sending a signal the monitor cannot show; low-resolution mode displays a picture so the setting can be undone."
        whys:
          - "The monitor is working and correctly reporting an unsupported signal."
          - "The cable is fine; the problem is the signal sent over it."
          - "May reset the setting, but takes longer and can only be done once you can see the screen."
          - "Best: gets a picture back and fixes the exact setting that caused the fault."

      - id: ap1-5z-b05
        type: mcq
        best: true
        q: "A laptop is connected to a meeting-room TV by HDMI. The TV shows only the desktop wallpaper, with no icons or open windows, while the laptop screen looks normal. What is the BEST fix?"
        choices:
          - "Switch the display mode to Duplicate"
          - "Replace the HDMI cable"
          - "Update the laptop's graphics driver to the latest"
          - "Change the TV to another HDMI input"
        answer: 0
        why: "The laptop is extending the desktop onto the TV; Duplicate shows the same screen on both."
        whys:
          - "Best: the TV is working as an extended second screen, and a mode change fixes it in seconds."
          - "The TV already shows a clean picture, so the cable is working."
          - "The driver is working; it is doing exactly what the mode asks."
          - "The TV is already on the right input; it shows the extended desktop."

      - id: ap1-5z-b06
        type: mcq
        best: true
        q: "Since an operating system update two days ago, a phone's battery lasts half as long as before. The battery health reads 92%, and the phone is warm even when idle. What should the technician do FIRST?"
        choices:
          - "Replace the battery"
          - "Back up and reset the phone to factory settings"
          - "Check battery usage by app in settings"
          - "Turn on low-power mode permanently"
        answer: 2
        why: "Warmth while idle after an update points to an app running in the background; the usage list shows which one."
        whys:
          - "92% health is good, and the problem began with the update, not with ageing."
          - "May work, but erases everything before the cause is known."
          - "Best: quick, harmless, and likely to name the app causing the drain."
          - "Hides the symptom and limits the phone without finding the cause."

      - id: ap1-5z-b07
        type: mcq
        best: true
        q: "A tablet always stops charging at 80% and stays there, although it is plugged in overnight. The battery health is good, and the charger and cable work with another tablet. What should the technician check FIRST?"
        choices:
          - "Whether a charge-limit setting is turned on"
          - "Whether the charging port needs cleaning"
          - "Whether the battery needs replacing"
          - "Whether the charging board inside needs replacing"
        answer: 0
        why: "Stopping at exactly 80% is the signature of a charge-limit setting that protects the battery."
        whys:
          - "Best: a setting that caps charge at 80% would explain an exact, repeatable limit."
          - "A dirty port causes intermittent charging, not a steady stop at 80%."
          - "Health is good, so the battery is not the cause."
          - "A costly repair to try before ruling out a setting."

      - id: ap1-5z-b08
        type: mcq
        best: true
        q: "One user in a 30-person office cannot reach any website. Everyone else, on the same switch and router, is working normally. What should the technician do FIRST?"
        choices:
          - "Restart the office router"
          - "Check that PC's link light and IP settings"
          - "Call the internet provider to report an outage"
          - "Replace the PC's network card"
        answer: 1
        why: "Everyone else works, so the fault is at this PC; checking its link and address settings narrows it quickly."
        whys:
          - "Disrupts 29 working users for a fault that is clearly at one PC."
          - "Best: quick, harmless, and aimed at the one place the fault can be."
          - "The internet connection works for everyone else."
          - "Buys a part before simpler checks; the cable or a setting is more likely."

      - id: ap1-5z-b09
        type: mcq
        best: true
        q: "Every weekday from 1 pm to 3 pm the office internet is sluggish for everyone. The router's statistics show one PC uploading at full line speed then; it is the PC's cloud backup, which is scheduled for 1 pm. Which is the BEST fix?"
        choices:
          - "Upgrade to a faster internet plan"
          - "Replace the router with a more powerful business model"
          - "Move the backup to run outside office hours"
          - "Disable the cloud backup"
        answer: 2
        why: "The backup fills the upload at a busy time; running it at night removes the clash at no cost and keeps the backup."
        whys:
          - "Would ease it, but pays every month to fix a scheduling choice."
          - "The router is working; the line is simply full."
          - "Best: free, keeps the backup, and stops it competing with daytime work."
          - "Removes the slowdown, but also removes the data protection."

      - id: ap1-5z-b10
        type: mcq
        best: true
        q: "A newly installed ceiling access point powered by PoE reboots every few minutes, especially when many clients connect. Its datasheet says it needs 802.3at (PoE+) for full operation. What should the technician check FIRST?"
        choices:
          - "The access point's firmware version"
          - "The port's PoE class and the switch's power budget"
          - "The Wi-Fi channel in use"
          - "The length of the cable run from the switch to the access point"
        answer: 1
        why: "Reboots under load on a device that needs PoE+ point to too little power from the switch port."
        whys:
          - "Worth checking later, but load-dependent reboots point to power first."
          - "Best: a port giving only 802.3af, or an exhausted budget, would cause exactly this."
          - "Channel trouble causes poor throughput, not reboots."
          - "Matters past 100 metres, but the datasheet points to power class first."

      - id: ap1-5z-b11
        type: mcq
        best: true
        q: "One user's documents no longer reach the shared network printer, while everyone else prints to it normally. What should the technician check FIRST?"
        choices:
          - "The printer's own IP address and network settings"
          - "The printer's firmware version"
          - "The print server's spooler service"
          - "That user's print queue, port and driver"
        answer: 3
        why: "Everyone else prints, so the printer and server are fine; the problem lies in this PC's printer set-up."
        whys:
          - "Others print to it, so its network settings work."
          - "A firmware fault would affect everyone."
          - "A spooler fault on the server would affect every user of it."
          - "Best: focuses on the only part unique to the failing user."

      - id: ap1-5z-b12
        type: mcq
        best: true
        q: "A laser printer warns that toner is low, and prints are fading. The user must print 20 more pages for a meeting in 30 minutes, and no spare cartridge is on site. Which is the BEST immediate step?"
        choices:
          - "Gently rock the cartridge and refit it"
          - "Raise the print density setting"
          - "Turn off toner-save mode"
          - "Order a new cartridge for next-day delivery"
        answer: 0
        why: "Rocking spreads the remaining toner evenly, usually giving enough even pages to finish a short job."
        whys:
          - "Best: redistributes what toner is left, often restoring even prints for a few more pages."
          - "Darkens prints, but uses toner faster, and cannot help where none reaches the drum."
          - "Helps only if the mode is on, and does nothing about toner that is running out."
          - "Needed, but does not help with the meeting in 30 minutes."

      - id: ap1-5z-b13
        type: mcq
        best: true
        q: "A laser printer that has been printing continuously reports a jam in the fuser area. The sheet is visible just inside the rear door. What should the technician do FIRST?"
        choices:
          - "Pull the sheet out quickly before it tears"
          - "Power off, open the door and let it cool"
          - "Print a test page to see whether it clears itself"
          - "Remove the toner cartridge"
        answer: 1
        why: "A fuser runs at roughly 200 °C; letting it cool prevents burns before anyone reaches in."
        whys:
          - "Clears the jam, but risks burns from the hot fuser."
          - "Best: safety first; the fuser is hot enough to burn."
          - "The printer will not print until the jam is cleared."
          - "May be needed for some jams, but does nothing to make the fuser area safe."

      - id: ap1-5z-b14
        type: mcq
        best: true
        q: "A laser printer feeds plain paper perfectly from its main cassette, but jams every time a user prints on heavy card stock from that cassette. The printer has a bypass tray with a straighter paper path. Which is the BEST fix?"
        choices:
          - "Replace the cassette's pickup roller"
          - "Fit the printer's maintenance kit"
          - "Feed card from the bypass tray as heavy media"
          - "Tell staff to stop printing on card stock from now on"
        answer: 2
        why: "Plain paper feeds fine, so the hardware is sound; card needs the straighter path and the right fuser setting."
        whys:
          - "Plain paper feeds perfectly, so the roller is fine."
          - "Plain paper feeds without fault, so nothing shows the printer is worn."
          - "Best: uses the path designed for heavy media, with the matching setting."
          - "Avoids the jam, but stops a job the printer can do."

      - id: ap1-5z-b15
        type: mcq
        best: true
        q: "After cleaning dust out of a desktop, a technician powers it on and the firmware shows 'CPU fan error' and halts. The CPU fan spins. What should the technician check FIRST?"
        choices:
          - "Which header the fan cable is plugged into"
          - "Whether a firmware update is available"
          - "Whether the fan needs replacing"
          - "Whether the fan warning can be disabled in firmware"
        answer: 0
        why: "The fan spins, so it works; the board reports no fan because it is not reading the header it monitors."
        whys:
          - "Best: the cleaning likely moved the plug, and the board only reads its CPU_FAN header."
          - "Nothing changed in firmware; the cleaning is the recent change."
          - "The fan is spinning, so it is unlikely to be faulty."
          - "Hides a warning that protects the CPU without fixing the cause."

      - id: ap1-5z-b16
        type: mcq
        best: true
        q: "A laptop will not power on, on battery or on its charger, and the charger's own light is off. Another laptop of the same model is at the next desk. What should the technician do FIRST?"
        choices:
          - "Test with the other laptop's charger"
          - "Replace the battery"
          - "Open the laptop and check the DC jack"
          - "Send the laptop for motherboard repair"
        answer: 0
        why: "The charger's light is off, so swapping in a known-good charger tests the most likely cause in seconds."
        whys:
          - "Best: a free, instant test of the part that is already showing a fault."
          - "Might be flat as well, but a working charger would still power the laptop."
          - "Possible later, but the dead charger light points elsewhere first."
          - "Expensive and slow, before a ten-second test."

      - id: ap1-5z-b17
        type: mcq
        best: true
        q: "An external USB hard drive spins up when plugged in, but does not appear on a user's PC. What should the technician do FIRST?"
        choices:
          - "Try a different USB port and cable"
          - "Format the drive"
          - "Open the enclosure and test the drive on SATA"
          - "Send the drive for data recovery"
        answer: 0
        why: "The drive has power, so the cable or port is the quickest likely fault to rule out."
        whys:
          - "Best: quick, harmless, and tests the most likely cause."
          - "Destroys the data, and the PC cannot see the drive to format it."
          - "A later step, after the simple checks."
          - "Costly, before anyone knows the drive is faulty."

      - id: ap1-5z-b18
        type: mcq
        best: true
        q: "A user's account is locked out every morning. He changed his password on Friday, and his company phone is set up for work email and Wi-Fi. What should the technician check FIRST?"
        choices:
          - "Whether someone is trying to guess his password"
          - "Whether his PC's clock is wrong"
          - "Whether the account lockout threshold is too low"
          - "Whether the phone still has the old password"
        answer: 3
        why: "A device retrying an old password after a change is the most common cause of a lockout that starts then."
        whys:
          - "Possible, but the timing points to his own change first."
          - "Clock errors cause sign-in failures, not lockouts that began with a password change."
          - "A policy change for one user's problem, which hides the cause."
          - "Best: the phone retrying the old password would lock him out the same way every day."

      - id: ap1-5z-b19
        type: mcq
        best: true
        q: "A desktop arrived at a new office by courier. It now powers on, its fans spin, but there is no display and it gives the beep pattern for a memory error. Nothing was changed inside. What should the technician do FIRST?"
        choices:
          - "Replace the memory modules"
          - "Clear the CMOS"
          - "Reseat the memory modules"
          - "Replace the motherboard"
        answer: 2
        why: "Bumps in transit can work a module loose; reseating is free and fixes the most likely cause."
        whys:
          - "Buys parts that may be fine; transit points to a loose fit, not a dead module."
          - "Resets settings, but a memory beep code points to the modules themselves."
          - "Best: free and quick, and transit is the obvious reason for a loose module."
          - "Expensive and drastic before a simple reseat."

      - id: ap1-5z-b20
        type: mcq
        best: true
        q: "After a storm, a NAS that lost power mid-write had a corrupted volume. It has been repaired and restored from backup. Which preventive measure is BEST?"
        choices:
          - "Replace the NAS drives"
          - "Add a second NAS that copies the first one nightly"
          - "Run a file-system check weekly"
          - "Put the NAS on a UPS with clean shutdown"
        answer: 3
        why: "The cause was sudden power loss; a UPS with a shutdown signal stops it happening again."
        whys:
          - "The drives were not at fault; the power was."
          - "Adds a copy, but both can lose power in the same storm."
          - "Finds damage after the fact; it does not prevent it."
