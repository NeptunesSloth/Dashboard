          - "Mini-ITX"
          - "microATX"
          - "ATX"
          - "A laptop motherboard in a custom case"
        answer: 0
        why: "Mini-ITX has one PCIe x16 slot, enough for a single graphics card, in the smallest standard case."
        whys:
          - "Best: the smallest standard board that still takes a full graphics card."
          - "Smaller than ATX, but still larger than Mini-ITX, with slots the build does not need."
          - "Holds the card easily, but needs a large case."
          - "Small, but laptop boards do not take standard desktop graphics cards."

      - id: ap1-3z-b13
        type: mcq
        best: true
        q: "A user wants a faster processor for an existing desktop. The new CPU uses the same socket as the old one. What should the technician do FIRST?"
        choices:
          - "Order the fastest CPU that fits the socket"
          - "Check the board's CPU support list"
          - "Check that the power supply has enough wattage"
          - "Buy new thermal paste and a larger cooler"
        answer: 1
        why: "Fitting the socket does not guarantee support; the board's list shows whether it works and which BIOS it needs."
        whys:
          - "Risks a CPU the board cannot run, or that needs a BIOS update first."
          - "Best: confirms the board supports the chip and whether a BIOS update must come first."
          - "Worth checking, but only after knowing the board can run the chip at all."
          - "May be needed, but it comes after confirming compatibility."

      - id: ap1-3z-b14
        type: mcq
        best: true
        q: "Company laptops must have full-disk encryption. Users already complain about passwords, and management wants no extra step at start-up as long as the disk cannot be read if it is removed. Which approach is BEST?"
        choices:
          - "Encryption with a separate start-up password"
          - "Encryption unlocked by a USB key that must be inserted at start-up"
          - "Encryption unlocked by an external HSM on the network"
          - "Enable the laptops' TPM and use TPM-protected disk encryption"
        answer: 3
        why: "The TPM releases the key only to the unchanged laptop, so the disk unlocks silently there but is unreadable elsewhere."
        whys:
          - "Strong, but adds the start-up step management ruled out."
          - "Strong, but adds a device to carry and lose and a start-up step."
          - "HSMs protect server keys; laptops cannot reach one before the OS starts."
          - "Best: no extra step for users, and a removed disk cannot be read."

      - id: ap1-3z-b15
        type: mcq
        best: true
        q: "In a school lab, students keep entering firmware setup to change boot order and overclock the CPUs. The PCs must still start without anyone typing a password. Which is the BEST control?"
        choices:
          - "Set a BIOS/UEFI setup (administrator) password"
          - "Set a BIOS/UEFI power-on password for every start-up"
          - "Fit chassis locks to the cases"
          - "Enable Secure Boot"
        answer: 0
        why: "A setup password locks the firmware settings but lets the PC boot normally."
        whys:
          - "Best: firmware settings are locked, and normal start-up needs no password."
          - "Stops the settings being changed, but also stops anyone starting the PC without the password."
          - "Stops hardware tampering, but students still reach firmware setup from the keyboard."
          - "Blocks unsigned boot code, but does not stop anyone changing settings."

      - id: ap1-3z-b16
        type: mcq
        best: true
        q: "A video editor's desktop must reach a new NAS at 10 Gbps over the office's Cat 6a. The motherboard has a 1GbE port and a free PCIe x4 slot. Which is BEST?"
