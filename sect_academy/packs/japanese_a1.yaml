  # ───────────────────────────────────────────────────────────────── 10
  - id: ja1-10
    title: "This and that: これ, それ, あれ and の"
    goal: "I can ask what something is and whose it is, and say that something belongs to someone."
    notes: |
      Japanese divides space into three zones, not two.

      | | thing | meaning |
      |---|---|---|
      | こ | **これ** | this (near me) |
      | そ | **それ** | that (near you) |
      | あ | **あれ** | that over there (far from us both) |
      | ど | **どれ** | which one? |

      So if you hold a book and ask *これ は なん です か*, the answer starts with **それ は …**.

      ## の
      **の** joins two nouns: **A の B** means "A's B" or "the B of A". The describing word always comes first.

      - わたし **の** ほん — my book
      - やまださん **の** くるま — Mr. Yamada's car
      - にほんご **の** ほん — a Japanese-language book
      - だいがく **の** せんせい — a university teacher

      The second noun can be dropped when it is clear: *それ は わたし の です* = "That is mine". **だれ の** asks "whose?".

      ## なに / なん
      "What" is なに, but it shortens to **なん** before です: *なん です か*.

      ## Kanji in names
      山, 川 and 田 are in countless surnames: 山田 **やまだ**, 田中 **たなか**, 山川 **やまかわ**. Inside a name た often becomes だ.
