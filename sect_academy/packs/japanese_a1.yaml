  # ───────────────────────────────────────────────────────────────── 14
  - id: ja1-14
    title: "The week and going places"
    goal: "I can name the days of the week and say where I go, when, how and with whom."
    notes: |
      ## Days of the week
      Each day is one kanji + **ようび**. The seven are the sun, the moon and five elements:

      | 日 | 月 | 火 | 水 | 木 | 金 | 土 |
      |---|---|---|---|---|---|---|
      | にち | げつ | か | すい | もく | きん | ど |
      | sun | moon | fire | water | wood | gold | earth |
      | Sun | Mon | Tue | Wed | Thu | Fri | Sat |

      ## Verbs of movement
      **いきます** (go), **きます** (come), **かえります** (go back home). The particles around them do the work that prepositions do in English:

      | particle | job | example |
      |---|---|---|
      | **へ** (read *e*) or **に** | destination | がっこう **へ** いきます |
      | **で** | means of transport | バス **で** いきます |
      | **と** | together with | ともだち **と** いきます |
      | **に** | on a day, at a time | にちようび **に** いきます |

      Everything goes before the verb, usually in the order *when – with whom – how – where to – verb*.

      ## Negative
      Change **ます** to **ません**: いきます → いき**ません** (I don't go / I won't go).

      There is no separate future tense: あした いきます is "I will go tomorrow". Words like きょう and あした take no に.
