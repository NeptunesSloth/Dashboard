  # ───────────────────────────────────────────────────────────────── 9
  - id: ja1-09
    title: "Introducing yourself: A は B です"
    goal: "I can say who I am, where I am from and what I do, and ask someone the same."
    notes: |
      The basic Japanese sentence is **A は B です**: "A is B".

      - **は** marks the topic, "as for A". As a particle it is written は but read **wa**.
      - **です** is the polite "is / am / are". It never changes for I, you or they. The u is whispered: *des*.
      - The verb always comes **last**.

      | | pattern | example |
      |---|---|---|
      | is | A は B です | わたし は がくせい です。 |
      | is not | A は B じゃ ありません | わたし は がくせい じゃ ありません。 |
      | is …? | A は B です か | たなかさん は がくせい です か。 |
      | also | A も B です | わたし も がくせい です。 |

      - A question just adds **か**. The word order does not change, and no question mark is needed.
      - **も** ("too") replaces は.
      - In writing and formal speech じゃ is **では** (*dewa*).
      - Japanese has no "a / the" and no plural, and it drops what is obvious: once people know you are talking about yourself, leave わたし out.
      - Add **さん** to other people's names, never to your own.
      - A country + **じん** is a person from there; + **ご** is its language: にほん**じん**, にほん**ご**.

      ## Kanji
      From here on each unit teaches a few kanji. The words stay in kana, and each note shows how the word is normally written.
    items:
      - {id: ja1-09-k-watashi, type: glyph, l2: "私", rom: "watashi", l1: "I, me"}
      - {id: ja1-09-k-hito, type: glyph, l2: "人", rom: "hito", l1: "person (ひと; read じん after a country: にほんじん)", alt: ["jin", "nin"]}
      - {id: ja1-09-k-nichi, type: glyph, l2: "日", rom: "nichi", l1: "sun; day (にち; also ひ. In 日本 it is に: にほん)", alt: ["hi", "ni"]}
      - {id: ja1-09-k-hon, type: glyph, l2: "本", rom: "hon", l1: "book; origin (日本 = にほん, 'origin of the sun')"}
      - {id: ja1-09-desu, type: vocab, l2: "です", rom: "desu", l1: "is / am / are (polite; ends the sentence)", ex: "わたし は がくせい です。", ex_l1: "I am a student.", note: "The u is whispered: 'des'."}
      - {id: ja1-09-san, type: vocab, l2: "さん", rom: "san", l1: "Mr. / Ms. (added after someone's name)", ex: "たなかさん は せんせい です。", ex_l1: "Mr. Tanaka is a teacher.", note: "For men and women, family names and first names. Never use it for yourself."}
      - {id: ja1-09-nihonjin, type: vocab, l2: "にほんじん", rom: "Nihonjin", l1: "a Japanese person", alt: ["日本人"], ex: "たなかさん は にほんじん です。", ex_l1: "Ms. Tanaka is Japanese.", note: "Kanji: 日本人."}
      - {id: ja1-09-amerikajin, type: vocab, l2: "アメリカじん", rom: "Amerikajin", l1: "an American (person)", alt: ["アメリカ人"], ex: "わたし は アメリカじん です。", ex_l1: "I am American.", note: "Kanji: アメリカ人."}
      - {id: ja1-09-igirisu, type: vocab, l2: "イギリス", rom: "Igirisu", l1: "the UK / Britain", ex: "スミスさん は イギリスじん です。", ex_l1: "Mr. Smith is British.", note: "From Portuguese 'inglês'."}
