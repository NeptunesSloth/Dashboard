  # ───────────────────────────────────────────────────────────────── 3
  - id: ja1-03
    title: "Hiragana 3: ま to ん, and long vowels"
    goal: "I can read all 46 basic hiragana, hear long vowels, and greet someone."
    notes: |
      The last rows complete the basic table.

      | | a | i | u | e | o |
      |---|---|---|---|---|---|
      | m | ま | み | む | め | も |
      | y | や | | ゆ | | よ |
      | r | ら | り | る | れ | ろ |
      | w | わ | | | | **を o** |

      - **ら-row**: the Japanese r is a quick tap of the tongue, between English r, l and d.
      - **を** sounds exactly like お. It is used for one thing only: the object particle you meet later. Type it *o* (or *wo*, which is how you type it on a keyboard).
      - **ん** (*n*) is the only consonant that stands alone. It is a full beat: に-ほ-ん is three beats.

      ## Long vowels
      A vowel can be held for two beats, and that changes the word. In hiragana you add a vowel sign:

      - long o is usually written **おう**: おはよう (*ohayou*)
      - long e is usually written **えい**: せんせい (*sensei*)
      - long a, i, u double the vowel: ああ, いい, うう

      This course types rōmaji the way the kana are written (*ou*, *ei*), which is also how you type Japanese on a keyboard.

      In **こんにちは** the last sign is は but it is read *wa*: it was once the particle.

      Look-alikes: **ぬ / め**, **ね / れ / わ**, **る / ろ**, **ま / ほ**.
    items:
