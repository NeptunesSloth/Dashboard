      - {id: ja1-02-iie, type: vocab, l2: "いいえ", rom: "iie", l1: "no", note: "Three beats: i-i-e."}
      - {id: ja1-02-inu, type: vocab, l2: "いぬ", rom: "inu", l1: "dog", alt: ["犬"], note: "Kanji: 犬."}
      - {id: ja1-02-neko, type: vocab, l2: "ねこ", rom: "neko", l1: "cat", alt: ["猫"], note: "Kanji: 猫."}
