  # ───────────────────────────────────────────────────────────────── 5
  - id: ja1-05
    title: "Hiragana 5: small ゃ ゅ ょ"
    goal: "I can read combined sounds such as きゃ, しゅ and ちょ and ask someone to wait a moment."
    notes: |
      The last piece of hiragana. A sign from the **い-column** (き, し, ち, に …) followed by a **small** ゃ, ゅ or ょ melts into **one** beat:

      き + ゃ = **きゃ** *kya* (not "ki-ya")

      | | ゃ | ゅ | ょ |
      |---|---|---|---|
      | き | きゃ kya | きゅ kyu | きょ kyo |
      | し | しゃ **sha** | しゅ **shu** | しょ **sho** |
      | ち | ちゃ **cha** | ちゅ **chu** | ちょ **cho** |
      | に | にゃ nya | にゅ nyu | にょ nyo |
      | ひ | ひゃ hya | ひゅ hyu | ひょ hyo |
      | み | みゃ mya | みゅ myu | みょ myo |
      | り | りゃ rya | りゅ ryu | りょ ryo |
      | ぎ | ぎゃ gya | ぎゅ gyu | ぎょ gyo |
      | じ | じゃ **ja** | じゅ **ju** | じょ **jo** |
      | び | びゃ bya | びゅ byu | びょ byo |
      | ぴ | ぴゃ pya | ぴゅ pyu | ぴょ pyo |

      - し, ち and じ lose the y: *sha*, *cha*, *ja*.
      - Size matters. **びょういん** (*byouin*) is a hospital; **びよういん** (*biyouin*, with a full-size よ) is a hair salon.
      - These sounds are very often long: **きょう** *kyou* (today), **ぎゅうにゅう** *gyuunyuu* (milk).

      That is all of hiragana: 46 basic signs, 25 voiced ones and these 33 combinations. You can now read any Japanese word written in kana.
    items:
