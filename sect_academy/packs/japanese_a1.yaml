      - {id: ja1-18-imasu, type: vocab, l2: "います", rom: "imasu", l1: "there is / to have (people and animals; polite ～ます form)", alt: ["居ます"], ex: "へや に ねこ が います。", ex_l1: "There is a cat in the room.", note: "Usually in kana."}
      - {id: ja1-18-koko, type: vocab, l2: "ここ", rom: "koko", l1: "here (this place)", ex: "ここ は としょかん です。", ex_l1: "This (place) is the library."}
