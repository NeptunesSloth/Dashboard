  # ───────────────────────────────────────────────────────────────── 4
  - id: ja1-04
    title: "Hiragana 4: voiced sounds and the small っ"
    goal: "I can read the voiced and p-sounds, hear a doubled consonant, and use the polite greetings."
    notes: |
      No new shapes here: two small marks change signs you already know.

      **゛ (dakuten)** adds voice, and **゜ (handakuten)** turns h into p:

      | | a | i | u | e | o |
      |---|---|---|---|---|---|
      | k → g | が | ぎ | ぐ | げ | ご |
      | s → z | ざ | **じ ji** | ず | ぜ | ぞ |
      | t → d | だ | **ぢ ji** | **づ zu** | で | ど |
      | h → b | ば | び | ぶ | べ | ぼ |
      | h → p | ぱ | ぴ | ぷ | ぺ | ぽ |

      - **じ** is *ji*. **ぢ** and **づ** sound the same as じ and ず and are rare; じ and ず are the ones you will normally see.

      ## The small っ
      A small **っ** is not read "tsu". It doubles the consonant that follows: you stop for one beat, then release.

      - がっこう = *gakkou* (ga-k-ko-o, four beats)
      - きって = *kitte* (stamp); compare きて = *kite*

      ## Being polite
      **ございます** makes a greeting polite. *ありがとう* is for friends; **ありがとう ございます** is for everyone else. The same goes for *おはよう* and **おはよう ございます**.

      From now on words are printed **with a space between them**, as in textbooks for beginners. Real Japanese has no spaces.
    items:
