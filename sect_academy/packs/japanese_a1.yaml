  # ───────────────────────────────────────────────────────────────── 7
  - id: ja1-07
    title: "Katakana 2: ナ to ヨ"
    goal: "I can read the n-, h-, m- and y-rows of katakana and everyday loanwords."
    notes: |
      Eighteen more signs.

      | | a | i | u | e | o |
      |---|---|---|---|---|---|
      | n | ナ | ニ | ヌ | ネ | ノ |
      | h | ハ | ヒ | フ fu | ヘ | ホ |
      | m | マ | ミ | ム | メ | モ |
      | y | ヤ | | ユ | | ヨ |

      ## Help from hiragana
      Some katakana are close to their hiragana twins: **ヘ / へ** (almost identical), **モ / も**, **ヤ / や**, **カ / か**, **キ / き**, **リ / り** (next unit).

      ## Look-alikes
      - **ナ / メ**: a cross and a slash.
      - **ヌ / ス**: ヌ has a stroke crossing through.
      - **マ / ム / ア**: ム is the one that opens upwards.
      - **ノ / ソ**: ノ is a single stroke.
      - **コ / ユ / ヨ**: one, two and three bars.

      ## Japanese-made words
      Loanwords are often cut short: **スマホ** is *sumaato-fon*, a smartphone. Some change meaning: **ノート** is a notebook, not a note.

      Voiced forms work as before: **バ** is ハ with ゛, so **バナナ** is *banana*.

      The word **カタカナ** itself uses four signs you now know.
