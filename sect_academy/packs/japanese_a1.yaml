  # ───────────────────────────────────────────────────────────────── 8
  - id: ja1-08
    title: "Katakana 3: ラ to ン, and loanwords"
    goal: "I can read all katakana and recognise common loanwords for food, places and things."
    notes: |
      The last eight signs.

      | | a | i | u | e | o |
      |---|---|---|---|---|---|
      | r | ラ | リ | ル | レ | ロ |
      | w | ワ | | | | ヲ o |
      | | ン n | | | | |

      **ヲ** exists but is almost never used.

      ## The two hardest pairs
      - **シ** (*shi*) / **ツ** (*tsu*)
      - **ン** (*n*) / **ソ** (*so*)

      In シ and ン the small strokes lie flat and the long stroke sweeps **up**. In ツ and ソ the small strokes stand up and the long stroke sweeps **down**.

      ## Small signs
      Small ャ ュ ョ work as in hiragana: **ジュース** *juusu*, **メニュー** *menyuu*. Katakana also has extra combinations for foreign sounds: ティ *ti* (パーティー, party), ファ *fa*, ウィ *wi*, チェ *che*, ジェ *je*.

      ## Not always English
      - **パン** (bread) is from Portuguese.
      - **コンビニ** is a convenience store, **パソコン** a personal computer, **スーパー** a supermarket.
      - **ジュース** is any soft drink, not only fruit juice.

      Your own name is written in katakana too: Smith is **スミス**, Anna is **アンナ**.
