      - {id: ja1-01-sushi, type: vocab, l2: "すし", rom: "sushi", l1: "sushi", alt: ["寿司"], note: "Kanji: 寿司."}
      - {id: ja1-01-eki, type: vocab, l2: "えき", rom: "eki", l1: "station (train station)", alt: ["駅"], note: "Kanji: 駅."}
