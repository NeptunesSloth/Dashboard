      - {id: ja1-18-mizu-nomitai, type: phrase, l2: "みず を のみたい です。", rom: "Mizu o nomitai desu.", l1: "I want to drink water.", alt: ["水を飲みたいです", "Mizu wo nomitai desu.", "みず が のみたい です。", "Mizu ga nomitai desu.", "水が飲みたいです"], note: "のみます → のみたい です. が is also used: みず が のみたい です. With kanji: 水を飲みたいです"}
      - {id: ja1-18-nihon-ikitai, type: phrase, l2: "にほん へ いきたい です。", rom: "Nihon e ikitai desu.", l1: "I want to go to Japan.", alt: ["日本へ行きたいです", "Nihon he ikitai desu.", "にほん に いきたい です。", "Nihon ni ikitai desu.", "日本に行きたいです"], note: "With kanji: 日本へ行きたいです"}
      - {id: ja1-18-mou-ichido-itte, type: phrase, l2: "もう いちど いって ください。", rom: "Mou ichido itte kudasai.", l1: "Please say it once more. (～て ください form)", alt: ["もう一度言ってください", "Mō ichido itte kudasai."], note: "いって = the て-form of いいます (to say). With kanji: もう一度言ってください"}
      - {id: ja1-18-yukkuri-hanashite, type: phrase, l2: "ゆっくり はなして ください。", rom: "Yukkuri hanashite kudasai.", l1: "Please speak slowly. (～て ください form)", alt: ["ゆっくり話してください"], note: "はなして = the て-form of はなします (to speak). With kanji: ゆっくり話してください"}
      - {id: ja1-18-koko-ni-kaite, type: phrase, l2: "ここ に かいて ください。", rom: "Koko ni kaite kudasai.", l1: "Please write it here.", alt: ["ここに書いてください"], note: "Useful for addresses, prices and names you could not catch. With kanji: ここに書いてください"}
      - {id: ja1-18-tasukete, type: phrase, l2: "たすけて ください。", rom: "Tasukete kudasai.", l1: "Please help me! (in an emergency)", alt: ["助けてください"], note: "For real trouble. For everyday help say すみません. With kanji: 助けてください"}
      - {id: ja1-18-nihongo-wakarimasen, type: phrase, l2: "にほんご が あまり わかりません。", rom: "Nihongo ga amari wakarimasen.", l1: "I don't understand Japanese very well.", alt: ["日本語があまり分かりません", "にほんご は あまり わかりません。", "Nihongo wa amari wakarimasen.", "Nihongo ha amari wakarimasen."], note: "わかります takes が for the thing understood. With kanji: 日本語があまり分かりません"}
      - {id: ja1-18-eigo-wakarimasu-ka, type: phrase, l2: "えいご が わかります か。", rom: "Eigo ga wakarimasu ka.", l1: "Do you understand English?", alt: ["英語が分かりますか", "えいご は わかります か。", "Eigo wa wakarimasu ka.", "Eigo ha wakarimasu ka."], note: "With kanji: 英語が分かりますか"}
      - {id: ja1-18-nihongo-de-nan, type: phrase, l2: "これ は にほんご で なん です か。", rom: "Kore wa Nihongo de nan desu ka.", l1: "What is this in Japanese?", alt: ["これは日本語で何ですか", "Kore ha Nihongo de nan desu ka."], note: "で = by means of, in (a language). With kanji: これは日本語で何ですか"}
      - {id: ja1-18-c1, type: cloze, text: "つくえ の うえ に ほん が ___。", answer: "あります", l1: "There is a book on the desk.", alt: ["arimasu"], note: "Things take あります."}
      - {id: ja1-18-c2, type: cloze, text: "へや に ねこ が ___。", answer: "います", l1: "There is a cat in the room.", alt: ["imasu"], note: "People and animals take います."}
      - {id: ja1-18-c3, type: cloze, text: "えき の ちかく ___ コンビニ が あります。", answer: "に", l1: "There is a convenience store near the station.", alt: ["ni"], note: "に marks the place where something exists (not で)."}
      - {id: ja1-18-c4, type: cloze, text: "かばん の ___ に かぎ が あります。", answer: "なか", l1: "There is a key in the bag.", alt: ["naka", "中"], note: "なか = inside. [thing] の なか に."}
      - {id: ja1-18-c5, type: cloze, text: "こども が ___ います。", answer: "ふたり", l1: "I have two children.", alt: ["futari", "二人", "2人"], note: "People: ひとり, ふたり, さんにん …"}
      - {id: ja1-18-c6, type: cloze, text: "おちゃ を ___ です。", answer: "のみたい", l1: "I want to drink tea.", alt: ["nomitai", "飲みたい"], note: "のみます → のみたい です."}
      - {id: ja1-18-c7, type: cloze, text: "あそこ に せんせい ___ います。", answer: "が", l1: "There is a teacher over there.", alt: ["ga"], note: "が marks what exists."}
