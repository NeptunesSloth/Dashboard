      - {id: ja1-03-kuruma, type: vocab, l2: "くるま", rom: "kuruma", l1: "car", alt: ["車"], note: "Kanji: 車."}
      - {id: ja1-03-yama, type: vocab, l2: "やま", rom: "yama", l1: "mountain", alt: ["山"], note: "Kanji: 山."}
