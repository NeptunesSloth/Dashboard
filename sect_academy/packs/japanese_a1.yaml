      - {id: ja1-06-ko, type: glyph, l2: "コ", rom: "ko"}
      - {id: ja1-06-sa, type: glyph, l2: "サ", rom: "sa"}
      - {id: ja1-06-shi, type: glyph, l2: "シ", rom: "shi"}
      - {id: ja1-06-su, type: glyph, l2: "ス", rom: "su"}
      - {id: ja1-06-se, type: glyph, l2: "セ", rom: "se"}
