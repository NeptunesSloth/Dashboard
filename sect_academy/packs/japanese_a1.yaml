      - {id: ja1-12-happyaku, type: vocab, l2: "はっぴゃく", rom: "happyaku", l1: "eight hundred (800)", alt: ["八百", "800"], note: "はち + ひゃく squeezes to はっぴゃく. 600 is ろっぴゃく. Kanji: 八百."}
      - {id: ja1-12-sanzen, type: vocab, l2: "さんぜん", rom: "sanzen", l1: "three thousand (3,000)", alt: ["三千", "3000"], note: "せん becomes ぜん after さん. Kanji: 三千."}
      - {id: ja1-12-ichiman, type: vocab, l2: "いちまん", rom: "ichiman", l1: "ten thousand (10,000)", alt: ["一万", "10000"], note: "Always with いち: never just まん. Kanji: 一万."}
      - {id: ja1-12-kore-ikura, type: phrase, l2: "これ は いくら です か。", rom: "Kore wa ikura desu ka.", l1: "How much is this?", alt: ["これはいくらですか", "Kore ha ikura desu ka."], note: "With kanji: これはいくらですか"}
      - {id: ja1-12-kore-kudasai, type: phrase, l2: "これ を ください。", rom: "Kore o kudasai.", l1: "This one, please. / I'll take this.", alt: ["これをください", "Kore wo kudasai.", "これ ください。", "Kore kudasai."], note: "を is read o. ください = please give me. With kanji: これをください"}
      - {id: ja1-12-ringo-mittsu, type: phrase, l2: "りんご を みっつ ください。", rom: "Ringo o mittsu kudasai.", l1: "Three apples, please.", alt: ["りんごを三つください", "Ringo wo mittsu kudasai.", "りんご を 3つ ください。"], note: "The number comes after を. With kanji: りんごを三つください"}
