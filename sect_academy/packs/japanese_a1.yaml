  # ───────────────────────────────────────────────────────────────── 6
  - id: ja1-06
    title: "Katakana 1: ア to ト, and the long mark"
    goal: "I can read the first twenty katakana and loanwords with a long vowel."
    notes: |
      **Katakana** has the same 46 sounds as hiragana, in straighter, sharper shapes. It is used for words borrowed from other languages, foreign names and places, and sometimes for emphasis, like italics.

      | | a | i | u | e | o |
      |---|---|---|---|---|---|
      | | ア | イ | ウ | エ | オ |
      | k | カ | キ | ク | ケ | コ |
      | s | サ | シ shi | ス | セ | ソ |
      | t | タ | チ chi | ツ tsu | テ | ト |

      ## What works the same
      - **゛ and ゜**: ガ *ga*, ギ *gi*, ド *do*, パ *pa*. You already know these, so they are not drilled again.
      - The small **ッ** doubles the next consonant: サッカー *sakkaa*.

      ## What is different: ー
      A long vowel is written with a bar, **ー**, not with a second vowel: ケーキ is *ke-e-ki*. The rōmaji here doubles the vowel (*keeki*). The mark is called *chōon*.

      ## Loanwords are reshaped
      Japanese syllables end in a vowel, so extra vowels appear: "test" becomes **テスト** *tesuto*, "taxi" becomes **タクシー** *takushii*. Say the katakana aloud and the English word usually jumps out.

      Look-alikes: **ク / ケ / タ**, **ウ / ワ** (later), and above all **シ / ツ**: the small strokes of シ lie flat, those of ツ stand up.
    items:
      - {id: ja1-06-a, type: glyph, l2: "ア", rom: "a"}
      - {id: ja1-06-i, type: glyph, l2: "イ", rom: "i"}
