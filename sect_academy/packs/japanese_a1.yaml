  # ───────────────────────────────────────────────────────────────── 12
  - id: ja1-12
    title: "Shopping: prices and counting things"
    goal: "I can ask a price, understand it, and ask for a number of things in a shop."
    notes: |
      ## Big numbers
      | | | watch out |
      |---|---|---|
      | 100 | ひゃく | 300 さん**びゃく**, 600 ろっ**ぴゃく**, 800 はっ**ぴゃく** |
      | 1,000 | せん | 3,000 さん**ぜん**, 8,000 はっ**せん** |
      | 10,000 | いち**まん** | 50,000 = ご**まん** |

      Japanese counts in ten-thousands, not thousands: 20,000 is "two man", にまん. Prices end in **えん** (yen): さんびゃく ごじゅう えん = ¥350.

      ## この, その, あの
      これ stands alone. Before a noun use **この / その / あの**: *これ は いくら です か*, but *この かばん は いくら です か*.

      ## Asking for things
      **[thing] を ください** = "[thing], please". **を** marks the thing acted on; it is read *o*. **と** joins two nouns: コーヒー **と** ケーキ.

      ## Counters
      You cannot put a bare number on a noun. For most objects use the native set:

      **ひとつ, ふたつ, みっつ**, よっつ, いつつ, むっつ, ななつ, やっつ, ここのつ, とお

      Some shapes have their own counter: flat things take **まい** (にまい), long thin things take **ほん** (いっぽん, にほん, さんぼん).

      The number comes **after** を: りんご を **みっつ** ください.
    items:
      - {id: ja1-12-k-hyaku, type: glyph, l2: "百", rom: "hyaku", l1: "hundred"}
      - {id: ja1-12-k-sen, type: glyph, l2: "千", rom: "sen", l1: "thousand"}
      - {id: ja1-12-k-man, type: glyph, l2: "万", rom: "man", l1: "ten thousand"}
      - {id: ja1-12-k-en, type: glyph, l2: "円", rom: "en", l1: "yen"}
      - {id: ja1-12-ikura, type: vocab, l2: "いくら", rom: "ikura", l1: "how much (price)", ex: "この ほん は いくら です か。", ex_l1: "How much is this book?"}
      - {id: ja1-12-mise, type: vocab, l2: "みせ", rom: "mise", l1: "shop / store", alt: ["店"], ex: "これ は たなかさん の みせ です。", ex_l1: "This is Mr. Tanaka's shop.", note: "Kanji: 店."}
      - {id: ja1-12-kono, type: vocab, l2: "この", rom: "kono", l1: "this … (before a noun)", ex: "この かさ は わたし の です。", ex_l1: "This umbrella is mine."}
      - {id: ja1-12-sono, type: vocab, l2: "その", rom: "sono", l1: "that … (before a noun; near you)", ex: "その ペン を ください。", ex_l1: "That pen, please."}
      - {id: ja1-12-ano, type: vocab, l2: "あの", rom: "ano", l1: "that … over there (before a noun)", ex: "あの ひと は やまださん です。", ex_l1: "That person over there is Mr. Yamada."}
      - {id: ja1-12-hitotsu, type: vocab, l2: "ひとつ", rom: "hitotsu", l1: "one (thing; general counter)", alt: ["一つ", "1つ"], ex: "ケーキ を ひとつ ください。", ex_l1: "One cake, please.", note: "Kanji: 一つ."}
      - {id: ja1-12-futatsu, type: vocab, l2: "ふたつ", rom: "futatsu", l1: "two (things; general counter)", alt: ["二つ", "2つ"], ex: "りんご を ふたつ ください。", ex_l1: "Two apples, please.", note: "Kanji: 二つ."}
      - {id: ja1-12-mittsu, type: vocab, l2: "みっつ", rom: "mittsu", l1: "three (things; general counter)", alt: ["三つ", "3つ"], ex: "トマト を みっつ ください。", ex_l1: "Three tomatoes, please.", note: "Kanji: 三つ."}
      - {id: ja1-12-ikutsu, type: vocab, l2: "いくつ", rom: "ikutsu", l1: "how many (things)", alt: ["幾つ"], ex: "りんご は いくつ です か。", ex_l1: "How many apples?", note: "With お it also asks age: おいくつ です か."}
