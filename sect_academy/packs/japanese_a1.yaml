  # ───────────────────────────────────────────────────────────────── 13
  - id: ja1-13
    title: "Telling the time"
    goal: "I can ask and tell the time, say when a place opens and closes, and when I get up and go to bed."
    notes: |
      ## Hours
      Number + **じ**: いちじ, にじ, さんじ … Three are irregular: **よじ** (4), **しちじ** (7), **くじ** (9).

      - **はん** = half past: くじ はん = 9:30.
      - **ごぜん** (a.m.) and **ごご** (p.m.) come **before** the time: ごご さんじ.

      ## Minutes
      ふん or ぷん, depending on the number:

      | ふん | ぷん |
      |---|---|
      | 2 にふん, 5 ごふん, 7 ななふん, 9 きゅうふん | 1 いっぷん, 3 さんぷん, 4 よんぷん, 6 ろっぷん, 8 はっぷん, 10 じゅっぷん |

      ## Particles of time
      - **に** marks the point in time when something happens: しちじ **に** おきます.
      - **から** = from, **まで** = until: くじ **から** さんじ **まで**.

      ## Your first verbs
      Polite verbs end in **ます**. This one form covers "I do", "I will do" and habits, for every person: おきます = I get up / she gets up / we will get up. Like です, the verb comes last.

      The kanji 今 (now), 時 (o'clock) and 分 (minute) are on every clock and timetable.
    items:
      - {id: ja1-13-k-ji, type: glyph, l2: "時", rom: "ji", l1: "o'clock; time (じ after a number)"}
      - {id: ja1-13-k-fun, type: glyph, l2: "分", rom: "fun", l1: "minute (ふん or ぷん after a number)", alt: ["pun"]}
      - {id: ja1-13-k-ima, type: glyph, l2: "今", rom: "ima", l1: "now"}
      - {id: ja1-13-nanji, type: vocab, l2: "なんじ", rom: "nanji", l1: "what time", alt: ["何時"], ex: "いま なんじ です か。", ex_l1: "What time is it now?", note: "Kanji: 何時."}
      - {id: ja1-13-ichiji, type: vocab, l2: "いちじ", rom: "ichiji", l1: "one o'clock", alt: ["一時", "1じ", "1時"], ex: "いま いちじ です。", ex_l1: "It is one o'clock now.", note: "Kanji: 一時."}
      - {id: ja1-13-yoji, type: vocab, l2: "よじ", rom: "yoji", l1: "four o'clock", alt: ["四時", "4じ", "4時"], ex: "テスト は よじ まで です。", ex_l1: "The test is until four.", note: "Irregular: not よんじ. Kanji: 四時."}
      - {id: ja1-13-shichiji, type: vocab, l2: "しちじ", rom: "shichiji", l1: "seven o'clock", alt: ["七時", "7じ", "7時"], ex: "しちじ に おきます。", ex_l1: "I get up at seven.", note: "しち, not なな, with じ. Kanji: 七時."}
      - {id: ja1-13-kuji, type: vocab, l2: "くじ", rom: "kuji", l1: "nine o'clock", alt: ["九時", "9じ", "9時"], ex: "がっこう は くじ から です。", ex_l1: "School starts at nine.", note: "Irregular: not きゅうじ. Kanji: 九時."}
      - {id: ja1-13-han, type: vocab, l2: "はん", rom: "han", l1: "half past (said after the hour)", alt: ["半"], ex: "いま にじ はん です。", ex_l1: "It is half past two now.", note: "Kanji: 半."}
      - {id: ja1-13-gozen, type: vocab, l2: "ごぜん", rom: "gozen", l1: "a.m. (said before the hour)", alt: ["午前"], ex: "ごぜん ろくじ です。", ex_l1: "It is 6 a.m.", note: "Kanji: 午前."}
      - {id: ja1-13-gogo, type: vocab, l2: "ごご", rom: "gogo", l1: "p.m. (said before the hour)", alt: ["午後"], ex: "ごご はちじ です。", ex_l1: "It is 8 p.m.", note: "Kanji: 午後."}
      - {id: ja1-13-gofun, type: vocab, l2: "ごふん", rom: "gofun", l1: "five minutes", alt: ["五分", "5ふん", "5分"], ex: "いま さんじ ごふん です。", ex_l1: "It is 3:05 now.", note: "Kanji: 五分."}
      - {id: ja1-13-juppun, type: vocab, l2: "じゅっぷん", rom: "juppun", l1: "ten minutes", alt: ["十分", "じっぷん", "jippun", "10ぷん", "10分"], ex: "いま くじ じゅっぷん です。", ex_l1: "It is 9:10 now.", note: "Also じっぷん. Kanji: 十分."}
      - {id: ja1-13-kara, type: vocab, l2: "から", rom: "kara", l1: "from (particle, after a time or a place)", ex: "テスト は じゅうじ から です。", ex_l1: "The test is from ten o'clock."}
      - {id: ja1-13-made, type: vocab, l2: "まで", rom: "made", l1: "until / as far as (particle)", ex: "みせ は はちじ まで です。", ex_l1: "The shop is open until eight."}
      - {id: ja1-13-hiru, type: vocab, l2: "ひる", rom: "hiru", l1: "noon / daytime", alt: ["昼"], ex: "いま ひる の じゅうにじ です。", ex_l1: "It is twelve noon now.", note: "Kanji: 昼."}
      - {id: ja1-13-yoru, type: vocab, l2: "よる", rom: "yoru", l1: "night / evening", alt: ["夜"], ex: "よる じゅういちじ に ねます。", ex_l1: "I go to bed at eleven at night.", note: "Kanji: 夜."}
      - {id: ja1-13-mainichi, type: vocab, l2: "まいにち", rom: "mainichi", l1: "every day", alt: ["毎日"], ex: "まいにち ろくじ に おきます。", ex_l1: "I get up at six every day.", note: "Kanji: 毎日."}
