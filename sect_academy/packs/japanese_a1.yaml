  # ───────────────────────────────────────────────────────────────── 17
  - id: ja1-17
    title: "Describing things: adjectives and すき"
    goal: "I can describe things and places, say what I like, and make small talk."
    notes: |
      Japanese has two kinds of adjective, and they behave differently.

      | | い-adjectives | な-adjectives |
      |---|---|---|
      | example | たか**い** | しずか |
      | is | たかい です | しずか です |
      | is not | たか**くない** です | しずか **じゃ ありません** |
      | before a noun | たかい ほん | しずか **な** まち |

      - **い-adjectives** end in い. For the negative, drop い and add **くない**.
      - One is irregular: **いい** (good) → **よくない**.
      - **な-adjectives** behave like nouns, and need **な** before a noun. **きれい** ends in い but is a な-adjective: きれい **な** へや.

      ## すき
      "To like" is not a verb in Japanese but the な-adjective **すき**. The thing you like takes **が**: すし **が** すき です. Really like: だいすき.

      ## How much
      - **とても** — very
      - **あまり** + negative — not very: あまり たかくない です.
      - **ちょっと** — a little

      ## ね and よ
      At the end of a sentence **ね** asks for agreement ("isn't it?") and **よ** tells the listener something new ("you know").

      ## Kanji
      大 and 小 are in おおきい 大きい and ちいさい 小さい. Sizes are often labelled 大・中・小 (*dai, chuu, shou*): large, medium, small.
