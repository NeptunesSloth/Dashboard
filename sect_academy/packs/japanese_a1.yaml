id: japanese-a1
title: "Japanese — A1 Beginner"
kind: language
language: Japanese
lang: ja-JP
hall: tongues_west
blurb: "Start Japanese from zero: hiragana, katakana and your first 40 kanji, then polite everyday Japanese for introductions, shopping, time, daily life and getting help."

units:
  # ───────────────────────────────────────────────────────────────── 1
  - id: ja1-01
    title: "Hiragana 1: あ to そ"
    goal: "I can read and type the first fifteen hiragana and a few real words written with them."
    notes: |
      Japanese is written with three scripts side by side. **Hiragana** (46 basic signs) spells grammar and native words, **katakana** spells foreign words, and **kanji** (Chinese characters) carry meaning. You start with hiragana, because everything can be written in it.

      Each sign is one beat of sound, and it is always read the same way. There are only five vowels, short and clean:

      | あ a | い i | う u | え e | お o |
      |---|---|---|---|---|
      | f**a**ther | mach**i**ne | fl**u**te, lips relaxed | p**e**t | **o**ld |

      A consonant row just adds a consonant in front:

      | | a | i | u | e | o |
      |---|---|---|---|---|---|
      | k | か | き | く | け | こ |
      | s | さ | **し shi** | す | せ | そ |

      - **し** is *shi*, not "si". It is the first of a handful of irregular readings.
      - Every beat is the same length and the same loudness: *su-shi*, not "SOO-shee".
      - Look-alikes: **あ / お**, **い / こ**, **き / さ** (き has two bars).

      When the app asks how a sign is read, type the rōmaji (*ka*). When it asks for a word, you may type rōmaji (*sushi*) or the kana themselves (すし).
    items:
      - {id: ja1-01-a, type: glyph, l2: "あ", rom: "a"}
      - {id: ja1-01-i, type: glyph, l2: "い", rom: "i"}
      - {id: ja1-01-u, type: glyph, l2: "う", rom: "u"}
      - {id: ja1-01-e, type: glyph, l2: "え", rom: "e"}
      - {id: ja1-01-o, type: glyph, l2: "お", rom: "o", alt: ["を"]}
      - {id: ja1-01-ka, type: glyph, l2: "か", rom: "ka"}
      - {id: ja1-01-ki, type: glyph, l2: "き", rom: "ki"}
      - {id: ja1-01-ku, type: glyph, l2: "く", rom: "ku"}
      - {id: ja1-01-ke, type: glyph, l2: "け", rom: "ke"}
      - {id: ja1-01-ko, type: glyph, l2: "こ", rom: "ko"}
      - {id: ja1-01-sa, type: glyph, l2: "さ", rom: "sa"}
      - {id: ja1-01-shi, type: glyph, l2: "し", rom: "shi"}
      - {id: ja1-01-su, type: glyph, l2: "す", rom: "su"}
