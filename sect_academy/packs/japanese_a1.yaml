  # ───────────────────────────────────────────────────────────────── 18
  - id: ja1-18
    title: "What there is, what I want, and getting help"
    goal: "I can say where things and people are, say what I want to do, and ask for help when I am stuck."
    notes: |
      ## あります and います
      Both mean "there is" and "to have". Things and plants take **あります**; people and animals take **います**.

      - [place] **に** [thing] **が あります** — there is a … in/at …: えき の ちかく **に** コンビニ **が あります**。
      - [thing] **は** [place] **に あります** — the … is in/at …: トイレ **は** あそこ **に あります**。

      Position words are nouns, joined with の: つくえ **の うえ** に (on the desk), かばん **の なか** に (in the bag). うえ 上, した 下, なか 中, まえ, となり, ちかく, みぎ, ひだり.

      **ここ / そこ / あそこ** follow the same three zones as これ / それ / あれ.

      ## Counting people
      **ひとり** (1), **ふたり** (2), then number + にん: さんにん, よにん … こども が ふたり います = I have two children.

      ## I want to …
      Swap ます for **たい** and add です: のみ**ます** → のみ**たい です**. Use it for your own wishes only.

      ## Please …
      **～て ください** is a polite request. The て-form belongs to the next course; for now learn these as whole phrases: **いって ください** (please say), **はなして ください** (please speak), **かいて ください** (please write), **まって ください** (please wait).
