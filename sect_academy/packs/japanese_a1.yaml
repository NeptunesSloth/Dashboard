  # ───────────────────────────────────────────────────────────────── 11
  - id: ja1-11
    title: "Numbers, age and telephone numbers"
    goal: "I can count to 99, give my age and say a telephone number."
    notes: |
      The numbers 1 to 10 are taught here as **kanji**: you will see them on every menu and price tag, and they are the easiest kanji there are.

      Three numbers have two readings. Learn the first as your default:

      - 4 = **よん** (also し)
      - 7 = **なな** (also しち)
      - 9 = **きゅう** (also く)

      ## Beyond ten
      Japanese numbers are pure arithmetic: say the tens, then the units.

      | | | |
      |---|---|---|
      | 11 | じゅう + いち | じゅういち |
      | 20 | に × じゅう | にじゅう |
      | 35 | さん × じゅう + ご | さんじゅうご |
      | 99 | | きゅうじゅうきゅう |

      ## Telephone numbers
      Read each digit on its own. Zero is **ゼロ** (or れい), and the hyphen is read **の**.

      ## Age
      Add **さい** to the number: にじゅうご**さい** = 25 years old. Three numbers squeeze: **いっさい** (1), **はっさい** (8), **じゅっさい** (10). Twenty has its own word, **はたち**. The polite question is **おいくつ です か**.

      ## My family, your family
      For your own parents say **ちち** and **はは**. For someone else's, the respectful words are おとうさん and おかあさん.
