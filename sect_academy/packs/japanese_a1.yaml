  # ───────────────────────────────────────────────────────────────── 16
  - id: ja1-16
    title: "Yesterday, and let's …"
    goal: "I can say what I did and did not do, invite someone, and accept or decline politely."
    notes: |
      ## The four polite endings
      | | present / future | past |
      |---|---|---|
      | positive | たべ**ます** | たべ**ました** |
      | negative | たべ**ません** | たべ**ませんでした** |

      Every verb follows this table; only the ending changes. です has its own past: **でした**.

      Past time words such as **きのう**, **せんしゅう** and **きょねん** take no に.

      ## Nothing, nowhere
      A question word + **も** + a negative verb: **なに も** たべませんでした (I ate nothing), **どこ も** いきませんでした (I went nowhere).

      ## Inviting
      - **～ません か** — "won't you …?", the polite way to invite: いっしょ に たべ**ません か**。
      - **～ましょう** — "let's …": いき**ましょう**。

      To accept: **ええ、いい です ね。** To decline, do not say a flat いいえ. Trail off instead: **すみません、ちょっと …** ("sorry, it's a bit …").

      ## Meeting people
      あいます takes **に** (or と) for the person you meet: ともだち **に** あいます.

      ## Kanji
      年 is "year": きょ**ねん** 去年 (last year), らい**ねん** 来年 (next year). In ことし 今年 (this year) it is read とし.
    items:
      - {id: ja1-16-k-nen, type: glyph, l2: "年", rom: "nen", l1: "year (ねん; とし in ことし)", alt: ["toshi"]}
