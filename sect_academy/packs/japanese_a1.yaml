  # ───────────────────────────────────────────────────────────────── 15
  - id: ja1-15
    title: "Daily life: を and で"
    goal: "I can say what I eat, drink, read, watch and study, and where I do it."
    notes: |
      Most verbs act on something. That something is marked with **を** (written を, read *o*):

      **[thing] を [verb]** — コーヒー **を** のみます。 I drink coffee.

      The place where an action happens is marked with **で**:

      **[place] で [thing] を [verb]** — うち **で** ほん **を** よみます。 I read books at home.

      Do not confuse the place particles: you *go* **へ / に** a place, but you *do things* **で** a place.

      ## します
      **します** means "to do", and it turns many nouns into verbs: べんきょう (study) → **べんきょう します** (to study); テニス を します (to play tennis).

      ## How often
      - **いつも** — always
      - **ときどき** — sometimes
      - **あまり** + negative — not much: テレビ は **あまり** みません。

      ## At the table
      Before eating say **いただきます**; after the meal, **ごちそうさま でした**. Both are said even when you eat alone.

      ## Kanji
      学, 生 and 先 build three words you already know: 学生 **がくせい** (student), 先生 **せんせい** (teacher, "born before") and 学校 **がっこう** (school).
    items:
      - {id: ja1-15-k-gaku, type: glyph, l2: "学", rom: "gaku", l1: "study; learning (がく in がくせい; がっ in がっこう)"}
      - {id: ja1-15-k-sei, type: glyph, l2: "生", rom: "sei", l1: "life; birth (せい in がくせい and せんせい)"}
      - {id: ja1-15-k-sen, type: glyph, l2: "先", rom: "sen", l1: "ahead; before (せん in せんせい)"}
      - {id: ja1-15-tabemasu, type: vocab, l2: "たべます", rom: "tabemasu", l1: "to eat (polite ～ます form)", alt: ["食べます"], ex: "あさ パン を たべます。", ex_l1: "I eat bread in the morning.", note: "Kanji: 食べます."}
      - {id: ja1-15-nomimasu, type: vocab, l2: "のみます", rom: "nomimasu", l1: "to drink (polite ～ます form)", alt: ["飲みます"], ex: "まいにち おちゃ を のみます。", ex_l1: "I drink tea every day.", note: "Kanji: 飲みます."}
      - {id: ja1-15-mimasu, type: vocab, l2: "みます", rom: "mimasu", l1: "to see / to watch (polite ～ます form)", alt: ["見ます"], ex: "よる テレビ を みます。", ex_l1: "I watch television in the evening.", note: "Kanji: 見ます."}
      - {id: ja1-15-yomimasu, type: vocab, l2: "よみます", rom: "yomimasu", l1: "to read (polite ～ます form)", alt: ["読みます"], ex: "でんしゃ で しんぶん を よみます。", ex_l1: "I read the newspaper on the train.", note: "Kanji: 読みます."}
      - {id: ja1-15-kakimasu, type: vocab, l2: "かきます", rom: "kakimasu", l1: "to write (polite ～ます form)", alt: ["書きます"], ex: "ノート に なまえ を かきます。", ex_l1: "I write my name in the notebook.", note: "Kanji: 書きます."}
      - {id: ja1-15-kikimasu, type: vocab, l2: "ききます", rom: "kikimasu", l1: "to listen / to hear (polite ～ます form)", alt: ["聞きます"], ex: "くるま で おんがく を ききます。", ex_l1: "I listen to music in the car.", note: "Also 'to ask'. Kanji: 聞きます."}
