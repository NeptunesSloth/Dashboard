      - {id: ja1-03-sayounara, type: phrase, l2: "さようなら。", rom: "Sayounara.", l1: "Goodbye.", alt: ["Sayōnara."], note: "Long o: sa-yo-o-na-ra. Fairly final; not used when you will meet again in an hour."}
