  # ───────────────────────────────────────────────────────────────── 2
  - id: ja1-02
    title: "Hiragana 2: た to ほ"
    goal: "I can read and type the t-, n- and h-rows of hiragana and say yes and no."
    notes: |
      Three more rows. The pattern is the same, with three irregular readings that you must learn exactly, because they are how the signs are really pronounced.

      | | a | i | u | e | o |
      |---|---|---|---|---|---|
      | t | た | **ち chi** | **つ tsu** | て | と |
      | n | な | に | ぬ | ね | の |
      | h | は | ひ | **ふ fu** | へ | ほ |

      - **ち** is *chi* and **つ** is *tsu* (the "ts" of "cats"). There is no "ti" or "tu" in native Japanese words.
      - **ふ** is *fu*, but softer than English f: blow air between both lips, without touching your teeth.
      - Later you will meet **は** and **へ** used as grammar particles. Then, and only then, they are read *wa* and *e*. As plain letters they are *ha* and *he*.

      ## Look-alikes
      - **は / ほ**: ほ has an extra bar on top.
      - **た / な**, **に / こ**, **ぬ / ね**: check the loop.
      - **つ / し**: つ curls from left to right, し drops down and hooks up.
      - **ち / さ**: mirror images.

      ## Yes and no
      **はい** is "yes" and **いいえ** is "no". The doubled い in いいえ is held for two beats: *i-i-e*.
    items:
      - {id: ja1-02-ta, type: glyph, l2: "た", rom: "ta"}
      - {id: ja1-02-chi, type: glyph, l2: "ち", rom: "chi"}
      - {id: ja1-02-tsu, type: glyph, l2: "つ", rom: "tsu"}
      - {id: ja1-02-te, type: glyph, l2: "て", rom: "te"}
      - {id: ja1-02-to, type: glyph, l2: "と", rom: "to"}
      - {id: ja1-02-na, type: glyph, l2: "な", rom: "na"}
      - {id: ja1-02-ni, type: glyph, l2: "に", rom: "ni"}
      - {id: ja1-02-nu, type: glyph, l2: "ぬ", rom: "nu"}
      - {id: ja1-02-ne, type: glyph, l2: "ね", rom: "ne"}
      - {id: ja1-02-no, type: glyph, l2: "の", rom: "no"}
      - {id: ja1-02-ha, type: glyph, l2: "は", rom: "ha"}
