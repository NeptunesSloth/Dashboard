id: french-b2
title: "French — B2 Upper Intermediate"
kind: language
language: French
lang: fr-FR
hall: tongues_west
blurb: "Argue, persuade and read for real: every use of the subjunctive, all three si clauses, reported speech, the passive, complex relatives, formal letters, sixty idioms, and conversations for debates, interviews and complaints."

units:
  # ───────────────────────────────────────────────────────────────── 1
  - id: fr4-01
    title: "Work and the economy: the subjunctive of will and necessity"
    goal: "I can discuss jobs, careers and the economy and say what must happen or what people demand, expect or refuse, using the subjunctive."
    notes: |
      At B1 you met **il faut que**. Many more expressions of necessity and will take the **subjonctif**:

      - **Necessity:** *il est nécessaire / essentiel / indispensable / important que, il est temps que, il vaut mieux que, il n'est pas question que*.
      - **Will:** *exiger que, demander que, vouloir que, refuser que, accepter que, attendre que, tenir à ce que, s'attendre à ce que*.

      *Le syndicat **exige que** la direction **prenne** une décision.*

      ## Verbs with two stems
      The *nous* and *vous* forms come from *nous* in the present; the others from *ils*:

      | verb | que je | que nous |
      |---|---|---|
      | prendre | prenne | prenions |
      | recevoir | reçoive | recevions |
      | devoir | doive | devions |
      | voir | voie | voyions |
      | vouloir | veuille | voulions |
      | savoir | sache | sachions |

      ## Same subject? Use the infinitive
      *Je tiens **à finir** ce soir* (I finish) but *je tiens **à ce que tu finisses*** (you finish). *Tenir à* and *s'attendre à* need **à ce que** before a clause.

      English often hides the subjunctive behind a past tense or an infinitive: *It's time you **left*** = *Il est temps que tu **partes***.
    items:
      - {id: fr-b2-01-embaucher, type: vocab, l2: "embaucher", l1: "to hire / to take on (staff)", alt: ["recruter"], ex: "L'entreprise va embaucher dix personnes cette année.", ex_l1: "The company is going to hire ten people this year.", note: "l'embauche = hiring. The opposite is licencier."}
      - {id: fr-b2-01-licencier, type: vocab, l2: "licencier", l1: "to dismiss / to lay off (an employee)", alt: ["renvoyer"], ex: "L'usine a licencié deux cents salariés.", ex_l1: "The factory laid off two hundred employees.", note: "le licenciement = the dismissal, the redundancy. Casual: virer (to fire)."}
      - {id: fr-b2-01-demissionner, type: vocab, l2: "démissionner", l1: "to resign / to quit (a job)", ex: "Elle a démissionné pour créer sa propre entreprise.", ex_l1: "She resigned to start her own company.", note: "la démission = the resignation."}
      - {id: fr-b2-01-entretien-d-embauche, type: vocab, l2: "l'entretien d'embauche", l1: "the job interview", alt: ["l'entretien"], ex: "J'ai un entretien d'embauche jeudi.", ex_l1: "I have a job interview on Thursday.", note: "Masculine: un entretien. une interview is for the media."}
      - {id: fr-b2-01-candidature, type: vocab, l2: "la candidature", l1: "the application (for a job)", ex: "J'ai envoyé ma candidature par mail.", ex_l1: "I sent my application by email.", note: "poser sa candidature = to apply; postuler à un poste is also common. le candidat, la candidate = the applicant."}
      - {id: fr-b2-01-employeur, type: vocab, l2: "l'employeur", l1: "the employer", ex: "Mon employeur me paie la formation.", ex_l1: "My employer is paying for my training.", note: "Masculine. The employee is le salarié or l'employé."}
      - {id: fr-b2-01-pme, type: vocab, l2: "la PME", l1: "the small or medium-sized business (SME)", ex: "Les PME créent beaucoup d'emplois.", ex_l1: "Small businesses create a lot of jobs.", note: "Short for petite et moyenne entreprise, so feminine. Say 'pé-em-eu'."}
      - {id: fr-b2-01-salarie, type: vocab, l2: "le salarié", l1: "the employee (on a salary; a man)", alt: ["l'employé"], ex: "Cette PME compte cinquante salariés.", ex_l1: "This SME has fifty employees.", note: "Feminine: la salariée. compter = to have, to number."}
      - {id: fr-b2-01-cdi, type: vocab, l2: "le CDI", l1: "the permanent job contract (abbreviation)", alt: ["le contrat à durée indéterminée"], ex: "Après deux ans, elle a enfin obtenu un CDI.", ex_l1: "After two years, she finally got a permanent contract.", note: "Say 'cé-dé-i'. A fixed-term contract is un CDD (contrat à durée déterminée)."}
      - {id: fr-b2-01-formation, type: vocab, l2: "la formation", l1: "training / a training course (for a job)", ex: "Je suis une formation en informatique.", ex_l1: "I'm doing a training course in IT.", note: "suivre une formation = to take a course. Je suis here is from suivre, not être."}
      - {id: fr-b2-01-prime, type: vocab, l2: "la prime", l1: "the bonus (extra pay)", ex: "Les salariés ont reçu une prime en décembre.", ex_l1: "The employees received a bonus in December.", note: "Also an insurance premium."}
      - {id: fr-b2-01-augmentation, type: vocab, l2: "l'augmentation", l1: "the pay rise / the raise", ex: "J'ai demandé une augmentation à mon patron.", ex_l1: "I asked my boss for a pay rise.", note: "Feminine. Also any increase: l'augmentation des prix."}
      - {id: fr-b2-01-syndicat, type: vocab, l2: "le syndicat", l1: "the trade union", ex: "Les syndicats appellent à la grève.", ex_l1: "The unions are calling for a strike.", note: "un syndicaliste = a union activist."}
      - {id: fr-b2-01-retraite, type: vocab, l2: "la retraite", l1: "retirement / the pension", ex: "Mon père prend sa retraite l'année prochaine.", ex_l1: "My father is retiring next year.", note: "prendre sa retraite = to retire; être à la retraite = to be retired; un retraité = a pensioner."}
      - {id: fr-b2-01-teletravail, type: vocab, l2: "le télétravail", l1: "remote working / working from home", ex: "Je suis en télétravail deux jours par semaine.", ex_l1: "I work from home two days a week.", note: "être en télétravail. The verb télétravailler is also heard."}
      - {id: fr-b2-01-croissance, type: vocab, l2: "la croissance", l1: "growth (economic)", ex: "La croissance a ralenti cette année.", ex_l1: "Growth slowed down this year.", note: "From croître, to grow. ralentir = to slow down."}
      - {id: fr-b2-01-crise, type: vocab, l2: "la crise", l1: "the crisis", ex: "Beaucoup d'entreprises ont fermé pendant la crise.", ex_l1: "Many businesses closed during the crisis.", note: "Plural: les crises. une crise de nerfs = a fit of hysterics."}
      - {id: fr-b2-01-pouvoir-d-achat, type: vocab, l2: "le pouvoir d'achat", l1: "purchasing power / spending power", ex: "L'inflation fait baisser le pouvoir d'achat.", ex_l1: "Inflation reduces purchasing power.", note: "A key phrase in French political debate."}
      - {id: fr-b2-01-hausse, type: vocab, l2: "la hausse", l1: "the rise (in prices or figures)", ex: "Les prix de l'énergie sont en hausse.", ex_l1: "Energy prices are rising.", note: "en hausse = rising. The h is aspirate: la hausse, never l'hausse."}
      - {id: fr-b2-01-baisse, type: vocab, l2: "la baisse", l1: "the fall / the drop (in prices or figures)", ex: "On observe une baisse du chômage.", ex_l1: "We are seeing a fall in unemployment.", note: "en baisse = falling. baisser = to go down, to lower."}
      - {id: fr-b2-01-chiffre-d-affaires, type: vocab, l2: "le chiffre d'affaires", l1: "the turnover / the revenue (of a business)", ex: "Notre chiffre d'affaires a augmenté de dix pour cent.", ex_l1: "Our turnover has increased by ten per cent.", note: "The profit is le bénéfice."}
      - {id: fr-b2-01-exiger, type: vocab, l2: "exiger", l1: "to demand / to require", ex: "Le client exige un remboursement.", ex_l1: "The customer is demanding a refund.", note: "nous exigeons (keep the e before o). exiger que + subjunctive."}
      - {id: fr-b2-01-s-attendre-a, type: vocab, l2: "s'attendre à", l1: "to expect (something to happen)", ex: "Je ne m'attendais pas à une telle réponse.", ex_l1: "I wasn't expecting such an answer.", note: "s'attendre à ce que + subjunctive: Je m'attends à ce qu'il refuse."}
      - {id: fr-b2-01-concurrence, type: vocab, l2: "la concurrence", l1: "competition (between businesses)", ex: "La concurrence est très forte dans ce secteur.", ex_l1: "Competition is very strong in this sector.", note: "un concurrent = a competitor. In sport, 'a competition' is une compétition."}
      - {id: fr-b2-01-il-est-temps, type: phrase, l2: "Il est temps que tu prennes une décision.", l1: "It's time you made a decision. (informal)", alt: ["Il est temps que tu te décides."], note: "il est temps que + subjunctive, where English uses a past tense."}
      - {id: fr-b2-01-je-tiens-a-ce-que, type: phrase, l2: "Je tiens à ce que tout soit prêt à neuf heures.", l1: "I insist that everything is ready at nine o'clock.", alt: ["Je tiens à ce que tout soit prêt à 9 heures.", "Je tiens à ce que tout soit prêt pour neuf heures.", "Je tiens à ce que tout soit prêt pour 9 heures."], note: "tenir à ce que + subjunctive = to insist, to be keen that. Same subject: je tiens à venir."}
      - {id: fr-b2-01-il-vaudrait-mieux, type: phrase, l2: "Il vaudrait mieux que vous partiez tôt.", l1: "It would be better for you to leave early. (formal)", alt: ["Il vaut mieux que vous partiez tôt.", "Il serait préférable que vous partiez tôt."], note: "il vaut mieux que + subjunctive. partir → que vous partiez."}
      - {id: fr-b2-01-pas-question, type: phrase, l2: "Il n'est pas question que je travaille le dimanche.", l1: "There's no question of my working on Sundays.", alt: ["Pas question que je travaille le dimanche.", "Il est hors de question que je travaille le dimanche."], note: "(il n'est) pas question que + subjunctive: a firm refusal."}
      - {id: fr-b2-01-pain-sur-la-planche, type: phrase, l2: "J'ai du pain sur la planche.", l1: "I've got a lot on my plate. (idiom with bread)", note: "Literally 'I have bread on the board': a lot of work ahead."}
      - {id: fr-b2-01-main-a-la-pate, type: phrase, l2: "Tout le monde doit mettre la main à la pâte.", l1: "Everyone has to pitch in. (idiom)", note: "Literally 'put your hand in the dough'."}
      - {id: fr-b2-01-c1, type: cloze, text: "Le directeur exige que nous ___ le rapport avant vendredi.", answer: "rendions", alt: ["remettions"], l1: "The director demands that we hand in the report before Friday.", note: "exiger que + subjunctive. rendre → que nous rendions."}
      - {id: fr-b2-01-c2, type: cloze, text: "Il est indispensable que vous ___ anglais.", answer: "parliez", l1: "It is essential that you speak English.", note: "il est indispensable / essentiel / nécessaire que + subjunctive. vous → -iez."}
      - {id: fr-b2-01-c3, type: cloze, text: "Il est important que les salariés ___ ce qui se passe.", answer: "sachent", l1: "It is important that the employees know what is going on.", note: "savoir → qu'ils sachent (irregular stem sach-)."}
      - {id: fr-b2-01-c4, type: cloze, text: "Il est normal qu'elle ___ une augmentation.", answer: "veuille", l1: "It's normal that she wants a pay rise.", note: "vouloir → qu'elle veuille, que nous voulions, qu'ils veuillent."}
      - {id: fr-b2-01-c5, type: cloze, text: "Je ne veux pas que tu ___ partir si tôt.", answer: "doives", l1: "I don't want you to have to leave so early. (informal)", note: "devoir → que tu doives, but que nous devions."}
      - {id: fr-b2-01-c6, type: cloze, text: "Il est temps que les salariés ___ leur prime.", answer: "reçoivent", alt: ["touchent"], l1: "It's time the employees received their bonus.", note: "recevoir → qu'ils reçoivent, but que nous recevions."}
      - {id: fr-b2-01-c7, type: cloze, text: "Il vaut mieux que nous ___ une décision rapidement.", answer: "prenions", l1: "It's better that we make a decision quickly.", note: "Two stems: que je prenne, but que nous prenions (from nous prenons)."}
      - {id: fr-b2-01-c8, type: cloze, text: "Mon patron veut que je ___ les clients demain matin.", answer: "voie", alt: ["rencontre", "reçoive"], l1: "My boss wants me to see the clients tomorrow morning.", note: "voir → que je voie, que nous voyions. It sounds just like vois."}
      - {id: fr-b2-01-c9, type: cloze, text: "Je tiens à ce que tout le monde ___ à l'heure.", answer: "soit", l1: "I insist that everyone is on time.", note: "tenir à ce que + subjunctive. tout le monde takes a singular verb."}
      - {id: fr-b2-01-c10, type: cloze, text: "Elle tient ___ finir avant ce soir.", answer: "à", l1: "She is keen to finish before this evening.", note: "Same subject → tenir à + infinitive, with no que."}
      - {id: fr-b2-01-c11, type: cloze, text: "Nous nous attendons à ___ que les prix augmentent.", answer: "ce", l1: "We expect prices to go up.", note: "s'attendre à ce que + subjunctive (augmentent looks the same in both moods)."}
      - {id: fr-b2-01-c12, type: cloze, text: "Il faut absolument que le gouvernement ___ quelque chose contre le chômage.", answer: "fasse", l1: "The government absolutely must do something about unemployment.", note: "faire → qu'il fasse."}
      - {id: fr-b2-01-c13, type: cloze, text: "J'attends que le directeur me ___.", answer: "réponde", l1: "I'm waiting for the director to answer me.", note: "attendre que + subjunctive: you are waiting for someone else to act."}
      - {id: fr-b2-01-c14, type: cloze, text: "Le syndicat demande que les salaires ___ augmentés.", answer: "soient", l1: "The union is demanding that wages be increased.", note: "demander que + subjunctive, here a passive: que les salaires soient augmentés."}
      - {id: fr-b2-01-c15, type: cloze, text: "Il faudrait que tu ___ ta candidature avant lundi.", answer: "envoies", alt: ["déposes"], l1: "You ought to send your application before Monday. (informal)", note: "il faudrait que (conditional) + present subjunctive: a softer 'you ought to'."}

  # ───────────────────────────────────────────────────────────────── 2
  - id: fr4-02
    title: "Society and politics: subjunctive or indicative?"
    goal: "I can discuss social and political issues and choose correctly between the indicative and the subjunctive when I give opinions, weigh probability, doubt or react."
    notes: |
      The key question is: does the main clause present the fact as **real**, or as **doubtful, possible or felt**?

      | indicative (presented as true) | subjunctive (doubted, possible, felt) |
      |---|---|
      | je pense / crois / trouve que | je ne pense pas que, penses-tu que… ? |
      | je suis sûr que | je ne suis pas sûr que |
      | il est probable que | il est possible que, il se peut que |
      | il me semble que | il semble que |
      | il est évident / clair / vrai que | il est peu probable que |
      | j'espère que | je souhaite que |

      - **Doubt and denial:** *douter que, nier que* → subjunctive.
      - **Emotion and judgement:** *regretter que, se réjouir que, avoir honte que, craindre que, il est inadmissible / scandaleux / normal que* → subjunctive.
      - **Questions:** with inversion (*Croyez-vous qu'il **ait** raison ?*) the subjunctive is standard; with *est-ce que* many speakers use the indicative.

      Watch the little pronoun: ***il me semble que*** *c'est vrai* (my impression) but ***il semble que*** *ce **soit** vrai* (it appears).

      *Craindre que* is often followed by a **ne** that is not negative: *je crains qu'il **ne** soit trop tard* (unit 11).
    items:
      - {id: fr-b2-02-elections, type: vocab, l2: "les élections", l1: "the elections", ex: "Les élections auront lieu en juin.", ex_l1: "The elections will take place in June.", note: "Feminine: une élection. élire = to elect; un électeur, une électrice = a voter."}
      - {id: fr-b2-02-depute, type: vocab, l2: "le député", l1: "the member of parliament / the MP (a man)", ex: "Le député a voté contre le projet de loi.", ex_l1: "The MP voted against the bill.", note: "Feminine: la députée. French MPs sit in l'Assemblée nationale."}
      - {id: fr-b2-02-citoyen, type: vocab, l2: "le citoyen", l1: "the citizen (a man)", ex: "Chaque citoyen a le droit de voter.", ex_l1: "Every citizen has the right to vote.", note: "Feminine: la citoyenne. la citoyenneté = citizenship."}
      - {id: fr-b2-02-voter, type: vocab, l2: "voter", l1: "to vote / to pass (a law)", ex: "Tu as voté aux dernières élections ?", ex_l1: "Did you vote in the last elections?", note: "voter pour / contre quelqu'un. With a law as its object it means to pass: voter une loi."}
      - {id: fr-b2-02-droit, type: vocab, l2: "le droit", l1: "the right (something you are entitled to)", ex: "Les Françaises ont obtenu le droit de vote en 1944.", ex_l1: "French women got the right to vote in 1944.", note: "avoir le droit de + infinitive = to be allowed to. le droit is also law as a subject."}
      - {id: fr-b2-02-egalite, type: vocab, l2: "l'égalité", l1: "equality", ex: "Liberté, égalité, fraternité.", ex_l1: "Liberty, equality, fraternity.", note: "Feminine. The French national motto. Its opposite: les inégalités (inequality), usually plural."}
      - {id: fr-b2-02-manifestation, type: vocab, l2: "la manifestation", l1: "the demonstration / the protest march", alt: ["la manif"], ex: "Des milliers de personnes ont participé à la manifestation.", ex_l1: "Thousands of people took part in the demonstration.", note: "manifester = to demonstrate. Casual: la manif."}
      - {id: fr-b2-02-pouvoir, type: vocab, l2: "le pouvoir", l1: "power (political)", ex: "Ce parti est au pouvoir depuis dix ans.", ex_l1: "This party has been in power for ten years.", note: "The same word as the verb pouvoir. être au pouvoir = to be in power."}
      - {id: fr-b2-02-gauche, type: vocab, l2: "la gauche", l1: "the left (in politics)", ex: "La gauche a gagné les élections.", ex_l1: "The left won the elections.", note: "être de gauche = to be left-wing. The opposite is la droite."}
      - {id: fr-b2-02-droite, type: vocab, l2: "la droite", l1: "the right (in politics)", ex: "Elle a toujours voté à droite.", ex_l1: "She has always voted for the right.", note: "être de droite = to be right-wing."}
      - {id: fr-b2-02-debat, type: vocab, l2: "le débat", l1: "the debate", ex: "Le débat entre les deux candidats était tendu.", ex_l1: "The debate between the two candidates was tense.", note: "débattre de quelque chose = to debate something."}
      - {id: fr-b2-02-sondage, type: vocab, l2: "le sondage", l1: "the opinion poll", ex: "D'après le dernier sondage, elle est en tête.", ex_l1: "According to the latest poll, she is in the lead.", note: "être en tête = to be in the lead."}
      - {id: fr-b2-02-reforme, type: vocab, l2: "la réforme", l1: "the reform", ex: "La réforme des retraites a provoqué des grèves.", ex_l1: "The pension reform led to strikes.", note: "réformer = to reform."}
      - {id: fr-b2-02-pauvrete, type: vocab, l2: "la pauvreté", l1: "poverty", ex: "Des millions de personnes vivent dans la pauvreté.", ex_l1: "Millions of people live in poverty.", note: "With an article, like most abstract nouns. pauvre = poor."}
      - {id: fr-b2-02-logement, type: vocab, l2: "le logement", l1: "housing / accommodation", ex: "Le prix du logement augmente dans les grandes villes.", ex_l1: "The cost of housing is rising in big cities.", note: "Also a single flat or house: chercher un logement."}
      - {id: fr-b2-02-mondialisation, type: vocab, l2: "la mondialisation", l1: "globalisation", ex: "La mondialisation a des avantages et des inconvénients.", ex_l1: "Globalisation has advantages and disadvantages.", note: "From le monde. un inconvénient = a drawback."}
      - {id: fr-b2-02-nier, type: vocab, l2: "nier", l1: "to deny", ex: "Il nie avoir menti.", ex_l1: "He denies having lied.", note: "nier que + subjunctive; nier + infinitive when the subject is the same."}
      - {id: fr-b2-02-se-rejouir, type: vocab, l2: "se réjouir", l1: "to be delighted / to rejoice", ex: "Je me réjouis de vous revoir.", ex_l1: "I'm delighted to see you again.", note: "se réjouir que + subjunctive; se réjouir de + infinitive. In Switzerland and Belgium it also means 'to look forward to'."}
      - {id: fr-b2-02-craindre, type: vocab, l2: "craindre", l1: "to fear", ex: "Je crains le pire.", ex_l1: "I fear the worst.", note: "je crains, nous craignons; past participle craint. craindre que + subjunctive."}
      - {id: fr-b2-02-avoir-honte, type: vocab, l2: "avoir honte", l1: "to be ashamed", ex: "J'ai honte de mon comportement.", ex_l1: "I'm ashamed of my behaviour.", note: "No article: avoir honte de. The h is aspirate: la honte."}
      - {id: fr-b2-02-fiable, type: vocab, l2: "fiable", l1: "reliable / trustworthy (a source, a machine)", ex: "Ce sondage n'est pas très fiable.", ex_l1: "This poll isn't very reliable.", note: "la fiabilité = reliability."}
      - {id: fr-b2-02-inadmissible, type: vocab, l2: "inadmissible", l1: "unacceptable / intolerable", alt: ["inacceptable"], ex: "Ce comportement est inadmissible.", ex_l1: "This behaviour is unacceptable.", note: "Strong and common in political speech; not the legal 'inadmissible'."}
      - {id: fr-b2-02-laicite, type: vocab, l2: "la laïcité", l1: "secularism (separation of religion and state)", ex: "La laïcité est un principe fondamental en France.", ex_l1: "Secularism is a fundamental principle in France.", note: "laïque = secular: l'école laïque. A very French debate."}
      - {id: fr-b2-02-s-engager, type: vocab, l2: "s'engager", l1: "to get involved / to commit oneself", ex: "Elle s'engage dans une association de quartier.", ex_l1: "She is getting involved in a neighbourhood association.", note: "l'engagement = commitment. s'engager à + infinitive = to undertake to."}
      - {id: fr-b2-02-peu-probable, type: phrase, l2: "Il est peu probable qu'il soit réélu.", l1: "It's unlikely that he'll be re-elected.", note: "il est probable que + indicative, but il est peu probable que + subjunctive."}
      - {id: fr-b2-02-il-me-semble, type: phrase, l2: "Il me semble que c'est injuste.", l1: "It seems to me that it's unfair.", alt: ["Il me semble que ce n'est pas juste."], note: "il me semble que (with a pronoun) + indicative; il semble que (without) usually + subjunctive."}
      - {id: fr-b2-02-il-se-peut, type: phrase, l2: "Il se peut qu'il y ait des grèves.", l1: "There may be strikes. (il se peut que…)", note: "il se peut que = it may be that, + subjunctive. il y a → qu'il y ait."}
      - {id: fr-b2-02-goutte-d-eau, type: phrase, l2: "C'est la goutte d'eau qui fait déborder le vase.", l1: "It's the last straw. (idiom)", alt: ["C'est la goutte qui fait déborder le vase."], note: "Literally 'the drop of water that makes the vase overflow'."}
      - {id: fr-b2-02-huile-sur-le-feu, type: phrase, l2: "Il ne faut pas jeter de l'huile sur le feu.", l1: "We mustn't add fuel to the fire. (idiom)", alt: ["Il ne faut pas jeter d'huile sur le feu.", "Il ne faut pas mettre de l'huile sur le feu."], note: "To make a conflict worse. The fixed phrase keeps de l'huile even after ne pas."}
      - {id: fr-b2-02-c1, type: cloze, text: "Je crois que les électeurs ___ fatigués des promesses.", answer: "sont", l1: "I believe the voters are tired of promises.", note: "Affirmative croire / penser → indicative."}
      - {id: fr-b2-02-c2, type: cloze, text: "Je ne crois pas que cette réforme ___ juste.", answer: "soit", l1: "I don't believe this reform is fair.", note: "Negative croire / penser → subjunctive."}
      - {id: fr-b2-02-c3, type: cloze, text: "Il est probable que le président ___ un discours ce soir.", answer: "fera", alt: ["prononcera"], l1: "It's likely that the president will give a speech tonight.", note: "il est probable que → indicative, here the future."}
      - {id: fr-b2-02-c4, type: cloze, text: "Il est possible que les élections ___ avancées.", answer: "soient", l1: "It's possible that the elections will be brought forward.", note: "Possibility → subjunctive. The present subjunctive also covers the future."}
      - {id: fr-b2-02-c5, type: cloze, text: "Il semble que personne ne ___ la réponse.", answer: "sache", alt: ["connaisse"], l1: "It seems that nobody knows the answer.", note: "il semble que (no pronoun) → subjunctive."}
      - {id: fr-b2-02-c6, type: cloze, text: "Il me semble que tu ___ tort.", answer: "as", l1: "It seems to me that you're wrong. (informal)", note: "il me semble que → indicative: avoir tort, tu as tort."}
      - {id: fr-b2-02-c7, type: cloze, text: "Je regrette que vous ne ___ pas venir au débat.", answer: "puissiez", l1: "I'm sorry that you can't come to the debate.", note: "regretter que + subjunctive: pouvoir → que vous puissiez."}
      - {id: fr-b2-02-c8, type: cloze, text: "J'espère que la réforme ___ adoptée.", answer: "sera", l1: "I hope the reform will be adopted.", note: "espérer que takes the indicative, here the future."}
      - {id: fr-b2-02-c9, type: cloze, text: "Croyez-vous qu'ils ___ gagner les élections ?", answer: "puissent", alt: ["peuvent"], l1: "Do you think they can win the elections? (formal)", note: "In an inverted question the subjunctive is standard; the indicative is also heard."}
      - {id: fr-b2-02-c10, type: cloze, text: "Il nie qu'il y ___ un problème.", answer: "ait", l1: "He denies that there is a problem.", note: "nier que + subjunctive: il y a → qu'il y ait."}
      - {id: fr-b2-02-c11, type: cloze, text: "Je me réjouis que tu ___ à la manifestation avec nous.", answer: "viennes", l1: "I'm delighted you're coming to the demonstration with us. (informal)", note: "se réjouir que + subjunctive: venir → que tu viennes."}
      - {id: fr-b2-02-c12, type: cloze, text: "Il est évident que les inégalités ___.", answer: "augmentent", alt: ["progressent"], l1: "It is obvious that inequality is growing.", note: "il est évident / clair / certain que + indicative."}
      - {id: fr-b2-02-c13, type: cloze, text: "Je crains que la situation ne ___ pire.", answer: "devienne", alt: ["soit"], l1: "I fear the situation may get worse.", note: "craindre que + subjunctive. The ne is not a negative (ne explétif)."}
      - {id: fr-b2-02-c14, type: cloze, text: "Il est inadmissible que des enfants ___ dans la pauvreté.", answer: "vivent", alt: ["grandissent"], l1: "It is unacceptable that children live in poverty.", note: "A judgement (il est inadmissible / scandaleux que) → subjunctive."}
      - {id: fr-b2-02-c15, type: cloze, text: "Je ne suis pas sûr que les sondages ___ la réalité.", answer: "reflètent", l1: "I'm not sure the polls reflect reality. (a man speaking)", note: "ne pas être sûr que → subjunctive. refléter → qu'ils reflètent."}
      - {id: fr-b2-02-c16, type: cloze, text: "Il est clair que nous ___ changer de politique.", answer: "devons", l1: "It is clear that we must change our policy.", note: "il est clair que + indicative."}

  # ───────────────────────────────────────────────────────────────── 3
  - id: fr4-03
    title: "The environment: conjunctions with the subjunctive"
    goal: "I can discuss environmental problems and solutions and link ideas with the conjunctions that take the subjunctive, and those that don't."
    notes: |
      These conjunctions always take the **subjunctive**:

      | conjunction | meaning |
      |---|---|
      | bien que, quoique | although |
      | pour que, afin que | so that |
      | avant que | before |
      | jusqu'à ce que | until |
      | à moins que | unless |
      | à condition que, pourvu que | provided that |
      | sans que | without |
      | de peur que, de crainte que | for fear that |

      *Il faut agir **avant qu'il soit** trop tard.*

      ## Same subject → preposition + infinitive
      *pour, afin de, avant de, sans, à condition de, à moins de, de peur de*: *Je baisse le chauffage **pour économiser** de l'énergie* (I save) but *… **pour que** nous **économisions** de l'énergie* (we save).

      ## The traps
      - **après que** takes the **indicative**: *après qu'il **est** parti*. *Après qu'il soit parti* is heard everywhere but is a mistake.
      - *pendant que, parce que, depuis que, alors que, dès que* take the indicative.
      - In formal writing *avant que, à moins que* and *de peur que* often add a **ne** that is not negative: *avant qu'il **ne** soit trop tard*.

      *Pourvu que* on its own means "let's hope": *Pourvu qu'il pleuve !*
    items:
      - {id: fr-b2-03-energies-renouvelables, type: vocab, l2: "les énergies renouvelables", l1: "renewable energy", ex: "La France investit dans les énergies renouvelables.", ex_l1: "France is investing in renewable energy.", note: "Usually plural in French. Coal, oil and gas are les énergies fossiles."}
      - {id: fr-b2-03-effet-de-serre, type: vocab, l2: "l'effet de serre", l1: "the greenhouse effect", ex: "Le CO2 contribue à l'effet de serre.", ex_l1: "CO2 contributes to the greenhouse effect.", note: "Masculine. les gaz à effet de serre = greenhouse gases. une serre = a greenhouse."}
      - {id: fr-b2-03-empreinte-carbone, type: vocab, l2: "l'empreinte carbone", l1: "the carbon footprint", ex: "Prendre l'avion augmente beaucoup notre empreinte carbone.", ex_l1: "Flying greatly increases our carbon footprint.", note: "Feminine: une empreinte = a print, a footprint."}
      - {id: fr-b2-03-biodiversite, type: vocab, l2: "la biodiversité", l1: "biodiversity", ex: "La pollution menace la biodiversité.", ex_l1: "Pollution threatens biodiversity.", note: "menacer = to threaten."}
      - {id: fr-b2-03-espece, type: vocab, l2: "l'espèce", l1: "the species", ex: "Cette espèce d'oiseau a presque disparu.", ex_l1: "This species of bird has almost disappeared.", note: "Always feminine: une espèce, even with a masculine noun after it."}
      - {id: fr-b2-03-menace, type: vocab, l2: "menacé", l1: "endangered / threatened (masculine)", ex: "Le loup est une espèce menacée.", ex_l1: "The wolf is an endangered species.", note: "It agrees: une espèce menacée. Also: en voie de disparition (dying out)."}
      - {id: fr-b2-03-secheresse, type: vocab, l2: "la sécheresse", l1: "the drought", ex: "La sécheresse a détruit les récoltes.", ex_l1: "The drought destroyed the crops.", note: "From sec, sèche (dry). la récolte = the harvest."}
      - {id: fr-b2-03-inondation, type: vocab, l2: "l'inondation", l1: "the flood", ex: "Les inondations ont fait de gros dégâts.", ex_l1: "The floods caused a lot of damage.", note: "Feminine. inonder = to flood. les dégâts = damage."}
      - {id: fr-b2-03-canicule, type: vocab, l2: "la canicule", l1: "the heatwave", ex: "Pendant la canicule, il a fait quarante degrés.", ex_l1: "During the heatwave, it was forty degrees.", note: "Also une vague de chaleur."}
      - {id: fr-b2-03-recycler, type: vocab, l2: "recycler", l1: "to recycle", ex: "On peut recycler le verre à l'infini.", ex_l1: "Glass can be recycled endlessly.", note: "le recyclage = recycling. le verre = glass."}
      - {id: fr-b2-03-gaspillage, type: vocab, l2: "le gaspillage", l1: "waste / wastefulness (the act of wasting)", ex: "Le gaspillage alimentaire est un vrai problème.", ex_l1: "Food waste is a real problem.", note: "From gaspiller. The rubbish itself is les déchets."}
      - {id: fr-b2-03-economiser, type: vocab, l2: "économiser", l1: "to save (energy, water, money)", ex: "On économise l'eau en prenant des douches courtes.", ex_l1: "You save water by taking short showers.", note: "To save a file is sauvegarder; to save a life is sauver."}
      - {id: fr-b2-03-consommer, type: vocab, l2: "consommer", l1: "to consume / to use (energy, fuel, food)", ex: "Cette voiture consomme peu d'essence.", ex_l1: "This car uses little petrol.", note: "la consommation = consumption; le consommateur = the consumer."}
      - {id: fr-b2-03-durable, type: vocab, l2: "durable", l1: "sustainable / lasting", ex: "Il faut trouver une solution durable.", ex_l1: "We need to find a lasting solution.", note: "le développement durable = sustainable development."}
      - {id: fr-b2-03-eolienne, type: vocab, l2: "l'éolienne", l1: "the wind turbine", ex: "On a installé des éoliennes au large de la côte.", ex_l1: "Wind turbines have been installed off the coast.", note: "Feminine. au large de = off (a coast)."}
      - {id: fr-b2-03-nucleaire, type: vocab, l2: "le nucléaire", l1: "nuclear power", ex: "La France produit beaucoup d'électricité grâce au nucléaire.", ex_l1: "France produces a lot of electricity thanks to nuclear power.", note: "Short for l'énergie nucléaire. une centrale nucléaire = a nuclear power station."}
      - {id: fr-b2-03-covoiturage, type: vocab, l2: "le covoiturage", l1: "car-sharing / carpooling", ex: "Je vais au travail en covoiturage.", ex_l1: "I carpool to work.", note: "faire du covoiturage. Used in France and Québec alike."}
      - {id: fr-b2-03-pour-que, type: vocab, l2: "pour que", l1: "so that / in order that (+ subjunctive)", alt: ["afin que"], ex: "Je parle fort pour que tout le monde m'entende.", ex_l1: "I speak loudly so that everyone can hear me.", note: "Different subjects. Same subject: pour + infinitive."}
      - {id: fr-b2-03-avant-que, type: vocab, l2: "avant que", l1: "before (+ subjunctive)", ex: "Rentrons avant qu'il fasse nuit.", ex_l1: "Let's go home before it gets dark.", note: "Same subject: avant de + infinitive. Formal French may add ne: avant qu'il ne fasse nuit."}
      - {id: fr-b2-03-jusqu-a-ce-que, type: vocab, l2: "jusqu'à ce que", l1: "until (+ subjunctive)", ex: "Je reste jusqu'à ce que tu reviennes.", ex_l1: "I'll stay until you come back.", note: "Before a noun, jusqu'à: jusqu'à demain."}
      - {id: fr-b2-03-a-moins-que, type: vocab, l2: "à moins que", l1: "unless (+ subjunctive)", ex: "On ira à la plage, à moins qu'il pleuve.", ex_l1: "We'll go to the beach, unless it rains.", note: "Formal: à moins qu'il ne pleuve. Same subject: à moins de + infinitive."}
      - {id: fr-b2-03-a-condition-que, type: vocab, l2: "à condition que", l1: "provided that / on condition that (+ subjunctive)", alt: ["pourvu que"], ex: "Tu peux venir, à condition que tu sois à l'heure.", ex_l1: "You can come, provided you're on time.", note: "Same subject: à condition de + infinitive."}
      - {id: fr-b2-03-sans-que, type: vocab, l2: "sans que", l1: "without (someone doing something) (+ subjunctive)", ex: "Il est parti sans que je le sache.", ex_l1: "He left without my knowing.", note: "Same subject: sans + infinitive: il est parti sans dire au revoir."}
      - {id: fr-b2-03-de-peur-que, type: vocab, l2: "de peur que", l1: "for fear that (+ subjunctive)", alt: ["de crainte que"], ex: "Elle a pris un parapluie de peur qu'il ne pleuve.", ex_l1: "She took an umbrella for fear it would rain.", note: "Usually written with a ne that is not negative. Same subject: de peur de + infinitive."}
      - {id: fr-b2-03-avant-qu-il-soit-trop-tard, type: phrase, l2: "Il faut agir avant qu'il soit trop tard.", l1: "We must act before it's too late.", alt: ["Il faut agir avant qu'il ne soit trop tard."], note: "avant que + subjunctive. The ne in the alternative is formal and does not mean 'not'."}
      - {id: fr-b2-03-chaque-geste-compte, type: phrase, l2: "Chaque geste compte.", l1: "Every little action counts.", alt: ["Chaque petit geste compte."], note: "un geste = a gesture, and also a small action: un geste pour la planète."}
      - {id: fr-b2-03-pierre-deux-coups, type: phrase, l2: "On fait d'une pierre deux coups.", l1: "We're killing two birds with one stone. (idiom; with on)", note: "Literally 'two blows with one stone'."}
      - {id: fr-b2-03-mer-a-boire, type: phrase, l2: "Ce n'est pas la mer à boire.", l1: "It's not that hard. (idiom with the sea)", alt: ["C'est pas la mer à boire."], note: "Literally 'it isn't the sea to drink'."}
      - {id: fr-b2-03-continuer-comme-ca, type: phrase, l2: "On ne peut pas continuer comme ça.", l1: "We can't go on like this. (with on)", alt: ["On peut pas continuer comme ça.", "On ne peut pas continuer ainsi."]}
      - {id: fr-b2-03-grand-temps, type: phrase, l2: "Il est grand temps d'agir.", l1: "It's high time to act.", note: "il est grand temps de + infinitive, or que + subjunctive."}
      - {id: fr-b2-03-c1, type: cloze, text: "Je t'explique le tri pour que tu ___ comment faire.", answer: "saches", l1: "I'm explaining the sorting to you so that you know what to do.", note: "pour que + subjunctive: savoir → que tu saches."}
      - {id: fr-b2-03-c2, type: cloze, text: "Rentrons avant qu'il ___ à pleuvoir.", answer: "commence", l1: "Let's go home before it starts to rain.", note: "avant que + subjunctive. commencer à + infinitive."}
      - {id: fr-b2-03-c3, type: cloze, text: "On ne résoudra rien à moins que tous les pays ___ ensemble.", answer: "agissent", alt: ["travaillent", "coopèrent"], l1: "We won't solve anything unless all countries act together.", note: "agir (to act) is like finir: qu'ils agissent."}
      - {id: fr-b2-03-c4, type: cloze, text: "Bien que le nucléaire ___ peu de CO2, il reste controversé.", answer: "produise", alt: ["émette", "rejette"], l1: "Although nuclear power produces little CO2, it remains controversial.", note: "bien que + subjunctive: produire → qu'il produise."}
      - {id: fr-b2-03-c5, type: cloze, text: "Il est entré sans que personne le ___.", answer: "voie", alt: ["remarque", "entende"], l1: "He came in without anyone seeing him.", note: "sans que + subjunctive. After sans que, personne needs no ne."}
      - {id: fr-b2-03-c6, type: cloze, text: "Je viendrai à vélo, à condition qu'il ___ beau.", answer: "fasse", l1: "I'll come by bike, provided the weather is nice.", note: "à condition que + subjunctive: faire → qu'il fasse."}
      - {id: fr-b2-03-c7, type: cloze, text: "Attendons ici jusqu'à ce que la tempête ___.", answer: "passe", alt: ["cesse", "finisse"], l1: "Let's wait here until the storm passes.", note: "jusqu'à ce que + subjunctive."}
      - {id: fr-b2-03-c8, type: cloze, text: "On a fermé la plage de peur que les baigneurs ne ___ malades.", answer: "tombent", l1: "The beach was closed for fear that swimmers would fall ill.", note: "de peur que (ne) + subjunctive. tomber malade = to fall ill."}
      - {id: fr-b2-03-c9, type: cloze, text: "Il est arrivé après que nous ___ partis.", answer: "étions", l1: "He arrived after we had left.", note: "après que takes the indicative, here the plus-que-parfait. 'après que nous soyons partis' is a common mistake."}
      - {id: fr-b2-03-c10, type: cloze, text: "Éteignez la lumière avant ___ sortir.", answer: "de", l1: "Turn off the light before you go out. (formal)", note: "Same subject → avant de + infinitive."}
      - {id: fr-b2-03-c11, type: cloze, text: "On peut se déplacer ___ polluer : à pied ou à vélo.", answer: "sans", l1: "You can get around without polluting: on foot or by bike.", note: "Same subject → sans + infinitive, never -ant."}
      - {id: fr-b2-03-c12, type: cloze, text: "Je baisse le chauffage afin que nous ___ de l'énergie.", answer: "économisions", l1: "I'm turning the heating down so that we save energy.", note: "afin que + subjunctive: que nous économisions."}
      - {id: fr-b2-03-c13, type: cloze, text: "Pourvu qu'il ___ demain ! Les jardins sont si secs.", answer: "pleuve", l1: "Let's hope it rains tomorrow! The gardens are so dry.", note: "pourvu que on its own = let's hope. pleuvoir → qu'il pleuve."}
      - {id: fr-b2-03-c14, type: cloze, text: "Je parle lentement ___ que tout le monde comprenne.", answer: "pour", alt: ["afin"], l1: "I speak slowly so that everyone understands.", note: "pour que / afin que + subjunctive."}
      - {id: fr-b2-03-c15, type: cloze, text: "Le maire a fermé la route avant que l'inondation ___ le village.", answer: "atteigne", l1: "The mayor closed the road before the flood reached the village.", note: "atteindre (to reach) → qu'elle atteigne. The present subjunctive is used even in a past story."}

  # ───────────────────────────────────────────────────────────────── 4
  - id: fr4-04
    title: "Science and technology: subjunctive in relative clauses, past subjunctive"
    goal: "I can talk about research and new technology, describe what I am looking for, and react to past events using the past subjunctive."
    notes: |
      ## The subjunctive in a relative clause
      After *qui / que*, the mood tells the listener whether the thing is known to exist.

      - Known, real → **indicative**: *J'ai trouvé un logiciel qui **est** gratuit.*
      - Wanted, possibly non-existent → **subjunctive**: *Je cherche un logiciel qui **soit** gratuit.*
      - After a negative (*personne, rien, aucun*): *Il n'y a personne qui **puisse** m'aider.*
      - After a superlative or *le seul, le premier, le dernier, l'unique*: *C'est le meilleur film que j'**aie** vu.* (The indicative is possible when you state a plain fact.)

      ## The past subjunctive
      Subjunctive of **avoir** or **être** + past participle, for an action completed before the main verb:

      | | finir | partir |
      |---|---|---|
      | que je / j' | aie fini | sois parti(e) |
      | que tu | aies fini | sois parti(e) |
      | qu'il / elle | ait fini | soit parti(e) |
      | que nous | ayons fini | soyons parti(e)s |
      | que vous | ayez fini | soyez parti(e)(s) |
      | qu'ils / elles | aient fini | soient parti(e)s |

      *Je suis content que tu **sois venu**.* (you came, now I'm glad) — compare *Je suis content que tu **viennes*** (you're coming).

      Note the spelling: que j'**aie**, qu'il **ait**.
    items:
      - {id: fr-b2-04-recherche, type: vocab, l2: "la recherche", l1: "research", ex: "Elle fait de la recherche en biologie.", ex_l1: "She does research in biology.", note: "Uncountable in this sense: faire de la recherche. une recherche is also a search, online."}
      - {id: fr-b2-04-chercheur, type: vocab, l2: "le chercheur", l1: "the researcher (a man)", ex: "Les chercheurs ont publié leurs résultats.", ex_l1: "The researchers have published their results.", note: "Feminine: la chercheuse."}
      - {id: fr-b2-04-decouverte, type: vocab, l2: "la découverte", l1: "the discovery", ex: "C'est une découverte majeure.", ex_l1: "It's a major discovery.", note: "From découvrir (to discover); past participle découvert."}
      - {id: fr-b2-04-experience, type: vocab, l2: "l'expérience", l1: "the experiment / the experience", ex: "Les élèves ont fait une expérience de chimie.", ex_l1: "The pupils did a chemistry experiment.", note: "Feminine. One word for both: faire une expérience = to do an experiment; avoir de l'expérience = to have experience."}
      - {id: fr-b2-04-laboratoire, type: vocab, l2: "le laboratoire", l1: "the laboratory", alt: ["le labo"], ex: "Il travaille dans un laboratoire à Grenoble.", ex_l1: "He works in a laboratory in Grenoble.", note: "Casual: le labo."}
      - {id: fr-b2-04-ia, type: vocab, l2: "l'intelligence artificielle", l1: "artificial intelligence (AI)", alt: ["l'IA"], ex: "L'intelligence artificielle transforme de nombreux métiers.", ex_l1: "Artificial intelligence is transforming many jobs.", note: "Feminine. Abbreviation: l'IA (say 'i-a')."}
      - {id: fr-b2-04-donnees, type: vocab, l2: "les données", l1: "data", ex: "Cette appli collecte beaucoup de données personnelles.", ex_l1: "This app collects a lot of personal data.", note: "Feminine plural: une donnée, from donner (a 'given')."}
      - {id: fr-b2-04-outil, type: vocab, l2: "l'outil", l1: "the tool", ex: "Internet est un outil formidable.", ex_l1: "The internet is a wonderful tool.", note: "Masculine; the final l is barely heard."}
      - {id: fr-b2-04-progres, type: vocab, l2: "le progrès", l1: "progress / an advance", ex: "Tu as fait beaucoup de progrès en français !", ex_l1: "You've made a lot of progress in French!", note: "Countable in French: faire des progrès. The s is silent."}
      - {id: fr-b2-04-numerique, type: vocab, l2: "numérique", l1: "digital", ex: "Notre école passe au numérique.", ex_l1: "Our school is going digital.", note: "As a noun, le numérique = digital technology."}
      - {id: fr-b2-04-pirater, type: vocab, l2: "pirater", l1: "to hack (a computer) / to pirate (a film)", ex: "Mon compte a été piraté.", ex_l1: "My account has been hacked.", note: "le piratage = hacking; un pirate informatique = a hacker."}
      - {id: fr-b2-04-vie-privee, type: vocab, l2: "la vie privée", l1: "privacy / private life", ex: "Il faut protéger la vie privée des utilisateurs.", ex_l1: "Users' privacy must be protected.", note: "For data, la confidentialité is also used."}
      - {id: fr-b2-04-appareil, type: vocab, l2: "l'appareil", l1: "the device / the appliance", ex: "Éteignez vos appareils électroniques.", ex_l1: "Switch off your electronic devices.", note: "Masculine. un appareil photo = a camera."}
      - {id: fr-b2-04-mise-a-jour, type: vocab, l2: "la mise à jour", l1: "the update (software)", ex: "Une mise à jour est disponible.", ex_l1: "An update is available.", note: "Plural: des mises à jour. mettre à jour = to update."}
      - {id: fr-b2-04-utilisateur, type: vocab, l2: "l'utilisateur", l1: "the user (a man)", ex: "L'appli a dix millions d'utilisateurs.", ex_l1: "The app has ten million users.", note: "Feminine: l'utilisatrice."}
      - {id: fr-b2-04-objets-connectes, type: vocab, l2: "les objets connectés", l1: "smart devices / connected devices", ex: "Les objets connectés envahissent nos maisons.", ex_l1: "Smart devices are invading our homes.", note: "Literally 'connected objects'. une montre connectée = a smartwatch."}
      - {id: fr-b2-04-brevet, type: vocab, l2: "le brevet", l1: "the patent", ex: "L'entreprise a déposé un brevet.", ex_l1: "The company filed a patent.", note: "déposer un brevet = to file a patent. le brevet is also the exam at the end of collège."}
      - {id: fr-b2-04-mettre-au-point, type: vocab, l2: "mettre au point", l1: "to develop / to perfect (a technique, a product)", ex: "Ils ont mis au point une nouvelle batterie.", ex_l1: "They have developed a new battery.", note: "Like mettre: ils ont mis au point."}
      - {id: fr-b2-04-prouver, type: vocab, l2: "prouver", l1: "to prove", ex: "Il est difficile de prouver cette théorie.", ex_l1: "It's difficult to prove this theory.", note: "la preuve = the proof, the evidence."}
      - {id: fr-b2-04-scientifique, type: vocab, l2: "le scientifique", l1: "the scientist", ex: "Les scientifiques nous alertent depuis des années.", ex_l1: "Scientists have been warning us for years.", note: "Same form for a woman: une scientifique. Also the adjective 'scientific'."}
      - {id: fr-b2-04-puce, type: vocab, l2: "la puce", l1: "the chip (electronic) / the flea", ex: "Cette carte contient une puce.", ex_l1: "This card contains a chip.", note: "le marché aux puces = the flea market."}
      - {id: fr-b2-04-je-cherche-quelqu-un, type: phrase, l2: "Je cherche quelqu'un qui puisse m'aider.", l1: "I'm looking for someone who can help me.", note: "The person may not exist → subjunctive in the relative clause."}
      - {id: fr-b2-04-meilleure-appli, type: phrase, l2: "C'est la meilleure appli que je connaisse.", l1: "It's the best app I know.", alt: ["C'est la meilleure application que je connaisse."], note: "After a superlative, the subjunctive is usual in the relative clause."}
      - {id: fr-b2-04-content-que-tu-sois-venu, type: phrase, l2: "Je suis content que tu sois venu.", l1: "I'm glad you came. (informal; a man speaking, to a man)", alt: ["Je suis heureux que tu sois venu.", "Je suis ravi que tu sois venu."], note: "Past subjunctive: the coming happened before the being glad. A woman says contente; to a woman, venue."}
      - {id: fr-b2-04-pas-qu-il-ait-compris, type: phrase, l2: "Je ne pense pas qu'il ait compris.", l1: "I don't think he understood.", alt: ["Je ne crois pas qu'il ait compris.", "Je pense pas qu'il ait compris."], note: "Past subjunctive after a negative opinion."}
      - {id: fr-b2-04-puce-a-l-oreille, type: phrase, l2: "Ça m'a mis la puce à l'oreille.", l1: "That made me suspicious. (idiom with la puce)", note: "mettre la puce à l'oreille à quelqu'un = to make someone suspect something."}
      - {id: fr-b2-04-tient-pas-debout, type: phrase, l2: "Ça ne tient pas debout.", l1: "That makes no sense. / That doesn't hold water. (idiom)", alt: ["Ça tient pas debout."], note: "Literally 'it doesn't stand up', of an argument or a story."}
      - {id: fr-b2-04-c1, type: cloze, text: "Je cherche un logiciel qui ___ gratuit et facile à utiliser.", answer: "soit", l1: "I'm looking for software that is free and easy to use (if there is one).", note: "Wanted, not known to exist → subjunctive."}
      - {id: fr-b2-04-c2, type: cloze, text: "J'ai trouvé un logiciel qui ___ gratuit.", answer: "est", l1: "I've found some software that is free.", note: "It exists and you have found it → indicative."}
      - {id: fr-b2-04-c3, type: cloze, text: "Il n'y a aucun chercheur qui ___ expliquer ce phénomène.", answer: "puisse", alt: ["sache"], l1: "There is no researcher who can explain this phenomenon.", note: "After a negative (aucun, personne, rien) → subjunctive."}
      - {id: fr-b2-04-c4, type: cloze, text: "C'est la découverte la plus importante qu'on ait ___ depuis vingt ans.", answer: "faite", l1: "It's the most important discovery anyone has made in twenty years.", note: "Past subjunctive after a superlative. faite agrees with que (= la découverte), a direct object placed before."}
      - {id: fr-b2-04-c5, type: cloze, text: "Connais-tu quelqu'un qui ___ réparer un ordinateur ?", answer: "sache", alt: ["puisse"], l1: "Do you know anyone who can repair a computer? (informal)", note: "savoir + infinitive = to know how to. Such a person may not exist → subjunctive."}
      - {id: fr-b2-04-c6, type: cloze, text: "C'est le seul appareil qui ___ à mes besoins.", answer: "réponde", alt: ["corresponde"], l1: "It's the only device that meets my needs.", note: "After le seul, le premier, le dernier → subjunctive is usual."}
      - {id: fr-b2-04-c7, type: cloze, text: "Je suis ravi que vous ___ venus à la conférence.", answer: "soyez", l1: "I'm delighted that you came to the conference. (a man speaking, to a group)", note: "Past subjunctive with être: que vous soyez venus."}
      - {id: fr-b2-04-c8, type: cloze, text: "Je doute qu'ils ___ vraiment compris le problème.", answer: "aient", l1: "I doubt they really understood the problem.", note: "Past subjunctive: qu'ils aient compris."}
      - {id: fr-b2-04-c9, type: cloze, text: "Je regrette que tu ne ___ pas venu hier.", answer: "sois", l1: "I'm sorry you didn't come yesterday. (informal, to a man)", note: "Past subjunctive with être: que tu sois venu."}
      - {id: fr-b2-04-c10, type: cloze, text: "Il est possible que le serveur ait été ___.", answer: "piraté", l1: "It's possible that the server has been hacked.", note: "Past subjunctive of a passive: ait été + participle."}
      - {id: fr-b2-04-c11, type: cloze, text: "Je suis surprise qu'elle ne m'ait pas encore ___.", answer: "répondu", l1: "I'm surprised she hasn't answered me yet. (a woman speaking)", note: "répondre à quelqu'un: m' is an indirect object, so répondu does not agree."}
      - {id: fr-b2-04-c12, type: cloze, text: "Il faut que vous ___ fini l'expérience avant midi.", answer: "ayez", l1: "You must have finished the experiment by noon.", note: "Past subjunctive: the action must be complete before a point in time."}
      - {id: fr-b2-04-c13, type: cloze, text: "C'est le meilleur cours de physique que j'___ jamais suivi.", answer: "aie", l1: "It's the best physics course I've ever taken.", note: "que j'aie (with e) for je; qu'il ait for il."}
      - {id: fr-b2-04-c14, type: cloze, text: "Nous cherchons un ingénieur qui ___ de l'expérience en IA.", answer: "ait", l1: "We're looking for an engineer who has experience in AI.", note: "Any engineer who fits, not a known person → subjunctive."}
      - {id: fr-b2-04-c15, type: cloze, text: "Il est dommage que les chercheurs ___ partis à l'étranger.", answer: "soient", l1: "It's a pity the researchers have gone abroad.", note: "Past subjunctive with être: qu'ils soient partis."}

  # ───────────────────────────────────────────────────────────────── 5
  - id: fr4-05
    title: "Media and the news: the conditionnel passé and si clauses"
    goal: "I can talk about the media, report unconfirmed news, express regret and reproach, and use all three kinds of si clause."
    notes: |
      The **conditionnel passé** ("would have") is the conditional of **avoir** or **être** + past participle: *j'**aurais aimé**, tu **aurais dû**, elle **serait venue***.

      ## Three jobs
      - **Unreal past**: *Si j'avais su, je **serais venu**.*
      - **Regret and reproach**: *J'**aurais dû** t'écouter.* (I should have) *Tu **aurais pu** me prévenir !* (You could have)
      - **Unconfirmed news**: journalists use the conditional for what is reported but not verified. *Selon la police, l'incendie **aurait fait** deux victimes* = reportedly. The present conditional works the same way: *Le ministre **serait** prêt à démissionner.*

      ## The three si clauses
      | si + | main clause | meaning |
      |---|---|---|
      | présent | présent, futur, impératif | real possibility |
      | imparfait | conditionnel présent | unreal now |
      | plus-que-parfait | conditionnel passé | unreal past |

      They can be mixed when the past affects the present: *Si tu **avais pris** le train, tu **serais** déjà là.*

      Never put a future or a conditional straight after *si* meaning "if". (After *si* meaning "whether", you can: *je me demande s'il viendra*.)
    items:
      - {id: fr-b2-05-presse, type: vocab, l2: "la presse", l1: "the press (newspapers and magazines)", ex: "La presse a beaucoup parlé de cette affaire.", ex_l1: "The press talked a lot about this affair.", note: "la presse écrite = print media. une affaire = a case, a scandal."}
      - {id: fr-b2-05-journaliste, type: vocab, l2: "le journaliste", l1: "the journalist", ex: "Le journaliste a interviewé le ministre.", ex_l1: "The journalist interviewed the minister.", note: "Same form for a woman: une journaliste."}
      - {id: fr-b2-05-faire-la-une, type: vocab, l2: "faire la une", l1: "to be front-page news / to hit the headlines", ex: "Le scandale fait la une de tous les journaux.", ex_l1: "The scandal is on the front page of every newspaper.", note: "la une = the front page. à la une = in the headlines."}
      - {id: fr-b2-05-titre, type: vocab, l2: "le titre", l1: "the headline / the title", ex: "Le titre de l'article est trompeur.", ex_l1: "The article's headline is misleading.", note: "trompeur = misleading."}
      - {id: fr-b2-05-article, type: vocab, l2: "l'article", l1: "the (newspaper) article", ex: "J'ai lu un article intéressant sur le climat.", ex_l1: "I read an interesting article about the climate.", note: "Masculine. Also a grammatical article and an item for sale."}
      - {id: fr-b2-05-rubrique, type: vocab, l2: "la rubrique", l1: "the section / the column (in a newspaper)", ex: "Je lis toujours la rubrique sport en premier.", ex_l1: "I always read the sports section first.", note: "la rubrique culture, la rubrique économie…"}
      - {id: fr-b2-05-abonnement, type: vocab, l2: "l'abonnement", l1: "the subscription", ex: "J'ai résilié mon abonnement au journal.", ex_l1: "I cancelled my newspaper subscription.", note: "Masculine. s'abonner à = to subscribe to; résilier = to cancel (a contract)."}
      - {id: fr-b2-05-telespectateur, type: vocab, l2: "le téléspectateur", l1: "the (TV) viewer", ex: "Le match a attiré huit millions de téléspectateurs.", ex_l1: "The match attracted eight million viewers.", note: "Feminine: la téléspectatrice."}
      - {id: fr-b2-05-auditeur, type: vocab, l2: "l'auditeur", l1: "the (radio) listener", ex: "Chers auditeurs, bonsoir.", ex_l1: "Good evening, dear listeners.", note: "Feminine: l'auditrice."}
      - {id: fr-b2-05-infox, type: vocab, l2: "les infox", l1: "fake news (the official French word)", alt: ["les fake news", "les fausses informations", "les fausses nouvelles"], ex: "Les infox circulent vite sur les réseaux sociaux.", ex_l1: "Fake news spreads fast on social media.", note: "infox = information + intox (propaganda). Most people in France say les fake news; in Québec, les fausses nouvelles."}
      - {id: fr-b2-05-publicite, type: vocab, l2: "la publicité", l1: "advertising / an advert", alt: ["la pub"], ex: "Il y a trop de publicité à la télé.", ex_l1: "There's too much advertising on TV.", note: "Casual: la pub. une publicité / une pub = an advert."}
      - {id: fr-b2-05-reportage, type: vocab, l2: "le reportage", l1: "the (news) report / the feature (on TV or radio)", ex: "J'ai vu un reportage sur les migrants.", ex_l1: "I saw a report on migrants.", note: "Not le rapport, which is a written report."}
      - {id: fr-b2-05-enquete, type: vocab, l2: "l'enquête", l1: "the investigation / the inquiry", ex: "La police a ouvert une enquête.", ex_l1: "The police have opened an investigation.", note: "Feminine. Also a survey: une enquête d'opinion. enquêter = to investigate."}
      - {id: fr-b2-05-diffuser, type: vocab, l2: "diffuser", l1: "to broadcast / to spread (information)", ex: "Le film sera diffusé ce soir à vingt et une heures.", ex_l1: "The film will be broadcast tonight at 9 pm.", note: "la diffusion = the broadcast."}
      - {id: fr-b2-05-relayer, type: vocab, l2: "relayer", l1: "to pass on / to share (news, a message)", ex: "Elle a relayé l'information sur les réseaux sociaux.", ex_l1: "She shared the information on social media.", note: "Also to take over from someone at work."}
      - {id: fr-b2-05-dementir, type: vocab, l2: "démentir", l1: "to deny (officially) / to refute", ex: "Le ministre a démenti la rumeur.", ex_l1: "The minister denied the rumour.", note: "Like mentir: il dément, il a démenti. un démenti = an official denial."}
      - {id: fr-b2-05-selon, type: vocab, l2: "selon", l1: "according to", alt: ["d'après"], ex: "Selon la météo, il va neiger.", ex_l1: "According to the forecast, it's going to snow.", note: "selon moi = in my opinion. In the news, often followed by the conditional."}
      - {id: fr-b2-05-victime, type: vocab, l2: "la victime", l1: "the victim / the casualty", ex: "L'accident n'a fait aucune victime.", ex_l1: "The accident caused no casualties.", note: "Always feminine, even for a man: il est la victime."}
      - {id: fr-b2-05-bilan, type: vocab, l2: "le bilan", l1: "the toll / the assessment (of results)", ex: "Le bilan s'élève à dix morts.", ex_l1: "The death toll stands at ten.", note: "faire le bilan = to take stock. s'élever à = to amount to."}
      - {id: fr-b2-05-influenceur, type: vocab, l2: "l'influenceur", l1: "the influencer (a man)", ex: "Cet influenceur a deux millions d'abonnés.", ex_l1: "This influencer has two million followers.", note: "Feminine: l'influenceuse. un abonné = a subscriber, a follower."}
      - {id: fr-b2-05-si-j-avais-su, type: phrase, l2: "Si j'avais su, je ne serais pas venu.", l1: "If I'd known, I wouldn't have come. (a man speaking)", alt: ["Si j'avais su, je serais pas venu."], note: "si + plus-que-parfait → conditionnel passé. A woman says venue."}
      - {id: fr-b2-05-j-aurais-du, type: phrase, l2: "J'aurais dû t'écouter.", l1: "I should have listened to you. (informal)", note: "devoir in the conditionnel passé = should have."}
      - {id: fr-b2-05-tu-aurais-pu, type: phrase, l2: "Tu aurais pu me prévenir !", l1: "You could have warned me! (informal)", note: "pouvoir in the conditionnel passé = could have: a reproach."}
      - {id: fr-b2-05-j-aurais-aime, type: phrase, l2: "J'aurais bien aimé y être.", l1: "I would have loved to be there.", alt: ["J'aurais aimé y être.", "J'aurais bien voulu y être."], note: "j'aurais aimé = I would have liked: a regret."}
      - {id: fr-b2-05-pied-de-la-lettre, type: phrase, l2: "Il ne faut pas tout prendre au pied de la lettre.", l1: "You mustn't take everything literally. (idiom)", note: "au pied de la lettre = literally, word for word."}
      - {id: fr-b2-05-une-fois, type: phrase, l2: "Une fois n'est pas coutume.", l1: "Just this once won't hurt. (idiom)", note: "Literally 'once is not a custom': said when making an exception."}
      - {id: fr-b2-05-faire-le-buzz, type: phrase, l2: "Cette vidéo a fait le buzz.", l1: "This video went viral.", alt: ["Cette vidéo est devenue virale."], note: "faire le buzz = to create a buzz. Very common in the media."}
      - {id: fr-b2-05-c1, type: cloze, text: "Si j'avais lu l'article, j'___ compris.", answer: "aurais", l1: "If I had read the article, I would have understood.", note: "si + plus-que-parfait → conditionnel passé."}
      - {id: fr-b2-05-c2, type: cloze, text: "S'il ___ su la vérité, il l'aurait dite.", answer: "avait", l1: "If he had known the truth, he would have told it.", note: "After si: plus-que-parfait, never the conditional. dite agrees with l' (la vérité)."}
      - {id: fr-b2-05-c3, type: cloze, text: "Si nous étions partis plus tôt, nous ___ arrivés à l'heure.", answer: "serions", l1: "If we had left earlier, we would have arrived on time.", note: "arriver takes être: nous serions arrivés."}
      - {id: fr-b2-05-c4, type: cloze, text: "Si tu avais pris le train, tu ___ déjà là maintenant.", answer: "serais", l1: "If you had taken the train, you would already be here now. (informal)", note: "Mixed: a past condition with a present result → conditionnel présent."}
      - {id: fr-b2-05-c5, type: cloze, text: "Si tu regardes ce reportage, tu ___ mieux la situation.", answer: "comprendras", l1: "If you watch this report, you'll understand the situation better.", note: "Real possibility: si + présent → futur."}
      - {id: fr-b2-05-c6, type: cloze, text: "Si les journaux ___ plus de temps, ils vérifieraient mieux leurs sources.", answer: "avaient", l1: "If newspapers had more time, they would check their sources better.", note: "Unreal now: si + imparfait → conditionnel présent."}
      - {id: fr-b2-05-c7, type: cloze, text: "Vous ___ dû vérifier l'information avant de la publier.", answer: "auriez", l1: "You should have checked the information before publishing it. (formal)", note: "Reproach: conditionnel passé of devoir."}
      - {id: fr-b2-05-c8, type: cloze, text: "Elle aurait ___ réussir si elle avait travaillé plus.", answer: "pu", l1: "She could have succeeded if she had worked more.", note: "could have = aurait pu + infinitive."}
      - {id: fr-b2-05-c9, type: cloze, text: "Selon nos sources, le ministre ___ démissionné hier soir.", answer: "aurait", l1: "According to our sources, the minister reportedly resigned last night.", note: "News not yet confirmed → conditionnel passé."}
      - {id: fr-b2-05-c10, type: cloze, text: "D'après la police, l'incendie aurait ___ deux victimes.", answer: "fait", l1: "According to the police, the fire reportedly claimed two victims.", note: "faire des victimes = to claim victims. No agreement: the object comes after."}
      - {id: fr-b2-05-c11, type: cloze, text: "Le président ___ prêt à négocier, selon un proche.", answer: "serait", l1: "The president is said to be ready to negotiate, according to someone close to him.", note: "Unconfirmed present → conditionnel présent."}
      - {id: fr-b2-05-c12, type: cloze, text: "Si j'avais ___ à ta place, j'aurais refusé.", answer: "été", l1: "If I had been in your place, I would have refused.", note: "Plus-que-parfait of être: j'avais été."}
      - {id: fr-b2-05-c13, type: cloze, text: "Ils ___ venus si on les avait invités.", answer: "seraient", l1: "They would have come if they had been invited.", note: "venir takes être: ils seraient venus."}
      - {id: fr-b2-05-c14, type: cloze, text: "Si tu ___ venu, tu aurais vu le concert.", answer: "étais", l1: "If you had come, you would have seen the concert. (informal, to a man)", note: "Plus-que-parfait of venir: tu étais venu."}
      - {id: fr-b2-05-c15, type: cloze, text: "Si tu vois Paul, ___-lui de m'appeler.", answer: "dis", l1: "If you see Paul, tell him to call me.", note: "si + présent can be followed by an imperative."}

  # ───────────────────────────────────────────────────────────────── 6
  - id: fr4-06
    title: "Health care: compound tenses and past participle agreement"
    goal: "I can talk about health care, illness and treatment, sequence events with compound tenses, and make past participles agree correctly."
    notes: |
      ## Agreement with avoir
      With **avoir**, the past participle agrees with the **direct object only when it comes before the verb**: a pronoun (*la, les, l', me, nous…*), the relative **que**, or **quel / combien de** + noun.

      - *J'ai pris **les pilules**.* → *Je **les** ai pris**es**.*
      - *les pilules **que** le médecin m'a prescrit**es***
      - ***Quelle** décision as-tu pri**se** ?*

      **No agreement** with *en*, with indirect objects (*lui, leur*), or when the object comes after: *Des comprimés ? J'**en** ai pris. Je **leur** ai parlé.*

      ## Reflexive verbs
      They agree with the subject only if the reflexive pronoun is the direct object: *elle s'est lavé**e*** (she washed herself), but *elle s'est lavé **les mains*** (the hands are the object). Once the hands come first: *elle se **les** est lavé**es***.

      You often **hear** the agreement: *prise, mise, faite, écrite, ouverte*.

      ## Two more uses of compound tenses
      - **Futur antérieur** as a guess about the past: *Il n'est pas venu ? Il **aura oublié**.* (He must have forgotten.)
      - After *une fois que, dès que, quand* about the future: *Une fois que tu **seras guéri**, tu pourras courir.*
    items:
      - {id: fr-b2-06-assurance-maladie, type: vocab, l2: "l'Assurance maladie", l1: "French national health insurance", alt: ["la Sécurité sociale", "la Sécu"], ex: "L'Assurance maladie rembourse une partie des soins.", ex_l1: "National health insurance pays back part of the cost of treatment.", note: "Feminine. People still say la Sécu. les soins = care, treatment."}
      - {id: fr-b2-06-mutuelle, type: vocab, l2: "la mutuelle", l1: "top-up health insurance (private)", ex: "Ma mutuelle rembourse le reste.", ex_l1: "My top-up insurance pays the rest.", note: "Covers what the state doesn't; often paid partly by the employer."}
      - {id: fr-b2-06-generaliste, type: vocab, l2: "le généraliste", l1: "the GP / the family doctor", alt: ["le médecin généraliste", "le médecin traitant"], ex: "Il faut d'abord consulter son généraliste.", ex_l1: "You must first see your GP.", note: "le médecin traitant = the GP you are registered with. consulter = to see (a doctor)."}
      - {id: fr-b2-06-urgences, type: vocab, l2: "les urgences", l1: "A&E / the emergency room", ex: "On l'a emmené aux urgences.", ex_l1: "He was taken to A&E.", note: "Feminine plural. In an emergency, call 15 or 112."}
      - {id: fr-b2-06-infirmier, type: vocab, l2: "l'infirmier", l1: "the nurse (a man)", ex: "L'infirmier m'a fait une piqûre.", ex_l1: "The nurse gave me an injection.", note: "Feminine: l'infirmière. une piqûre = an injection, an insect bite."}
      - {id: fr-b2-06-traitement, type: vocab, l2: "le traitement", l1: "the treatment (medical)", ex: "Le traitement dure trois semaines.", ex_l1: "The treatment lasts three weeks.", note: "suivre un traitement = to be on a course of treatment."}
      - {id: fr-b2-06-symptome, type: vocab, l2: "le symptôme", l1: "the symptom", ex: "Quels sont vos symptômes ?", ex_l1: "What are your symptoms?", note: "Spelling: ô, and p before t."}
      - {id: fr-b2-06-prescrire, type: vocab, l2: "prescrire", l1: "to prescribe", ex: "Le médecin m'a prescrit des antibiotiques.", ex_l1: "The doctor prescribed me antibiotics.", note: "Like écrire: il prescrit, il a prescrit."}
      - {id: fr-b2-06-guerir, type: vocab, l2: "guérir", l1: "to cure / to recover", ex: "Il a fini par guérir.", ex_l1: "He eventually recovered.", note: "Like finir. Both 'to cure' (guérir un malade) and 'to get better' (il a guéri)."}
      - {id: fr-b2-06-soigner, type: vocab, l2: "soigner", l1: "to treat / to care for (a patient, an illness)", ex: "Ce médecin soigne ses patients avec patience.", ex_l1: "This doctor treats his patients patiently.", note: "se soigner = to look after one's health."}
      - {id: fr-b2-06-douleur, type: vocab, l2: "la douleur", l1: "the pain", ex: "J'ai une douleur dans le dos.", ex_l1: "I have a pain in my back.", note: "For an everyday 'it hurts', say j'ai mal."}
      - {id: fr-b2-06-blessure, type: vocab, l2: "la blessure", l1: "the injury / the wound", ex: "Sa blessure n'est pas grave.", ex_l1: "His injury isn't serious.", note: "blessé = injured; un blessé = an injured person. Not 'blessing'."}
      - {id: fr-b2-06-vaccin, type: vocab, l2: "le vaccin", l1: "the vaccine", ex: "Le vaccin contre la grippe est conseillé aux personnes âgées.", ex_l1: "The flu vaccine is recommended for elderly people.", note: "se faire vacciner = to get vaccinated."}
      - {id: fr-b2-06-contagieux, type: vocab, l2: "contagieux", l1: "contagious / infectious (masculine)", ex: "Restez chez vous, vous êtes contagieux.", ex_l1: "Stay at home, you're contagious.", note: "Feminine: contagieuse."}
      - {id: fr-b2-06-arret-maladie, type: vocab, l2: "l'arrêt maladie", l1: "sick leave", alt: ["l'arrêt de travail"], ex: "Le médecin m'a mis en arrêt maladie pour une semaine.", ex_l1: "The doctor signed me off sick for a week.", note: "Masculine. être en arrêt maladie = to be on sick leave."}
      - {id: fr-b2-06-enceinte, type: vocab, l2: "enceinte", l1: "pregnant", ex: "Elle est enceinte de six mois.", ex_l1: "She is six months pregnant.", note: "Only feminine. une enceinte is also a loudspeaker."}
      - {id: fr-b2-06-comprime, type: vocab, l2: "le comprimé", l1: "the tablet / the pill", ex: "Prenez deux comprimés par jour.", ex_l1: "Take two tablets a day.", note: "Also la pilule, which on its own often means the contraceptive pill."}
      - {id: fr-b2-06-allergique, type: vocab, l2: "allergique", l1: "allergic", ex: "Je suis allergique à la pénicilline.", ex_l1: "I'm allergic to penicillin.", note: "être allergique à. une allergie = an allergy."}
      - {id: fr-b2-06-prise-de-sang, type: vocab, l2: "la prise de sang", l1: "the blood test", ex: "Je dois faire une prise de sang à jeun.", ex_l1: "I have to have a blood test on an empty stomach.", note: "à jeun = without having eaten."}
      - {id: fr-b2-06-sante-mentale, type: vocab, l2: "la santé mentale", l1: "mental health", ex: "On parle davantage de santé mentale aujourd'hui.", ex_l1: "People talk more about mental health today.", note: "le bien-être = well-being."}
      - {id: fr-b2-06-epuisement, type: vocab, l2: "l'épuisement professionnel", l1: "burnout", alt: ["le burn-out"], ex: "Il est en arrêt pour épuisement professionnel.", ex_l1: "He is on leave for burnout.", note: "Masculine. In France most people say le burn-out; l'épuisement professionnel is the official and Québec term."}
      - {id: fr-b2-06-bon-retablissement, type: phrase, l2: "Bon rétablissement !", l1: "Get well soon!", alt: ["Prompt rétablissement !"], note: "le rétablissement = recovery; se rétablir = to recover."}
      - {id: fr-b2-06-il-aura-oublie, type: phrase, l2: "Il aura oublié son rendez-vous.", l1: "He must have forgotten his appointment. (a guess, futur antérieur)", note: "The futur antérieur can express a guess about the past. Also: il a dû oublier."}
      - {id: fr-b2-06-je-les-ai-pris, type: phrase, l2: "Je les ai déjà pris.", l1: "I've already taken them. (the tablets: les comprimés)", note: "pris looks the same in the masculine plural. With les pilules: je les ai prises."}
      - {id: fr-b2-06-tomber-dans-les-pommes, type: phrase, l2: "Elle est tombée dans les pommes.", l1: "She fainted. (casual idiom with apples)", note: "tomber dans les pommes = to pass out. The neutral verb is s'évanouir."}
      - {id: fr-b2-06-pas-dans-mon-assiette, type: phrase, l2: "Je ne suis pas dans mon assiette.", l1: "I'm feeling out of sorts. (idiom with a plate)", alt: ["Je suis pas dans mon assiette."], note: "Literally 'I'm not in my plate'."}
      - {id: fr-b2-06-sante-de-fer, type: phrase, l2: "Il a une santé de fer.", l1: "He's as fit as a fiddle. (idiom: a health of iron)", note: "Literally 'a health of iron'."}
      - {id: fr-b2-06-c1, type: cloze, text: "Ces pilules ? Je les ai ___ ce matin.", answer: "prises", l1: "These pills? I took them this morning.", note: "les (= les pilules, feminine plural) comes before avoir → prises."}
      - {id: fr-b2-06-c2, type: cloze, text: "Voici l'ordonnance que le médecin m'a ___.", answer: "écrite", alt: ["rédigée", "faite"], l1: "Here is the prescription the doctor wrote for me.", note: "que (= l'ordonnance, feminine) comes before the verb → écrite."}
      - {id: fr-b2-06-c3, type: cloze, text: "Quelle décision as-tu ___ ?", answer: "prise", l1: "What decision did you make?", note: "quelle + noun before the verb → agreement: prise."}
      - {id: fr-b2-06-c4, type: cloze, text: "Ta lettre, je l'ai ___ hier.", answer: "reçue", l1: "Your letter — I received it yesterday. (informal)", note: "l' = la lettre, before the verb → reçue."}
      - {id: fr-b2-06-c5, type: cloze, text: "Des médicaments ? J'en ai ___ trois.", answer: "pris", l1: "Medicines? I took three of them.", note: "No agreement with en."}
      - {id: fr-b2-06-c6, type: cloze, text: "Les infirmières ? Je leur ai ___ hier.", answer: "parlé", l1: "The nurses? I spoke to them yesterday.", note: "leur is an indirect object (parler à): no agreement."}
      - {id: fr-b2-06-c7, type: cloze, text: "Les vaccins que nous avons ___ sont efficaces.", answer: "reçus", l1: "The vaccines we received are effective.", note: "que = les vaccins (masculine plural), before the verb → reçus."}
      - {id: fr-b2-06-c8, type: cloze, text: "Elle est ___ aux urgences hier soir.", answer: "allée", l1: "She went to A&E last night.", note: "With être the participle agrees with the subject: allée."}
      - {id: fr-b2-06-c9, type: cloze, text: "Elle s'est ___ la jambe en skiant.", answer: "cassé", l1: "She broke her leg skiing.", note: "The direct object (la jambe) comes after: no agreement, elle s'est cassé la jambe."}
      - {id: fr-b2-06-c10, type: cloze, text: "Ses mains, elle se les est ___ avant de manger.", answer: "lavées", l1: "Her hands — she washed them before eating.", note: "Now the direct object les (= les mains) comes first: lavées."}
      - {id: fr-b2-06-c11, type: cloze, text: "Paul n'est pas venu ? Il ___ oublié.", answer: "aura", l1: "Paul didn't come? He must have forgotten.", note: "Futur antérieur for a guess about the past."}
      - {id: fr-b2-06-c12, type: cloze, text: "Une fois que tu ___ guéri, tu pourras reprendre le sport.", answer: "seras", alt: ["auras"], l1: "Once you have recovered, you'll be able to take up sport again. (informal)", note: "Future after une fois que: tu seras guéri (a state) or tu auras guéri (the action)."}
      - {id: fr-b2-06-c13, type: cloze, text: "Le médecin m'a dit que j'___ attrapé la grippe.", answer: "avais", l1: "The doctor told me I had caught the flu.", note: "Plus-que-parfait: the catching came before the telling."}
      - {id: fr-b2-06-c14, type: cloze, text: "Si seulement nous ___ su !", answer: "avions", l1: "If only we had known!", note: "si seulement + plus-que-parfait = a regret about the past."}
      - {id: fr-b2-06-c15, type: cloze, text: "Combien de cigarettes as-tu ___ aujourd'hui ?", answer: "fumées", l1: "How many cigarettes have you smoked today? (informal)", note: "combien de + noun placed before the verb → agreement in careful writing."}
      - {id: fr-b2-06-c16, type: cloze, text: "Dès que les résultats ___ arrivés, je vous appellerai.", answer: "seront", l1: "As soon as the results have come in, I'll call you.", note: "Futur antérieur after dès que: seront arrivés."}

  # ───────────────────────────────────────────────────────────────── 7
  - id: fr4-07
    title: "Education: reported speech in full"
    goal: "I can talk about schools, studies and exams and report in detail what people said, asked, promised or admitted."
    notes: |
      When the reporting verb is in a past tense, each tense steps back:

      | direct speech | reported (after a past verb) |
      |---|---|
      | présent | imparfait |
      | passé composé | plus-que-parfait |
      | futur | conditionnel présent |
      | futur antérieur | conditionnel passé |
      | imparfait, plus-que-parfait, conditionnel | no change |
      | subjonctif | no change |
      | impératif | de + infinitif |

      *« J'**aurai fini** à midi. »* → *Elle a assuré qu'elle **aurait fini** à midi.*

      ## Questions
      *est-ce que* → **si**; *qu'est-ce que* → **ce que**; *qu'est-ce qui* → **ce qui**; other question words stay (*où, quand, pourquoi*), with ordinary word order.

      ## Time and place
      | direct | reported |
      |---|---|
      | aujourd'hui | ce jour-là |
      | hier / demain | la veille / le lendemain |
      | la semaine prochaine | la semaine suivante |
      | il y a deux jours | deux jours plus tôt |
      | ici | là |

      Go beyond *dire*: **affirmer, assurer, avouer, reconnaître, admettre, préciser, promettre, expliquer, se demander**. After a present-tense verb (*il dit que…*) nothing shifts.
    items:
      - {id: fr-b2-07-enseignement, type: vocab, l2: "l'enseignement", l1: "teaching / education (the system)", ex: "L'enseignement public est gratuit en France.", ex_l1: "State education is free in France.", note: "Masculine. l'enseignement supérieur = higher education."}
      - {id: fr-b2-07-college, type: vocab, l2: "le collège", l1: "the secondary school (ages 11–15)", ex: "Mon fils entre au collège en septembre.", ex_l1: "My son starts secondary school in September.", note: "False friend: a college or university is l'université or la fac."}
      - {id: fr-b2-07-lycee, type: vocab, l2: "le lycée", l1: "the upper secondary school / the high school (ages 15–18)", ex: "Ma fille est au lycée.", ex_l1: "My daughter is at high school.", note: "Masculine despite the -ée. un lycéen, une lycéenne = a pupil there."}
      - {id: fr-b2-07-bac, type: vocab, l2: "le bac", l1: "the baccalaureate (French school-leaving exam)", alt: ["le baccalauréat"], ex: "Il a eu son bac avec mention.", ex_l1: "He passed his bac with honours.", note: "avoir son bac = to pass it; passer le bac = to sit it. bac + 3 = three years of study after the bac."}
      - {id: fr-b2-07-fac, type: vocab, l2: "la fac", l1: "university (casual)", alt: ["l'université"], ex: "Je suis en deuxième année de fac.", ex_l1: "I'm in my second year at university.", note: "Short for la faculté. aller à la fac = to go to university."}
      - {id: fr-b2-07-licence, type: vocab, l2: "la licence", l1: "the bachelor's degree", ex: "Elle a une licence d'histoire.", ex_l1: "She has a bachelor's degree in history.", note: "False friend: a driving licence is le permis de conduire."}
      - {id: fr-b2-07-note, type: vocab, l2: "la note", l1: "the mark / the grade", ex: "J'ai eu une bonne note en maths.", ex_l1: "I got a good mark in maths.", note: "French marks are out of 20: dix sur vingt is a pass."}
      - {id: fr-b2-07-moyenne, type: vocab, l2: "la moyenne", l1: "the average / the pass mark", ex: "Il a eu la moyenne à l'examen.", ex_l1: "He got the pass mark in the exam.", note: "avoir la moyenne = to get at least 10 out of 20."}
      - {id: fr-b2-07-redoubler, type: vocab, l2: "redoubler", l1: "to repeat a year (at school)", ex: "Il a redoublé deux fois.", ex_l1: "He repeated a year twice.", note: "Common in France, rare in English-speaking schools."}
      - {id: fr-b2-07-s-inscrire, type: vocab, l2: "s'inscrire", l1: "to enrol / to sign up / to register", ex: "Je me suis inscrit à un cours de chinois.", ex_l1: "I've signed up for a Chinese course.", note: "Like écrire: je m'inscris, je me suis inscrit(e). l'inscription = enrolment."}
      - {id: fr-b2-07-frais-d-inscription, type: vocab, l2: "les frais d'inscription", l1: "tuition fees / registration fees", ex: "Les frais d'inscription sont peu élevés en France.", ex_l1: "Tuition fees are low in France.", note: "Masculine plural: les frais = costs, fees."}
      - {id: fr-b2-07-bourse, type: vocab, l2: "la bourse", l1: "the grant / the scholarship", ex: "Elle a obtenu une bourse pour étudier au Canada.", ex_l1: "She got a scholarship to study in Canada.", note: "la Bourse, with a capital, is the stock exchange."}
      - {id: fr-b2-07-memoire, type: vocab, l2: "le mémoire", l1: "the dissertation (for a master's degree)", ex: "J'écris mon mémoire sur Molière.", ex_l1: "I'm writing my dissertation on Molière.", note: "Masculine! la mémoire = memory. A doctoral thesis is une thèse."}
      - {id: fr-b2-07-reviser, type: vocab, l2: "réviser", l1: "to revise / to study (for an exam)", ex: "Je révise pour mes examens.", ex_l1: "I'm revising for my exams.", note: "les révisions = revision."}
      - {id: fr-b2-07-echouer, type: vocab, l2: "échouer", l1: "to fail (an exam, an attempt)", ex: "Il a échoué à l'examen du permis.", ex_l1: "He failed his driving test.", note: "échouer à un examen. Careful: passer un examen = to sit it, réussir un examen = to pass it."}
      - {id: fr-b2-07-concours, type: vocab, l2: "le concours", l1: "the competitive exam / the contest", ex: "Elle prépare le concours de professeur des écoles.", ex_l1: "She is preparing for the primary-teacher recruitment exam.", note: "Only the best candidates get a place, unlike an ordinary examen."}
      - {id: fr-b2-07-rentree, type: vocab, l2: "la rentrée", l1: "the start of the school year (in September)", ex: "La rentrée a lieu début septembre.", ex_l1: "School starts again at the beginning of September.", note: "Also the return to work after the summer: la rentrée politique."}
      - {id: fr-b2-07-avouer, type: vocab, l2: "avouer", l1: "to admit / to confess", ex: "J'avoue que je n'ai pas tout compris.", ex_l1: "I admit I didn't understand everything.", note: "J'avoue… is also a casual 'I must admit'."}
      - {id: fr-b2-07-reconnaitre, type: vocab, l2: "reconnaître", l1: "to acknowledge / to recognise", ex: "Il a reconnu son erreur.", ex_l1: "He acknowledged his mistake.", note: "Like connaître: il reconnaît, il a reconnu."}
      - {id: fr-b2-07-assurer, type: vocab, l2: "assurer", l1: "to assure (someone that…)", ex: "Elle m'a assuré qu'elle viendrait.", ex_l1: "She assured me she would come.", note: "Casual: Tu assures ! = You're doing brilliantly!"}
      - {id: fr-b2-07-se-demander, type: vocab, l2: "se demander", l1: "to wonder", ex: "Je me demande ce qu'il fait.", ex_l1: "I wonder what he's doing.", note: "se demander si / ce que / pourquoi…"}
      - {id: fr-b2-07-preciser, type: vocab, l2: "préciser", l1: "to specify / to point out", ex: "Il a précisé que le cours était annulé.", ex_l1: "He pointed out that the class was cancelled.", note: "précis = precise."}
      - {id: fr-b2-07-ce-qui-s-etait-passe, type: phrase, l2: "Il m'a demandé ce qui s'était passé.", l1: "He asked me what had happened.", note: "« Qu'est-ce qui s'est passé ? » → ce qui s'était passé."}
      - {id: fr-b2-07-elle-a-avoue, type: phrase, l2: "Elle a avoué qu'elle n'avait pas révisé.", l1: "She admitted she hadn't revised.", alt: ["Elle a reconnu qu'elle n'avait pas révisé.", "Elle a admis qu'elle n'avait pas révisé."]}
      - {id: fr-b2-07-je-me-demande-s-il-viendra, type: phrase, l2: "Je me demande s'il viendra.", l1: "I wonder if he'll come.", alt: ["Je me demande s'il va venir."], note: "Here si means 'whether', so the future is fine after it."}
      - {id: fr-b2-07-secher, type: phrase, l2: "Il a séché les cours.", l1: "He skipped classes. (casual)", alt: ["Il a séché le cours."], note: "sécher = to dry; sécher un cours = to skip a class."}
      - {id: fr-b2-07-promis-qu-elle-le-ferait, type: phrase, l2: "Elle a promis qu'elle le ferait.", l1: "She promised she would do it.", alt: ["Elle a promis de le faire."], note: "« Je le ferai » → qu'elle le ferait."}
      - {id: fr-b2-07-c1, type: cloze, text: "« Je viendrai demain. » → Il a dit qu'il ___ le lendemain.", answer: "viendrait", l1: "'I'll come tomorrow.' → He said he would come the next day.", note: "Futur → conditionnel présent; demain → le lendemain."}
      - {id: fr-b2-07-c2, type: cloze, text: "« J'aurai fini à midi. » → Elle a assuré qu'elle aurait ___ à midi.", answer: "fini", alt: ["terminé"], l1: "'I'll have finished by noon.' → She assured us she would have finished by noon.", note: "Futur antérieur → conditionnel passé."}
      - {id: fr-b2-07-c3, type: cloze, text: "« Où habites-tu ? » → Il m'a demandé où j'___.", answer: "habitais", l1: "'Where do you live?' → He asked me where I lived.", note: "Présent → imparfait. No inversion in a reported question."}
      - {id: fr-b2-07-c4, type: cloze, text: "« Qu'est-ce qui te fait peur ? » → Elle m'a demandé ___ qui me faisait peur.", answer: "ce", l1: "'What frightens you?' → She asked me what frightened me.", note: "qu'est-ce qui → ce qui."}
      - {id: fr-b2-07-c5, type: cloze, text: "« Ne parlez pas ! » → Le professeur nous a demandé de ne pas ___.", answer: "parler", l1: "'Don't talk!' → The teacher asked us not to talk.", note: "An order → de + infinitive. ne pas stays together before the infinitive."}
      - {id: fr-b2-07-c6, type: cloze, text: "« J'ai raté l'examen. » → Il a avoué qu'il ___ raté l'examen.", answer: "avait", l1: "'I failed the exam.' → He admitted he had failed the exam.", note: "Passé composé → plus-que-parfait."}
      - {id: fr-b2-07-c7, type: cloze, text: "« Je révisais quand tu as appelé. » → Elle a expliqué qu'elle ___ quand j'avais appelé.", answer: "révisait", l1: "'I was revising when you called.' → She explained that she had been revising when I called.", note: "The imparfait does not change."}
      - {id: fr-b2-07-c8, type: cloze, text: "« Tu as réussi ? » → Ma mère m'a demandé ___ j'avais réussi.", answer: "si", l1: "'Did you pass?' → My mother asked me if I had passed.", note: "A yes/no question → si."}
      - {id: fr-b2-07-c9, type: cloze, text: "« Le cours commence la semaine prochaine. » → Ils ont annoncé que le cours commençait la semaine ___.", answer: "suivante", l1: "'The course starts next week.' → They announced that the course started the following week.", note: "la semaine prochaine → la semaine suivante."}
      - {id: fr-b2-07-c10, type: cloze, text: "« Il faut que tu travailles. » → Elle m'a dit qu'il fallait que je ___.", answer: "travaille", l1: "'You have to work.' → She told me I had to work.", note: "The subjunctive stays; only il faut becomes il fallait."}
      - {id: fr-b2-07-c11, type: cloze, text: "« Je l'ai vu il y a deux jours. » → Il a dit qu'il l'avait vu deux jours plus ___.", answer: "tôt", l1: "'I saw him two days ago.' → He said he had seen him two days earlier.", note: "il y a deux jours → deux jours plus tôt (or auparavant)."}
      - {id: fr-b2-07-c12, type: cloze, text: "« Qu'est-ce que vous étudiez ? » → Il nous a demandé ce que nous ___.", answer: "étudiions", l1: "'What are you studying?' → He asked us what we were studying.", note: "Imparfait of étudier with nous: two i's, étudiions."}
      - {id: fr-b2-07-c13, type: cloze, text: "« Je suis fatigué. » → Il dit qu'il ___ fatigué.", answer: "est", l1: "'I'm tired.' → He says he is tired.", note: "The reporting verb is in the present (il dit): no shift."}
      - {id: fr-b2-07-c14, type: cloze, text: "« J'aurais voulu être médecin. » → Elle a dit qu'elle ___ voulu être médecin.", answer: "aurait", l1: "'I would have liked to be a doctor.' → She said she would have liked to be a doctor.", note: "The conditionnel passé does not change."}
      - {id: fr-b2-07-c15, type: cloze, text: "« Rendez vos copies ! » → Le surveillant leur a ordonné de ___ leurs copies.", answer: "rendre", l1: "'Hand in your papers!' → The invigilator ordered them to hand in their papers.", note: "An order → de + infinitive. une copie = an exam paper."}

  # ───────────────────────────────────────────────────────────────── 8
  - id: fr4-08
    title: "Justice and public life: the passive, se faire and pronominal verbs"
    goal: "I can talk about crime, the courts and official paperwork, and say what was done to whom using the passive, se faire + infinitive and pronominal verbs."
    notes: |
      ## The passive
      **être** (in any tense) + past participle agreeing with the subject: *Les accusés **seront jugés** lundi.* The doer follows **par**; with verbs of feeling or state, **de** is usual: *aimé **de** tous, couvert **de** neige, entouré **d'**amis*.

      Only a **direct** object can become the subject. *demander à, dire à, permettre à* cannot: "I was asked" is ***on m'a demandé***.

      ## Three alternatives French likes
      - **on** + active verb: *On a arrêté le suspect.*
      - **pronominal passive** for general truths and habits: *Ça **se vend** bien. Le vin blanc **se boit** frais. Ça **ne se fait pas**.*
      - **se faire + infinitive**: something done to you, often unwanted: *Il **s'est fait voler** son portefeuille. Elle **s'est fait opérer**.*

      ## faire + infinitive
      To have something done by someone else: *Je **fais réparer** ma voiture. Nous faisons construire une maison.* In *faire* + infinitive, the participle ***fait* never agrees**: *elle s'est **fait** couper les cheveux*.

      **se laisser + infinitive** = to let oneself be…: *Il **s'est laissé convaincre**.*

      False friend: *le crime* is a serious crime, usually murder; crime in general is *la délinquance*.
    items:
      - {id: fr-b2-08-tribunal, type: vocab, l2: "le tribunal", l1: "the court (of law)", ex: "L'affaire sera jugée par le tribunal de Paris.", ex_l1: "The case will be tried by the Paris court.", note: "Plural: les tribunaux."}
      - {id: fr-b2-08-juge, type: vocab, l2: "le juge", l1: "the judge", ex: "Le juge a reporté le procès.", ex_l1: "The judge postponed the trial.", note: "For a woman: la juge."}
      - {id: fr-b2-08-avocat, type: vocab, l2: "l'avocat", l1: "the lawyer (a man)", ex: "Vous avez le droit de voir un avocat.", ex_l1: "You have the right to see a lawyer.", note: "Feminine: l'avocate. un avocat is also an avocado!"}
      - {id: fr-b2-08-proces, type: vocab, l2: "le procès", l1: "the trial", ex: "Le procès a duré trois semaines.", ex_l1: "The trial lasted three weeks.", note: "False friend: a process is un processus."}
      - {id: fr-b2-08-accuse, type: vocab, l2: "l'accusé", l1: "the defendant / the accused (a man)", ex: "L'accusé a nié les faits.", ex_l1: "The defendant denied the charges.", note: "Feminine: l'accusée. les faits = the alleged acts."}
      - {id: fr-b2-08-temoin, type: vocab, l2: "le témoin", l1: "the witness", ex: "Un témoin a vu toute la scène.", ex_l1: "A witness saw the whole scene.", note: "Masculine, even for a woman. témoigner = to testify."}
      - {id: fr-b2-08-cambriolage, type: vocab, l2: "le cambriolage", l1: "the burglary", ex: "Il y a eu trois cambriolages dans la rue.", ex_l1: "There have been three burglaries in the street.", note: "cambrioler = to burgle; un cambrioleur = a burglar."}
      - {id: fr-b2-08-arnaque, type: vocab, l2: "l'arnaque", l1: "the scam / the rip-off (casual)", alt: ["l'escroquerie"], ex: "Ce site, c'est une arnaque.", ex_l1: "This website is a scam.", note: "Feminine. arnaquer = to con. The formal word is l'escroquerie."}
      - {id: fr-b2-08-peine, type: vocab, l2: "la peine", l1: "the sentence (a punishment)", ex: "Il a été condamné à une peine de prison.", ex_l1: "He was given a prison sentence.", note: "Also sorrow, trouble: ce n'est pas la peine = there's no need."}
      - {id: fr-b2-08-amende, type: vocab, l2: "l'amende", l1: "the fine", ex: "J'ai eu une amende pour excès de vitesse.", ex_l1: "I got a fine for speeding.", note: "Feminine. Casual: une prune, un PV."}
      - {id: fr-b2-08-porter-plainte, type: vocab, l2: "porter plainte", l1: "to press charges / to file a complaint (with the police)", ex: "Elle a porté plainte contre son voisin.", ex_l1: "She pressed charges against her neighbour.", note: "la plainte = the formal complaint. Different from se plaindre, just to complain."}
      - {id: fr-b2-08-condamner, type: vocab, l2: "condamner", l1: "to sentence / to convict / to condemn", ex: "Le tribunal l'a condamnée à une amende.", ex_l1: "The court fined her.", note: "condamner quelqu'un à + a sentence. The m is silent."}
      - {id: fr-b2-08-coupable, type: vocab, l2: "coupable", l1: "guilty", ex: "Le jury l'a déclaré coupable.", ex_l1: "The jury found him guilty.", note: "The opposite: innocent. la culpabilité = guilt."}
      - {id: fr-b2-08-policier, type: vocab, l2: "le policier", l1: "the police officer", alt: ["l'agent de police"], ex: "Un policier m'a demandé mes papiers.", ex_l1: "A police officer asked for my papers.", note: "Feminine: la policière. Casual: un flic. la police = the police (singular)."}
      - {id: fr-b2-08-commissariat, type: vocab, l2: "le commissariat", l1: "the police station", ex: "Je suis allé au commissariat pour porter plainte.", ex_l1: "I went to the police station to press charges.", note: "In the countryside: la gendarmerie."}
      - {id: fr-b2-08-prefecture, type: vocab, l2: "la préfecture", l1: "the prefecture (state office for permits)", ex: "Je dois aller à la préfecture pour mon titre de séjour.", ex_l1: "I have to go to the prefecture for my residence permit.", note: "Where foreigners apply for and renew their permits."}
      - {id: fr-b2-08-titre-de-sejour, type: vocab, l2: "le titre de séjour", l1: "the residence permit", ex: "Mon titre de séjour expire en mars.", ex_l1: "My residence permit expires in March.", note: "Also called la carte de séjour."}
      - {id: fr-b2-08-demarches, type: vocab, l2: "les démarches", l1: "the formalities / the paperwork (steps to take)", alt: ["les démarches administratives"], ex: "Les démarches sont longues et compliquées.", ex_l1: "The paperwork is long and complicated.", note: "Feminine. faire des démarches = to go through the procedures."}
      - {id: fr-b2-08-formulaire, type: vocab, l2: "le formulaire", l1: "the form (to fill in)", ex: "Remplissez ce formulaire, s'il vous plaît.", ex_l1: "Fill in this form, please."}
      - {id: fr-b2-08-piece-d-identite, type: vocab, l2: "la pièce d'identité", l1: "the ID / the identity document", ex: "Munissez-vous d'une pièce d'identité.", ex_l1: "Bring some ID with you.", note: "se munir de = to bring with you (formal)."}
      - {id: fr-b2-08-crime, type: vocab, l2: "le crime", l1: "the serious crime / the murder", ex: "Le crime n'a jamais été élucidé.", ex_l1: "The murder was never solved.", note: "Crime in general is la délinquance or la criminalité."}
      - {id: fr-b2-08-fait-voler, type: phrase, l2: "Je me suis fait voler mon portefeuille.", l1: "I've had my wallet stolen.", alt: ["On m'a volé mon portefeuille."], note: "se faire + infinitive: something done to you. fait never agrees here."}
      - {id: fr-b2-08-je-voudrais-porter-plainte, type: phrase, l2: "Je voudrais porter plainte.", l1: "I would like to report a crime. (at the police station)", alt: ["J'aimerais porter plainte.", "Je souhaite porter plainte.", "Je souhaiterais porter plainte."]}
      - {id: fr-b2-08-fait-avoir, type: phrase, l2: "Il s'est fait avoir.", l1: "He got conned. / He was had. (casual)", note: "se faire avoir = to be tricked."}
      - {id: fr-b2-08-ca-se-voit, type: phrase, l2: "Ça se voit.", l1: "It shows. / It's obvious.", note: "Pronominal passive: se voir = to be visible."}
      - {id: fr-b2-08-nul-n-est-cense, type: phrase, l2: "Nul n'est censé ignorer la loi.", l1: "Ignorance of the law is no excuse. (set phrase)", note: "nul = nobody (formal); être censé = to be supposed to; ignorer = not to know."}
      - {id: fr-b2-08-justice-soit-faite, type: phrase, l2: "Il faut que justice soit faite.", l1: "Justice must be done.", note: "No article in this set phrase: a passive in the subjunctive."}
      - {id: fr-b2-08-c1, type: cloze, text: "Le suspect a été ___ par la police hier soir.", answer: "arrêté", alt: ["interpellé"], l1: "The suspect was arrested by the police last night.", note: "Passive in the passé composé: a été + participle, agreeing with the subject."}
      - {id: fr-b2-08-c2, type: cloze, text: "Les accusés ___ jugés la semaine prochaine.", answer: "seront", l1: "The defendants will be tried next week.", note: "Future passive: seront + participle."}
      - {id: fr-b2-08-c3, type: cloze, text: "Elle s'est fait ___ à l'hôpital lundi.", answer: "opérer", l1: "She had an operation in hospital on Monday.", note: "se faire opérer = to have an operation. fait does not agree."}
      - {id: fr-b2-08-c4, type: cloze, text: "Le jardin était couvert ___ neige.", answer: "de", l1: "The garden was covered in snow.", note: "Passives of state or feeling often take de: couvert de, aimé de."}
      - {id: fr-b2-08-c5, type: cloze, text: "Je me suis ___ couper les cheveux.", answer: "fait", l1: "I had my hair cut.", note: "se faire couper les cheveux. A woman also writes fait: it never agrees before an infinitive."}
      - {id: fr-b2-08-c6, type: cloze, text: "Elle s'est fait ___ son sac dans le métro.", answer: "voler", alt: ["arracher"], l1: "She had her bag stolen on the metro.", note: "se faire voler quelque chose."}
      - {id: fr-b2-08-c7, type: cloze, text: "Nous faisons ___ notre maison par un architecte.", answer: "construire", alt: ["bâtir"], l1: "We are having our house built by an architect.", note: "faire + infinitive = to have something done."}
      - {id: fr-b2-08-c8, type: cloze, text: "Ce genre de vin se ___ très frais.", answer: "boit", alt: ["sert"], l1: "This kind of wine is drunk well chilled.", note: "Pronominal passive: se boire = to be drunk."}
      - {id: fr-b2-08-c9, type: cloze, text: "Ce modèle se ___ très bien en ce moment.", answer: "vend", l1: "This model is selling very well at the moment.", note: "se vendre = to sell, to be sold."}
      - {id: fr-b2-08-c10, type: cloze, text: "On m'a ___ de remplir ce formulaire.", answer: "demandé", l1: "I was asked to fill in this form.", note: "demander à quelqu'un cannot be passive: 'I was asked' = on m'a demandé."}
      - {id: fr-b2-08-c11, type: cloze, text: "Les amendes ont été ___ en janvier.", answer: "augmentées", l1: "The fines were increased in January.", note: "The participle agrees with les amendes: feminine plural."}
      - {id: fr-b2-08-c12, type: cloze, text: "Il s'est laissé ___ par l'avocat.", answer: "convaincre", alt: ["persuader"], l1: "He let himself be persuaded by the lawyer.", note: "se laisser + infinitive."}
      - {id: fr-b2-08-c13, type: cloze, text: "Le cambrioleur n'a jamais été ___.", answer: "retrouvé", l1: "The burglar was never found.", note: "Passive with a negative: n'a jamais été + participle."}
      - {id: fr-b2-08-c14, type: cloze, text: "Ça ne ___ fait pas de parler la bouche pleine.", answer: "se", l1: "It's not done to talk with your mouth full.", note: "ça ne se fait pas = that's not done."}
      - {id: fr-b2-08-c15, type: cloze, text: "Il a été condamné ___ deux ans de prison.", answer: "à", l1: "He was sentenced to two years in prison.", note: "condamner à + the sentence."}

  # ───────────────────────────────────────────────────────────────── 9
  - id: fr4-09
    title: "Culture and the arts: lequel, auquel, duquel, dont, ce dont"
    goal: "I can talk about art, theatre, music and books and build complex sentences with relative pronouns after prepositions."
    notes: |
      ## Preposition + lequel
      After a preposition, use **lequel / laquelle / lesquels / lesquelles**, agreeing with the noun: *le pinceau **avec lequel** il peint, la raison **pour laquelle** je viens*. For people, **qui** is more usual: *la femme avec qui je travaille*.

      ## à and de contract
      | | à + | de + |
      |---|---|---|
      | lequel | auquel | duquel |
      | laquelle | à laquelle | de laquelle |
      | lesquels | auxquels | desquels |
      | lesquelles | auxquelles | desquelles |

      - **à**-verbs: *participer à, assister à, penser à, s'intéresser à*: *le concours **auquel** j'ai participé*.
      - **de** after a **compound preposition** (*près de, à côté de, au milieu de, à cause de*): *le musée **près duquel** j'habite*.

      ## dont and ce dont
      For a plain **de** (*parler de, avoir besoin de*) use **dont**, never *duquel*: *le livre **dont** je parle*. **dont** also means "whose", and the noun keeps its article: *un peintre **dont les** œuvres sont célèbres*.

      "What" + a preposition verb: **ce dont** (*de*), **ce à quoi** (*à*): ***Ce dont** j'ai besoin, c'est de calme.*

      And for time, French says **où**: *le jour **où** je l'ai rencontrée*.
    items:
      - {id: fr-b2-09-oeuvre, type: vocab, l2: "l'œuvre", l1: "the work (of art or literature)", ex: "C'est une œuvre de jeunesse de Picasso.", ex_l1: "It's an early work by Picasso.", note: "Feminine: une œuvre. les œuvres complètes = the complete works."}
      - {id: fr-b2-09-chef-d-oeuvre, type: vocab, l2: "le chef-d'œuvre", l1: "the masterpiece", ex: "La Joconde est un chef-d'œuvre.", ex_l1: "The Mona Lisa is a masterpiece.", note: "Masculine, unlike œuvre. Plural: des chefs-d'œuvre. Say 'shè-deuvr'."}
      - {id: fr-b2-09-peintre, type: vocab, l2: "le peintre", l1: "the painter (an artist)", ex: "Monet est un peintre impressionniste.", ex_l1: "Monet is an impressionist painter.", note: "Same form for a woman: une peintre."}
      - {id: fr-b2-09-sculpteur, type: vocab, l2: "le sculpteur", l1: "the sculptor", ex: "Rodin est le sculpteur du Penseur.", ex_l1: "Rodin is the sculptor of The Thinker.", note: "The p is silent. For a woman: la sculptrice."}
      - {id: fr-b2-09-patrimoine, type: vocab, l2: "le patrimoine", l1: "heritage", ex: "Le Mont-Saint-Michel fait partie du patrimoine mondial.", ex_l1: "Mont-Saint-Michel is part of world heritage.", note: "les Journées du patrimoine = Heritage Days, in September."}
      - {id: fr-b2-09-spectacle, type: vocab, l2: "le spectacle", l1: "the show / the performance", ex: "Le spectacle commence à vingt heures.", ex_l1: "The show starts at 8 pm.", note: "Not 'spectacles': glasses are les lunettes."}
      - {id: fr-b2-09-mise-en-scene, type: vocab, l2: "la mise en scène", l1: "the staging / the direction (of a play or film)", ex: "J'ai adoré la mise en scène.", ex_l1: "I loved the staging.", note: "le metteur en scène = the stage director."}
      - {id: fr-b2-09-representation, type: vocab, l2: "la représentation", l1: "the performance (of a play)", ex: "Il reste des places pour la représentation de samedi.", ex_l1: "There are seats left for Saturday's performance.", note: "la première = the opening night."}
      - {id: fr-b2-09-compositeur, type: vocab, l2: "le compositeur", l1: "the composer", ex: "Debussy est un compositeur français.", ex_l1: "Debussy is a French composer.", note: "Feminine: la compositrice."}
      - {id: fr-b2-09-repetition, type: vocab, l2: "la répétition", l1: "the rehearsal", ex: "Les acteurs sont en répétition.", ex_l1: "The actors are rehearsing.", note: "Also 'repetition', but in the theatre it means rehearsal. répéter = to rehearse."}
      - {id: fr-b2-09-public, type: vocab, l2: "le public", l1: "the audience / the public", ex: "Le public a applaudi pendant dix minutes.", ex_l1: "The audience applauded for ten minutes.", note: "Singular in French. applaudir is like finir."}
      - {id: fr-b2-09-decor, type: vocab, l2: "le décor", l1: "the set / the scenery", ex: "Le décor représente une forêt.", ex_l1: "The set represents a forest.", note: "Often plural in the theatre: les décors."}
      - {id: fr-b2-09-intrigue, type: vocab, l2: "l'intrigue", l1: "the plot (of a story)", ex: "L'intrigue est assez compliquée.", ex_l1: "The plot is rather complicated.", note: "Feminine."}
      - {id: fr-b2-09-denouement, type: vocab, l2: "le dénouement", l1: "the ending / the outcome (of a story)", ex: "Je ne m'attendais pas à ce dénouement.", ex_l1: "I wasn't expecting that ending.", note: "Literally 'the untying' of the plot."}
      - {id: fr-b2-09-emouvant, type: vocab, l2: "émouvant", l1: "moving / touching (masculine)", ex: "C'est un film très émouvant.", ex_l1: "It's a very moving film.", note: "Feminine: émouvante. From émouvoir, to move emotionally."}
      - {id: fr-b2-09-bouleversant, type: vocab, l2: "bouleversant", l1: "deeply moving / overwhelming (masculine)", ex: "Son témoignage est bouleversant.", ex_l1: "Her testimony is deeply moving.", note: "bouleverser = to upset deeply, to turn upside down."}
      - {id: fr-b2-09-bande-dessinee, type: vocab, l2: "la bande dessinée", l1: "the comic book / the comic strip", alt: ["la BD"], ex: "Astérix est une bande dessinée célèbre.", ex_l1: "Astérix is a famous comic.", note: "Short form: la BD (say 'bé-dé'), also written la bédé in Québec."}
      - {id: fr-b2-09-court-metrage, type: vocab, l2: "le court-métrage", l1: "the short film", alt: ["le court métrage"], ex: "Elle a réalisé un court-métrage.", ex_l1: "She directed a short film.", note: "Plural: des courts-métrages. A feature film is un long-métrage."}
      - {id: fr-b2-09-version-originale, type: vocab, l2: "en version originale", l1: "in the original language (with subtitles)", alt: ["en VO"], ex: "Je préfère voir les films en version originale.", ex_l1: "I prefer to watch films in the original language.", note: "VOST = original version with subtitles. The dubbed version is la VF (version française)."}
      - {id: fr-b2-09-vernissage, type: vocab, l2: "le vernissage", l1: "the private view / the opening (of an exhibition)", ex: "Nous sommes invités au vernissage de l'exposition.", ex_l1: "We're invited to the opening of the exhibition.", note: "From vernir, to varnish."}
      - {id: fr-b2-09-raison-pour-laquelle, type: phrase, l2: "C'est la raison pour laquelle je suis venu.", l1: "That's the reason why I came. (a man speaking)", alt: ["C'est pour cette raison que je suis venu."], note: "la raison is feminine → pour laquelle."}
      - {id: fr-b2-09-ce-dont-j-ai-besoin, type: phrase, l2: "Ce dont j'ai besoin, c'est de calme.", l1: "What I need is some peace and quiet.", alt: ["Ce dont j'ai besoin, c'est du calme."], note: "avoir besoin de → ce dont; the de comes back after c'est."}
      - {id: fr-b2-09-ca-m-a-touche, type: phrase, l2: "Ça m'a beaucoup touché.", l1: "It really moved me. (a man speaking)", alt: ["Ça m'a vraiment touché."], note: "A woman writes touchée: the participle agrees with m', a direct object placed before."}
      - {id: fr-b2-09-vaut-le-detour, type: phrase, l2: "Ça vaut le détour.", l1: "It's worth the trip. / It's worth a visit.", note: "Guidebook language for a place worth going out of your way for."}
      - {id: fr-b2-09-gouts-et-couleurs, type: phrase, l2: "Les goûts et les couleurs, ça ne se discute pas.", l1: "There's no accounting for taste. (saying)", note: "Literally 'tastes and colours are not argued about'."}
      - {id: fr-b2-09-film-dont-tout-le-monde-parle, type: phrase, l2: "C'est un film dont tout le monde parle.", l1: "It's a film everyone is talking about.", note: "parler de → dont."}
      - {id: fr-b2-09-c1, type: cloze, text: "Voici le pinceau avec ___ il a peint ce tableau.", answer: "lequel", l1: "Here is the brush he painted this picture with.", note: "le pinceau (masculine singular) → avec lequel."}
      - {id: fr-b2-09-c2, type: cloze, text: "La raison pour ___ elle est partie reste un mystère.", answer: "laquelle", l1: "The reason why she left remains a mystery.", note: "la raison (feminine) → pour laquelle."}
      - {id: fr-b2-09-c3, type: cloze, text: "C'est le concours ___ j'ai participé.", answer: "auquel", l1: "It's the competition I took part in.", note: "participer à + lequel → auquel."}
      - {id: fr-b2-09-c4, type: cloze, text: "Les expositions ___ nous avons assisté étaient superbes.", answer: "auxquelles", l1: "The exhibitions we attended were superb.", note: "assister à + lesquelles → auxquelles."}
      - {id: fr-b2-09-c5, type: cloze, text: "Ce sont des problèmes ___ on ne pense jamais.", answer: "auxquels", l1: "These are problems nobody ever thinks about.", note: "penser à + lesquels → auxquels."}
      - {id: fr-b2-09-c6, type: cloze, text: "Le musée près ___ j'habite est gratuit le dimanche.", answer: "duquel", l1: "The museum I live near is free on Sundays.", note: "After a compound preposition (près de) → duquel, never dont."}
      - {id: fr-b2-09-c7, type: cloze, text: "Les arbres à côté ___ nous avons pique-niqué étaient très vieux.", answer: "desquels", l1: "The trees we had a picnic next to were very old.", note: "à côté de + lesquels → à côté desquels."}
      - {id: fr-b2-09-c8, type: cloze, text: "C'est un peintre ___ les œuvres sont exposées au Louvre.", answer: "dont", l1: "He is a painter whose works are exhibited in the Louvre.", note: "dont = whose; the noun keeps its article: dont les œuvres."}
      - {id: fr-b2-09-c9, type: cloze, text: "___ dont j'ai envie, c'est de partir en voyage.", answer: "ce", l1: "What I feel like is going on a trip.", note: "avoir envie de → ce dont."}
      - {id: fr-b2-09-c10, type: cloze, text: "Ce à ___ je m'intéresse, c'est la peinture moderne.", answer: "quoi", l1: "What I'm interested in is modern painting.", note: "s'intéresser à → ce à quoi."}
      - {id: fr-b2-09-c11, type: cloze, text: "La femme avec ___ je travaille est sculptrice.", answer: "qui", alt: ["laquelle"], l1: "The woman I work with is a sculptor.", note: "For people after a preposition, qui is usual; laquelle is also correct."}
      - {id: fr-b2-09-c12, type: cloze, text: "Le spectacle ___ j'ai vu hier était émouvant.", answer: "que", l1: "The show I saw yesterday was moving.", note: "voir has a direct object, no preposition → que."}
      - {id: fr-b2-09-c13, type: cloze, text: "Le jour ___ je l'ai rencontrée, il pleuvait.", answer: "où", l1: "The day I met her, it was raining.", note: "For time, French uses où, not quand."}
      - {id: fr-b2-09-c14, type: cloze, text: "Les raisons pour ___ il a refusé restent mystérieuses.", answer: "lesquelles", l1: "The reasons why he refused remain mysterious.", note: "les raisons (feminine plural) → pour lesquelles."}
      - {id: fr-b2-09-c15, type: cloze, text: "Voici les documents sans ___ tu ne peux pas t'inscrire.", answer: "lesquels", l1: "Here are the documents without which you can't enrol. (informal)", note: "les documents (masculine plural) → sans lesquels."}

  # ───────────────────────────────────────────────────────────────── 10
  - id: fr4-10
    title: "Money and shopping: the -ant forms"
    goal: "I can talk about banking, spending and saving, and choose correctly between the gérondif, the present participle and the verbal adjective."
    notes: |
      French has three -ant forms that English lumps together.

      ## 1. The gérondif: en + -ant
      Same subject; how, when or while (B1). **tout en** adds "at the same time" or a contrast: ***Tout en** sachant que c'était cher, il l'a acheté.*

      ## 2. The participe présent: -ant alone
      Mostly written. It replaces *qui* + verb or gives a cause, and it **never agrees**: *Les clients **souhaitant** un remboursement…* (= qui souhaitent); ***Ne sachant** pas quoi faire, j'ai appelé.* The past form is **ayant / étant** + participle: ***Ayant perdu** sa carte, il n'a pas pu payer.*

      ## 3. The adjectif verbal
      An ordinary adjective: it **agrees**: *une offre **intéressante**, des enfants **obéissants***. Some are **spelled differently** from the participle:

      | participe présent | adjectif verbal |
      |---|---|
      | fatiguant | fatigant |
      | convainquant | convaincant |
      | provoquant | provocant |
      | négligeant | négligent |
      | différant | différent |
      | précédant | précédent |

      Test: if it has an object or an adverb after it, it is the participle: *un travail **fatigant*** but *en **fatiguant** ses collègues*.

      After every preposition except *en*, use the infinitive: *sans **payer***, *à **regarder***.
    items:
      - {id: fr-b2-10-virement, type: vocab, l2: "le virement", l1: "the bank transfer", ex: "Je vous paie par virement.", ex_l1: "I'll pay you by bank transfer.", note: "faire un virement. virer = to transfer money, and casually, to fire someone."}
      - {id: fr-b2-10-prelevement, type: vocab, l2: "le prélèvement", l1: "the direct debit", ex: "Le loyer est payé par prélèvement automatique.", ex_l1: "The rent is paid by direct debit.", note: "prélever = to deduct, to take (money, a sample)."}
      - {id: fr-b2-10-decouvert, type: vocab, l2: "le découvert", l1: "the overdraft", ex: "J'ai un découvert autorisé de cinq cents euros.", ex_l1: "I have an authorised overdraft of five hundred euros.", note: "être à découvert = to be overdrawn."}
      - {id: fr-b2-10-pret, type: vocab, l2: "le prêt", l1: "the loan", alt: ["le crédit"], ex: "Nous avons obtenu un prêt pour acheter la maison.", ex_l1: "We got a loan to buy the house.", note: "From prêter. un prêt immobilier = a mortgage."}
      - {id: fr-b2-10-economies, type: vocab, l2: "les économies", l1: "savings", ex: "J'ai dépensé toutes mes économies.", ex_l1: "I spent all my savings.", note: "faire des économies = to save money. l'économie (singular) = the economy."}
      - {id: fr-b2-10-depenser, type: vocab, l2: "dépenser", l1: "to spend (money)", ex: "Il dépense tout son salaire en vêtements.", ex_l1: "He spends his whole salary on clothes.", note: "Time is spent with passer: passer une heure à lire. les dépenses = expenses."}
      - {id: fr-b2-10-soldes, type: vocab, l2: "les soldes", l1: "the sales (seasonal reductions)", ex: "Les soldes commencent en janvier.", ex_l1: "The sales start in January.", note: "Masculine plural. en solde = reduced. In France the sales have fixed dates."}
      - {id: fr-b2-10-en-promotion, type: vocab, l2: "en promotion", l1: "on special offer", alt: ["en promo"], ex: "Les fraises sont en promotion cette semaine.", ex_l1: "Strawberries are on special offer this week.", note: "Casual: en promo. une promotion is also a promotion at work."}
      - {id: fr-b2-10-qualite-prix, type: vocab, l2: "le rapport qualité-prix", l1: "value for money", ex: "Ce restaurant a un excellent rapport qualité-prix.", ex_l1: "This restaurant is excellent value for money.", note: "Literally 'the quality-price ratio'."}
      - {id: fr-b2-10-facture, type: vocab, l2: "la facture", l1: "the bill / the invoice", ex: "La facture d'électricité est arrivée.", ex_l1: "The electricity bill has arrived.", note: "In a restaurant the bill is l'addition."}
      - {id: fr-b2-10-remboursement, type: vocab, l2: "le remboursement", l1: "the refund / the repayment", ex: "J'attends toujours mon remboursement.", ex_l1: "I'm still waiting for my refund.", note: "From rembourser."}
      - {id: fr-b2-10-garantie, type: vocab, l2: "la garantie", l1: "the guarantee / the warranty", ex: "L'appareil est encore sous garantie.", ex_l1: "The appliance is still under warranty.", note: "sous garantie = under warranty."}
      - {id: fr-b2-10-pourboire, type: vocab, l2: "le pourboire", l1: "the tip (for service)", ex: "En France, le pourboire n'est pas obligatoire.", ex_l1: "In France, tipping isn't compulsory.", note: "Service is included in French prices; in Québec a tip of about 15% is expected."}
      - {id: fr-b2-10-sans-contact, type: vocab, l2: "le paiement sans contact", l1: "contactless payment", ex: "Le paiement sans contact est accepté.", ex_l1: "Contactless payment is accepted.", note: "payer sans contact = to pay contactless."}
      - {id: fr-b2-10-endette, type: vocab, l2: "endetté", l1: "in debt (masculine)", ex: "Beaucoup d'étudiants sont endettés.", ex_l1: "Many students are in debt.", note: "une dette = a debt; s'endetter = to get into debt."}
      - {id: fr-b2-10-radin, type: vocab, l2: "radin", l1: "stingy / tight-fisted (casual; masculine)", ex: "Il ne laisse jamais de pourboire : il est radin !", ex_l1: "He never leaves a tip: he's so stingy!", note: "Feminine: radine. Neutral: avare."}
      - {id: fr-b2-10-depensier, type: vocab, l2: "dépensier", l1: "extravagant / free-spending (masculine)", ex: "Ma sœur est très dépensière.", ex_l1: "My sister spends money like water.", note: "Feminine: dépensière."}
      - {id: fr-b2-10-fauche, type: vocab, l2: "fauché", l1: "broke / skint (casual; masculine)", ex: "Je ne peux pas sortir ce soir, je suis fauché.", ex_l1: "I can't go out tonight, I'm broke.", note: "Feminine: fauchée. Literally 'mown down'."}
      - {id: fr-b2-10-abordable, type: vocab, l2: "abordable", l1: "affordable / reasonably priced", ex: "Les prix sont très abordables.", ex_l1: "The prices are very affordable.", note: "Also approachable, of a person."}
      - {id: fr-b2-10-rentable, type: vocab, l2: "rentable", l1: "profitable / cost-effective", ex: "Ce magasin n'est plus rentable.", ex_l1: "This shop is no longer profitable.", note: "la rentabilité = profitability."}
      - {id: fr-b2-10-fatigant, type: vocab, l2: "fatigant", l1: "tiring (masculine)", ex: "Ce voyage était très fatigant.", ex_l1: "This journey was very tiring.", note: "The adjective has no u: fatigant(e). The participle keeps it: en fatiguant."}
      - {id: fr-b2-10-convaincant, type: vocab, l2: "convaincant", l1: "convincing (masculine)", ex: "Son argument est convaincant.", ex_l1: "His argument is convincing.", note: "The adjective has c: convaincant(e). The participle has qu: en convainquant."}
      - {id: fr-b2-10-yeux-de-la-tete, type: phrase, l2: "Ça coûte les yeux de la tête.", l1: "It costs an arm and a leg. (idiom with eyes)", alt: ["Ça coûte un bras."], note: "Literally 'the eyes of the head'."}
      - {id: fr-b2-10-je-suis-a-decouvert, type: phrase, l2: "Je suis à découvert.", l1: "I'm overdrawn."}
      - {id: fr-b2-10-par-les-fenetres, type: phrase, l2: "Il jette l'argent par les fenêtres.", l1: "He throws his money away. (idiom with windows)", note: "Literally 'throws money out of the windows'."}
      - {id: fr-b2-10-serrer-la-ceinture, type: phrase, l2: "Il va falloir se serrer la ceinture.", l1: "We'll have to tighten our belts. (idiom)", alt: ["Il faut se serrer la ceinture."], note: "falloir has only an il form: il va falloir = it is going to be necessary."}
      - {id: fr-b2-10-pas-donne, type: phrase, l2: "Ce n'est pas donné.", l1: "It's not cheap. / It's pricey.", alt: ["C'est pas donné."], note: "donné = given away."}
      - {id: fr-b2-10-c1, type: cloze, text: "Il a trouvé un bon prix en ___ les sites.", answer: "comparant", l1: "He found a good price by comparing the websites.", note: "Gérondif: en + -ant (nous comparons → comparant)."}
      - {id: fr-b2-10-c2, type: cloze, text: "Tout en ___ beaucoup, il n'est jamais fauché.", answer: "dépensant", l1: "Although he spends a lot, he is never broke.", note: "tout en + -ant: two things at once, often with a contrast."}
      - {id: fr-b2-10-c3, type: cloze, text: "Les clients ___ un remboursement doivent garder leur ticket de caisse.", answer: "souhaitant", alt: ["désirant", "voulant"], l1: "Customers wanting a refund must keep their receipt.", note: "Participe présent = qui souhaitent. Written style, invariable."}
      - {id: fr-b2-10-c4, type: cloze, text: "___ perdu sa carte, il n'a pas pu payer.", answer: "ayant", l1: "Having lost his card, he couldn't pay.", note: "Past participle form: ayant + participle."}
      - {id: fr-b2-10-c5, type: cloze, text: "___ arrivée en retard, elle a raté le début des soldes.", answer: "étant", l1: "Having arrived late, she missed the start of the sales.", note: "With être verbs: étant + participle, which agrees (arrivée)."}
      - {id: fr-b2-10-c6, type: cloze, text: "Ce comptable est vraiment ___ : il fait toujours des erreurs.", answer: "négligent", l1: "This accountant is really careless: he always makes mistakes.", note: "Adjective: négligent. Participle: négligeant."}
      - {id: fr-b2-10-c7, type: cloze, text: "Leurs publicités sont volontairement ___.", answer: "provocantes", l1: "Their adverts are deliberately provocative.", note: "Adjective provocant, agreeing with les publicités. Participle: provoquant."}
      - {id: fr-b2-10-c8, type: cloze, text: "Les jours ___ la fête, nous avons tout préparé.", answer: "précédant", l1: "In the days before the party, we got everything ready.", note: "It has an object (la fête), so it is the participle: précédant, invariable."}
      - {id: fr-b2-10-c9, type: cloze, text: "L'année ___, les prix étaient plus bas.", answer: "précédente", l1: "The previous year, prices were lower.", note: "An adjective, agreeing with l'année: précédente."}
      - {id: fr-b2-10-c10, type: cloze, text: "Les deux banques proposent des tarifs très ___.", answer: "différents", l1: "The two banks offer very different rates.", note: "Adjective différent(s). The participle différant means 'differing'."}
      - {id: fr-b2-10-c11, type: cloze, text: "On peut faire des économies en ___ ses abonnements.", answer: "réduisant", alt: ["résiliant", "supprimant"], l1: "You can save money by cutting down your subscriptions.", note: "réduire: nous réduisons → réduisant."}
      - {id: fr-b2-10-c12, type: cloze, text: "Ne ___ pas quoi choisir, j'ai demandé conseil au vendeur.", answer: "sachant", l1: "Not knowing what to choose, I asked the sales assistant for advice.", note: "Participe présent giving a cause. savoir → sachant (irregular)."}
      - {id: fr-b2-10-c13, type: cloze, text: "Il est parti sans ___ l'addition.", answer: "payer", alt: ["régler"], l1: "He left without paying the bill.", note: "After sans (and every preposition except en): infinitive."}
      - {id: fr-b2-10-c14, type: cloze, text: "Elle a passé l'après-midi à ___ les vitrines.", answer: "lécher", alt: ["regarder", "faire"], l1: "She spent the afternoon window-shopping.", note: "passer du temps à + infinitive. lécher les vitrines (lick the windows) = to go window-shopping; also faire les vitrines."}
      - {id: fr-b2-10-c15, type: cloze, text: "Ces enfants sont très ___ : ils écoutent toujours leurs parents.", answer: "obéissants", l1: "These children are very obedient: they always listen to their parents.", note: "A verbal adjective agrees: obéissants."}

  # ───────────────────────────────────────────────────────────────── 11
  - id: fr4-11
    title: "History and stories: the passé simple and the ne explétif"
    goal: "I can read a tale, a novel or a history text written in the passé simple, and recognise the ne explétif in formal French."
    notes: |
      The **passé simple** is the past tense of written narrative: novels, tales, history books, biographies. Speech uses the passé composé instead. You mainly need to **recognise** the third person.

      | | il / elle | ils / elles |
      |---|---|---|
      | parler (all -er) | parla | parlèrent |
      | finir, partir | finit, partit | finirent, partirent |
      | prendre, mettre, dire | prit, mit, dit | prirent, mirent, dirent |
      | être | fut | furent |
      | avoir | eut | eurent |
      | faire | fit | firent |
      | venir, tenir | vint, tint | vinrent, tinrent |
      | pouvoir, savoir, devoir | put, sut, dut | purent, surent, durent |
      | naître, mourir, vivre | naquit, mourut, vécut | naquirent, moururent, vécurent |

      It works with the **imparfait** just as the passé composé does: the imparfait sets the scene, the passé simple moves the story on. *Il **pleuvait**. Soudain, la porte **s'ouvrit**.*

      ## The ne explétif
      Formal French adds a **ne** that is **not negative** after *avant que, à moins que, de peur que, craindre que, avoir peur que, éviter que*, and in comparisons: *C'est plus difficile **que je ne** pensais.* It means exactly the same without it. A real negative needs *pas*: *avant qu'il **ne** pleuve* (before it rains) ≠ *qu'il ne pleuve **pas*** (that it doesn't rain).
    items:
      - {id: fr-b2-11-il-fut, type: vocab, l2: "il fut", l1: "he was / it was (passé simple of être)", ex: "Ce fut une journée terrible.", ex_l1: "It was a terrible day.", note: "Written narrative only. Plural: ils furent. In speech: il a été."}
      - {id: fr-b2-11-il-eut, type: vocab, l2: "il eut", l1: "he had (passé simple of avoir)", ex: "Il eut soudain une idée.", ex_l1: "Suddenly he had an idea.", note: "eut sounds like 'u'. Plural: ils eurent."}
      - {id: fr-b2-11-il-fit, type: vocab, l2: "il fit", l1: "he did / he made (passé simple of faire)", ex: "Il fit un long voyage en Orient.", ex_l1: "He made a long journey to the East.", note: "Plural: ils firent."}
      - {id: fr-b2-11-il-vint, type: vocab, l2: "il vint", l1: "he came (passé simple of venir)", ex: "Il vint me voir un soir d'hiver.", ex_l1: "He came to see me one winter evening.", note: "Plural: ils vinrent. Same pattern: il tint (tenir), il devint (devenir)."}
      - {id: fr-b2-11-il-prit, type: vocab, l2: "il prit", l1: "he took (passé simple of prendre)", ex: "Il prit son chapeau et sortit.", ex_l1: "He took his hat and went out.", note: "Plural: ils prirent."}
      - {id: fr-b2-11-il-vit, type: vocab, l2: "il vit", l1: "he saw (passé simple of voir)", ex: "Il vit une lumière au loin.", ex_l1: "He saw a light in the distance.", note: "Spelled like il vit (he lives, from vivre). Context decides."}
      - {id: fr-b2-11-il-mit, type: vocab, l2: "il mit", l1: "he put (passé simple of mettre)", ex: "Il mit la lettre dans sa poche.", ex_l1: "He put the letter in his pocket.", note: "se mettre à = to start: il se mit à pleurer."}
      - {id: fr-b2-11-il-naquit, type: vocab, l2: "il naquit", l1: "he was born (passé simple of naître)", ex: "Il naquit dans un petit village.", ex_l1: "He was born in a small village.", note: "In speech: il est né."}
      - {id: fr-b2-11-il-mourut, type: vocab, l2: "il mourut", l1: "he died (passé simple of mourir)", ex: "Il mourut à l'âge de quatre-vingts ans.", ex_l1: "He died at the age of eighty.", note: "In speech: il est mort."}
      - {id: fr-b2-11-il-put, type: vocab, l2: "il put", l1: "he was able to / he managed to (passé simple of pouvoir)", ex: "Il ne put rien faire.", ex_l1: "He could do nothing.", note: "Plural: ils purent. Also il sut (savoir), il dut (devoir)."}
      - {id: fr-b2-11-ils-parlerent, type: vocab, l2: "ils parlèrent", l1: "they spoke (passé simple of parler)", ex: "Ils parlèrent toute la nuit.", ex_l1: "They talked all night.", note: "Every -er verb: -a in the singular, -èrent in the plural: ils arrivèrent, ils allèrent."}
      - {id: fr-b2-11-il-alla, type: vocab, l2: "il alla", l1: "he went (passé simple of aller)", ex: "Il alla frapper à la porte.", ex_l1: "He went to knock on the door.", note: "aller is regular in the passé simple: il alla, ils allèrent."}
      - {id: fr-b2-11-siecle, type: vocab, l2: "le siècle", l1: "the century", ex: "Le château date du seizième siècle.", ex_l1: "The castle dates from the sixteenth century.", note: "Often written in Roman numerals: le XVIe siècle, le XXIe siècle."}
      - {id: fr-b2-11-roi, type: vocab, l2: "le roi", l1: "the king", ex: "Louis XIV fut roi de France pendant soixante-douze ans.", ex_l1: "Louis XIV was king of France for seventy-two years.", note: "la reine = the queen. Say Louis Quatorze, with no 'the'."}
      - {id: fr-b2-11-guerre, type: vocab, l2: "la guerre", l1: "the war", ex: "Mon arrière-grand-père a fait la guerre.", ex_l1: "My great-grandfather fought in the war.", note: "la Première / la Seconde Guerre mondiale."}
      - {id: fr-b2-11-paix, type: vocab, l2: "la paix", l1: "peace", ex: "Laisse-moi en paix !", ex_l1: "Leave me in peace!", note: "Casual: Fiche-moi la paix ! = Leave me alone!"}
      - {id: fr-b2-11-bataille, type: vocab, l2: "la bataille", l1: "the battle", ex: "Napoléon perdit la bataille de Waterloo en 1815.", ex_l1: "Napoleon lost the battle of Waterloo in 1815.", note: "perdit: passé simple of perdre."}
      - {id: fr-b2-11-regne, type: vocab, l2: "le règne", l1: "the reign", ex: "Versailles fut agrandi sous le règne de Louis XIV.", ex_l1: "Versailles was enlarged during the reign of Louis XIV.", note: "régner = to reign."}
      - {id: fr-b2-11-moyen-age, type: vocab, l2: "le Moyen Âge", l1: "the Middle Ages", ex: "Cette ville date du Moyen Âge.", ex_l1: "This town dates from the Middle Ages.", note: "Masculine singular. médiéval = medieval."}
      - {id: fr-b2-11-conte, type: vocab, l2: "le conte", l1: "the tale / the fairy tale", alt: ["le conte de fées"], ex: "Les contes de Perrault commencent par « Il était une fois ».", ex_l1: "Perrault's tales begin with 'Once upon a time'.", note: "Not le compte (account) or le comte (count): all three sound the same."}
      - {id: fr-b2-11-heros, type: vocab, l2: "le héros", l1: "the hero", ex: "Le héros du roman meurt à la fin.", ex_l1: "The hero of the novel dies at the end.", note: "The h is aspirate: le héros, les héros (no liaison). But l'héroïne."}
      - {id: fr-b2-11-recit, type: vocab, l2: "le récit", l1: "the account / the narrative", ex: "Il a fait le récit de son voyage.", ex_l1: "He gave an account of his journey.", note: "From réciter; the noun of raconter in writing."}
      - {id: fr-b2-11-il-etait-une-fois, type: phrase, l2: "Il était une fois…", l1: "Once upon a time…", note: "The imparfait of être: the fixed opening of fairy tales."}
      - {id: fr-b2-11-vecurent-heureux, type: phrase, l2: "Ils vécurent heureux et eurent beaucoup d'enfants.", l1: "They lived happily ever after. (fairy-tale ending)", note: "Passé simple of vivre and avoir: literally 'and had many children'."}
      - {id: fr-b2-11-plus-difficile-que-je-ne, type: phrase, l2: "C'est plus difficile que je ne le pensais.", l1: "It's harder than I thought. (formal, with the ne explétif)", alt: ["C'est plus difficile que je ne pensais."], note: "This ne does not make it negative. In speech: c'est plus dur que je pensais."}
      - {id: fr-b2-11-peur-qu-il-ne-soit-parti, type: phrase, l2: "J'ai peur qu'il ne soit déjà parti.", l1: "I'm afraid he has already left. (formal, with the ne explétif)", note: "Not 'that he hasn't left': that would be qu'il ne soit pas parti."}
      - {id: fr-b2-11-c1, type: cloze, text: "Il était une fois un roi qui ___ trois filles.", answer: "avait", l1: "Once upon a time there was a king who had three daughters.", note: "Background description → imparfait, even in a passé simple story."}
      - {id: fr-b2-11-c2, type: cloze, text: "Un jour, le roi ___ gravement malade.", answer: "tomba", l1: "One day, the king fell seriously ill. (passé simple)", note: "-er verbs: il tomba."}
      - {id: fr-b2-11-c3, type: cloze, text: "Les soldats ___ la ville au petit matin.", answer: "quittèrent", alt: ["attaquèrent"], l1: "The soldiers left the town at dawn. (passé simple)", note: "-er verbs in the plural: -èrent."}
      - {id: fr-b2-11-c4, type: cloze, text: "Marie Curie ___ deux prix Nobel.", answer: "obtint", alt: ["reçut", "eut", "remporta"], l1: "Marie Curie won two Nobel Prizes. (passé simple)", note: "obtenir → elle obtint, like venir → elle vint."}
      - {id: fr-b2-11-c5, type: cloze, text: "Quand elle ouvrit la porte, elle ___ un grand loup.", answer: "aperçut", alt: ["vit"], l1: "When she opened the door, she caught sight of a big wolf. (passé simple)", note: "apercevoir → elle aperçut, like recevoir → elle reçut."}
      - {id: fr-b2-11-c6, type: cloze, text: "« Entrez ! » ___-il.", answer: "dit", alt: ["cria"], l1: "'Come in!' he said. (passé simple)", note: "After a quotation the verb and subject swap: dit-il, répondit-elle."}
      - {id: fr-b2-11-c7, type: cloze, text: "Ils ___ la bataille malgré leur courage.", answer: "perdirent", l1: "They lost the battle despite their courage. (passé simple)", note: "-re verbs: il perdit, ils perdirent."}
      - {id: fr-b2-11-c8, type: cloze, text: "En 1789, le peuple de Paris ___ la Bastille.", answer: "prit", l1: "In 1789, the people of Paris took the Bastille. (passé simple)", note: "prendre → il prit."}
      - {id: fr-b2-11-c9, type: cloze, text: "Le prince ___ au château le lendemain.", answer: "revint", alt: ["retourna", "vint", "arriva"], l1: "The prince came back to the castle the next day. (passé simple)", note: "revenir → il revint."}
      - {id: fr-b2-11-c10, type: cloze, text: "Après la guerre, elle ___ une écrivaine célèbre.", answer: "devint", l1: "After the war, she became a famous writer. (passé simple)", note: "devenir → elle devint."}
      - {id: fr-b2-11-c11, type: cloze, text: "Les enfants ___ peur et s'enfuirent.", answer: "eurent", l1: "The children were frightened and ran away. (passé simple)", note: "avoir peur → ils eurent peur. s'enfuir = to run away."}
      - {id: fr-b2-11-c12, type: cloze, text: "Rentrons avant qu'il ___ fasse nuit.", answer: "ne", l1: "Let's go home before it gets dark. (formal, with the ne explétif)", note: "Not a negative: the sentence means the same without it."}
      - {id: fr-b2-11-c13, type: cloze, text: "Il est plus intelligent qu'il ne le ___.", answer: "paraît", alt: ["semble"], l1: "He is more intelligent than he seems.", note: "ne explétif in a comparison, plus the neuter le."}
      - {id: fr-b2-11-c14, type: cloze, text: "Le roi craignait que son fils ne le ___.", answer: "trahisse", l1: "The king feared his son would betray him.", note: "craindre que + ne explétif + subjunctive. trahir → qu'il trahisse."}

  # ───────────────────────────────────────────────────────────────── 12
  - id: fr4-12
    title: "Building an argument: discourse markers and abstract nouns"
    goal: "I can structure a spoken or written argument, concede and counter points, and discuss ideas with abstract nouns."
    notes: |
      A B2 argument is signposted. You already know *cependant, en revanche, d'ailleurs, en effet, pourtant, donc*. Add these:

      | job | markers |
      |---|---|
      | add | de plus, en outre, par ailleurs |
      | contrast | néanmoins, toutefois, alors que, tandis que |
      | concede | certes … mais, il est vrai que … mais |
      | consequence | par conséquent, ainsi, si bien que (+ indicative) |
      | clarify | c'est-à-dire, autrement dit, notamment, voire |
      | structure | d'une part … d'autre part, quant à |
      | conclude | en somme, en définitive, bref |

      ## or
      **Or** (no accent) is not English "or" (*ou*). It introduces the fact that decides the argument: *Il dit qu'il était chez lui. **Or**, on l'a vu au café.* = Yet / Now.

      ## Inversion after aussi and ainsi
      At the start of a clause, **aussi** means "therefore" and is followed by inversion in writing: ***Aussi a-t-il** dû vendre sa maison.* Not to be confused with *aussi* = also.

      ## Abstract nouns
      Arguments run on nouns: *l'enjeu, le défi, la contrainte, la tendance, le constat*. They need their article: *Le défi est énorme.*

      Concede before you counter: ***Certes**, c'est cher, **mais** c'est efficace.*
    items:
      - {id: fr-b2-12-neanmoins, type: vocab, l2: "néanmoins", l1: "nevertheless / nonetheless", ex: "C'est difficile ; néanmoins, c'est possible.", ex_l1: "It's difficult; nevertheless, it's possible.", note: "Formal; close to toutefois and cependant."}
      - {id: fr-b2-12-or, type: vocab, l2: "or", l1: "now / and yet (introducing a deciding fact)", ex: "Il dit qu'il était chez lui. Or, on l'a vu au café.", ex_l1: "He says he was at home. Yet he was seen at the café.", note: "No accent. English 'or' is ou."}
      - {id: fr-b2-12-par-consequent, type: vocab, l2: "par conséquent", l1: "consequently / as a result", alt: ["en conséquence"], ex: "Les cheminots sont en grève ; par conséquent, la réunion est reportée.", ex_l1: "The railway workers are on strike; consequently, the meeting has been postponed.", note: "More formal than donc."}
      - {id: fr-b2-12-c-est-a-dire, type: vocab, l2: "c'est-à-dire", l1: "that is to say / i.e.", ex: "Je pars dans huit jours, c'est-à-dire mardi prochain.", ex_l1: "I'm leaving in a week, that is, next Tuesday.", note: "Written c.-à-d. As a question, C'est-à-dire ? = Meaning what?"}
      - {id: fr-b2-12-en-outre, type: vocab, l2: "en outre", l1: "furthermore / in addition (formal)", alt: ["de plus"], ex: "Ce logement est trop petit. En outre, il est mal situé.", ex_l1: "This flat is too small. Furthermore, it is badly located.", note: "In speech: en plus."}
      - {id: fr-b2-12-par-ailleurs, type: vocab, l2: "par ailleurs", l1: "moreover / besides / in other respects", ex: "Il est très compétent ; par ailleurs, il parle trois langues.", ex_l1: "He is very competent; moreover, he speaks three languages.", note: "Also 'otherwise, in other respects': par ailleurs, tout va bien."}
      - {id: fr-b2-12-certes, type: vocab, l2: "certes", l1: "admittedly / certainly (conceding a point)", ex: "Certes, il a fait des erreurs, mais il a beaucoup travaillé.", ex_l1: "Admittedly, he made mistakes, but he worked hard.", note: "Almost always followed by mais: concede, then counter."}
      - {id: fr-b2-12-autrement-dit, type: vocab, l2: "autrement dit", l1: "in other words", alt: ["en d'autres termes"], ex: "Il n'a pas répondu. Autrement dit, c'est non.", ex_l1: "He didn't answer. In other words, it's a no."}
      - {id: fr-b2-12-notamment, type: vocab, l2: "notamment", l1: "in particular / notably", alt: ["en particulier"], ex: "Elle a vécu dans plusieurs pays, notamment au Japon.", ex_l1: "She has lived in several countries, notably Japan.", note: "Very common in written French."}
      - {id: fr-b2-12-voire, type: vocab, l2: "voire", l1: "even / or even (going one step further)", ex: "Il faudra des mois, voire des années.", ex_l1: "It will take months, or even years.", note: "Not voir (to see)."}
      - {id: fr-b2-12-ainsi, type: vocab, l2: "ainsi", l1: "thus / in this way", ex: "Ainsi, nous avons pu réduire nos coûts.", ex_l1: "In this way, we were able to reduce our costs.", note: "ainsi que = as well as: le directeur ainsi que son équipe."}
      - {id: fr-b2-12-alors-que, type: vocab, l2: "alors que", l1: "whereas / while (contrast)", alt: ["tandis que"], ex: "Il fait beau à Nice, alors qu'il pleut à Paris.", ex_l1: "It's sunny in Nice, whereas it's raining in Paris.", note: "Indicative. Also 'just as' for time: alors que je partais."}
      - {id: fr-b2-12-en-somme, type: vocab, l2: "en somme", l1: "all in all / in short", alt: ["en résumé"], ex: "En somme, le projet est une réussite.", ex_l1: "All in all, the project is a success."}
      - {id: fr-b2-12-quant-a, type: vocab, l2: "quant à", l1: "as for / as far as … is concerned", ex: "Quant à moi, je reste ici.", ex_l1: "As for me, I'm staying here.", note: "à contracts: quant au prix, quant aux résultats."}
      - {id: fr-b2-12-si-bien-que, type: vocab, l2: "si bien que", l1: "so / with the result that (+ indicative)", alt: ["de sorte que"], ex: "Il a beaucoup neigé, si bien que les routes sont fermées.", ex_l1: "It snowed a lot, so the roads are closed.", note: "A result → indicative. A purpose (pour que) → subjunctive."}
      - {id: fr-b2-12-au-lieu-de, type: vocab, l2: "au lieu de", l1: "instead of", ex: "Prends le train au lieu de la voiture.", ex_l1: "Take the train instead of the car.", note: "+ noun or infinitive: au lieu de travailler."}
      - {id: fr-b2-12-faute-de, type: vocab, l2: "faute de", l1: "for lack of / for want of", ex: "Faute d'argent, ils ont annulé le projet.", ex_l1: "For lack of money, they cancelled the project.", note: "No article after it: faute de temps. faute de mieux = for want of anything better."}
      - {id: fr-b2-12-enjeu, type: vocab, l2: "l'enjeu", l1: "the stake / what is at stake", ex: "L'enjeu de ces élections est énorme.", ex_l1: "What is at stake in these elections is huge.", note: "Masculine. Plural: les enjeux = the issues at stake."}
      - {id: fr-b2-12-point-de-vue, type: vocab, l2: "le point de vue", l1: "the point of view", ex: "Je comprends ton point de vue.", ex_l1: "I understand your point of view.", note: "de mon point de vue = from my point of view."}
      - {id: fr-b2-12-defi, type: vocab, l2: "le défi", l1: "the challenge", ex: "Le changement climatique est le défi du siècle.", ex_l1: "Climate change is the challenge of the century.", note: "relever un défi = to rise to a challenge."}
      - {id: fr-b2-12-contrainte, type: vocab, l2: "la contrainte", l1: "the constraint", ex: "Nous avons beaucoup de contraintes de temps.", ex_l1: "We have a lot of time constraints.", note: "contraindre = to force."}
      - {id: fr-b2-12-constat, type: vocab, l2: "le constat", l1: "the finding / the observation (of a fact)", ex: "Le constat est simple : nous consommons trop.", ex_l1: "The finding is simple: we consume too much.", note: "faire un constat. un constat amiable = an accident report form."}
      - {id: fr-b2-12-prise-de-conscience, type: vocab, l2: "la prise de conscience", l1: "the awareness / the realisation", ex: "Il y a une vraie prise de conscience écologique.", ex_l1: "There is a real environmental awakening.", note: "prendre conscience de = to become aware of."}
      - {id: fr-b2-12-tendance, type: vocab, l2: "la tendance", l1: "the trend / the tendency", ex: "La tendance est à la baisse.", ex_l1: "The trend is downward.", note: "avoir tendance à + infinitive = to tend to."}
      - {id: fr-b2-12-n-en-reste-pas-moins, type: phrase, l2: "Il n'en reste pas moins que c'est risqué.", l1: "The fact remains that it's risky.", note: "A formal way to hold your ground after a concession."}
      - {id: fr-b2-12-cela-dit, type: phrase, l2: "Cela dit, je comprends ta position.", l1: "That said, I understand your position. (informal)", alt: ["Ceci dit, je comprends ta position."], note: "cela dit / ceci dit = that said."}
      - {id: fr-b2-12-revers-de-la-medaille, type: phrase, l2: "C'est le revers de la médaille.", l1: "That's the downside. / That's the other side of the coin. (idiom)", note: "Literally 'the reverse of the medal'."}
      - {id: fr-b2-12-couper-la-poire, type: phrase, l2: "Coupons la poire en deux.", l1: "Let's split the difference. / Let's meet halfway. (idiom with a pear)", alt: ["On coupe la poire en deux."]}
      - {id: fr-b2-12-vitesse-precipitation, type: phrase, l2: "Il ne faut pas confondre vitesse et précipitation.", l1: "More haste, less speed. (saying)", note: "Literally 'don't confuse speed with haste'."}
      - {id: fr-b2-12-c1, type: cloze, text: "Tous les hommes sont mortels. ___ Socrate est un homme. Donc Socrate est mortel.", answer: "or", l1: "All men are mortal. Now Socrates is a man. So Socrates is mortal.", note: "or brings in the fact on which the conclusion turns."}
      - {id: fr-b2-12-c2, type: cloze, text: "Le projet coûte cher. ___, il créera des emplois.", answer: "néanmoins", alt: ["cependant", "toutefois"], l1: "The project is expensive. Nevertheless, it will create jobs.", note: "A contrast that keeps the first point standing."}
      - {id: fr-b2-12-c3, type: cloze, text: "Les prix ont augmenté ; par ___, les ventes ont baissé.", answer: "conséquent", l1: "Prices went up; as a result, sales fell.", note: "par conséquent = consequently."}
      - {id: fr-b2-12-c4, type: cloze, text: "Je suis végétarien, ___ je ne mange pas de viande.", answer: "c'est-à-dire", l1: "I'm a vegetarian, that is, I don't eat meat. (a man speaking)", note: "c'est-à-dire explains what came before."}
      - {id: fr-b2-12-c5, type: cloze, text: "___, la solution est efficace, mais elle coûte cher.", answer: "certes", l1: "Admittedly, the solution is effective, but it's expensive.", note: "certes … mais: concede, then counter."}
      - {id: fr-b2-12-c6, type: cloze, text: "Beaucoup de pays, ___ la France, ont adopté cette loi.", answer: "notamment", alt: ["dont"], l1: "Many countries, notably France, have adopted this law.", note: "dont la France (including France) is also natural here."}
      - {id: fr-b2-12-c7, type: cloze, text: "Cela prendra des semaines, ___ des mois.", answer: "voire", l1: "It will take weeks, or even months.", note: "voire raises the stakes."}
      - {id: fr-b2-12-c8, type: cloze, text: "Il pleuvait beaucoup, si ___ que le match a été annulé.", answer: "bien", l1: "It was raining heavily, so the match was cancelled.", note: "si bien que + indicative = with the result that."}
      - {id: fr-b2-12-c9, type: cloze, text: "Moi, j'adore la ville ; ___ à mon frère, il préfère la campagne.", answer: "quant", l1: "I love the city; as for my brother, he prefers the countryside.", note: "quant à = as for."}
      - {id: fr-b2-12-c10, type: cloze, text: "Il a regardé la télé au ___ de travailler.", answer: "lieu", l1: "He watched TV instead of working.", note: "au lieu de + infinitive."}
      - {id: fr-b2-12-c11, type: cloze, text: "___ de temps, nous n'avons pas pu visiter le musée.", answer: "faute", l1: "For lack of time, we couldn't visit the museum.", note: "faute de + noun without an article."}
      - {id: fr-b2-12-c12, type: cloze, text: "Elle travaille beaucoup, ___ que son frère ne fait rien.", answer: "alors", alt: ["tandis"], l1: "She works a lot, whereas her brother does nothing.", note: "alors que / tandis que = whereas, + indicative."}
      - {id: fr-b2-12-c13, type: cloze, text: "D'une part, c'est trop cher ; d'___ part, ce n'est pas pratique.", answer: "autre", l1: "On the one hand, it's too expensive; on the other hand, it isn't practical.", note: "d'une part … d'autre part lists two arguments on the same side."}
      - {id: fr-b2-12-c14, type: cloze, text: "De ___, ce produit est mauvais pour la santé.", answer: "plus", l1: "What's more, this product is bad for your health.", note: "de plus = what's more. In speech: en plus."}
      - {id: fr-b2-12-c15, type: cloze, text: "Il a perdu son emploi ; ___ a-t-il dû vendre sa maison.", answer: "aussi", alt: ["ainsi"], l1: "He lost his job; he therefore had to sell his house. (formal, with inversion)", note: "aussi at the start of a clause = therefore, with inversion."}
      - {id: fr-b2-12-c16, type: cloze, text: "Autrement ___, tu refuses ?", answer: "dit", l1: "In other words, you're refusing? (informal)", note: "autrement dit = in other words."}

  # ───────────────────────────────────────────────────────────────── 13
  - id: fr4-13
    title: "Register: tu, vous, formal letters and firm complaints"
    goal: "I can move between casual and formal French, write a formal letter or email, and make a firm, polite complaint in person, by phone or in writing."
    notes: |
      ## tu or vous
      Use **vous** until you are invited to switch: *On peut se **tutoyer** ?* The older or more senior person usually offers. Once you have switched, don't go back. In **Québec**, *tu* is far more widespread, even with strangers in shops.

      ## Three registers
      | familier | courant | soutenu |
      |---|---|---|
      | un bouquin | un livre | un ouvrage |
      | une bagnole | une voiture | un véhicule |
      | le fric | l'argent | les fonds |
      | le boulot | le travail | l'emploi |
      | les fringues | les vêtements | la tenue |

      Understand the left column; use the middle one; write the right one in formal letters.

      ## The formal letter
      - Opening: **Madame, Monsieur,** (to a stranger, never *Cher Monsieur*).
      - Purpose: *Je vous écris **au sujet de**… / **Suite à** notre conversation…* (purists prefer *À la suite de*).
      - Requests: *Je vous **serais reconnaissant(e) de bien vouloir** + infinitive*; ***Veuillez trouver ci-joint**…*
      - Closing: *Dans l'attente de votre réponse, je vous **prie d'agréer**, Madame, Monsieur, l'expression de mes **salutations distinguées**.*

      An email is lighter: *Bonjour Madame,* … ***Cordialement**.*

      ## Complaining well
      State the facts, say what you want, and attach a condition: *J'aimerais un dédommagement, **à condition que** ce **soit** confirmé par écrit.*
    items:
      - {id: fr-b2-13-tutoyer, type: vocab, l2: "tutoyer", l1: "to call someone tu / to use tu with someone", ex: "On peut se tutoyer, si tu veux.", ex_l1: "We can say tu to each other, if you like.", note: "le tutoiement. In Québec, tu is used much more widely."}
      - {id: fr-b2-13-vouvoyer, type: vocab, l2: "vouvoyer", l1: "to call someone vous / to use vous with someone", alt: ["vousoyer"], ex: "Je vouvoie toujours mes clients.", ex_l1: "I always say vous to my clients.", note: "le vouvoiement. je vouvoie: y becomes i before a silent e."}
      - {id: fr-b2-13-service-client, type: vocab, l2: "le service client", l1: "customer service", alt: ["le service clientèle"], ex: "J'ai appelé trois fois le service client.", ex_l1: "I called customer service three times."}
      - {id: fr-b2-13-commande, type: vocab, l2: "la commande", l1: "the order (from a shop or website)", ex: "Ma commande n'est jamais arrivée.", ex_l1: "My order never arrived.", note: "passer une commande = to place an order. Not a command (un ordre)."}
      - {id: fr-b2-13-dedommagement, type: vocab, l2: "le dédommagement", l1: "the compensation", alt: ["l'indemnisation"], ex: "Les passagers ont droit à un dédommagement.", ex_l1: "Passengers are entitled to compensation.", note: "dédommager = to compensate."}
      - {id: fr-b2-13-bouquin, type: vocab, l2: "le bouquin", l1: "the book (casual)", ex: "Tu m'as prêté un super bouquin.", ex_l1: "You lent me a great book.", note: "Neutral: le livre. Formal: l'ouvrage."}
      - {id: fr-b2-13-ouvrage, type: vocab, l2: "l'ouvrage", l1: "the book / the work (formal)", ex: "Cet ouvrage est disponible en librairie.", ex_l1: "This book is available in bookshops.", note: "Masculine, like most nouns in -age: un ouvrage."}
      - {id: fr-b2-13-bagnole, type: vocab, l2: "la bagnole", l1: "the car (casual)", ex: "Il roule encore dans une vieille bagnole.", ex_l1: "He still drives an old banger.", note: "Neutral: la voiture. Casual in Québec: le char."}
      - {id: fr-b2-13-fric, type: vocab, l2: "le fric", l1: "money / cash (casual)", alt: ["le pognon"], ex: "Je n'ai plus de fric.", ex_l1: "I'm out of cash.", note: "Neutral: l'argent."}
      - {id: fr-b2-13-bosser, type: vocab, l2: "bosser", l1: "to work (casual)", ex: "Je bosse tout le week-end.", ex_l1: "I'm working all weekend.", note: "Neutral: travailler. le boulot = work, a job (casual)."}
      - {id: fr-b2-13-fringues, type: vocab, l2: "les fringues", l1: "clothes / gear (casual)", ex: "Elle dépense tout en fringues.", ex_l1: "She spends everything on clothes.", note: "Feminine plural. Neutral: les vêtements."}
      - {id: fr-b2-13-mec, type: vocab, l2: "le mec", l1: "the guy / the bloke (casual)", ex: "C'est un mec sympa.", ex_l1: "He's a nice guy.", note: "Also 'boyfriend': mon mec. In Québec: le gars; a boyfriend is mon chum."}
      - {id: fr-b2-13-cordialement, type: vocab, l2: "cordialement", l1: "kind regards (email closing)", alt: ["bien cordialement"], ex: "Merci d'avance. Cordialement, Julie Martin", ex_l1: "Thanks in advance. Kind regards, Julie Martin", note: "The standard neutral email ending to people you don't know well."}
      - {id: fr-b2-13-madame-monsieur, type: phrase, l2: "Madame, Monsieur,", l1: "Dear Sir or Madam, (opening of a formal letter)", note: "To a stranger, never Cher Monsieur: cher / chère is for people you know."}
      - {id: fr-b2-13-au-sujet-de, type: phrase, l2: "Je vous écris au sujet de ma commande.", l1: "I am writing to you about my order.", alt: ["Je vous écris à propos de ma commande.", "Je vous écris concernant ma commande."]}
      - {id: fr-b2-13-ci-joint, type: phrase, l2: "Veuillez trouver ci-joint mon CV.", l1: "Please find my CV attached.", alt: ["Vous trouverez ci-joint mon CV.", "Veuillez trouver mon CV ci-joint.", "Veuillez trouver ci-joint mon curriculum vitae."], note: "ci-joint = attached, enclosed. veuillez = imperative of vouloir, very polite."}
      - {id: fr-b2-13-reconnaissant, type: phrase, l2: "Je vous serais reconnaissant de bien vouloir me rembourser.", l1: "I would be grateful if you would kindly refund me. (a man writing)", note: "A woman writes reconnaissante. de bien vouloir + infinitive = kindly."}
      - {id: fr-b2-13-salutations, type: phrase, l2: "Je vous prie d'agréer, Madame, Monsieur, l'expression de mes salutations distinguées.", l1: "Yours faithfully. (the full closing formula of a formal letter)", alt: ["Veuillez agréer, Madame, Monsieur, l'expression de mes salutations distinguées.", "Je vous prie d'agréer, Madame, Monsieur, mes salutations distinguées."], note: "Repeat the opening (Madame, Monsieur) inside the formula."}
      - {id: fr-b2-13-on-se-tutoie, type: phrase, l2: "On peut se tutoyer ?", l1: "Shall we say tu to each other?", alt: ["On se tutoie ?", "On peut se dire tu ?", "On se dit tu ?"], note: "Wait for the older or more senior person to offer, or ask with a smile."}
      - {id: fr-b2-13-c1, type: cloze, text: "Je vous ___ d'agréer, Madame, Monsieur, l'expression de mes salutations distinguées.", answer: "prie", l1: "Yours faithfully. (literally: I ask you to accept the expression of my distinguished greetings)", note: "prier = to ask, to beg (formal)."}
      - {id: fr-b2-13-c2, type: cloze, text: "Je vous ___ reconnaissante de me répondre rapidement.", answer: "serais", l1: "I would be grateful if you could reply quickly. (a woman writing)", note: "Conditional of être for a polite request."}
      - {id: fr-b2-13-c3, type: cloze, text: "Je vous prie de bien ___ m'envoyer un devis.", answer: "vouloir", l1: "Could you kindly send me a quote. (formal letter)", note: "de bien vouloir + infinitive = kindly. un devis = a quote."}
      - {id: fr-b2-13-c4, type: cloze, text: "___ à notre conversation téléphonique, je vous envoie le contrat.", answer: "suite", l1: "Following our telephone conversation, I am sending you the contract.", note: "Suite à is everywhere in business mail; careful writers prefer À la suite de."}
      - {id: fr-b2-13-c5, type: cloze, text: "Dans l'___ de votre réponse, je reste à votre disposition.", answer: "attente", l1: "Looking forward to your reply, I remain at your disposal.", note: "dans l'attente de = awaiting."}
      - id: fr-b2-13-cold-dish
        type: dialogue
        title: "The dish is cold"
        scene: "You are having lunch in a restaurant. Your fish arrives lukewarm, and it happened last time too. You call the waiter over."
        you: A
        lines:
          - {who: A, l2: "Excusez-moi, monsieur, mon plat est froid.", l1: "Excuse me, sir, my dish is cold.",
             alt: ["Pardon, monsieur, mon plat est froid.", "Excusez-moi, mon plat est froid.", "S'il vous plaît, monsieur, mon plat est froid.", "Excusez-moi, monsieur, mon plat n'est pas chaud."]}
          - {who: B, l2: "Ah bon ? Je suis désolé. Vous voulez que je le fasse réchauffer ?", l1: "Really? I'm sorry. Would you like me to have it warmed up?"}
          - {who: A, l2: "Je préférerais que vous en apportiez un autre.", l1: "I'd rather you brought another one.",
             alt: ["Je préférerais que vous m'en apportiez un autre.", "Je préfère que vous en apportiez un autre.", "Je préfère que vous m'en apportiez un autre.", "J'aimerais mieux que vous en apportiez un autre.", "J'aimerais mieux que vous m'en apportiez un autre.", "Je préférerais un autre plat."]}
          - {who: B, l2: "Bien sûr. Ce sera prêt dans dix minutes.", l1: "Of course. It will be ready in ten minutes."}
          - {who: A, l2: "D'accord, mais ce n'est pas la première fois.", l1: "All right, but it's not the first time.",
             alt: ["D'accord, mais c'est pas la première fois.", "Bon, mais ce n'est pas la première fois.", "Très bien, mais ce n'est pas la première fois.", "D'accord, mais ça n'est pas la première fois."]}
          - {who: B, l2: "Je comprends. Je vous offre le dessert pour m'excuser.", l1: "I understand. Dessert is on the house, to apologise."}
          - {who: A, l2: "C'est gentil, merci. J'accepte volontiers.", l1: "That's kind, thank you. I'm happy to accept.",
             alt: ["C'est gentil, merci. J'accepte avec plaisir.", "C'est très gentil, merci. J'accepte volontiers.", "Merci, c'est gentil. J'accepte volontiers.", "C'est gentil, merci. Avec plaisir."]}
      - id: fr-b2-13-parcel
        type: dialogue
        title: "Where is my parcel?"
        scene: "You ordered a lamp online three weeks ago and it never came. You phone the shop's customer service."
        you: B
        lines:
          - {who: A, l2: "Service client, bonjour. Que puis-je faire pour vous ?", l1: "Customer service, hello. What can I do for you?"}
          - {who: B, l2: "Bonjour. J'ai passé une commande il y a trois semaines.", l1: "Hello. I placed an order three weeks ago.",
             alt: ["Bonjour. J'ai fait une commande il y a trois semaines.", "Bonjour. J'ai commandé une lampe il y a trois semaines.", "Bonjour. Il y a trois semaines, j'ai passé une commande.", "Bonjour. J'ai passé une commande il y a 3 semaines."]}
          - {who: A, l2: "Vous avez votre numéro de commande ?", l1: "Do you have your order number?"}
          - {who: B, l2: "Oui, je vous l'ai envoyé par mail hier.", l1: "Yes, I sent it to you by email yesterday.",
             alt: ["Oui, je vous l'ai envoyé par e-mail hier.", "Oui, je vous l'ai envoyé par courriel hier.", "Oui, je vous l'ai déjà envoyé par mail hier.", "Oui, je vous l'ai envoyé hier par mail.", "Oui, je l'ai envoyé par mail hier."]}
          - {who: A, l2: "Un instant… Je vois que le colis a été livré lundi.", l1: "One moment… I can see the parcel was delivered on Monday."}
          - {who: B, l2: "C'est impossible, je n'ai rien reçu.", l1: "That's impossible, I haven't received anything.",
             alt: ["Ce n'est pas possible, je n'ai rien reçu.", "Impossible, je n'ai rien reçu.", "C'est impossible, j'ai rien reçu.", "C'est impossible, je n'ai rien reçu du tout.", "Pourtant, je n'ai rien reçu."]}
          - {who: A, l2: "Il a peut-être été déposé chez un voisin ?", l1: "Perhaps it was left with a neighbour?"}
          - {who: B, l2: "J'ai vérifié. Je voudrais que vous ouvriez une enquête.", l1: "I've checked. I'd like you to open an investigation.",
             alt: ["J'ai déjà vérifié. Je voudrais que vous ouvriez une enquête.", "J'ai vérifié. J'aimerais que vous ouvriez une enquête.", "J'ai vérifié. Je souhaiterais que vous ouvriez une enquête.", "J'ai vérifié. Je veux que vous ouvriez une enquête."]}
          - {who: A, l2: "Très bien. Si le colis n'est pas retrouvé, vous serez remboursé sous dix jours.", l1: "Very well. If the parcel isn't found, you'll be refunded within ten days."}
          - {who: B, l2: "Parfait. Merci de me tenir au courant.", l1: "Perfect. Thank you for keeping me informed.",
             alt: ["Parfait. Merci de me tenir informé.", "Parfait. Merci de me tenir informée.", "Très bien. Merci de me tenir au courant.", "Parfait. Tenez-moi au courant, merci."]}
      - id: fr-b2-13-bill
        type: dialogue
        title: "A mistake on the bill"
