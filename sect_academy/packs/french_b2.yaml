  # ───────────────────────────────────────────────────────────────── 14
  - id: fr4-14
    title: "Idioms and set phrases"
    goal: "I can understand and use the most common French idioms in everyday conversation, at the right moment and in the right register."
    notes: |
      French conversation is full of images: rabbits, cats, apples, sheep. Natives use them constantly, and a well-placed idiom makes you sound at home. Three tips:

      - **Learn the whole phrase** and its register. Most of these are relaxed and spoken; *casser les pieds* or *raconter des salades* are fine with friends, not in a meeting.
      - **Don't translate word for word.** *Poser un lapin* has nothing to do with rabbits for you; it means someone didn't turn up.
      - **Fit the grammar.** Idioms still conjugate and agree: *Il m'a posé un lapin. Je me suis creusé la tête.* (no agreement: *la tête* is the object, after the verb).

      ## A few by theme
      | theme | idioms |
      |---|---|
      | mood | avoir le cafard, faire la tête, tenir le coup |
      | effort | avoir un poil dans la main, avoir la flemme, les doigts dans le nez |
      | talking | tourner autour du pot, mettre les pieds dans le plat, sauter du coq à l'âne |
      | never | quand les poules auront des dents, ce n'est pas demain la veille |

      **Québec** has its own: *il pleut à boire debout* (it's pouring), *c'est de valeur* (what a pity), *avoir la langue à terre* (to be exhausted). You'll be understood with the French ones everywhere.
    items:
      - {id: fr-b2-14-cafard, type: phrase, l2: "J'ai le cafard.", l1: "I'm feeling down. / I've got the blues.", note: "Literally 'I have the cockroach'."}
      - {id: fr-b2-14-poser-un-lapin, type: phrase, l2: "Il m'a posé un lapin.", l1: "He stood me up.", note: "poser un lapin à quelqu'un = not to turn up to a date or a meeting."}
      - {id: fr-b2-14-dans-la-lune, type: phrase, l2: "Tu es dans la lune !", l1: "You're daydreaming! (informal)", alt: ["T'es dans la lune !"], note: "être dans la lune = to have one's head in the clouds."}
      - {id: fr-b2-14-langue-au-chat, type: phrase, l2: "Je donne ma langue au chat.", l1: "I give up. (on a riddle: tell me the answer)", note: "Literally 'I give my tongue to the cat'. Used only for guessing games."}
      - {id: fr-b2-14-autour-du-pot, type: phrase, l2: "Arrête de tourner autour du pot !", l1: "Stop beating about the bush! (informal)", alt: ["Ne tourne pas autour du pot !"], note: "Literally 'turning around the pot'."}
      - {id: fr-b2-14-poil-dans-la-main, type: phrase, l2: "Il a un poil dans la main.", l1: "He's bone idle.", note: "Literally 'he has a hair in his hand' (from never using it)."}
      - {id: fr-b2-14-creuse-la-tete, type: phrase, l2: "Je me suis creusé la tête.", l1: "I racked my brains.", note: "No agreement for a woman either: la tête is the object, after the verb."}
      - {id: fr-b2-14-casser-les-pieds, type: phrase, l2: "Tu me casses les pieds !", l1: "You're getting on my nerves! (informal)", note: "Literally 'you're breaking my feet'. casse-pieds = a pain in the neck."}
      - {id: fr-b2-14-chats-a-fouetter, type: phrase, l2: "J'ai d'autres chats à fouetter.", l1: "I have bigger fish to fry.", note: "Literally 'other cats to whip'."}
      - {id: fr-b2-14-nos-moutons, type: phrase, l2: "Revenons à nos moutons.", l1: "Let's get back to the subject.", note: "Literally 'let's get back to our sheep', from a medieval farce."}
      - {id: fr-b2-14-tout-un-plat, type: phrase, l2: "Il ne faut pas en faire tout un plat.", l1: "There's no need to make such a fuss about it.", alt: ["Il ne faut pas en faire tout un fromage.", "Pas la peine d'en faire tout un plat."], note: "en faire tout un plat (or un fromage) = to make a big deal of it."}
      - {id: fr-b2-14-taureau-par-les-cornes, type: phrase, l2: "Il faut prendre le taureau par les cornes.", l1: "You have to take the bull by the horns."}
      - {id: fr-b2-14-anguille-sous-roche, type: phrase, l2: "Il y a anguille sous roche.", l1: "There's something going on. / I smell a rat.", note: "Literally 'there's an eel under the rock'."}
      - {id: fr-b2-14-petite-bete, type: phrase, l2: "Tu cherches toujours la petite bête.", l1: "You're always nitpicking. (informal)", note: "chercher la petite bête = to look for tiny faults."}
      - {id: fr-b2-14-flemme, type: phrase, l2: "J'ai la flemme.", l1: "I can't be bothered. (casual)", note: "avoir la flemme de + infinitive: j'ai la flemme de cuisiner."}
      - {id: fr-b2-14-pleut-des-cordes, type: phrase, l2: "Il pleut des cordes.", l1: "It's pouring with rain. / It's raining cats and dogs.", alt: ["Il pleut à verse.", "Il pleut à torrents."], note: "Literally 'it's raining ropes'. Québec: il pleut à boire debout."}
      - {id: fr-b2-14-pieds-dans-le-plat, type: phrase, l2: "Il a mis les pieds dans le plat.", l1: "He put his foot in it.", note: "Literally 'he put his feet in the dish': he said the awkward thing."}
      - {id: fr-b2-14-raconter-des-salades, type: phrase, l2: "Arrête de raconter des salades !", l1: "Stop telling fibs! (informal)", note: "des salades = lies, tall stories."}
      - {id: fr-b2-14-tomber-a-pic, type: phrase, l2: "Tu tombes à pic !", l1: "You've come at just the right moment! (informal)", alt: ["Tu tombes bien !"], note: "tomber à pic = to come at exactly the right time."}
      - {id: fr-b2-14-grain-de-sel, type: phrase, l2: "Il faut toujours qu'il mette son grain de sel.", l1: "He always has to stick his oar in.", note: "mettre son grain de sel = to butt in. il faut que + subjunctive: mettre → qu'il mette."}
      - {id: fr-b2-14-doigt-dans-l-oeil, type: phrase, l2: "Tu te mets le doigt dans l'œil.", l1: "You're completely wrong. (informal)", note: "Literally 'you're putting your finger in your eye'."}
      - {id: fr-b2-14-tete-dans-le-guidon, type: phrase, l2: "J'ai la tête dans le guidon.", l1: "I'm too snowed under to see the big picture.", note: "Literally 'my head is in the handlebars', like a racing cyclist."}
      - {id: fr-b2-14-tiens-le-coup, type: phrase, l2: "Tiens le coup !", l1: "Hang in there! (informal)", note: "tenir le coup = to hold up, to cope."}
      - {id: fr-b2-14-belle-jambe, type: phrase, l2: "Ça me fait une belle jambe.", l1: "A fat lot of good that does me.", note: "Ironic: literally 'that gives me a fine leg'."}
      - {id: fr-b2-14-chat-un-chat, type: phrase, l2: "Appelons un chat un chat.", l1: "Let's call a spade a spade."}
      - {id: fr-b2-14-coup-de-foudre, type: phrase, l2: "Ça a été le coup de foudre.", l1: "It was love at first sight.", alt: ["J'ai eu le coup de foudre.", "Ç'a été le coup de foudre.", "C'était le coup de foudre."], note: "le coup de foudre = a bolt of lightning."}
      - {id: fr-b2-14-doigts-dans-le-nez, type: phrase, l2: "Il a réussi les doigts dans le nez.", l1: "He passed easily / with no effort. (casual)", note: "Literally 'with his fingers up his nose'."}
      - {id: fr-b2-14-poules-auront-des-dents, type: phrase, l2: "Quand les poules auront des dents.", l1: "When pigs fly. / Never.", note: "Literally 'when hens have teeth'. Note the future after quand."}
      - {id: fr-b2-14-pas-demain-la-veille, type: phrase, l2: "Ce n'est pas demain la veille.", l1: "That won't happen any time soon.", alt: ["C'est pas demain la veille."], note: "Literally 'tomorrow is not the day before'."}
      - {id: fr-b2-14-faim-de-loup, type: phrase, l2: "J'ai une faim de loup.", l1: "I'm starving. / I could eat a horse.", note: "Literally 'a wolf's hunger'."}
      - {id: fr-b2-14-faire-la-tete, type: phrase, l2: "Pourquoi tu fais la tête ?", l1: "Why are you sulking? (informal)", alt: ["Pourquoi est-ce que tu fais la tête ?", "Pourquoi fais-tu la tête ?", "Tu fais la tête pourquoi ?"], note: "faire la tête = to sulk."}
      - {id: fr-b2-14-coup-de-fil, type: phrase, l2: "Passe-moi un coup de fil.", l1: "Give me a ring. (informal)", alt: ["Donne-moi un coup de fil."], note: "un coup de fil = a phone call."}
      - {id: fr-b2-14-coq-a-l-ane, type: phrase, l2: "Tu sautes du coq à l'âne.", l1: "You're jumping from one subject to another. (informal)", note: "Literally 'from the rooster to the donkey'."}
      - {id: fr-b2-14-c1, type: cloze, text: "Hier soir, Marc m'a posé un ___ : je l'ai attendu une heure.", answer: "lapin", l1: "Last night Marc stood me up: I waited an hour for him.", note: "poser un lapin = to stand someone up."}
      - {id: fr-b2-14-c2, type: cloze, text: "Prends ton parapluie, il pleut des ___.", answer: "cordes", l1: "Take your umbrella, it's pouring. (informal)", note: "il pleut des cordes = it's raining ropes."}
      - {id: fr-b2-14-c3, type: cloze, text: "Je n'ai pas le temps pour ça, j'ai d'autres chats à ___.", answer: "fouetter", l1: "I haven't got time for that, I have bigger fish to fry.", note: "d'autres chats à fouetter."}
      - {id: fr-b2-14-c4, type: cloze, text: "Dis-moi franchement ce que tu veux, ne tourne pas autour du ___.", answer: "pot", l1: "Tell me frankly what you want, don't beat about the bush.", note: "tourner autour du pot."}
      - {id: fr-b2-14-c5, type: cloze, text: "Il ne fait jamais rien au bureau : il a un ___ dans la main.", answer: "poil", l1: "He never does anything at the office: he's bone idle.", note: "avoir un poil dans la main = to be lazy."}
      - {id: fr-b2-14-c6, type: cloze, text: "Elle est toujours dans la ___ pendant les cours.", answer: "lune", l1: "She's always daydreaming in class.", note: "être dans la lune."}
      - {id: fr-b2-14-c7, type: cloze, text: "Je ne trouve pas la réponse, je donne ma langue au ___.", answer: "chat", l1: "I can't find the answer, I give up.", note: "donner sa langue au chat."}
      - {id: fr-b2-14-c8, type: cloze, text: "Bon, assez parlé des vacances : revenons à nos ___.", answer: "moutons", l1: "Right, enough about the holidays: let's get back to the subject.", note: "revenir à ses moutons."}
