          - {who: A, l2: "Et tu as vu le mail du directeur ? Il veut nous voir tous les deux.", l1: "And did you see the director's email? He wants to see both of us."}
          - {who: B, l2: "Ah bon ? Tu sais de quoi il veut parler ?", l1: "Really? Do you know what he wants to talk about?",
