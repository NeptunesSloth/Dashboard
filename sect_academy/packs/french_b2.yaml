             alt: ["Bonjour, j'appelle à propos de ma dernière facture.", "Bonjour, je vous appelle au sujet de ma dernière facture.", "Bonjour, je vous appelle à propos de ma dernière facture.", "Bonjour, j'appelle concernant ma dernière facture."]}
          - {who: B, l2: "Bien sûr. Quel est le problème ?", l1: "Of course. What's the problem?"}
          - {who: A, l2: "On m'a facturé deux fois le même mois.", l1: "I've been charged twice for the same month.",
             alt: ["On m'a facturé le même mois deux fois.", "Vous m'avez facturé deux fois le même mois.", "On m'a fait payer deux fois le même mois.", "On m'a facturé deux fois pour le même mois.", "Le même mois m'a été facturé deux fois."]}
          - {who: B, l2: "Je vérifie… Effectivement, il y a eu une erreur de notre part.", l1: "Let me check… Indeed, there was a mistake on our side."}
