  # ───────────────────── Domain 5 — best-answer practice ─────────────────────
  - id: cc-5z
    title: "Best-answer practice: Security Operations and Incident Response"
    domain: "5"
    goal: "I can choose the BEST or FIRST operational answer by following the order of incident response and the organization's own plans."
    notes: |
      ## Operations questions are mostly about order

      When the stem says FIRST, place the scenario on the incident timeline and take the next step.

      - **Is it real?** A single unconfirmed alert is **triaged** before anything is shut down or anyone outside is told.
      - **Is harm continuing?** If so, **contain** before you investigate, eradicate or teach.
      - **Might it go to court?** **Preserve** evidence before anyone touches it.
      - **Then** eradicate, recover, and review what went wrong.

      Other rules that rank the choices:

      - Follow the plan: the named spokesperson speaks, the rules of engagement say when a tester stops, and a legal deadline is met even with incomplete facts.
      - Changes go through change management unless the risk truly justifies an emergency change.
      - Classify data before choosing tools to protect it. Encryption protects data once custody is lost; locks and couriers do not.
      - Act on intelligence that concerns what you actually run.

      Usual trap: the drastic action (pull the plug, patch now, call everyone) taken before the facts or the process support it.
    items:
      - id: cc-5z-b01
        type: mcq
        best: true
        q: "An employee reports that ten minutes ago she typed her password into a fake sign-in page. What should the analyst do FIRST?"
        choices:
          - "Run a malware scan on her computer"
          - "Send all staff a reminder about phishing"
          - "Reset her password and revoke her active sessions"
          - "Search the mail system for other people who received the message"
        answer: 2
        why: "The one certain fact is that her credentials are in an attacker's hands. Containing that comes before widening the investigation or educating others."
        whys:
          - "Sensible, but she reported giving away a password, not running a file."
          - "Useful, but it does nothing about the credentials already stolen."
          - "Best: makes the stolen password useless and ends any session the attacker has opened."
          - "An important next step, but her account is exposed for as long as it is delayed."
