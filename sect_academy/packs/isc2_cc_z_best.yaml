          - "Sign in to the computer as an administrator and look for the files"
          - "Ask a technician to copy his user folder to a network share"
          - "Interview his colleagues about what they saw"
        answer: 0
        why: "Evidence for legal action must be preserved unaltered and its handling documented. Analysis is done on an image, never on the original."
        whys:
          - "Best: preserves the evidence and its legal value before anyone alters it."
          - "The quickest way to an answer, but signing in changes the evidence and weakens it in court."
          - "Captures some files, but alters timestamps, misses deleted data and breaks the chain of custody."
          - "May be useful later, but the computer's evidence is fragile and comes first."
