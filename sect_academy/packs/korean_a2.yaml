          - {who: B, l2: "네, 좋아요.", rom: "ne, joayo.", l1: "Yes, I'd like that.", alt: ["좋아요.", "네, 그래요."]}

  # ───────────────────────────────────────────────────────────────── 12
  - id: ko2-12
    title: "Hobbies and abilities: -(으)ㄹ 수 있다 / 없다"
    goal: "I can talk about my hobbies and sports, and say what I can and cannot do."
    notes: |
      ## Can and can't
      | stem ends in | add | example |
      |---|---|---|
      | a consonant | **을 수 있어요** | 먹을 수 있어요 |
      | a vowel | **ㄹ 수 있어요** | 갈 수 있어요, 칠 수 있어요 |
      | ㄹ | **수 있어요** (no extra ㄹ) | 만들 수 있어요 |

      **없어요** in place of 있어요 makes "can't": 수영할 수 없어요. It covers both **ability** (I can swim) and **possibility** (I can come on Monday). In everyday speech 못 + verb (A1) is a shorter "can't": 못 가요.

      **-(으)ㄹ 줄 알아요** means "know how to" (a learned skill): 운전할 줄 알아요.

      ## Good at, bad at
      **잘하다** and **못하다** are verbs: 노래를 잘해요 (I sing well), 요리를 못해요 (I'm a bad cook). Written as one word, without a space.

      ## Each activity has its verb
      | | |
      |---|---|
      | 노래를 **부르다** | to sing a song |
      | 춤을 **추다** | to dance |
      | 그림을 **그리다** | to draw / paint |
      | 피아노·기타를 **치다** | to play piano / guitar |
      | 자전거를 **타다** | to ride a bike |
      | 사진을 **찍다** | to take photos |

      Sports and many hobbies take 하다: 수영하다, 등산하다, 축구를 하다.

      부르다 is 르-irregular: 불러요. 추다 + 어요 → 춰요.
