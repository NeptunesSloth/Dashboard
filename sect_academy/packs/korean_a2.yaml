  # ───────────────────────────────────────────────────────────────── 5
  - id: ko2-05
    title: "Right now: -고 있다 and life at home"
    goal: "I can say what I and others are doing at the moment, handle a short phone call and talk about jobs around the house."
    notes: |
      ## -고 있어요: in the middle of doing it
      Add **고 있어요** to any stem, with no change at all:

      | dictionary | in progress | was in progress |
      |---|---|---|
      | 자다 | 자고 있어요 | 자고 있었어요 |
      | 듣다 | 듣고 있어요 | 듣고 있었어요 |
      | 요리하다 | 요리하고 있어요 | 요리하고 있었어요 |

      The plain present (자요) can also mean "is sleeping", so -고 있어요 is used when you want to stress *right now* or *at that moment*: 어제 여덟 시에 뭐 하고 있었어요?

      With clothes, -고 있어요 describes what someone **has on**: 코트를 입고 있어요, "she is wearing a coat".

      ## Chores: noun + 하다
      청소 (cleaning), 빨래 (laundry), 설거지 (washing up) and 요리 (cooking) all become verbs with 하다. With 안, the negative goes in the middle: 설거지 안 했어요.

      ## On the phone
      **여보세요?** is "hello?" on the phone only. **통화하다** is to talk on the phone; **전화를 받다** is to answer it.

      ## Sound
      듣다 (to listen) changes its ㄷ to ㄹ before a vowel: 들어요, 들었어요. Before a consonant it stays: 듣고 있어요. 텔레비전 is *tellebijeon*: ㄹ + ㄹ is an l sound.
    items:
      - {id: ko2-05-deut, type: glyph, l2: "듣", rom: "deut", l1: "as in 듣다 (to listen): final ㄷ said t; before a vowel it turns into ㄹ, 들어요"}
