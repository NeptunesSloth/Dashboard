      - id: ko2-01-d1
        type: dialogue
        title: "A birthday dinner"
        scene: "You arrive at a Korean friend's birthday dinner. She meets you at the door."
        you: B
        lines:
          - {who: A, l2: "어서 와요! 여기 앉으세요.", rom: "eoseo wayo! yeogi anjeuseyo.", l1: "Come in! Sit here."}
          - {who: B, l2: "고마워요. 생일 축하해요!", rom: "gomawoyo. saengil chukahaeyo!", l1: "Thanks. Happy birthday!", alt: ["감사합니다. 생일 축하해요!", "고마워요. 생일 축하합니다!"]}
          - {who: A, l2: "고마워요. 오늘 사람이 많아요. 국 좀 드세요.", rom: "gomawoyo. oneul sarami manayo. guk jom deuseyo.", l1: "Thank you. There are a lot of people today. Have some soup."}
          - {who: B, l2: "와, 국물이 정말 맛있어요!", rom: "wa, gungmuri jeongmal masisseoyo!", l1: "Wow, the broth is really tasty!", alt: ["와, 국물이 맛있어요!", "국물이 정말 맛있어요!"]}
          - {who: A, l2: "많이 드세요. 더 드릴까요?", rom: "mani deuseyo. deo deurilkkayo?", l1: "Eat plenty. Shall I give you more?"}
          - {who: B, l2: "아니요, 됐어요. 많이 먹었어요.", rom: "aniyo, dwaesseoyo. mani meogeosseoyo.", l1: "No, I'm fine, thanks. I've eaten a lot.", alt: ["됐어요. 많이 먹었어요.", "아니요, 괜찮아요. 많이 먹었어요."]}

  # ───────────────────────────────────────────────────────────────── 2
  - id: ko2-02
    title: "Last week: the past tense and -지 않다"
    goal: "I can tell someone what I did and did not do recently, including things that have not happened yet."
    notes: |
      ## The past, once more
      Take the 해요 form, drop 요, add **ㅆ어요**. It works for every verb in this course.

      | dictionary | present | past |
      |---|---|---|
      | 받다 receive | 받아요 | 받았어요 |
      | 만들다 make | 만들어요 | 만들었어요 |
      | 가르치다 teach | 가르쳐요 | 가르쳤어요 |
      | 기다리다 wait | 기다려요 | 기다렸어요 |
      | 쉬다 rest | 쉬어요 | 쉬었어요 |
      | 시작하다 start | 시작해요 | 시작했어요 |

      Nouns: **이었어요** after a consonant (생일이었어요), **였어요** after a vowel (파티였어요).

      ## Two ways to say "not"
      - Short: **안** + verb: 안 먹어요, 안 먹었어요.
      - Long: stem + **지 않아요**: 먹지 않아요, past 먹지 않았어요.

      They mean the same. The short form is more common in speech; the long form sounds a little more careful and is usual in writing. With noun + 하다 verbs the short 안 goes in the middle (청소 안 했어요), but the long form simply follows: 청소하지 않았어요.

      ## Not yet, already
      - **아직** + negative = not yet: 아직 안 먹었어요, "I haven't eaten yet".
      - **벌써** = already: 벌써 끝났어요?
      - **처음** = (for) the first time: 처음 왔어요.

      Sound: 끝나다 is *kkeunnada*: ㅌ (said t) before ㄴ becomes n.
    items:
      - {id: ko2-02-an, type: glyph, l2: "않", rom: "an", l1: "as in 않아요 (not): ㄶ, the ㅎ is silent before a vowel, a-na-yo"}
      - {id: ko2-02-eot, type: glyph, l2: "었", rom: "eot", l1: "as in 먹었어요: silent ㅇ + ㅓ + ㅆ, the past marker"}
