          - {who: B, l2: "떡볶이는 많이 매워요?", rom: "tteokbokkineun mani maewoyo?", l1: "Is the tteokbokki very spicy?", alt: ["떡볶이 많이 매워요?", "떡볶이는 매워요?"]}
