      - {id: ko2-07-geomeunsaek, type: vocab, l2: "검은색", rom: "geomeunsaek", l1: "black", alt: ["까만색", "kkamansaek", "검정색", "geomjeongsaek"], ex: "검은색 구두를 신었어요.", ex_rom: "geomeunsaek gudureul sineosseoyo.", ex_l1: "I've put on black shoes."}
      - {id: ko2-07-huinsaek, type: vocab, l2: "흰색", rom: "huinsaek", l1: "white", alt: ["하얀색", "hayansaek"], ex: "흰색 티셔츠가 있어요?", ex_rom: "huinsaek tisyeocheuga isseoyo?", ex_l1: "Do you have a white T-shirt?"}
      - {id: ko2-07-tisyeocheu, type: vocab, l2: "티셔츠", rom: "tisyeocheu", l1: "T-shirt", ex: "티셔츠를 두 장 샀어요.", ex_rom: "tisyeocheureul du jang sasseoyo.", ex_l1: "I bought two T-shirts.", note: "Shirts and T-shirts are counted with 장 (or 벌 for clothes in general)."}
