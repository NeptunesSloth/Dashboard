      - {id: ko2-15-daek, type: vocab, l2: "댁", rom: "daek", l1: "home / house (honorific)", ex: "선생님 댁이 어디세요?", ex_rom: "seonsaengnim daegi eodiseyo?", ex_l1: "Where is your home, (teacher)?"}
      - {id: ko2-15-saengsin, type: vocab, l2: "생신", rom: "saengsin", l1: "birthday (honorific)", ex: "내일이 아버지 생신이에요.", ex_rom: "naeiri abeoji saengsinieyo.", ex_l1: "Tomorrow is my father's birthday."}
      - {id: ko2-15-malsseum, type: vocab, l2: "말씀", rom: "malsseum", l1: "words / what someone says (honorific or humble)", ex: "말씀 많이 들었어요.", ex_rom: "malsseum mani deureosseoyo.", ex_l1: "I've heard a lot about you."}
      - {id: ko2-15-kkeseo, type: vocab, l2: "께서", rom: "kkeseo", l1: "(honorific subject particle, for 이/가)", ex: "아버지께서 오셨어요.", ex_rom: "abeojikkeseo osyeosseoyo.", ex_l1: "Father has arrived."}
      - {id: ko2-15-kke, type: vocab, l2: "께", rom: "kke", l1: "to (a respected person; honorific of 한테 / 에게)", ex: "선생님께 전화했어요.", ex_rom: "seonsaengnimkke jeonhwahaesseoyo.", ex_l1: "I phoned the teacher."}
      - {id: ko2-15-deurida, type: vocab, l2: "드리다", rom: "deurida", l1: "to give (humble, to a respected person)", ex: "할머니께 꽃을 드렸어요.", ex_rom: "halmeonikke kkocheul deuryeosseoyo.", ex_l1: "I gave my grandmother flowers."}
      - {id: ko2-15-yeojjwoboda, type: vocab, l2: "여쭤보다", rom: "yeojjwoboda", l1: "to ask (humble, a respected person)", ex: "선생님께 여쭤볼게요.", ex_rom: "seonsaengnimkke yeojjwobolgeyo.", ex_l1: "I'll ask the teacher."}
      - {id: ko2-15-boepda, type: vocab, l2: "뵙다", rom: "boepda", l1: "to meet / to see (humble, a respected person)", ex: "다음에 또 뵙겠습니다.", ex_rom: "daeume tto boepgesseumnida.", ex_l1: "I look forward to seeing you again."}
      - {id: ko2-15-jeohui, type: vocab, l2: "저희", rom: "jeohui", l1: "we / our (humble)", ex: "저희 회사에 오세요.", ex_rom: "jeohui hoesae oseyo.", ex_l1: "Come to our company.", note: "Use 저희 instead of 우리 with people you respect. Your country is always 우리나라, never 저희 나라."}
      - {id: ko2-15-sajangnim, type: vocab, l2: "사장님", rom: "sajangnim", l1: "company president / the boss / shop owner", ex: "사장님은 회의 중이세요.", ex_rom: "sajangnimeun hoeui jungiseyo.", ex_l1: "The boss is in a meeting.", note: "Also the polite way to address a restaurant or shop owner."}
      - {id: ko2-15-sonnim, type: vocab, l2: "손님", rom: "sonnim", l1: "guest / customer", ex: "손님, 이쪽으로 오세요.", ex_rom: "sonnim, ijjogeuro oseyo.", ex_l1: "This way, please, sir / madam."}
      - {id: ko2-15-jeobun, type: vocab, l2: "저분", rom: "jeobun", l1: "that person over there (honorific)", ex: "저분이 우리 선생님이세요.", ex_rom: "jeobuni uri seonsaengnimiseyo.", ex_l1: "That person over there is our teacher.", note: "분 is the honorific word for a person (이분, 그분, 저분), and its counter: 몇 분이세요? Not the same word as 분, minute."}
      - {id: ko2-15-cheoeumboep, type: phrase, l2: "처음 뵙겠습니다.", rom: "cheoeum boepgesseumnida", alt: ["cheoeum boepgetseumnida"], l1: "How do you do? (very polite, at a first meeting)"}
      - {id: ko2-15-seonghami, type: phrase, l2: "성함이 어떻게 되세요?", rom: "seonghami eotteoke doeseyo", l1: "May I ask your name? (very polite)"}
      - {id: ko2-15-yeonsega, type: phrase, l2: "연세가 어떻게 되세요?", rom: "yeonsega eotteoke doeseyo", l1: "May I ask how old you are? (to an older person)"}
      - {id: ko2-15-mutgesseumnida, type: phrase, l2: "말씀 좀 묻겠습니다.", rom: "malsseum jom mutgesseumnida", alt: ["malsseum jom mutgetseumnida", "말씀 좀 여쭤볼게요."], l1: "Excuse me, may I ask you something? (formal, to a stranger)"}
      - {id: ko2-15-jamsiman, type: phrase, l2: "잠시만 기다려 주십시오.", rom: "jamsiman gidaryeo jusipsio", l1: "Please wait a moment. (formal, staff to customers)", alt: ["잠시만 기다려 주세요.", "jamsiman gidaryeo juseyo"]}
      - {id: ko2-15-jumuseyo, type: phrase, l2: "안녕히 주무세요.", rom: "annyeonghi jumuseyo", l1: "Good night. (to an older person or someone you respect)", note: "Literally 'sleep in peace'."}
      - {id: ko2-15-c1, type: cloze, text: "할머니___ 주무세요.", answer: "께서", alt: ["kkeseo"], l1: "Grandmother is sleeping. (honorific subject particle)", note: "께서 replaces 이/가 for a respected subject."}
      - {id: ko2-15-c2, type: cloze, text: "아버지는 지금 집에 ___.", answer: "계세요", alt: ["gyeseyo"], l1: "My father is at home now. (honorific)", note: "있다 for a respected person: 계시다 → 계세요."}
      - {id: ko2-15-c3, type: cloze, text: "어머니께서 점심을 ___.", answer: "드셨어요", alt: ["deusyeosseoyo"], l1: "My mother has had lunch. (honorific)", note: "먹다 → 드시다 → 드셨어요."}
      - {id: ko2-15-c4, type: cloze, text: "선생님께 선물을 ___.", answer: "드렸어요", alt: ["deuryeosseoyo"], l1: "I gave the teacher a present. (humble)", note: "주다 to a respected person: 드리다."}
      - {id: ko2-15-c5, type: cloze, text: "사장님은 어제 미국에 ___.", answer: "가셨어요", alt: ["gasyeosseoyo"], l1: "The company president went to America yesterday. (honorific)", note: "가 + 시 + 었어요 → 가셨어요."}
      - {id: ko2-15-c6, type: cloze, text: "할머니, 이 책 ___?", answer: "읽으셨어요", alt: ["ilgeusyeosseoyo"], l1: "Grandma, have you read this book? (honorific)", note: "Consonant stem: 읽 + 으셨어요."}
      - {id: ko2-15-c7, type: cloze, text: "제가 도와 ___?", answer: "드릴까요", alt: ["deurilkkayo"], l1: "Shall I help you? (humble, to an older person)", note: "-아/어 드릴까요? is the humble offer."}
      - id: ko2-15-d1
        type: dialogue
        title: "Meeting a friend's grandmother"
        scene: "You visit your friend Minsu at home. His grandmother opens the door. You are Sara."
        you: B
        lines:
          - {who: A, l2: "어서 와요. 민수 친구예요?", rom: "eoseo wayo. minsu chinguyeyo?", l1: "Come in. Are you Minsu's friend?"}
          - {who: B, l2: "네, 안녕하세요. 처음 뵙겠습니다. 저는 사라예요.", rom: "ne, annyeonghaseyo. cheoeum boepgesseumnida. jeoneun sarayeyo.", l1: "Yes, hello. How do you do? I'm Sara.", alt: ["안녕하세요. 처음 뵙겠습니다. 저는 사라예요.", "네, 처음 뵙겠습니다. 사라입니다."]}
          - {who: A, l2: "반가워요. 한국말을 잘하네요.", rom: "bangawoyo. hangungmareul jalhaneyo.", l1: "Nice to meet you. Your Korean is good."}
          - {who: B, l2: "아니에요. 할머니, 이거 작은 선물이에요.", rom: "anieyo. halmeoni, igeo jageun seonmurieyo.", l1: "Not at all. Grandmother, this is a little present.", alt: ["아니에요. 이거 작은 선물이에요.", "아니에요. 할머니, 이거 선물이에요."]}
          - {who: A, l2: "아이고, 고마워요. 점심은 먹었어요?", rom: "aigo, gomawoyo. jeomsimeun meogeosseoyo?", l1: "Oh my, thank you. Have you had lunch?"}
          - {who: B, l2: "아직 안 먹었어요. 할머니는 점심 드셨어요?", rom: "ajik an meogeosseoyo. halmeonineun jeomsim deusyeosseoyo?", l1: "Not yet. Have you had lunch, Grandmother?", alt: ["아직요. 할머니는 드셨어요?", "아직 안 먹었어요. 할머니는 드셨어요?"]}
          - {who: A, l2: "나도 아직이에요. 같이 먹어요.", rom: "nado ajigieyo. gachi meogeoyo.", l1: "Not yet either. Let's eat together."}
          - {who: B, l2: "네, 감사합니다. 잘 먹겠습니다.", rom: "ne, gamsahamnida. jal meokgesseumnida.", l1: "Thank you. (before eating) I'll enjoy this.", alt: ["감사합니다. 잘 먹겠습니다.", "네, 잘 먹겠습니다."]}
