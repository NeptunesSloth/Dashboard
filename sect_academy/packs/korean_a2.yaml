  # ───────────────────────────────────────────────────────────────── 6
  - id: ko2-06
    title: "Errands around town: -(으)러 가다, -(으)ㄹ까요? and -(으)ㅂ시다"
    goal: "I can say where I am going and why, suggest doing things together and agree on a plan."
    notes: |
      ## -(으)러 가다: going somewhere to do something
      | stem ends in | add | example |
      |---|---|---|
      | a consonant | **으러** | 먹으러 가요 (go to eat) |
      | a vowel or ㄹ | **러** | 보러 가요, 놀러 가요 |

      The purpose comes first and the movement verb last: 책을 빌리**러** 도서관에 가요, "I go to the library to borrow books". Use it only with 가다, 오다 and other verbs of movement.

      ## -(으)ㄹ까요? Shall I? Shall we?
      먹**을까요**?, 갈**까요**?, 만들**까요**? (ㄹ stems just add 까요). It makes an offer or a suggestion, and also asks for an opinion: 뭐 먹을까요? "What shall we eat?". Answer with 좋아요 or 네, 그래요.

      ## -(으)ㅂ시다: let's
      먹**읍시다**, 갑**시다**. It is direct and a little formal, like a group leader speaking. Never say it to someone older or senior: to them, use 같이 가요 or 같이 가실까요?. ㄹ stems drop the ㄹ: 만들다 → 만**듭**시다, 놀다 → **놉**시다.

      ## Where
      Most place names end in a Sino-Korean element: -관 (hall: 도서관, 영화관, 박물관), -국 (office: 우체국, 약국), -점 (shop: 서점, 백화점), -실 (room: 미용실, 화장실).
