      - {id: ko2-08-singgeopda, type: vocab, l2: "싱겁다", rom: "singgeopda", l1: "to be bland (not salty enough)", ex: "국이 싱거워요.", ex_rom: "gugi singgeowoyo.", ex_l1: "The soup is bland.", note: "ㅂ-irregular: 싱거워요."}
      - {id: ko2-08-baebureuda, type: vocab, l2: "배부르다", rom: "baebureuda", l1: "to be full (after eating)", ex: "너무 배불러요.", ex_rom: "neomu baebulleoyo.", ex_l1: "I'm so full.", note: "르-irregular: 배불러요."}
      - {id: ko2-08-mongmareuda, type: vocab, l2: "목마르다", rom: "mongmareuda", l1: "to be thirsty", ex: "목말라요. 물 좀 주세요.", ex_rom: "mongmallayo. mul jom juseyo.", ex_l1: "I'm thirsty. Some water, please.", note: "르-irregular: 목말라요."}
      - {id: ko2-08-pojanghada, type: vocab, l2: "포장하다", rom: "pojanghada", l1: "to pack (food) to take away / to wrap", ex: "이거 포장할 수 있어요?", ex_rom: "igeo pojanghal su isseoyo?", ex_l1: "Can I take this away?"}
      - {id: ko2-08-chucheonhada, type: vocab, l2: "추천하다", rom: "chucheonhada", l1: "to recommend", ex: "이 식당을 추천해요.", ex_rom: "i sikdangeul chucheonhaeyo.", ex_l1: "I recommend this restaurant."}
