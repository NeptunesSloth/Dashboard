id: korean-a2
title: "Korean — A2 Elementary"
kind: language
language: Korean
lang: ko-KR
hall: tongues_west
blurb: "Build on A1: read double finals and sound changes, talk about past and future, weather, health, work, hobbies and travel, give reasons, speak with respect and describe people with noun modifiers."

# rom is Revised Romanization as in korean-a1: it follows the pronunciation inside a word
# (liaison, nasal sounds, ㄹ + ㄹ, aspiration with ㅎ) and is written word by word.
units:
  # ───────────────────────────────────────────────────────────────── 1
  - id: ko2-01
    title: "Reading harder blocks: double finals and sound changes"
    goal: "I can read blocks with two final consonants and predict the main sound changes between blocks."
    notes: |
      A1 showed you that a block can end in **two** consonants (닭, 값, 읽, 없). There are about a dozen of these double finals, and the rule for reading them is always the same.

      ## Alone or before a consonant: one letter is said
      | final | said | example |
      |---|---|---|
      | ㄵ ㄶ | n | 앉다 *anda*, 많다 *manta* |
      | ㄺ | k | 맑다 *makda*, 닭 *dak* |
      | ㄻ | m | 젊다 *jeomda* |
      | ㄼ ㄾ ㅀ | l | 넓다 *neolda*, 싫다 *silta* |
      | ㅄ ㄳ | p / k | 없다 *eopda* |

      ## Before a vowel: both are said
      The second letter moves over to the next block: 앉아요 *anjayo*, 맑아요 *malgayo*, 넓어요 *neolbeoyo*. A final **ㅎ** is silent before a vowel: 많아요 *manayo*, 싫어요 *sireoyo*.

      ## Changes between blocks
      - **Nasal**: k, t, p become ng, n, m before ㄴ or ㅁ: 국물 *gungmul*, 작년 *jangnyeon*, 거짓말 *geojinmal*.
      - **ㄹ meets ㄴ**: both become l: 연락 *yeollak*, 설날 *seollal*.
      - **ㅎ next to ㄱ ㄷ ㅂ ㅈ** makes them aspirated: 축하 *chuka*, 좋다 *jota*, 깨끗해요 *kkaekkeutaeyo*.
      - **ㄷ or ㅌ before 이** becomes j or ch: 같이 *gachi*.

      Many consonants also become tense in speech (학교 sounds *hak-kkyo*). The romanisation does not show that.
    items:
      - {id: ko2-01-an, type: glyph, l2: "앉", rom: "an", l1: "as in 앉다 (to sit): ㄵ, only ㄴ is said; before a vowel, 앉아요 = anjayo"}
      - {id: ko2-01-man, type: glyph, l2: "많", rom: "man", l1: "as in 많다 (many): ㄶ, the ㅎ is silent before a vowel; 많이 = mani"}
      - {id: ko2-01-neol, type: glyph, l2: "넓", rom: "neol", l1: "as in 넓다 (wide): ㄼ, only ㄹ is said; 넓어요 = neolbeoyo"}
      - {id: ko2-01-jjal, type: glyph, l2: "짧", rom: "jjal", l1: "as in 짧다 (short): tense ㅉ and ㄼ; 짧아요 = jjalbayo"}
      - {id: ko2-01-jeom, type: glyph, l2: "젊", rom: "jeom", l1: "as in 젊다 (young): ㄻ, only ㅁ is said; 젊어요 = jeolmeoyo"}
      - {id: ko2-01-dam, type: glyph, l2: "닮", rom: "dam", l1: "as in 닮다 (to resemble): ㄻ, only ㅁ is said"}
