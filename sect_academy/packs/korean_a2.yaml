  # ───────────────────────────────────────────────────────────────── 4
  - id: ko2-04
    title: "Weather and seasons: -(으)ㄹ 거예요 and -겠-"
    goal: "I can talk about the weather and the seasons, say what the weather will probably do, and react to what I see."
    notes: |
      ## -(으)ㄹ 거예요: plans, and also guesses
      In A1, 갈 거예요 was a plan. With things you do not control, the same ending is a **prediction**: 내일 비가 **올 거예요**, "it will (probably) rain tomorrow".

      ## -겠-: what something looks like to you
      Add **겠어요** to a stem when you react to what you see or hear:

      - 와, 맛있**겠어요**! (That looks delicious!)
      - 밖에 춥**겠어요**. (It must be cold outside.)
      - 좋**겠어요**! (Lucky you! / That must be nice!)

      It is also in fixed polite phrases: **알겠습니다** (understood), **모르겠어요** (I'm not sure), **잘 먹겠습니다**.

      ## Weather phrases
      Rain and snow "come": 비가 와요, 눈이 와요. Wind "blows": 바람이 불어요. 날씨가 맑아요 (clear), 흐려요 (cloudy).

      ## ㅂ-verbs
      춥다 (cold) and 덥다 (hot) lose their ㅂ and gain 우 before a vowel: 추워요, 더워요, 추웠어요. Unit 17 covers the whole pattern. 따뜻하다 (warm) and 시원하다 (cool) are regular 하다 words.

      춥다 and 덥다 are for the weather or how your body feels. For a cold drink say 차가워요, for hot food 뜨거워요.
    items:
