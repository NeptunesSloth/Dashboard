          - {who: A, l2: "감기예요. 약을 먹고 푹 쉬어야 해요.", rom: "gamgiyeyo. yageul meokgo puk swieoya haeyo.", l1: "It's a cold. You need to take medicine and get plenty of rest."}
          - {who: B, l2: "약은 언제 먹어야 해요?", rom: "yageun eonje meogeoya haeyo?", l1: "When should I take the medicine?", alt: ["약은 언제 먹어요?", "약은 언제 먹어야 돼요?"]}
          - {who: A, l2: "하루에 세 번, 밥을 먹고 드세요. 열이 나니까 오늘은 일하지 마세요.", rom: "harue se beon, babeul meokgo deuseyo. yeori nanikka oneureun ilhaji maseyo.", l1: "Three times a day, after meals. You have a temperature, so don't work today."}
          - {who: B, l2: "네, 알겠습니다. 감사합니다.", rom: "ne, algesseumnida. gamsahamnida.", l1: "All right, I understand. Thank you.", alt: ["알겠습니다. 감사합니다.", "네, 감사합니다."]}

  # ───────────────────────────────────────────────────────────────── 11
  - id: ko2-11
    title: "Work and school: -아/어서 (because) and -는데"
    goal: "I can talk about my job or studies, give a reason or an excuse, and set the scene before saying what happened."
    notes: |
      ## -아/어서: because (the plain reason)
      The same ending as "and then" in unit 9 also gives a **reason**: 늦**어서** 죄송해요 (I'm sorry for being late), 바빠**서** 못 갔어요 (I was busy, so I couldn't go).

      Two rules:

      - Never put the past before it. The tense goes at the end: 어제 바빠서 못 **갔어요**, not 바빴어서.
      - Do not follow it with a command or a suggestion. For "it's raining, so take an umbrella", use -(으)니까 (unit 10).

      ## -는데: setting the scene
      -는데 introduces background, and what follows reacts to it: a contrast, a question or a request.

      | before it | form | example |
      |---|---|---|
      | verbs, 있다/없다 | **는데** | 시험이 있는데 공부를 못 했어요 |
      | adjectives | **(으)ㄴ데** | 바쁜데 나중에 얘기해요 |
      | nouns | **인데** | 회사원인데 요즘 바빠요 |
      | past | **았/었는데** | 갔는데 문을 닫았어요 |

      At the end of a sentence, -는데요 sounds soft and leaves room for the other person to reply.

      ## Work and study words
      출근하다 / 퇴근하다 (go to / leave work), 야근 (overtime), 회의 (meeting). At the end of the day colleagues say **수고하셨습니다** ("thank you for your hard work").
