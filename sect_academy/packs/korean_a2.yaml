  # ───────────────────────────────────────────────────────────────── 3
  - id: ko2-03
    title: "Numbers in context: years, floors, counters and how long"
    goal: "I can say years, floors and quantities with the right number set and counter, and say how long something lasted."
    notes: |
      The choice between the two number sets follows the word that comes after the number.

      | Sino-Korean (일, 이, 삼 …) | native (한, 두, 세 …) |
      |---|---|
      | 년 year: 이천이십오 년 | 시 o'clock, 시간 hours: 두 시간 |
      | 월 month, 일 day | 달 months (how long): 한 달 |
      | 개월 months (how long): 삼 개월 | 살 years of age |
      | 분 minutes, 층 floor, 번 number | 번 times: 두 번 |
      | 원 won, 인분 portions | 개, 명, 권, 장, 마리, 대 |

      ## New counters (native numbers)
      - **권** books · **장** tickets, sheets, photos · **마리** animals · **대** cars and machines
      - **번** = times: 한 번 (once), 두 번 (twice). With Sino-Korean numbers 번 is a *number*: 일 번 = number 1.

      ## How long
      Length of time + **동안**: 일주일 **동안** 쉬었어요 (I rested for a week). **쯤** after a number means "about": 세 시쯤, 한 시간쯤.

      ## Big numbers
      Remember 만 = 10,000: 십만 (100,000), 백만 (1,000,000). 십만 is said *simman*: ㅂ before ㅁ becomes m.

      Years are read as one Sino-Korean number + 년: 2025년 = 이천이십오 년.
    items:
      - {id: ko2-03-seot, type: glyph, l2: "섯", rom: "seot", l1: "as in 다섯, 여섯: final ㅅ said t; before a vowel it is s again, 다섯이 = daseosi"}
      - {id: ko2-03-gop, type: glyph, l2: "곱", rom: "gop", l1: "as in 일곱 (seven): final ㅂ said p"}
      - {id: ko2-03-hop, type: glyph, l2: "홉", rom: "hop", l1: "as in 아홉 (nine): ㅎ + ㅗ + ㅂ"}
      - {id: ko2-03-wol, type: glyph, l2: "월", rom: "wol", l1: "month, as in 삼월 and 개월; after a final it takes that sound, 칠월 = chirwol"}
      - {id: ko2-03-nyeon, type: vocab, l2: "년", rom: "nyeon", l1: "year (with Sino-Korean numbers)", ex: "이천이십오 년", ex_rom: "icheonisibo nyeon", ex_l1: "the year 2025"}
      - {id: ko2-03-taeeonada, type: vocab, l2: "태어나다", rom: "taeeonada", l1: "to be born", ex: "저는 이천 년에 태어났어요.", ex_rom: "jeoneun icheon nyeone taeeonasseoyo.", ex_l1: "I was born in 2000."}
