  # ───────────────────────────────────────────────────────────────── 10
  - id: ko2-10
    title: "At the doctor's and the pharmacy: -아/어야 하다 and -(으)니까"
    goal: "I can describe common symptoms, understand advice about medicine and rest, and say what someone must do and why."
    notes: |
      ## -아/어야 해요: must, have to
      Take the 해요 form, drop 요, add **야 해요**: 먹어**야 해요**, 쉬어**야 해요**, 가**야 해요**. **-아/어야 돼요** means exactly the same and is very common in speech. Past: 가야 했어요 (I had to go).

      ## -(으)니까: because (so do this)
      | stem ends in | add | example |
      |---|---|---|
      | a consonant | **으니까** | 걸렸으니까, 먹으니까 |
      | a vowel or ㄹ | **니까** | 오니까, 아프니까 |

      -(으)니까 gives a reason and is followed by advice, a request or a suggestion: 비가 오**니까** 우산을 가져가세요. It also works after the past: 감기에 걸렸**으니까** 쉬세요. (The other "because", -아/어서, cannot do this: unit 11.)

      ## Describing symptoms
      - (body part)**이/가 아파요**: 머리가 아파요, 목이 아파요.
      - 열이 나요 (I have a temperature), 기침을 해요 (I'm coughing), 콧물이 나요 (my nose is running).
      - 감기에 걸렸어요 (I've caught a cold): Korean uses the past for a state you are in now.

      ## Irregulars here
      아프다 drops ㅡ: 아파요. 낫다 (to get better) loses its ㅅ before a vowel: 나아요, 나았어요, 빨리 나으세요.

      Doctors and pharmacists speak in very polite forms: 어디가 아프세요? 하루에 세 번 드세요.
    items:
      - {id: ko2-10-kot, type: glyph, l2: "콧", rom: "kot", l1: "as in 콧물 (runny nose): ㅅ said t, then n before ㅁ, kon-mul"}
      - {id: ko2-10-tong, type: glyph, l2: "통", rom: "tong", l1: "pain, as in 두통 (headache); also in 통화 (phone call)"}
      - {id: ko2-10-jeung, type: glyph, l2: "증", rom: "jeung", l1: "as in 증상 (symptom) and 영수증 (receipt)"}
      - {id: ko2-10-apeuda, type: vocab, l2: "아프다", rom: "apeuda", l1: "to hurt / to be ill", ex: "배가 아파요.", ex_rom: "baega apayo.", ex_l1: "My stomach hurts.", note: "ㅡ drops before 아: 아파요, 아팠어요."}
      - {id: ko2-10-gamgi, type: vocab, l2: "감기", rom: "gamgi", l1: "a cold", ex: "감기 조심하세요.", ex_rom: "gamgi josimhaseyo.", ex_l1: "Take care not to catch a cold."}
      - {id: ko2-10-gamgiegeollida, type: vocab, l2: "감기에 걸리다", rom: "gamgie geollida", l1: "to catch a cold", ex: "감기에 걸렸어요.", ex_rom: "gamgie geollyeosseoyo.", ex_l1: "I've caught a cold."}
      - {id: ko2-10-yeorinada, type: vocab, l2: "열이 나다", rom: "yeori nada", l1: "to have a fever / temperature", ex: "아이가 열이 나요.", ex_rom: "aiga yeori nayo.", ex_l1: "The child has a temperature."}
      - {id: ko2-10-gichim, type: vocab, l2: "기침", rom: "gichim", l1: "a cough", ex: "기침을 많이 해요.", ex_rom: "gichimeul mani haeyo.", ex_l1: "I'm coughing a lot."}
      - {id: ko2-10-konmul, type: vocab, l2: "콧물", rom: "konmul", l1: "a runny nose", ex: "콧물이 나요.", ex_rom: "konmuri nayo.", ex_l1: "My nose is running."}
      - {id: ko2-10-dutong, type: vocab, l2: "두통", rom: "dutong", l1: "a headache", ex: "두통이 있어요.", ex_rom: "dutongi isseoyo.", ex_l1: "I have a headache."}
      - {id: ko2-10-yak, type: vocab, l2: "약", rom: "yak", l1: "medicine", ex: "약을 먹었어요.", ex_rom: "yageul meogeosseoyo.", ex_l1: "I've taken the medicine.", note: "Korean 'eats' medicine: 약을 먹다."}
      - {id: ko2-10-jintongje, type: vocab, l2: "진통제", rom: "jintongje", l1: "painkiller", ex: "진통제 있어요?", ex_rom: "jintongje isseoyo?", ex_l1: "Do you have any painkillers?"}
      - {id: ko2-10-cheobangjeon, type: vocab, l2: "처방전", rom: "cheobangjeon", l1: "prescription", ex: "처방전을 약국에 가져가세요.", ex_rom: "cheobangjeoneul yakguge gajyeogaseyo.", ex_l1: "Take the prescription to the pharmacy."}
      - {id: ko2-10-dachida, type: vocab, l2: "다치다", rom: "dachida", l1: "to get hurt / to injure", ex: "손을 다쳤어요.", ex_rom: "soneul dachyeosseoyo.", ex_l1: "I've hurt my hand."}
      - {id: ko2-10-puk, type: vocab, l2: "푹", rom: "puk", l1: "(rest / sleep) well, deeply", ex: "푹 쉬세요.", ex_rom: "puk swiseyo.", ex_l1: "Get plenty of rest."}
      - {id: ko2-10-natda, type: vocab, l2: "낫다", rom: "natda", l1: "to get better / to recover", ex: "감기가 다 나았어요.", ex_rom: "gamgiga da naasseoyo.", ex_l1: "My cold has completely cleared up.", note: "ㅅ-irregular: 나아요, 나았어요."}
      - {id: ko2-10-momsal, type: vocab, l2: "몸살", rom: "momsal", l1: "aches and chills (feeling run-down)", ex: "몸살이 났어요.", ex_rom: "momsari nasseoyo.", ex_l1: "I ache all over."}
      - {id: ko2-10-geongang, type: vocab, l2: "건강", rom: "geongang", l1: "health", ex: "건강이 제일 중요해요.", ex_rom: "geongangi jeil jungyohaeyo.", ex_l1: "Health is the most important thing.", note: "건강하다 = to be healthy. 건강하세요! = stay well."}
