      - {id: ko2-13-geouian, type: phrase, l2: "저는 아침을 거의 안 먹어요.", rom: "jeoneun achimeul geoui an meogeoyo", l1: "I hardly ever eat breakfast.", alt: ["아침을 거의 안 먹어요.", "저는 아침을 거의 먹지 않아요."]}
      - {id: ko2-13-c1, type: cloze, text: "자___ 전에 이를 닦아요.", answer: "기", alt: ["gi"], l1: "I brush my teeth before going to bed.", note: "Stem + 기 전에 = before."}
