      - {id: ko2-08-jumunhada, type: vocab, l2: "주문하다", rom: "jumunhada", l1: "to order (food)", alt: ["시키다", "sikida"], ex: "벌써 주문했어요.", ex_rom: "beolsseo jumunhaesseoyo.", ex_l1: "I've already ordered.", note: "In speech people also say 시키다."}
