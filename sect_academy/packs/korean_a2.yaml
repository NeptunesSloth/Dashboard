          - {who: A, l2: "네, 알겠습니다. 맛있게 드세요.", rom: "ne, algesseumnida. masitge deuseyo.", l1: "Certainly. Enjoy your meal."}
          - {who: B, l2: "감사합니다.", rom: "gamsahamnida.", l1: "Thank you.", alt: ["고맙습니다.", "잘 먹겠습니다."]}
          - {who: A, l2: "다 드셨어요? 맛있었어요?", rom: "da deusyeosseoyo? masisseosseoyo?", l1: "Have you finished? Was it good?"}
          - {who: B, l2: "네, 배불러요. 남은 김밥은 포장해 주세요.", rom: "ne, baebulleoyo. nameun gimbabeun pojanghae juseyo.", l1: "Yes, I'm full. Please pack the leftover gimbap for me to take away.", alt: ["배불러요. 남은 김밥은 포장해 주세요.", "네, 배불러요. 이거 포장해 주세요."]}
          - {who: A, l2: "네, 잠깐만 기다리세요.", rom: "ne, jamkkanman gidariseyo.", l1: "Of course, just a moment."}
          - {who: B, l2: "잘 먹었습니다.", rom: "jal meogeosseumnida.", l1: "Thank you for the meal.", alt: ["감사합니다. 잘 먹었습니다.", "고맙습니다. 잘 먹었습니다."]}

  # ───────────────────────────────────────────────────────────────── 9
  - id: ko2-09
    title: "Getting around: transport, -(으)면 and -아/어서 (and then)"
    goal: "I can take the subway, a bus or a taxi, ask how long a journey takes, and give and follow directions with 'if' and 'and then'."
    notes: |
      ## -(으)면: if / when
      | stem ends in | add | example |
      |---|---|---|
      | a consonant | **으면** | 먹으면 |
      | a vowel or ㄹ | **면** | 가면, 살면 |

      In directions it means "when you get there": 쭉 가**면** 오른쪽에 은행이 있어요, "go straight on and the bank is on your right".

      ## -아/어서: and then (in that place)
      Use **-아/어서** when the second action builds on the first, usually in the same place: 버스에서 내**려서** 걸어가세요 (get off and walk), 길을 건**너서** 왼쪽으로 가세요. Use **-고** for actions that are simply listed, and always with 타다: 지하철을 **타고** 가요 (I go by subway).

      ## Getting on and off
      Vehicles take 을/를 with 타다: 버스**를** 타요. Getting off takes 에서: 다음 역**에서** 내려요. To change lines: 삼 호선으로 갈아타세요.

      ## How long?
      **걸리다** = to take (time): 얼마나 걸려요? 삼십 분쯤 걸려요. By a means of transport: **(으)로**: 택시로 가요, 지하철로 와요.

      ## First, second
      첫 번째, 두 번째, 세 번째: native numbers + 번째, but "first" is the special **첫**.

      돌다 (to turn) loses its ㄹ before ㅅ: 왼쪽으로 **도세요**.
    items:
