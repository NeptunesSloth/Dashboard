  # ───────────────────────────────────────────────────────────────── 14
  - id: ko2-14
    title: "Travel: -아/어 보다 (try it, have you ever?)"
    goal: "I can plan a trip, book a room, talk about places I have and have not been, and suggest things to try."
    notes: |
      ## -아/어 보다: try it and see
      Take the 해요 form, drop 요, and add a form of **보다** (to see):

      | | example | meaning |
      |---|---|---|
      | present | 먹어 봐요 | I'll try (eating) it |
      | suggestion | 입어 보세요 | try it on |
      | wish | 가 보고 싶어요 | I'd like to visit (go and see) |
      | past | 가 봤어요 | I have been there (I went and saw) |

      The past form is the usual way to talk about **experience**: 제주도에 가 봤어요? "Have you (ever) been to Jeju?" — 네, 가 봤어요 / 아니요, 안 가 봤어요.

      The space is standard: 먹어 보다. You will also see it written together (먹어보다); both are accepted.

      ## Booking and travelling
      - 예약하다: to book. 호텔을 예약했어요. 예약했는데요… (I have a booking…)
      - 구경하다: to look around, go sightseeing. 시내를 구경했어요.
      - 사진을 찍다: to take a photo. To ask a stranger: 사진 좀 찍어 주시겠어요?
      - Saying goodbye to a traveller: **여행 잘 다녀오세요** (have a good trip and come back safely).

      ## Holidays
      **휴가** is time off work; **방학** (unit 11) is the school holiday. Both take 때 for "during": 휴가 때, 방학 때.
    items:
      - {id: ko2-14-jjik, type: glyph, l2: "찍", rom: "jjik", l1: "as in 사진을 찍다 (to take a photo): tense ㅉ, final ㄱ"}
