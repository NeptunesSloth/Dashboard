        type: dialogue
        title: "What's good here?"
        scene: "You are in a small snack restaurant. The owner comes to take your order."
        you: B
        lines:
          - {who: A, l2: "어서 오세요. 뭐 드릴까요?", rom: "eoseo oseyo. mwo deurilkkayo?", l1: "Welcome. What can I get you?"}
