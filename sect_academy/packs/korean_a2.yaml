      - {id: ko2-13-neutge, type: vocab, l2: "늦게", rom: "neutge", l1: "late (adverb)", ex: "어제 늦게 잤어요.", ex_rom: "eoje neutge jasseoyo.", ex_l1: "I went to bed late last night."}
      - {id: ko2-13-allam, type: vocab, l2: "알람", rom: "allam", l1: "alarm (clock)", ex: "알람을 여섯 시에 맞췄어요.", ex_rom: "allameul yeoseot sie matchwosseoyo.", ex_l1: "I set the alarm for six."}
      - {id: ko2-13-geudaeume, type: vocab, l2: "그다음에", rom: "geudaeume", l1: "after that / next", ex: "샤워해요. 그다음에 아침을 먹어요.", ex_rom: "syawohaeyo. geudaeume achimeul meogeoyo.", ex_l1: "I shower. After that, I have breakfast."}
      - {id: ko2-13-jeonhyeo, type: vocab, l2: "전혀", rom: "jeonhyeo", l1: "(not) at all / never (with a negative)", ex: "커피를 전혀 안 마셔요.", ex_rom: "keopireul jeonhyeo an masyeoyo.", ex_l1: "I never drink coffee."}
      - {id: ko2-13-geoui, type: vocab, l2: "거의", rom: "geoui", l1: "almost / (with a negative) hardly", ex: "거의 다 했어요.", ex_rom: "geoui da haesseoyo.", ex_l1: "I've almost finished.", note: "Said geo-i. 거의 안 + verb = hardly ever."}
      - {id: ko2-13-botongmyeotsi, type: phrase, l2: "보통 몇 시에 일어나요?", rom: "botong myeot sie ireonayo", l1: "What time do you usually get up?", alt: ["보통 몇 시에 일어나세요?"]}
      - {id: ko2-13-eoryeosseul, type: phrase, l2: "어렸을 때 서울에 살았어요.", rom: "eoryeosseul ttae seoure sarasseoyo", l1: "I lived in Seoul when I was little.", alt: ["어릴 때 서울에 살았어요.", "eoril ttae seoure sarasseoyo"]}
