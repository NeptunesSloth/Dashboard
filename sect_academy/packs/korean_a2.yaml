          - {who: B, l2: "늦어서 죄송합니다. 길이 많이 막혀서 늦었어요.", rom: "neujeoseo joesonghamnida. giri mani makyeoseo neujeosseoyo.", l1: "I'm sorry I'm late. The traffic was very bad, so I was late.", alt: ["죄송합니다. 길이 많이 막혀서 늦었어요.", "늦어서 죄송합니다. 길이 막혀서 늦었어요."]}
