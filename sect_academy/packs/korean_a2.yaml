      - {id: ko2-09-taeksi, type: vocab, l2: "택시", rom: "taeksi", l1: "taxi", ex: "택시를 탔어요.", ex_rom: "taeksireul tasseoyo.", ex_l1: "I took a taxi."}
      - {id: ko2-09-gonghang, type: vocab, l2: "공항", rom: "gonghang", l1: "airport", ex: "공항에 어떻게 가요?", ex_rom: "gonghange eotteoke gayo?", ex_l1: "How do I get to the airport?"}
      - {id: ko2-09-chulgu, type: vocab, l2: "출구", rom: "chulgu", l1: "exit", ex: "삼 번 출구로 나가세요.", ex_rom: "sam beon chulguro nagaseyo.", ex_l1: "Go out of exit 3."}
      - {id: ko2-09-ipgu, type: vocab, l2: "입구", rom: "ipgu", l1: "entrance", ex: "입구에서 만나요.", ex_rom: "ipgueseo mannayo.", ex_l1: "Let's meet at the entrance."}
      - {id: ko2-09-tada, type: vocab, l2: "타다", rom: "tada", l1: "to get on / to ride / to take (a vehicle)", ex: "버스를 타요.", ex_rom: "beoseureul tayo.", ex_l1: "I take the bus."}
      - {id: ko2-09-naerida, type: vocab, l2: "내리다", rom: "naerida", l1: "to get off (a vehicle)", ex: "다음 정류장에서 내려요.", ex_rom: "daeum jeongnyujangeseo naeryeoyo.", ex_l1: "I get off at the next stop."}
      - {id: ko2-09-garatada, type: vocab, l2: "갈아타다", rom: "garatada", l1: "to change / transfer (trains, buses)", ex: "여기에서 갈아타요.", ex_rom: "yeogieseo garatayo.", ex_l1: "I change here."}
      - {id: ko2-09-geollida, type: vocab, l2: "걸리다", rom: "geollida", l1: "to take (an amount of time)", ex: "삼십 분쯤 걸려요.", ex_rom: "samsip bunjjeum geollyeoyo.", ex_l1: "It takes about thirty minutes."}
      - {id: ko2-09-geonneoda, type: vocab, l2: "건너다", rom: "geonneoda", l1: "to cross (a road, a river)", ex: "길을 건너세요.", ex_rom: "gireul geonneoseyo.", ex_l1: "Cross the road."}
      - {id: ko2-09-dolda, type: vocab, l2: "돌다", rom: "dolda", l1: "to turn", ex: "오른쪽으로 돌아요.", ex_rom: "oreunjjogeuro dorayo.", ex_l1: "I turn right.", note: "ㄹ drops before ㅅ: 도세요 (please turn)."}
      - {id: ko2-09-nagada, type: vocab, l2: "나가다", rom: "nagada", l1: "to go out / to leave (a place)", ex: "몇 시에 나가요?", ex_rom: "myeot sie nagayo?", ex_l1: "What time are you going out?", note: "The opposite is 들어가다 (to go in)."}
      - {id: ko2-09-georeogada, type: vocab, l2: "걸어가다", rom: "georeogada", l1: "to walk (there) / to go on foot", ex: "학교까지 걸어가요.", ex_rom: "hakgyokkaji georeogayo.", ex_l1: "I walk to school."}
      - {id: ko2-09-sageori, type: vocab, l2: "사거리", rom: "sageori", l1: "crossroads / intersection", ex: "사거리에서 왼쪽으로 가세요.", ex_rom: "sageorieseo oenjjogeuro gaseyo.", ex_l1: "Go left at the crossroads."}
      - {id: ko2-09-hoseon, type: vocab, l2: "호선", rom: "hoseon", l1: "(subway) line (with Sino-Korean numbers)", ex: "사 호선을 타세요.", ex_rom: "sa hoseoneul taseyo.", ex_l1: "Take line 4.", note: "Usually written with a figure: 4호선."}
      - {id: ko2-09-gil, type: vocab, l2: "길", rom: "gil", l1: "road / street / way", ex: "길이 막혀요.", ex_rom: "giri makyeoyo.", ex_l1: "The traffic is bad. (the road is blocked)"}
      - {id: ko2-09-gyotongkadeu, type: vocab, l2: "교통카드", rom: "gyotongkadeu", l1: "transport card (for buses and the subway)", alt: ["교통 카드"], ex: "교통카드를 충전해요.", ex_rom: "gyotongkadeureul chungjeonhaeyo.", ex_l1: "I top up my transport card."}
      - {id: ko2-09-cheotbeonjjae, type: vocab, l2: "첫 번째", rom: "cheot beonjjae", l1: "the first (in order)", ex: "첫 번째 사거리에서 도세요.", ex_rom: "cheot beonjjae sageorieseo doseyo.", ex_l1: "Turn at the first crossroads.", note: "두 번째 (second), 세 번째 (third)."}
      - {id: ko2-09-daeumyeok, type: vocab, l2: "다음 역", rom: "daeum yeok", l1: "the next station", ex: "다음 역에서 내리세요.", ex_rom: "daeum yeogeseo naeriseyo.", ex_l1: "Get off at the next station."}
      - {id: ko2-09-gonghangkkaji, type: phrase, l2: "공항까지 가 주세요.", rom: "gonghangkkaji ga juseyo", l1: "To the airport, please. (in a taxi)", alt: ["공항으로 가 주세요.", "gonghangeuro ga juseyo", "공항이요."]}
      - {id: ko2-09-sewo, type: phrase, l2: "여기에서 세워 주세요.", rom: "yeogieseo sewo juseyo", l1: "Please stop here. (to a taxi driver)", alt: ["여기서 세워 주세요.", "여기서 내릴게요."]}
      - {id: ko2-09-eolmana, type: phrase, l2: "얼마나 걸려요?", rom: "eolmana geollyeoyo", l1: "How long does it take?", alt: ["시간이 얼마나 걸려요?"]}
      - {id: ko2-09-gilireo, type: phrase, l2: "길을 잃어버렸어요.", rom: "gireul ireobeoryeosseoyo", l1: "I'm lost. (I have lost my way)", alt: ["길을 잃었어요.", "gireul ireosseoyo"]}
      - {id: ko2-09-myeotbeonchulgu, type: phrase, l2: "몇 번 출구로 나가요?", rom: "myeot beon chulguro nagayo", l1: "Which exit number do I take?", alt: ["몇 번 출구예요?", "몇 번 출구로 나가야 해요?"]}
      - {id: ko2-09-c1, type: cloze, text: "오른쪽으로 가___ 은행이 있어요.", answer: "면", alt: ["myeon"], l1: "If you go right, there's a bank.", note: "Vowel stem (가): 면."}
      - {id: ko2-09-c2, type: cloze, text: "이 길을 건너___ 왼쪽으로 가세요.", answer: "서", alt: ["seo"], l1: "Cross this road and then go left.", note: "건너 + 어서 → 건너서: the next step happens there."}
      - {id: ko2-09-c3, type: cloze, text: "버스에서 ___ 조금 걸어가세요.", answer: "내려서", alt: ["naeryeoseo"], l1: "Get off the bus and then walk a little.", note: "내리 + 어서 → 내려서."}
      - {id: ko2-09-c4, type: cloze, text: "저는 지하철을 ___ 회사에 가요.", answer: "타고", alt: ["tago"], l1: "I take the subway to work.", note: "With 타다, use -고, not -아서."}
      - {id: ko2-09-c5, type: cloze, text: "다음 역에서 삼 호선으로 ___.", answer: "갈아타세요", alt: ["garataseyo"], l1: "Change to line 3 at the next station.", note: "갈아타다 + 세요."}
      - {id: ko2-09-c6, type: cloze, text: "사거리에서 왼쪽으로 ___.", answer: "도세요", alt: ["doseyo"], l1: "Turn left at the crossroads.", note: "돌다: the ㄹ drops before 세요."}
      - {id: ko2-09-c7, type: cloze, text: "집에서 회사까지 한 시간쯤 ___.", answer: "걸려요", alt: ["geollyeoyo"], l1: "It takes about an hour from home to the office.", note: "걸리다 → 걸려요."}
      - {id: ko2-09-c8, type: cloze, text: "서울에 ___ 연락 주세요.", answer: "오면", alt: ["omyeon"], l1: "If you come to Seoul, get in touch.", note: "오다 → 오면."}
      - id: ko2-09-d1
        type: dialogue
        title: "To the museum by subway"
        scene: "You want to go to the National Museum and ask a woman at a subway station."
        you: A
        lines:
          - {who: A, l2: "실례합니다. 국립 박물관에 어떻게 가요?", rom: "sillyehamnida. gungnip bangmulgwane eotteoke gayo?", l1: "Excuse me. How do I get to the National Museum?", alt: ["실례합니다. 박물관에 어떻게 가요?", "저기요. 국립 박물관에 어떻게 가요?"]}
          - {who: B, l2: "지하철을 타고 가세요. 사 호선을 타면 돼요.", rom: "jihacheoreul tago gaseyo. sa hoseoneul tamyeon dwaeyo.", l1: "Go by subway. You just need to take line 4."}
          - {who: A, l2: "여기에서 얼마나 걸려요?", rom: "yeogieseo eolmana geollyeoyo?", l1: "How long does it take from here?", alt: ["얼마나 걸려요?", "여기서 얼마나 걸려요?"]}
          - {who: B, l2: "이십 분쯤 걸려요. 다섯 번째 역에서 내리세요.", rom: "isip bunjjeum geollyeoyo. daseot beonjjae yeogeseo naeriseyo.", l1: "About twenty minutes. Get off at the fifth station."}
          - {who: A, l2: "몇 번 출구로 나가요?", rom: "myeot beon chulguro nagayo?", l1: "Which exit do I take?", alt: ["몇 번 출구예요?", "몇 번 출구로 나가야 해요?"]}
          - {who: B, l2: "삼 번 출구로 나가서 쭉 가면 박물관이 있어요.", rom: "sam beon chulguro nagaseo jjuk gamyeon bangmulgwani isseoyo.", l1: "Go out of exit 3 and straight on, and the museum is there."}
          - {who: A, l2: "삼 번 출구요? 감사합니다!", rom: "sam beon chulguyo? gamsahamnida!", l1: "Exit 3? Thank you!", alt: ["삼 번 출구요? 고맙습니다!", "감사합니다!"]}
          - {who: B, l2: "네, 맞아요. 안녕히 가세요.", rom: "ne, majayo. annyeonghi gaseyo.", l1: "Yes, that's right. Goodbye."}
