  # ───────────────────────────────────────────────────────────────── 13
  - id: ko2-13
    title: "My day in order: -기 전에, -(으)ㄴ 후에 and -(으)ㄹ 때"
    goal: "I can describe my daily routine in order, say how often I do things and say what I do or did at a given time."
    notes: |
      ## Before and after
      | | verbs | nouns |
      |---|---|---|
      | before | stem + **기 전에**: 자**기 전에** | 수업 **전에** |
      | after | stem + **(으)ㄴ 후에**: 먹**은 후에**, 끝**난 후에** | 수업 **후에** |

      After a consonant stem the "after" form is 은 후에 (먹은 후에); after a vowel it is ㄴ 후에 (본 후에, 끝난 후에). ㄹ stems drop the ㄹ: 만들다 → 만든 후에. In speech, **-고 나서** is a common "after": 밥을 먹고 나서. The tense goes at the end of the sentence, never before 전에 or 후에.

      ## When: -(으)ㄹ 때
      피곤**할 때** (when I'm tired), 시간이 있**을 때** (when I have time). For a finished event, use the past + 을 때: 한국에 **갔을 때** (when I went to Korea), 어**렸을 때** (when I was young).

      ## How often
      | 항상 always | 자주 often | 보통 usually | 가끔 sometimes | 거의 안 hardly ever | 전혀 안 never |
      |---|---|---|---|---|---|

      전혀 and 거의 need a negative: 전혀 안 먹어요 (I never eat it).

      ## Washing
      세수하다 (wash your face), 이를 닦다 (brush your teeth), 머리를 감다 (wash your hair), 씻다 (wash in general, hands, yourself).
    items:
      - {id: ko2-13-ssit, type: glyph, l2: "씻", rom: "ssit", l1: "as in 씻다 (to wash): ㅆ + ㅣ + ㅅ; 씻어요 = ssiseoyo"}
      - {id: ko2-13-dak, type: glyph, l2: "닦", rom: "dak", l1: "as in 이를 닦다 (to brush teeth): final ㄲ said k; 닦아요 = dakkayo"}
      - {id: ko2-13-chak, type: glyph, l2: "착", rom: "chak", l1: "as in 도착 (arrival): before ㅎ the ㄱ becomes k, do-cha-ka-da"}
      - {id: ko2-13-ireonada, type: vocab, l2: "일어나다", rom: "ireonada", l1: "to get up / to wake up", ex: "아침 일곱 시에 일어나요.", ex_rom: "achim ilgop sie ireonayo.", ex_l1: "I get up at seven in the morning."}
      - {id: ko2-13-sesuhada, type: vocab, l2: "세수하다", rom: "sesuhada", l1: "to wash one's face", ex: "일어나서 세수해요.", ex_rom: "ireonaseo sesuhaeyo.", ex_l1: "I get up and wash my face."}
      - {id: ko2-13-ireuldakda, type: vocab, l2: "이를 닦다", rom: "ireul dakda", l1: "to brush one's teeth", alt: ["양치하다", "yangchihada"], ex: "밥 먹고 이를 닦아요.", ex_rom: "bap meokgo ireul dakkayo.", ex_l1: "I brush my teeth after eating."}
      - {id: ko2-13-ssitda, type: vocab, l2: "씻다", rom: "ssitda", l1: "to wash (hands, oneself, vegetables)", ex: "손을 씻어요.", ex_rom: "soneul ssiseoyo.", ex_l1: "I wash my hands."}
      - {id: ko2-13-meorireulgamda, type: vocab, l2: "머리를 감다", rom: "meorireul gamda", l1: "to wash one's hair", ex: "저녁에 머리를 감아요.", ex_rom: "jeonyeoge meorireul gamayo.", ex_l1: "I wash my hair in the evening.", note: "Hair is 'washed' with its own verb, 감다."}
