  # ───────────────────────────────────────────────────────────────── 8
  - id: ko2-08
    title: "Eating out: -아/어 주다 and -고 싶어 하다"
    goal: "I can order in a Korean restaurant, ask for changes and recommendations, and say what other people want."
    notes: |
      ## -아/어 주다: doing something for someone
      Take the 해요 form, drop 요, and add a form of **주다** (to give):

      | | example |
      |---|---|
      | request | 추천해 **주세요** (please recommend) |
      | offer | 읽어 **줄까요**? (shall I read it for you?) |
      | past favour | 김밥을 만들어 **줬어요** (I made gimbap for her) |

      To someone older or a customer, the humble **드리다** replaces 주다: 도와 **드릴까요**? (unit 15). Staff will say 뭐 드릴까요?

      ## -고 싶어 하다: what others want
      -고 싶어요 is for your own wishes (and for asking "you"). For a third person, Korean adds **하다**: 동생이 라면을 먹고 **싶어 해요**. You cannot see inside someone else's head, so you describe how they seem.

      ## Ordering
      - Grilled meat is ordered by the portion: 삼겹살 **삼 인분** (Sino-Korean + 인분).
      - Side dishes (**반찬**) are free and refilled: 반찬 좀 더 주세요.
      - To take food away: 포장해 주세요. To eat in: 여기서 먹을게요.

      ## Taste
      짜다 salty · 달다 sweet · 싱겁다 bland · 맵다 spicy. 싱겁다 is ㅂ-irregular: 싱거워요. 배부르다 (full) and 목마르다 (thirsty) are 르-irregular: 배불러요, 목말라요.

      Sound: 떡볶이 is *tteokbokki*; 목마르다 is *mongmareuda* (ㄱ before ㅁ → ng).
    items:
      - {id: ko2-08-bok, type: glyph, l2: "볶", rom: "bok", l1: "as in 떡볶이 and 볶음밥 (fried rice): final ㄲ said k"}
      - {id: ko2-08-gyeop, type: glyph, l2: "겹", rom: "gyeop", l1: "as in 삼겹살 (pork belly, 'three layers'): ㄱ + ㅕ + ㅂ"}
