          - {who: A, l2: "좋아요. 발표는 누가 해요?", rom: "joayo. balpyoneun nuga haeyo?", l1: "Good. Who's giving the presentation?"}
          - {who: B, l2: "제가 할 거예요.", rom: "jega hal geoyeyo.", l1: "I'm going to do it.", alt: ["제가 해요.", "제가 하겠습니다."]}
