  # ───────────────────────────────────────────────────────────────── 4
  - id: ko2-04
    title: "Weather and seasons: -(으)ㄹ 거예요 and -겠-"
    goal: "I can talk about the weather and the seasons, say what the weather will probably do, and react to what I see."
    notes: |
      ## -(으)ㄹ 거예요: plans, and also guesses
      In A1, 갈 거예요 was a plan. With things you do not control, the same ending is a **prediction**: 내일 비가 **올 거예요**, "it will (probably) rain tomorrow".

      ## -겠-: what something looks like to you
      Add **겠어요** to a stem when you react to what you see or hear:

      - 와, 맛있**겠어요**! (That looks delicious!)
      - 밖에 춥**겠어요**. (It must be cold outside.)
      - 좋**겠어요**! (Lucky you! / That must be nice!)

      It is also in fixed polite phrases: **알겠습니다** (understood), **모르겠어요** (I'm not sure), **잘 먹겠습니다**.

      ## Weather phrases
      Rain and snow "come": 비가 와요, 눈이 와요. Wind "blows": 바람이 불어요. 날씨가 맑아요 (clear), 흐려요 (cloudy).

      ## ㅂ-verbs
      춥다 (cold) and 덥다 (hot) lose their ㅂ and gain 우 before a vowel: 추워요, 더워요, 추웠어요. Unit 17 covers the whole pattern. 따뜻하다 (warm) and 시원하다 (cool) are regular 하다 words.

      춥다 and 덥다 are for the weather or how your body feels. For a cold drink say 차가워요, for hot food 뜨거워요.
    items:
      - {id: ko2-04-get, type: glyph, l2: "겠", rom: "get", l1: "as in 맛있겠어요, 알겠습니다: ㄱ + ㅔ + ㅆ"}
      - {id: ko2-04-chup, type: glyph, l2: "춥", rom: "chup", l1: "as in 춥다 (cold): before a vowel the ㅂ becomes 우, 추워요"}
      - {id: ko2-04-deop, type: glyph, l2: "덥", rom: "deop", l1: "as in 덥다 (hot): before a vowel the ㅂ becomes 우, 더워요"}
      - {id: ko2-04-neul, type: glyph, l2: "늘", rom: "neul", l1: "as in 하늘 (sky) and 오늘 (today)"}
      - {id: ko2-04-nalssi, type: vocab, l2: "날씨", rom: "nalssi", l1: "the weather", ex: "오늘 날씨가 좋아요.", ex_rom: "oneul nalssiga joayo.", ex_l1: "The weather is good today."}
      - {id: ko2-04-bom, type: vocab, l2: "봄", rom: "bom", l1: "spring", ex: "봄에는 꽃이 많아요.", ex_rom: "bomeneun kkochi manayo.", ex_l1: "There are lots of flowers in spring."}
      - {id: ko2-04-yeoreum, type: vocab, l2: "여름", rom: "yeoreum", l1: "summer", ex: "여름에 바다에 가요.", ex_rom: "yeoreume badae gayo.", ex_l1: "I go to the sea in summer."}
      - {id: ko2-04-gaeul, type: vocab, l2: "가을", rom: "gaeul", l1: "autumn / fall", ex: "가을 하늘이 맑아요.", ex_rom: "gaeul haneuri malgayo.", ex_l1: "The autumn sky is clear."}
      - {id: ko2-04-gyeoul, type: vocab, l2: "겨울", rom: "gyeoul", l1: "winter", ex: "겨울에는 눈이 와요.", ex_rom: "gyeoureneun nuni wayo.", ex_l1: "It snows in winter."}
      - {id: ko2-04-gyejeol, type: vocab, l2: "계절", rom: "gyejeol", l1: "season", ex: "어느 계절을 좋아해요?", ex_rom: "eoneu gyejeoreul joahaeyo?", ex_l1: "Which season do you like?"}
      - {id: ko2-04-chupda, type: vocab, l2: "춥다", rom: "chupda", l1: "to be cold (weather, feeling cold)", ex: "오늘 너무 추워요.", ex_rom: "oneul neomu chuwoyo.", ex_l1: "It's so cold today.", note: "ㅂ-irregular: 추워요, 추웠어요."}
      - {id: ko2-04-deopda, type: vocab, l2: "덥다", rom: "deopda", l1: "to be hot (weather, feeling hot)", ex: "여름에는 정말 더워요.", ex_rom: "yeoreumeneun jeongmal deowoyo.", ex_l1: "It's really hot in summer.", note: "ㅂ-irregular: 더워요, 더웠어요."}
      - {id: ko2-04-ttatteutada, type: vocab, l2: "따뜻하다", rom: "ttatteutada", l1: "to be warm (pleasantly)", ex: "봄에는 날씨가 따뜻해요.", ex_rom: "bomeneun nalssiga ttatteutaeyo.", ex_l1: "The weather is warm in spring."}
      - {id: ko2-04-siwonhada, type: vocab, l2: "시원하다", rom: "siwonhada", l1: "to be cool / refreshing", ex: "바람이 시원해요.", ex_rom: "barami siwonhaeyo.", ex_l1: "The breeze is cool."}
      - {id: ko2-04-ssalssalhada, type: vocab, l2: "쌀쌀하다", rom: "ssalssalhada", l1: "to be chilly", ex: "아침에는 쌀쌀해요.", ex_rom: "achimeneun ssalssalhaeyo.", ex_l1: "It's chilly in the mornings."}
      - {id: ko2-04-heurida, type: vocab, l2: "흐리다", rom: "heurida", l1: "to be cloudy / overcast", ex: "오늘은 날씨가 흐려요.", ex_rom: "oneureun nalssiga heuryeoyo.", ex_l1: "It's cloudy today."}
      - {id: ko2-04-bigaoda, type: vocab, l2: "비가 오다", rom: "biga oda", l1: "to rain", alt: ["비가 내리다", "biga naerida"], ex: "밖에 비가 와요.", ex_rom: "bakke biga wayo.", ex_l1: "It's raining outside.", note: "Literally 'rain comes'."}
      - {id: ko2-04-nunioda, type: vocab, l2: "눈이 오다", rom: "nuni oda", l1: "to snow", alt: ["눈이 내리다", "nuni naerida"], ex: "어제 눈이 많이 왔어요.", ex_rom: "eoje nuni mani wasseoyo.", ex_l1: "It snowed a lot yesterday."}
      - {id: ko2-04-baramibulda, type: vocab, l2: "바람이 불다", rom: "barami bulda", l1: "the wind blows / to be windy", ex: "바람이 많이 불어요.", ex_rom: "barami mani bureoyo.", ex_l1: "It's very windy."}
      - {id: ko2-04-haneul, type: vocab, l2: "하늘", rom: "haneul", l1: "the sky", ex: "하늘이 파래요.", ex_rom: "haneuri paraeyo.", ex_l1: "The sky is blue."}
      - {id: ko2-04-usan, type: vocab, l2: "우산", rom: "usan", l1: "umbrella", ex: "우산이 있어요?", ex_rom: "usani isseoyo?", ex_l1: "Do you have an umbrella?"}
      - {id: ko2-04-ilgiyebo, type: vocab, l2: "일기 예보", rom: "ilgi yebo", l1: "the weather forecast", alt: ["일기예보", "날씨 예보", "nalssi yebo"], ex: "일기 예보를 봤어요.", ex_rom: "ilgi yeboreul bwasseoyo.", ex_l1: "I watched the weather forecast."}
      - {id: ko2-04-olhae, type: vocab, l2: "올해", rom: "olhae", l1: "this year", ex: "올해 겨울은 따뜻해요.", ex_rom: "olhae gyeoureun ttatteutaeyo.", ex_l1: "This winter is mild."}
      - {id: ko2-04-naenyeon, type: vocab, l2: "내년", rom: "naenyeon", l1: "next year", ex: "내년에 한국에 갈 거예요.", ex_rom: "naenyeone hanguge gal geoyeyo.", ex_l1: "I'm going to Korea next year."}
      - {id: ko2-04-nalssieottaeyo, type: phrase, l2: "오늘 날씨가 어때요?", rom: "oneul nalssiga eottaeyo", l1: "What's the weather like today?", alt: ["오늘 날씨 어때요?", "오늘은 날씨가 어때요?"]}
      - {id: ko2-04-biga, type: phrase, l2: "내일 비가 올 거예요.", rom: "naeil biga ol geoyeyo", l1: "It's going to rain tomorrow.", alt: ["내일은 비가 올 거예요.", "내일 비가 오겠어요."]}
      - {id: ko2-04-usangajyeo, type: phrase, l2: "우산 가져가세요.", rom: "usan gajyeogaseyo", l1: "Take an umbrella with you.", alt: ["우산을 가져가세요."], note: "가져가다 = take (something) along; 가져오다 = bring."}
      - {id: ko2-04-algesseumnida, type: phrase, l2: "알겠습니다.", rom: "algesseumnida", alt: ["algetseumnida", "알겠어요.", "algesseoyo"], l1: "Understood. / I see. (formal)", note: "The standard reply to an instruction from a boss, teacher or customer."}
      - {id: ko2-04-jokesseoyo, type: phrase, l2: "좋겠어요!", rom: "jokesseoyo", l1: "Lucky you! / That must be nice!"}
      - {id: ko2-04-c1, type: cloze, text: "내일은 비가 ___ 거예요.", answer: "올", alt: ["ol"], l1: "It will probably rain tomorrow.", note: "오다 → 올 거예요: a prediction."}
      - {id: ko2-04-c2, type: cloze, text: "겨울에는 날씨가 ___.", answer: "추워요", alt: ["chuwoyo"], l1: "The weather is cold in winter.", note: "춥다: ㅂ → 우 before a vowel."}
      - {id: ko2-04-c3, type: cloze, text: "어제는 정말 ___.", answer: "더웠어요", alt: ["deowosseoyo"], l1: "It was really hot yesterday.", note: "덥다 → 더워요 → 더웠어요."}
      - {id: ko2-04-c4, type: cloze, text: "와, 이 케이크 맛있___!", answer: "겠어요", alt: ["gesseoyo"], l1: "Wow, this cake looks delicious!", note: "겠어요: your reaction to what you see."}
      - {id: ko2-04-c5, type: cloze, text: "봄에는 날씨가 ___.", answer: "따뜻해요", alt: ["ttatteutaeyo"], l1: "The weather is warm in spring.", note: "따뜻하다 → 따뜻해요."}
      - {id: ko2-04-c6, type: cloze, text: "오늘은 바람이 많이 ___.", answer: "불어요", alt: ["bureoyo"], l1: "It's very windy today.", note: "바람이 불다 → 불어요."}
      - {id: ko2-04-c7, type: cloze, text: "오늘은 하늘이 ___.", answer: "흐려요", alt: ["heuryeoyo"], l1: "The sky is overcast today.", note: "흐리 + 어요 → 흐려요."}
      - id: ko2-04-d1
        type: dialogue
        title: "Will it rain tomorrow?"
        scene: "You and your Korean flatmate are planning a walk in the park tomorrow."
        you: B
        lines:
          - {who: A, l2: "내일 날씨가 어때요?", rom: "naeil nalssiga eottaeyo?", l1: "What's the weather like tomorrow?"}
          - {who: B, l2: "일기 예보를 봤어요. 비가 올 거예요.", rom: "ilgi yeoboreul bwasseoyo. biga ol geoyeyo.", l1: "I've seen the forecast. It's going to rain.", alt: ["일기예보를 봤어요. 비가 올 거예요.", "비가 올 거예요."]}
          - {who: A, l2: "아, 그래요? 그럼 공원에 못 가겠어요.", rom: "a, geuraeyo? geureom gongwone mot gagesseoyo.", l1: "Oh, really? Then we won't be able to go to the park."}
          - {who: B, l2: "토요일은 맑을 거예요.", rom: "toyoireun malgeul geoyeyo.", l1: "Saturday will be clear.", alt: ["토요일에는 맑을 거예요.", "토요일은 날씨가 맑을 거예요."]}
          - {who: A, l2: "그럼 토요일에 가요. 춥지 않을까요?", rom: "geureom toyoire gayo. chupji aneulkkayo?", l1: "Let's go on Saturday then. Won't it be cold?"}
          - {who: B, l2: "아니요, 따뜻할 거예요.", rom: "aniyo, ttatteutal geoyeyo.", l1: "No, it'll be warm.", alt: ["아니요, 따뜻할 거예요. 걱정하지 마세요.", "안 추울 거예요."]}
          - {who: A, l2: "좋아요. 그럼 토요일에 같이 가요!", rom: "joayo. geureom toyoire gachi gayo!", l1: "Great. Let's go together on Saturday then!"}
          - {who: B, l2: "네, 좋아요!", rom: "ne, joayo!", l1: "Yes, sounds good!", alt: ["좋아요!", "네, 같이 가요!"]}
