  # ───────────────────────────────────────────────────────────────── 7
  - id: ko2-07
    title: "Shopping for clothes: colours, comparisons and -지만"
    goal: "I can ask for another size or colour, compare two things, say which is best, and exchange or return something."
    notes: |
      ## Comparing
      | pattern | example |
      |---|---|
      | A가 B**보다** (더) … | 이 가방이 저 가방**보다** (**더**) 싸요. This bag is cheaper than that one. |
      | **제일** / **가장** … | 이게 **제일** 싸요. This is the cheapest. |
      | **덜** … | 이게 **덜** 비싸요. This is less expensive. |

      **보다** is a particle stuck to the thing you compare against; **더** can be left out when 보다 is there. 제일 is the everyday word; 가장 is a little more written.

      ## -지만: but
      Stem + **지만** joins two contrasting clauses: 예쁘**지만** 비싸요, "it's pretty but expensive". Past: 샀**지만** 안 입어요. With nouns: 학생**이지만** / 의사**지만**.

      ## Colours
      Use the **noun** forms ending in 색 when you shop: 빨간색, 파란색, 노란색, 검은색, 흰색. 무슨 색이에요? = what colour is it?

      ## Wearing
      Korean chooses the verb by **where** it goes on the body:

      - **입다**: clothes (shirts, trousers, dresses)
      - **신다**: shoes and socks
      - **쓰다**: hats and glasses (unit 16)

      ## Irregular 르
      다르다 (to be different) doubles its ㄹ before a vowel: 달라요. 예쁘다 drops ㅡ: 예뻐요.
    items:
      - {id: ko2-07-huin, type: glyph, l2: "흰", rom: "huin", l1: "white, as in 흰색: ㅎ + ㅢ + ㄴ (often said 'hin')"}
      - {id: ko2-07-geom, type: glyph, l2: "검", rom: "geom", l1: "as in 검은색 (black): ㄱ + ㅓ + ㅁ"}
      - {id: ko2-07-rat, type: glyph, l2: "랗", rom: "rat", l1: "as in 노랗다, 파랗다: alone the ㅎ is said t; 노란색 drops it"}
      - {id: ko2-07-saek, type: vocab, l2: "색", rom: "saek", l1: "colour", alt: ["색깔", "saekkkal"], ex: "무슨 색을 좋아해요?", ex_rom: "museun saegeul joahaeyo?", ex_l1: "What colour do you like?"}
      - {id: ko2-07-ppalgansaek, type: vocab, l2: "빨간색", rom: "ppalgansaek", l1: "red", ex: "빨간색 치마를 샀어요.", ex_rom: "ppalgansaek chimareul sasseoyo.", ex_l1: "I bought a red skirt."}
      - {id: ko2-07-paransaek, type: vocab, l2: "파란색", rom: "paransaek", l1: "blue", ex: "파란색 바지가 있어요?", ex_rom: "paransaek bajiga isseoyo?", ex_l1: "Do you have blue trousers?"}
