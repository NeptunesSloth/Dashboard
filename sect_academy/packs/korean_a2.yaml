  # ───────────────────────────────────────────────────────────────── 15
  - id: ko2-15
    title: "Speaking with respect: -(으)시-, 께서, 드리다, 계시다, 드시다"
    goal: "I can talk politely to and about older people and seniors, using honorific verbs and nouns, and humble words for myself."
    notes: |
      Korean shows respect for the **person you talk about**, not only the person you talk to.

      ## -(으)시-: raising the subject
      Put **(으)시** after the stem when the subject is older or senior: 가다 → 가**세요**, 읽다 → 읽**으세요**, past 가**셨어요**, future 가**실** 거예요. You already know it from 안녕하세요 and 어서 오세요.

      ## Special verbs, nouns and particles
      | plain | honorific |
      |---|---|
      | 있다 (a person is somewhere) | **계시다** |
      | 먹다, 마시다 | **드시다** |
      | 자다 | **주무시다** |
      | 말하다 | **말씀하시다** |
      | 아프다 | **편찮으시다** |
      | 이름, 나이, 집, 생일 | **성함, 연세, 댁, 생신** |
      | 이/가, 한테 | **께서, 께** |

      ## Humble words for yourself
      Lower yourself instead of raising the other person: **저 / 저희** (I / we), **드리다** (give, for 주다), **여쭤보다** (ask), **뵙다** (meet, see).

      ## How much to use
      Never use -(으)시- about yourself. With friends your own age, plain 해요 is enough. With grandparents, teachers, bosses and customers, use it every time: 할머니께서 주무세요. 선생님께 선물을 드렸어요.

      Sound: 뵙겠습니다 is *boepgesseumnida*; 편찮으세요 is *pyeonchaneuseyo* (ㅎ silent).
    items:
      - {id: ko2-15-boep, type: glyph, l2: "뵙", rom: "boep", l1: "as in 처음 뵙겠습니다: ㅂ + ㅚ + ㅂ"}
      - {id: ko2-15-syeot, type: glyph, l2: "셨", rom: "syeot", l1: "as in 가셨어요: honorific 시 + past 었 merged, ㅅ + ㅕ + ㅆ"}
      - {id: ko2-15-chan, type: glyph, l2: "찮", rom: "chan", l1: "as in 편찮으시다 and 괜찮아요: ㄶ, the ㅎ is silent before a vowel"}
      - {id: ko2-15-sseum, type: glyph, l2: "씀", rom: "sseum", l1: "as in 말씀 (words, honorific): ㅆ + ㅡ + ㅁ"}
      - {id: ko2-15-gyesida, type: vocab, l2: "계시다", rom: "gyesida", l1: "to be (somewhere) / to stay (honorific of 있다, for people)", ex: "어머니는 집에 계세요.", ex_rom: "eomeonineun jibe gyeseyo.", ex_l1: "My mother is at home.", note: "For things, 있으세요 is used: 시간 있으세요?"}
      - {id: ko2-15-deusida, type: vocab, l2: "드시다", rom: "deusida", l1: "to eat / to drink (honorific)", ex: "할아버지께서 진지를 드세요.", ex_rom: "harabeojikkeseo jinjireul deuseyo.", ex_l1: "Grandfather is having his meal.", note: "진지 is the honorific word for a meal."}
      - {id: ko2-15-jumusida, type: vocab, l2: "주무시다", rom: "jumusida", l1: "to sleep (honorific)", ex: "할머니는 일찍 주무세요.", ex_rom: "halmeonineun iljjik jumuseyo.", ex_l1: "Grandmother goes to bed early."}
      - {id: ko2-15-malsseumhasida, type: vocab, l2: "말씀하시다", rom: "malsseumhasida", l1: "to speak / to say (honorific)", ex: "선생님께서 말씀하셨어요.", ex_rom: "seonsaengnimkkeseo malsseumhasyeosseoyo.", ex_l1: "The teacher said so."}
      - {id: ko2-15-pyeonchaneusida, type: vocab, l2: "편찮으시다", rom: "pyeonchaneusida", l1: "to be ill (honorific of 아프다)", ex: "할머니께서 편찮으세요.", ex_rom: "halmeonikkeseo pyeonchaneuseyo.", ex_l1: "My grandmother is unwell."}
      - {id: ko2-15-seongham, type: vocab, l2: "성함", rom: "seongham", l1: "name (honorific)", ex: "성함이 어떻게 되세요?", ex_rom: "seonghami eotteoke doeseyo?", ex_l1: "May I have your name, please?"}
