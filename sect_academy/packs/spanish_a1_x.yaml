part_of: spanish-a1

units:
  # ---------------------------------------------------------------- 13
  - id: es-13
    title: "Numbers 11–100 & prices"
    goal: "I can count to a hundred, understand and say prices, and give my age."
    notes: |
      You know 1–10, *veinte* and *cien*. Now fill the gaps.

      **11–15** are irregular: *once, doce, trece, catorce, quince*.

      **16–19** are "ten-and-six" written as one word: *dieciséis, diecisiete, dieciocho, diecinueve*.

      **21–29** are also one word, built on *veinti-*: *veintiuno, veintidós, veintitrés … veintinueve*. Three of them need an accent: *veintidós, veintitrés, veintiséis*.

      **From 31** write three words joined by **y**: *treinta y uno, cuarenta y dos, noventa y nueve*.

      | Tens | Spanish |
      | 30 | treinta |
      | 40 | cuarenta |
      | 50 | cincuenta |
      | 60 | sesenta |
      | 70 | setenta |
      | 80 | ochenta |
      | 90 | noventa |

      - **uno** becomes **un** before a masculine noun and **una** before a feminine one: *treinta y un euros*, *veintiuna personas*.
      - **cien** is exactly 100; for 101–199 it becomes *ciento*: *ciento diez*.
      - Prices: *Cuesta doce euros.* In Spain prices are written with a comma: 12,50 € is *doce euros con cincuenta*.
    items:
      - {id: es-13-once, type: vocab, l2: "once", l1: "eleven",
         ex: "Son las once.", ex_l1: "It's eleven o'clock.",
         note: "Not the English word 'once': say ON-theh (Spain) or ON-seh (Latin America)."}
      - {id: es-13-doce, type: vocab, l2: "doce", l1: "twelve",
         ex: "Hay doce estudiantes en la clase.", ex_l1: "There are twelve students in the class."}
      - {id: es-13-trece, type: vocab, l2: "trece", l1: "thirteen",
         ex: "Mi hermana tiene trece años.", ex_l1: "My sister is thirteen."}
      - {id: es-13-catorce, type: vocab, l2: "catorce", l1: "fourteen",
         ex: "Hoy es el catorce de mayo.", ex_l1: "Today is the fourteenth of May."}
      - {id: es-13-quince, type: vocab, l2: "quince", l1: "fifteen",
         ex: "El autobús viene en quince minutos.", ex_l1: "The bus is coming in fifteen minutes.",
         note: "qu sounds like k: KEEN-theh / KEEN-seh."}
      - {id: es-13-dieciseis, type: vocab, l2: "dieciséis", l1: "sixteen",
         ex: "Tengo dieciséis euros.", ex_l1: "I have sixteen euros.",
         note: "One word, with an accent on the e. 17–19 follow the pattern without an accent: diecisiete, dieciocho, diecinueve."}
      - {id: es-13-veintiuno, type: vocab, l2: "veintiuno", l1: "twenty-one (when counting)",
         ex: "Veinte y uno son veintiuno.", ex_l1: "Twenty and one are twenty-one.",
         note: "21–29 are one word: veintiuno, veintidós, veintitrés… Before a noun: veintiún años, veintiuna personas."}
      - {id: es-13-treinta, type: vocab, l2: "treinta", l1: "thirty",
         ex: "Abril tiene treinta días.", ex_l1: "April has thirty days.",
         note: "From 31 on, three words with y: treinta y uno, treinta y dos."}
      - {id: es-13-cuarenta, type: vocab, l2: "cuarenta", l1: "forty",
         ex: "Trabajo cuarenta horas a la semana.", ex_l1: "I work forty hours a week.",
         note: "cuatro → cuarenta."}
      - {id: es-13-cincuenta, type: vocab, l2: "cincuenta", l1: "fifty",
         ex: "Hay cincuenta personas en el restaurante.", ex_l1: "There are fifty people in the restaurant.",
         note: "cinco → cincuenta."}
      - {id: es-13-sesenta, type: vocab, l2: "sesenta", l1: "sixty",
         ex: "Una hora tiene sesenta minutos.", ex_l1: "An hour has sixty minutes.",
         note: "seis → sesenta. Easy to confuse with setenta (70)."}
      - {id: es-13-setenta, type: vocab, l2: "setenta", l1: "seventy",
         ex: "Mi abuelo tiene setenta años.", ex_l1: "My grandfather is seventy.",
         note: "siete → setenta (with a t). Sesenta (60) has an s."}
      - {id: es-13-ochenta, type: vocab, l2: "ochenta", l1: "eighty",
         ex: "El hotel cuesta ochenta euros.", ex_l1: "The hotel costs eighty euros."}
      - {id: es-13-noventa, type: vocab, l2: "noventa", l1: "ninety",
         ex: "Mi abuela tiene noventa años.", ex_l1: "My grandmother is ninety.",
         note: "nueve → noventa (not 'nueventa')."}
      - {id: es-13-euro, type: vocab, l2: "el euro", l1: "the euro",
         ex: "Un café cuesta dos euros.", ex_l1: "A coffee costs two euros.",
         note: "Say EH-oo-ro. The small coins are céntimos. Latin America: el peso, el dólar, el sol…"}
      - {id: es-13-son-euros, type: phrase, l2: "Son treinta y cinco euros.", l1: "That's thirty-five euros. (telling someone the total)",
         alt: ["Son treinta y cinco euros en total", "Son 35 euros"],
         note: "Totals use son (plural), like the time: son las tres."}
      - {id: es-13-cuanto-es-todo, type: phrase, l2: "¿Cuánto es todo?", l1: "How much is everything? (asking for the total)",
         alt: ["¿Cuánto es en total?", "¿Cuánto cuesta todo?", "¿Cuánto es?"],
         note: "¿Cuánto cuesta? asks the price of one thing; ¿Cuánto es? asks what you owe."}
      - {id: es-13-demasiado-caro, type: phrase, l2: "Es demasiado caro.", l1: "It's too expensive. (a masculine thing)",
         note: "demasiado = too (much). For a feminine thing: Es demasiado cara."}
      - {id: es-13-tengo-42, type: phrase, l2: "Tengo cuarenta y dos años.", l1: "I am forty-two years old.",
         alt: ["Yo tengo cuarenta y dos años", "Tengo cuarenta y dos", "Tengo 42 años"],
         note: "Age uses tener, never ser: you 'have' years."}
      - {id: es-13-c1, type: cloze, text: "Diez y siete son ___.", answer: "diecisiete",
         l1: "Ten and seven are seventeen.", note: "16–19 are one word: dieci + siete"}
      - {id: es-13-c2, type: cloze, text: "Nueve y nueve son ___.", answer: "dieciocho",
         l1: "Nine and nine are eighteen.", note: "dieci + ocho, one word, no accent"}
      - {id: es-13-c3, type: cloze, text: "Veinte menos uno son ___.", answer: "diecinueve",
         l1: "Twenty minus one is nineteen.", note: "dieci + nueve, one word"}
      - {id: es-13-c4, type: cloze, text: "Once y once son ___.", answer: "veintidós",
         l1: "Eleven and eleven are twenty-two.", note: "21–29 are one word; veintidós, veintitrés and veintiséis carry an accent"}
      - {id: es-13-c5, type: cloze, text: "Mi madre tiene cincuenta ___ tres años.", answer: "y",
         l1: "My mother is fifty-three.", note: "from 31 on: tens + y + units, as three words"}
      - {id: es-13-c6, type: cloze, text: "El libro cuesta treinta y ___ euros.", answer: "un",
         l1: "The book costs thirty-one euros.", note: "uno → un before a masculine noun"}
      - {id: es-13-c7, type: cloze, text: "Hay cuarenta y ___ personas en el autobús.", answer: "una",
         l1: "There are forty-one people on the bus.", note: "uno → una before a feminine noun (la persona)"}

  # ---------------------------------------------------------------- 14
  - id: es-14
    title: "Months, seasons, dates & ordinals"
    goal: "I can name the months and seasons, say and ask dates and birthdays, and use first, second and third."
    notes: |
      Months and seasons take a **small letter** in Spanish: *enero*, *el verano*.

      **Dates** use *el* + an ordinary number + *de* + the month: *el tres de marzo*, *el veinticinco de diciembre*. There is no "-th". The first of the month is *el uno de mayo* in Spain and usually *el primero de mayo* in Latin America.

      **In** a month or season is **en**: *en julio*, *en invierno*. **On** a date is just **el**: *La fiesta es el cinco de agosto.*

      **Ordinals** agree with the noun, and two of them lose their *-o* before a masculine singular noun:

      | Number | Masculine | Before a masc. noun | Feminine |
      | 1st | primero | primer | primera |
      | 2nd | segundo | segundo | segunda |
      | 3rd | tercero | tercer | tercera |
      | 4th | cuarto | cuarto | cuarta |
      | 5th | quinto | quinto | quinta |

      So *el primer día*, *el tercer piso*, but *la primera calle*. Ordinals go **before** the noun. Above tenth, Spanish normally just uses the ordinary number: *el piso doce*.
    items:
      - {id: es-14-enero, type: vocab, l2: "enero", l1: "January",
         ex: "En enero hace frío.", ex_l1: "In January it is cold.",
         note: "Months are not capitalised in Spanish."}
      - {id: es-14-febrero, type: vocab, l2: "febrero", l1: "February",
         ex: "Febrero tiene veintiocho días.", ex_l1: "February has twenty-eight days."}
      - {id: es-14-marzo, type: vocab, l2: "marzo", l1: "March",
         ex: "Mi cumpleaños es en marzo.", ex_l1: "My birthday is in March."}
      - {id: es-14-abril, type: vocab, l2: "abril", l1: "April",
         ex: "En abril voy a Sevilla.", ex_l1: "In April I'm going to Seville."}
      - {id: es-14-mayo, type: vocab, l2: "mayo", l1: "May",
         ex: "El uno de mayo no trabajo.", ex_l1: "On the first of May I don't work.",
         note: "Latin America usually says el primero de mayo."}
      - {id: es-14-junio, type: vocab, l2: "junio", l1: "June",
         ex: "En junio hace sol.", ex_l1: "In June it is sunny.",
         note: "j is a throaty h: HOO-nyo. Don't mix it up with julio (July)."}
      - {id: es-14-julio, type: vocab, l2: "julio", l1: "July",
         ex: "En julio vamos a la playa.", ex_l1: "In July we go to the beach.",
         note: "junio has an n like JuNe; julio has an l like JuLy."}
      - {id: es-14-agosto, type: vocab, l2: "agosto", l1: "August",
         ex: "En agosto hace mucho calor.", ex_l1: "In August it is very hot."}
      - {id: es-14-septiembre, type: vocab, l2: "septiembre", l1: "September", alt: ["setiembre"],
         ex: "Vuelvo a Londres en septiembre.", ex_l1: "I go back to London in September.",
         note: "The p is barely heard; the spelling setiembre is also accepted."}
      - {id: es-14-octubre, type: vocab, l2: "octubre", l1: "October",
         ex: "Hoy es el doce de octubre.", ex_l1: "Today is the twelfth of October."}
      - {id: es-14-noviembre, type: vocab, l2: "noviembre", l1: "November",
         ex: "En noviembre hace mal tiempo.", ex_l1: "In November the weather is bad."}
      - {id: es-14-diciembre, type: vocab, l2: "diciembre", l1: "December",
         ex: "El veinticinco de diciembre es Navidad.", ex_l1: "The twenty-fifth of December is Christmas."}
      - {id: es-14-primavera, type: vocab, l2: "la primavera", l1: "spring (the season)",
         ex: "En primavera hace buen tiempo.", ex_l1: "In spring the weather is good.",
         note: "The only feminine season. 'In spring' = en primavera, without the article."}
      - {id: es-14-verano, type: vocab, l2: "el verano", l1: "summer",
         ex: "En verano voy a la playa.", ex_l1: "In summer I go to the beach."}
      - {id: es-14-otono, type: vocab, l2: "el otoño", l1: "autumn / fall",
         ex: "El otoño es muy bonito en Madrid.", ex_l1: "Autumn is very pretty in Madrid.",
         note: "ñ = 'ny': o-TO-nyo."}
      - {id: es-14-invierno, type: vocab, l2: "el invierno", l1: "winter",
         ex: "En invierno hace frío.", ex_l1: "In winter it is cold."}
      - {id: es-14-cuando-cumple, type: phrase, l2: "¿Cuándo es tu cumpleaños?", l1: "When is your birthday? (informal)",
         alt: ["¿Cuándo es tu cumple?", "¿Cuándo cumples años?"],
         note: "el cumpleaños ends in -s even in the singular: un cumpleaños, dos cumpleaños."}
      - {id: es-14-hoy-es-el-tres, type: phrase, l2: "Hoy es el tres de marzo.", l1: "Today is the third of March.",
         alt: ["Hoy es tres de marzo", "Es el tres de marzo", "Hoy estamos a tres de marzo", "Hoy es el 3 de marzo"],
         note: "el + ordinary number + de + month. No ordinal, no capital letter."}
      - {id: es-14-feliz-cumple, type: phrase, l2: "¡Feliz cumpleaños!", l1: "Happy birthday!",
         alt: ["¡Feliz cumple!", "¡Felicidades!"],
         note: "feliz = happy. ¡Felicidades! (congratulations) is just as common in Spain."}
      - {id: es-14-segundo-piso, type: phrase, l2: "Vivo en el segundo piso.", l1: "I live on the second floor.",
         alt: ["Yo vivo en el segundo piso", "Vivo en el segundo", "Vivo en la segunda planta"],
         note: "el piso is the floor (storey) here; it also means a flat. Ordinals go before the noun."}
      - {id: es-14-c1, type: cloze, text: "El lunes es el ___ día de la semana.", answer: "primer",
         l1: "Monday is the first day of the week.", note: "primero → primer before a masculine singular noun"}
      - {id: es-14-c2, type: cloze, text: "Hoy es mi ___ clase de español.", answer: "primera",
         l1: "Today is my first Spanish class.", note: "la clase is feminine → primera (the feminine form is never shortened)"}
      - {id: es-14-c3, type: cloze, text: "Es la ___ calle a la izquierda.", answer: "segunda",
         l1: "It's the second street on the left.", note: "la calle is feminine → segunda"}
      - {id: es-14-c4, type: cloze, text: "Marzo es el ___ mes del año.", answer: "tercer",
         l1: "March is the third month of the year.", note: "tercero → tercer before a masculine singular noun (el mes)"}
      - {id: es-14-c5, type: cloze, text: "La fiesta es ___ cinco de agosto.", answer: "el",
         l1: "The party is on the fifth of August.", note: "'on' + a date is simply el: el cinco de agosto"}
      - {id: es-14-c6, type: cloze, text: "Hace mucho calor ___ verano.", answer: "en",
         l1: "It is very hot in summer.", note: "en + month or season: en verano, en julio"}

  # ---------------------------------------------------------------- 15
  - id: es-15
    title: "My things: possessives & demonstratives"
    goal: "I can say whose something is and point things out with this, that and that over there."
    notes: |
      **Possessives** go before the noun and agree with the **thing owned**, not with the owner. Add **-s** when the thing is plural.

      | Owner | One thing | Several things |
      | my | mi | mis |
      | your (tú) | tu | tus |
      | his / her / their / your (usted) | su | sus |
      | our | nuestro / nuestra | nuestros / nuestras |
      | your (vosotros) | vuestro / vuestra | vuestros / vuestras |

      - **su** covers his, her, its, their and formal your; context tells you which. *Su casa* can be his, her or their house.
      - Only *nuestro* and *vuestro* change for gender: *nuestra casa*.
      - *tu* (your) has no accent; *tú* (you) does.

      **Demonstratives** show three distances and also agree with the noun:

      | Distance | Masc. | Fem. | Masc. pl. | Fem. pl. |
      | this (near me) | este | esta | estos | estas |
      | that (near you) | ese | esa | esos | esas |
      | that (far from both) | aquel | aquella | aquellos | aquellas |

      The neuter forms **esto**, **eso** and **aquello** are used alone, for an unnamed thing or an idea: *¿Qué es eso?*
    items:
      - {id: es-15-mi, type: vocab, l2: "mi", l1: "my (before a singular noun)",
         ex: "Mi casa está cerca.", ex_l1: "My house is nearby.",
         note: "The same for masculine and feminine: mi padre, mi madre. Plural: mis."}
      - {id: es-15-tu, type: vocab, l2: "tu", l1: "your (informal, to one person; before a singular noun)",
         ex: "¿Es tu coche?", ex_l1: "Is it your car?",
         note: "No accent: tu = your, tú = you. Plural: tus."}
      - {id: es-15-su, type: vocab, l2: "su", l1: "his / her / their / your (formal) — one word, before a singular noun",
         ex: "Su hermano vive en Perú.", ex_l1: "His (or her, or their) brother lives in Peru.",
         note: "One word for five English ones. To be clear you can add de él, de ella, de usted: la casa de ella."}
      - {id: es-15-nuestro, type: vocab, l2: "nuestro", l1: "our (before a masculine singular noun)",
         ex: "Nuestro profesor es de Chile.", ex_l1: "Our teacher is from Chile.",
         note: "Agrees with the thing owned: nuestro hijo, nuestra hija, nuestros hijos, nuestras hijas."}
      - {id: es-15-vuestro, type: vocab, l2: "vuestro", l1: "your (informal, to a group, Spain; before a masculine singular noun)",
         ex: "¿Es vuestro perro?", ex_l1: "Is it your dog?",
         note: "Goes with vosotros. Latin America does not use it: su perro or el perro de ustedes."}
      - {id: es-15-este, type: vocab, l2: "este", l1: "this (before a masculine noun)",
         ex: "Este libro es bueno.", ex_l1: "This book is good.",
         note: "The masculine is este, not 'esto'. Esto is only used alone, with no noun."}
      - {id: es-15-esta, type: vocab, l2: "esta", l1: "this (before a feminine noun)",
         ex: "Esta ciudad es muy bonita.", ex_l1: "This city is very pretty.",
         note: "No accent. Está (with an accent) is the verb 'is'."}
      - {id: es-15-ese, type: vocab, l2: "ese", l1: "that (before a masculine noun; near the person you are talking to)",
         ex: "Ese coche es caro.", ex_l1: "That car is expensive."}
      - {id: es-15-esa, type: vocab, l2: "esa", l1: "that (before a feminine noun; near the person you are talking to)",
         ex: "Esa silla es de Ana.", ex_l1: "That chair is Ana's."}
      - {id: es-15-aquel, type: vocab, l2: "aquel", l1: "that … over there (before a masculine noun; far from both of us)",
         ex: "Aquel hombre es mi padre.", ex_l1: "That man over there is my father.",
         note: "Feminine: aquella. Plural: aquellos, aquellas."}
      - {id: es-15-eso, type: vocab, l2: "eso", l1: "that (used alone for a thing or idea, with no noun — neuter)",
         ex: "Eso es un problema.", ex_l1: "That is a problem.",
         note: "Never before a noun: ese libro, but ¿Qué es eso?"}
      - {id: es-15-gafas, type: vocab, l2: "las gafas", l1: "the glasses (for your eyes)", alt: ["los lentes", "los anteojos"],
         ex: "Mis gafas son nuevas.", ex_l1: "My glasses are new.",
         note: "Always plural. Latin America: los lentes or los anteojos."}
      - {id: es-15-reloj, type: vocab, l2: "el reloj", l1: "the watch / the clock",
         ex: "Este reloj es muy caro.", ex_l1: "This watch is very expensive.",
         note: "One word for both watch and clock. The final j is a soft throaty h."}
      - {id: es-15-cartera, type: vocab, l2: "la cartera", l1: "the wallet", alt: ["la billetera"],
         ex: "No tengo dinero en la cartera.", ex_l1: "I have no money in my wallet.",
         note: "In much of Latin America la cartera is a handbag, and a wallet is la billetera."}
      - {id: es-15-paraguas, type: vocab, l2: "el paraguas", l1: "the umbrella", alt: ["la sombrilla"],
         ex: "¿Dónde está mi paraguas?", ex_l1: "Where is my umbrella?",
         note: "Masculine although it ends in -as, and the same in the plural: los paraguas."}
      - {id: es-15-de-quien, type: phrase, l2: "¿De quién es este reloj?", l1: "Whose watch is this?",
         alt: ["¿De quién es el reloj?"],
         note: "Literally 'Of whom is this watch?' Spanish has no single word for 'whose' in questions."}
      - {id: es-15-esta-es-mi-familia, type: phrase, l2: "Esta es mi familia.", l1: "This is my family.",
         alt: ["Ésta es mi familia", "Es mi familia"],
         note: "Introducing people, the demonstrative agrees: Este es Juan, esta es Ana."}
      - {id: es-15-que-es-eso, type: phrase, l2: "¿Qué es eso?", l1: "What is that? (a thing near you)",
         alt: ["¿Eso qué es?"],
         note: "Neuter eso, because you don't yet know what the thing is."}
      - {id: es-15-me-gusta-este, type: phrase, l2: "Me gusta este.", l1: "I like this one. (a masculine thing)",
         alt: ["Este me gusta", "Me gusta éste", "A mí me gusta este"],
         note: "Spanish needs no word for 'one': este = this one, esa = that one."}
      - {id: es-15-c1, type: cloze, text: "___ padres viven en Bilbao.", answer: "Mis",
         l1: "My parents live in Bilbao.", note: "plural noun → mis"}
      - {id: es-15-c2, type: cloze, text: "Carlos, ¿dónde están ___ llaves?", answer: "tus",
         l1: "Carlos, where are your keys?", note: "plural noun → tus (informal, one person)"}
      - {id: es-15-c3, type: cloze, text: "___ casa es pequeña, pero bonita.", answer: "Nuestra",
         l1: "Our house is small but pretty.", note: "nuestro agrees with the thing owned: la casa → nuestra"}
      - {id: es-15-c4, type: cloze, text: "Ana vive con ___ padres.", answer: "sus",
         l1: "Ana lives with her parents.", note: "su → sus because padres is plural, not because of the owner"}
      - {id: es-15-c5, type: cloze, text: "___ libros son muy caros.", answer: "Estos",
         l1: "These books are very expensive.", note: "masculine plural of este → estos"}
      - {id: es-15-c6, type: cloze, text: "___ gafas son nuevas.", answer: "Estas",
         l1: "These glasses are new.", note: "feminine plural of esta → estas"}
      - {id: es-15-c7, type: cloze, text: "___ mujer es la madre de Luis.", answer: "Aquella",
         l1: "That woman over there is Luis's mother.", note: "far from both speakers, feminine singular → aquella"}

  # ---------------------------------------------------------------- 16
  - id: es-16
    title: "My day: reflexive verbs & routine"
    goal: "I can describe my daily routine and ask what time someone gets up, eats and goes to bed."
    notes: |
      Many routine verbs are **reflexive**: you do the action to yourself. The dictionary form ends in **-se** (*levantarse*, *ducharse*). To use one, conjugate the verb as normal and put the matching pronoun **in front**:

      | Pronoun | ducharse |
      | yo | me ducho |
      | tú | te duchas |
      | él / ella / usted | se ducha |
      | nosotros | nos duchamos |
      | vosotros | os ducháis |
      | ellos / ustedes | se duchan |

      - In the negative, *no* goes before the pronoun: *No me ducho por la noche.*
      - Some of these verbs also change their stem vowel when it is stressed (every form except *nosotros* and *vosotros*): *despertarse → me despierto*, *acostarse → me acuesto*, *vestirse → me visto*, *dormir → duermo*.
      - With parts of the body Spanish uses **the article**, not a possessive: *Me lavo las manos*, "I wash my hands".
      - Meals have their own verbs: *desayunar*, *comer*, *cenar*. Spaniards eat late: lunch around two, dinner around nine or ten.
    items:
      - {id: es-16-despertarse, type: vocab, l2: "despertarse", l1: "to wake up",
         ex: "Me despierto a las seis.", ex_l1: "I wake up at six.",
         note: "Stem change e → ie: me despierto, te despiertas, se despierta; but nos despertamos."}
      - {id: es-16-ducharse, type: vocab, l2: "ducharse", l1: "to have a shower", alt: ["bañarse", "darse una ducha"],
         ex: "Me ducho todos los días.", ex_l1: "I have a shower every day.",
         note: "In much of Latin America people say bañarse, which in Spain means to have a bath."}
      - {id: es-16-lavarse, type: vocab, l2: "lavarse", l1: "to wash (yourself)",
         ex: "Me lavo con agua fría.", ex_l1: "I wash with cold water.",
         note: "Without se, lavar is to wash something else: Lavo el coche."}
      - {id: es-16-vestirse, type: vocab, l2: "vestirse", l1: "to get dressed",
