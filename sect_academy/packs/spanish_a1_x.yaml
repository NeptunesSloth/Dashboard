  # ---------------------------------------------------------------- 17
  - id: es-17
    title: "Home, rooms & where things are"
    goal: "I can describe my home, say what is in each room and say exactly where things are."
    notes: |
      To describe a home you need two verbs you already know, used for different jobs.

      - **hay** says that something **exists**. It is followed by *un / una*, a number, or no article at all: *Hay un sofá. Hay dos ventanas. No hay nevera.* It never changes for the plural.
      - **estar** says **where** a known, specific thing is. It is followed by *el / la / mi…*: *El sofá está en el salón. Las llaves están en la mesa.*

      A good test: if English says "there is / there are", use *hay*; if it says "the … is", use *está*.

      **Prepositions of place** are followed by **de**, and *de + el* contracts to **del**:

      | Spanish | English |
      | encima de | on top of |
      | debajo de | under |
      | al lado de | next to |
      | delante de | in front of |
      | detrás de | behind |
      | entre | between (no *de*) |

      *El perro está debajo **de la** mesa. El banco está al lado **del** hotel.*

      *En* covers both "in" and "on": *en la cocina*, *en la mesa*.
    items:
      - {id: es-17-piso, type: vocab, l2: "el piso", l1: "the flat / apartment", alt: ["el apartamento", "el departamento"],
         ex: "Mi piso está en el centro.", ex_l1: "My flat is in the centre.",
         note: "Spain: el piso (also 'floor, storey'). Latin America: el apartamento or el departamento."}
      - {id: es-17-habitacion, type: vocab, l2: "la habitación", l1: "the room (in a house or a hotel)", alt: ["el cuarto"],
         ex: "El hotel tiene veinte habitaciones.", ex_l1: "The hotel has twenty rooms.",
         note: "Feminine, like all -ción words. The plural drops the accent: habitaciones."}
      - {id: es-17-dormitorio, type: vocab, l2: "el dormitorio", l1: "the bedroom", alt: ["la recámara", "la alcoba"],
         ex: "Mi dormitorio es pequeño.", ex_l1: "My bedroom is small.",
         note: "From dormir. Mexico says la recámara; people also just say la habitación."}
      - {id: es-17-cocina, type: vocab, l2: "la cocina", l1: "the kitchen",
         ex: "Como en la cocina.", ex_l1: "I eat in the kitchen.",
         note: "Also means the cooker and 'cooking, cuisine': la cocina española."}
      - {id: es-17-salon, type: vocab, l2: "el salón", l1: "the living room", alt: ["la sala", "la sala de estar", "el cuarto de estar"],
         ex: "El salón es grande.", ex_l1: "The living room is big.",
         note: "Latin America usually says la sala."}
      - {id: es-17-cama, type: vocab, l2: "la cama", l1: "the bed",
         ex: "La cama es nueva.", ex_l1: "The bed is new."}
      - {id: es-17-puerta, type: vocab, l2: "la puerta", l1: "the door",
         ex: "La puerta está abierta.", ex_l1: "The door is open."}
      - {id: es-17-ventana, type: vocab, l2: "la ventana", l1: "the window",
         ex: "La ventana está cerrada.", ex_l1: "The window is closed."}
      - {id: es-17-sofa, type: vocab, l2: "el sofá", l1: "the sofa",
         ex: "El perro está en el sofá.", ex_l1: "The dog is on the sofa.",
         note: "Masculine although it ends in -a; the accent puts the stress on the last syllable."}
      - {id: es-17-nevera, type: vocab, l2: "la nevera", l1: "the fridge",
         alt: ["el frigorífico", "el refrigerador", "la heladera", "la refrigeradora", "el frigo"],
         ex: "La leche está en la nevera.", ex_l1: "The milk is in the fridge.",
         note: "Spain: la nevera or el frigorífico. Latin America: el refrigerador, la heladera (Argentina)."}
      - {id: es-17-encima-de, type: vocab, l2: "encima de", l1: "on top of", alt: ["sobre", "arriba de"],
         ex: "El libro está encima de la mesa.", ex_l1: "The book is on top of the table.",
         note: "Plain 'on' is usually just en: en la mesa."}
      - {id: es-17-debajo-de, type: vocab, l2: "debajo de", l1: "under / underneath", alt: ["bajo", "abajo de"],
         ex: "El móvil está debajo de la silla.", ex_l1: "The mobile is under the chair."}
      - {id: es-17-al-lado-de, type: vocab, l2: "al lado de", l1: "next to / beside", alt: ["junto a"],
         ex: "La farmacia está al lado del banco.", ex_l1: "The chemist's is next to the bank.",
         note: "Literally 'at the side of'. de + el = del."}
      - {id: es-17-delante-de, type: vocab, l2: "delante de", l1: "in front of", alt: ["adelante de"],
         ex: "El coche está delante de la casa.", ex_l1: "The car is in front of the house.",
         note: "Don't confuse with enfrente de, which means opposite, across from."}
      - {id: es-17-detras-de, type: vocab, l2: "detrás de", l1: "behind", alt: ["atrás de"],
         ex: "El supermercado está detrás del hotel.", ex_l1: "The supermarket is behind the hotel."}
      - {id: es-17-vivo-en-un-piso, type: phrase, l2: "Vivo en un piso pequeño.", l1: "I live in a small flat.",
         alt: ["Vivo en un apartamento pequeño", "Vivo en un departamento pequeño", "Yo vivo en un piso pequeño"],
         note: "The adjective follows the noun: un piso pequeño."}
      - {id: es-17-cuantas-habitaciones, type: phrase, l2: "¿Cuántas habitaciones hay?", l1: "How many rooms are there?",
         alt: ["¿Cuántos cuartos hay?"],
         note: "cuántas agrees with the feminine plural habitaciones; hay never changes."}
      - {id: es-17-bano-al-lado, type: phrase, l2: "El baño está al lado de la cocina.", l1: "The bathroom is next to the kitchen.",
         alt: ["El baño está junto a la cocina"],
         note: "A specific, known thing → está, not hay."}
      - {id: es-17-hay-una-cama, type: phrase, l2: "En mi dormitorio hay una cama grande.", l1: "In my bedroom there is a big bed.",
         alt: ["Hay una cama grande en mi dormitorio", "En mi habitación hay una cama grande", "En mi cuarto hay una cama grande"],
         note: "'There is' + un / una → hay."}
      - {id: es-17-c1, type: cloze, text: "En el salón ___ dos ventanas.", answer: "hay",
         l1: "There are two windows in the living room.", note: "'there is / there are' + a number → hay (never plural)"}
      - {id: es-17-c2, type: cloze, text: "El sofá ___ delante de la ventana.", answer: "está",
         l1: "The sofa is in front of the window.", note: "where a specific thing is (el sofá) → estar, singular"}
      - {id: es-17-c3, type: cloze, text: "Las llaves ___ encima de la mesa.", answer: "están",
         l1: "The keys are on top of the table.", note: "where specific things are (las llaves) → estar, plural"}
      - {id: es-17-c4, type: cloze, text: "La farmacia está al lado ___ supermercado.", answer: "del",
         l1: "The chemist's is next to the supermarket.", note: "de + el = del"}
      - {id: es-17-c5, type: cloze, text: "El perro está ___ de la mesa.", answer: "debajo",
         l1: "The dog is under the table.", note: "debajo de = under"}
      - {id: es-17-c6, type: cloze, text: "El baño está ___ de esa puerta.", answer: "detrás",
         l1: "The bathroom is behind that door.", note: "detrás de = behind"}
      - {id: es-17-c7, type: cloze, text: "El banco está ___ la farmacia y el hotel.", answer: "entre",
         l1: "The bank is between the chemist's and the hotel.", note: "entre = between; it takes no de"}

  # ---------------------------------------------------------------- 18
  - id: es-18
    title: "Body, health & clothes: doler, llevar"
    goal: "I can say what hurts and how I feel, ask for a doctor, and say what someone is wearing."
    notes: |
      **Doler** (to hurt) works exactly like **gustar**: the part that hurts is the subject, and the person is *me / te / le / nos / os / les*. Its stem changes o → ue.

      | Spanish | English |
      | Me duele la cabeza. | My head hurts. |
      | Me duelen los pies. | My feet hurt. |
      | ¿Te duele el estómago? | Does your stomach hurt? |
      | A Luis le duele la espalda. | Luis's back hurts. |

      - **duele** with one thing, **duelen** with several.
      - Use **the article**, never *mi*, with parts of the body: *Me duele **la** cabeza*, not *mi cabeza*. The pronoun already says whose it is.
      - Other health phrases use **tener**: *Tengo fiebre*, *tengo tos* (a cough), *tengo gripe* (flu).

      **Llevar** is a regular -ar verb meaning "to wear" as well as "to carry" or "to take": *Llevo una chaqueta negra.* Spanish uses the simple present where English says "is wearing".

      *La ropa* (clothes) is singular in Spanish: *La ropa es cara.* Colours follow the noun and agree with it: *unos zapatos negros*.
    items:
      - {id: es-18-cabeza, type: vocab, l2: "la cabeza", l1: "the head",
         ex: "¿Te duele la cabeza?", ex_l1: "Does your head hurt?"}
      - {id: es-18-ojo, type: vocab, l2: "el ojo", l1: "the eye",
         ex: "Mi hija tiene los ojos verdes.", ex_l1: "My daughter has green eyes.",
         note: "j is a throaty h: O-ho."}
      - {id: es-18-brazo, type: vocab, l2: "el brazo", l1: "the arm",
         ex: "Tengo un problema en el brazo.", ex_l1: "I have a problem with my arm."}
      - {id: es-18-pierna, type: vocab, l2: "la pierna", l1: "the leg",
         ex: "Tengo las piernas cansadas.", ex_l1: "My legs are tired."}
      - {id: es-18-pie, type: vocab, l2: "el pie", l1: "the foot",
         ex: "Voy al trabajo a pie.", ex_l1: "I go to work on foot.",
         note: "a pie = on foot. Plural: los pies."}
      - {id: es-18-espalda, type: vocab, l2: "la espalda", l1: "the back (part of the body)",
         ex: "A mi padre le duele la espalda.", ex_l1: "My father's back hurts."}
      - {id: es-18-doler, type: vocab, l2: "doler", l1: "to hurt / to ache",
         ex: "Me duelen los ojos.", ex_l1: "My eyes hurt.",
         note: "Works like gustar, with o → ue: me duele (one thing), me duelen (several)."}
      - {id: es-18-medico, type: vocab, l2: "el médico", l1: "the doctor", alt: ["el doctor"],
         ex: "Mañana voy al médico.", ex_l1: "Tomorrow I'm going to the doctor's.",
         note: "A woman is la médica. You address a doctor as doctor / doctora."}
      - {id: es-18-ropa, type: vocab, l2: "la ropa", l1: "clothes",
         ex: "Compro ropa nueva.", ex_l1: "I buy new clothes.",
         note: "Singular in Spanish: la ropa es cara, never 'las ropas'."}
      - {id: es-18-camisa, type: vocab, l2: "la camisa", l1: "the shirt",
         ex: "La camisa es blanca.", ex_l1: "The shirt is white.",
         note: "A T-shirt is la camiseta."}
      - {id: es-18-pantalones, type: vocab, l2: "los pantalones", l1: "the trousers / pants", alt: ["el pantalón"],
         ex: "Estos pantalones son caros.", ex_l1: "These trousers are expensive.",
         note: "Jeans are los vaqueros in Spain, los jeans in Latin America."}
      - {id: es-18-zapatos, type: vocab, l2: "los zapatos", l1: "the shoes",
         ex: "Estos zapatos son nuevos.", ex_l1: "These shoes are new.",
         note: "One shoe is el zapato. z sounds like 'th' in Spain and like 's' in Latin America."}
      - {id: es-18-chaqueta, type: vocab, l2: "la chaqueta", l1: "the jacket", alt: ["la chamarra", "la campera"],
         ex: "Tengo una chaqueta negra.", ex_l1: "I have a black jacket.",
         note: "Mexico: la chamarra. Argentina: la campera."}
      - {id: es-18-jersey, type: vocab, l2: "el jersey", l1: "the jumper / sweater", alt: ["el suéter", "el pulóver"],
         ex: "Hace frío y quiero un jersey.", ex_l1: "It's cold and I want a jumper.",
         note: "Spain: el jersey (said her-SAY). Latin America: el suéter."}
      - {id: es-18-llevar, type: vocab, l2: "llevar", l1: "to wear (also: to carry, to take with you)", alt: ["llevar puesto"],
         ex: "Hoy llevo zapatos negros.", ex_l1: "Today I'm wearing black shoes.",
         note: "Regular -ar verb. The simple present covers 'is wearing'."}
      - {id: es-18-me-duele-la-cabeza, type: phrase, l2: "Me duele la cabeza.", l1: "I have a headache.",
         alt: ["Tengo dolor de cabeza", "A mí me duele la cabeza"],
         note: "Literally 'the head hurts me': la cabeza, not mi cabeza."}
      - {id: es-18-no-me-encuentro-bien, type: phrase, l2: "No me encuentro bien.", l1: "I don't feel well.",
         alt: ["No me siento bien", "No estoy bien", "Me encuentro mal", "Me siento mal"],
         note: "encontrarse = to feel (literally 'to find oneself'). Latin America prefers No me siento bien."}
      - {id: es-18-que-te-pasa, type: phrase, l2: "¿Qué te pasa?", l1: "What's the matter (with you)? (informal)",
         alt: ["¿Qué te ocurre?", "¿Qué tienes?"],
         note: "Literally 'What is happening to you?' Formal: ¿Qué le pasa?"}
      - {id: es-18-tengo-fiebre, type: phrase, l2: "Tengo fiebre.", l1: "I have a temperature / a fever.",
         alt: ["Tengo calentura", "Yo tengo fiebre"],
         note: "No article: tengo fiebre, tengo tos (a cough), tengo gripe (flu)."}
      - {id: es-18-necesito-un-medico, type: phrase, l2: "Necesito un médico.", l1: "I need a doctor.",
         alt: ["Necesito un doctor", "Necesito una médica", "Yo necesito un médico"],
         note: "necesitar = to need, a regular -ar verb."}
      - {id: es-18-c1, type: cloze, text: "Me ___ el estómago.", answer: "duele",
         l1: "My stomach hurts.", note: "one thing hurts → duele"}
      - {id: es-18-c2, type: cloze, text: "Me ___ los pies.", answer: "duelen",
         l1: "My feet hurt.", note: "several things hurt → duelen"}
      - {id: es-18-c3, type: cloze, text: "A mi abuelo ___ duelen las piernas.", answer: "le",
         l1: "My grandfather's legs hurt.", note: "a + person … le: the pronoun is still needed"}
      - {id: es-18-c4, type: cloze, text: "Hoy Marta ___ un vestido rojo.", answer: "lleva",
         l1: "Today Marta is wearing a red dress.", note: "llevar → (ella) lleva"}
      - {id: es-18-c5, type: cloze, text: "Yo siempre ___ pantalones negros.", answer: "llevo",
         l1: "I always wear black trousers.", note: "llevar → (yo) llevo"}
      - {id: es-18-c6, type: cloze, text: "Me lavo ___ manos.", answer: "las",
         l1: "I wash my hands.", note: "body parts take the article, not a possessive: las manos (la mano is feminine)"}

  # ---------------------------------------------------------------- 19
  - id: es-19
    title: "What I love & what I'm doing: hobbies, encantar, estar + gerundio"
    goal: "I can talk about hobbies I love or don't care for, agree and disagree, and say what is happening right now."
    notes: |
      **Encantar** (to love) and **interesar** (to interest) work like *gustar*: *Me encanta el cine. Me encantan los perros. ¿Te interesa el fútbol?* Use *encanta / interesa* with one thing or a verb, *encantan / interesan* with several. *Encantar* is already strong, so never add *mucho*.

      **Agreeing and disagreeing.** With normal verbs: *Yo también* (me too), *Yo tampoco* (me neither). With gustar-type verbs the reply starts with **a mí**:

      | They say | Same for me | Not for me |
      | Me gusta el cine. | A mí también. | A mí no. |
      | No me gusta el cine. | A mí tampoco. | A mí sí. |

      **Estar + gerundio** describes what is happening **right now**. Form the gerund by replacing *-ar* with **-ando** and *-er / -ir* with **-iendo**:

      *hablar → hablando · comer → comiendo · vivir → viviendo*

      *Estoy trabajando. ¿Qué estás haciendo?* A few are irregular: *leer → leyendo*, *dormir → durmiendo*.

      Unlike English, never use it for the future: "I'm working tomorrow" is *Trabajo mañana* or *Voy a trabajar mañana*.
    items:
      - {id: es-19-encantar, type: vocab, l2: "encantar", l1: "to love (a thing or activity — works like gustar)",
         ex: "Me encanta España.", ex_l1: "I love Spain.",
         note: "Literally 'to delight'. For loving a person, Spanish uses querer: Te quiero."}
      - {id: es-19-interesar, type: vocab, l2: "interesar", l1: "to interest (works like gustar)",
         ex: "¿Te interesa el cine?", ex_l1: "Are you interested in cinema?",
         note: "Me interesa… = I'm interested in… No extra word for 'in'."}
      - {id: es-19-tambien, type: vocab, l2: "también", l1: "also / too",
         ex: "Yo también hablo inglés.", ex_l1: "I speak English too.",
         note: "Usually goes before the verb, not at the end of the sentence."}
      - {id: es-19-tampoco, type: vocab, l2: "tampoco", l1: "neither / not … either",
         ex: "Yo tampoco tengo coche.", ex_l1: "I don't have a car either.",
         note: "The negative of también. Before the verb it replaces no: Yo tampoco tengo…"}
      - {id: es-19-ahora-mismo, type: vocab, l2: "ahora mismo", l1: "right now", alt: ["en este momento"],
         ex: "Ahora mismo estoy en casa.", ex_l1: "Right now I'm at home.",
         note: "ahora = now; mismo adds 'right'."}
      - {id: es-19-musica, type: vocab, l2: "la música", l1: "music",
         ex: "Escucho música en el coche.", ex_l1: "I listen to music in the car.",
         note: "With gustar and encantar it needs the article: Me encanta la música."}
      - {id: es-19-pelicula, type: vocab, l2: "la película", l1: "the film / movie", alt: ["la peli", "el filme"],
         ex: "La película es muy buena.", ex_l1: "The film is very good.",
         note: "El cine is the cinema, as a place or an art; la película is one film."}
      - {id: es-19-deporte, type: vocab, l2: "el deporte", l1: "sport",
         ex: "Hago deporte los sábados.", ex_l1: "I do sport on Saturdays.",
         note: "hacer deporte = to do sport, to exercise."}
      - {id: es-19-futbol, type: vocab, l2: "el fútbol", l1: "football (soccer)", alt: ["el futbol"],
         ex: "Me gusta mucho el fútbol.", ex_l1: "I like football a lot.",
         note: "Mexico and Central America write and say futbol, stressed on the last syllable."}
      - {id: es-19-bailar, type: vocab, l2: "bailar", l1: "to dance",
         ex: "Bailo con mis amigos los sábados.", ex_l1: "I dance with my friends on Saturdays."}
      - {id: es-19-cantar, type: vocab, l2: "cantar", l1: "to sing",
         ex: "Mi hermana canta muy bien.", ex_l1: "My sister sings very well."}
      - {id: es-19-cocinar, type: vocab, l2: "cocinar", l1: "to cook",
         ex: "Mi padre cocina todos los días.", ex_l1: "My father cooks every day.",
         note: "From la cocina, the kitchen."}
      - {id: es-19-nadar, type: vocab, l2: "nadar", l1: "to swim",
         ex: "Nado los lunes y los jueves.", ex_l1: "I swim on Mondays and Thursdays."}
      - {id: es-19-jugar, type: vocab, l2: "jugar", l1: "to play (a sport or a game)",
         ex: "Juego al fútbol los domingos.", ex_l1: "I play football on Sundays.",
         note: "Stem change u → ue: juego, juegas, juega; but jugamos. Spain: jugar al fútbol; Latin America often jugar fútbol. For an instrument use tocar."}
      - {id: es-19-mucho, type: vocab, l2: "mucho", l1: "a lot / very much (after a verb)",
         ex: "Trabajo mucho.", ex_l1: "I work a lot.",
         note: "muy goes before adjectives (muy bueno); mucho goes after verbs (me gusta mucho)."}
      - {id: es-19-a-mi-tambien, type: phrase, l2: "A mí también.", l1: "Me too. (agreeing with 'Me gusta…')",
         alt: ["A mí también me gusta"],
         note: "Not 'yo también' after a gustar-type verb. mí takes an accent after a preposition."}
      - {id: es-19-a-mi-tampoco, type: phrase, l2: "A mí tampoco.", l1: "Me neither. (agreeing with 'No me gusta…')",
         alt: ["A mí tampoco me gusta"],
         note: "tampoco agrees with a negative; también agrees with a positive."}
      - {id: es-19-me-encanta-bailar, type: phrase, l2: "Me encanta bailar.", l1: "I love dancing.",
         alt: ["A mí me encanta bailar"],
         note: "encanta + infinitive, where English uses -ing."}
      - {id: es-19-que-estas-haciendo, type: phrase, l2: "¿Qué estás haciendo?", l1: "What are you doing (right now)? (informal)",
         alt: ["¿Qué estás haciendo ahora?", "¿Qué haces?", "¿Qué haces ahora?"],
         note: "hacer → haciendo. The simple ¿Qué haces? can mean the same."}
      - {id: es-19-estoy-trabajando, type: phrase, l2: "Estoy trabajando.", l1: "I'm working (right now).",
         alt: ["Yo estoy trabajando", "Estoy trabajando ahora"],
         note: "estar + -ando. Only for something in progress, never for future plans."}
      - {id: es-19-c1, type: cloze, text: "Me ___ la música española.", answer: "encanta",
         l1: "I love Spanish music.", note: "one thing → encanta"}
      - {id: es-19-c2, type: cloze, text: "Me ___ los perros.", answer: "encantan",
         l1: "I love dogs.", note: "several things → encantan"}
      - {id: es-19-c3, type: cloze, text: "No me ___ el fútbol.", answer: "interesa",
         l1: "Football doesn't interest me.", note: "one thing → interesa (interesan with several)"}
      - {id: es-19-c4, type: cloze, text: "Ana está ___ por teléfono.", answer: "hablando",
         l1: "Ana is talking on the phone.", note: "-ar → -ando: hablar → hablando"}
      - {id: es-19-c5, type: cloze, text: "Estamos ___ en un restaurante.", answer: "comiendo",
         l1: "We are eating in a restaurant.", note: "-er / -ir → -iendo: comer → comiendo"}
      - {id: es-19-c6, type: cloze, text: "Estoy ___ un libro muy bueno.", answer: "leyendo",
         l1: "I'm reading a very good book.", note: "irregular: leer → leyendo (i becomes y between vowels)"}

  # ---------------------------------------------------------------- 20
  - id: es-20
    title: "Travel, transport & jobs: lo, la, los, las"
    goal: "I can buy a ticket, say how I travel and what I do for a living, and understand 'it' and 'them' in simple sentences."
    notes: |
      **Transport** takes **en**: *en tren, en avión, en metro, en coche, en bicicleta*. The exception is **a pie** (on foot).

      **Jobs** take no article after *ser*: *Soy enfermero. Mi madre es abogada.* Most job words have a feminine form: *camarero / camarera*, *jefe / jefa*. To ask, say *¿A qué te dedicas?*

      **Direct-object pronouns** replace a noun you have already mentioned, so you need not repeat it. They match its gender and number:

      | Replaces | Pronoun |
      | a masculine thing (el billete) | lo |
      | a feminine thing (la maleta) | la |
      | masculine plural (los billetes) | los |
      | feminine plural (las llaves) | las |

      They look like the articles, but **lo** replaces *el*. The big difference from English is position: the pronoun goes **before** the conjugated verb.

      *¿Tienes el pasaporte? — Sí, **lo** tengo.* (Yes, I have it.)

      *¿Las llaves? No **las** tengo.* (I don't have them.)

      In the negative, *no* comes first: *no lo tengo*. For now, aim to recognise these; you already know one in *No lo sé*.
    items:
      - {id: es-20-tren, type: vocab, l2: "el tren", l1: "the train",
         ex: "El tren sale a las diez.", ex_l1: "The train leaves at ten."}
      - {id: es-20-avion, type: vocab, l2: "el avión", l1: "the plane",
         ex: "Voy a México en avión.", ex_l1: "I'm going to Mexico by plane.",
         note: "Plural without the accent: los aviones."}
      - {id: es-20-metro, type: vocab, l2: "el metro", l1: "the underground / subway", alt: ["el subte"],
         ex: "El metro de Madrid es muy bueno.", ex_l1: "The Madrid underground is very good.",
         note: "Buenos Aires calls it el subte."}
      - {id: es-20-bicicleta, type: vocab, l2: "la bicicleta", l1: "the bicycle", alt: ["la bici"],
         ex: "Voy a la universidad en bicicleta.", ex_l1: "I go to university by bike.",
         note: "Everyday short form: la bici."}
      - {id: es-20-billete, type: vocab, l2: "el billete", l1: "the ticket (for a train, bus or plane)", alt: ["el boleto", "el pasaje"],
         ex: "Compro un billete de tren.", ex_l1: "I buy a train ticket.",
         note: "Spain: el billete (also a banknote). Latin America: el boleto or el pasaje. A cinema ticket is la entrada."}
      - {id: es-20-pasaporte, type: vocab, l2: "el pasaporte", l1: "the passport",
         ex: "¿Tiene usted el pasaporte?", ex_l1: "Do you have your passport?"}
      - {id: es-20-maleta, type: vocab, l2: "la maleta", l1: "the suitcase", alt: ["la valija"],
         ex: "Mi maleta es roja.", ex_l1: "My suitcase is red.",
         note: "Argentina and Uruguay: la valija."}
      - {id: es-20-viaje, type: vocab, l2: "el viaje", l1: "the trip / journey",
         ex: "¡Buen viaje!", ex_l1: "Have a good trip!",
         note: "Masculine. The verb is viajar, to travel."}
      - {id: es-20-vacaciones, type: vocab, l2: "las vacaciones", l1: "the holidays / vacation",
         ex: "En agosto tengo vacaciones.", ex_l1: "In August I have holidays.",
         note: "Always plural in Spanish."}
      - {id: es-20-trabajo, type: vocab, l2: "el trabajo", l1: "the job / work", alt: ["el empleo"],
         ex: "Me gusta mi trabajo.", ex_l1: "I like my job.",
         note: "The noun of trabajar. Also the workplace: Voy al trabajo."}
      - {id: es-20-camarero, type: vocab, l2: "el camarero", l1: "the waiter", alt: ["el mesero", "el mozo"],
         ex: "Mi hermano es camarero.", ex_l1: "My brother is a waiter.",
         note: "Feminine: la camarera. Latin America: el mesero (Mexico), el mozo (Argentina)."}
      - {id: es-20-enfermero, type: vocab, l2: "el enfermero", l1: "the nurse (a man)",
         ex: "Mi amigo es enfermero en un hospital.", ex_l1: "My friend is a nurse in a hospital.",
         note: "Feminine: la enfermera. Related to enfermo, ill."}
      - {id: es-20-abogado, type: vocab, l2: "el abogado", l1: "the lawyer (a man)",
         ex: "Su padre es abogado.", ex_l1: "His father is a lawyer.",
         note: "Feminine: la abogada. No article after ser."}
      - {id: es-20-jefe, type: vocab, l2: "el jefe", l1: "the boss (a man)",
         ex: "Mi jefe es muy simpático.", ex_l1: "My boss is very nice.",
         note: "Feminine: la jefa."}
      - {id: es-20-oficina, type: vocab, l2: "la oficina", l1: "the office",
         ex: "Trabajo en una oficina.", ex_l1: "I work in an office."}
      - {id: es-20-a-que-te-dedicas, type: phrase, l2: "¿A qué te dedicas?", l1: "What do you do for a living? (informal)",
         alt: ["¿En qué trabajas?", "¿Cuál es tu trabajo?", "¿De qué trabajas?"],
