      - {id: es-20-ida-y-vuelta, type: phrase, l2: "Un billete de ida y vuelta, por favor.", l1: "A return ticket, please.",
         alt: ["Un boleto de ida y vuelta, por favor", "Un pasaje de ida y vuelta, por favor", "Un billete de ida y vuelta",
               "Un boleto redondo, por favor"],
         note: "ida y vuelta = going and coming back. A single is un billete de ida."}
      - {id: es-20-a-que-hora-sale, type: phrase, l2: "¿A qué hora sale el tren?", l1: "What time does the train leave?",
