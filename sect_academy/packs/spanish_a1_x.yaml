         note: "Stem change e → i: me visto, te vistes, se viste; but nos vestimos."}
      - {id: es-16-acostarse, type: vocab, l2: "acostarse", l1: "to go to bed", alt: ["irse a la cama", "ir a la cama"],
         ex: "Los niños se acuestan a las nueve.", ex_l1: "The children go to bed at nine.",
         note: "Stem change o → ue: me acuesto, te acuestas, se acuesta; but nos acostamos."}
      - {id: es-16-dormir, type: vocab, l2: "dormir", l1: "to sleep",
         ex: "¿Duermes bien?", ex_l1: "Do you sleep well?",
