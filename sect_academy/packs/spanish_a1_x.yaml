      - {id: es-16-cenar, type: vocab, l2: "cenar", l1: "to have dinner (the evening meal)",
         ex: "Cenamos a las nueve y media.", ex_l1: "We have dinner at half past nine."}
      - {id: es-16-desayuno, type: vocab, l2: "el desayuno", l1: "breakfast (the meal)",
         ex: "El desayuno es a las ocho.", ex_l1: "Breakfast is at eight."}
      - {id: es-16-cena, type: vocab, l2: "la cena", l1: "dinner (the evening meal, as a noun)",
         ex: "La cena es a las nueve.", ex_l1: "Dinner is at nine.",
         note: "The midday meal is la comida in Spain, el almuerzo in much of Latin America."}
      - {id: es-16-temprano, type: vocab, l2: "temprano", l1: "early", alt: ["pronto"],
         ex: "Me levanto temprano.", ex_l1: "I get up early.",
         note: "In Spain pronto is also common for 'early'."}
      - {id: es-16-tarde, type: vocab, l2: "tarde", l1: "late",
         ex: "Hoy vuelvo tarde a casa.", ex_l1: "Today I'm coming home late.",
