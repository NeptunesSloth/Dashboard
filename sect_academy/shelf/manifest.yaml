# The starter shelf: short public-domain stories and famous poems shipped with Sect Academy, so the
# Read tab has something to open on day one. Read-only; never copied into the user's books folder.
# See README.md for the rules every entry must meet (checked by tests/test_shelf.py).
#
# Each text is sect_academy/shelf/<lang>/<slug>.txt (UTF-8, the work only: no archive header,
# licence block or footer). Its id in the app is shelf:<lang>:<slug>.
# Fields: title, author, died (year), published (year of first publication), first_published_in,
# level (a guess, CEFR-style), source (the page the text was taken from), public_domain (why).
# The rule: the author died before 1955 and the work was first published before 1931. An entry
# outside it must argue its case in pd_exception (none of the texts needs one).

licence: >
  Every text and poem here is in the public domain. Our additions (the English lines of the poems,
  the readings, this manifest) are released under the same terms as the rest of Sect Academy.
  The texts were taken from Wikisource and Aozora Bunko transcriptions; we credit the work, its
  author and the source page, and claim nothing in the texts themselves.

texts:
