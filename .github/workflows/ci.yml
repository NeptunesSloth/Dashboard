name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/ruff-action@v3
        with:
          args: check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt coverage

      - name: Run tests with coverage
        run: |
          coverage run -m pytest -q
          coverage report -m

      # Produce a machine-readable coverage report and keep it as an artifact.
      # Report/artifact only — there is deliberately NO --fail-under gate, so a
      # coverage dip can never break this green CI. Only one matrix entry uploads
      # (3.12) to avoid three identical artifacts colliding on the same name.
      - name: Generate coverage.xml
        if: matrix.python-version == '3.12'
        run: coverage xml -o coverage.xml

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage.xml
          path: coverage.xml
          if-no-files-found: warn

  typecheck:
    runs-on: ubuntu-latest
    # NON-gating: the codebase is large and mostly untyped, so this job runs
    # mypy with lenient settings to SURFACE type issues without blocking merges.
    # Keep continue-on-error true — this is informational only.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install mypy (+ runtime deps for better inference)
        run: |
          python -m pip install --upgrade pip mypy
          pip install -r requirements.txt || true
      - name: Run mypy (lenient, report-only)
        run: |
          mypy --ignore-missing-imports maybot_control_center maybot_agent || true

  audit:
    runs-on: ubuntu-latest
    # Report-only for now: a newly-disclosed CVE in a transitive dep should
    # surface here without blocking unrelated merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt || true

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps + Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Start the dashboard
        run: |
          MAYBOT_DEMO=1 python -m uvicorn maybot_control_center.app:app --host 127.0.0.1 --port 8200 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8200/healthz >/dev/null && break; sleep 1; done
      - name: Browser smoke test
        run: python tests/smoke_browser.py

