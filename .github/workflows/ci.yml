name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt coverage

      - name: Run tests with coverage
        run: |
          coverage run -m pytest -q
          coverage report -m

  audit:
    runs-on: ubuntu-latest
    # Report-only for now: a newly-disclosed CVE in a transitive dep should
    # surface here without blocking unrelated merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt || true

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install deps + Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Start the dashboard
        run: |
          MAYBOT_DEMO=1 python -m uvicorn maybot_control_center.app:app --host 127.0.0.1 --port 8200 &
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8200/healthz >/dev/null && break; sleep 1; done
      - name: Browser smoke test
        run: python tests/smoke_browser.py

