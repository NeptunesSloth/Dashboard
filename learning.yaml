# learning.yaml — built-in learning tracks for the Learning Center.
#
# These are the read-only seed tracks. Custom tracks you create in the Learning
# Center UI are stored separately (in the DB state blob), never written back here.
# Each track: {id, title, topics: [str], labs: [str]}  (labs: ids | pentest)
#
# Security tracks also get the CURRENT THREAT LANDSCAPE injected into generated
# lessons/labs/exams (see threats.yaml + MAYBOT_THREAT_CONTEXT) so content tracks
# how the field actually looks now, not just at the model's training cutoff.
tracks:
  - id: cybersecurity
    title: Cybersecurity Fundamentals
    topics:
      - Networking & TCP/IP
      - Threat Models & Attack Surface
      - Cryptography Basics
      - Intrusion Detection (IDS/IPS)
      - Incident Response
      - Web App Security (OWASP Top 10)
      - Identity & Access Management
      - Logging, SIEM & Detection Engineering
    labs: [ids, pentest]

  - id: offensive-security
    title: Offensive Security / Red Team
    topics:
      - Reconnaissance & OSINT
      - Network Enumeration & Service Discovery
      - Web Exploitation (OWASP Top 10 in depth)
      - Password Attacks & Credential Access
      - Active Directory Attacks (Kerberoasting, AS-REP, NTLM relay, ADCS)
      - Linux & Windows Privilege Escalation
      - Lateral Movement & Pivoting
      - Persistence & Defense Evasion (EDR-aware)
      - Command & Control
      - Reporting & Risk Communication
    labs: [pentest]

  - id: cloud-security
    title: Cloud & Container Security
    topics:
      - Cloud Shared-Responsibility & IAM (AWS/Azure/GCP)
      - Identity Federation, OAuth & Token Theft
      - Storage, Secrets & Key Management
      - Metadata Service & SSRF-to-Cloud
      - Containers & Kubernetes Hardening
      - CI/CD and Supply-Chain Security
      - Cloud Logging, Guardrails & Detection
    labs: [pentest, ids]

  - id: blue-team
    title: Blue Team / SOC & Detection
    topics:
      - Security Operations & the Analyst Workflow
      - Log Sources, Normalization & SIEM
      - Detection Engineering & MITRE ATT&CK Mapping
      - Threat Hunting
      - Endpoint Detection & Response (EDR)
      - Digital Forensics & Incident Response (DFIR)
      - Threat Intelligence
    labs: [ids]

  - id: cert-prep
    title: Cert Prep — CompTIA Security+
    topics:
      - Threats, Attacks & Vulnerabilities
      - Architecture & Design
      - Implementation
      - Operations & Incident Response
      - Governance, Risk & Compliance
      - Acronym Drills
    labs: [ids]

  - id: french
    title: French
    language: French          # marks this a language track: immersive tutor + drills
    topics:
      # High-frequency first (the ~1000 most common words cover most speech),
      # roughly A1 -> A2 in CEFR order so each builds on the last.
      - Greetings & Introductions
      - High-Frequency Words (top 100)
      - The Present Tense (être, avoir, -er verbs)
      - Everyday Vocabulary & Cognates
      - Numbers, Dates & Time
      - Asking Questions & Negation
      - The Near Future & Past (futur proche, passé composé)
      - Listening Comprehension
      - Holding a Conversation
    labs: []
