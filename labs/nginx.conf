# labs/nginx.conf — reverse proxy in front of the vulnerable lab targets.
# Its only job is to capture all attack traffic in access.log (mounted to
# ./labs/logs) so a maybot_agent can read it READ-ONLY into the Real Log Lab.

log_format lab '$remote_addr - $remote_user [$time_local] '
               '"$request" $status $body_bytes_sent '
               '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log lab;
    error_log  /var/log/nginx/error.log warn;

    # Proxy /juice/* to Juice Shop, everything else to DVWA.
    location /juice/ {
        proxy_pass http://juice-shop:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://dvwa:80/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
