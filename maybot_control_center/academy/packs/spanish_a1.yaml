      - {id: es-04-abuela, type: vocab, l2: "la abuela", l1: "the grandmother",
         ex: "Mi abuela tiene un gato.", ex_l1: "My grandmother has a cat."}
      - {id: es-04-marido, type: vocab, l2: "el marido", l1: "the husband", alt: ["el esposo"],
