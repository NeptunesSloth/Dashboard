      - {id: es-04-hija, type: vocab, l2: "la hija", l1: "the daughter",
         ex: "Tienen una hija.", ex_l1: "They have a daughter."}
      - {id: es-04-abuelo, type: vocab, l2: "el abuelo", l1: "the grandfather",
