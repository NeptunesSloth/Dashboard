      - {id: es-04-cuantos-anos-tienes, type: phrase, l2: "¿Cuántos años tienes?", l1: "How old are you? (informal)",
         alt: ["¿Cuántos años tienes tú?", "¿Qué edad tienes?"],
         note: "Literally 'How many years do you have?' Formal: ¿Cuántos años tiene usted?"}
