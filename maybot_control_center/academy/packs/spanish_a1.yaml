         note: "No word for 'any' is needed."}
      - {id: es-04-c1, type: cloze, text: "Yo ___ un hermano y una hermana.", answer: "tengo",
         l1: "I have a brother and a sister.", note: "tener → yo tengo"}
      - {id: es-04-c2, type: cloze, text: "¿___ hijos, Marta?", answer: "Tienes",
         l1: "Do you have children, Marta?", note: "tener → tú tienes (e → ie)"}
      - {id: es-04-c3, type: cloze, text: "Mi abuela ___ ochenta años.", answer: "tiene",
         l1: "My grandmother is eighty years old.", note: "age uses tener → ella tiene"}
      - {id: es-04-c4, type: cloze, text: "Nosotros ___ una casa en Sevilla.", answer: "tenemos",
