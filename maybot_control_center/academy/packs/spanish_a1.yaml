         alt: ["Yo tengo treinta años", "Tengo 30 años", "Yo tengo 30 años"],
         note: "Age uses tener, never ser, and you must say años."}
      - {id: es-04-tengo-hambre, type: phrase, l2: "Tengo hambre.", l1: "I'm hungry.",
         alt: ["Yo tengo hambre"],
         note: "Literally 'I have hunger'."}
      - {id: es-04-tengo-sed, type: phrase, l2: "Tengo sed.", l1: "I'm thirsty.",
