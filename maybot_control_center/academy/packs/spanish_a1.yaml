id: spanish-a1
title: "Spanish — A1 Foundations"
kind: language
language: Spanish
lang: es-ES
hall: tongues_south
blurb: "From ¡hola! to ordering, asking the way and making plans: the present tense, ser/estar, gustar and 300 core words and phrases."

units:
  # ---------------------------------------------------------------- 1
  - id: es-01
    title: "Greetings & politeness"
    goal: "I can greet people, say goodbye, be polite, and ask and give a name."
    notes: |
      Spanish is spelled the way it sounds. There are five pure vowels — **a, e, i, o, u** — and each always sounds the same.

      A few letters behave differently from English:

      - **h** is always silent: *hola* sounds like "ola".
      - **j** is a strong, throaty h: *José*.
      - **ll** sounds like English y in most accents: *me llamo*.
      - **ñ** sounds like "ny" in *canyon*: *mañana*, *señor*.

      Questions and exclamations open with an upside-down mark and close with a normal one: **¿Cómo estás?** **¡Hola!**

      Spanish has two words for a single "you". Use **tú** with friends, family and people your own age; use **usted** with strangers, older people and in formal situations. The verb changes too: *¿Cómo estás?* (tú) but *¿Cómo está usted?*

      *Buenos días* is used until lunch, *buenas tardes* until dark, and *buenas noches* after that.
    items:
      - {id: es-01-hola, type: vocab, l2: "hola", l1: "hello / hi",
         ex: "¡Hola, María!", ex_l1: "Hi, María!",
         note: "The h is silent. Exclamations start with ¡ and end with !."}
      - {id: es-01-buenos-dias, type: vocab, l2: "buenos días", l1: "good morning",
         ex: "Buenos días, señora López.", ex_l1: "Good morning, Mrs López.",
         note: "Used until lunchtime. 'Día' is masculine, so buenos."}
      - {id: es-01-buenas-tardes, type: vocab, l2: "buenas tardes", l1: "good afternoon",
         ex: "Buenas tardes, señor.", ex_l1: "Good afternoon, sir.",
         note: "From lunchtime until dark. 'Tarde' is feminine, so buenas."}
      - {id: es-01-buenas-noches, type: vocab, l2: "buenas noches", l1: "good evening / good night",
         ex: "Buenas noches, hasta mañana.", ex_l1: "Good night, see you tomorrow.",
         note: "Both a greeting after dark and a goodbye at bedtime."}
      - {id: es-01-adios, type: vocab, l2: "adiós", l1: "goodbye", alt: ["chao", "chau"],
         ex: "Adiós, Pedro.", ex_l1: "Goodbye, Pedro."}
      - {id: es-01-hasta-luego, type: vocab, l2: "hasta luego", l1: "see you later", alt: ["nos vemos"],
         ex: "Hasta luego, Ana.", ex_l1: "See you later, Ana.",
         note: "Very common everyday goodbye in Spain, even between strangers."}
      - {id: es-01-por-favor, type: vocab, l2: "por favor", l1: "please",
         ex: "Un café, por favor.", ex_l1: "A coffee, please."}
      - {id: es-01-gracias, type: vocab, l2: "gracias", l1: "thank you / thanks", alt: ["muchas gracias"],
         ex: "Muchas gracias, señora.", ex_l1: "Thank you very much, madam."}
      - {id: es-01-de-nada, type: vocab, l2: "de nada", l1: "you're welcome", alt: ["no hay de qué"],
         ex: "—Gracias. —De nada.", ex_l1: "“Thanks.” “You're welcome.”",
         note: "Literally 'of nothing'."}
      - {id: es-01-perdon, type: vocab, l2: "perdón", l1: "excuse me / pardon (to get attention or after a small mistake)",
         alt: ["perdone", "perdona", "disculpe", "disculpa"],
         ex: "Perdón, ¿habla usted inglés?", ex_l1: "Excuse me, do you speak English?"}
      - {id: es-01-lo-siento, type: vocab, l2: "lo siento", l1: "I'm sorry (a real apology or sympathy)",
         ex: "Lo siento, no entiendo.", ex_l1: "I'm sorry, I don't understand."}
      - {id: es-01-senor, type: vocab, l2: "el señor", l1: "the gentleman / Mr / sir", alt: ["señor"],
         ex: "Buenos días, señor García.", ex_l1: "Good morning, Mr García.",
         note: "ñ = 'ny'. Speaking TO him: señor García. Speaking ABOUT him: el señor García."}
      - {id: es-01-senora, type: vocab, l2: "la señora", l1: "the lady / Mrs / madam", alt: ["señora"],
         ex: "Gracias, señora.", ex_l1: "Thank you, madam."}
      - {id: es-01-que-tal, type: vocab, l2: "¿qué tal?", l1: "how's it going? (informal, two words)",
         alt: ["¿cómo estás?", "¿qué tal estás?"],
         ex: "Hola, Luis, ¿qué tal?", ex_l1: "Hi, Luis, how's it going?"}
      - {id: es-01-me-llamo, type: vocab, l2: "me llamo", l1: "my name is… (literally 'I call myself')",
         alt: ["yo me llamo", "mi nombre es"],
         ex: "Me llamo Ana.", ex_l1: "My name is Ana.",
         note: "ll sounds like English y in most accents."}
      - {id: es-01-como-estas, type: phrase, l2: "¿Cómo estás?", l1: "How are you? (informal, to one person)",
         alt: ["¿Cómo estás tú?", "¿Qué tal?", "¿Qué tal estás?"],
         note: "Questions open with ¿. Use with people you call tú."}
      - {id: es-01-como-esta-usted, type: phrase, l2: "¿Cómo está usted?", l1: "How are you? (formal, to one person)",
         alt: ["¿Cómo está?"],
         note: "Usted takes the same verb form as he/she: está, not estás."}
      - {id: es-01-como-te-llamas, type: phrase, l2: "¿Cómo te llamas?", l1: "What's your name? (informal)",
         alt: ["¿Cómo te llamas tú?", "¿Cuál es tu nombre?"],
         note: "Literally 'How do you call yourself?'"}
      - {id: es-01-mucho-gusto, type: phrase, l2: "Mucho gusto.", l1: "Pleased to meet you.",
         alt: ["Encantado", "Encantada", "Un placer"],
         note: "Also: encantado (said by a man) / encantada (said by a woman)."}
      - {id: es-01-no-entiendo, type: phrase, l2: "No entiendo.", l1: "I don't understand.",
         alt: ["No comprendo", "Yo no entiendo", "No lo entiendo"]}
      - {id: es-01-hablas-ingles, type: phrase, l2: "¿Hablas inglés?", l1: "Do you speak English? (informal)",
         alt: ["¿Tú hablas inglés?", "¿Hablas tú inglés?"],
         note: "Formal: ¿Habla usted inglés? Languages are not capitalised."}
      - {id: es-01-c1, type: cloze, text: "Buenos ___, señor García.", answer: "días",
         l1: "Good morning, Mr García.", note: "buenos días (masculine) but buenas tardes / buenas noches (feminine)"}
      - {id: es-01-c2, type: cloze, text: "Hola, me ___ Carlos.", answer: "llamo",
         l1: "Hi, my name is Carlos.", note: "llamarse → (yo) me llamo"}
      - {id: es-01-c3, type: cloze, text: "Y tú, ¿cómo te ___?", answer: "llamas",
         l1: "And you, what's your name?", note: "llamarse → (tú) te llamas"}
      - {id: es-01-c4, type: cloze, text: "Señora Ruiz, ¿cómo ___ usted?", answer: "está",
         l1: "Mrs Ruiz, how are you?", note: "usted → está (tú → estás)"}
      - {id: es-01-c5, type: cloze, text: "Adiós, hasta ___.", answer: "luego",
         l1: "Goodbye, see you later.", note: "hasta luego = until later"}

  # ---------------------------------------------------------------- 2
  - id: es-02
    title: "Who I am: ser & subject pronouns"
    goal: "I can say who I am, where I am from and what I do, and ask others the same."
    notes: |
      **Ser** is the "to be" of identity: who you are, where you are from, your nationality and your job. It is irregular, so learn it by heart.

      | Pronoun | ser |
      | yo | soy |
      | tú | eres |
      | él / ella / usted | es |
      | nosotros / nosotras | somos |
      | vosotros / vosotras | sois |
      | ellos / ellas / ustedes | son |

      - Spanish usually **drops the pronoun** because the verb ending already shows who is speaking: *Soy Ana*. Add it only for emphasis or contrast: *Yo soy inglés, ella es española*.
      - **Usted** and **ustedes** use the he/she/they forms.
      - **Vosotros** is the informal plural "you" in Spain. Latin America uses **ustedes** for every plural "you".
      - No article with jobs: *Soy estudiante* (not *soy un estudiante*).
      - Nationalities and languages take a small letter and agree with the person: *español / española*, *inglés / inglesa*.
    items:
      - {id: es-02-yo, type: vocab, l2: "yo", l1: "I",
         ex: "Yo soy Marta.", ex_l1: "I am Marta.",
         note: "Not capitalised in mid-sentence, and usually left out: Soy Marta."}
      - {id: es-02-tu, type: vocab, l2: "tú", l1: "you (informal, singular)",
         ex: "¿Y tú?", ex_l1: "And you?",
         note: "With an accent tú = you; without, tu = your."}
      - {id: es-02-el, type: vocab, l2: "él", l1: "he",
         ex: "Él es mi profesor.", ex_l1: "He is my teacher.",
         note: "With an accent él = he; without, el = the."}
      - {id: es-02-ella, type: vocab, l2: "ella", l1: "she",
         ex: "Ella es de Chile.", ex_l1: "She is from Chile.",
         note: "ll sounds like y."}
      - {id: es-02-usted, type: vocab, l2: "usted", l1: "you (formal, singular)", alt: ["Ud.", "Vd."],
         ex: "¿Usted es el señor Gil?", ex_l1: "Are you Mr Gil?",
         note: "Takes the he/she verb form. Often written Ud."}
      - {id: es-02-nosotros, type: vocab, l2: "nosotros", l1: "we (masculine or mixed group)", alt: ["nosotras"],
         ex: "Nosotros somos amigos.", ex_l1: "We are friends.",
         note: "An all-female group says nosotras."}
      - {id: es-02-vosotros, type: vocab, l2: "vosotros", l1: "you (informal, plural — used in Spain)", alt: ["vosotras", "ustedes"],
         ex: "¿Vosotros sois de aquí?", ex_l1: "Are you (all) from here?",
         note: "Spain only. Latin America uses ustedes instead. Feminine: vosotras."}
      - {id: es-02-ellos, type: vocab, l2: "ellos", l1: "they (masculine or mixed group)",
         ex: "Ellos son de Cuba.", ex_l1: "They are from Cuba.",
         note: "An all-female group is ellas."}
      - {id: es-02-ustedes, type: vocab, l2: "ustedes", l1: "you (formal, plural; in Latin America every plural 'you')", alt: ["Uds.", "Vds."],
         ex: "¿Ustedes son ingleses?", ex_l1: "Are you (all) English?",
         note: "Takes the 'they' verb form: ustedes son."}
      - {id: es-02-ser, type: vocab, l2: "ser", l1: "to be (identity, origin, profession — what something is)",
         ex: "Soy Ana y soy de Bilbao.", ex_l1: "I'm Ana and I'm from Bilbao.",
         note: "Spanish has two verbs 'to be'. Ser says WHAT someone is; estar (unit 7) says WHERE or HOW."}
      - {id: es-02-estudiante, type: vocab, l2: "el estudiante", l1: "the student (male)",
         ex: "El estudiante es de Italia.", ex_l1: "The student is from Italy.",
         note: "Same word for a woman, only the article changes: la estudiante."}
      - {id: es-02-profesor, type: vocab, l2: "el profesor", l1: "the teacher (male)", alt: ["el maestro"],
         ex: "El profesor es español.", ex_l1: "The teacher is Spanish.",
         note: "Female: la profesora."}
      - {id: es-02-amigo, type: vocab, l2: "el amigo", l1: "the friend (male)",
         ex: "Luis es un amigo de Ana.", ex_l1: "Luis is a friend of Ana's.",
         note: "Female: la amiga. A mixed group: los amigos."}
      - {id: es-02-espanol, type: vocab, l2: "español", l1: "Spanish (masculine singular; also the language)", alt: ["española", "castellano"],
         ex: "Mi profesor es español.", ex_l1: "My teacher is Spanish.",
         note: "No capital letter. Feminine: española. Plural: españoles, españolas."}
      - {id: es-02-ingles, type: vocab, l2: "inglés", l1: "English (masculine singular; also the language)", alt: ["inglesa"],
         ex: "Mi amigo es inglés.", ex_l1: "My friend is English.",
         note: "The accent disappears in inglesa, ingleses, inglesas."}
      - {id: es-02-soy-de-inglaterra, type: phrase, l2: "Soy de Inglaterra.", l1: "I am from England.",
         alt: ["Yo soy de Inglaterra"],
         note: "ser + de = origin. Countries are capitalised; nationalities are not."}
      - {id: es-02-de-donde-eres, type: phrase, l2: "¿De dónde eres?", l1: "Where are you from? (informal)",
         alt: ["¿De dónde eres tú?", "¿Tú de dónde eres?"],
         note: "Formal: ¿De dónde es usted? The preposition 'de' comes first."}
      - {id: es-02-soy-estudiante, type: phrase, l2: "Soy estudiante.", l1: "I am a student.",
         alt: ["Yo soy estudiante"],
         note: "No un/una before a job or occupation."}
      - {id: es-02-ella-es-mi-amiga, type: phrase, l2: "Ella es mi amiga.", l1: "She is my friend.",
         alt: ["Es mi amiga"]}
      - {id: es-02-somos-amigos, type: phrase, l2: "Somos amigos.", l1: "We are friends.",
         alt: ["Nosotros somos amigos", "Somos amigas", "Nosotras somos amigas"]}
      - {id: es-02-c1, type: cloze, text: "Yo ___ de Madrid.", answer: "soy",
         l1: "I am from Madrid.", note: "ser → yo soy"}
      - {id: es-02-c2, type: cloze, text: "¿Tú ___ español?", answer: "eres",
         l1: "Are you Spanish? (informal)", note: "ser → tú eres"}
      - {id: es-02-c3, type: cloze, text: "Ella ___ profesora.", answer: "es",
         l1: "She is a teacher.", note: "ser → él / ella / usted es; no article before a job"}
      - {id: es-02-c4, type: cloze, text: "Nosotros ___ estudiantes.", answer: "somos",
         l1: "We are students.", note: "ser → nosotros somos"}
      - {id: es-02-c5, type: cloze, text: "¿Vosotros ___ de México?", answer: "sois",
         l1: "Are you (plural, informal) from Mexico?", note: "ser → vosotros sois (Latin America: ustedes son)"}
      - {id: es-02-c6, type: cloze, text: "Ellos ___ ingleses.", answer: "son",
         l1: "They are English.", note: "ser → ellos / ellas / ustedes son"}

  # ---------------------------------------------------------------- 3
  - id: es-03
    title: "Things: articles, gender & plurals"
    goal: "I can name everyday objects and people with the right article, and ask what something is."
    notes: |
      Every Spanish noun is **masculine** or **feminine**, and the article shows which. Always learn a noun together with its article.

      | | the (sing.) | the (plural) | a / an |
      | masculine | el | los | un |
      | feminine | la | las | una |

      **Guessing the gender**

      - Nouns ending in **-o** are usually masculine: *el libro*.
      - Nouns ending in **-a**, **-ción** or **-dad** are usually feminine: *la mesa*, *la estación*, *la ciudad*.
      - Common exceptions: **el día**, **el problema** (masculine) and **la mano** (feminine).
      - **el agua** is feminine but takes *el* because it begins with a stressed a: *el agua fría*.

      **Plurals**

      - After a vowel add **-s**: *libro → libros*.
      - After a consonant add **-es**: *ciudad → ciudades*.

      Where Spain and Latin America use different words, this course teaches the Spain word and also accepts the Latin American one (*el coche / el carro*).
    items:
      - {id: es-03-libro, type: vocab, l2: "el libro", l1: "the book",
         ex: "El libro es de María.", ex_l1: "The book is María's."}
      - {id: es-03-mesa, type: vocab, l2: "la mesa", l1: "the table",
         ex: "El libro está en la mesa.", ex_l1: "The book is on the table."}
      - {id: es-03-silla, type: vocab, l2: "la silla", l1: "the chair",
         ex: "La silla es pequeña.", ex_l1: "The chair is small.",
         note: "ll sounds like y."}
      - {id: es-03-casa, type: vocab, l2: "la casa", l1: "the house",
         ex: "Es la casa de mi amigo.", ex_l1: "It is my friend's house.",
         note: "Spanish has no 's: say 'the house of my friend'."}
      - {id: es-03-coche, type: vocab, l2: "el coche", l1: "the car", alt: ["el carro", "el auto", "el automóvil"],
         ex: "El coche es de mi amiga.", ex_l1: "The car is my friend's.",
         note: "Spain: el coche. Latin America: el carro or el auto."}
      - {id: es-03-movil, type: vocab, l2: "el móvil", l1: "the mobile phone / cell phone",
         alt: ["el celular", "el teléfono móvil", "el teléfono celular", "el teléfono"],
         ex: "¿Es tu móvil?", ex_l1: "Is it your mobile?",
         note: "Spain: el móvil. Latin America: el celular."}
      - {id: es-03-ordenador, type: vocab, l2: "el ordenador", l1: "the computer", alt: ["la computadora", "el computador"],
         ex: "El ordenador es de la profesora.", ex_l1: "The computer is the teacher's.",
         note: "Spain: el ordenador. Latin America: la computadora."}
      - {id: es-03-agua, type: vocab, l2: "el agua", l1: "the water", alt: ["agua"],
         ex: "El agua está fría.", ex_l1: "The water is cold.",
         note: "Feminine! It takes el only because it starts with a stressed a: el agua fría, las aguas."}
      - {id: es-03-mano, type: vocab, l2: "la mano", l1: "the hand",
         ex: "Es la mano de un niño.", ex_l1: "It is a child's hand.",
         note: "Exception: ends in -o but is feminine."}
      - {id: es-03-dia, type: vocab, l2: "el día", l1: "the day",
         ex: "Es un día bonito.", ex_l1: "It is a nice day.",
         note: "Exception: ends in -a but is masculine. Hence buenos días."}
      - {id: es-03-problema, type: vocab, l2: "el problema", l1: "the problem",
         ex: "No es un problema.", ex_l1: "It is not a problem.",
         note: "Exception: many nouns in -ma are masculine (el problema, el sistema, el tema)."}
      - {id: es-03-ciudad, type: vocab, l2: "la ciudad", l1: "the city",
         ex: "Madrid es una ciudad grande.", ex_l1: "Madrid is a big city.",
         note: "Nouns ending in -dad are feminine. Plural: las ciudades."}
      - {id: es-03-hombre, type: vocab, l2: "el hombre", l1: "the man",
         ex: "El hombre es profesor.", ex_l1: "The man is a teacher.",
         note: "Silent h."}
      - {id: es-03-mujer, type: vocab, l2: "la mujer", l1: "the woman",
         ex: "La mujer es de Colombia.", ex_l1: "The woman is from Colombia.",
         note: "j is a strong throaty h. Plural: las mujeres."}
      - {id: es-03-llave, type: vocab, l2: "la llave", l1: "the key",
         ex: "Es la llave de la casa.", ex_l1: "It is the key to the house."}
      - {id: es-03-que-es-esto, type: phrase, l2: "¿Qué es esto?", l1: "What is this?",
         note: "esto = 'this' for something you cannot name yet."}
      - {id: es-03-como-se-dice, type: phrase, l2: "¿Cómo se dice en español?", l1: "How do you say it in Spanish?",
         alt: ["¿Cómo se dice esto en español?", "¿Cómo se dice eso en español?"]}
      - {id: es-03-que-significa, type: phrase, l2: "¿Qué significa?", l1: "What does it mean?",
         alt: ["¿Qué significa esto?", "¿Qué significa eso?", "¿Qué quiere decir?"]}
      - {id: es-03-no-lo-se, type: phrase, l2: "No lo sé.", l1: "I don't know.",
         alt: ["No sé", "Yo no lo sé", "Yo no sé"]}
      - {id: es-03-c1, type: cloze, text: "___ casa es grande.", answer: "La",
         l1: "The house is big.", note: "casa is feminine singular → la"}
      - {id: es-03-c2, type: cloze, text: "___ libros son de Ana.", answer: "Los",
         l1: "The books are Ana's.", note: "libros is masculine plural → los"}
      - {id: es-03-c3, type: cloze, text: "Es ___ problema.", answer: "un",
         l1: "It is a problem.", note: "problema is masculine despite the -a → un"}
      - {id: es-03-c4, type: cloze, text: "Sevilla es ___ ciudad bonita.", answer: "una",
         l1: "Seville is a pretty city.", note: "nouns in -dad are feminine → una"}
      - {id: es-03-c5, type: cloze, text: "___ mesas son pequeñas.", answer: "Las",
         l1: "The tables are small.", note: "mesas is feminine plural → las"}
      - {id: es-03-c6, type: cloze, text: "___ agua está fría.", answer: "El",
         l1: "The water is cold.", note: "feminine noun starting with stressed a- takes el (but the adjective stays feminine: fría)"}
      - {id: es-03-c7, type: cloze, text: "Madrid y Barcelona son ___ grandes.", answer: "ciudades",
         l1: "Madrid and Barcelona are big cities.", note: "plural after a consonant: add -es (ciudad → ciudades)"}

  # ---------------------------------------------------------------- 4
  - id: es-04
    title: "Family, age & tener"
    goal: "I can talk about my family, say how old people are and say what I have."
    notes: |
      **Tener** (to have) is irregular: the *yo* form adds a g, and the stem changes e → ie in some forms.

      | Pronoun | tener |
      | yo | tengo |
      | tú | tienes |
      | él / ella / usted | tiene |
      | nosotros | tenemos |
      | vosotros | tenéis |
      | ellos / ellas / ustedes | tienen |

      Spanish **has** an age and **has** hunger, where English "is":

      - *Tengo treinta años.* — I am thirty.
      - *Tengo hambre / sed.* — I am hungry / thirsty.

      **Possessives** agree with the thing owned, not the owner:

      - **mi / mis** — my
      - **tu / tus** — your (tú)
      - **su / sus** — his, her, their, and your (usted, ustedes)

      *Mi hermano*, but *mis hermanos*.

      The masculine plural covers a mixed group: *los padres* = parents, *los hermanos* = brothers and sisters, *los hijos* = children.
    items:
      - {id: es-04-tener, type: vocab, l2: "tener", l1: "to have (to own; also used for age)",
         ex: "Tengo una casa pequeña.", ex_l1: "I have a small house.",
         note: "Irregular: tengo, tienes, tiene, tenemos, tenéis, tienen."}
      - {id: es-04-familia, type: vocab, l2: "la familia", l1: "the family",
         ex: "Mi familia es de Perú.", ex_l1: "My family is from Peru.",
         note: "Singular in Spanish: la familia es (not son)."}
      - {id: es-04-padre, type: vocab, l2: "el padre", l1: "the father", alt: ["el papá"],
         ex: "Mi padre es profesor.", ex_l1: "My father is a teacher."}
      - {id: es-04-madre, type: vocab, l2: "la madre", l1: "the mother", alt: ["la mamá"],
         ex: "Mi madre es de Sevilla.", ex_l1: "My mother is from Seville."}
      - {id: es-04-padres, type: vocab, l2: "los padres", l1: "the parents", alt: ["los papás"],
         ex: "Mis padres son españoles.", ex_l1: "My parents are Spanish.",
         note: "False friend: los parientes means relatives, not parents."}
      - {id: es-04-hermano, type: vocab, l2: "el hermano", l1: "the brother",
         ex: "Tengo un hermano.", ex_l1: "I have one brother.",
