<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aegis — Realm Map</title>
  <meta name="theme-color" content="#05060c">
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/command.css">
</head>
<body>
  <canvas id="scene-canvas" class="scene-canvas"></canvas>
  <div class="vignette"></div>

  <div class="scene-app">
    <nav class="rail glass" id="rail"></nav>
    <div class="scene-stage">
      <div class="scene-top rise">
        <div class="brand"><span class="mark">◆</span> Realm Map</div>
        <div class="jarvis" id="scene-sub">Your empire across the heavens.</div>
        <div class="legend" id="legend"></div>
      </div>
      <aside class="map-panel glass rise d2" id="detail">
        <div class="panel-title">Select a realm</div>
        <div class="muted" style="margin-top:10px; font-size:13px">Click a world to inspect it. Drag to orbit, scroll to zoom.</div>
      </aside>
    </div>
  </div>

  <script type="module" src="/map.js"></script>
</body>
</html>
