<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aegis — Sect Members</title>
  <meta name="theme-color" content="#05060c">
  <link rel="icon" href="/icon.svg">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/command.css">
  <script src="/pwa.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#stage">Skip to content</a>
  <canvas id="scene-canvas" class="scene-canvas" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <div class="chamber-app">
    <nav class="rail glass" id="rail" aria-label="Primary"></nav>
    <div class="chamber-stage" id="stage" role="main" aria-label="Sect members">
      <div class="scene-top rise">
        <div class="brand"><span class="mark">🧠</span> Sect Members</div>
        <div class="jarvis" id="roster-sub">Loading the sect roster…</div>
        <div id="scene-actions"></div>
      </div>
      <div id="member-modal" class="acct-modal" hidden></div>
      <div class="pyramid" id="pyramid"></div>
    </div>
  </div>

  <!-- cinematic inspection view -->
  <div class="inspect" id="inspect" hidden>
    <div class="inspect-scrim" id="inspect-scrim"></div>
    <aside class="inspect-panel glass" id="inspect-panel"></aside>
  </div>

  <script type="module" src="/chamber.js"></script>
</body>
</html>
