<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aegis — Sect Members</title>
  <meta name="theme-color" content="#05060c">
  <link rel="icon" href="/icon.svg">
  <link rel="stylesheet" href="/command.css">
</head>
<body>
  <canvas id="scene-canvas" class="scene-canvas"></canvas>
  <div class="vignette"></div>

  <div class="chamber-app">
    <nav class="rail glass" id="rail"></nav>
    <div class="chamber-stage" id="stage">
      <div class="scene-top rise">
        <div class="brand"><span class="mark">🧠</span> Sect Members</div>
        <div class="jarvis" id="roster-sub">Loading the sect roster…</div>
      </div>
      <div class="pyramid" id="pyramid"></div>
    </div>
  </div>

  <!-- cinematic inspection view -->
  <div class="inspect" id="inspect" hidden>
    <div class="inspect-scrim" id="inspect-scrim"></div>
    <aside class="inspect-panel glass" id="inspect-panel"></aside>
  </div>

  <script type="module" src="/chamber.js"></script>
</body>
</html>
