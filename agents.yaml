# Live sect roster for the MayBot dashboard.
#
# This starts EMPTY — add your own sect members once you've set up an AI backend.
# See agents.yaml.example for a full, annotated set of examples to copy from.
#
# Each member needs an AI backend:
#   provider: ollama              -> base_url like http://127.0.0.1:11434
#   provider: openai_compatible   -> LM Studio / llama.cpp / vLLM (base_url to that server)
#   provider: claude              -> needs ANTHROPIC_API_KEY in the env; no base_url
#
# The dashboard reads this file (MAYBOT_AGENTS_FILE, default "agents.yaml") to
# populate the Sect Members roster, the Sect, and the Sect Map.
# Keep API keys in the environment, never in this file.

agents: []
