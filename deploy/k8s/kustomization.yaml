# Apply the control center stack with:  kubectl apply -k deploy/k8s
#
# The agent DaemonSet is intentionally NOT listed here — agents normally run on
# bot hosts, not in-cluster (see agent-daemonset.yaml / deploy/README.md). Apply
# it on its own if your bots run as workloads in this cluster:
#     kubectl apply -f deploy/k8s/agent-daemonset.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

commonLabels:
  app.kubernetes.io/part-of: maybot

resources:
  - configmap.yaml
  - secret.yaml
  - pvc.yaml
  - control-center-deployment.yaml
  - control-center-service.yaml
  - ingress.yaml
