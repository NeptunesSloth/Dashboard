# Secret TEMPLATE — fill in your real values before applying, or (better) create
# the Secret out-of-band so secrets never live in git:
#
#   kubectl create secret generic maybot-secrets \
#     --from-literal=MAYBOT_CONTROL_CENTER_TOKEN="$(python3 -c 'import secrets;print(secrets.token_hex(32))')" \
#     --from-literal=MAYBOT_API_TOKEN="$(python3 -c 'import secrets;print(secrets.token_hex(32))')" \
#     --from-literal=MAYBOT_REGISTER_TOKEN="$(python3 -c 'import secrets;print(secrets.token_hex(16))')" \
#     --from-literal=ANTHROPIC_API_KEY="sk-ant-..."
#
# stringData lets you paste plain text; Kubernetes base64-encodes it for you.
apiVersion: v1
kind: Secret
metadata:
  name: maybot-secrets
  labels:
    app.kubernetes.io/name: maybot
    app.kubernetes.io/component: control-center
type: Opaque
stringData:
  # --- security: protect these before exposing on any network ---
  MAYBOT_CONTROL_CENTER_TOKEN: ""
  # Shared secret between the control center and each agent. MUST match each
  # agent host's MAYBOT_API_TOKEN and the api_token in devices.yaml.
  MAYBOT_API_TOKEN: "change-me"
  MAYBOT_REGISTER_TOKEN: ""
  # --- LLM backends ---
  ANTHROPIC_API_KEY: ""
  OPENAI_API_KEY: ""
  # --- GitHub (real PR creation) ---
  GH_TOKEN: ""
  # --- notification channels (inert until set) ---
  MAYBOT_SLACK_WEBHOOK: ""
  MAYBOT_DISCORD_WEBHOOK: ""
  MAYBOT_WEBHOOK_URL: ""
  MAYBOT_SMTP_HOST: ""
  MAYBOT_SMTP_FROM: ""
  MAYBOT_SMTP_TO: ""
  MAYBOT_SMTP_PORT: "587"
  MAYBOT_SMTP_USER: ""
  MAYBOT_SMTP_PASSWORD: ""
  MAYBOT_TELEGRAM_TOKEN: ""
  MAYBOT_TELEGRAM_CHAT_ID: ""
  MAYBOT_PAGERDUTY_ROUTING_KEY: ""
  MAYBOT_OPSGENIE_API_KEY: ""
