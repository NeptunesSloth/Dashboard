# Sect Academy in a container. Progress is kept in the "academy-data" volume.
services:
  academy:
    build: .
    ports:
      - "127.0.0.1:8200:8200"      # localhost only; set SECT_ACADEMY_TOKEN before widening this
    environment:
      # SECT_ACADEMY_TOKEN: "choose-a-long-token"
      TZ: UTC
    volumes:
      - academy-data:/data
    restart: unless-stopped

volumes:
  academy-data:
